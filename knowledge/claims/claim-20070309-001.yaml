  subject: 过小级别操作的成本约束
  timeframe: permanent
  statement: 级别越小平均的买卖点间波幅越小，太小的级别不足以让交易成本、交易误差等相对买卖点间波幅足够小，这样的操作从长期角度看没有意义；交易误差包括看见买点到实际操作完成的时间差造成的价位差别，对特小级别要求的精确度不可能长期达到。
  evidence_quote: 此外，级别越小，平均的买卖点间波幅也越小，因此，那些太小的级别，不足以让交易成本、交易误差等相对买卖点间波幅足够小，这样的操作，从长期的角度看，是没有意义的。所谓的交易误差，可以包括很多，例如你看见买点到你实际操作完成，必然有一个时间差，因此也就有了价位上的差别，这对于大级别无所谓，但对特小级别，那就需要特别精确，而这是不可能长期达到的。
  interpretation: 级别下限由成本结构决定：买卖点间波幅必须显著大于交易成本与执行误差之和，否则操作期望值被摩擦成本吞掉。执行时间差是不可消除的误差源，级别选择必须给它留出足够裕度。
