  subject: MACD零轴多空过滤
  topic: 回避所有MACD黄白线在零轴下的市场，跌破自设最低周期即离场
  statement: 最基本的防狼术：MACD指标的0轴分多空主导，黄白线一旦陷入0轴之下，就在对应时间单位的图表下进入空头主导，这是必须远离的；回避所有MACD黄白线在0轴下面的市场或股票。这涉及时间周期，可以按自己的能力决定一个最低的时间周期，例如60分钟图或30分钟图，一旦出现这个最低时间周期的MACD在0轴以下的情况，就彻底离开这个市场，直到重新站住0轴再说。技术高的完全可以在背驰的情况下介入，但那不能给太高的要求，一切都要傻瓜化。
  evidence_quote: 一旦MACD 指标陷入0 轴之下，那么就在对应时间单位的图表下进入空头主导，而这是必须远离的……回避所有MACD 黄白线在0 轴下面的市场或股票，这就是最基本的防狼术……一旦出现自己能力所决定的最低时间周期的MACD0 轴以下情况，就彻底离开这个市场，直到重新站住0 轴再说。
  interpretation: 这是缠论为尚未掌握中枢、级别的学习者给出的最低保命线，用一条指标过滤器替代全部理论；没彻底学会它之前别研究中枢级别。课中5200点到3000点的例证是2008年历史走势，规则本身与具体点位无关。
