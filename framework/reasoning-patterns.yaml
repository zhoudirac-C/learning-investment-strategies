    - 周三A股低开高走放量反弹，沪指重回4100，情绪回暖
    - 创业板权重承接有力、北向资金稳定，主线未放量破位
    merge_suggestion: 宏观风险与产业基本面双线传导至A股策略，属宏观传导链框架
