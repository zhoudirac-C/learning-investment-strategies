  subject: 调整时关注不追高
  timeframe: permanent
  statement: 在缩量加轮动加快的市场里与量化拼手速，再好的机会也容易做成最差的操作。真正的龙头长牛趋势属于持股守趋势者的高抛区间，而非空仓者的追高起点。应多关注调整企稳后的低位机会，少在人尽皆知的新高附近考虑能否追涨。基本面与产业趋势不会每天变化，调整时敢于关注才是认知的变现。
  evidence_quote: 在缩量＋轮动加快的市场里与量化拼手速，再好的机会也容易做成最差的操作——多关注调整企稳后的低位机会，少在人尽皆知的新高附近问"还能不能追"。基本面与产业趋势不会随K线每日波动而变化，调整时敢于关注，才是认知的变现。
  interpretation: 这是一条经典的方法论：好机会不是追出来的，是等出来的。缩量轮动市场比拼的不是选股能力（机会识别）而是耐心（时机把握）。UP强调的逆向思维——人尽皆知时冷静，调整恐慌时关注。量化环境下拼手速是劣势策略。
