  subject: 单次会议概率与长期利率路径须区分
  topic: 长端收益率由多年利率预期与期限溢价构成，推迟一次加息对十年资金成本影响有限
  timeframe: permanent
  statement: 分析美债与全球资产必须区分「下一次会议是否加息」与「未来多年的整体利率路径」：长端收益率包含未来多年短期利率平均预期与期限溢价，即使加息概率明显下降，只要市场对更远期利率的判断没有同步下调，长期收益率就未必同幅回落；量级上把一次25基点加息推迟两个月摊到十年，平均短期利率预期变化只有约0.42个基点。
  evidence_quote: 长期国债收益率并不只反映下一次会议的结果。简化来看，它包含未来多年短期利率的平均预期，以及投资者承担长期持债风险所要求的额外补偿，也就是期限溢价。因此，即使下一次会议的加息概率明显下降，只要市场对更远期利率的判断没有同步下调，长期收益率就未必出现同等幅度的回落。
  interpretation: UP给出的利率分析框架：会议概率是「节奏」变量、期限结构是「水平」变量，两者经常被混为一谈；0.42个基点的量级演示说明单次会议对长期资金成本几乎无感——这是解读「好消息失灵」类行情的工具。
