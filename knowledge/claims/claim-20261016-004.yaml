  subject: 上涨流程五步法
  timeframe: trend
  statement: 一波市场上涨有固定的资金接力顺序：①护盘先把血止住；②机构响应捡便宜把底部买扎实；③震荡后游资进场点火；④短线情绪回暖后杠杆资金进场出现大涨；⑤散户喊牛回速归梭哈、市场加速上涨。
  evidence_quote: 现在也是一样的逻辑，按照上涨流程：1、龙哥护盘先把市场的血先止住; 2、机构响应捡便宜，把底部买扎实; 3、震荡一段时间后，游资进场点火; 4、短线情绪回暖后，杠杆哥进场，出现大涨; 5、散户喊着牛回速归梭哈，市场加速上涨;
  interpretation: 鳄鱼派资金生态位方法论：上涨不是一蹴而就，而是五类资金（护盘/机构/游资/杠杆/散户）按顺序接力的过程。当前处于第①②步（护盘+机构捡便宜），杠杆哥是第④步的关键触发器——融资余额五连跌说明在杀杠杆，大涨要等杠杆哥进场。
