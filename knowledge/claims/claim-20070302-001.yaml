- id: claim-20070302-001-d
  source_path: sources/chanlun/lesson_033.md
  source_date: '2007-03-02'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 级别序列的选取原则
  topic: 级别序列可按等比数列自定义但没有必要，图的精确没有太大实质意义
  timeframe: permanent
  statement: 1分钟、5分钟、30分钟、日线、周线、月线、季线、年线的级别安排只是一个简略的方式，完全可以按照某个等比数列自定义级别序列，例如去掉30分钟换成15分钟和60分钟也可以，但没必要，因为图的精确并没有太大的实质意义，真实的走势并不需要如此精确的观察。
  evidence_quote: 用1 分钟、5 分钟、30 分钟、日线、周线、月线、季线、年线等的级别安排，只是一个简略的方式……你完全可以按照某个等比数列来弄一个级别序列。不过，可以是可以，但没必要。因为，图的精确并没有太大的实质意义，真实的走势并不需要如此精确的观察。
  interpretation: 级别序列是工具而非教条，选取原则是够用即可；过度追求取样精度是舍本逐末，分析的重心应放在中枢结构上，而不是图表刻度本身。
