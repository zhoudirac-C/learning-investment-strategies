  subject: 利用市场陷阱
  topic: 看清陷阱后更进一步，买时空头陷阱是机会，卖时多头陷阱是天堂
  statement: 看清市场陷阱只是第一步，更进一步要学会利用市场陷阱赢钱：当你要买的时候，空头的陷阱就是你的最佳机会；当你要卖的时候，多头的陷阱就是你的天堂。市场永远不缺卖在最低点、买在最高点的人，陷阱型走势正是聪明钱的对手盘来源。
  evidence_quote: 能看清楚自己周围的市场陷阱，还只是第一步，更进一步，要学会利用市场陷阱来赢钱。当你要买的时候，空头的陷阱就是你的最佳机会，当你要卖的时候，多头的陷阱当然就是你的天堂。这市场，永远不缺卖在最低点，买在最高点的人。
  interpretation: 陷阱概念在缠论后文被具体化：第11课湿吻后的空头陷阱、第12课男上位最后一次缠绕后背弛构成的空头陷阱，正是第一买点的核心形态。本课先确立"陷阱=机会而非风险"的反向利用原则。
