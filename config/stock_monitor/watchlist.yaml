  name: 🥇 CCL/覆铜板（独立方向，含上游树脂+CCL本体+M8/M9材料升级）
  chain_relation: → 下游 PCB 制造（沪电/景旺/胜宏）受CCL供给和价格约束。CCL涨价逻辑独立于PCB需求：上游物料（铜箔/玻璃布/树脂）普涨驱动，卖方市场满产满销，订单排至2027。下游PCB受益于NVIDIA Rubin代际升级（Midplane/高多层板），但议价权弱于CCL。两方向共享M8/M9材料升级长期叙事，但短期驱动因素不同。
  up_positioning: 「涨价确定性第一档（与存储同级）」—CCL已4-5轮提价累计涨50%，满产满销卖方市场，客户订单排至2027年底。M6以上高端缺货严重，竞争核心从扩产能转向分子设计+改性工艺+批次一致性+下游认证。上游材料（球硅/PPO）同样涨价×AI需求×国产替代三重交集。
