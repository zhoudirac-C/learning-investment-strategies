  subject: 市场输赢标准
  topic: 市场从来都是明白人挣糊涂人的钱，赢钱是参与市场的唯一标准
  statement: 市场的本质不是老人挣新人的钱，而是明白人挣糊涂人的钱。资本市场中没有慈善家，只有赢家和输家；无论你在其他方面如何成功，到了市场里，赢输就是唯一标准，除此之外都是废话。操作含义：进入市场必须以建立赢钱能力为唯一目标，市场外的身份、资历、成功经历都不能迁移为市场内的优势。
  evidence_quote: 其实，市场从来都是明白人挣糊涂人的钱……特别在资本市场中，没有慈善家，只有赢家和输家。而不会赢钱的经济人，只是废人！无论你在其他方面如何成功，到了市场里，赢输就是唯一标准，除此之外，都是废话。
  interpretation: 缠论开篇心法，为整个体系定调：评价一切市场行为只看盈亏结果。明白人=懂市场规律的人，糊涂人=靠感觉、消息和外部成功经验交易的人。与第3课"任何与赢钱无关的都是废话"一脉相承。
