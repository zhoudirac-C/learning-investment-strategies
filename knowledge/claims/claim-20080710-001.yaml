  subject: 均线系统的强弱分类法
  topic: 按未曾攻克的最小周期均线把所有股票分九类，判别强弱先后
  statement: 除了最简单的笔，任何走势都是大级别套小级别的，因此单纯一条均线的意义不大，必须是均线系统；均线系统的设置一定要根据实际的走势来，要与已有走势相吻合，例如5、13、21、34、55、89、144、233参数构成的均线系统。用这个系统可以给出一个完全的分类去判别走势的强弱与先后：分类的原则是本次反弹（调整则反过来）目前为止未曾攻克的最小周期均线，8条均线分成9类，最差的一类是完全在所有均线之下的。单纯看指数还不是该分类最有用的地方，关键是打横来用，对所有股票按此分类，市场轮动的节奏就一目了然；统计哪条均线上下压制的股票最大量，对大盘该线的压力就有预示意义。
  evidence_quote: 除了最简单的笔，任何走势都是大级别套小级别的，因此，单纯一条均线的意义不大，必须是均线系统。注意了，均线系统的设置，一定要根据实际的走势来……分类的原则是本次反弹目前为止未曾攻克的最小周期均线，因此，8 条均线就可以分成9 类，最差的一类当然就是完全在所有均线下那种……关键我们还可以打横来用，对所有股票按此进行分类，由此市场轮动的节奏就一目了然了。
  interpretation: 分类的单品种用法是判别自身强弱与先后，打横对全部股票用则把市场轮动可视化。课中000802等2008年个股的分类只是当日演示，不构成标的建议。作者还留了一个思考题：最厉害的不一定完全在所有均线之上。
