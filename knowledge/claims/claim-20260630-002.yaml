  subject: 物理AI和机器人处于早期认知阶段
  timeframe: short-term
  statement: 物理AI和机器人目前处在AI应用端承接方向的早期认知阶段，具备产业空间大、资本关注度高、叙事易被理解、尚未形成完全一致定价共识的特征。
  evidence_quote: 物理AI和机器人不同。它们目前还处在“AI应用端承接方向”的早期认知阶段。AI算力、芯片、数据中心这些硬件方向已经充分演绎之后，市场自然会寻找下一个能够承接AI主线的应用出口。而机器人、具身智能、物理AI，正好具备几个特征：产业空间大、资本关注度高、叙事容易被市场理解，同时又还没有形成完全一致的定价共识。
  interpretation: UP认为机器人/物理AI是AI主线从硬件向应用扩散的下一个承接方向，因其处于早期认知而具备预期差。
