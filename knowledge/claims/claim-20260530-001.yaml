  subject: 美股盈利集中度过高，AI是掩盖实体经济风险的遮羞布
  timeframe: short-term
  statement: 标普500一半盈利由7家科技AI巨头创造，五大云计算厂商资本开支达万亿美元级别但自由现金流已转负。多个负面信号被掩盖，AI目前是掩盖实体经济风险的遮羞布，一旦AI投资松动风险会全面暴露
  evidence_quote: "标普500中一半盈利由7家科技AI巨头创造，其余493家分摊另一半。上个季度AI对美国GDP的贡献超过了占GDP70%的消费行业。五大超大规模云计算厂商今年资本开支达到万亿美元级别，自由现金流已经转负。世界大型企业联合会领先指标降到1959年以来最低，消费者对前景不乐观，实体经济底色偏弱，AI目前是掩盖风险的遮羞布，一旦AI投资松动，风险会全面暴露。"
  interpretation: 美股存在三重矛盾：①盈利集中度过高（7家 vs 493家）；②AI资本开支与自由现金流的背离；③实体经济指标（消费者信心、领先指标）与股市表现的背离。全球股票配置中美国占70%、新兴市场仅占12%，一旦AI投资松动或盈利不及预期，美股调整会传导至全球。但当前融资仍可行，Anthropic等头部公司收入半年翻数倍，短期崩盘风险可控。
