  subject: 中枢震荡的力度比较与分笔背驰
  topic: 比较中枢前后两段下跌力度，MACD柱子面积辅助，分笔背驰可引发强力回拉
  statement: 中枢震荡视角下的操作方法：需要比较的是中枢前的下跌段与中枢后的下跌段的力度，可用MACD辅助——1分钟图柱子太杂时选5分钟图，用柱子面积比较两段力度；若中枢后下跌力度不比中枢前大，可断言必有强力回拉。强力回拉不一定需要1分钟级别的背驰，大幅度下跌后一个分笔背驰就足以引发盘中大幅回拉中枢附近；中枢震荡一般有对称性（前段反抽由分笔背驰造成，后段也要留意分笔背驰），虽不是绝对，但足以让人不忽视分笔背驰引发小级别转大级别的极大可能。分笔背驰一般可用1分钟MACD柱子的长度辅助判断。另外，对于一个跌破中枢的下跌，第三类卖点后再来两波就可以随时完美。
  evidence_quote: 用中枢震荡的观点，需要比较的就是1030 前的下跌与1330 点后的下跌……在大幅度下跌后，一个分笔的背驰就足以引发盘中大幅回拉该中枢，特别，由于1030 前下跌引发的反抽也是一个分笔的背驰造成，一般来说，中枢震荡都有对称性，虽然不是绝对，但已经足以让你不会忽视分笔背驰引发小级别转大级别的极大可能。（分笔背驰，一般可以用1 分钟MACD 柱子的长度来辅助）……对于一个跌破中枢的下跌来说，第三类卖点后再来两波就可以随时完美。
  interpretation: 这条给出中枢震荡操作的三件工具：前后段力度比较（MACD面积）、分笔背驰的最小确认单位、震荡对称性的经验规律。作者强调这些分析可以当下给出、不涉预测，但只是方法示范，不鼓励都做超级短线。
