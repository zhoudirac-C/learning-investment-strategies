  subject: 产业定价权决定主线高度：AI炒作的分野
  timeframe: trend
  statement: 港股智谱能走超级主升因在产业链有核心叙事和话语权；A股凌云光(688400)/电广传媒(000917)/九安医疗(002432)炒关联/股权/影子逻辑，无真正定价权故走不成主升。相反日韩上游材料方向有卡脖子能力故有话语权故有定价权，涨价叙事被市场当主线。
  evidence_quote: 同样是炒 AI，差别也在这里。港股智谱能走超级主升，因为它在产业链里有核心叙事和话语权。A 股想通过凌云光、电广传媒、九安医疗这类标的去套利，就很难走成主升。它们炒的是关联、股权、影子逻辑，在那条产业链里没有真正的定价权。相反，日韩上游材料方向更容易被资金认可，因为中国在部分原材料环节具备卡脖子的能力。
  interpretation: AI方向的投资需区分有定价权的主线标的和无定价权的套利标的。后者只能做短线套利不能做趋势持有。日韩上游材料（有卡脖子能力）优于AI影子概念。
