subject: 医疗并购溢价不能外推，国产手术机器人长期看装机与手术量
timeframe: short-term
statement: Surgery Partners隔夜并购溢价不能直接外推为国产手术机器人估值。国产手术机器人长期看装机、手术量、耗材与服务收入爬坡。澳华内镜的ERCP手术机器人处于临床注册推进阶段，公司预计2026年四季度完成注册临床、2027年三季度左右取证，仍有进度不确定性。
evidence_quote: Surgery Partners隔夜涨47.62%，Bon Secours Mercy Health相关机构拟以每股23.50美元现金收购，较前一交易日收盘溢价约49%，仍待交割条件满足。公司为门诊手术设施与服务运营商，其并购溢价不能直接外推为国产手术机器人估值。澳华内镜、百迈科：国产手术机器人长期看装机、手术量、耗材与服务收入爬坡。澳华内镜的ERCP手术机器人处于临床注册推进阶段，公司预计2026年四季度完成注册临床、2027年三季度左右取证，仍有进度不确定性。
interpretation: UP反对将美股Surgery Partners的并购溢价直接外推为国产手术机器人估值，主张国产手术机器人长期看装机、手术量、耗材与服务收入爬坡，并指出澳华内镜ERCP注册临床与取证仍有进度不确定性。
