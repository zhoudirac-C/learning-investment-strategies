  timeframe: short-term
  statement: UP对当前市场的选手操作建议分两层：①梦想选手（主动交易型）——继续努力，做先手+精选配置；②躺平选手（被动配置型）——做好配置，持有优质品种等待修复。
  evidence_quote: 梦想选手继续努力，躺平选手做好配置。
  interpretation: 两点操作分层对应不同风险偏好和交易能力：①梦想选手需要更主动地做先手、抓结构机会；②躺平选手不需要频繁交易，核心是"做好配置"——选对品种、控制仓位、耐心持有。UP同时认可两种策略，没有优劣之分。
