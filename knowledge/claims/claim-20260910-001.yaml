  timeframe: short-term
  statement: 周三三大指数涨跌不一（沪指+0.28%、创业板指-0.14%），下跌家数明显多于上涨家数，指数稳定尚未转化为普遍赚钱效应。量能上近期高开回落、盘中修复的反复更适按存量资金轮动理解：缩量回落说明抛压未扩张但主动进攻资金不足；今天若继续窄幅整理、回落不放量，震荡判断延续；若放量下行则需重新评估调整性质。大金融方面重点观察银行保险券商与科技的配合：权重稳+科技有持续承接，修复才易扩散到个股；仅权重托指数、题材回落则控制操作频率。情绪观察重点是高开后承接、新方向持续性、高位核心能否止跌；放量只是变化的开始，量能能否推动价格持续向上才是进攻意愿的确认。
  evidence_quote: 放量只是变化的开始，量能能否推动价格持续向上，才是进攻意愿的确认。……若仅靠权重托住指数，题材持续回落，盘中操作仍需控制频率。
  interpretation: 指数观察三要素框架：量能（缩量震荡vs放量重估的分界）、大金融与科技配合（修复扩散条件）、情绪（高位核心止跌+放量有效性）。'放量只是变化的开始'区分了放量信号与进攻确认两步，防止把单次放量当趋势启动。
