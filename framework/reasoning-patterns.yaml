    name: 隔夜宏观与AI双线对冲定调法
    source_raw:
    - sources/raw/财经/早盘：26-04-30：节前收官，宏观风险与AI基本面极致对冲，持股过节不追高.md
    key_themes:
    - 海外宏观风险传导
    - AI产业链景气映射
    - 节前/长假的流动性应对
