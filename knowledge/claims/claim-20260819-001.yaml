  subject: 实际利率假设未验证风险资产向高资本成本靠拢
  timeframe: trend
  statement: 周二讲的是坏数据的故事：7月新屋开工环比暴跌12.4%、成屋待完成销售下降2.3%至今年1月以来最低。正常逻辑应该是经济弱、加息预期下降、美债收益率跌、科技股涨、黄金涨——美债确实买回来了，但纳指依然跌1.33%、黄金也没守住。现在很多资产的上涨都建立在同一个尚未被证明的假设上：实际利率最终会下降；而当下发生的不是实际利率立刻大幅下行去验证高估值，而是风险资产需要先向更高的长期资本成本靠拢一点。
  evidence_quote: 现在很多资产的上涨都建立在同一个尚未被证明的假设上——实际利率最终会下降；而当下发生的不是实际利率立刻大幅下行去验证高估值，而是风险资产需要先向更高的长期资本成本靠拢一点。
  interpretation: 宏观核心判断：市场上涨建立在'实际利率终将下降'的未验证假设上；坏数据没有立刻验证该假设，风险资产（尤其高估值科技）先向更高的长期资本成本靠拢。这解释了'坏数据救债不救股'的背离。
