  subject: 感光干膜、镁合金、洗碗机、东南亚两轮车等新研报方向梳理
  timeframe: trend
  statement: 研报核心方向：①感光干膜——AI算力向PCB上游耗材传导，国产替代空间超70%，核心福斯特/容大感光；②镁合金——半固态注射成型降本34%，三重新兴需求（AIPC散热/电动自行车/人形机器人），核心伊之密/宝武镁业/星源卓镁；③洗碗机——内需承压外需强劲，出口占比77%，核心老板电器/海尔智家；④东南亚两轮车——越南7月禁燃令，2.1亿油摩电动化，核心雅迪/爱玛/安乃达
  evidence_quote: AI算力向PCB上游耗材传导。24年全球市场80.3亿元、中国52.1亿元，29年有望达110.9亿/74.8亿元...半固态注射成型综合降本34%，镁对铝成本优势全面确立...「内需承压，外需强劲」。26Q1产量303.8万台...美伊战争后油价高企+越南河内7月禁燃令，2.1亿油摩存量市场电动化加速。
  interpretation: 研报方向梳理：①感光干膜——PCB上游耗材，HDI/IC载板用增速快于传统多层板，国产替代空间超70%；②镁合金——AIPC散热（渗透率26年35%→28年79.7%）、电动自行车新国标、人形机器人量产三重驱动；③洗碗机——出口占比77%，欧洲最大拉动市场；④东南亚两轮车——越南禁燃令催化，2.1亿油摩存量电动化，雅迪/爱玛PE仅9倍；⑤这些方向属于「产业认知更新」，不是立即买入信号，需跟踪订单/业绩验证。这是对多个新方向的系统性梳理。
