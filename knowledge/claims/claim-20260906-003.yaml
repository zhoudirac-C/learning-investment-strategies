  claim_type: market-cycle
  subject: AI浪潮结合互联网与新能源二者特点
  timeframe: industry
  statement: 这波AI浪潮既不像互联网也不像新能源，但结合二者特点：像互联网之处在于作为基础设施要投资（铲子股先涨）、要嵌入各行各业再反向造就更大繁荣；不像互联网之处在于投资规模更大、上游业绩非常猛、股票潜在涨幅大；像新能源之处在于有业绩的及时反馈；比新能源强在业绩显然没有见顶、没到内卷程度，且AI周期比新能源更长。不能刻舟求剑单套互联网或新能源框架，要具体问题具体分析。
  evidence_quote: 感悟就是，嗯我觉得这波AI浪潮它既不像互联网啊也不像这个，也不像新能源啊，但是它又结合了二者的特点……所以说我觉得结合这两个，我们不能刻舟求剑，就是说你你要么就看互联网，要么就看新能源，我觉得都不对，而是应该是具体问题具体分析，实事求是地去分析。
  interpretation: 给AI行情选历史参照系的框架：波动特征像互联网、业绩反馈像新能源、周期长度超新能源——三段类比各取一部分。
