  subject: 外部三风险叠加：美股科技回调与KOSPI熔断与美联储偏鹰，持仓松动兑现收益
  timeframe: intraday
  statement: 今日科技大跌的三大外部诱因：①隔夜美股科技回调（谷歌员工离职引发核心人才脆断担忧、Token降价冲击商业模式）；②KOSPI午后暴跌超8%触发熔断，恐慌情绪传导至国内，前期一致持仓松动；③美联储6月议息偏鹰，市场定价年内不降息且10月加息25bp，强美元压制非AI周期板块。
  evidence_quote: 1.隔夜美股科技回调……谷歌两位重要员工离职……市场担心的不止谷歌本身，而是当核心员工从A跳到B，建立在少数核心人才上的竞争力，其脆弱性可能比预想的更高。2.海外恐慌传导，前期一致持仓松动……特别是经历周一放量大涨后，投资者短期有兑现收益的诉求。3.美联储6月议息偏鹰……市场目前正预期并定价年内不降息、且在10月加息25个基点。
  interpretation: UP系统梳理了三个外部风险：①美股科技回调有结构性原因（核心人才流动+商业模式担忧），不仅是短期波动；②KOSPI熔断效应实质是持仓松动催化剂，不是根因；③美联储偏鹰延续了"不降息+强美元"压制，对非AI板块影响更大。三枚炮弹叠加造成了今日的科技大跌。
