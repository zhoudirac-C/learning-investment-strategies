  subject: 看跌吞没条件体系
  timeframe: permanent
  statement: 看跌吞没（Bearish Engulfing）出现在上涨末端，与看涨吞没对称。基础4条（必须满足）：①前期至少5个交易日上涨；②第一根为阳线；③第二根为阴线；④第二根阴线实体完全包裹第一根阳线实体。加分条件与看涨吞没相同（包裹影线、阴线实体远大于阳线、放量>1.5倍、压力位），额外加分项：若前一根阳线本身就是流星线/上吊线等顶部反转K线，信号强度进一步提升。
  evidence_quote: 看跌吞没出现在上涨末端：头一天是阳线，第二天是阴线，阴线实体完全包住阳线实体，是明确的看空信号。在和看涨吞没相同的加分条件基础上，额外增加一个加分项：若前一根阳线本身就是流星线、上吊线等顶部反转K线，信号强度会进一步提升。
  interpretation: 看跌吞没的额外加分项说明：单一顶部信号的组合使用可增效。如果前一天已经出现了流星线/上吊线的顶部引线形态，第二天被大阴线实体包裹，相当于两个信号共振，空头力量更强。
