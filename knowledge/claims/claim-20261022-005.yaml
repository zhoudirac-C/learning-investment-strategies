  claim_type: sector-theme
  subject: 算力行业真景气但连续亏损和超高估值别凑热闹
  timeframe: industry
  statement: 国家数据集团成立对东数西算形成闭环，好几家算力公司发了超大金额订单，行业实打实产生景气度；但提醒：连续亏损或估值超高的不要去凑热闹——算力是重资产，很多公司奔着一年回本的口号冲进云计算，随着大模型迭代和算法升级，很可能还没开始运营就要清算；梁文锋说过没有人能在这个行业赚到暴利，这是公共事业一般的行业，算力会如水电气一般流转。
  evidence_quote: 今天市场的重心一定程度上是由算力中心带来的，国家数据集团成立了，这对早些年提出的东数西算一定程度上形成了闭环，好几家做算力的公司最近也发了超大金额的订单，说明这个行业是实打实的产生了景气度，不过我在这里还是要给诸位提个醒，那些连续亏损，或者估值超高的，就不要去凑热闹了，搞算力生意可是重资产，很多公司奔着一年回本的口号冲进云计算，随着现在大模型的迭代和算法的升级，很有可能还没开始运营就要清算了。梁文锋说的是没有人能在这个行业赚到暴利的，这是公共事业一般的行业，算力会如水电气一般流转。
  interpretation: 鳄鱼派对算力方向的『景气确认+选股纪律』双重表态：行业景气是真的（数据集团成立+大额订单），但商业模式是公共事业型（重资产、低毛利、如水电气）——所以参与只能选有真实盈利能力的标的，连续亏损/超高估值的纯概念股在算法快速迭代下可能没运营就清算。
