  subject: 大资金的多重赋格式操作
  topic: 大资金分N重级别操作，每重对应独立资金筹码与节奏
  statement: 对大资金，级别操作可以一直延伸成 N 重层次的操作，每一重对应一定的资金与筹码、对应不同的节奏与波动，如同赋格曲中简单旋律在 N 个层次上按转位、移位、对位等原则运动合成统一的乐曲。在同级别分解的多重赋格操作中，可以在任何级别上进行操作且都遵守该级别的分解节奏与波动，只是在不同级别中投入的筹码与资金不同；每一层次的操作既是独立的，又在一个整体的操作之中。
  evidence_quote: 对于大资金来说，这种级别的操作可以一直延伸下去，可以变成N 重层次的操作，每一重都对应着一定的资金与筹码，而相应对应着不同的节奏与波动……市场的走势，其实就是这样的多重赋格，看似复杂，其实脉络清晰，可以有机地统一在多层次的同级别分解操作中……在这种同级别分解的多重赋格操作中，可以在任何级别上进行操作，而且都遵守该级别的分解节奏与波动，只是在不同级别中投入的筹码与资金不同而已。
  interpretation: 这是缠论的资金管理维度：单级别机械操作是单机，多级别分层仓位是集群，同一走势在不同级别同时提供不同节奏的买卖点，分层资金各取所需。与第38课按资金量分区按不同级别分解操作的"分区卷钱机械"一脉相承。
