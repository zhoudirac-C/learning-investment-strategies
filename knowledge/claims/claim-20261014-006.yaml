  subject: 价格确认比是否出现背离更重要
  timeframe: permanent
  statement: 课程的历史样本显示，单独底背离并未比无背离新低提供明显优势；等到‘金叉＋收盘站回前高’后，有背离组和无背离组的守住低点比例都提高，且无背离组更高。因此真正应优先提取的是价格确认规则，而不是把背离当作必要且充分的抄底信号。
  evidence_quote: 出现底背离（19 次）：7 次，37%；没有背离的新低（37 次）：13 次，35%。等到‘金叉＋收盘站回前高’：有背离（13 次）9 次，69%；无背离（15 次）13 次，87%。背离只是线索，价格确认才是关键。
  interpretation: 同一套确认规则在两类样本中都改善结果，说明不能把改善全部归功于背离；同时样本量有限，只能支持方法边界，不能外推成固定未来胜率。
