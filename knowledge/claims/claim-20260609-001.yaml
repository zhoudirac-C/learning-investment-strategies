  subject: 底部信号——90分钟序列低9 + 趋势买点
  timeframe: short-term
  statement: 前一交易日90分钟序列出现低9，当日日线序列为低9。今明两日若仍有下跌，短期见底概率较大。但由于底部钝化消失，见底后反弹的时间和持续性都不易判断。下一次买点以趋势为准：突破4120点才确认重回上升趋势，届时才可判断上涨具备持续性。在此之前以观望与纪律为主。已持仓者不宜再杀跌。
  evidence_quote: 前一交易日90分钟序列出现低9，当日日线序列为低9。今明两日若仍有下跌，短期市场见底的概率较大。上周五尾盘与本周一早盘未处理持仓的，当日不宜再杀跌。下一次买点仍以趋势为准：突破4120点。
  interpretation: |
    UP给出两层技术信号：
    ①短期见底信号：90分钟+日线双低9序列，今明若再跌则短期见底概率大
    ②趋势买点未到：底部钝化消失=反弹强弱不明，需等突破4120趋势确认
    
    实操含义：不杀跌（卖了可能卖在地板上）、不抄底（底部钝化消失不确定性大）、等4120突破才能加仓。
