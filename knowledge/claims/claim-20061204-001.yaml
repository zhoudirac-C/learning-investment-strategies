- id: claim-20061204-001-b
  source_path: sources/chanlun/lesson_013.md
  source_date: '2006-12-04'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 买入程序的防护退出
  topic: 任何介入都要加入主动防护，买入依据被破坏时无条件退出
  statement: 任何介入都有一个主动的防护加入其中：一旦走势变为不能搞，就立刻从买入程序中退出，这个防护的启动和任何盈亏无关，只和当下的走势有关。两个具体退出条件：第一类买点买入后，上涨时依然出现男上位的缠绕，说明前面引导买入的缠绕并非最后一个缠绕、程序判断出现问题，必须退出；第二类买点买入后，一旦该缠绕中跌破前面男上位的最低位，意味着买入程序出现问题，必须在任何一个反弹中把股票出清。退出后走势重新走好不影响纪律，真正的机会并不会丢失，出现特殊情况一定要先退出来，这是投资生涯能长期存活的最重要一点。
  evidence_quote: 任何的介入，都有一个主动的防护加入其中，这个防护就是从一旦变为不能搞，就立刻从买入程序中此退出，这个防护的启动是和任何盈亏无关的，只和当下的走势有关……对于第一个买点，一旦上涨时依然出现男上位的缠绕，那么一定要退出……一旦该缠绕中出现跌破前面男上位的最低位，就意味着买入程序出现问题，必须在任何一个反弹中把股票出清……任何操作，没有百分百准确的，一旦出现特殊情况，一定要先退出来，这是在投资生涯中能长期存活的最重要一点。
  interpretation: 防护是买入程序的组成部分而非临时情绪反应，每个买点都预先绑定了证伪条件：一买的证伪条件是男上位缠绕再现，二买的证伪条件是跌破前男上位最低位。一般情况下这种退出是赢利的，但这不能成为不退出的理由，也不能因退出后可能再涨而心存侥幸。
