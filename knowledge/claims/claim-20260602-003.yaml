- id: claim-20260602-003-b
  topic: 共振修复后通常走向两种格局
  source_path: sources/raw/财经/复盘：26-06-02：共振修复，AI硬件普涨，情绪拐点确认.md
  source_date: 2026-06-02
  source_type: 复盘
  extracted_at: 2026-06-02
  claim_type: market-cycle
  subject: 今日属于「普涨共振」而非「强共振」，宽度有但高度不足，反弹预期需降低
  timeframe: short-term
  statement: 共振修复后通常走向两种格局：强共振（有明显主线分支和情绪载体）或普涨共振（有AI科技主线但没有可预期情绪载体）。今日属于第二种——MLCC、CPO、PCB等全线上涨，但无绝对聚焦分支，是普涨修复。宽度有但高度不足
  evidence_quote: 今天属于第二种。MLCC、CPO、PCB等全线上涨，但并没有绝对聚焦于某一个分支，是普涨修复。宽度有了，但没有明显能带情绪的高度。
  interpretation: 共振格局辨析：①强共振 vs 普涨共振——这是博主对修复行情分类的重要框架；②今日属于「普涨共振」：MLCC/CPO/PCB全线上涨，但无绝对聚焦分支；③宽度有（多个分支上涨）但高度不足（无明确情绪载体）——这是判断反弹预期的关键；④情绪载体候选：火炬电子（4天3板但下午频繁开板，连板拓高度有难度）、亨通光电（涨停创历史新高但光纤产业无大变化）——两者都有瑕疵；⑤核心结论：普涨轮动阶段，反弹预期要降低一点。这是对今日行情定性的核心判断。
