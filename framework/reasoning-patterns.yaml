    - step: 2
      name: 定位题材角色
      question: 题材处于主线、缩容、补涨还是新方向？
      UP_logic: 按板块效应强度和催化持续性定位：板块效应减弱则从板块行情转个股行情；新题材关联主线则定位为补涨。
      evidence_sources:
      - 商业航天后续板块效应减弱
      - 脑机接口暂定位为商业航天补涨
    - step: 3
      name: 历史对标验证
      question: 补涨方向能否被资金模仿与延续？
      UP_logic: 用历史相似补涨板块对标，结合大票赚钱效应判断：若大票效应显著，则补涨或被模仿；海南自贸是前车之鉴。
      evidence_sources:
      - 海南自贸12月22日大涨/24日独苗
      - 中国卫星、蓝色光标大票赚钱效应
    - step: 4
      name: 预期差判断买点
      question: 新题材一致性过强还是存在预期差？
      UP_logic: 低预期下超预期才有持续力；一致性形成过快则警惕顶一字；用主动走弱后再走强或强上加强走势确认。
      evidence_sources:
      - 创新医疗长上影
      - 超级水电站走势
    - step: 5
      name: 按催化与资金选方向
      question: 轮动中优先布局哪些子方向？
      UP_logic: 选择有持续催化、资金回流偏好、回调充分且容量充足的方向；商业航天看催化，固态看国标与上车测试。
      evidence_sources:
