  - sources/raw/财经/视频：26-05-29：牛市多急跌，机构市回调规律与6月题材窗口.md
  applicable_themes:
  - AI硬件
  - AI算力
  - PCB
  - 业绩暴雷识别
  - 业绩避雷
  - 业绩验证
