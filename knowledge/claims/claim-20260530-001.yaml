  subject: 全球K型分化的三股核心力量
  timeframe: trend
  statement: 当前全球经济最显著特征是K型分化，由AI、保护主义、地缘政治三股方向不同的力量共同塑造，奖励有准备的头部主体，惩罚被动依赖外部的主体
  evidence_quote: "当前全球宏观经济与资本市场最显著的特征是K型分化，无法用单一好坏概括整体经济，需要从国家、行业、企业、个体多个维度分层观察。K型分化由三股方向不同的力量共同塑造：人工智能——重塑生产率，红利分配极度不均；保护主义——产业政策抬头，效率与安全的权衡；地缘政治——从偶发事件变为新常态，冲击大宗商品可及性。"
  interpretation: K型分化不是宏观概念而是渗透到所有层面的现实。三股力量共同规律是奖励有准备的头部主体（AI准备充分国、战略物资供给国、产业链自主国），惩罚被动依赖外部的主体（低准备度新兴市场、冲突卷入国、战略物资进口国）。传统的整体分析方法已经失效，必须分层看待机会与风险。
