  subject: 吻的产生机制与转折
  topic: 飞吻唇吻湿吻基于对原趋势的反抗程度，一切转折基本从湿吻开始
  statement: 吻的产生机制：如果走势连短期均线都不能突破，其间高低点只是低级别图表上的，在本级别没有意义；走势突破短期均线却不能突破长期均线，形成飞吻；突破长期均线马上形成陷阱，形成唇吻；突破长期均线出现一定的反复，形成湿吻。吻的分类基于对原趋势的反抗程度：飞吻基本没有任何反抗力，唇吻力度一般，湿吻意味着力度有了足够强度，而一切的转折，基本都是从湿吻开始的。转折一般只有两种：一、湿吻后继续原趋势形成陷阱后回头制造出转折；二、出现盘整，以时间换空间地形成转折。第一种情况最大的标志就是背驰。
  evidence_quote: “吻”的分类是基于对原趋势的反抗程度，“飞吻”是基本没有任何反抗力，“唇吻”的力度也一般，而“湿吻”，就意味着力度有了足够的强度，而一切的转折，基本都是从“湿吻”开始的……转折，一般只有两种：一、“湿吻”后继续原趋势形成陷阱后回头制造出转折；二、出现盘整，以时间换空间地形成转折。
  interpretation: 给出三吻的成因解释而非仅形态定义，把吻的级别意义与原趋势反抗力度挂钩。操作含义：本级别操作只需关注湿吻后的背驰信号，飞吻唇吻不构成转折基础。
