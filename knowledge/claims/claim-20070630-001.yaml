  subject: 顶分型与底分型定义
  topic: 相邻三K线中第二根高点双最高为顶分型，低点双最低为底分型
  statement: 不分阳线阴线，只看K线高低点：第二根K线高点是相邻三根K线高点中最高的、低点也是相邻三根K线低点中最高的，叫顶分型；第二根K线低点是相邻三根K线低点中最低的、高点也是相邻三根K线高点中最低的，叫底分型。顶分型的最高点叫该分型的顶，底分型的最低点叫该分型的底，以后说顶和底就分别指顶分型的顶和底分型的底。该定义适合任何周期的K线图。
  evidence_quote: 像图1 这种，第二K 线高点是相邻三K 线高点中最高的，而低点也是相邻三K 线低点中最高的，本ID给一个定义叫顶分型；图2 这种叫底分型，第二K 线低点是相邻三K 线低点中最低的，而高点也是相邻三K 线高点中最低的……顶分型的最高点叫该分型的顶，底分型的最低点叫该分型的底……也就是说，当我们以后说顶和底时，就分别是说顶分型的顶和底分型的底。
  interpretation: 分型是缠论形态学的最小原子，笔、线段、中枢都由它递归构成。注意定义的双条件：顶分型要求第二根K线高点最高且低点也最高，缺一条都不成立。识别分型前须先完成K线包含关系处理。
