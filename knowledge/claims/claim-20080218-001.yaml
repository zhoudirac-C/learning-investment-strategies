  subject: 中阴状态的操作处理
  topic: 中阴反映走势生长的未确定性，操作上按中枢震荡处理即可
  statement: 走势结构最重要的是有中阴部分的存在，它客观反映行情走势生长阶段的未确定性，世界更多是量子化、测不准的，中阴的存在恰好反映走势的这种特性。这种未确定性不会对操作有任何影响，因为中阴状态都可以看成是一个中枢震荡的整理，根据中枢震荡的操作就可以了。一碰到中阴状态就晕、不能对走势给出明确的一般性划分，是常见情况，理论必须包括这些情况。
  evidence_quote: 中阴状态的存在，反映了行情走势生长阶段的未确定性，这种未确定性，不会对操作有任何的影响，因为中阴状态都可以看成是一个中枢震荡的整理，根据中枢震荡的操作就可以了。
  interpretation: 中阴是走势类型转换的过渡态，新走势类型尚未确立。这一条把不可测的过渡阶段还原为可操作的中枢震荡，消解了划分不确定带来的操作瘫痪；它不是理论不完善的补丁，而是对走势本性的客观反映。
