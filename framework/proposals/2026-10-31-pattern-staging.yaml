  - pattern_id: strong_trend_entry_mode
    name: 追高、低吸与滚动的模式选择框架
    description: 当决定参与一个强趋势标的时，先回答「用哪种方式参与」——追高买的是强者恒强的延续，低吸买的是止跌修复，滚动只在震荡期成立。选错模式的代价是把修复交易拖成新主升，或用短线分时打断中线逻辑。本框架输出参与模式与对应失效条件，不输出标的推荐。
    trigger:
      - 准备参与强趋势标的，需要决定追高、回踩低吸还是等震荡期滚动
      - 持仓未按原模式演绎，需要区分「模式失败」与「长期判断失败」
      - 出现仅以「跌得多会反弹」为依据的候选买点
    data_requirements:
      - name: 个股日K与分时
        channel: 日K线（infra/data/kline_cache.db）与分时行情
      - name: 板块强弱
        channel: THS 板块指数日K与板块内个股相对强弱
      - name: 量能
        channel: VOL 日序列与 5/10/20 日均量基准
    steps:
      - step: 1
        name: 定性参与模式
        question: 这笔交易是追高、低吸还是滚动？
        action: 买入前冻结模式、成本、容错、反馈速度与失效条件；模式必须与买点位置一致，不做事后改口
        data:
          - 个股日K与分时
      - step: 2
        name: 追高五查
        question: 追高的五个前提是否同时成立？
        action: 检查环境配合、板块合力、个股辨识度、超预期催化、连阳预期；任一缺失即降级为低吸或不参与
        data:
          - 板块强弱
          - 个股日K与分时
      - step: 3
        name: 低吸前提与五维过滤
        question: 低吸的两前提是否成立？买点质量够不够？
        action: 前提是已有趋势且尚未失败（边界破坏即停止）；再过滤支撑位（新逻辑/新催化/板块共振/有效突破/明确止跌）、收益是否覆盖失败路径、是否板块核心、新趋势还是老票修复、检验位是否清晰
        data:
          - 个股日K与分时
          - 板块强弱
      - step: 4
        name: 滚动仅限震荡期
        question: 现在是主升还是震荡？
        action: 主升期不滚动；强趋势转震荡后才用大部分仓锁定结果、小部分仓观察并等重新转强
        data:
          - 个股日K与分时
    falsification:
      - 追高后持续连阳、突破有效且板块共振延续，原模式继续有效
      - 低吸后支撑有效、承接增强并恢复趋势结构，失败预警撤销
      - 模式失败后最终解套，不能倒推原交易正确，也不得自动改成中线
      - 仅以跌幅大、跌幅久作为买点依据，一律视为不合格买点
    validation:
      historical_hit_rate: pending-m1
      applicable_regime: null
      known_failures:
        - 五维过滤的机会成本对比未量化，只能定性执行
    matched_framework: operation_strategy
    applicable_themes:
      - 追高
      - 低吸
      - 滚动
      - 买点质量
      - 强趋势
    source_raw:
