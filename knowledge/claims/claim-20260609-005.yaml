  subject: AI算力国产替代——80%本土供应目标
  statement: 该计划明确要求至少80%技术来自本土供应商（华为等），直接排挤英伟达(NVDA)和AMD(AMD)。这是对AI芯片国产替代路线的国家级背书，华为昇腾产业链将成为最大受益方。相关A股标的：拓维信息(002261,昇腾服务器合作伙伴)、神州数码(000034,华为算力分销商)。
  evidence_quote: 依靠华为技术有限公司等本土供应商提供至少80%的技术，如人工智能芯片，从而有效排挤英伟达公司。以及先进微设备公司。
  interpretation: 80%本土供应是硬性指标——这不仅是产业趋势，更是政策指令。受益产业链：①华为昇腾芯片（直接受益）→ ②算力服务器组装（如拓维信息(002261)/神州数码(000034)等昇腾合作伙伴，均为深主板可交易）→
    ③配套（光模块/液冷/电源）。但区分短期和中长期：政策框架到实际执行有1-2年滞后，短期更多是主题催化而非业绩兑现。已有华为算力概念的标的面临的是估值提升逻辑，而非当期业绩。
