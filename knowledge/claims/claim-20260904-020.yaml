statement: 罗博特科(300757)硅光测试设备是CPO从估值过高走向可验证的少数环节之一：前25年累计销售约2000台设备、预计未来1至1.5年出货1000台，去年至今接单约24亿元，双面晶圆测试机专为台积电CoWoS设计；但属海外链且体量小，短线受量能约束，中线看订单转收入节奏。
evidence_quote: 公司前25年累计销售约2000台设备，预计未来1至1.5年将出货1000台；测试分四层——晶圆级测试、双面晶圆测试（堆叠测试）、光引擎测试、系统级验证测试……双面晶圆测试机专为台积电CoWoS工艺设计，已开始与泰瑞达、Advantest进行工厂级集成与兼容……据纪要，罗博特科从去年到今年接单约24亿元，对比去年半年收入仅小几亿，今明两年业绩支撑性强。个人判断，硅光测试设备是CPO从「估值过高、兑现时点不确定」走向可验证的少数环节之一，但它同样属于海外链、且体量小，短线仍受量能约束，中线看订单转收入的节奏。
interpretation: 罗博特科作为唯一出席台湾硅光联盟大会的上市公司，订单(24亿)与出货指引(1-1.5年1000台)构成中期业绩支撑。定位：CPO可验证环节，但海外链+小体量决定短线弹性受限，中线跟踪订单转收入。
