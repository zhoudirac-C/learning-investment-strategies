timeframe: temporary
statement: 机器人为当前反弹主线候选：首板增多说明试错资金增加，炸板率约50%、10cm赛福天/多伦科技承接偏弱、20cm首板接力意愿不足，说明接力和细分领导力尚未恢复。
evidence_quote: 机器人看细分领涨与分歧后的活口。第一波反弹暂按轮动超跌处理。机器人下跌时间较长，目前成为领涨方向，宇树科技的带动使板块重新扩散，首板增多也显示资金在尝试形成主线。但10cm方向的赛福天、多伦科技承接偏弱，20cm首板接力意愿不足，午后批量炸板，相关统计口径下炸板率约50%。
interpretation: UP 对机器人板块的判断区分了“首板增多（资金试错）”与“接力和细分领导力恢复（有效主线确认）”两个层次，并明确炸板率约50%意味着主线尚未完全确认，需要继续观察核心承接和细分领导力。
