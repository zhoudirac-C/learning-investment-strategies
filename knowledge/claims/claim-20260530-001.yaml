  subject: 美联储截尾平均PCE为降息铺台阶，下半年流动性拐点概率高
  timeframe: short-term
  statement: 沃勒提出的截尾平均PCE通胀计算法，技术上将3.8%的通胀调整到美联储2%的目标位，为降息铺好了台阶。预计下半年市场先经历不确定性带来的波动，之后迎来流动性拐点，美债收益率会在下半年某个时点见顶回落
  evidence_quote: "沃勒主张的降息+缩表组合并不矛盾：缩表是让美联储退出越界的结构性操作，回归本源；降息才是针对货币政策本身，该组合是平衡操作。沃勒提出截尾平均PCE通胀计算法，技术上将3.8%的通胀调整到美联储2%的目标位，为未来降息铺好了台阶。预计下半年市场先经历不确定性带来的波动，之后迎来流动性拐点，美债收益率会在下半年某个时点见顶回落。"
  interpretation: 截尾平均PCE是统计口径上的技术调整，直接打破"通胀高企不会降息"的市场共识。下半年流动性拐点的概率远高于市场预期，这将缓解人民币贬值压力、给中国央行腾出降准降息空间。但需警惕的是，美联储内部分歧在扩大，12月三张反对票是历史罕见信号。
