  subject: 刺透与乌云的五个必要条件
  timeframe: permanent
  statement: 两类形态共享五个必要条件：①前期已有明确趋势且至少延续5个交易日（刺透=下跌、乌云=上涨）；②两根K线颜色匹配（阴后阳 / 阳后阴）；③第二根开盘跳空方向正确（低于第一根最低价 / 高于第一根最高价）；④刺入或覆盖实体50%以上；⑤没有完全反超——一旦完全反超即升级为吞没。
  evidence_quote: 首先就是说，它前期已经有过一段明确的趋势，刺透呢就说明你前期至少有五五个交易日的下跌，那么乌云盖顶呢，你前期也至少要有五个交易日的上涨。其次呢，就是颜色要匹配……条件五就是没有完全反超……如果超过，那就是吞没了。
  interpretation: 五条是硬门槛，缺一条就不成立；其中第5条决定形态归类（刺透 vs 吞没），不是否决条件而是路由条件。
