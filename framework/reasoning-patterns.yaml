  description: 当用户询问AI技术突破、新产品发布、大模型迭代、算力需求爆发对产业链各环节（算力芯片、PCB、光通信、液冷、电源、数据中心、应用等）的传导机会与标的映射时使用。区别于一般上游周期分析，核心关注技术事件驱动的产业链受益顺序。典型查询：AI产业链机会、Rubin影响、算力扩散到哪里、大模型利好谁、AI应用能不能买。该框架识别技术突破、拆解产业链影响路径、验证需求真实性、映射投资标的。
  trigger:
