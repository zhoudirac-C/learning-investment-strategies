  subject: 量化标准-突破4010加至六成-突破4055加至满仓
  timeframe: intraday
  statement: 当前量化标准：突破4010加至六成仓，突破4055加至满仓。在此之前维持三至五成试错仓位。后续随震荡时间推移会下调点位——指数在同一区域震荡越久，横盘消化越充分，突破需要的绝对位置就越低。点位是死的，位置的意义是活的。
  evidence_quote: 当前标准：突破4010，加至六成仓；突破4055，加至满仓。在此之前，维持三至五成的试错仓位。后续会随着时间的推移下调点位。这里的逻辑是：时间本身也是成本，指数在同一区域震荡越久，横盘消化的筹码越充分，突破所需要的绝对位置就应当越低。点位是死的，位置的意义是活的——同样是4010，震荡五天之后的4010和今天的4010，含义并不相同。
  interpretation: UP给出了明确的量化加仓标准——两个关键点位4010（六成）/4055（满仓）和时间衰减机制。核心逻辑是横盘越久突破所需点位越低，这是动态风险管理的思路。注意这是上证指数的点位，不是持仓个股的价格。
