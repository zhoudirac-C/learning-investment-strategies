  subject: 机构股草木皆兵，风格向更小市值更小成交额靠拢
  timeframe: short-term
  statement: 机构股近期草木皆兵，怀疑种子一旦种下关系即生裂痕。日韩股市大涨背景下A股存储股却不涨反跌，传导链条已钝化。一旦风格切换延续，题材炒作/非机构股或成最大受益者，风格理论上会向更小市值、更小成交额靠拢
  evidence_quote: 机构股近期草木皆兵：小到东山精密因小作文跌停，大到公募调基准/调仓，实质影响小于盘面反应，但怀疑种子一旦种下关系即生裂痕。这也解释了日韩股市大涨背景下A股存储股却不涨反跌——韩国股市-三星-存储传导链条已钝化。一旦风格切换延续，题材炒作/非机构股或成最大受益者；指数若就此缩量，风格理论上会向更小市值、更小成交额靠拢。
  interpretation: 风格切换判断：①机构股信任危机：小作文+调仓→实质影响小但心理影响大；②日韩-A股存储传导钝化——说明A股存储股已脱离海外映射，走独立逻辑（或独立下跌）；③风格切换方向：题材炒作/非机构股受益→更小市值、更小成交额——这是博主对6月初风格演化的核心预判；④与昨日复盘"市场处于新旧势力交替的混沌轮动中"形成呼应。操作层面：关注小市值题材，规避机构重仓的大市值标的。
