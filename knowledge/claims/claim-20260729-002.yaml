  statement: 避险行情三件套：老妖股、次新股、可转债。上周行情体现在利通电子(603629)等老妖股，本周体现为次新股。可转债每天也都有行情。
  evidence_quote: 问托伦斯的人比较多，可以给大家说一个概念，一般我们熊市的时候用的比较多。避险三件套，老妖，次新和可转债。所以上周是利通电子那些票，这周是次新。可转债因为很多，所以每天也都有行情。
  interpretation: UP提出了一套熊市/市场弱势时的避险选股框架，将避险品种分为三类：老妖股（前期辨识度高的活跃股，如利通电子(603629)）、次新股（如托伦斯(301583)）、可转债。该框架可用于识别市场处于避险模式时的资金流向方向——当资金涌入这三类品种时，说明市场风险偏好低。
