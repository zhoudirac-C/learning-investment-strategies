  claim_type: sector-theme
  subject: AI硬件修复条件
  timeframe: short-term
  confidence: high
  intensity: high
  stance: view
  statement: AI硬件仍是指数压力源，修复的关键不是单个品种拉升，而是权重股抛压减轻，且盘中回升扩展到更多细分环节和更多资金参与。
  evidence_quote: 单个品种拉升能够改变局部情绪，整个方向的修复还需要更多资金参与。叠加隔夜海外半导体下跌，今天硬件端更关键的变化，是权重股抛压能否减轻，以及盘中回升能否扩展到更多细分环节。
  interpretation: UP区分了“局部情绪修复”和“板块趋势修复”：只有硬件权重止跌并带动细分扩散，AI硬件才能从拖累指数转为支撑修复。
