  subject: 每日走势的三分类
  topic: 按8根30分钟K线的中枢个数分三类，力度依次趋强
  statement: 一天交易4小时等于8根30分钟K线组成的系统，把3个相邻30分钟K线的重叠部分当成当天走势上的一个中枢，则任何一天的走势无非三类：一、只有一个中枢；二、两个中枢；三、没有中枢，其力度依次趋强。只有一个中枢是典型平衡市；两个中枢是单边走势形态（两中枢不能有重叠）；没有中枢（8根K线没有相邻3根有重叠部分）是最强的单边走势，一旦出现，该日K线都具有重要意义，但这种走势很不常见。
  evidence_quote: 把3 个相邻30 分钟K 线的重叠部分当成一个每天走势上的一个中枢，那么，一般来说显然，任何一天的走势，无非只有三类：一、只有一个中枢；二、两个中枢。三、没有中枢，其力度依次趋强。
  interpretation: 该分类把日内走势纳入缠论中枢框架，是给非严格级别操作者提供的看盘辅助工具；作者提醒若按某级别严格操作，每天具体怎么走关系不大，分类只是辅助。
