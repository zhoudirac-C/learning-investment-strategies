  subject: 中国2万亿AI算力基建计划
  statement: 彭博报道中国即将启动2万亿人民币(2950亿美元)全国AI数据中心建设计划，为期5年。由发改委牵头，中国移动(600941)、中国电信(601728)等国企运营，要求80%技术来自本土供应商（华为等），旨在排挤英伟达(NVDA)/AMD(AMD)。这是'六网'计划的一部分——构建统一计算网络，整合分散区域资源。
  evidence_quote: 中国正准备在未来5年内投入约2万亿元人民币（2950亿美元）用于在全国各地建设数据中心...依靠华为技术有限公司等本土供应商提供至少80%的技术，如人工智能芯片，从而有效排挤英伟达公司。
  interpretation: 这是国家级AI算力基建信号——2万亿规模相当于年化4000亿，将对算力产业链形成长期拉动。三个关键维度：①国产替代加速——80%本土供应要求直接利好华为昇腾产业链及国产AI芯片；②数据中心建设——国企主导的全国互联计算中心网络将拉动服务器/光模块/液冷/电源需求；③'六网'框架——意味着数据中心的定位不仅是算力中心，更是连接网络的一部分。但需注意：这是彭博报道（非官方正式发布），具体实施节奏和资金来源有待确认。
