  timeframe: short-term
  statement: 半导体设备相对平庸，因为扩产、国产替代、设备需求等逻辑市场已反复交易多轮，韩国加大AI投入只是对原有共识的再确认，边际增量不强。
  evidence_quote: 昨天说半导体设备相对平庸，为什么相对平庸？因为扩产、国产替代、设备需求这些逻辑，市场已经反复交易过很多轮。韩国加大AI投入，当然会强化半导体链条的景气预期，但对半导体设备来说，更多是对原有共识的再确认，边际增量没有那么强。
  interpretation: UP解释半导体设备不是最优预期差方向：逻辑已被充分定价，新增催化只是确认而非增量。
