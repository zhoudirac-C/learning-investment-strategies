  subject: 缠中说禅买卖点完备性定理
  topic: 市场必然产生赢利的买卖点只有三类，任何涨跌都从三类买卖点开始与结束
  statement: 缠中说禅买卖点完备性定理：市场必然产生赢利的买卖点，只有第一、二、三类，除此之外没有其他类型的买卖点。三类买卖点都是被理论所保证的、100%安全的买卖点，即这点之后市场必然发生转折，没有任何模糊或需要分辨的情况。缠中说禅升跌完备性定理：市场中的任何向上与下跌，都必然从三类缠中说禅买卖点中的某一类开始以及结束，市场走势完全由端点为某级别三类买卖点的线段构成。所有买卖点都必然对应着与该级别最靠近的一个中枢的关系：中枢下产生的买点对应转折，中枢上产生的买点对应延续。
  evidence_quote: 这里必须强调的是，这三类买卖点，都是被理论所保证的，100%安全的买卖点……归纳起来，就有缠中说禅买卖点的完备性定理：市场必然产生赢利的买卖点，只有第一、二、三类……市场中的任何向上与下跌，都必然从三类缠中说禅买卖点中的某一类开始以及结束。
  interpretation: 完备性定理把全部交易机会封闭在三类买卖点之内，给出地图的完整性承诺。100%安全是理论层面（点之后必然有转折），不承诺转折的幅度与持久，人的执行层面仍需修炼，作者自注是人使理论而非理论使人。
