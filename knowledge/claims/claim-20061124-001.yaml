  extracted_at: '2026-07-18'
  subject: 亏损根源与能搞相对性
  topic: 所有亏损都因持有不能搞的股票，能搞是相对的而不能搞是绝对的
  statement: 市场里所有亏损，都是因为持有了不能搞的股票而造成的。但无论任何股票，能搞总是相对的，不能搞却是绝对的：能搞的对象随时会变成不能搞，一旦这机失去了，就会在不能搞的泥潭难以自拔。因此操作是完整循环：在任何一段持有期内全身心投入去察，其后必须能抛弃——往死里干然后抛弃，两方面不能偏废，任何失败者都至少在其中一面失败了。
  evidence_quote: 市场里所有亏损，都是因为持有了不能搞的股票而造成的。但无论任何股票，能搞总是相对的，不能搞却是绝对的……能搞是相对的，意味着随时能搞就会变成不能搞。一旦这"机"失去了，就会在不能搞的泥潭难以自拔。无论对面首或股票，都要全身心地往死里干然后抛弃，这是不能偏废的两方面，任何的失败者都一定是至少在其中一面失败了。
  interpretation: 缠论的亏损归因与持仓观：亏损不是运气问题而是持有对象的状态问题；持有是阶段性租用而非永久拥有，能搞变不能搞的状态切换就是卖出信号的来源（对应第9课早泄退出、第12课卖点）。投入与抛弃同等重要。
