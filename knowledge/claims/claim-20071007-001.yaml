  subject: 缠论的三个客观支点
  topic: 走势不可重复性、自同构性结构绝对复制性与纯逻辑推导，分型源于完全分类而非归纳
  statement: 缠论视角的三个基本客观支点：一、走势的不可重复性，决定了一切的判断必须也必然是不可绝对预测的；二、自同构性结构的绝对复制性，决定了一切的判断都是可判断的，有着绝对的可操作性；三、理论的纯逻辑推导，证明其结论的绝对有效性，缠论是人类历史上第一次用百分之百理论推导的方式绝对地证明了走势分解的唯一性。注意，自同构性结构以前不太精确地用了自相似性结构之类的词语，容易和数学里的分形混淆，以后统一为自同构性结构。分型与分形有着本质的不同：分型是建立在一个K线组合的纯粹完全分类的基础上，是纯理论的推导；而分形类结构本质上都是归纳性的，因此都必然是有缺陷、划分不唯一的。
  evidence_quote: 走势的不可重复性和自同构性结构的绝对复制性以及理论的纯逻辑推导，这就构成了本ID 理论视角的三个基本的客观支点……走势的不可重复性，决定了一切的判断必须也必然是不可绝对预测的；自同构性结构的绝对复制性，决定了一切的判断都是可判断的，有着绝对的可操作性；理论的纯逻辑推导，就证明其结论的绝对有效性……分型，是建立在一个K 线组合的纯粹分类的基础上，任何与这个纯粹分类不同的，都必然是错误的……至于所谓的分形，当然也可能是一种结构，但这种结构，本质上都是归纳性的、因此都必然是有缺陷、划分不唯一的，和在一种完全分类基础上给出的绝对结论，有着本质的区别。
  interpretation: 三个支点分别回答能不能预测、能不能操作、结论靠不靠谱三个问题，前两点如果没有第三点都是瞎掰。第81课及此前提取中出现的自相似性表述，应以本课口径统一为自同构性结构。
