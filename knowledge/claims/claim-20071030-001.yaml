  subject: 零成本筹码原则
  topic: 成本没洗到0就不必大力拉抬，真正的拉抬不需要花钱
  statement: 成本是这游戏的关键：很多庄家最后做死，就是没有成本概念，见到市值起来就晕头，忘记了股票只是一个凭证。一般来说，如果成本没有到0，根本没有大力拉抬的必要，就要来回折腾，把筹码成本都洗到0了，才有必要去拉抬；而真正的拉抬是不需要花钱的，如果拉抬要花钱，证明价格已经高了，资金流入已经跟不上，早该回头砸了。基本的0成本筹码，反复拉抬变成纯负数，满手负成本筹码再大甩卖，谁要都死，这才是真的最安全的方法。
  evidence_quote: 为什么很多庄家最后都做死，就是没有什么成本概念……最关键是成本的下降。一般来说，如果成本没有到0，根本没有大力拉抬的必要，就要来回折腾，把筹码成本都洗到0 了，才有必要去拉抬。而真正的拉抬，是不需要花钱的。如果拉抬要花钱，证明价格已经高了，资金流入已经跟不上，早该回头砸了。
  interpretation: 虽以坐庄视角叙述，对普通资金的含义是：持仓成本决定主动权与心态，通过反复差价把成本降为0乃至负，是最安全的状态；第95课市场就是要0投入去赚钱的理念与此一脉相承。课中抢筹码、洗老鼠仓的故事只是这一原则的注脚。
