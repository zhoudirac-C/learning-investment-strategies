  subject: 吞没形态与高档长黑低档长红的对称性差异
  timeframe: permanent
  statement: 看跌吞没与高档长黑大多数时候是同一个信号——高档长黑天生满足看跌吞没的形态条件，顶部识别不需要区分两者。但看涨吞没与低档长红不是同一信号——低档长红对前一根K线没有形态要求（可以是阳线/阴线/十字星），底部识别必须细分区分两者。
  evidence_quote: 看跌吞没和高档长黑大多数时候是同一个信号，高档长黑天生满足看跌吞没的形态条件，所以顶部识别不需要区分两者。看涨吞没和低档长红不是同一个信号，低档长红对前一根K线没有形态要求，所以底部识别必须细分区分两者。
  interpretation: 顶部信号的对称性差异：因为顶部大阴线天然包裹前一根阳线（前阳通常力度递减），所以高档长黑≈看跌吞没。但底部大阳线不一定包裹前一根阴线（前阴可能也很小），所以低档长红≠看涨吞没。这解释了为什么底部需要更精细的信号识别。
  confidence: high
