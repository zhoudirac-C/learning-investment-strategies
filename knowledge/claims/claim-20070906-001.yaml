  subject: 线段的方向与破坏传递
  topic: 线段有方向且顶必高于底，每一线段必破坏前一线段且破坏可逆时间传递
  statement: 线段和笔都是有方向的：从顶开始的笔一定结束在底；以向上笔开始的线段一定结束于向上笔，一个线段不可能从底到底或从顶到顶，这是最基本的概念；同一线段中两端的一顶一底，顶肯定要高于底，划出的线段不符合这基本要求肯定是划错了。除非是新股上市后最开始的一段，任何一段都是破坏前一段的，划分不能保证前面每一段都被后一段破坏则肯定不对；线段的破坏是可以逆时间传递的，被后线段破坏的线段一定破坏前线段。线段不可能被同方向的线段破坏，任何同方向的线段，或者互相毫无关系，或者其中一线段其实是前一线段的延续即前一线段根本没完成。
  evidence_quote: 首先，线段和笔，都是有方向的，从顶开始的笔一定结束在底，同样，以向上笔开始的线段一定结束于向上笔……正如同一笔不可能出现顶低于底的情况，同一线段中，两端的一顶一底，顶肯定要高于底，如果你划出一个不符合这基本要求的线段，那肯定是划错了。……除非是新股上市后最开始的一段，否则任何一段都是破坏前一段的，如果你的划分，不能保证前面每一段都是被后一段破坏，那么这划分肯定不对。线段的破坏是可以逆时间传递的，也就是说被后线段破坏的线段，一定破坏前线段……但线段，不可能被同方向的线段破坏，任何同方向的线段，或者互相毫无关系，或者就是其中一线段其实是前一线段的延续。
  interpretation: 这几条是检验线段划分正误的快速过滤器：方向错、顶低于底、破坏链断裂，任一出现即划分有误。实际划分可从图中近期最高或最低点开始，但要对大走势有正确认识必须从更早的起点开始划分。
