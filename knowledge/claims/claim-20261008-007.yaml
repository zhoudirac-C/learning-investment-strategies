  statement: 个人纪律：先判断持仓方向是否仍有资金和基本面支撑，再决定参与强度；没有承接时不因跌幅大而连续摊低成本；出现修复时也不因一根急拉放大预期；消息交易先辨认正式文件、研究假设和产品阶段，产业研究再落实到公司收入、订单和利润；让观察条件决定动作，避免用长期产业故事替代短期风险控制。
