    - 60分钟顶部钝化未消失并触发调整
    - 脑机接口一致性过强直接顶一字，挤压其他新题材
    - 资金转向年报预增稳健线，放弃12月题材风格
    - 缩量环境下题材大杂烩缺乏延续性
    confidence_indicators:
    - 量能承接有力，下午成交额不缩
    - 大成交额首板股持续走强，大票赚钱效应扩散
    - 商业航天催化持续，资金回流偏好明确（卫星/SpaceX/3D打印）
    - 固态电池回调充分+国标/上车等多重催化临近
    - 指数未现明显高点，机构趋势方向可继续做T
    merge_suggestion: 归入板块轮动框架：重点在补涨地位、预期差与量能环境判断。
  - pattern_id: repair_quality_by_leader_attack_20260416
    name: 修复质量判断：核心龙头是否主动打空间
    source_raw:
    - sources/raw/财经/午盘：26-04-16：全线反包修复超预期，创业板突破3600，算力租赁涨停潮.md
