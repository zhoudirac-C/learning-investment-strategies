  evidence_quote: 量能改善让短期强势延续有了基础，但次新股的极端波动，也提示情绪修复正在进入更容易分化的位置。接下来要确认的，是放量之后主线能否承接分歧，而不是把一天普涨直接等同于中期底部已经确认。……成交额衡量的是交易活跃程度，买卖双方成交同步发生，单日放量不能直接证明同等规模的净增量资金进入。
