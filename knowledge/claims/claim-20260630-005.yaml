  subject: 乌云盖顶强度分级与收盘价口径
  timeframe: permanent
  statement: 乌云盖顶同样按覆盖比例分级：50%~70% 为 B 级，70%~90% 为 A 级（接近看跌吞没），90% 以上直接按看跌吞没处理；且判定以收盘价为准——影线超过50%但收盘未过50%不算有效。
  evidence_quote: 你如果能够盖住百分之五十以上的话，可以构成乌云盖顶。那么能够盖住的越多对吧，百分之五十到百分之七十，那么是B级的乌云盖顶。那么能够遮住百分之七十到百分之九十就是一个A级的乌云盖顶……如果能够盖住百分之九十以上，就直接按照看跌吞没去处理。……它的一个下影线是超过百分之五十，但如果是收盘价的话，它没有超过百分之五十。
  interpretation: 用影线替代收盘价判定会显著放宽信号，导致假信号增多；口径必须锁死为收盘价，与刺透一致。
