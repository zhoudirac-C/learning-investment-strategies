  subject: 一二级市场联动反哺的投资框架
  timeframe: permanent
  statement: UP首次完整阐述投资框架：二级市场赚的钱大约20-30%投到一级市场，一级市场收回的钱再投回二级，相互互补反哺；一级布局核聚变、量子、超声、AI游戏、空天飞机、商业航天、端侧大模型、新型存储、光芯片、未来还有抗衰老甚至月球基地采矿等超级星辰大海方向，都是估值几千万到几亿的极早期项目；二级的优势劣势在于随时可卖、无时无刻考验心态，一级本来卖不了、估值相对稳定，适合星辰大海式投资做补充；二级则布局相对前瞻但未来一到三年内能见到高额利润的标的。
  evidence_quote: 我的二级基本上呢就是股票赚钱，基本上是赚钱的百分之二三十吧，投到一级。一级呢如果到时候回回回回回撤回来，就是就是收回来的钱啊，再再投到二级，二级再赚钱投到一级。总之呢是相互的这种互补啊，反哺，看看能不能玩转吧。
  interpretation: 一二级市场的功能拆分：一级承载终局信仰（低流动性反而保护心态），二级承载中期业绩兑现；用流动性差异管理人性弱点。
