  claim_type: sector-theme
  subject: AI硬件是核心主线但已从一家独大转为反复轮动，CPO业绩兑现路径从远期走向当期订单
  timeframe: short-term
  statement: AI硬件是本轮修复的核心主线，但已从前两个月的「一家独大」转为反复轮动。CPO/光互连业绩兑现路径正从远期预期走向当期订单放量，是当前最有产业逻辑支撑的分支。PCB、MLCC、存储同一节奏。半导体强度稍弱，主因业绩支撑不足
  evidence_quote: AI硬件（核心主线）：光互连领涨，CPO业绩兑现路径正从远期预期走向当期订单放量；PCB、MLCC、存储同一节奏；半导体/芯片强度稍弱，主因业绩支撑不足，下半年有望明显改善。
  interpretation: AI硬件主线判断：①核心主线地位确认——但已从「一家独大」转为「反复轮动」，这是重要的风格变化；②CPO/光互连：业绩兑现路径从「远期预期」走向「当期订单放量」——这是产业逻辑的核心变化，天孚、源杰、光库等有真实订单支撑；③PCB、MLCC、存储：同一节奏，属情绪与产业共振；④半导体：强度稍弱，业绩支撑不足——与盘中claim-20260602-002-c「半导体缩量反弹=调整中继」一致；⑤风险提示：CPO短期涨幅已大，需防普涨后高低切换与获利回吐。这是对AI硬件各分支的精细化判断。
