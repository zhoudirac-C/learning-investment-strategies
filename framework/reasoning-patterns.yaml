    confidence_indicators:
    - 产业事件持续落地
    - 业绩预告超预期
    - 容量标的持续获得资金流入
    - 板块内出现龙头股带动效应
    merge_suggestion: 文章核心是识别市场主线并判断风格切换，归入主线识别框架。
