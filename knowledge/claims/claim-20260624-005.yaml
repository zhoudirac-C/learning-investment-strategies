  timeframe: permanent
  statement: 吞没形态是K线体系中力量切换最明确的信号之一，本身自带确认属性，不需要等待后续K线再次确认。定义：两根K线组合中，第二根K线实体完全包裹第一根K线实体。单根K线上吊线/流星线/铁锤线需要次日确认，而吞没形态作为组合K线信号，自身即完成力量反转的叙事。
  evidence_quote: 吞没形态是K线体系中力量切换最明确的信号之一，本身自带确认属性，不需要等待后续K线再次确认，信号地位较高。
  interpretation: 核心差异：单根K线是"信号"（需要确认），吞没形态是"叙事"（已完成力量切换）。这是组合K线相对单根K线的核心优势——信息量大、无需等待。
