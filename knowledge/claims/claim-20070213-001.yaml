- id: claim-20070213-001-b
  source_path: sources/chanlun/lesson_030.md
  source_date: '2007-02-13'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 交易的价格当下性
  topic: 交易只反映为价格，价格只有当下，走势之外无可依赖
  statement: 对于交易来说，除了价格一无所有，成交量可以看成是在一个最低的时间段内按该价格重复成交了成交数量个交易单位。所有价格都是当下的，站在纯交易的角度，价格只有当下，当下只有价格，除了价格与依据时间延伸出来的走势，市场的任何其他东西都是可以忽略不计的。交易是有时间性的且时间不可逆，理论以交易时间的不可逆为前提。假定基本面、心理面、政治面等因素决定价格是上帝式思维，唯一值得数学化探讨的就是价格轨迹本身。
  evidence_quote: 站在纯交易的角度，价格只有当下，当下只有价格，除了价格与依据时间延伸出来的走势，市场的任何其他东西都是可以忽略不计的……交易，只反映为价格，以某种价格某个时间的交易，这就是交易的全部。
  interpretation: 这是缠论当下概念的本体论基础，第32课走势的当下是其操作化展开。实际推论：任何消息、动机、预测都不进入交易决策，决策只建立在已成交的价格轨迹及其当下构成之上。
