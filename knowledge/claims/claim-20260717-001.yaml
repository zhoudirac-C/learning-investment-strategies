  evidence_quote: 情形A：若早盘承接良好、券商不再拖累、存储链人气股企稳，则超跌反弹展开，60分钟与90分钟底部结构有望同步构筑。情形B：若量能继续萎缩且大金融再度走弱，则反弹夭折、指数继续磨底，操作上维持观望，等右侧确认，不做左侧摊平。另外一层背景是，今天是世界人工智能大会开幕日，也是重要讲话日，主题面有护航预期——但个人判断，这个位置只能当超跌反弹来做，不宜上仓位去赌趋势反转。
  interpretation: 延续7/16晚盘的条件化框架，情形A偏乐观（需券商+存储双修复），情形B偏保守。WAIC开幕有主题面护航但仅限超跌反弹操作。
