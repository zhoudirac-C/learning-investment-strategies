  subject: 第14420号行政令内容框架：宽口径行政令加窄口径执行细则
  timeframe: trend
  statement: 据白宫2026年8月26日公布的第14420号行政令《宣布国家紧急状态以保障美国大容量电力系统安全》，援引IEEPA与NEA，认定外国供应的大容量电力系统设备（69千伏及以上，明文列举变压器、逆变器、电池储能、UPS、断路器等）构成威胁；禁令适用于签署日后启动的交易，存量设备可被施加隔离、更换等条件；2020年第13920号行政令的先例是「口径很宽的行政令+落地很窄的禁止令+政治周期切换后被撤销」，这次因把数据中心与AI写进紧急状态理由、且欧盟同向禁止X国逆变器，持续性可能更强，但宽行政令+窄细则的结构大概率重演。
  evidence_quote: 2020那一轮给出的基准情形是：行政令的口径很宽，但落地的禁止令口径很窄，且在政治周期切换后不到一年就被撤销。……不过这一次有两处不同需要记下来：一是行政令自己把数据中心与人工智能写进了紧急状态的理由，电网设备被抬升为AI基建的战略配套，政策动机比2020年更硬；二是据公开报道，欧盟委员会今年早些时候已决定禁止在公共资助的能源项目中使用X国制造的逆变器，同向动作不止一家。因此这次的持续性可能强于2020年那一轮，但"宽口径行政令＋窄口径执行细则"这个结构大概率还是会重演。
  interpretation: UP 用历史基准情形（2020 轮）为本次事件定性：短期交易情绪、中期看 120 天实施细则、长期比产品交付能力。真正值得等的硬节点是
    120 天实施规则，以及第二条(e)款的预合格清单——它意味着这不是非黑即白的墙，而是准入机制。
