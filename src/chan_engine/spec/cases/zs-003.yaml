# ZS-003 九段升级（课33）
# claim-20070302-001-b：中枢延伸不能超过 5 段，一旦出现 6 段延伸，加上形成中枢本身
# 那 3 段，共 9 段就构成更大级别的中枢（每 3 段一个本级别中枢，3 个本级别中枢重合
# 形成更大级别中枢），使中枢归属唯一确定。
# 构造（段=笔）：引导笔 bi0 上（13→17）后，bi1..bi9 共 9 段连续重叠震荡：
#   zs1=bi1..bi3：[15,17]/[15,18]/[16,18] → [max(15,15,16), min(17,18,18)] = [16,17]
