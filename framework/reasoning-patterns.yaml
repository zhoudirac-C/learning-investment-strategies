    - 历史冰点对比
  - step: 2
    name: 外围验证
    question: 假期外围市场表现是否支持修复？
    UP_logic: 假期美股纳指+1.28%、恒指+1.94%、A50偏强，公募ETF+主动权益基金超900亿待建仓，高开几乎板上钉钉
    evidence_sources:
    - 美股指数
    - 港股指数
    - A50期指
    - 公募基金仓位数据
  - step: 3
    name: 催化排序
    question: 假期哪些方向催化最充分、逻辑最硬？
    UP_logic: AI全链条催化（Kimi融资、Anthropic新品、OpenAI估值、英伟达Meta合作）发酵最充分；钨供给收缩+AI PCB钻针新需求双逻辑共振弹性最大
    evidence_sources:
    - 融资事件
    - 产品发布
    - 行业大单
    - 供给数据
  - step: 4
    name: 主线确认
    question: 节后首日盘面如何确认主线？
    UP_logic: 看竞价承接+量能（能否快速放大至2.5万亿+），AI算力盯CPO/光模块整体强度，钨看中钨高新竞价，机器人看天奇股份/嘉美包装盘面反馈
    evidence_sources:
    - 竞价数据
    - 成交量
    - 板块龙头开盘表现
  risk_factors:
  - 假期后段港股AI标的大幅调整→A股高开后兑现压力
  - 特朗普关税升级或地缘冲突超预期→风险偏好下降
  - 节后首日量能不足2.5万亿→修复力度不及预期
  confidence_indicators:
  - 节前连板高度降至极致冰点
  - 假期外围普涨且催化密集
  - 公募增量资金超900亿待建仓
  - 竞价承接有力+逻辑硬核+行业景气明确
  source_raw:
