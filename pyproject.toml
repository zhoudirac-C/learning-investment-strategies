[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qing-investment-learning"
version = "0.1.0"
description = "Continuous investment methodology learning system and skills"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.18",
  "ddgs>=9.14.4",
  "duckduckgo-search>=8.1.1",
  "paddleocr",
  "playwright>=1.60.0",
  "pytdx>=1.0",
  "ruamel.yaml>=0.18",
  "pyyaml>=6.0.1",
  # transformers 4.57.6 要求 huggingface-hub<1.0；hub 升到 1.x 后
  # `from transformers import AutoTokenizer` 直接 ImportError，
  # 导致所有新起的 .venv 进程 embedding 失效（Qdrant 索引/discover/pipeline 全挂）。
  # 见 SOUL.md「2026-10-22: pinning huggingface-hub」。
  "huggingface-hub>=0.34.0,<1.0",
  "transformers>=4.57,<5.0",
  # 本地 embedding 的推理引擎（embedding_utils.py），此前一直手工安装未声明，
  # `uv sync` 会把它当未声明依赖移除 → embedding 直接失效。
  "onnxruntime>=1.16",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]
agent = [
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "neo4j>=5.24.0",
  "qdrant-client>=1.12.0",
  "mem0ai>=0.1.0",
  "pydantic-settings>=2.0",
  # 注意：sentence-transformers 依赖 torch，Python 3.13 支持有限。
  # 如需本地 Embedding，请手动安装：uv pip install sentence-transformers
  # 或使用 API Embedding（OpenAI/SiliconFlow 等）作为替代。
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "third_party/chanpy"]
addopts = "-m 'not live'"
markers = [
    "live: tests that require real network access",
]
