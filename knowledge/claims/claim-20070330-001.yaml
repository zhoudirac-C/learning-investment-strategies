  subject: 买点买卖点卖与不追涨杀跌
  topic: 买点在下跌中形成卖点在上涨中形成，第三类买卖点也不需要追涨杀跌
  statement: 市场的节奏只有一个：买点买、卖点卖。买点总在下跌中形成，恐惧阻止人买入；卖点总在上涨中形成，贪婪阻止人卖出。因此没有任何股票值得追涨，也没有任何股票值得杀跌，即使搞不懂什么是买卖点，不能追涨杀跌这一点必须懂；即使是第三类买卖点，也是分别在回调与反弹中形成的，哪里都不需要追涨杀跌。被贪婪与恐惧支配的人在市场中唯一的命运就是死。
  evidence_quote: 市场的节奏，只有一个：买点买、卖点卖……买点，总在下跌中形成，但恐惧阻止了你；卖点，总在上涨中，但贪婪阻止了你……买点买，买点只在下跌中，没有任何股票值得追涨，如果你追涨被套，那是活该；卖点卖，没有任何股票值得杀跌……就算是第三类买卖点，也是分别在回调与反弹中形成的，哪里需要追涨杀跌？
  interpretation: 追涨杀跌被从原理上排除：三类买卖点的定义位置都在反向运动之后。这条是缠论操作心法的总纲，也把"买卖点上的股票才是好股票"确立为唯一的好坏分类标准。
