  subject: 突发消息的级别化应对
  topic: 消息只是分力，按其破坏的走势级别应对，破坏越大越不等本级别第二类卖点
  statement: 任何突发消息本质上不过增加了一个市场预期的当下分力，最终还是要看合力本身即市场走势，原则是看消息破坏了多大级别的走势，这一切都反映在实际走势中，看图作业就可以。突发消息最不幸的是在背驰精确定位期间出现，此时用一个第二类卖点就足以应付，实际操作中不能放过这个第二类卖点。但并不是任何第二类卖点都需要反应，这和级别有关：月线级别操作者对日线大跌看都不用看；消息只制造1分钟以下级别震荡、连1分钟中枢都没破坏时，5分钟级别操作者也不用管所谓的第二类卖点。反之，突发消息破坏的级别越大，越不一定等相应级别的第二类卖点：一个向下缺口把日线级别的上涨破坏了，消息当天盘中的1分钟甚至线段级别的第二类卖点就是好的走人机会，因为走势是逐步按级别生长出来的。
  evidence_quote: 本质上，任何突发的消息，不过增加了一个市场预期的当下分力，因此，最终还是要看合力本身，或者说是市场走势本身……而对于那种最不幸的情况，用一个第二类卖点就足以应付，因此，突发消息出来后，在实际的操作中就不能放过这第二类卖点。不过要注意，并不是任何第二类卖点都需要反应的，这和级别有关……突发消息破坏的级别越大，越不一定等相应级别的第二类卖点。
  interpretation: 与第56课突发情况下第二类卖点是最佳卖点互为补充：56课讲卖点平移，本课讲反应级别的匹配，过小不反应、过大不等本级别。530大跌是贯穿两课的案例。
