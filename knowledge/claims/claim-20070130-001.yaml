- id: claim-20070130-001-b
  source_path: sources/chanlun/lesson_026.md
  source_date: '2007-01-30'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 交易资金的期限要求
  topic: 交易的钱必须是无限期的，有限期的钱等于自动设置停止交易时限
  statement: 任何交易的前提是先有钱，一旦钱是有限期的，就等于自动设置了一个停止交易的时限，这样的交易是所有失败交易中最常见的一种，以前很多人死在透支上就是这种情况。任何交易的钱最好是无限期的，如果真有什么限期，也是足够长的，这是投资中极为关键的一点。有限期的钱唯一可能的补救是把操作级别降到足够低，把限期风险尽量控制，但这只是没有办法的办法，最好别出现。
  evidence_quote: 一旦钱是有限期的，那么等于自动设置了一个停止交易的时限，这样的交易，是所有失败交易中最常见的一种，以前很多人死在透支上，其实就是这种情况。任何交易的钱，最好是无限期的，如果真有什么限期，也是足够长的，这是投资中极为关键的一点。
  interpretation: 与第31课资金必须长期无压力互相印证，是缠论资金管理的第一层纪律。杠杆、借贷、配资的共同缺陷不在利息成本而在期限：到期强制平仓使操作级别被外部时钟接管，技术信号随之失效。
