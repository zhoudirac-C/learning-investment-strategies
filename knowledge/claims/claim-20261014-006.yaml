  subject: 背离只表示价格与速度不同步
  timeframe: permanent
  statement: 价格创新高而 DIF 未同步创新高构成顶背离，价格创新低而 DIF 未同步创新低构成底背离。背离只说明价格运行速度发生变化，方向仍要由价格自己确认，不能把指标不同步直接解释为反转。
  evidence_quote: 价格新高、快线不新高：顶背离。价格创新低，快线却没有创新低。背离，只说明速度变了；方向，要等价格自己说。
  interpretation: 这是全课的核心边界：DIF 提供动能线索，但是否形成顶部或底部必须由价格结构进一步验证。
