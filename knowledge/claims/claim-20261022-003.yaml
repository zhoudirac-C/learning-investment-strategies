  timeframe: short-term
  stance: view
  statement: 港股本轮大幅调整的核心催化不是离岸信托征税的突发新政，而是2026年7月已落地征管规则进入90天补报窗口期尾声后，市场情绪从「规则认知」转向「执行落地」的担忧；由于这一转换叠加外资流出与地产低迷的弱势基础，负面预期被快速放大。
  evidence_quote: 近期港股大幅调整，离岸信托征税并非突发新政，而是2026年7月已正式落地的征管规则进入90天补报窗口期尾声（7月24日财政部、税务总局发布2026年第21号公告，补报截止期为10月下旬）。市场情绪从“规则认知”转向“执行落地”的担忧，叠加外资流出、地产低迷的弱势基础，负面预期被快速放大。
  interpretation: UP 把市场反应与政策事件做了解耦：真正的变量不是「有没有新政策」而是「既定政策何时执行、谁被波及」。这个归因框架可复用——遇到政策类冲击，先判断是新增规则还是存量规则执行落地，再看是否叠加了弱势市场基础（此处是外资流出+地产低迷），决定情绪放大的量级。
