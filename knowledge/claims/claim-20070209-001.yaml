  subject: 缠中说禅背驰转折定理
  topic: 某级别趋势的背驰将导致最后中枢级别扩展、更大级别盘整或该级别以上反趋势
  statement: 缠中说禅背驰-转折定理：某级别趋势的背驰将导致该趋势最后一个中枢的级别扩展、该级别更大级别的盘整或该级别以上级别的反趋势。三种情况完全分类了某级别背驰后的级别与力度，即某级别第一类买点后将发生的全部情况，第一类卖点方向相反。粗糙地说背驰以后就意味着盘整和反趋势，因为第一种情况很少发生且和第二种有所类似。注意下跌加盘整中盘整的中枢级别一定大于下跌中的中枢级别，级别相同则只有下跌延伸或最后中枢扩展两种可能，都不属于两个走势类型的连接。
  evidence_quote: 缠中说禅背驰-转折定理：某级别趋势的背驰将导致该趋势最后一个中枢的级别扩展、该级别更大级别的盘整或该级别以上级别的反趋势。
  interpretation: 该定理把背驰后的演化穷举为三种且可区分：第一种最弱，反弹只触及最后中枢的DD即min(dn)，把最后中枢扩展成更大级别；且此时反弹级别一定等于或大于最后中枢，而盘整背驰转化成第三类卖点时反弹级别一定低于最后中枢，两者不难区分。这是缠论由判断走向操作的枢纽定理。
