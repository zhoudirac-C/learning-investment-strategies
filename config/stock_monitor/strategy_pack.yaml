  - 【7/5人形机器人高潮分化】周五板块集体爆发四十余股涨停，是AI主线资金溢出承接方向；周一大概率分化，关注分化后确立辨识度的前排，而非情绪顶点追高
  - 【7/5商业航天催化窗口】板块资金结构改善，中长期机构资金逐步承接；7月10-13日长征十号乙首飞、7月15日前后朱雀三号遥二发射，可回收结果决定行情性质
