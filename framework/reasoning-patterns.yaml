    - step: 2
      name: 拆分独立驱动逻辑
      question: 涨停是单一因素还是多因素共振？
      UP_logic: 核心驱动来自三大逻辑：有机硅、硫酸产业链、AI电子材料，叠加PVA，各逻辑独立成立。
      evidence_sources:
      - 行业新闻
      - 产业政策
    - step: 3
      name: 验证供需价格传导
      question: 每个逻辑的景气能否被供需解释？
      UP_logic: 有机硅：减排35%+陶氏关停（供给收缩）+旺季；硫酸：地缘致硫磺涨价+供应偏紧；PVA：海外高成本+国内成本优势。
      evidence_sources:
      - 行业减排政策
      - 海外产能关停公告
      - 国际价格走势
    - step: 4
      name: 映射受益标的
      question: 哪些公司最受益？
      UP_logic: 有机硅龙头东岳硅材/新安股份/合盛硅业，硫酸自有矿成本优势粤桂股份，国产替代圣泉集团。
      evidence_sources:
      - 公司业务对应关系
      - 涨停名单
    - step: 5
      name: 跟踪持续性指标
      question: 涨价行情能否持续？
      UP_logic: 关注涨价持续性与订单数据，聚焦龙头，跟踪有机硅、硫酸价格与出口数据。
      evidence_sources:
      - 价格数据
      - 订单数据
      - 出口统计
    risk_factors:
    - 中东地缘冲突缓和导致硫磺等大宗价格回落
    - 行业减排政策执行不及预期或产能复产
    - 下游需求旺季结束后涨价驱动减弱
    confidence_indicators:
    - 多细分逻辑同时发酵，形成板块性共振涨停
    - 海外产能永久关停等供给收缩信号明确
    - 龙头公司批量涨停且具备成本或认证壁垒
    merge_suggestion: 化工涨价多逻辑共振，核心验证供需缺口与成本优势，符合上游周期框架
