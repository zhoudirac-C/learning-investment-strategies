  subject: 走势级别与均线的对应
  topic: 任一级别有最少延伸时间与对应挑战均线，同趋势中枢压制均线大致相同
  statement: 任一级别都有最少的延伸时间：例如一笔由于必须有顶与底的分型，必须至少延伸6个基本K线单位，也就是说如果5日线都不能碰到，那就不会是笔的反弹；同样道理可以给出线段及1、5、30、日、周等等级别的最少延伸时间，以及相应最少挑战的均线。走势级别与均线虽然没有必然关系，但有一个大致的区间对应。特别地，根据经验，一个趋势中N个中枢对应的压制均线大致都是相同的，例如第一中枢被89日均线压制了，后面同趋势中后继的中枢很有可能就被同样的均线压制；如果有一个反弹只能达到34日线，那么和前面第一中枢同级别的概率就很小了。
  evidence_quote: 任一级别，都有最少的延伸时间，例如，一笔，由于必须有顶与底的分型，因此，必须至少延伸6 个基本K 线单位，也就是说，如果5 日线都不能碰到，那就不会是笔的反弹了……特别地，根据经验，一个趋势中N 个中枢对应的压制均线大致都是相同的
  interpretation: 定量部分（笔至少延伸6个基本K线单位、至少触及5日线）是级别判别的硬性下限；同趋势中枢压制均线大致相同是经验规律，可用于预判后继中枢的压力位与反弹级别。具体均线参数只是示例，原则是与实际走势吻合。
