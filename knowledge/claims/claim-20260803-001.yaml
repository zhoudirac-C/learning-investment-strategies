  timeframe: intraday
  statement: 上周五美股存储链是分化而非普跌，铠侠财报营收同比+415%但利润低于预期、ADR当晚跌10.1%，说明资金第一时间并未按利空出尽定价，因此今日对A股存储方向不宜有高预期；外盘的作用只反映在开盘定价，开盘后市场回归自身节奏。
  evidence_quote: 个人判断：外盘的作用只反映在开盘定价，开盘后市场回归自身节奏。上周五夜盘其实已经回答了“利空还是利空出尽”的一半——业绩显著低于预期后ADR收跌10%，说明资金第一时间并没有按“利空出尽”定价，因此今日对存储方向不宜有高预期。
