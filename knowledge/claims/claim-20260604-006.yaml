  subject: 储能/锂电/材料方向完整标的清单
  timeframe: trend
  statement: 储能/锂电/材料是UP磨底期重点推荐的非科技方向之一。UP视频明确说储能方向值得关注，六氟磷酸锂比锂矿更值得做，VC涨价逻辑持续（储能用量是动力电池3-5倍）。根据UP指令整理的1-4月动态图片标的：储能系统（海博思创688411、阳光电源300274）、电池（宁德时代300750、亿纬锂能300014、鹏辉能源300438、欣旺达300207、瑞浦兰钧00666.HK）、隔膜（恩捷股份002812）、六氟/电解液（天赐材料002709、华盛锂电、石大胜华603026）、铁锂（湖南裕能301358、富临精工300432）、碳酸锂（华友钴业603799、盐湖股份000792）、储能壳体（旭升集团603305）
  evidence_quote: 储能这边，锂矿不如去做六氟磷酸锂的一些东西。VC（碳酸亚乙烯酯）涨价逻辑——储能用量是动力电池3-5倍，从4.5万涨到30万（六倍）。
  interpretation: 'UP对储能/锂电方向的核心判断：

    1. 储能是磨底期非科技方向重点推荐之一

    2. 六氟磷酸锂比锂矿更值得做

    3. VC涨价逻辑持续，储能用量远大于动力电池

    4. 以下标的来自UP 1-4月动态图片中的机构推荐，按UP指令整理

    5. 主板可交易标的：石大胜华(603026)、华友钴业(603799)、盐湖股份(000792)、旭升集团(603305)

    6. 其余多数为创业板(300)/科创板(688)/港股，仅作知识库记录

    '
