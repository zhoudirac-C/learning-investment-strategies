  subject: 三类买卖点的分工
  topic: 三类买卖点在同一级别上不可偏废，第一类是背驰点，第二类补充小转大，第三类对付中枢结束
  statement: 第一、二、三类买卖点归根结底都可以归到第一类买卖点上，只是级别不同；把三者统一在同一级别上研究才有三类的分别，站在同一级别上三者都重要、不能偏废。第一类买卖点就是该级别的背驰点，足以应付最大多数情况；但小级别转大级别时该级别不出现第一类买卖点，第二类买卖点就是最佳补充——高点次级别向下后次级别向上，不创新高或盘整背驰都构成第二类卖点，买点的情况反过来。第二类买卖点站在中枢形成的角度，意义是必然要形成更大级别的中枢；第三类买卖点的意义是对付中枢结束。第二、三类买卖点之间都是中枢震荡，这时不会有该级别的买卖点，参与其中用的都是低级别的买卖点。
  evidence_quote: 第一类买卖点，就是该级别的背驰点，这足以应付最大多数的情况，但有一种情况是不可以的，就是前面反复强调的小级别转大级别的情况……在小级别转大级别的情况下，第二类买卖点就是最佳的，因为在这种情况下，没有该级别的第一类买卖点……第三类买卖点就是告诉什么时候发生这种事情的，而在第二、三买卖点之间，都是中枢震荡……因此，三类买卖点，都不能偏废，不能说哪一个更重要，站在同一级别上，三者都重要。
  interpretation: 这是三类买卖点体系的总分辨。实际操作最干脆的做法是不参与中枢震荡、只在预先设定的买卖点上买卖；大资金或有足够时间与熟练度的可以参与中枢震荡，中枢级别足够时利润往往更大更稳定。
