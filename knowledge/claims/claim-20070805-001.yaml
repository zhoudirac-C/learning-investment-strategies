  subject: 不测而测的完全分类
  topic: 预测就是完全分类加边界条件加预案，不排除任何情况，让市场自己选
  statement: 真正的预测是不测而测。所有预测的基础就是分类，把所有可能的情况进行完全分类；对预测分类的唯一正确原则是不进行任何排除，而是严格分清每种情况的边界条件——任何分类都等价于一个分段函数，关键是把f(X）取某值时X的范围确定清楚。边界条件分段后，确定一旦发生哪种情况就如何操作，即把操作也同样分段化，然后把所有情况交给市场本身，让市场自己去当下选择。任何的排除都等价于一次预测，每排除一个分类，按概率的乘法原则，最后的所谓精确就变得越不精确。基本面分力往往是分段式常量，其断裂点构成预测盲点，使一般意义上的精确预测成为笑话；号称预测准确者不过是概率事件。
  evidence_quote: 真正的预测，就是不测而测……所有预测的基础，就是分类，把所有可能的情况进行完全分类……对于预测分类的唯一正确原则就是不进行任何排除，而是要严格分清每种情况的边界条件。任何的分类，其实都等价于一个分段函数，就是要把这分段函数的边界条件个确定清楚……边界条件分段后，就要确定一旦发生哪种情况就如何操作，也就是把操作也同样给分段化了。然后，把所有情况交给市场本身，让市场自己去当下选择……任何的排除，等价于一次预测，每排除一个分类，按概率的乘法原则，就使得最后的所谓精确变得越不精确，最后还是逃不掉概率的套子。
  interpretation: 缠论对预测的操作化定义：不赌方向，只做完全分类、边界条件、预案三件事。课中实例：用前期两高点和10日线把走势分成跌破与不跌破两种，预设两套操作，市场选择了不跌破就继续持有；若再跌破则等跌破成为事实再按预案行动。
