- id: claim-20261023-001-c
  claim_type: market-cycle
  subject: 指数稳定条件
  timeframe: short-term
  confidence: high
  intensity: high
  stance: market-regime
  statement: 宽基ETF放量只能说明交易活跃，不能替代市场抛压消化；指数真正稳定需要科技权重和普通个股共同改善。
  evidence_quote: 多只宽基ETF明显放量，仍未改变深成指和创业板指接近全天低位收盘的结果。这反映出，宽基层面的交易活跃与市场整体抛压之间仍不平衡，指数的稳定还需要科技权重和普通个股共同改善。
  interpretation: UP把ETF放量定位为承接信号而非趋势 reversal 证据：若普通个股和科技权重不跟随，ETF托盘只能延缓下跌，不能确认市场修复。
