- claim_type: methodology
  subject: 午后量价三组合判别买盘是否回流
  timeframe: short-term
  statement: 若上午仍缩量横盘，13:00以后优先比较同一时间窗口的成交和价格方向：量能增加、指数重心抬升、核心股回踩不再破低，才是买盘回来的组合；放量下跌说明抛压未释放完，平量或缩量下滑也不能当作企稳。这是近期盘面的识别方法，不是任何缩量午后都会下跌的固定规律。
  evidence_quote: 今天若上午仍然缩量横盘，13:00以后应优先比较同一时间窗口的成交和价格方向：量能增加、指数重心抬升、核心股回踩不再破低，才是买盘回来的组合；放量下跌则说明抛压尚未释放完，平量或缩量下滑也不能当作企稳。
  interpretation: 承接判别三要素（量增+重心抬升+核心不破低）的细化；强调同时间窗口比较、反对把局部经验固化为规律。
