  subject: 初学者操作级别纪律
  topic: 初学者按30分钟进出不能小于5分钟，准确率比频率重要
  statement: 初学者一定不能采取小级别操作，因为买卖点判断精确度不高，按30分钟级别进出比较好，怎么也不能小于5分钟，5分钟没有进入背驰段就不能操作。级别越小对判断精确度要求越高，频繁交易导致的频繁失误只会使心态变坏、技术永远学不会。市场中不需要频繁买卖，战胜市场需要的是准确率而不是买卖频率，只有券商与税务部门才喜欢买卖高频率。另外，当小级别买卖点与大级别走势方向相反而大级别走势没有任何衰竭时，参与小级别买卖点就要冒大级别走势延续的风险，是典型的刀口舔血。
  evidence_quote: 对于初学者，一定不能采取小级别的操作，你对买卖点的判断精确度不高，如果还用小级别操作，不出现失误就真是怪事了。对于初学者，按照30 分钟来进出，是比较好的，怎么也不能小于5 分钟，5 分钟都没有进入背驰段，就不能操作……市场中不需要频繁买卖，战胜市场，需要的是准确率，而不是买卖频率，只有券商与税务部门才喜欢买卖高频率……这时候参与小级别买卖点，就意味着要冒着大级别走势延续的风险，这是典型的刀口舔血。
  interpretation: 级别选择在此被明确为能力匹配问题而非偏好问题：操作级别越小容错越低。30分钟是作者给初学者的最低级别门槛，与第48课"给自己安排力所能及的活动"互相印证。
