  subject: 机器人与PCB午盘有回流/反包迹象，但持续性待确认
  timeframe: intraday
  statement: 机器人板块今日有回流迹象但强度一般，PCB板块有反包动作但力度有待确认。若反包成功，可能成为短期资金聚焦方向
  evidence_quote: 机器人方向：机器人板块今日有回流迹象，但回流强度一般，尚未确认持续性。PCB方向：PCB板块今日有反包动作，反包力度有待确认，若反包成功，可能成为短期资金聚焦方向。
  interpretation: 板块观察要点：①机器人回流——属于科技线内部轮动，但"强度一般"说明不是强一致修复，而是分化中的局部回暖；②PCB反包——5月底PCB是双核心之一，今日反包若成功，可能意味着资金回流科技主线，但"力度有待确认"说明不能过早乐观；③两者共同特征：都是科技线方向，与早盘"反向上涨票补跌"（防御板块调整）形成跷跷板验证。这是观察午后或明日科技方向能否重新聚焦的关键信号。
