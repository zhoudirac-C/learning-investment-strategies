  - id: claim-20260608-004-g
    topic: 硫铁矿成本替代——粤桂股份
    statement: 粤桂股份(000833)坐拥云浮硫铁矿（探明储量约2.08亿吨），矿石露天开采成本较低。因进口渠道受阻、国内产量有限，硫磺价格6月7日冲高至9800元/吨，较霍尔木兹海峡关闭前涨幅超160%。硫磺约80%—85%用于制酸，硫铁矿制酸相对硫磺制酸具备成本替代优势。成本弹性与替代价值属产业逻辑推演，实际兑现取决于价差持续性
