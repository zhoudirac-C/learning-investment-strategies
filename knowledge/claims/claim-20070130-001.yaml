  subject: 成本变负的交易目标
  topic: 高手把任何凭证成本变成负价格，买卖点之间唯一要控制的是量
  statement: 以0以上的任何价格进行的任何交易都必然包含风险，交易唯一可能毫无风险的方式是拥有一个负价格的凭证；真正的高手、永远不败的高手，就是有本事在相应时期内把任何凭证变成负价格的人。操作方法：只要有卖点就要卖出，只要有买点就要买入，唯一需要控制的是量；级别的意义其实只有一个，基本只和买卖量有关，级别越大可用更大的量参与买卖。对任何成本为正的股票永远不信任，仓位一开始就买够，卖点时变少、买点时回复原来数量，但绝对不加仓。
  evidence_quote: 唯一的可能，就是你拥有一个负价格的凭证。什么是真正的高手、永远不败的高手？就是有本事在相应的时期内把任何的凭证变成负价格的人……只要有卖点，就要卖出，只要有买点就要买入，唯一需要控制的，就是量……级别的意义，其实只有一个，基本只和买卖量有关……但绝对不加仓，一开始就买够。
  interpretation: 本课给出缠论资金哲学的总纲，第31课成本为0的程序是其具体化。作者自陈1分钟卖点也参与，只卖5万股跌回来买回，重点不在单次差价而在总体成本持续降低。某认购权证成本负2.8元是文中2006至2007年历史案例。小资金可全仓进出游走于不同凭证，大资金只在月线最低周线买点位置进入。
