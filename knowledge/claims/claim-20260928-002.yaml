  subject: 明日情形应对框架
  timeframe: short-term
  statement: 9月29日按两种情形应对：情形A（抛压衰减）下指数不再持续创盘中新低、跌停明显减少、强势方向回落有承接且科技权重企稳，先按情绪修复观察，午后修复维持才提高反弹持续性判断，优先观察强势方向、不将超跌直接当作机会；情形B（继续破位）下创业板放量下行、抗跌股补跌、跌停维持高位，说明资金仍在收缩敞口，即使盘中快速拉升只要量能与广度跟不上仍按弱势反抽处理，应降低参与强度、控制隔夜风险。
  evidence_quote: 情形 A · 抛压衰减，局部修复逐步扩散：若早盘分歧后指数不再持续创出盘中新低，跌停家数明显减少，汽车整车、风电或玻璃基板核心个股回落有承接，同时科技权重由拖累转为企稳，可以先按情绪修复观察。午后若修复仍能维持、上涨家数继续增加，才有条件提高对反弹持续性的判断。优先观察强势方向，不将超跌直接当作机会。情形
    B · 指数继续破位，强势方向补跌：若创业板继续放量下行，前一日抗跌股也出现冲高回落或连续失守，跌停数量维持高位，说明资金仍在收缩风险敞口。即使盘中出现快速拉升，只要量能与板块广度跟不上，仍按弱势反抽处理。此时应降低参与强度，控制隔夜风险，等待新的承接结构形成。
  interpretation: UP给出的次日决策树：用指数新低、跌停家数、强势方向承接、科技权重四个信号分流到修复观察或弱势反抽两种处理，分别对应提高观察权重与降低参与强度两种仓位动作。
