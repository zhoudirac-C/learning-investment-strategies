- pattern_id: sector_mainline_qualify_with_defense
  name: 主线确认与防御双保险
  description: 通过政策信号、产业景气、资金行为三重验证确认主线方向，同时配置防御品种对冲风险，形成攻守兼备的仓位结构。
  applicable_themes:
  - 科技主线确认
  - 周期板块轮动
  - 事件驱动型行情
  reasoning_chain:
  - step: 1
    name: 政策信号筛选
    question: 哪个方向获得了最高级别的政策背书？
    UP_logic: 引用国务院国资委‘算力+电力’协同等战略级信号，作为主线方向的第一重确认。
    evidence_sources:
    - 国务院国资委公告
    - 政策文件
  - step: 2
    name: 产业景气验证
    question: 该方向的产业基本面是否出现景气拐点或需求爆发？
    UP_logic: 通过智谱GLM售罄、铠侠财报超预期、IPG光电大涨等产业数据，验证算力/存储/光纤的景气上行。
    evidence_sources:
    - 公司财报
    - 产品售罄公告
    - 美股映射
  - step: 3
    name: 资金行为确认
    question: 资金是否在主线内部做高低切换而非撤离？
    UP_logic: 算力分化但存储/半导体补涨，说明资金未离场只做内部高低切，确认主线持续性。
    evidence_sources:
    - 板块涨跌幅
    - 个股资金流向
  - step: 4
    name: 防御品种配置
    question: 主线若遇阻，哪些品种能提供对冲？
    UP_logic: 同时配置小金属/稀土/航运等防守端品种，形成‘进攻算力+防守资源’的双保险结构。
    evidence_sources:
    - 板块轮动规律
    - 避险情绪指标
  risk_factors:
  - 量能萎缩至2万亿以下，主线品种因大市值机构重仓而无法持续
  - 主线内部高低切换完成后无新催化，资金转向其他主题
  confidence_indicators:
  - 政策信号级别为‘战略级’
  - 产业数据出现超预期（如铠侠利润超预期）
  - 资金在主线内部做高低切而非全面撤离
  source_raw:
