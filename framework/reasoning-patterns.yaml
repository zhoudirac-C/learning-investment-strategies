      - 中信建投策略情绪指数
      - 历史连阳记录
    - step: 2
      name: 预设高位操作策略
      question: 高位状态下如何操作？
      UP_logic: 高开概率高但不追涨；无放量则先卖后买做T；警惕类似2018年1月15日大级别日内调整，尽量规避。
      evidence_sources:
      - 外围假期上涨
      - 两市成交额2.05万亿缩量974亿
      - 2018年1月15日历史走势
    - step: 3
      name: 核心标的验证主线
      question: 商业航天能否延续强势？
      UP_logic: 观察节前高标神剑、超捷竞价表现及泰尔、雷科弱转强，若容量标的高举高打则反包，否则进入分歧。
      evidence_sources:
      - 12月31日盘前高标提示
      - 个股竞价及开盘表现
    - step: 4
      name: 构建轮动与弱题材预案
      question: 若主线分歧，资金流向哪里？
      UP_logic: 商业航天与机器人跷跷板，若航天分歧则机器人回流；AI应用看蓝色光标分时承接，叠加Meta消息未发酵则难言成功。
      evidence_sources:
      - 31日商业航天走强机器人走弱
      - 31日资金拉升辨识度个股
      - 假期Meta消息
    risk_factors:
    - 情绪指数突破90警戒线
    - 放量高开低走类似2018年1月15日
    - 商业航天高标出现严重异动下跌
