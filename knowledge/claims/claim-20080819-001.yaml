  subject: 反弹的次级别分段操作
  topic: 反弹操作按次级别分解分段进行，不等上下上完成才抛
  statement: 操作一个30分钟级别反弹的绝对性基础：这个反弹至少有一个30分钟级别的中枢，而一个中枢由三个以上次级别走势类型重叠构成，即一定涉及上下上三个5分钟走势类型，这就是操作绝对性的最坚实基础。由于没有任何绝对性保障最后一个上比第一个上有更高高点，特别奔走型反弹后上的高点可能只刚好触及前上的低点，等上下上都完成才抛出可能只剩一个连手续费都不够、稍纵即逝的卖点；因此具体的反弹操作一定是按同次级别分解方式进行的，30分钟级别的反弹按5分钟的节奏去处理，让分段提供具体的操作安全。效率最高的做法是保持部分仓位、用余下仓位进行换股轮动，资金少的可以全部仓位轮动但技术要求更高。
  evidence_quote: 一个30 分钟的中枢，一定涉及上下上的三个5 分钟走势类型。这就是构成我们操作绝对性的最坚实基础……要解决这个问题，只能从第一上就开始分解操作，也就是说，没必要等待第二个上了……具体的反弹操作一定是同次级别分解方式进行的，也就是说，30 分钟级别的反弹，是按5 分钟的节奏去处理的。
  interpretation: 不预测反弹用何种形式展开，只用中枢必含三段次级别走势这一结构事实构建操作，是缠论以绝对性对抗不确定性的范例。分段操作牺牲理论最高收益，换取具体的操作安全，部分仓位轮动是其效率补丁。
