  - id: claim-20260608-004-b
    topic: 企稳三条件——外围+年线+量能
    statement: A股科技企稳需满足三个观察条件：①外围股市先企稳（美股科技修复力度是首要参照）；②年线MA250支撑（上一次杀到年线上方见底）；③量能低于2万亿（2026年以来规律：量超3.5万亿对应顶部，量低于2万亿对应底部）。强调这是经验规律非必然，从放量到见底需过程
    source_path: sources/raw/财经/复盘：26-06-08：全球市场大跌后A股低开，全A未稳症结与企稳三条件.md
    source_date: '2026-06-08'
    source_type: 复盘
    extracted_at: '2026-06-08'
    claim_type: methodology
    subject: 企稳观察条件框架
    timeframe: 中期（1-4周）
    evidence_quote: |
      "第一，等外围股市先企稳。本轮调整的直接诱因来自全球市场大跌，外围未稳之前，A股科技难有独立企稳的基础。"
      "第二，关注年线的支撑（MA250）。大盘上一次是杀到年线上方见底，这一次将继续考验年线。"
      "第三，量能规律的参照。回顾每一次阶段低点与阶段高点都有一定规律，尤其是2026年以来：每次量能超过3.5万亿基本对应阶段性顶部，每次量能低于2万亿大概率对应阶段性底部。"
      "操作上的纪律：在指数未出现明确止跌信号前，耐心等待市场企稳，切忌盲目加仓或频繁操作，等待右侧确认而非左侧抄底。"
    interpretation: UP给出的是一个"观察框架"而非时间点预测。三个条件形成递进：外围（短期）→年线（中线）→量能（验证）。关键纪律是"等右侧确认而非左侧抄底"——这与早盘001-a（清仓等纠错）和003-a（不能赌）形成完整的风控链条
