  subject: 国新增持-国家队出手定义底部区域
  timeframe: short-term
  statement: 中国国新7月19日晚宣布使用股票回购增持专项再贷款及配套资金超500亿元维护市场稳定，类比2025年4月7日先例（当晚诚通+国新增持，大阴线并非精确最低点但处底部区域），国家队出手大概率定义底部区域而非精确最低点。
  evidence_quote: 中国国新表示坚定看好中国资本市场发展前景，旗下国新投资相关主体已使用股票回购增持专项再贷款及配套资金超500亿元用于维护市场稳定。这一幕有明确的先例可考。2025年4月7日，上证指数单日暴跌7.34%、收于3096点，当晚中国诚通公告增持ETF与央企股票，次日中国国新宣布以专项再贷款增持央企股票、科技创新类股票及ETF，首批金额800亿元。事后看，那根大阴线并非精确最低点，但正处底部区域，市场随后走出了完整修复。神秘资金不会轻易出手，一旦出手，哪怕不是最底部，也大概率是底部区域。
  interpretation: UP将本次国新增持与2025年4月7日类比：国家队出手定义的不是精确最低点，而是底部区域。国新表态压缩了多杀多阶段的空间，但不等同于立刻见底。
