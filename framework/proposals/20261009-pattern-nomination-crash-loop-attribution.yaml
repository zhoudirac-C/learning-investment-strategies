candidate_pattern:
  pattern_id: crash_loop_attribution
  name: 暴跌互爆归因与救市需求判断框架（融资余额三分法）
  description: >-
    当市场出现连续暴跌/恐慌下跌、需要判断下跌性质与是否依赖外部力量（GJD）介入时使用。
    核心原则：先归因互爆主体（融资盘/外围/机构），再推导救市需求——涨出来的风险（估值泡沫）
    跌一波即消化，跌出来的风险（机构互爆恶性循环）没有强有力向上力量无法打破，历史上每次
    都需 GJD 级买入终结。融资余额是判别互爆主体的第一数据锚点：暴跌中融资余额仍在增加
    =散户在加仓、杠杆未出清→排除融资盘互爆；融资余额骤降=杠杆平仓螺旋进行中。
  trigger:
    - 指数或主线板块连续暴跌、出现"不计代价一键清仓"式下跌
    - 需要回答"这轮下跌是什么性质/会不会止跌/要不要等国家队"
    - 融资余额、龙虎榜机构席位、外围市场联动数据可得
  data_requirements:
    - name: 两融余额及融资净买入走向
      channel: 东财融资融券数据中心（市场合计日度余额、融资净买入额；UP 用的即东财页面截图）
    - name: 龙虎榜机构席位动向
      channel: 龙虎榜数据（机构专用席位净买入/净卖出，判断机构抱团撤退还是承接）
    - name: 外围市场联动
      channel: 隔夜美股/韩股/费半等外围科技链表现，判断是否外围传导剧本
    - name: 领跌结构
      channel: 领跌板块是否为机构重仓方向（公募/险资/社保重仓股），跌停与下跌家数分布
  steps:
    - step: 1
      name: 互爆主体识别（三分法）
      question: 本轮下跌是谁在不计代价卖出——融资盘、外围传导、还是机构互爆？
      action: >-
        ①融资余额走向：暴跌中余额仍增=散户加仓、融资盘互爆风险不大；余额骤降=杠杆平仓螺旋；
        ②外围联动：外围同步杀跌→外围传导剧本（7月）；外围平稳→内部剧本；
        ③龙虎榜机构席位+领跌结构：机构席位抱团撤退+机构重仓股领跌→机构互爆
      data: [两融余额及融资净买入走向, 外围市场联动, 龙虎榜机构席位动向, 领跌结构]
    - step: 2
      name: 恶性循环机制确认
      question: 是否已形成"跌出来的风险"自我强化循环？
      action: >-
        机构互爆循环链条：低成交量下部分资金卖出→杀跌触发止盈→绝对收益结构被动卖出→
        量化调仓→赎回压力下卖未跌停持仓→相互踩踏放大；确认标志=持续下杀已与基本面无关、
        重仓基金不计成本卖出、跌停卖不出去转而卖没跌停的
      data: [领跌结构]
    - step: 3
      name: 救市需求判断
      question: 该循环能否自愈，还是需要 GJD 级力量？
      action: >-
        涨出来的风险（估值泡沫）跌一波估值消化即结束，不需外部力量；跌出来的风险（机构互爆
        恶性循环）没有强有力向上力量无法打破，历史上每次都靠 GJD 买入终结→此类下跌的判断
        重心从"何时跌够"转为"GJD 何时进场、以什么形式进场"
      data: []
    - step: 4
      name: 救市形式与力度校准
      question: 若 GJD 介入，托的是什么底、力度够吗？
      action: >-
        GJD 增持央企/宽基 ETF 直接托的是指数底与权重底，科技等成长底仍需自身筹码出清确认；
        单日拉抬对科技情绪帮助有限，护盘需持续一至两周才有效；注意机构互爆历史样本少，
        GJD 的经验在散户杠杆爆仓（2015年），机构互爆的资金规模难判断，救市力度存在不确定性
      data: [领跌结构]
  falsification:
    - 暴跌中融资余额骤降且龙虎榜显示散户席位割肉为主（实为融资盘互爆，归因三分法误判主体）
    - 机构互爆循环在未见 GJD 级买入的情况下自行终结（"只能靠GJD打破"被证伪）
    - 外围市场同步暴跌被证明是主因（外围传导剧本误判为内部互爆）
  validation:
    historical_hit_rate: null   # 入库前必须经回测/盲测回填
    applicable_regime: null
    known_failures: []
