  statement: PE切PS是卖方给出的估值叙事，方向上认同——开放权重模型削弱了模型层的垄断租金，国内头部云厂出于合规不直接持有受管制的海外卡、国产先进制程新产能尚未有效释放，使算力租赁成为国内高端算力近乎唯一的来源，这个位置本身有租值；但落地要看两件事：一是Token分成能否写进合同结构、回款周期多长，二是上架率与单卡回本周期是否真的改善；在这两个数据出来之前，PS估值只是叙事，不是定价依据。
  evidence_quote: 个人判断，PE切PS是卖方给出的估值叙事，方向上我认同…但落地要看两件事：一是Token分成能否写进合同结构、回款周期多长；二是上架率与单卡回本周期是否真的改善。在这两个数据出来之前，PS估值只是叙事，不是定价依据。
  interpretation: 对估值叙事的证伪框架：叙事成立需两个数据验证（Token分成合同化+回款周期、上架率+单卡回本周期），数据未出前不按PS定价——避免被卖方叙事带着走。
