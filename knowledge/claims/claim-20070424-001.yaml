  subject: 牛市暴跌的性质与V型顶判断
  topic: 牛市调整以暴跌形式宣泄，真正大顶都是反复冲击出来的而非V型
  statement: 牛市中的调整以暴跌形式宣泄，与熊市中的大反弹对称：来得猛烈疯狂，但过后该干什么还是什么；空头盼望的暴跌永远与空头无关，因为思维惯性使空头永远没机会在满意的地方获得满意的筹码。所有真正的大顶都是反复冲击出来的，有足够的时间让人反应判断，V型顶在大型走势中基本不会构成真正的顶部。历史案例：1996年12月政策打击下指数连续跌停、1250点上几天跌到850点附近，结果依然继续上涨；熊市大反弹案例如停国债期货那次，三天指数从550不到翻上920，后面依然继续下跌回来。
  evidence_quote: 暴跌，对于牛市行情来说，就如同一夜情，猛烈而刺激，但实质上，一夜情就是一夜情，419 后，该干什么还是什么……所有真正的大顶，都是反复冲击出来的，有足够的时间让你去反应判断，那种V 型顶，在大型走势中基本不会构成真正的顶部……而牛市中的暴跌，最出名的算是96 年12 月那次，由于政策打击，连续跌停下来，1250 点上几天跌到850 点附近，结果依然继续上涨。
  interpretation: 这条给出牛市中应对暴跌的结构性判断：单日V型急跌不改变趋势性质，顶部需要反复冲击的结构确认，这与缠论走势类型必须含中枢的理论一致。96年12月为历史案例，仅作形态示例。
