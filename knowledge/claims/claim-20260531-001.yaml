  - id: claim-20260531-001-h
    topic: 加杠杆投资者唯一生存策略是低频重仓
    source_path: sources/raw/财经/周复盘：26-05-31：周度市场复盘-美股高盛标普500调整研判，原油黄金走势分析与A股操作策略.md
    source_date: 2026-05-31
    source_type: 周复盘
    extracted_at: 2026-05-31
    claim_type: methodology
    subject: 加杠杆投资者唯一生存策略是低频重仓
    timeframe: permanent
    statement: 加杠杆资金存在资金成本，没有试错资格，分仓收益率无法覆盖成本。唯一生存策略是低频重仓：等待确定性最高的行情再出手，成功翻身必须及时去掉杠杆
    evidence_quote: 加杠杆的资金存在资金成本，网贷的资金成本更高，因此没有试错的资格，也不适合分仓操作，分仓收益率无法覆盖资金成本。唯一的生存策略是低频重仓，必须等待行情确定性最高的时候再出手，一个月或两个月做一次都可以。如果靠低频重仓成功翻身，一定要及时去掉所有杠杆，才能真正实现稳定盈利。
    interpretation: 加杠杆投资者的反常识纪律：①普通投资者的"分仓分散风险"对加杠杆者不适用，因为分仓收益无法覆盖资金成本；②"低频"优先于"重仓"：先保证出手次数少、胜率高，再谈仓位；③试错行情（如近期）不适合参与，应空仓等待；④成功翻身后的关键动作是去杠杆，否则盈利会被资金成本侵蚀。这是博主针对充电用户中大量加杠杆群体的特别警示。
