  evidence_quote: 代价：确认要等——有背离组中位数晚 24 个交易日，那时价格已离低点约 9.1%。守住：此后 60 个交易日不再跌破该低点（确认组从确认日算起）。波段低点需事后 10 个交易日才能确认；样本有限，统计不代表未来。
  interpretation: 这条明确了确认的适用边界和评价口径：既要看成功率，也要看等待时间、介入价格与样本定义，不能把历史统计当成无条件收益承诺。
