  subject: 柱体读速度而零轴读强弱
  timeframe: permanent
  statement: MACD 柱体的伸缩首先描述速度变化，不应直接等同于价格方向：红柱变长为上涨加速，红柱变短为仍在涨但减速；绿柱变长为下跌加速，绿柱变短为仍在跌但减速。金叉和死叉表示速度拐头向上或向下，DIF 位于零轴上方或下方则用于判断整体偏强或偏弱。
  evidence_quote: 一张表，记住 MACD：红柱变长—上涨在加速；红柱变短—还在涨，但在减速；绿柱变长—下跌在加速；绿柱变短—还在跌，但在减速；金叉/死叉—速度拐头向上/向下；快线在零轴上/下—整体偏强/偏弱。
  interpretation: 课程把‘方向、速度、强弱’分开：柱子变短并不必然意味着已经反转，零轴位置也不能单独替代后续价格确认。
