  subject: 级别联立的立体分析
  topic: 各级别走势发展独立，多级别联立使走势边界条件异常简单，必须立体地看
  statement: 有了自相似性结构，任何一个级别里的走势发展都是独立的，例如在30分钟的中枢震荡与5分钟的上涨走势，两个级别之间并不会互相打架，而是构成一个类似联立方程的东西：单一个方程的解很多，联立起来解就大幅度减少了。级别的存在使得对走势的判断可以联立，也就是可以综合起来系统地看，这样走势的可能走势的边界条件就变得异常简单。所以看走势不能光看一个级别，必须立体地看，否则就是浪费了自相似性结构给你的有利条件。
  evidence_quote: 任何一个级别里的走势发展都是独立的，也就是说，例如，在30 分钟的中枢震荡，在5 分钟的上涨走势，那么两个级别之间并不会互相打架，而是构成一个类似联立方程的东西，如果说单一个方程的解很多，那么联立起来，解就大幅度减少了。也就是级别的存在，使得对走势的判断可以联立了……所以，看走势，不能光看一个级别，必须立体地看，否则，就是浪费了自相似性结构给你的有利条件。
  interpretation: 这是多级别分析的方法论说明：级别间独立不是孤立，而是互相约束的方程组。与第73课用同一级别横切面与不同级别纵向比较两种视角看走势的说法一致。
