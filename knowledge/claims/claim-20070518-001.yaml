- id: claim-20070518-001-c
  source_path: sources/chanlun/lesson_052.md
  source_date: '2007-05-18'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 级别的模式同构性
  topic: 不同级别之间的基本模式同构，理论适用于任何操作级别，操作级别是不患的前提
  statement: 不同级别之间的基本模式是同构的，这是市场的一个基本特征，其存在根源是市场参与者有着基本相同的结构，即贪嗔痴疑慢。因此理论适用于任何操作级别的人。所有的市场都必然只是你当下观察、操作中的市场，而观察、操作必须有一个不患的前提，就是你的操作级别，这是事先确立的。
  evidence_quote: 所以，本ID 的理论里，可以适用于任何操作级别的人，因为不同级别之间的基本模式是同构的，这就是市场的一个基本特征。注意，这特征不是理所当然的，这个特征之所以存在，归根结底，就是市场参与者有着基本相同的结构，这结构，归根结底，就是贪嗔痴疑慢。
  interpretation: 自相似性是缠论级别体系的人性假设基础：模式同构不是经验巧合而是参与者心理结构的必然，这解释了为什么同一套中枢、背驰语言可以在从1分钟到年线的任何级别上复用。
