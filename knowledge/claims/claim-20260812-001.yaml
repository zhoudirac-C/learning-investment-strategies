  subject: 2万亿整数关口别当铁底，击穿后增量资金反成砸盘主力
  timeframe: trend
  statement: 昨天延续周一的缩量，两市成交2.32万亿、再缩2021亿。这个量能水平的直接后果，就是既涨不动、也砸不下去。情形A（横盘用时间换空间）：量能重新缩至2万亿一线是需要重点确认的节点，此时指数不需要下台阶但热点会进一步收敛到少数方向，做的是结构不是仓位。情形B（一举突破4000点）：则需要放量确认，3万亿与3.5万亿是两道要留意的坎，没有量的突破只是把上方套牢盘重新激活。要对2万亿这类整数量能位保持怀疑——它和3000点保卫战是一个道理，喊得越多说明被击穿的次数越多。参考2025年10月中旬与2026年2月中旬两次缩量过程，若2万亿最终被击穿，前期涌入的增量资金会反过来成为砸盘的主力。同时要跟踪增量资金的集中度：增量越集中在少数高位科技股，全市场的承接力就越脆弱。
  evidence_quote: 要对 2 万亿这类整数量能位保持怀疑——它和 3000 点保卫战是一个道理，喊得越多，说明被击穿的次数越多，整数位看似牢固，实则最具迷惑性。参考
    2025 年 10 月中旬与 2026 年 2 月中旬两次缩量过程，若 2 万亿最终被击穿，前期涌入的增量资金会反过来成为砸盘的主力。
  interpretation: UP警告2万亿整数关口非铁底（历史被击穿多次）；情形A缩至2万亿=横盘做结构，情形B突破4000需3万亿/3.5万亿放量；击穿2万亿则增量资金反成砸盘主力；跟踪增量资金集中度。
