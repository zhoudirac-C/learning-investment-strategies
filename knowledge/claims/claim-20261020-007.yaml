  subject: 趋势是方向加能量多次踩踏致混沌
  timeframe: trend
  statement: 趋势分开说是『趋（方向）+势（能量）』，方向由能量决定——看涨的人多（尤其有定价权的机构）就涨，看跌的人多就跌；一旦出现多次踩踏、行情拉扯不清的混沌行情，只能做多的市场就容易一有点风吹草动集体踩踏。
  evidence_quote: 兵败如山倒，什么是趋势，分开来说，趋就是方向，势就是能量，方向是由能量决定的，看涨的人多（尤其是具有一定定价权的机构们就涨），看跌的人多就跌，但是一旦出现多次踩踏，多次行情拉扯不清的混沌行情，在我们这种只能做多的市场就很容易因为担心风险，一有点风吹草动就集体踩踏。
  interpretation: 鳄鱼派对『趋势』的拆解定义：趋=方向、势=能量，方向由能量（多空力量对比）决定。关键推论：A股只能做多+多次踩踏后会进入『混沌期』，此时市场极度脆弱、任何风吹草动都引发集体踩踏——这是底部区域波动剧烈的制度性原因。
