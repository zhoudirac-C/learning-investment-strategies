chain_id: ai-storage
name: 存储芯片产业链
thesis: 存储涨价周期启动 + AI服务器HBM需求爆发 + 长江存储科创板IPO→ 上游设计（DRAM/NOR）涨价 → 中游晶圆代工满产→ 中游封测（HBM配套）放量
  → 下游AI服务器/手机/PC需求确认
last_verified: '2026-08-30'
segments:
- id: seg-design
  name: 上游设计
  materials:
  - DRAM/NAND主控
  - NOR Flash
  value_share: ~35%
  barrier: 先进制程产能
  trend: 涨价
- id: seg-fab
  name: 中游制造
  materials:
  - 晶圆代工
  - 存储模组
  value_share: ~30%
  barrier: 晶圆产能
  trend: 满产
- id: seg-pkg
  name: 中游封测
  materials:
  - 存储封测
  - HBM配套
  value_share: ~20%
  barrier: 封测产能
  trend: 放量
- id: seg-app
  name: 下游应用
  materials:
  - AI服务器(HBM)
  - 手机/PC
  value_share: ~15%
  barrier: HBM供给
  trend: 高增长
mappings:
- code: '603986'
  name: 兆易创新
  segment: seg-design
  relation: DRAM/NOR设计龙头
  elasticity: core
- code: 001309
  name: 德明利
  segment: seg-fab
  relation: 存储模组
  elasticity: elastic
- code: '688766'
