  subject: 物理与几何的高度统一
  timeframe: permanent
  statement: 现代物理的一个核心概念是物理与几何的高度统一，本质上现代物理就是一门几何学，只不过是各种不同高深的几何学；几何的领域可以涵盖并超越思维的所有方面。
  evidence_quote: 现代物理的一个核心概念，就是物理与几何的高度统一。本质上，现代物理就是一门几何学，只不过是各种不同高深的几何学。而几何学也不是一般认为的那些几何学，几何的领域，可以涵盖并超越你思维的所有方面。
  interpretation: 这是理解缠论能量动力结构所需的世界观前提：把物理问题几何化，用结构而非数值计算来把握能量动力，这与缠论用几何结构描述走势的方法论同源。
