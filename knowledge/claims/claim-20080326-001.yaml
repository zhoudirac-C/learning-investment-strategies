  timeframe: permanent
  statement: 广义相对论是第一种真正意义上的现代物理学，其基础是几何（一种比较简单的几何学）；在广义相对论中，物质结构与几何结构高度统一，引力等结构对应着一些特殊的几何结构。
  evidence_quote: 广义相对论是第一种真正意义上的现代物理学，而其基础是几何，一种比较简单的几何学……那里，物质结构与几何结构是高度统一的，而诸如引力结构等对应着一些特殊的几何结构
  interpretation: 缠师以广义相对论为范例说明物理结构可以几何化表达：物质分布决定时空几何，几何结构反过来刻画引力。这为走势的能量动力形态几何化提供了类比模板。
