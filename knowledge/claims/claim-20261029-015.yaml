subject: 谷歌业绩：云端高增仍难抵预期落差，搜索减速、自由现金流为负，估值需更完整盈利兑现
timeframe: temporary
statement: 谷歌云收入307.1亿美元（+103%、高于共识291.8亿），但搜索及广告减速、费用压力与自由现金流为负（约-90.7亿美元）使整体预期落差无法被单一业务弥补；高估值需要更完整的盈利和现金流兑现。
evidence_quote: 谷歌云收入307.1亿美元，同比增长103%，高于约291.8亿美元、增长92%的市场共识。搜索及其他业务收入633.5亿美元，同比增长12.0%，低于约648.7亿美元、增长14.7%的市场预期。自由现金流约为负90.7亿美元，弱于约负41亿美元的机构预期。高增长与高估值之间仍需更完整的盈利和现金流兑现。
interpretation: UP 对谷歌业绩的判断区分了“超过一致预期”和“超过高预期资金的要求”两个层次，并强调高估值在投入扩大时需要更完整的盈利与现金流兑现，而非仅靠云业务增速弥补整体预期落差。
