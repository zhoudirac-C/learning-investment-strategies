  subject: 首阴战法的严格前提是突发分歧
  timeframe: permanent
  statement: 首阴只是形态描述（上涨中第一根明显阴线），首阴战法中的首阴是特定资金结构下的交易机会，两者必须分开：具备博弈意义的首阴要求阴线出现之前股票仍处于极强流畅、没有明显走弱酝酿的状态，下跌是突发的；如果此前已连续滞涨、突破失败、分时走弱，再出现大阴线属于弱势信号的集中兑现，不能用首阴战法去做。博弈的不是第一次下跌本身，而是极强趋势是否会在第一次突发分歧之后迅速恢复。
  evidence_quote: 真正具备博弈意义的首阴通常需要满足一个严格的前提，就是在阴线出现之前，股票仍处于极强流畅没有明显走弱酝酿的一个状态。也就是说它的下跌是突发的。如果一只股票此前已经连续地滞涨、突破失败、分时走弱，后面再出现一根大阴线，这种是弱势信号的一个集中兑现，就不是首阴了，你就不能用首阴战法去做。
  interpretation: 首阴战法的滥用源于把形态词当策略词：UP划定的边界是"无酝酿的突发"，前置弱化史直接取消战法资格——这也是识别时先回看前3-5个交易日有无冲高回落、放量滞涨、多次突破失败的原因。
