  subject: 两类涨价逻辑——区分高端需求 vs 高端挤占被动涨价
  statement: 选择上游材料标的必须严格区分两类涨价逻辑：一类是高端产能需求自身爆发引发的涨价（如 HBM、12英寸硅片、0402/0201 MLCC、M7-M9
    CCL）；另一类是高端产能挤占普通产能引发的被动涨价（如 DDR3/4、8/6英寸硅片、0603/0805 MLCC）。AI 行情与新能源行情的本质区别在于：高端产能扩产难度更大、释放更慢，这是判断涨价能否持续的关键变量。
  evidence_quote: 后市一定要重视扩产壁垒高、产能释放慢的环节，同时要严格区分两类涨价逻辑——一类是高端产能需求自身爆发引发的涨价，另一类是高端产能挤占普通产能引发的被动涨价。最典型的对照就是HBM与DDR3/4...AI行情与此前新能源行情的一个本质区别，正在于高端产能的扩产难度更大、释放更慢。
  interpretation: 这是 UP 选上游材料的核心分析框架。判断路径：①确认该环节是高端需求拉动（非被动转产）→ ②确认扩产壁垒高/周期长 → ③涨价可持续
    → ④股价可跟踪。反例：被动涨价类标的在产能转回后会迅速回落，不适合做趋势持有。这个框架直接决定了在 AI 上游材料中选什么、排除什么——选 12 英寸硅片（高端需求）、排除
    8/6 英寸（被动溢出的产能）。
