- id: claim-20070815-001-b
  source_path: sources/chanlun/lesson_070.md
  source_date: '2007-08-15'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 中枢形成后的三种走势
  topic: 中枢后只有三买上移、三卖下移、延伸或扩展三种分类，无须预测只需观察
  statement: 一个中枢形成后，理论上只有三种走势：一、向上出现第三类买点，走出次级别向上走势类型，然后构成新的同级别中枢；二、向下出现第三类卖点，走出次级别向下走势类型，构成新的同级别中枢；三、中枢延伸，或出现第三类买卖点后扩展成大级别中枢。在行情发展中没必要去预测走势选择什么，走势自然选择，只需要观察着就可以，然后按自己的操作级别反应：按大级别操作的，小级别中枢移动、震荡之类的活动根本无须理睬，只要看明白；按小级别操作的，不参与大于本级别级别的震荡，等本级别上涨出现背驰后走人，再按震荡走势回补。
  evidence_quote: 一般来说，形成这个5 分钟中枢后，在理论上只有三种走势：1：向上出现第三类买点，走出1 分钟向上走势类型，然后构成新的5 分钟中枢；2、向下出现第三类卖点，走出1 分钟线向下走势类型，构成新的5 分钟中枢。3、中枢延伸，或出现第三类买卖点后扩展成大级别的30 分钟中枢。显然，在行情发展中，没必要去预测走势选择什么，走势自然选择，只需要观察着就可以……如果是按30 分钟操作的，这些5 分钟的中枢移动、震荡之类的活动根本无须理睬，只要看明白就是，根本无须操作。
  interpretation: 中枢后三分类是完全分类预测法的标准件，可直接套用于任何级别的中枢，与68课不测而测配套：三种分类各配预案，市场自己选择。
