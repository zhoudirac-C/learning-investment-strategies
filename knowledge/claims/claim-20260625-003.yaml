  timeframe: trend
  statement: 6月25日盘后引用中邮研报：有研粉材(688456)与华为合研的新型散热铜粉已应用于昇腾910B芯片，散热效率较传统铜粉提升10%-20%、属行业首创，目前月出货达吨级。公司亦是国内为数不多能批量生产T7锡粉的企业，单个1.6T光模块需锡粉1.8-2.16g，预计2027年6N/7N锡粉需求达194吨，有望切入光模块高端锡膏市场。
  evidence_quote: 有研粉材：金属粉体龙头，绑定昇腾+切入光模块锡膏。据中邮研报：公司与华为合研的新型散热铜粉已应用于昇腾910B芯片，散热效率较传统铜粉提升10%-20%、属行业首创，目前月出货达吨级；25年中国AI加速卡出货约400万张、国产芯片约165万张（华为81.2万张），散热铜粉需求确定性增长。公司亦是国内为数不多能批量生产T7锡粉的企业，单个1.6T光模块需锡粉1.8-2.16g，预计27年6N/7N锡粉需求达194吨，有望切入光模块高端锡膏市场。
  interpretation: UP看好有研粉材(688456)的双主线逻辑：一是绑定华为昇腾散热铜粉，国产AI加速卡放量带来确定性需求；二是切入1.6T光模块高端锡膏市场，2027年需求有望达194吨。公司在金属粉体领域的技术壁垒是核心优势。
