  subject: 上游物料被证伪-中游算力改善预期
  timeframe: short-term
  statement: 科技调整中PCB、MLCC领跌传导至光互联上游芯片，导火索是铜冠铜箔(301217)业绩不及预期。被证伪的是上游物料的无差别高景气，而非算力需求本身；上游让利反而意味着中游企业普遍预期向好，三季度预期有望进一步提升。盘面上大光（光模块龙头中际旭创(300308)/新易盛(300502)/天孚通信(300394)）尾盘拉升可作佐证。
  evidence_quote: 要看清这次证伪的边界：被证伪的是上游物料的无差别高景气，而不是算力需求本身；上游让利反而意味着中游企业普遍预期向好，且三季度预期有望进一步提升。盘面上大光（光模块龙头方向）尾盘均有一定程度拉升，可作佐证。
  interpretation: UP明确区分证伪边界：上游物料被证伪但算力需求不变，这是板块内部轮动而非全面转向。上游让利利好中游，中游算力硬件三季度预期改善。大光（中际旭创(300308)/新易盛(300502)/天孚通信(300394)）尾盘拉升作为佐证。均为创业板不可交易。铜冠铜箔(301217)为创业板不可交易。
