  subject: 市场阶段——失守4000点，恐慌进入中后段
  timeframe: short-term
  statement: 上证失守4000点心理关口，大跌进一步加剧恐慌。但上证已自高位回落约300点，距年内低点3794点仅150多点。基于空间与情绪的概率判断：越是恐慌，越可能说明下跌已进入中后阶段。但这不是对底部的确认——底部钝化已消失，见底后反弹的时间和持续性都不易判断。
  evidence_quote: 尽管大跌进一步加剧恐慌，但上证指数已自高位回落约300点，距年内低点3794点仅150多点。若以此衡量，市场越是恐慌，越可能说明下跌已进入中后阶段。需要强调，这是基于空间与情绪的概率判断，并非对底部的确认。
  interpretation: |
    UP将生命线从4033下调至4000——目前已跌破。但恐慌中后段≠立即抄底：①底部钝化消失→反弹时空不确定②下一次买点以趋势为准：突破4120才确认回归上升趋势③在此之前以观望与纪律为主。

    对比6/4的生命线体系(4033清仓/4130满仓)：当前4000已破但UP未说清仓，态度从"4033清仓"转为"观望不杀跌"——这是对磨底期策略的修正。
