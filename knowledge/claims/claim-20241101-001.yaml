  subject: 短线选股后的基本面持有规则
  topic: 口诀选股后按短期基本面好坏决定持有时长
  timeframe: permanent
  statement: 用口诀选出股票后必须再分析公司短期基本面：基本面好可以拿得久一点，基本面不好则盈利后马上走
  evidence_quote: 那么通过这个口诀选完股之后，你要分析一下这家公司的基本面在短期内好还是不好。如果好的话可以拿得久一点，如果不好的话马上就盈利就走。
  interpretation: 技术信号只解决「何时买」，持有时长由短期基本面决定——防止把纯技术形态股捂成长线，是技术选股与基本面过滤的搭配规则。
