- pattern_id: gator-ch44-insight-soul-sector
  school: gator
  name: 短线洞察力：灵魂板块与灵魂个股
  chapter: 44
  description: 鳄鱼派（gator school）第44章：短线洞察力：灵魂板块与灵魂个股。 灵魂板块 = 决定全市场情绪的 1-2 个板块（它涨能把市场捞起来、让上涨家数/涨停数增多） 灵魂个股 = 板块内 1-几个核心票；每个阶段不一样，必须持续更新 IF 找灵魂板块 THEN 必找**有容量**的（能出涨停潮、对指数与上涨家数贡献大） 容量太小（传媒/农业/黄酒）即使涨停潮也影响不了全市场 → PASS 用于鳄鱼派资金生态位与规则体系的判断。
  trigger:
  - IF 找灵魂板块 THEN 必找**有容量**的（能出涨停潮、对指数与上涨家数贡献大）
  - 例外：IF 大容量板块都走不出行情（非牛市） THEN 才看小容量
  - IF 判断灵魂个股 THEN 看"对它接下来走势影响事关重大/这波上涨由谁做出主要贡献"
  - IF 指数大跌但仍有板块被资金点火 THEN 市场没死，把它列入观察池（9/28 是整车、风电）
  - IF 观察新板块 THEN 判断它处在一鼓作气（要信早信）/二浪分歧/三浪分歧转一致/五浪 的哪一段
  - IF 做短线题材 THEN 不要追求确定性，一边走一边试："打一枪看看情况，好就留，不好就走"
