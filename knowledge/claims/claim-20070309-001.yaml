- id: claim-20070309-001-r
  source_path: sources/chanlun/lesson_035.md
  source_date: '2007-03-09'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 缠中说禅买卖点级别定理
  timeframe: permanent
  statement: 缠中说禅买卖点级别定理：大级别的买卖点必然是次级别以下某一级别的买卖点，但不一定就是次级别的买卖点；这就是为什么有时候一个1分钟的背驰就会引发大级别下跌的原因，而在最规范的走势中，大级别的买卖点刚好是下面所有级别的买卖点。
  evidence_quote: 根据“缠中说禅走势分解定理”，很容易就证明“缠中说禅买卖点级别定理”：大级别的买卖点必然是次级别以下某一级别的买卖点。……但注意，大级别的买卖点不一定就是次级别的买卖点……这也是为什么有时候，有时候一个1
    分钟的背驰就会引发大级别下跌的原因。在最规范的走势中，该大级别的买卖点刚好是下面所有级别的买卖点。
  interpretation: 该定理是区间套方法的理论依据：抓大级别买卖点可以逐级向下在更小级别精确定位。同时它解释了小级别背驰撬动大级别转折的现象，并指出各级别买卖点共振只出现在最规范的走势中，实操不能默认共振成立。
