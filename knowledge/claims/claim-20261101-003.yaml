statement: 反弹强度要由开盘后的承接和扩散来确认，周一需要看尾盘承接能否延续到全市场；宽基ETF尾盘买盘是积极信号，但成交放大与分时上拉只能说明承接增强，无法单凭盘口确认资金身份，更不能等同于持续增量已经入场。
evidence_quote: 反弹预期仍在，但强度要由开盘后的承接和扩散来确认。从我的盘面观察看，几个宽基ETF在最后20分钟出现较强买盘，这是周五留下的积极信号。不过，成交放大与分时上拉只能说明承接增强，无法单凭盘口确认资金身份，更不能直接等同于持续增量已经入场。周一需要看尾盘承接能否延续到全市场。
interpretation: 尾盘ETF承接是积极信号，但需开盘后承接延续到全市场才能确认反弹强度，不能过早认定增量资金入场。
