  subject: K线形态（上吊线）
  topic: 上吊线（高档）和铁锤线（低档）：同形态不同位置含义相反
  statement: 上吊线：实体很小（红黑均可），下影线极长（实体2-3倍），上影线极短或无，出现在上涨末端。含义是空方第一次有了进攻能力——当天虽被多方救回，但暴露了对手力量。次日需高开高走化解，否则减仓30-50%。铁锤线：同一形态出现在下跌末端，含义相反——长下影线说明当天空方打压被多方全部接回，是空方力竭+多方接盘的信号，长下影线越长承接越强。小仓位博弈反弹，严格止损。核心原则：在上涨末端，长下影线=空方觉醒；在下跌末端，长下影线=多方觉醒。位置决定意义。
  evidence_quote: 之前多方掌控的局面开始发生松动，这就是上影线比较反直觉的地方，它不是因为今天发生了什么坏事而成为警告，而是因为今天暴露了一个之前没有过的对手方的一个力量...同一根样子的K线，你可以是看涨也可以是看跌。所以完全取决于它出现的位置。
  interpretation: 上吊线的反直觉之处：它不是看收盘（价格被救回），而是看过程（空方第一次把价格打下去）。化解条件明确：次日高开高走。铁锤线是同一形态在低位的看多变体。
