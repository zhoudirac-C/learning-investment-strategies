  subject: 结构性牛市忌又贪又怂畏高扎堆低位
  timeframe: trend
  statement: 做交易最忌又贪又怂：涨得好的方向不敢去、怕高；又不甘心赚小钱，于是往低位扎堆，用位置低安慰自己。但结构性牛市中，低有低的原因，高有高的理由，强者恒强从不是偶然
  evidence_quote: 做交易最忌又贪又怂，涨得好的方向不敢去，怕高；又不甘心赚小钱，想赚大钱，于是只能往低位扎堆，用位置低安慰自己。但你要理解什么是结构性牛市，低有低的原因，高有高的理由，强者恒强从不是偶然。
  interpretation: UP直接批判了'畏高+贪大'的交易心理：害怕追强势方向、又不想只赚小钱，于是自我安慰式地买低位品种。但在结构性牛市中，低位往往有基本面的低的原因，高位有高的理由。'强者恒强'是结构性行情的核心特征。这条方法论对应当前市场——科技方向强势（科创50+5%），煤炭等低位方向走弱，追低避高恰恰是错误策略。
