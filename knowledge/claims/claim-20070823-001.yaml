  subject: 长线投资的三系统组合方案
  topic: 龙头与成长股按固定比例配置，借中枢震荡把成本降为零，以比价关系发现低估
  statement: 针对大级别中枢上移机会的长线投资方案：一、用最大比例如七成的资金投在行业龙头企业中，其余三成放在最有成长性的企业中，龙头企业基本面显示必然败落时就选最好的替代者；二、只要行业顺序不变，投资比例就不变，基本面出现明显的行业地位改变迹象时按等市值换股；三、充分利用可操作级别的中枢震荡，把所有投资成本变为0，然后不断增加可持有筹码；四、密切关注比价关系即市值与行业地位的关系，发现其中低估的品种。注意，任何的投资必须是0成本才是真正有意义的。该策略是基本面、比价关系与技术面三个独立系统的完美组合，适合大资金，小资金可用简略版只跟踪龙头或最有成长性的一家。
  evidence_quote: 一、用最大的比例，例如70%，投在龙头企业（可能是两家）中，然后把其他30%分在最有成长性（可能是两三家）的企业中……二、只要这个行业顺序不变，那么这个投资比例就不变，除非基本面上出现明显的行业地位改变的迹象，一旦如此，就按等市值换股……三、这就是本ID 理论的独门武器了，充分利用可操作的中枢震荡（例如日线、周线等），把所有投资成本变为0，然后不断增加可持有筹码……注意，任何的投资，必须是0 成本才是真正有意义的……这个策略，就是基本面、比价关系，与技术面三个独立系统完美的组合。
  interpretation: 行业筛选前提：远离那些注定没有季线甚至月线以上级别中枢上移的行业，其企业最终都是某级别的中枢震荡。0成本概念在第74课再次出现为彻底逃避市场风险的唯一办法，两课互相印证。原始资本积累期的小资金可用小级别快速积累，资金到一定规模后小级别就没有太大意义。
