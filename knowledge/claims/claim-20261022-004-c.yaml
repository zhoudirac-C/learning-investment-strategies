statement: 本轮赎回烈度将显著小于 2022 年：2022 年有宏大叙事（酒药风光锂）与基金发行广度巅峰加持，赎回持续"一年半载"、每天杀一个权重；本轮增量资金主要是基民追涨、叙事广度远不如前，所以赎回节奏已经很快、更接近尾声
evidence_quote: 因为当时的宏大叙事太多了。啊，当时的宏大叙事是酒药风光锂……比这次的还要还要猛。所以那时候赎回搞了很久，一年半载……其实这一轮节奏已经很快了。
interpretation: 用"叙事广度×发行广度"双维度解释赎回潮的持续时间：赎回杀伤力的本质是被套资金的广度与深度。本轮资金结构单一（基民追涨盘）、缺宏大叙事托底，因此赎回既猛且短。这为"阶段寻底"判断提供了跨周期证据，也把"跌得凶"与"跌得久"分开——本轮是前者。
