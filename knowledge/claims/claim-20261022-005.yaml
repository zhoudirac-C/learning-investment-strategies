  subject: 跌的都是蓝筹白马说明在争夺核心资产定价权
  timeframe: short-term
  statement: 当天主要下跌的权重——移动、腾讯、甚至福耀玻璃和格力全部爆杀，宁德时代(300750)一口气跌十几个点拖累创业板41个点——跌的都是蓝筹白马，这一定程度代表了中国核心资产的定价权争夺，这也就不难看出为什么近期放量的ETF几乎上证50占大头。
  evidence_quote: 不过看到今天主要下跌的权重后，心里有一丝寒意，不管是移动、腾讯，甚至福耀玻璃和格力这种，全都是爆杀，宁王今天一口气跌十几个点，拖累创业板指数41个点，这分明是有外资趁宁王业绩不佳顺势杀盘来的。不知道各位伙计有没有发现，跌都是蓝筹白马，这一定程度上代表了中国核心资产的定价权，这就不难看出为什么近期放量的ETF几乎上证50占大头了。
  interpretation: 鳄鱼派的重要方法论：把『跌的是什么』作为判断依据——跌的全是蓝筹白马（中国移动/腾讯/福耀玻璃/格力/宁德时代）说明是外资在争夺中国核心资产定价权，而非普跌。护盘方对应的策略就是放量上证50ETF(510050)——护的是核心资产定价权，不是护指数点位。
