  subject: 集合竞价看盘时段
  topic: 集合竞价只看9点20分至9点25分不可撤单时段
  timeframe: permanent
  statement: 集合竞价9:15-9:20挂单可以随时撤，该区间的竞价表现不用管；9:20-9:25才是判断抛压、承接和多空胜负的关键时段
  evidence_quote: 先明确一个时间点，9点15分到9点20分，这一段时间呢，集合竞价你挂单是可以随时撤单的。所以这个区间的竞价表现我们不用管。我们主要看9点20分到9点25分。这个时间段呢，可以判断抛压，还有承接，可以判断是多方赢还是空方赢。
  interpretation: 9:20前的封板可以是主力试错甚至诱多（可撤单无成本），9:20后不可撤单的资金才是真实意愿。看竞价的正确窗口是9:20-9:25。
