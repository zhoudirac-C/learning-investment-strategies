  subject: 中线做T加短线打野组合拳
  topic: 中线做T加短线打野的账户组合拳模式
  timeframe: permanent
  statement: 整体模式是组合拳：中线仓持有与大盘共振的股不断做T，短线打野胜率保持在七成或以上，打野赚的钱不断加回中线股滚动做T，整个账户就能不断趋势向上
  evidence_quote: 那我们不断的做T，配合短线的打野啊。如果我们打野的胜率能够在七成或以上啊，那么我们打野赚的钱呢就能不断的再加加到我们中线股来不断做T轮动。假设咱们做T出神入化啊……那短线胜率又高，那我们整个账户的一个不断趋势向上的啊，那也就是一个无敌。
  interpretation: 这是UP自陈的整体账户方法论：中线仓是本金锚、做T降成本，短线打野是利润增量，两者闭环互哺。UP自评「资质平庸的免费博主」，所以中线选券商这类高确定性共振品种。
