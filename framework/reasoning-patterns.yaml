      evidence_sources:
      - 2026-04-09 午盘行情
      - 昨日全市场普涨
    - step: 2
      name: 检验指数韧性
      question: 面对外部利空，指数能否承接？
      UP_logic: 盘前受地缘扰动集体低开，随后震荡回升、深成指翻红：抗住利空说明分歧是消化而非退潮。
      evidence_sources:
      - 盘前地缘局势
      - 指数低开回升数据
    - step: 3
      name: 检查主线结构
      question: 主线内部是否保持完整进攻梯队？
      UP_logic: 东山精密连板、昨日中军震荡、光迅科技/华工科技低位补涨：龙头-中军-低位结构完整，分歧良性。
      evidence_sources:
      - 东山精密涨停
      - 光迅科技/华工科技补涨
    - step: 4
      name: 对比扩散方向强弱
      question: 资金是抱团核心还是撤出主线？
      UP_logic: 国产算力/AI软件偏弱，算力租赁内部分化，资金更青睐主线核心与趋势品种，非核心弱化反衬主线资金介入深。
      evidence_sources:
