  subject: 缠中说禅走势分解定理二
  timeframe: permanent
  statement: 缠中说禅走势分解定理二：任何级别的任何走势类型，都至少由三段以上次级别走势类型构成；高级别走势类型不一定直接由次级别走势类型连接而成，但通过拆散重分，必然可以分解为若干次级别走势类型的连接。
  evidence_quote: 但我们还可以通过拆散重分，使得一个高级别的走势类型必然就是由几个次级别的走势类型连接而成，由于中枢里至少有三段次级别走势类型，所以就有了“缠中说禅走势分解定理二”：任何级别的任何走势类型，都至少由三段以上次级别走势类型构成。
  interpretation: 定理二给出走势分解的最小结构保证：任何走势类型至少含三段次级别走势，这源于中枢至少由三段次级别走势构成。它保证了向次级别分解的操作永远可行，是背驰判断和区间套定位的理论前提。
