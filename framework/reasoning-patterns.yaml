- pattern_id: position_by_cycle
  name: 周期位置→操作映射框架
  description: 当需要把市场状态推导为具体操作动作（加仓/减仓/做T/观望/不操作）时使用。核心原则是"动作由周期位置决定，不由看多看空决定"——同一句"买阴不买阳"在反弹中段成立、在超预期兑现阶段反转。典型查询：现在该加仓还是减仓、这个位置怎么操作、要不要做T、反弹第几天该兑现。该框架先定位周期位置（市场阶段四分+反弹天数）、再定性量价性质（放量攻击/主动降速等六选一）、按"状态→动作"映射表匹配操作，最后用三条元规则（仓位纪律高于判断、确定性决定力度、特定状态最优动作是克制）校验。
  trigger:
  - 需要把市场阶段（主升/震荡/调整/恐慌）与反弹天数结合，给出具体操作动作时
  - 量价性质发生变化（放量攻击转主动降速、缩量企稳转放量兑现）需要重新匹配动作时
  - 反弹进入中后段（第8-10天）、涨停家数萎缩、放量兑现等兑现窗口信号出现时
  - 判断"买阴不买阳/做T压成本/获利了结"等操作纪律是否适用于当前状态时
  source_claims:
  - 反弹初期-仓位放大参与: claim-20260731-018
  - 反弹中段-持股买阴做T: claim-20260814-039
  - 反弹超预期-获利了结: claim-20260813-023
  - 高位兑现-不追高: claim-20260426-001
  - 趋势下跌-买阴仅小仓位博弈: claim-20260611-001-m, claim-20260611-001-l
  - 磨底期-不瞎操作: claim-20260604-004-i
  - 震荡调整-控制操作频率: claim-20260708-002-am
  - 元规则1-仓位纪律高于判断: claim-20260611-001-m
  - 元规则2-确定性决定力度: claim-20260813-046, claim-20260809-030
  - 元规则3-兑现日磨底期克制: claim-20260813-046, claim-20260604-004-i
  data_requirements:
  - name: 市场阶段与反弹天数
    channel: 行情数据（指数K线+反弹起点定位+反弹第几天）
  - name: 量价性质
    channel: 行情数据（成交量形态/分时量能曲线）
  - name: 情绪宽度
    channel: KPL情绪数据（涨停家数/封板率/晋级率）
  - name: 方向确定性
    channel: 主线强度/龙头表现/定价权归属
  steps:
  - step: 1
    name: 定位周期位置
    question: 当前市场处于什么周期位置？
    action: 先回答"在什么位置"再回答"该做什么"。两个维度定位：①市场阶段四分（主升/震荡/调整/恐慌）；②反弹周期天数（第1-2天=初期、趋势未变=中段、第8-10天且放量兑现=超预期兑现阶段）。位置是动作的第一决定变量，不是看多/看空的强度。
    data:
    - 市场阶段与反弹天数
  - step: 2
    name: 定性量价性质
    question: 当前量价是什么性质？
    action: 用六选一（放量攻击/缩量企稳/主动降速/内生瓦解/外力扰动/方向转折）定性当日量价，重点区分"放量攻击"与"主动降速（放量阴线）"——两者量能都大，前者是进攻、后者是兑现。性质是动作的第二决定变量。
    data:
    - 量价性质
  - step: 3
    name: 按状态映射匹配操作
    question: 该状态对应的最优操作动作是什么？
    action: 按周期位置匹配动作：①反弹初期（底部钝化、做空力量释放尾声）→仓位放大参与；②反弹中段（缩量回调、趋势完好）→持股+买阴不买阳+灵活做T；③反弹超预期/高位兑现（放量兑现、涨停家数萎缩、龙头滞涨）→获利了结、降仓位、不急着表态；④趋势下跌（破位、恐慌）→纪律优先、买阴只是小仓位博弈非建仓；⑤磨底期（低容错）→不追高、找低位拿住、不操作；⑥震荡调整（无主线、操作难度大）→降低预期、控制操作频率。
    data:
    - 情绪宽度
    - 方向确定性
  - step: 4
    name: 用三条元规则校验
    question: 匹配出的动作是否违反三条元规则？
    action: 三条校验：①仓位纪律高于判断——动作优先级由状态决定，不由看多看空决定；②确定性决定力度——"买阴不买阳"的前提是方向确定性高，确定性决定敢不敢在阴线上接；③特定状态的最优动作是克制——放量兑现日、磨底期，"不做"优于任何操作模板。
    data:
    - 方向确定性
  falsification:
  - 周期位置定位错误（把超预期兑现阶段误判为中段，导致该兑现时仍输出买阴）
  - 量价性质定性错误（把主动降速误判为放量攻击，把兑现窗口当成进攻信号）
  - 动作与状态失配（在趋势下跌/磨底期输出无条件加仓）
  - 忽略确定性前提（在方向确定性低时套用"买阴不买阳"）
  validation:
    historical_hit_rate: null
    applicable_regime: null
    known_failures: []
  examples:
  - pattern_id: high_level_consolidation_oil_20260423
    name: 高位博弈震荡应对与仓位管理
    source_raw:
    - sources/raw/财经/午盘：26-04-23：高位博弈反复洗盘，上升途中正常震荡，油价100美元关键变量.md
    key_themes:
    - 高位震荡应对
    - 仓位管理
    - 分歧买点
    - 油价关键变量
    - 做T策略
    reasoning_chain:
    - step: 1
      name: 识别市场阶段
      question: 当前行情处于什么阶段？
      UP_logic: 从周二开始，行情更像高位博弈阶段，类似牛市早盘的反复洗盘。
      evidence_sources:
      - K线走势
      - 资金分歧现象
    - step: 2
      name: 定性震荡性质
      question: 这是下跌趋势还是上升中继？
      UP_logic: 不意味着进入下跌周期，更多是上升过程中的正常震荡，上升结构未被破坏。
      evidence_sources:
      - 前高位置
      - 结构判断
    - step: 3
      name: 确立应对原则
      question: 在这种阶段应该如何操作？
      UP_logic: 高潮时不追高，分歧时不失措；上涨途中的分歧理论上属于买点。
      evidence_sources:
      - 利润垫重要性
      - 操作节奏经验
    - step: 4
      name: 识别关键变量
      question: 额外需要关注什么外部变量？
      UP_logic: 真正需要额外关注的变量是石油，若美油持续冲上100美元，通胀和消费担忧会升温。
      evidence_sources:
      - 历史经验
      - 油价数据
    - step: 5
      name: 制定仓位策略
      question: 怎么控制仓位来应对波动？
      UP_logic: 建议仓位保持五成左右，留出空间做T和应对波动。
      evidence_sources:
      - 下午修复可能性
      - 仓位灵活性
    risk_factors:
    - 油价持续站稳100美元上方，通胀担忧压制市场情绪
    - 上升结构被破坏，跌破关键支撑位
    - 下午无法修复，良性分歧转为趋势转弱
    confidence_indicators:
    - 下午市场出现修复，维持强势震荡
    - 分歧后资金回流，量价配合良好
    - 利润垫充足，操作心态稳定
    merge_suggestion: 从市场阶段定位推导操作动作，核心是周期位置决定仓位和策略
  applicable_themes:
