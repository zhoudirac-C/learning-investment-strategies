  timeframe: short-term
  statement: 周五冲高回落的放量阴线属于外力扰动（非农不确定性放大抛压）叠加内生分歧（科技进攻品种连续冲高后需要分歧），且是放量完成的风险释放——周五已把周一的坏消息提前交易了一部分，周一若低开大概率只是定价输入的机械反映，新一轮抛压需要新的触发才会出现；低开不可怕，接不住才可怕。
  evidence_quote: 周五已经把周一的坏消息提前交易了一部分，所以周一的低开若出现，大概率只是定价输入的机械反映，新一轮抛压需要新的触发才会出现；低开不可怕，接不住才可怕。
  interpretation: 关键在'放量'二字：放量完成的调整=风险被真实释放而非积压，与'数据落地后再补跌'路径拉开距离。这为周一操作提供了心理锚：低开属预期内（定价输入），真正要防的是低开后无力承接（接不住），观察点从'方向'转到'承接质量'。
