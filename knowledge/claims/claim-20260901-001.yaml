  subject: PMI结构生产外需修复内需弱，A股走分化不共振
  timeframe: short-term
  statement: 8月官方制造业PMI为49.8%较上月49.2%回升0.6个百分点好于预期，生产指数50.4%、新订单50.6%、新出口订单50.16%均回到荣枯线上方；但非制造业商务活动指数49.0%与上月持平低于预期，非制造业新订单降至44.1%，综合PMI产出指数49.5%。结构是生产端与外需修复、内需仍弱，足以支撑A股不跟随外围系统性下杀，但不足以支撑全面上攻，外围偏弱之下A股内部大概率走分化而不是共振。
  evidence_quote: 这份数据的结构是生产端与外需在修复、内需仍然弱。它足以支撑A股不跟随外围一起系统性下杀，但不足以支撑一轮由基本面驱动的全面上攻，因此外围偏弱之下，A股内部大概率继续走分化而不是共振。
  interpretation: PMI好于预期剪掉系统性下杀情景，但内需弱决定上攻无基础；分化市对应结构性机会，指数级别行情缺基本面驱动。
