sector_rotation_rules:
- id: offensive_vs_defensive
  name: 进攻vs防御风格切换
  offensive_group_ids:
  - cpu_self_development
  - upstream_price_increase
  - liquid_cooling
  - cpo_optical
  - compute_rental
  - mlcc_passive
  - chemical_price
  - ai_agent_application
  - compute_power
  defensive_group_ids:
  - medical_observation
  - defensive_stabilizers
  - coal
  - urban_renewal
  min_spread_pct: 1.5
  min_red_ratio_spread: 15
  require_offensive_positive: true
  min_duration_seconds: 900
  min_consecutive_ticks: 3
  note: 当前风格切换大概率延续，留意指数能否缩量上行确认反弹性质
- id: avoid_sector_monitor
  name: 规避方向监控
  avoid_group_ids:
  - avoid_semiconductor
  - avoid_consumer
  action: 只观察不介入
  note: 博主明确规避半导体和消费，若出现异动需警惕是否为诱多
notification_policy:
  only_notify_when:
  - 液冷/散热触发买入点或证伪
  - 上游涨价链触发观察点或扩散确认
  - CPU自研链组内联动（中国长城/ST得润）或产业催化超预期
  - 大盘4055支撑验证或跌破
  - 半导体/消费出现规避方向异动
  - 算力租赁/token概念发酵
  suppress_when:
  - 只是普通红绿波动
  - 单票异动但板块不共振
  - 同一信号按类型差异化去重（风控15min/减仓30min/板块轮动30min，见dedupe_by_type，已代码实现）
  - 当前不在A股交易时段
  - 规避方向（半导体/消费）的普通波动
  dedupe_by_type:
    risk_alert:
      dedupe_minutes: 15
      breakthrough_if_price_change_pct: 1.0
    reduce_alert:
      dedupe_minutes: 30
      breakthrough_if_price_change_pct: 2.0
    sector_rotation:
      dedupe_minutes: 30
      breakthrough_if_price_change_pct: 0
  message_fields:
  - time
  - action
  - stock
  - price
  - position_context
  - trigger
  - market_context
  - suggested_plan
  - invalidation
