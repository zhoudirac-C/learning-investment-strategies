  evidence_quote: 那什么情况下，你说右侧能够走起来嘞？是两融回升了才走起来吗？哎，其实也不是，就是说融资客他是一种右侧交易选手。啊，我们去看前面的，比如说七月份的。啊，这。你发现市场的话在这七月多就，七月底就止跌了，但杠杆哥什么时候回来的？八月初才回来的。
  conflict_quote: IF 多个指数（50/300/500/1000/科创/创业）尾盘涨幅>2% AND 融资余额连增 AND 有资金敢拉科技 THEN 右侧信号出现，可从试多转重仓
  set:
    description: >-
      鳄鱼派（gator school）第56章：护盘机制与底部周期操作法（2026-10-16~10-22 公众号提炼）。 **右侧确认分层**：IF 多个指数（50/300/500/1000/科创/创业）尾盘涨幅>2% AND 融资余额连增 AND 有资金敢拉科技 THEN 作为保守右侧/试多转重仓的一种确认组合，而非早期右侧的必要条件 IF 优质资产跌到前期平台位 AND 护盘品种（上证50ETF 510050）放量 THEN 进入捡便宜窗口，心中那杆称与大盘点位无关 IF 指数/个股破位（向上或向下） THEN 等 2 天确认再动作，单日破位多为假破位（南下资金扰动/恐慌抛售） IF 融资余额连续下降 3~4 天 THEN 尚未止跌（呼应三十八章杠杆资金撤离信号）； 涉及：护盘循环（遛狗循环）；两只手博弈（市场先生 vs 龙哥）；滴灌式护盘的信心消磨与对策；恐慌愣神资金效率（护盘为何能精准抄底）；底部判断链与年度定位。 用于鳄鱼派资金生态位与规则体系的判断。
    trigger:
    - IF 多个指数（50/300/500/1000/科创/创业）尾盘涨幅>2% AND 融资余额连增 AND 有资金敢拉科技 THEN 保守右侧/试多转重仓确认信号出现，而非早期右侧必要条件
    - IF 优质资产跌到前期平台位 AND 护盘品种（上证50ETF 510050）放量 THEN 进入捡便宜窗口，心中那杆称与大盘点位无关
    - IF 指数/个股破位（向上或向下） THEN 等 2 天确认再动作，单日破位多为假破位（南下资金扰动/恐慌抛售）
    - IF 融资余额连续下降 3~4 天 THEN 尚未止跌（呼应三十八章杠杆资金撤离信号）；磨底阶段个股要分融资特性（越涨越买 vs 越涨越卖），区分真强假强
    - IF 护盘资金盘中先买再卖（把旧仓倒给市场） THEN 尾盘低成交量时段的通吃扫货才是真实意图（冲击成本最小，几十亿即撬动）
    - IF 护盘方冲高时回收资金（卖银行/中字头） THEN 不是不看好，是趁情绪好储备弹药——海外风险未出清时护盘必托而不举
