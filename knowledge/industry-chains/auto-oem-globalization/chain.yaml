timing:
  current_recommendation: 关注海外产能布局领先、出口占比高的整车龙头及跟随出海的零部件环节；滚装运力紧张可作为辅助观察点
  next_trigger: 月度整车出口量（中汽协）同比持续高增 + 龙头海外建厂投产节点落地
  risk: 欧盟/主要市场关税壁垒加码；海外需求不及预期
