  interpretation: 把「尾盘放量回升」这一常见看多信号明确降级为「不够」：承接若只发生在收盘前，属于局部时段资金集中操作，不是自发修复能力。判据包含时间维度（时段分布）与结构维度（大金融-科技权重配合）两把尺子。
