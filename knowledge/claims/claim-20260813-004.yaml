  subject: 测试仪器是光模块设备链逻辑最干净的一段
  timeframe: industry
  statement: 光模块设备链中测试与耦合合计占价值量大头（耦合约40%、测试约30%），且测试占比随速率提升而抬升；速率每提升一代都要求测试仪器核心指标同步升级、旧设备无法复用，更高速率下测试时长拉长，测试仪器是这条链上逻辑最干净的一段。
  evidence_quote: 同一条产线的设备价值量占比，据卖方，耦合设备约40%、测试环节约30%……测试与耦合合计占据大头，且测试占比随速率提升而抬升。……速率每提升一代都要求测试仪器核心指标同步升级，旧设备无法复用，因此每一代放量都对应一轮新采购；同时更高速率下单只模块的测试时长拉长，同等出货量对应的仪器需求还有超额提升。
