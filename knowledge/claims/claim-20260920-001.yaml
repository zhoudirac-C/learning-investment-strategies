  evidence_quote: 因此对于下一周的黄金的方向，我会偏向为呃震荡修复，目前是四千四百一十五，如果下一周有突发情况发生的话，也就是说有好的消息发生的话，它有可能会很快摸到四千五百，因为呃在加息落地之后，我认为黄金是已经表现出一定的抗跌性的，以及刚才也确实说到包括我们国家这些新兴市场，他们对于配置的需求仍然还是在，所以我认为它是后面还是有机会的，但同样我们需要去观察就是说四千四百它能否站稳以及实际利率能否缓和。如果说有好转的话，那么对于黄金来讲我是会看得好稍微好一点，但是你看不了太高，因此我们整个的一个转折的话差不多给到一个位置就是四千五百六十二，好吧？那么在此之后我们先先短暂的看它是一个反弹吧，如果它能够站到我说这个价位的话，我们再去结合当时的一个情况，我们再去选择。
  interpretation: UP认可加息落地后的抗跌性和配置需求，但仍把行情限定为有条件的反弹。实际利率和价格支撑是上调判断的共同条件，不因单一涨幅目标外推趋势。
