market_framework:
  up_quote: 「指数方向未明，仓位与节奏以防守反击为主。题材主战场仍在科技上游材料（电子化学品、靶材、光刻胶、电子特气）。个股在等指数企稳——一旦指数给出确认信号，题材端弹性可能快速释放。」
  current_stage: 调整尾部等确认信号 — 全A趋势下跌23个交易日首次触及年线（924以来首次），调整时间空间均近历史极值。情绪逐日加强（20cm不开板，逆势涨的是科技而非反指），个股在等指数企稳。全A放量中阳线=唯一确认信号，在此之前不扩大风险敞口。结构未明朗前以防守反击为主。
  core_operation: 右侧确认纪律——结构成立前不做左侧抄底。向上看放量突破站稳→反弹级别上修；向下看60分钟以上底部结构。持有不追、不加仓、紧守止损。当前仅持有雅克科技，总仓位1.4%。
  opening_scenarios:
    scenario_A_向上突破: 放量突破并站稳→反弹级别和参与价值上修，可评估加仓但绝不追高。
    scenario_B_偏弱震荡: 平开/低开/缩量→持有不动，紧守止损。向下则观察60分钟以上底部结构能否形成。
    scenario_C_放量下杀: 放量破位→止损纪律优先，结构成立前不左侧抄底。
  intraday_observation:
    1_情绪修复关键: AI大市值个股带动作用——大票稳住盘面则分歧转修复概率上升，大票拖累则提防退潮初段
    2_20cm晋级率: 批量晋级=情绪修复确认，集体断板=降低题材仓位预期
    3_科技上游材料扩散: 从电子化学品→靶材→光刻胶方向扩散，钼靶材以钼替钨逻辑
  two_switching_logics:
    1_高低切换: 高位科技硬件/存储/CPU/科创50反弹减仓；资金流向科技上游材料（电子化学品/靶材/光刻胶/电子特气）
    2_涨价为王: 弱市里唯有真实涨价+需求放量的品种能坚挺。真正值得配置的是「低位+涨价」交集（六氟化钨、球形硅微粉、前驱体、钼靶材）
  hedge_framework:
    情景A_鸽派科技修复: 进攻仓 = AI上游材料 + 科技主线修复方向
    情景B_地缘油价升级: 对冲仓 = 涨价材料(WF6/钨/钼) + 商业航天 + 核电
  invalidation_conditions:
  - 全A指数继续破位且30分钟不能收回→筑底失败→全部降仓至1成以下
  - 外围（美股/AI capex叙事）出现系统性崩坏→涨价逻辑证伪
  - 6/17 FOMC点阵图降息预期归零+油价持续上行→情景B全面主导→提高对冲仓比例
