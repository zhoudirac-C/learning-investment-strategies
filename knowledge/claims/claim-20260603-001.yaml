  subject: MLCC价值重估（高盛），光互连看资金接力意愿，CPO英伟达量产，光纤光缆供需缺口显著
  timeframe: short-term
  statement: MLCC因高盛研报价值重估，短期有望走出类似铜箔走势。光互连看资金接力意愿验证炒新不炒旧。CPO英伟达Spectrum-X量产。光纤光缆全球缺口1.8亿芯公里，缺口率16.4%
  evidence_quote: MLCC这波暴涨，和高盛近期的密集吹捧直接相关。其研报指出：MLCC在服务器中的价值量排名第3，超越了PCB的价值量。对MLCC来说这是一次全面的价值重估，短期有望走出类似此前铜箔的那种走势。如果今天在隔夜Marvell大涨背景下，资金对这个方向仍兴趣不大，那就更印证了炒新不炒旧的判断。
  interpretation: 细分方向跟踪：①MLCC——高盛点燃价值重估，服务器价值量排名第3超越PCB，短期有望类似铜箔走势；②光互连——Marvell被黄仁勋点名，但周二资金只能拉冷门裕太微且炸板，若今日仍无接力则印证"炒新不炒旧"；③CPO——英伟达Spectrum-X硅光量产，能效提升5倍；④光纤光缆——全球首条三波段多芯光缆开通，CRU预测2026年缺口1.8亿芯公里（缺口率16.4%），2-3年高景气周期；⑤模拟IC——意法半导体大涨15.2%，板块处于库存修复向需求修复切换窗口。这是对多个细分方向的跟踪要点。
