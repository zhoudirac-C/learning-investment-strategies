  subject: 走势类型分解的中枢级别判据
  topic: 走势类型中不可能出现比该级别更大的中枢，出现即须重新分解
  statement: 缠中说禅走势类型分解原则：一个某级别的走势类型中，不可能出现比该级别更大的中枢；一旦出现，就证明这不是一个该级别的走势类型，而是更大级别走势类型的一部分或几个该级别走势类型的连接。应用示例：同级别背驰完成走势类型时，前后两个走势类型以该背驰点为分界，分解没有含糊；小级别背驰引发大级别转折时，若新演化出的同级别中枢 C 与原最后中枢 B 没有任何重叠，则原走势类型未完结、延伸为 a+A+b+B+c+C，须等其完成再分解；若 C 与 B 有重合，则 B+c+C 必然演化成更大级别中枢，原走势类型只是更大级别走势类型的一部分，若按同级别分解，分解点取该小级别背驰点。
  evidence_quote: 缠中说禅走势类型分解原则：一个某级别的走势类型中，不可能出现比该级别更大的中枢，一旦出现，就证明这不是一个某级别的走势类型，而是更大级别走势类型的一部分或几个该级别走势类型的连接……如果C 和B 没有任何重叠，那就意味着原来的a+A+b+B+c 并不是一个完成了的30 分钟走势类型……如果C 和B 有重合，那么a+A+b+B+c+C=a+A+b+（B+c+C），其中（B+c+C）必然演化成一个日线中枢。
  interpretation: 这条原则是划分走势类型边界的硬约束：中枢级别不得超过走势类型级别。它同时给出小转大情形下两种分解处理（无重叠则延伸、有重叠则归并升级），使走势图分解有章可循。
