# === 市场框架（from 6/10 复盘 + 6/11 早盘更新）===
market_framework:
  current_stage: 弱势震荡筑底期 — 地量信号初现（午后缩量砸不动），风险释放大半。今日操作取决于开盘量能二选一：情景A（开盘缩量=抛压衰竭→修复↑）/ 情景B（开盘放量下杀→防守为先）。近一周核心任务=观察反弹持续性而非进攻。
  core_question: 指数何时重新站上关键均线+出现放量板块带头？情景A下可评估轻仓试探（严格右侧量价确认），情景B则继续防守。
  up_quote: 「高位反弹减仓，低位耐心等待；涨价为王，业绩为锚；短期不猜涨跌，中线看切换；冷眼旁观，等待结构性的分化。」
  key_assumptions:
  - 缩量防守日正确姿态是降频、降仓、只在确定性方向上做减法
  - 资金从高位科技硬件向低位、向涨价确定性切换是唯一值得跟随的结构性变化
  - 低位+涨价交集（六氟化钨、球形硅微粉、前驱体）是弱市最优风险收益比
  - A股定价权不在国内，修复弹性依赖美联储路径+油价
  - 右侧进场、量价确认：宁可踏空也不在筑底反复中被消磨
  invalidation_conditions:
  - 全A指数继续破位且30分钟不能收回→筑底失败→全部降仓至1成以下
  - 外围（美股AI capex叙事）系统性崩坏→涨价逻辑证伪
  - 6/17 FOMC点阵图降息预期归零+油价持续上行→提高对冲仓比例
  - 任何持仓跌破买入时设定的止损位→无条件执行止损

# === 板块轮动规则 ===
sector_rotation_rules:
- id: price_increase_vs_low_recovery
  name: 涨价线 vs 低位修复轮动
  description: 涨价方向（电子特气/覆铜板材料/钨）和低位修复方向（光伏/医药/证券）之间的轮动
  offensive_groups:
  - pricing_power
  defensive_groups:
  - low_recovery
  min_spread_pct: 2.0
  min_red_ratio_spread: 15
  require_offensive_positive: true
  signal:
    pricing_leading: 涨价方向领涨→弱市涨价逻辑被强化→侧重涨价仓
    recovery_leading: 低位修复领涨→市场风险偏好回暖→适当扩大低位修复仓
- id: hedge_rotation
  name: 情景A/B对冲轮动
  description: 根据CPI/油价/美联储预期变化，在进攻仓和对冲仓之间调整
  scenario_a_stocks: [雅克科技, 隆基绿能]
  scenario_b_stocks: [昊华科技, 中钨高新]
  trigger:
    scenario_a: 核心CPI软+油价回落+降息预期→进攻仓（AI硬件+硅片）
    scenario_b: 油价升级+地缘恶化+加息预期→对冲仓（涨价材料+能源地缘）

# === 指数规则 ===
index_rules:
- trend_defense: 3950
  name: 上证趋势防线
  description: UP自高点调整300点后月线支撑区。若收盘跌破→筑底失败信号。
  trigger_condition: close_below
- valid_close_level: 4033
  name: 上证生命线
  description: UP前期生命线4033，站回才算有效修复。最终确认需月线两根强阳。
- weak_close_level: 4000
  name: 上证弱修复线
  description: 4000点心理关口。缩量站回4000不算有效修复，需放量确认。
- close_between: [3950, 4033]
  name: 上证筑底震荡区间
  description: 在3950-4033之间震荡属正常筑底，不触发预警

# === 操作纪律（from 6/10 复盘）===
position_rules:
- id: right_side_entry
  name: 右侧进场量价确认
  description: 当前只观察不建仓。等指数站回关键均线+放量板块带头再加仓。宁可踏空。
  condition: index_above_ma20 AND volume_confirm AND leader_sector_active
  max_position_first_buy: 1成
- id: pricing_power_intersection
  name: 涨价+低位交集策略
  description: 只买低位+涨价交集（六氟化钨/球硅/前驱体）。纯低位修复只用ETF；纯高位涨价只做右侧轻仓止损。
  eligible_directions:
  - 覆铜板上游材料（雅克科技/中化国际）
  - 电子特气二线（昊华科技）
  - 钨产业链（中钨高新）
  max_single_position: 1.5成
  max_theme_position: 3成
  hard_stop: 买入价下方5%
- id: rebound_reduce
  name: 反弹减仓纪律
  description: 存储/CPU/科创50/锂矿/煤炭反弹即减仓。不做T、不加仓、不补仓。
  apply_to: [存储, CPU, 科创50, 锂矿电池, 煤炭, 稀土, 石油, 黄金, 房地产]
  action: 反弹至关键均线（60日线/20日线）即撤
- id: defense_day_rule
  name: 防守日纪律
  description: 缩量防守日（今日定性）：降频、降仓、不在防守日做进攻动作
  triggers:
  - 全A成交缩量+银行保险领涨→防守日确认
  - 涨停<60家或二连板<15家→弱修复
  action_bias: 只观察、不买入
- id: semiconductor_range_trade
  name: 半导体降级为区间交易
  description: 6/11 早盘明确：半导体应由「持股待涨」转向「区间交易」。不追涨、不做突破策略，以区间内做T为主。
  apply_to: [MLCC, 被动元件]
  source_claim: claim-20260611-001-e
- id: defense_sector_crowding
  name: 防御方向拥挤警示
  description: 红利/银行/电力是过渡板块非进攻主线。连涨后警惕拥挤——不做追涨，不做加仓。若防御板块持续领涨→市场仍在避险模式，非进攻信号。
  source_claim: claim-20260611-001-e

# === 内部分时调度 ===
intraday_schedule:
- window: 09:15-09:30
  name: 集合竞价
  action_bias: 只观察
  rules:
  - 观察覆铜板材料方向（雅克/中化国际）是否延续强势
  - 观察电子特气方向（昊华/中船特气）是否有资金回流
  - 观察光伏方向（隆基/爱旭）是否延续修复
  - 观察全A指数开盘位置（距3950多远）
- window: 09:30-10:00
  name: 开盘确认
  action_bias: 只观察
  rules:
  - 全A方向确认——上攻(偏强) vs 横盘(中性) vs 下探(偏弱)
  - 涨停数量、二连板晋级率
  - 涨价方向 vs 低位修复方向谁主动领涨
  - MLCC/铜箔/液冷(材料端)是否主动领涨→高低切换成立；补跌→科技进入普遍出清
- window: '10:30'
  name: 30分钟确认
  action_bias: 可评估买点（仅限满足右侧条件时）
  rules:
  - 全A30分钟内不创新低+出现放量领涨→可评估轻仓试探
  - 全A继续破位→继续等待
- window: '14:00'
  name: 午盘监控
  action_bias: 午后只看不买
  rules:
  - 持仓是否触发止损
  - 领涨板块是否冲高回落
- window: '14:55'
  name: 尾盘条件单
  action_bias: 可尾盘低吸（仅限强修复日）
  rules:
  - 全日定性为强修复（全A+0.5%以上+二连板≥17家）→可尾盘轻仓低吸
  - 弱修复/防守日→不操作

# === Agent分析调度 ===
agent_analysis_schedule:
- id: open_auction
  time: '09:26'
  name: 集合竞价后
  focus: 覆铜板材料/电子特气/光伏是否按预期走，全A开盘方向。判断防守日/修复日。
- id: open_confirm
  time: '09:45'
  name: 开盘15分钟确认
  focus: 全A方向确认。覆铜板材料/电子特气/光伏谁主动领涨。MLCC/铜箔/液冷是否领涨→高低切换验证。是否出现右侧信号。
- id: morning_confirm
  time: '10:00'
  name: 10点确认
  focus: 30分钟后今日基调。强修复（全A>0.5%）→可评估买点；弱修复→继续等；防守日→只看不买。
- id: opportunity_scan
  time: '10:30'
  name: 30分钟确认
  focus: 全A是否不创新低。涨价线（WF6/球硅/MLCC）是否触发观察点。
- id: noon_review
  time: '11:20'
  name: 上午收盘前
  focus: 上午定性：强修复/弱修复/防守日。是否有方向出现放量领涨。
- id: afternoon_risk
  time: '13:10'
  name: 午后风险窗口
  focus: 只观察。冲高回落信号、板块扩散衰竭信号。
- id: mid_afternoon
  time: '14:00'
  name: 午盘监控
  focus: 午后一小时盘面验证。涨价线是否维持、光伏是否回落、是否有尾盘杀信号。
- id: tail_condition
  time: '14:55'
  name: 尾盘条件单
  focus: 判断是否符合尾盘低吸条件（强修复日才可）。不符合则不做。

