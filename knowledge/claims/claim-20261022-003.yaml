  subject: 老钱信托与新上市公司补税压力的分化逻辑
  timeframe: permanent
  stance: view
  statement: 离岸信托补税压力的分化核心是老钱信托压力显著高于新上市公司：上市早、涨幅大的「老钱信托」实控人多在上市前或初期装入信托、原始成本极低，装入环节市值与成本差额巨大，存续多年又积累了巨额浮盈与未分配利润，一次性补税基数极高；而刚上市、股价破发的公司装入时市值与成本差额很小甚至没有增值、存续期累计收益有限，几乎没有补税压力。
  evidence_quote: '上市早、涨幅大的“老钱信托”：实控人多在上市前或上市初期就将股权装入信托，原始成本极低。一方面，若设立时间被纳入追缴范围，装入环节的市值与成本差额巨大；另一方面，信托存续多年积累了巨额的股价浮盈与未分配利润，存续环节的一次性补税基数极高。拼多多、泡泡玛特这类上市后股价大幅上涨的标的，信托内资产增值显著，市场预期的补税压力最突出。

    刚上市、股价破发的公司：装入信托时的市值与成本差额很小，甚至没有增值，存续期累计收益也有限，几乎没有补税压力。'
  interpretation: 「上市早+涨幅大 → 压力重」是 UP 给出的可操作判据：判断某标的的信托征税敞口不需要逐个穿透架构，只要看上市年限与股价涨幅两条轴就能定位高敏感群体；反过来破发新股几乎免疫。
