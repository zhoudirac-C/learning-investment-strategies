  subject: 刺透形态定义与四条件
  timeframe: permanent
  statement: 刺透形态出现在下跌末端，由两根K线构成：第一根为中阴线或大阴线，第二根为中阳线或大阳线；第二根开盘价必须严格低于第一根阴线的最低价（跳空低开），收盘价深入第一根阴线实体50%以上、但不超过第一根阴线的开盘价。位置是定义的一部分，不是可选项。
  evidence_quote: 首先，它出现在下跌的末端，位置是定义的一部分。那么第二就是它的第一根是一根阴线，通常是大阴线或者是中阴线。那么第三就是第二根，它是阳线，通常是大阳线或者中阳线。……第二根K线的开盘价一定要低于第一根的最低价，这个是一个严格的低开……然后第二根的收盘价，它是在第一根实体阴线的百分之五十以上……然后第二根的收盘价它小于第一根阴线的开盘价，就没有完全反超。
  interpretation: 四条件缺一不可：下跌末端定位置、阴后阳定方向、严格低开定情绪落差、收盘过实体50%定力量对比。若第二根收盘超过第一根开盘价，形态升级为看涨吞没，不再按刺透处理。
