  timeframe: short-term
  statement: 今日操作预案：主基调继续观望多看少动，三条具体纪律——高开不加仓等承接（高开是外盘定价不是A股资金选择）；科技方向时间窗只到收盘，盘中加满的部分尾盘找高点减出来（持仓过夜成本=明天开盘能不能自由选择）；逆指数方向（农业、贵金属、锂矿）指数企稳反而要减。
  evidence_quote: 第一，高开不加仓，等承接——高开本身是外盘定价的结果，不是A股资金的选择，能不能边冲高边小幅放量才是唯一有效的确认。第二，今天科技方向的时间窗只到收盘，盘中加满的部分应当在尾盘找高点减出来；沿用此前的隔夜风险敞口原则，持仓过夜的成本不是价格，而是明天开盘那一刻还能不能自由选择。第三，逆指数方向的持有前提是指数继续走弱，一旦指数真正企稳，这部分仓位反而要减。
  interpretation: 8/26操作预案三原则：高开不加仓（外盘定价≠A股选股）、尾盘减科技敞口（隔夜风险原则）、逆指数方向指数企稳则减仓（方向一致性）。三条纪律都指向同一个结论：今天控制敞口优先于方向判断。
