  timeframe: trend
  statement: 当前消费呈现K型分化，旧引擎衰退，新结构正在形成。社零下滑不代表消费全领域不行，服务消费是当前促消费的核心方向，商品消费进入新旧动能转换的蛰伏期
  evidence_quote: "当前消费呈现K型分化，旧引擎衰退，新结构正在形成。社零是窄口径商品消费，不包含服务消费，社零下滑不代表消费全领域不行。当前社零承压主要因为汽车等传统大宗消费引擎进入存量阶段。商品消费进入新旧动能转换的蛰伏期，找不到新的大宗消费引擎，因此服务消费成为当前推动高质量发展的核心内生动力。"
