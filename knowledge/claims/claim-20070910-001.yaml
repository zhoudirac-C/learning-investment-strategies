  subject: 第三类买点买卖法
  topic: 只介入第三类买点，次级别不新高或盘整背驰坚决卖，尽量只做第一个中枢的第三类买点
  statement: 有充足时间散户的第三买点买卖法：一、选定一个足够去反应的级别，例如30分钟或5分钟，或者干脆用日线级别，这样选择的目标相对少点；二、只介入在该级别出现第三类买点的股票；三、买入后一旦新的次级别向上不能新高或出现盘整背驰，坚决卖掉，只要级别足够肯定是赚钱的；四、如果没出现卖出情形，那一定进入新一轮该级别的中枢上移中，一定要持有到该上移走势出现背驰后至少卖掉一半，然后一个次级别下来可回补，次级别上去只要不创新高或盘整背驰就一定要全部出掉；五、尽量只介入第一个中枢的第三类买点，因为第二个中枢以后形成大级别中枢的概率将急促加大；六、本方法一定不能对任何股票有感情。
  evidence_quote: 选定一个足够去反应的级别，例如，30 分钟或5 分钟的，或者干脆就用日线级别的，这样选择的目标相对少点，不用太乱。……只介入在该级别出现第三类买点的股票。……买入后，一旦新的次级别向上不能新高或出现盘整背驰，坚决卖掉。……如果股票没出现3 的情况，那一定是进入新一轮该级别的中枢上移中，一定要持有到该上移的走势出现背驰后至少卖掉一半……尽量只介入第一个中枢的第三类买点。因为第二个中枢以后，形成大级别中枢的概率将急促加大。……本方法，一定不能对任何股票有感情，所有股票，只是烂纸，只是用这套有效方法去把纸变黄金。
  interpretation: 流程的精髓是时间利用率：卖点走掉后股票可能二次回抽走出新行情，但节省了时间就有了介入新股票的机会。最狠的做法是一旦上移出现背驰就全走，前提是对背驰判断特别有把握。走掉后是否重新介入，关键看高一级别的中枢位置上能否形成第三买卖点。
