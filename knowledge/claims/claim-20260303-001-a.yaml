statement: "多级别顶底结构的纠错采用级联递进机制：60/90分钟顶部结构消失→纠错买回（小级别解除警报）；下一道防线是日线+120分钟顶部结构形成→再次减仓（大级别风险确认）。操作上分两档：小级别买入，大级别卖出，形成'买在小级别解除→卖在大级别形成'的节奏。"
evidence_quote: "60/90分钟顶部结构已消失，满足纠错买回标准。后续风控线：日线+120分钟顶部结构形成→再减仓。"
interpretation: "UP完整展示了他的多级别操作节奏——不是简单的'有结构就卖、没结构就买'，而是根据级别大小分层操作。60/90分钟属于小级别（决定是否纠错买回），日线+120分钟属于大级别（决定是否再次清仓）。这种分层式的顶底判断正是UP大盘分析的精髓——不同级别信号对应不同力度的操作，而非一刀切。"
