  claim_type: sector-theme
  subject: 光互连产业逻辑——互联是AI基础设施三大瓶颈之一，CPO渗透早期，2030年占比35.74%
  timeframe: industry
  statement: 互联是AI基础设施三大瓶颈之一（算力已解决、内存正在解决、互联是下一个）。芯片算力每两年提升3倍，互联仅提升1.4倍。CPO预计2026年占AI数据中心光模块出货0.55%，2030年攀升至35.74%。光模块2026年增速预计65%，2031年将超500亿美元
  evidence_quote: 互联滞后算力——芯片算力每两年提升3倍，互联能力同期仅提升1.4倍，失衡成为制约AI数据中心规模扩张的核心瓶颈。铜缆在机柜内接近物理极限(有效传输距离不足2米)，光互联成为唯一能满足复杂数据中心架构带宽需求的路径。CPO仍处渗透早期——预计2026年CPO在AI数据中心光通信模块出货占比约0.55%，2030年将攀升至35.74%。
  interpretation: '光互连产业深度逻辑（国海/国盛/开源/万联）：①三大瓶颈论——Marvell CEO Matt Murphy在Computex明确指出：算力已解决→内存正在解决→互联是下一个限制基础设施极限的瓶颈；②算力-互联失衡——芯片算力每2年3倍
    vs 互联1.4倍，失衡制约扩张；③铜缆物理极限——机柜内有效传输距离不足2米，光互联是唯一路径；④CPO渗透曲线——2026年0.55%→2030年35.74%，规模化一旦启动快速渗透；⑤MicroLED光互连/微软MOSAIC——"宽而慢"架构，功耗数个数量级降低，实验室→初步商业化；⑥交换芯片地位提升——组网从2层→3/4层演进，英伟达VR
    NVL72交换芯片与GPU配比从3:64提升至1:2；⑦市场规模——光模块2026年增速65%，2031年超500亿美元。这是跨周期的产业逻辑claim，timeframe标记为industry。

    '
