  subject: K线形态（长黑线）
  topic: 长黑线三种形态：高档长黑、低档长黑、跌破盘局
  statement: 长黑线（光头光脚阴线：开盘价≈最高价，收盘价≈最低价，实体较大跌幅显著）有三种形态：(1)高档长黑（上涨末端出现→无条件清仓）；(2)低档长黑（下跌末端出现+连续非理性加速下跌→小仓位博弈反弹，严格止损）；(3)长黑跌破盘局（箱体向下突破→立即离场）。长黑线没有'被跌破'对称形态，因为长黑线本身就是严重危险信号。
  evidence_quote: 长黑线它有三档，第一档就是高档长黑...第二档就是低档长黑...第三种就是长黑向下跌破盘局...长黑线它没有长红被跌破这种严重危机信号的一个对称物，也就是说长黑线本身它就已经是严重的危险信号了。
  interpretation: 长黑线三种形态的核心区分标准是位置：高位=清仓、低位加速跌=反弹机会、跌破箱体=离场。实体信号不可化解。与长红线对比：长红线4种，长黑线3种。
