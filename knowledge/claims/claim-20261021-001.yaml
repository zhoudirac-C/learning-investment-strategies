  evidence_quote: 那还有就是昨天盘前有那个政策，嗯，是鼓励的啊，但还没有马上有落地的订单啊，但这也算是一个利好。那机器人这两天炒得很火的，还有物理AI这条线啊……物理AI也会是一个核心的炒作点，最近资金也在博弈的就是这个大会的一个精彩程度啊，出乎意料的程度。总的来说就是跌的多了，然后带头反弹，刚好在这个窗口带头反弹。
  interpretation: 卢本圆把「政策鼓励」与「订单落地」严格分开——政策只提供情绪，订单才提供业绩，这与青枫浦「政策是产业背景、兑现看项目订单」的框架同向。物理AI的炒作锚是大会预期而非订单，意味着属于事件博弈性质。
