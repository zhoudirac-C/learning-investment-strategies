- id: claim-20070702-002-b
  source_path: sources/chanlun/lesson_064.md
  source_date: '2007-07-02'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 缺口的线段处理规则
  topic: 顺向缺口包含在原笔中，突发逆向缺口当成一段
  statement: 缺口在线段划分中分两种处理：顺着原走势方向的缺口（如低开后顺着昨天的笔下来），没有破坏原来那笔，就包含在原来的一笔里，和一般走势没什么区别；突然性的、逆着走势来的缺口，必然要当成一段，而不能只当成一笔或一笔里的一部分。对缺口没有三笔的疑问，可以这样理解：就像0等于0加0加0，缺口可以看成是三个缺口的迭加，这样就有三笔以上了。
  evidence_quote: 缺口如果包含在一笔中的，像今天早上低开的缺口，没有破坏昨天那笔，是顺着昨天那笔下来的，所以这种缺口和一般的走势没什么区别，缺口还是包含在昨天的一笔里。但有些突然性的逆着走势来的缺口，就像530 那个，就必然要当成一段，而不能光当成一笔或一笔里的了。有人可能说，缺口没有三笔？那你可以这样去看，就像0=0+0+0，缺口可以看成是三个缺口的迭加，这样就有三笔以上了。
  interpretation: 530指2007年5月30日印花税调整引发的跳空暴跌，作历史案例。规则要点是按缺口相对走势的方向与力度区分处理，而非缺口本身机械成段。
  confidence: high
