  subject: K线组合信号
  topic: 组合K线信号：黄昏之星 = 流星线未化解+第三日大阴线
  statement: 组合K线信号强于单根K线。黄昏之星=流星线次日未化解+第三日大阴线，确认见顶。铁锤线+倒装铁锤线同时出现=底部强看多信号。上吊线+流星线=必死无疑（顶部确认）。
  evidence_quote: 流星线隔天没化解，第三天大阴线，好的，确认见顶...这种叫黄昏之星好吧，它的信号的强度会比单根K线要更强...铁垂线加倒装铁垂线，那么发生在底部的时候，相当强的一种看多的信号了吧。
  interpretation: 单根K线→次日确认→第三日确认=信号层级递进。黄昏之星是多日组合信号的典型例子，比单根流星线更可靠。
