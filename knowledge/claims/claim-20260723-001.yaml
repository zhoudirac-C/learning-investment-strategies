  subject: 创业板跌超3%但跌停仅8家-普跌式资金主动收缩非踩踏
  timeframe: intraday
  statement: 周三三大指数涨跌不一，创业板指跌超3%，全市场超3800只个股下跌，但跌停仅8家。这是一次普跌式的资金主动收缩，而非踩踏。理由：早盘创业板几次反弹未翻红向上意愿不强，午盘日韩回落资金顺势借坡下驴；回落幅度相对周二涨幅相当有限；开盘即攻电力股、德明利(001309)再度跌停是资金收缩信号。亏钱效应明显减弱。
  evidence_quote: 周三三大指数涨跌不一，创业板指跌超3%，全市场超3800只个股下跌，但跌停仅8家——这是一次普跌式的资金主动收缩，而非踩踏。昨日的回落更接近资金主动收缩而非恐慌出逃，理由有三。其一，早盘创业板指几次反弹都未能翻红，向上意愿本就不强；其二，回落幅度相对周二涨幅其实相当有限；其三，开盘即攻电力股、德明利(001309)再度跌停，这两个动作与周一如出一辙，视作资金收缩的信号。创业板指虽跌超3%，但昨日跌停家数只有8家，上一次出现类似跌幅跌停多达33家，亏钱效应已经明显减弱。
  interpretation: UP对7/22回落给出具体定性——资金主动收缩而非踩踏。核心验证信号：跌停仅8家（对比上次33家），说明虽然指数跌了但亏钱效应很轻。这与前一日复盘判断一致（回落是量能消化非趋势转弱）。三个证据链条完备：意愿不强+回落有限+资金信号(攻电力/德明利(001309)跌停)。
