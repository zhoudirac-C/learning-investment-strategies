  subject: 均线低吸做T
  topic: 用5日线与10日线分级低吸做T
  timeframe: permanent
  statement: 趋势向上的股短期涨多后做T看均线：股价回撤到5日线而不破（掉一两分没事）可低吸；回踩10日线只稍微买一点，博的是短期内的补涨，因为此时股性已没那么厚积有力
  evidence_quote: 我会先看五日线，那条黑的，那条五日线。股价回撤到五日线的时候而不破，比如说它掉个一两分没事情，我一般会选，我看好的话，我五日线会继续低吸。……那十日线呢，就是这只股呢都感觉已经已经没有那么厚积有力了，但是还是稍微看好有一点行情。就是它回踩十日线我会稍微买一点，回踩这个十日线呢，我博的是什么呢？回踩这个十日线我博的就是短期内的一个补涨。
  interpretation: 均线位置对应信心分级：5日线是强趋势的主买点，10日线降级为博补涨的小仓位买点。这是UP给新手的简化规则（原话：会选股的话看什么线都差不多）。
