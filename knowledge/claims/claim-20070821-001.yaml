  extracted_at: '2026-07-18'
  subject: 纯形态学的操作体系
  topic: 无背驰概念时抓第二类买卖点，回拉后反向不创新高新低的同级别离开即买卖段
  statement: 光用形态学就足以形成一套有效的操作体系：由于没有背驰概念，第一类买卖点抓不住，但第二类买卖点肯定没问题。单纯用形态学操作的规则：任何对最后一个中枢的回拉后，第一个与回拉反向的、不创新高或新低的中枢同级别离开，就是买卖段。如果一直没有回拉回到原中枢，又在上面形成新的同级别中枢，那么操作的标杆就进一步提到那个中枢上，如此类推。当然实际应用中动力学、形态学一起用更有效，对背驰、区间套没信心的可以先从形态学着手，而且形态分析不好，也动力不起来。
  evidence_quote: 其实，光用形态学，就足以形成一套有效的操作体系。只是在形态学中，由于没有背驰的概念，所以第一买卖点是抓不住了，但第二买卖点是肯定没问题的。单纯用形态学去操作，就是任何对最后一个中枢的回拉后第一个与回拉反向的不创新高或新低的中枢同级别离开，就是买卖段……如果一直没有回拉回到4335 点，又在上面形成新的同级别中枢，那么操作的标杆就进一步提到那个中枢上，如此类推……不过这里有一个用处，就是那些对背驰、区间套没什么信心的，可以先多从形态学着手。而且，形态分析不好，也动力不起来。
  interpretation: 为背驰运用没信心的学习者提供的降级版系统，本质上是用形态结构近似第二类买卖点。4335点为2007年日线案例：回拉4335点之下后，同级别不创新高的第一次反抽即卖点；一直未回拉则标杆上移到新中枢。按此法2005年中到成文时指数一直无卖点，作历史案例。
