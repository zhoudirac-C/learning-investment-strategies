- id: claim-20070309-001-g
  source_path: sources/chanlun/lesson_035.md
  source_date: '2007-03-09'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 固定级别内走势类型的严格划分
  timeframe: permanent
  statement: 站在任意固定级别里，走势类型可以被严格划分：一个5分钟走势类型无论如何延续也不可能包含一个30分钟中枢，要形成30分钟中枢只能是3个以上5分钟走势类型的连接；走势类型与走势类型的连接这两个概念不可能有任何含糊的地方。
  evidence_quote: 显然，站在任意一个固定级别里，走势类型是可以被严格划分的。例如，说一个5 分钟的走势类型，显然不可能包含一个30 分钟的中枢，因为按定义，一个单独的5
    分钟走势类型无论如何延续，也不可能出现一个30 分钟的中枢。要形成一个30 分钟的中枢，显然只能是3 个以上5 分钟走势类型的连接才可能。走势类型与走势类型的连接，这两个概念不可能有任何含糊的地方。
  interpretation: 走势类型的级别归属是排他的：本级别走势类型内部不可能长出高级别中枢，高级别中枢只能由多个本级别走势类型连接而成。这把级别混杂的糊涂账从定义上彻底排除。
