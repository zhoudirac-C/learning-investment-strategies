  subject: 政策只是分力
  topic: 政策只有中短期力量不能改变长期走势，同一政策在不同位置效果不同
  statement: 政策只是走势合力中的一个分力，只有中短期的力量而没有长期的力量，不可能单独改变一个长期性的走势，即使硬调控使中短期走势出现大的转折，最终也改变不了大牛市的最终方向。任何政策都有其边界，一旦超越边界，新政策新分力就要产生；而且政策分力即使在同一政策维持中，实际作用也在变化，同一个政策在5000点和1000点的效果不可能一样。应对原则：市场进入低估阶段要更注意向多政策的影响，反之在泡沫阶段要更注意向空调控的影响。
  evidence_quote: 必须要明确，政策只是一个分力，政策不可能单独去改变一个长期性的走势……政策只有中短期的力量，而没有长期的力量，这点，即使对经济也是一样的……任何政策，都有其边界，一旦超越其边界，新的政策就要产生，就会有新的分力产生。而且政策分力，即使在同一政策维持中，也有着实际作用的变化。一个政策，5000 点和1000 点，效果显示不可能一样……当市场进入低估阶段，就要更注意向多政策的影响，反之，在市场的泡沫阶段，就要更注意向空调控的影响。
  interpretation: 第73课结尾与此呼应：政策面最多制造周线级别的震荡，1929年与二次世界大战都没改变美国股市年线级别的中枢移动。政策性风险属非系统风险，本质上不可准确预测，只能进行有效的相应防范，这是本课全部操作推论的前提。
