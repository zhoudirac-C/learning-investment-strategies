  subject: 均线吻的完全分类
  topic: 短期与长期均线的关系完全分类为飞吻、唇吻、湿吻
  statement: 以短期均线与长期均线的关系做完全分类，定义三种吻：飞吻=短期均线略略走平后继续按原来趋势进行下去，出现几率少，一般在趋势特别强烈时；唇吻=短期均线靠近长期均线但不跌破或升破，然后按原来趋势继续，是任何一段基本趋势过程中最常见的方式；湿吻=短期均线跌破或升破长期均线甚至出现反复缠绕，多出现在一段趋势后的较大调整中或趋势转折时。体位定义：短期均线在长期均线之上为女上位即多头市场，反之为男上位即空头市场，要赚钱就要多点女上位。
  evidence_quote: 飞吻：短期均线略略走平后继续按原来趋势进行下去。唇吻：短期均线靠近长期均线但不跌破或升破，然后按原来趋势继续下去。湿吻：短期均线跌破或升破长期均线甚至出现反复缠绕，如胶似漆……把短期均线当成是女王，长期均线当成面首，那么"男上位"意味着空头市场，而"女上位"意味着多头市场，要赚钱，就要多来点"女上位"。
  interpretation: 三种吻是对趋势中调整力度的客观刻度：飞吻=几乎无调整，唇吻=浅调整，湿吻=深调整或转折。这套词汇把均线缠绕现象变成可讨论、可分类的对象，第12课的两个买点正是建立在缠绕之后的位置判断上。
