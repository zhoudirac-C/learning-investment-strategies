  subject: 中枢震荡差价纪律
  topic: 只有围绕操作级别中枢震荡的差价最安全，中枢上方减仓下方加仓，第三类卖点后不回补
  statement: 从最严格的机械化操作意义上说，只有围绕操作级别中枢震荡的差价才是最安全的，因为肯定能做出来而且绝对不会丢失筹码；中枢完成后向上移动时的差价不能做，中枢向上移动时就应该满仓，这才是最正确的仓位。围绕中枢做差价时，在中枢上方仓位减少、在中枢下方仓位增加，前提是中枢震荡依旧，一旦出现第三类卖点就不能回补了，用中枢震荡力度判断的方法可以避开其后可能出现第三类卖点的震荡。中枢震荡中本质上应该全仓操作，不熟练的可以不全仓，但风险是中枢震荡后可能直接出现第三类卖点下跌，部分筹码需要在第三类卖点处走掉。
  evidence_quote: 只有围绕操作级别中枢震荡的差价才是最安全的，因为肯定能做出来，而且绝对不会丢失筹码……中枢向上移动时，就应该满仓，这才是最正确的仓位。而在围绕中枢差价时，在中枢上方仓位减少，在中枢下方仓位增加，注意，前提是中枢震荡依旧，一旦出现第三类卖点，就不能回补了，用中枢震荡力度判断的方法，完全可以避开其后可能出现第三类卖点的震荡。
  interpretation: 给出差价交易的可行域与仓位方向：差价只能在中枢未被破坏前做，移动段满仓持有。作者建议宁愿抛错也要严格按方法，抛错还有第三类买点重新买入的机会，抛对每次差价可观，中枢震荡做好可操作的频率高。
