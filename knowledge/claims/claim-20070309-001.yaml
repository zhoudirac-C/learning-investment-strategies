  subject: 中枢与走势类型的循环定义问题
  timeframe: permanent
  statement: 中枢与走势类型相互依存、互为定义前提：没有走势类型中枢无法定义，没有中枢走势无法分出类型，若理论仅有这两个概念则循环定义不可避免；必须引入级别概念，严格的递归式定义才得以展开。
  evidence_quote: 这两方面相互依存，如果没有走势类型，中枢也无法定义；而没有中枢，走势也无法分出类型。如果理论就此打住，那么一个循环定义就不可避免。要解决该循环，级别的概念是不可缺少的。有了级别，一个严格的递归式定义才可以展开。
  interpretation: 这是缠论理论地基的说明：级别不是人为划分的便利工具，而是让中枢与走势类型两大基础概念摆脱循环定义、实现严格递归定义的逻辑枢纽。理解这一点才能明白为什么级别在缠论中处于第一性位置。
