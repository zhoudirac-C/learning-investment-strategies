  extracted_at: '2026-07-18'
  subject: 先于大盘的选股对策
  topic: 为防背驰买入后卖不出，应选先于大盘回稳的强势股
  statement: 背驰买入后可能因回探与T+1制度而没资格卖出，一个简单的对策是必须买比大盘强势的股票，即先于大盘的股票：大盘一旦回转，这类股票走势都会比大盘强，自然有足够的卖出空间。注意最好的选择是比大盘稍微先一点的，而不是完全逆于大盘的，后者往往有可能补跌或逆着大盘洗盘。新股也是较好选择，前提是开得不太高且有明显新资金介入。
  evidence_quote: 一个很简单的对策就是，你必须买比大盘要强势的股票，也就是先于大盘的股票，这样，一旦大盘回转，这类的股票走势都会比大盘强，这样自然有足够的空间让你选择。注意，最好的选择是比大盘稍微先一点的，而不是完全逆于大盘的，因为后者，往往有可能补跌，或者逆着大盘洗盘
  interpretation: 这是用选股结构对冲交易制度风险的具体对策，先于大盘与完全逆势的区分是关键细节。课中600737等2008年个股仅为当日示例，不构成任何标的建议。
