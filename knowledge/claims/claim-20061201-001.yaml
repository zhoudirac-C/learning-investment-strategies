  subject: 风险的完全分类系统
  topic: 风险无位次不可消除，唯一办法是完全分类加对应应对程序
  statement: 任何一个位置介入都存在风险，任何妄求投资中绝对无风险都是痴心妄想；风险是不患的、无位次的。唯一的办法是设置一个系统，使无位次的风险在系统中成为有位次的：根据自己的实际情况（资金、操作水平等）设置一套分类评价系统，对所有可能的情况都设置相应的应对程序，操作者唯一要干的就是一旦出现相应情况就采取相应操作。这样任何投资操作都演化为一个简单的数学问题：N种完全分类的风险情况，对应买、卖、持有三种操作的选择。这是长期战胜市场的唯一方法。
  evidence_quote: 任何一个位置介入，都存在风险……任何妄求在投资中的绝对无风险，都是痴心妄想。唯一的办法，就是设置一个系统，使得无位次、"不患"的风险在该系统中成为有位次，"患"的系统，这是长期战胜市场的唯一方法……任何投资操作，都演化成这样一个简单的数学问题：N 种完全分类的风险情况，对应三种（买、卖、持有）操作的选择。
  interpretation: 缠论风险管理总纲：不预测、不消除风险，而是枚举风险并预写应对。与第8课"输入输出无必然"、第9课乘法原则构成方法论三部曲：承认不确定，用独立程序降失败率，用完全分类覆盖所有情形。
