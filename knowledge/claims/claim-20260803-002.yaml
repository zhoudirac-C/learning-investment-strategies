  topic: 激进博高位反弹与稳健埋伏低位轮动的两种玩法
  timeframe: short-term
  statement: 当前两种明确玩法：激进玩法=博弈高位硬件反弹做短线、等有明确右侧再追切进去做波段；稳健玩法=埋伏低位国产软件、政策、电力、基建、防御医药等待轮动，依托箱体反复做波段。UP当前持仓就是稳健玩法的布局
  evidence_quote: 所以现在在我心里的两种玩法就很明确了。一个是激进玩法，博弈高位硬件反弹做短线，等有明确右侧再追切进去做波段啊。一个是稳健玩法，埋伏低位国产软件、政策、电力、基建、防御医药等待轮动，依托箱体反复做波段，也就是我目前持仓的布局的方向。
  interpretation: 把市场参与方式按风险偏好二分，并自陈选择稳健玩法。与「高位科技是超跌反弹」的判断自洽：左侧不追高位，蹲低位等轮动。
