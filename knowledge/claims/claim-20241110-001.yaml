  subject: 市盈率的局限
  topic: 市盈率的边界：估值看贵贱，短期涨跌看资金
  timeframe: permanent
  statement: 市盈率只是普通而常用的估值参考，不能当做神：A股不讲道理，短期涨不涨看的是资金量、有没有资金介入
  evidence_quote: 那市盈率仅仅就是一个普通而又非常常用的一个估值指标而已，不要把它当做神哈，因为A股是不讲道理的，A股只看资金量，能做一个非常好的参考，但最终涨还是短期内涨还是不涨，好吧，还是看资金，有没有资金介入。
  interpretation: UP对估值指标的边界定性：估值决定贵不贵，资金决定涨不涨。短期交易层面资金面优先于估值面——这与UP整体「资金为王」的A股观一致。
