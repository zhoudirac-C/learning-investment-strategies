- pattern_id: sector_rotation
  name: 板块轮动与扩散分析框架
  description: 当用户询问板块轮动、高低切换、补涨扩散、事件驱动、题材持续性时使用。典型查询：板块轮动到哪儿了、补涨方向有哪些、高低切怎么参与、事件驱动能不能追。该框架评估轮动触发因素、轮动质量、受益环节、持续性，判断轮动是健康扩散还是资金撤退前的补涨。
  trigger:
  - 主线核心标的滞涨或分歧，同产业链低位环节放量启动（高低切迹象）
  - 突发政策/事件驱动某板块集体异动
  - 主线板块大涨后出现补涨分支涨停潮
  - 板块轮动速度加快、日内热点切换频繁
