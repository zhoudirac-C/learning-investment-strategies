  evidence_quote: 传统MLCC在AI芯片高频、高温、高功耗环境下性能衰减明显；硅电容采用半导体工艺，具备超薄（可降至100μm以下）、高频下极低阻抗、寿命可达传统MLCC约20倍等优势，且天然适配3D先进封装，已获英伟达和苹果率先验证应用。三星电机已拿下约10亿美元硅电容订单（2027年起交付）。摩根士丹利供需模型推演显示，扣除台积电自产自用体系后，2026年国际市场硅电容短缺率恐高达57%，未来三年结构性紧缺预计持续。子公司天极科技已实现6寸量产、8寸中试，产品应用于AI服务器GPU、800G/1.6T光模块及军工微波领域并批量供货；火炬电子持有天极科技约51.58%股权并纳入合并报表。
