  - pattern_id: strong_trend_feedback_exit
    name: 反馈退出与首阴资格框架
    description: 当强趋势标的买入后出现第一根明显阴线、跌破预设失效位或修复不及预期，需要决定「是否还能拿、减多少、什么时候必须走」时使用。核心纪律是只给两次反馈、没有第三次：第一反馈决定降风险，第二反馈决定去留，之后只优化执行价格，不再修改结论。首阴能否博弈取决于阴线前三到五个交易日有没有弱化史。
    trigger:
      - 强趋势持仓出现第一根明显阴线或跌破预设失效位
      - 买入后首个交易日反馈不佳，次日进入修复观察
      - 修复日出现低开、破位或翻红后再度走弱
    data_requirements:
      - name: 持仓与成本
        channel: config/stock_monitor/positions.yaml（成本、仓位、建仓日）
      - name: 个股日K
        channel: 日K线（infra/data/kline_cache.db）
      - name: 分时与量能
        channel: 分时行情与当日量能
    steps:
      - step: 1
        name: 事前风险预算核对
        question: 买之前写下的失效位、最大亏损和仓位是多少？
        action: 用建仓时冻结的规则核对，不用「高位」「危险」等形容词临时改口；容忍度与仓位必须反向匹配
        data:
          - 持仓与成本
      - step: 2
        name: 首阴资格审查
        question: 这根阴线是首阴，还是弱化史之后的兑现？
        action: 回看前三到五个交易日，排除连续冲高回落、放量滞涨、多次突破失败与分时走弱；存在弱化史则不再按首阴处理
        data:
          - 个股日K
          - 分时与量能
      - step: 3
        name: 第一反馈处置
        question: 第一反馈是否达标？
        action: 次日看主动反包、低开高走、红盘震荡与重心抬升；不达标即降风险，允许一次修复的标的才进入第二反馈
        data:
          - 个股日K
          - 分时与量能
      - step: 4
        name: 第二反馈定去留
        question: 第二反馈是否主动止跌并站回关键位？
        action: 要求主动止跌、站回关键位、强于板块且不再破位；不达标执行退出，不允许出现第三反馈
        data:
          - 个股日K
      - step: 5
        name: 执行价格与减仓节奏
        question: 已决定退出，怎么卖？
        action: 退出结论触发后只优化执行价格；信号驱动的减仓当日执行（如形态信号减半），做T回合允许跨日但不得用来规避信号减仓
        data:
          - 持仓与成本
          - 分时与量能
    falsification:
      - 第二反馈主动站回关键位、相对板块转强、日内重心持续抬高且后续不再破位，撤销连跌判断
      - 阴线前已有明确弱化史、板块同步退潮或连续阴线下移，首阴资格不成立
      - 单纯低开、盘中破线或瞬时翻红，不足以独立确认修复
      - 红盘退出窗口不是每次必然出现，不得预设
    validation:
      historical_hit_rate: pending-m1
      applicable_regime: null
      known_failures:
        - 两次反馈的严格程度为课程口径，未做参数化回测
        - 与「做T不必当日完成」并存，需按触发源分层，不可互相否定
    matched_framework: operation_strategy
    applicable_themes:
      - 强趋势
      - 首阴
      - 止损
      - 反馈验证
      - 减仓
