  subject: 布林通道辅助判断买卖点
  topic: 超强区域回踩确认第一类买卖点，转向轨道处构造第二类买卖点
  statement: 布林通道上中下三个轨道，一般在上轨以上和下轨以下运行是超强状态，中枢移动时肯定会出现，前者是上涨超强后者是下跌超强。从上轨上跌回其下或从下轨下涨回其上，都是从超强区域转向一般性区域，这时候如果再次的上涨或回跌创出新高或新低，但不能重新有效回到超强区域，就意味着进入中阴状态，也就是第一类买卖点出现了。对第二类买卖点的辅助判断更有效：进入中阴状态后上轨下轨滞后反应，第一次回跌或回升后再次向上或下跌时轨道才转向，而这时候转向的上轨和下轨往往成为最大的阻力和支持，第二类买卖点在其下或其上被构造出来。
  evidence_quote: 在上轨以上和下轨以下运行是超强状态，一般中枢移动时肯定会出现……从上轨上跌回其下或从下轨下涨回其上，都是从超强区域转向一般性区域，这时候，如果再次的上涨或回跌创出新高或新低但不能重新有效回到超强区域，那么就意味着进入中阴状态了，也就是第一类买卖点出现了……这时候转向的上轨和下轨，往往成为最大的阻力和支持，使得第二类买卖点在其下或其上被构造出来。
  interpretation: 课中所举大盘与个股只是2007年的示例，规则本身与品种无关、在不同级别中一样有效。注意这只是辅助判断，技巧性与熟练程度很关键，作者称准确率接近百分百但并非绝对性判断，必须不断看图总结自己的经验。
