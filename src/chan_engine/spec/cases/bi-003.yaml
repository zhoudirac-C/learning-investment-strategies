# BI-003 77课"区间"口径边界（ADR-001 直接证据，课77）
# claim-20070905-001-b：顶分型中最高那 K 线的区间至少要有一部分高于
#   底分型中最低那 K 线的区间。"区间"读法有歧义，见 docs/design/chanlun-quant-adr.md ADR-001。
# 构造（A/B 两种解释结论相反的判别样本）：
#   底@1：中间 K 线（bar1）区间 [11.0,9.0]；左肩 bar0 为大区间 K 线（高 12.3）
#     → 底分型"整个分型区间"合并高 = 12.3（口径 A），"最低那 K 线自身"高 = 11.0（口径 B）。
#   顶@5：中间 K 线（bar5）区间 [11.4,10.7]，合并高 = 11.4（两种口径相同）。
#   口径 A：11.4 < 12.3 → 顶在底范围内 → 不成笔；
#   口径 B：11.4 > 11.0 → 有一部分高于 → 成笔。
# expect 按 ADR-001 仲裁结论 B 写（2026-07-19 UP 评审门拍板，由口径 A 的 bi: [] 翻转）：
#   成笔 (1,5,up)；两分型均未被反向笔确认 → bi.sure: false。
#   fx.sure 按 M2-1 位置约定（末位 False、其余 True，与 BI-004/BI-005 同口径）：
#   fx 表 2 元素 → [True, False]（首位=非末位 True，末位 False）。
#   （chanpy 在 strict 下仍 bi=[]，待 M2 配置 bi_fx_check=loss 后通过。）
#
# 修复说明（评审 C-1，2026-07-19）：原版把"抬高合并高"放在右肩 bar2（高 12.0），
#   几何上不可实现——右肩按分型定义必高于底中间 K 线，若再高于反弹顶，则它与
#   后续 K 线非包含即自成顶分型（原案即因此混入未处理包含：bar2 吞并 bar3/bar4，
#   合并后设计的顶@5 不存在，czsc/chanpy 实测都遇不到判别场景）。现把合并高来源
#   移到左肩 bar0：右肩 bar2（高 11.2）低于顶@5（11.4），反弹腿单调上升，全程
#   零包含、无多余分型；bar3 为独立 K 线（新笔口径满足），两分型不共用 K 线。
# 实证（修复时真实适配器复跑）：chanpy strict（默认配置）bi=[]，且拒绝正来自
#   区间检查——同输入 bi_fx_check=half/loss 时 chanpy 画出 (1,5,up)；czsc 画出
#   (1,5,up)。判别场景两实现均真实走到。
case_id: BI-003
claim_refs:
  - claim-20070905-001-b
bars:
  - [12.0, 12.3, 9.5, 10.2]
  - [10.2, 11.0, 9.0, 9.4]
  - [9.7, 11.2, 9.6, 11.0]
  - [11.0, 11.3, 10.0, 11.2]
  - [11.2, 11.35, 10.4, 11.3]
  - [11.3, 11.4, 10.7, 11.35]
  - [11.3, 11.38, 10.3, 10.5]
  - [10.5, 10.8, 9.8, 10.0]
expect:
  fx:
    - {idx: 1, type: down, sure: true}
    - {idx: 5, type: up, sure: false}
  bi:
    - {start_idx: 1, end_idx: 5, dir: up, sure: false}
