  statement: 6月17日存储板块大涨，直接催化是长鑫存储注册完成上市在即，叠加存储行业一季度创纪录增长（全球半导体营收环比+27%创历史新高，存储器环比+80%），存储器已占一季度半导体总营收40%以上（长期均值约20%）。长鑫科技(未上市)2026年一季度营收508亿元同比增长719%，预计上半年归母净利润500-570亿元同比增长2244%-2544%。受此带动兆易创新(603986)、香农芯创(300475)、精智达(688627)等多股大涨。
  evidence_quote: 今日大涨题材聚焦闪存+内存+半导体。直接催化是长鑫存储注册完成、上市在即，叠加存储行业一季度动辄十倍同比增幅的背景，市场开始抢跑中报预期。2026年一季度全球半导体营收环比增长27%至3190亿美元，创有史以来最高单季环比增幅；其中存储器营收环比增幅超80%。存储器已占一季度半导体总营收的40%以上。长鑫科技2026年一季度营收508亿元，同比增长719%；预计2026年上半年归母净利润500-570亿元，同比增长2244%-2544%。
  interpretation: UP判断存储为本轮科技内部切换的核心方向。长鑫上市是标志性节点，国内DRAM产业处于产能爬坡、制程升级、产品结构优化多重红利叠加的历史窗口。存储标的在中报期确定性最高，因此率先走强。
