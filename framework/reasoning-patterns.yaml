    - 主线内部出现连板龙头、中军震荡、低位补涨的完整梯队
    - 新催化方向快速涨停且板块平均涨幅显著，资金愿意做多新方向
    merge_suggestion: 归入情绪周期框架：普涨后分歧良性判定属周期定位与拐点识别。
