subject: 底部构造需要第二只脚——反抽后二次回踩确认
timeframe: permanent
statement: "底部构造的最常见路径是：急跌→反抽（通常2-3个交易日）→二次回踩（第二只脚）→底部确认。反抽阶段的特征是缩量反弹、无强扩散主线。第一只脚的低点在无外部冲击下短期难以跌破，但真正的安全买点在第二只脚回踩时——不仅低点确认，且博弈安全性更高。明日若延续分歧释放，盘中可能出现技术性回暖窗口。"
evidence_quote: "本轮反抽自周二启动，始终未形成强扩散主线→持续性与强度均弱于3月上半旬。反抽行情周期通常仅2~3个交易日。周一低点在无外部超预期冲击下短期难以跌破→第二只脚回踩将具备更高博弈安全性。明日开盘若延续分歧释放→盘中技术性回暖窗口，分歧越强回暖预期越强。"
interpretation: "UP首次系统阐述底部构造的'双底'结构方法论。这是技术分析中'双底/W底'在UP大盘分析体系中的实际应用：第一只脚确认下限，第二只脚验证支撑。更重要的是他给出了操作节奏——反抽只适合小仓位试错，真正的建仓要等第二只脚确认。这与后来的'缩量回踩+核心主线抗跌=新周期确认点'(claim-20260524-014)一脉相承，是UP底部操作纪律的核心。"
