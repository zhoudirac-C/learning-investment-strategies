  subject: A级刺透的三步建仓与止损
  timeframe: permanent
  statement: A级刺透的操作分三步：当天试探性建仓；第三天若继续上涨并站上第二根阳线最高点则加仓；第三天出现阳线包掉第二根阳线（三日翻红）可加至目标仓位；若第三天跌破第二根阳线最低点，视为信号失败立即止损，止损位为刺透阳线的最低点。
  evidence_quote: 如果是A级的刺透，那么就是底部信号，对吧？刺透的当天我们可以试探性的建仓。那么第二步就是观察第三天，如果第三天继续上涨，并且站在了第二天的最高点，我们甚至可以进行一个加仓的动作。……如果第三天跌破了第二天的一个最低点，那么则视为信号失败，立即止损。那么它的止损位。就应该是刺透阳线的最低点。
  interpretation: 建仓是「试探→确认→加满」的三段式，每段都以次日价格行为作为条件；止损锚定形态自身低点，不随情绪移动。
