  subject: 顶分型的辅助操作法
  topic: 形成顶分型那天冲高卖而非等收盘，用5日线与小级别盘整背驰判断中继与回补
  statement: 利用分型做辅助判断至少用日线以上K线图，变动太快的准确率大大有问题。操作要点：一、顶分型的时候是形成顶分型那天冲高卖，而不是收盘等顶分型都很明确了再走，当天不破前一天高位就可以提前确认；二、顶分型后如果有效跌破5日线，大概率要走出笔折腾好一阵子；如果没有有效跌破5日线，往往只是中继；三、本质上分型都是某小级别的第一、二买卖点成立后出现的，所以卖出后看小级别跌破是否形成盘整背驰，形成则调整最多演化成更大级别震荡可回补，非盘整背驰的一定要等待背驰出现才可以回补；四、大级别分型和小级别第一二买卖点不是绝对对应关系，有前者一定有后者，有后者不一定有前者，分型只是辅助。
  evidence_quote: 注意，顶分型的时候是形成顶分型那天冲高卖，而不是收盘等顶分型都很明确了再走……如果顶分型后有效跌破5 日线，那就没什么大戏了……但如果没有有效跌破5 日线，那往往只是中继……注意，利用顶分型进行操作时，必须配合小级别的图。本质上，分型都是某小级别的第一、二买卖点成立后出现的……注意，大级别的分型和某小级别的第一、二买卖点并不是绝对的对应关系，有前者一定有后者，但有后者并不一定有前者，所以前者只是一个辅助。
  interpretation: 课中以2007年多只自持股演示冲高卖与跌破5日线后看盘整背驰回补的完整短差，个股仅作历史案例。操作难点有二：必须与小级别的第二买卖点配合看；要利用好盘整背驰，避免回补过早或漏掉回补。买点的情况反过来就是。
