  subject: 走势当下的操作思维
  topic: 无须预测，走势段落是否延续由当下的背驰结构决定
  statement: 股票的走势没有一个必然的上帝式的意义，所有的意义都是当下赋予的。例如30分钟的a+A+b+B+c中，A走出来后不可能断言一定有B；b段走还是不走不需要预测，由b段当下的走势决定：如果b段和a段相比出现明显的背驰就意味着要走，否则就不走。只要当下结构没有出现符合区间套背驰条件的走势就一直等待，走势自然会延伸出足够力度使背驰成为不可能。一切的预测都是没意义的，当下的感应和反应才是最重要的，必须随时读懂市场的信号并按信号操作。
  evidence_quote: 一切的预测都是没意义的，当下的感应和反应才是最重要的。你必须随时读懂市场的信号，这是应用本ID 理论最基础也是最根本的一点……这很简单，这不需要预测，因为b 段是否走，不是由你的喜好决定的，而是由b 段当下的走势决定的。如果b 段和a 段相比，出现明显的背驰，那就意味着要走，否则，就不走。
  interpretation: 课中给出完整操作示范：5分钟向上离开中枢背驰就先出来，5分钟回拉不回到中枢即第三类买点则回补等c段，c段与b段同样处理，不背驰就等第三个中枢，如此类推，全程无预测只按定义看。读懂市场却不按信号操作、老存侥幸心理，是思维问题，与读不懂同罪。
