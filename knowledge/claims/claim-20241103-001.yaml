  statement: 做T最重要的是心态：在趋势向上的股上积年累月把小利润T出来，每单哪怕只有几百块，日积月累也能T出数万元；学习次序是先心态、再选股、再分时线
  evidence_quote: 最重要的这点就是心态。我们持仓一只股做T，就是为了积年累月不断地把利润T出来。……每天的T，可能说你每一单就几百块，但是你积年累月，你相信它是上涨趋势的，你T个一万三万七八万都很有可能的。……做T最重要的就是心态，你先学会心态。之后学会选股。之后再去学这些分时线。
  interpretation: UP展示2022年做T表格共T出11858元，强调做T收益来自复利式积累而非单次暴利。心态排在技术（分时线）之前，因为拿不住、T飞后追高等都是心态问题而非技术问题。
