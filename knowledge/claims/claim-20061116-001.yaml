  subject: 年线选股法
  topic: 放量突破年线后缩量回调年线的股票是黑马，年线下的一律不看
  statement: 牛市中最简单可靠的找牛股方法：盯着所有放量突破上市首日最高价的新股，以及放量突破年线然后缩量回调年线的老股，这都是以后的黑马；特别那些年线走平后向上出现拐点的股票一定要看好；至于还在年线下面的股票先别看了，等它们上年线再说。原文示例：宝钢突破年线后缩量回调至年线附近，再放量启动，约三周上涨五成。注意小盘股的骗线一般比大盘股多，需自行甄别。
  evidence_quote: 就是盯着所有放量突破上市首日最高价的新股以及放量突破年线然后缩量回调年线的老股，这都是以后的黑马。特别那些年线走平后向上出现拐点的股票，一定要看好了。至于还在年线下面的股票，先别看了，等他们上年线再说。其实，这就是在牛市中最简单可靠的找所谓牛股的方法。
  interpretation: 规则可分解为三个可执行过滤条件：价格在年线上方、突破时放量确认、回调时缩量且在年线附近企稳。年线（约250天线）在第8课被列为"能搞"分类的示例标准，两课互相印证。宝钢为2006年历史案例，仅作形态示例。
