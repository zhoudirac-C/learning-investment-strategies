  subject: 韩国市场作为AI产业链景气体温计
  timeframe: trend
  statement: 韩国市场是AI产业链的体温计：韩国拥有三星电子、SK海力士两大存储巨头，存储行业周期弹性极强，需求变化第一时间反映在企业业绩上。三个观测维度——韩国综指能否止跌、存储双巨头能否同步企稳、韩元能否同步稳定。韩国市场对AI产业链景气变化的反应比纳斯达克更直接。
  evidence_quote: 韩国市场的独特结构：韩国拥有三星电子、SK海力士两大存储巨头，覆盖DRAM、NAND、HBM等AI服务器核心存储产品，存储行业周期弹性极强，需求变化会第一时间反映在企业业绩上。三个核心观测维度：第一是韩国综合指数能否止跌，第二是SK海力士和三星电子能否同步企稳，第三是韩元能否同步稳定。行情领先性特征：韩国市场结构高度集中在存储和电子行业，对AI产业链景气变化的反应比纳斯达克更直接。
  interpretation: UP提出了一个独特的观测框架：韩国市场作为AI产业链的前瞻指标。由于韩国股市高度集中于存储（三星/SK海力士），而存储周期对AI需求变化极为敏感，韩国股市的拐点往往领先纳斯达克。当日A股走强的前置信号就是韩国股市从急跌转止跌——这提供了一个跨市场验证工具。
