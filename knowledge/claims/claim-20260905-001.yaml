  timeframe: permanent
  statement: 美国债券战争分两战场：长端战场看10/20/30年国债价格——财政赤字、长期通胀、久期供给、期限溢价与财政信用的利息定价，是慢战争（无决战，阵地一寸寸丢）；短端战场看SOFR、TGCR、EFFR、银行准备金与SRF——财政部发债资金进TGA账户抽走银行准备金，同时交易商库存增加需要更多现金，现金供需同向挤压可致Repo利率飙升。2019年9月案例：政策目标区间2%-2.25%但EFFR升到2.3%超上限，纽约联储拿出750亿隔夜Repo操作才稳定系统——即使抵押品是最安全的美债，现金缓冲降到某个位置也能把美元融资市场挤爆。
  evidence_quote: 在19年9月的时候就发现发生过这样一个事情。当时，美联储的政策目标区间是2%到2.25%，但是EFFR升到了2.3%，超过目标区上限。……因此，即使抵押品是世界上最安全的美国国债，只要银行体系的现金缓冲降到了某个位置，国债供给和结算需求也可以突然把美元融资市场直接挤爆。
