  timeframe: permanent
  statement: 买三（假跌破/假摔）：价格跌破均线但均线本身仍保持上升，随后短时间内重新收回均线之上；重点不是跌破而是跌破之后发生了什么——若跌破后继续放量下行且均线斜率迅速走平可能是真趋势破坏，若抛压没有继续扩散、很快重新被承接站回均线，则很可能是失败的向下突破，相当于第一次压力测试（空方有打穿趋势的机会但没成功），即主力洗盘。条件：均线仍向上、收回速度要快。UP评分胜率4星、赔率4星、总分8星，比买二少一星因为已经历一次真实破位；买三是买二的补充，两者本质都是测试上升趋势成本区的承接。
