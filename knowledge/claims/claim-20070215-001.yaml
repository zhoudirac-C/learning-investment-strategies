- id: claim-20070215-001-b
  source_path: sources/chanlun/lesson_031.md
  source_date: '2007-02-15'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 成本为零的资金管理程序
  topic: 成本为0前把成本变0，之后挣股票直到历史性大顶
  statement: 一个最简单又最有效的资金管理程序：当成本为0以前，要把成本变为0；当成本变成0以后，就要挣股票，直到股票见到历史性大顶，也就是至少出现月线以上的卖点。具体做法：股票开始上涨后，除途中利用小级别不断弄短差外，在股票达到1倍升幅附近找一个大级别的卖点出掉部分，把成本降为0，原来投入的资金就全部收回；其后利用每一个短差，上面抛了以后都全部回补，股票越来越多而成本永远为0。合理的持仓结构就是拥有的0成本股票越来越多，直到大级别上涨结束后才全部清仓；资金则不断增加参与的股票种类重复该程序，操作资金不增加，这是最稳固的资金管理基础。
  evidence_quote: 一个最简单又最有效的管理，就是当成本为0 以前，要把成本变为0；当成本变成0 以后，就要挣股票，直到股票见到历史性大顶，也就是至少出现月线以上的卖点……还要在股票达到1 倍升幅附近找一个大级别的卖点出掉部分，把成本降为0。这样，原来投入的资金就全部收回来了。
  interpretation: 这是第26课把凭证变负价格目标的操作版。挣股票阶段的依据是一个股票盘整时间占一半以上，大型盘整中抛掉的筹码不仅能全挣回来还可能比底部更多。该程序同时解决大资金难题：不增加操作资金、增加股票种类、成本都是0，避免被迫当庄家。
