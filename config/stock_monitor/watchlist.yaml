# === 市场框架（来自 6/10 复盘总纲）===
market_framework:
  up_quote: 「高位反弹减仓，低位耐心等待；涨价为王，业绩为锚；短期不猜涨跌，中线看切换；冷眼旁观，等待结构性的分化。」
  current_stage: 弱势震荡筑底期 — 缩量防守日，不可做进攻动作。大盘调整近一个月跌超300点，中线已较充分，但修复弹性依赖外围（美联储路径+油价）
  core_operation: 右侧进场、量价确认 — 等指数站回关键均线+放量板块带头再加仓。宁可踏空一段启动，也不在筑底反复中被反复消磨。
  two_switching_logics:
    1_高低切换: 高位科技硬件/存储/CPU/科创50反弹减仓；资金流向跌深、低位、有预期的方向
    2_涨价为王: 弱市里唯有真实涨价+需求放量的品种能坚挺。真正值得配置的是「低位+涨价」交集（六氟化钨、球形硅微粉、前驱体）
  hedge_framework:
    情景A_鸽派科技修复: 进攻仓 = AI硬件 + 硅片 + 出海链
    情景B_地缘油价升级: 对冲仓 = 涨价材料(WF6/钨) + 商业航天 + 核电
  invalidation_conditions:
  - 全A指数继续破位→筑底失败→全部降仓至1成以下
  - 外围（美股/AI capex叙事）出现系统性崩坏→涨价逻辑证伪
  - 6/17 FOMC点阵图降息预期归零+油价持续上行→情景B全面主导→提高对冲仓比例

