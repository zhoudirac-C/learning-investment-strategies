  subject: 走势类型连接的结合律
  timeframe: permanent
  statement: 走势类型的连接符合结合律，即A+B+C=（A+B）+C=A+（B+C），且A、B、C的走势类型级别可以不同；站在多义性的角度，根据该结合律，任何一段走势都可以有很多不同的释义。
  evidence_quote: 上堂课提到走势类型连接运算的结合性，也就是走势类型的连接符合结合律，即A+B+C=（A+B）+C=A+（B+C），A、B、C 的走势类型级别可以不同。因此，站在多义性的角度，根据该结合律，就不难知道，任何一段走势，都可以有很多不同的释义。
  interpretation: 结合律是缠论走势分解多义性的数学基础：连接运算与分组方式无关且允许级别混搭，意味着同一段走势存在多个同等合法的分解视角，这是后续重新组合、当下判断等全部应用的逻辑前提。
