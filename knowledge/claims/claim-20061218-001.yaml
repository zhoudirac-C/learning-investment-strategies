  extracted_at: '2026-07-18'
  subject: 缠中说禅走势中枢
  topic: 至少三个连续次级别走势类型重叠部分构成中枢，以此精确定义盘整与趋势
  statement: 缠中说禅走势中枢：某级别走势类型中，被至少三个连续次级别走势类型所重叠的部分。级别之次不可能无限，对最后不能分解的级别（实际中一般设为1分钟或5分钟线），其中枢定义为至少三个该级别单位K线重叠部分。有了中枢即可给出最精确的定义：缠中说禅盘整：某完成的走势类型只包含一个缠中说禅走势中枢；缠中说禅趋势：某完成的走势类型至少包含两个以上依次同向的缠中说禅走势中枢，方向向上为上涨、向下为下跌。任何图形上的向上+向下+向上或向下+向上+向下都必然产生某一级别的中枢，不包含任何中枢的走势在正常延续的市场中不可能存在。
  evidence_quote: 某级别走势类型中，被至少三个连续次级别走势类型所重叠的部分，称为缠中说禅走势中枢……缠中说禅盘整：在任何级别的任何走势中，某完成的走势类型只包含一个缠中说禅走势中枢……缠中说禅趋势：在任何级别的任何走势中，某完成的走势类型至少包含两个以上依次同向的缠中说禅走势中枢，就称为该级别的缠中说禅趋势。
  interpretation: 中枢概念把第15课用高低点定义的趋势盘整升级为可递归、可测量的结构定义，是缠论全部定理的支点。定义的递归性通过设定最低不可分解级别（1分钟或5分钟K线）落地，避免无限下沉。
