  timeframe: short-term
  statement: 当前低迷行情是一次去杠杆：与2015年杠杆牛的异同——当时共识基于流动性，这次AI共识基于基本面（大家都相信AI能改变一切、都all in，交易太拥挤）；去杠杆需要时间和空间，目前兼而有之：空间上腰斩甚至跌60%已经够了，时间上已经两个月（调半年也可以接受，改变世界的東西等半年无妨），但空间层级应该是到了。
  evidence_quote: 我认为就是一次去杠杆儿，对吧？它和一八、一五年的那次去杠杆儿……只不过当时的共识是什么呢？不是基于基本面的共识啊，它是基于这种流动性的共识。那么这次的共识呢，AI的这次共识，它是基于基本面的共识。……这波去杠杆儿呢，当然需要时间，对吧？当然需要空间。这两个东西现在目前来看啊，兼而有之，对吧？空间你一个腰斩或者腰斩多，甚至跌百分之六十，这空间够不够了？当然够了
