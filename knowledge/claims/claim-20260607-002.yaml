  subject: K线信号层级
  topic: 实体信号 vs 引线信号：不可化解 vs 可化解
  statement: 实体型K线（长红线、长黑线）出现即执行，不可化解。引线型K线（上吊线、流星线）可以被化解：次日高开高走化解成功则趋势继续，失败则信号成立。引线信号的本质是暴露了对手方的真实力量（空方首次进攻或多方力竭），而非当日胜负结果。
  evidence_quote: 所以这种线你需要去在次日再去确认一下，因为K线它本身它是已经告诉你市场发生某种变化，但是能不能延续，你是需要去下一根K线来进行确认的...调线它是会被化解的...但如果隔天它不能够高开高走，尤其是出现了低开或者是低走，那么上调线的这个信号就会成立。
  interpretation: 实体信号=判决（已确认的胜负），引线信号=线索（暴露力量对比变化但未决定性胜利）。化解机制是K线确认逻辑的核心——单根K线给信号，下一根K线给确认。
