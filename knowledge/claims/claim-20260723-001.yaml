  timeframe: intraday
  statement: 海外链(光模块/PCB/服务器)昨日回落幅度较大。若属假摔正常今日应反包昨日阴线收盘价高于周二。叠加谷歌capex指引上调后验证含义变了：原本只是技术层面假摔与否，现在是基本面利好能否被资金接住。如果谷歌利好背景下海外链仍然反包失败，那就不是单纯的技术性弱势，而是资金暂时不认海外算力这条逻辑——消息面与盘面出现背离。利好砸下来接不住，性质比无消息的震荡磨底更差。
  evidence_quote: 以光为代表的海外链：昨日回落幅度较大。若属假摔，正常今日应反包昨日阴线，收盘价高于周二。而叠加隔夜谷歌资本开支指引上调之后，这个验证的含义变了：原本只是技术层面的假摔与否，现在则是基本面利好能否被资金接住。如果今天海外链在谷歌上调capex指引的背景下仍然反包失败，那就不是单纯的技术性弱势，而是资金暂时不认海外算力这条逻辑——消息面与盘面出现背离。利好砸下来接不住，性质要比无消息的震荡磨底更差一层。
  interpretation: UP给出了一个极具操作价值的检验框架：谷歌capex上调是基本面利好，海外链今天的表现是资金态度的直接检验。反包=假摔确认，资金认逻辑；反包失败=资金不认海外算力逻辑，利好砸下来接不住。后者性质更差意味着如果今天反包失败，海外链要减仓/规避。
