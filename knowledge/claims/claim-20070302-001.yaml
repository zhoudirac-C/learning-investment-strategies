  topic: a与c并非必然存在，b可以是跳空缺口，走势可简化为两个孤零零的中枢
  timeframe: permanent
  statement: 在最极端的情况下，a+A+b+B+c的走势系列类型里，a和c并不是必然存在的，而b完全可以是一个跳空缺口，这样整个走势就可以简化为两个孤零零的中枢。
  evidence_quote: 在最极端的情况下，在a+A+b+B+c 的走势系列类型里，a 和c 并不是必然存在的，而b 完全可以是一个跳空缺口，这样，整个走势就可以简化为两个孤零零的中枢。
  interpretation: 趋势形态的构成要素有伸缩空间：连接段可以弱到只是一个缺口，首尾段可以缺失。分析时不能机械等待教科书式的完整五段结构，中枢才是走势的必要构件，连接段的有无与强弱不影响走势划分。
