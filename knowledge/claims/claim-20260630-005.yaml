  subject: 乌云盖顶与刺透的对称性
  timeframe: permanent
  statement: 乌云盖顶与刺透形态完全对称：方向、颜色、跳空方向、收盘位置全部相反；共同点是「反向一方赢了但不彻底」——正因为不彻底，才区别于吞没，才构成独立的一档信号。
  evidence_quote: 所以乌云盖顶它和刺透形态是完全对称的。……但同样，它和刺透形态是对称的，也就是说空方今天的力量它还没有强到完全包掉昨天的阳线，那么收盘价也没有跌破昨天阳线的开盘价。也就是说空方今天赢了，但赢的不彻底。
  interpretation: 把两者当作一个信号族统一处理，可减少记忆负担；差别只在方向，判定逻辑（跳空+50%+不完全反超）完全复用。
