  evidence_quote: DIF（快线）= 12 日 EMA - 26 日 EMA；DEA（慢线）= DIF 的 9 日 EMA；国内软件柱子 = 2×(DIF-DEA)。
  interpretation: 先统一指标部件和计算口径，再讨论速度、背离与价格确认，避免只看红绿柱颜色而不知道它衡量的是快慢线差值。公式按原始画面校订 OCR。
