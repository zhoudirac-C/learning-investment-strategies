- id: claim-20261015-002-c
  claim_type: methodology
  subject: 护盘假设与假设更新机制
  timeframe: short-term
  statement: 当前假设是护盘护得住、三个交易日内见效；等护不住了再做新的假设。
  evidence_quote: 大胆假设，小心求证。目前的我假设就是护得住，三个交易日内见效。等护不住了，再做新的假设。
  interpretation: 鳄鱼派的操作前置是「先立假设、再设定验证窗口」：给出可证伪的时间约束（三个交易日），并预先声明失效后如何更新假设。这是可复用的决策机制，而非单次预测。
  confidence: high
