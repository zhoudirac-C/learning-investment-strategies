  subject: 完全分类的层次性
  topic: 完全分类必须是多层次的，级别系统给出立体的操作依赖
  statement: 完全的分类不是单层次的，一定也必须是多层次的；缠论最重要的特点之一就是自然给出了分类的层次，即不同的自然形成的级别。不同级别有不同的完全分类，综合起来就是立体的完全分类系统，这才是操作必须依赖的。小资金可以完全用一个层次的完全分类进行操作，大一点的资金则不合适的。在30、5、1分钟三层次构成的系统里，任何当下状态都对应着不同层次完全分类中的一个现实状态，可以逻辑严密地推算出后面下一步各层次的状态变化。
  evidence_quote: 但完全的分类，不是单层次的，一定也必须是多层次的。本ID 的理论最重要的特点之一，就是自然给出了分类的层次，也就是不同的自然形成的级别。不同的级别，有不同的完全分类，而综合起来，就有了一个立体的完全分类的系统，这才是我们的操作必须依赖的。
  interpretation: 单层次分类只够小资金用，多层次系统的价值在于层次间状态变化有先后逻辑，能提前推演下一层的变化。课中上证指数从6124点下来的三层次推演是2008年当日案例，方法本身不依赖当时点位。
