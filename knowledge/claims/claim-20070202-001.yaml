  subject: 区间套精确定位转折点
  topic: 大级别转折点可通过不同级别背驰段逐级收缩范围而确定
  statement: 缠中说禅精确大转折点寻找程序定理：某大级别的转折点，可以通过不同级别背驰段的逐级收缩范围而确定。即先找到大级别的背驰段，然后在次级别图里找出相应背驰段在次级别里的背驰段，将该过程反复进行下去直到最低级别，相应的转折点就在该级别背驰段确定的范围内；如果最低级别可以达到每笔成交，理论上大级别转折点可以精确到笔的背驰上，甚至就是唯一的一笔。该思路与数学分析里的区间套定理同构，但因级别不是无限可分的，达不到数学上唯一一点的精度。
  evidence_quote: 某大级别的转折点，可以通过不同级别背驰段的逐级收缩范围而确定。换言之，某大级别的转折点，先找到其背驰段，然后在次级别图里，找出相应背驰段在次级别里的背驰段，将该过程反复进行下去，直到最低级别，相应的转折点就在该级别背驰段确定的范围内。
  interpretation: 大资金在大级别背驰段里越跌越买即可，小资金则从月线周线日线一路往下找最精确的背驰点。作者自述1分钟的背驰段一般就是以分钟计算的事情，对大级别转折点已经足够精确，追求精确到笔实际意义不大。
