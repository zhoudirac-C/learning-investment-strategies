  timeframe: permanent
  statement: 买四（下跌趋势中价格加速下跌远离均线、负乖离率过大）买的是超跌反弹，但总分只有4分（胜率2星赔率2星）：胜率低因为极端情况没有天然边界，赔率不高因为均值回归第一目标位往往只是靠近均线、而下降中的均线本身可能成为新压力区——老手死于抄底。买四不适合作为主力的主动买点，它是预警：乖离进入历史极端说明下跌进入高波动非线性阶段，继续跟着情绪杀跌的性价比在下降，应把买四当作开始观察的信号；参与均值回归交易时整体仓位和失效纪律要比趋势交易更严格，因为是逆着趋势做的。
  evidence_quote: 因为买四你是不适合作为主力的一个主动买点的，它其实是预警。也就是说乖离进入历史极端，说明下跌已经进入了高波动、非线性的一个阶段。那么这个位置，我们继续跟着情绪杀跌的性价比在下降。
  interpretation: 买四的正确用法是停止杀跌并开始观察，而非主动抄底；逆势交易需要更严的仓位与失效纪律。
