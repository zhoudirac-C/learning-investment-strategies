  school: gator
  name: 主线更替：换则生、量能约束与候补清单（2026-09/10）
  chapter: 50
  description: 鳄鱼派（gator school）第50章：主线更替：换则生、量能约束与候补清单（2026-09/10）。 IF 挖坑后主线不换（仍怼旧主线） THEN 指数重复循环：反弹涨一下 → 大跌 → 再反弹 → 再大跌， 且成交量越来越少（单调递减，可直接量化） IF 换出新主线 THEN 才可能走出新行情 —— "换则生" - **可证伪指标**：只要后续每次反弹的量能一波比一波低，就坐实"主线未换、循环未破"。 涉及：50.1 "换则生"：不换主线的可观测后果 `[核心][可计算]`；50.2 科技主线的缩量约束（2026-09-29 + 2026-10-08，非单源）`[核心][可计算]`；50.3 防御线：高股息的两条纪律（2026-10-08）`[重要]`；50.4 候补主线清单（2026-10 语境，带时间戳）`[重要]`。 用于鳄鱼派资金生态位与规则体系的判断。
  trigger:
