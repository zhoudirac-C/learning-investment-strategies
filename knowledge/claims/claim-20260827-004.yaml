  timeframe: short-term
  statement: 周二中午讲过金健米业(600127)带头转强，因此会出现二波的走势；种业板块内部以轮动为主：登海种业(002041)换成万向德农(600371)，低位连板股一茬茬地换，细分方向从农产品过渡到化肥。
  evidence_quote: 因此我在周二中午的时候跟大家讲过金健米业带头转强，因此会出现二波的走势。……农业持续性还是不错的，许多个股都是三连阳，但内部仍以轮动为主：从登海种业换成万向德农，低位连板股一茬茬地换，细分方向也由农产品过渡到了化肥。个人判断，与其被动地跟随轮动，不如聚焦在个别股性活跃的个股上。
  interpretation: 农业板块的操作策略是盯股性活跃个股而非被动跟轮动；金健米业作为高标辨识度标的，其二波走势是种业抱团逻辑的具体载体。
