  subject: 缠中说禅短差程序
  topic: 大级别买点介入后在次级别第一类卖点减仓、次级别第一类买点回补
  statement: 缠中说禅短差程序：大级别买点介入的，在次级别第一类卖点出现时，可以先减仓，其后在次级别第一类买点出现时回补。例如对于周线买点介入的，就应该利用日线的第一类卖点减仓，其后在第一类买点回补。该程序适用于资金量一般（如10亿以下）的参与者以提高资金利用率；特别大的资金（如50亿以上）则按大级别买点介入后持有到大级别卖点出现。操作级别应根据资金量以及性格来定。
  evidence_quote: 缠中说禅短差程序就是：大级别买点介入的，在次级别第一类卖点出现时，可以先减仓，其后在次级别第一类买点出现时回补。对于周线买点介入的，就应该利用日线的第一类卖点减仓，其后在第一类买点回补……根据相应的资金量以及性格去定自己的操作级别。
  interpretation: 短差程序是买点定律在持仓管理上的镜像应用：底仓级别不动，用次级别买卖点做仓位增减，把大级别持有与中小资金的资金利用率矛盾调和起来。选择操作级别的两个变量是资金量与性格。课中以贵州茅台周线持有叠加日线短差为历史案例。
