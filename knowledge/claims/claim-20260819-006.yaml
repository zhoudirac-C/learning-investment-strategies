  subject: 具身智能三类数据来源
  timeframe: industry
  statement: 几乎每次重大算法突破背后都有成熟数据基础设施（AlexNet背后是ImageNet，大语言模型背后是几十年互联网文本代码图像），但物理世界没有对应的互联网——网上有无数鸡蛋照片却没有人类抓鸡蛋时五指各自施加多少压力的数据库；具身智能数据分三类：真机数据（绝对真实但极贵，机器人工作一小时最多产生一小时交互数据）、人类视频（规模大、提供任务语义层知识，但缺精确的机器人动作、力矩和触觉标签）、仿真数据（可无限扩张、天然提供位置速度接触力等物理标签，但有真实世界迁移差距）；近年受关注的是仿真数据（已有团队仅靠仿真世界模型+强化学习训练机器人进入真实产线执行随机物体抓取）。
  evidence_quote: 互联网上它会存在无数的鸡蛋的照片，也会有大量的文章去解释鸡蛋容易碎，但却没有数据库记录人类抓鸡蛋时这五根手指各自施加了多少压力。真机数据是绝对的真实，但是这种数据的价格极其昂贵。人类视频的规模非常大，但却缺少精确的机器人动作、力矩以及触觉标签。仿真数据可以无限扩张，并天然提供位置、速度、接触力等物理标签，但在面临真实世界的时候它仍然会有一个迁移差距。
  interpretation: 数据基础设施缺位是具身智能的根本瓶颈；三类数据互补，长期竞争力在于谁能把几种能力结合起来。
