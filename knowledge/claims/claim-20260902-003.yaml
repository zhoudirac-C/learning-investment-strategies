  timeframe: short-term
  statement: 市场跌不下去也拉不起来时，抄底没有多少能抄的，操作纪律是大跌大买、小跌小买；液冷在最近的进攻里主动性都很强，已站上趋势，可按整个周期做T，趋势结束才出来；涨起来别追、等回调
  evidence_quote: 大跌大买，小跌小买就行了……液冷已经站上趋势了，所以点位不好判断，就按照整个周期去做，什么时候趋势结束，什么时候出来就行了。涨起来了别去追，等回调。
  interpretation: 震荡市操作三段论：仓位动作由跌幅大小触发（非线性预测）；液冷分支做T不猜点位、以趋势终结为唯一退出信号；介入方式只接受回调不接受追高
