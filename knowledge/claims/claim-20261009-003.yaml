  subject: 模式一致性的事前评价标准
  timeframe: permanent
  statement: 交易决策应按决策当下可见信息和预设规则评价，不能因事后上涨就反推不该卖、因事后下跌就反推应该卖；同一高位滞涨形态既可能深调也可能横盘突破，事前无法精准区分，同类信号应保持统一处理标准
  evidence_quote: 我们一直讲模式，讲模式的一致性，它看的就不是你单笔交易的结果的对错，而是在你当下仅有的信息里，你的操作是否符合你的固定的交易模式。用同一套事前标准去处理所有相似的盘面信号，而不是每做完一笔交易就根据结果去重新编一套解释，去改一套规则。
  interpretation: 模式评价的对象是执行质量而不是事后最大利润。卖飞与逃顶是同一事前规则的两种后续结果，不能用结果倒推规则对错。
