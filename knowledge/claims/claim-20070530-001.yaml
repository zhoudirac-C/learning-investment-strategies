  subject: 力度比较的级别规则
  topic: 1分钟以下级别力度只比较MACD柱子面积，1分钟级别还要考虑黄白线回抽0轴
  statement: 用MACD比较力度的规则与级别有关：1分钟以下级别的力度对比只需要比较柱子面积，如果是1分钟级别，就要同时考虑黄白线回抽0轴的情况。当下段与前面走势段比较力度，后者力度不大过前者就构成盘整背驰，其后的反弹一定回到前段起点位置之上。一个大的盘整背驰段的内部结构，完全可以不必有该级别的背驰，完全可以是小级别转大级别。
  evidence_quote: 注意，这里是1 分钟以下级别的力度对比，只需要比较柱子面积，如果是1 分钟级别的，就要同时考虑黄白线回抽0 轴的情况……由此就知道，B 段构成了盘整背驰，也就是后面的反弹一定回到第一个绿箭头位置之上……一个大的盘整背驰段的内部结构，完全可以不必有该级别的背驰，完全可以小级别转大级别。
  interpretation: 这是MACD辅助判断的精度细则：级别越低观察变量越少。同时给出盘整背驰的操作保证即反弹回到起点之上，并澄清背驰段内部可以靠小转大完成转折。
