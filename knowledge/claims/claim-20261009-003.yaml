  claim_type: methodology
  subject: 左右侧成本不可混杂
  timeframe: permanent
  statement: 左侧以更多卖飞换取较小回撤，右侧以等待明确走弱换取完整趋势但承担滞后卖点和更大回撤，两者无绝对优劣；不能因上一笔卖飞就改死拿、因上一笔深套就改恐慌提前卖，否则会同时承担两种模式的缺点
  evidence_quote: 你左侧卖出优势就是控制回撤，保护利润，代价就是卖飞次数多。你右侧卖出优势就是能够拿住完整的趋势，少卖飞，代价就是回撤大，卖点滞后，容易被动亏钱。所以左侧和右侧都没有绝对的好坏高低，只是承担不同的交易成本。……每一笔交易都在根据上一笔的结果去调整，那么永远被最近一次的盈亏情绪主导。这种交易就是没有固定模式，做的全是情绪。这样长期下来，你会同时吃到左侧和右侧的所有缺点。
  interpretation: 选择模式等于选择整组成本，而不是只拿想要的优势。左右侧可以根据事先体系选择，但不能被最近一笔盈亏驱动来回切换。
