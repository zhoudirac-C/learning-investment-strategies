- id: claim-20080115-001-b
  source_path: sources/chanlun/lesson_093.md
  source_date: '2008-01-15'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 两段向上笔力度比较
  topic: (1,0)后再起(1,1)，后一段力度小于前一段就是明确见顶信号
  statement: 如果市场最终选择(1,1)，那么这个(1,0)区间就有着极为重要的意义：这区间上下两段的(1,1)可以进行力度比较，一旦出现后一段力度小于前一段，就是一个明确的见顶信号，然后根据对应的走势类型进行区间套定位，真正的高点就逃不掉了。另外，(1,0)的出现若对应该上涨明确背驰完全确认结束，整个震荡区间就要以上涨的最后一个中枢为依据，只要围绕着该区间就是强的震荡，否则肯定要变成(-1,1)就是弱的震荡；弱的震荡一般一旦确认，最好还是不参与，等出现(-1,0)再说。
  evidence_quote: 如果市场最终选择（1，1），那么这个（1，0）区间就有着极为重要的意义。这区间上下两段的（1，1），就可以进行力度比较，一旦出现后一段力度小于前一段，就是一个明确的见顶信号，然后根据对应的走势类型进行区间套定位，真正的高点就逃不掉了……弱的震荡，一般一旦确认，最好还是不参与。等出现（-1，0）再说了。
  interpretation: 力度比较加区间套定位是缠论逃顶的标准动作，这里被装进笔状态框架：(1,0)区间充当两段力度比较的基准锚点。强弱震荡的划分给出了震荡参与与否的过滤条件。
