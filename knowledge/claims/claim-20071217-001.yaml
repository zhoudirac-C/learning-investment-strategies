  subject: 缠中说禅笔定理
  topic: 任何当下走势必然落在确定方向的笔中，位置只有分型构造中或延伸中两种
  statement: 缠中说禅笔定理：任何的当下，在任何时间周期的K线图中，走势必然落在一确定的具有明确方向的笔当中（向上笔或向下笔），而在笔当中的位置，必然只有两种情况：一、在分型构造中；二、分型构造确认后延伸为笔的过程中。据此可用两个变量构成的数组精确定义当下走势：1代表向上的笔，-1代表向下的笔；0代表分型构造中，1代表分型确认延伸为笔的过程中。任何当下都只有(1,1)、(-1,1)、(1,0)、(-1,0)四种状态，且这四种状态不能随便连接：(1,1)之后唯一只能连接(1,0)，(-1,1)只能连接(-1,0)，而(1,0)与(-1,0)各有(1,1)、(-1,1)两种可能连接。
  evidence_quote: 缠中说禅笔定理：任何的当下，在任何时间周期的K 线图中，走势必然落在一确定的具有明确方向的笔当中（向上笔或向下笔），而在笔当中的位置，必然只有两种情况：一、在分型构造中。二、分型构造确认后延伸为笔的过程中……任何的当下，都只有这四种状态，这四种状态描述了所有的当下走势。更关键的是，这四种状态是不能随便连接的。
  interpretation: 笔定理把完全分类落到实处：任何时刻的走势状态唯一、可机械判定，是两重表里关系体系的基石。笔是不能构成中枢的，这是笔与线段以及线段以上各种级别走势类型的最大区别。
