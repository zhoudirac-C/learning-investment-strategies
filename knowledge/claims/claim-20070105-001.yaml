  subject: 第三类买卖点
  topic: 次级别离开中枢后回试不跌破ZG为第三类买点，回抽不升破ZD为第三类卖点
  statement: 第三类买卖点定理：一个次级别走势类型向上离开缠中说禅走势中枢，然后以一个次级别走势类型回试，其低点不跌破ZG，则构成第三类买点；一个次级别走势类型向下离开中枢，然后以一个次级别走势类型回抽，其高点不升破ZD，则构成第三类卖点（中枢区间[ZD，ZG]，由与中枢方向一致的次级别走势段Zn的高低点确定）。操作要点：第三类买卖点比第一、二类后知后觉，但抓得好往往不用浪费盘整时间，适合短线技术较好的资金；并不是任何回调回抽都是第三类买卖点，必须是第一次；第三类买卖点后并不必然是趋势，也有进入更大级别盘整的可能，一旦不能出现趋势，一定要在盘整的高点出掉，这和第一、二类买点的策略一样。
  evidence_quote: 一个次级别走势类型向上离开缠中说禅走势中枢，然后以一个次级别走势类型回试，其低点不跌破ZG，则构成第三类买点；一个次级别走势类型向下离开缠中说禅走势中枢，然后以一个次级别走势类型回抽，其高点不升破ZD，则构成第三类卖点……必须要注意，并不是任何回调回抽都是第三类买卖点，必须是第一次。
  interpretation: 第三类买卖点是中枢破坏定理（第18课定理三）的操作化：离开加回抽不返确认旧中枢废弃。其必然赢利的依据是即使演化为更大级别盘整也会有高点出现，对应退出策略就是盘整高点离场。课中工商银行、北辰实业、000803为2006-2007年历史案例。
