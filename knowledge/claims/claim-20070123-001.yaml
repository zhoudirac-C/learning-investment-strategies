  subject: MACD乖离极限判断
  topic: 急促走势中MACD柱子两三次冲击乖离极限不能突破即引发回调
  statement: 在1分钟级别的急促上升中，走势变动太快以至于背驰来不及在图上表现，此时可用MACD柱子伸长的高度作为替代判断，柱子的伸长大致就是走势和均线的乖离度。方法：先敏感地发现该股MACD伸长的一般高度作为标杆，一旦触及这个乖离的极限，特别是两次或三次上冲该极限而不能突破，就意味着强暴的走势要歇歇了，会引发因乖离而产生的回调。注意该判断的前提是1分钟的急促上升，其他情况下必须配合黄白线的走势来用。
  evidence_quote: 不难发现，MACD 的柱子伸长，和乖离有关，大致就是走势和均线的偏离度……一般来说，一旦触及这个乖离的极限，特别是两次或三次上冲该极限，就会引发因为乖离而产生的回调。这种回调因为变动太快，在1 分钟上都不能表现其背驰，所以必须用单纯的MACD 柱子伸长来判断。注意，这种判断的前提是1 分钟的急促上升，其他情况下，必须配合黄白线的走势来用。
  interpretation: 这是背驰在次次级别失效时的替代判据，把MACD从趋势指标临时用作乖离测量器。600779从16.5元上冲19元的1分钟走势是文中2007年案例，17.5元时的柱子高度是标杆，18.5元与19元两次冲击不能突破即确认。连续一字涨停时MACD会出现正弦波动，同样不能用背弛看，要改用1分钟中枢是否不断上移来判断。
