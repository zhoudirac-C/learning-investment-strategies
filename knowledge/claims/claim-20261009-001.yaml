  subject: 底部确认的两情形预案
  timeframe: short-term
  statement: 情形A：60分钟底部结构按既定规则确认、指数回落有承接、上涨家数与核心板块同步改善→启动加仓预案，优先筛选指数转强时率先响应、回踩仍有买盘的方向；若只有单一指数形成结构而其他指数显著走弱，降低对修复广度的评价。情形B：只有钝化未形成结构，或短暂转强后继续放量下探、跌停扩散→保留观察，不提前兑现『底部已到』；若结构确认后按既定规则失效，停止加仓并重新评估新增仓位。周五若只是缩量横盘没触发条件，把进一步确认留到下周。
  stance: view
  evidence_quote: 情形A：60分钟底部结构按既定规则确认，指数回落有承接，上涨家数与核心板块同步改善。届时启动加仓预案，优先筛选在指数转强时率先响应、回踩仍有买盘的方向；具体节奏结合原有仓位和标的波动安排。若只有单一指数形成结构，其他指数继续显著走弱，则降低对修复广度的评价，后续仍需验证。情形B：只有钝化而未形成结构，或盘中短暂转强后继续放量下探、跌停扩散。此时保留观察，不提前兑现『底部已到』的判断；若结构确认后又按既定规则失效，则停止继续加仓，并重新评估新增仓位。周五若只是缩量横盘、没有触发条件，就把进一步确认留到下周。
  interpretation: 完整决策树：触发条件（结构+承接+广度）、选股标准（率先响应+回踩有买盘）、广度折扣规则（单一指数结构降级）、失效处理（停止加仓重新评估）、无信号处理（留到下周）。
