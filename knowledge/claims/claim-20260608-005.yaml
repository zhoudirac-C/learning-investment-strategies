  statement: 大多数人赚钱最好赚的地方在主升浪。主升浪期间应降低仓位，该工作工作该生活生活，抽时间学习产业逻辑和公司基本面。等科技砸出黄金坑后再进场做那些研究过的标的。牛市要沉淀下来吃到最肥美的主升浪，格局放大。
