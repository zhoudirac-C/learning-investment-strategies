  subject: 抄底选股的超跌标准
  topic: 第一次抄底买当下位置离最后中枢DD幅度最大的股票
  statement: 实际操作中达到效率最高的一个可被理论保证的方法：第一次抄底时，最好买当下位置离最后一个中枢的DD即min(dn）幅度最大的股票，所谓超跌应该以此为标准，因为背驰-转折定理保证了反弹一定达到DD之上。然后在反弹的第一波次级别背驰后出掉；如果这个位置还不能达到最后一个中枢，该股票基本可以不再考虑。在反弹的第一次次级别回试后，买入那些反弹能达到最后一个中枢、最好突破该中枢且回试后能站稳的，根据走势必完美一定还有一个次级别向上走势类型，若出现盘整背驰就出掉，若不出现则买到了一个所谓V型反转的股票。
  evidence_quote: 在第一次抄底时，最好就是买那些当下位置离最后一个中枢的DD=min(dn)幅度最大的，所谓的超跌，应该以此为标准。因为本章的定理保证了，反弹一定达到DD=min(dn)之上……然后在反弹的第一次次级别回试后买入那些反弹能达到最后一个中枢的股票而且最好是突破该中枢的而且回试后能站稳的，根据走势必完美，一定还有一个次级别的向上走势类型。
  interpretation: 把日常说的超跌给出了可计算的定义：不是跌幅大，而是离最后一个中枢最低点的距离大。两步筛选先力度后确认：第一步赚定理保证的反弹空间，第二步用能否回到中枢及回试站稳过滤弱反弹，如何预先判断V型反转超出本课定理范围。
