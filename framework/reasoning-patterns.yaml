- pattern_id: macro_transmission
  name: 宏观传导链分析框架
  description: 当用户询问宏观事件、海外映射、政策变化、流动性冲击对A股的影响时使用。包括地缘冲突、能源冲击、货币政策、中美关系、美股风险、汇率波动、大宗商品价格等。典型查询：美联储加息影响、地缘冲突怎么对冲、美股大跌对A股影响、汇率波动影响。该框架定性事件级别、分析传导路径、定位A股影响维度、制定对冲或受益策略。
