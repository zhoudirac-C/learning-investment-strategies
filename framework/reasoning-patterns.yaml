- pattern_id: commodity_mainline_cycle_qualify
  name: 大宗商品主线确认与分化低吸
  description: 通过宏观催化、供给约束、需求增量三重逻辑确认大宗商品主线地位，并预判短期分化后低吸时机。
  applicable_themes:
  - 大宗商品
  - 有色金属
  - 化工
  - 贵金属
  reasoning_chain:
  - step: 1
    name: 宏观催化确认
    question: 当前是否有明确的宏观或事件催化？
    UP_logic: 美元四年低谷+降息预期驱动贵金属；美国寒潮致化工停产；供给天花板+新能源需求驱动铝。
    evidence_sources:
    - 美元指数
    - 美联储利率预期
    - 美国寒潮新闻
    - 产能数据
  - step: 2
    name: 供给约束判断
    question: 该品种是否面临供给端刚性约束？
    UP_logic: 铝产能逼近4543万吨天花板，26年最后一年增长；美国铝企减产80万吨；化工产能+库存双拐点。
    evidence_sources:
    - 产能数据
    - 库存数据
    - 企业减产公告
  - step: 3
    name: 需求增量验证
    question: 下游是否有明确且持续的需求增量？
    UP_logic: 新能源车26年百万吨铝需求，电网千万吨级；化工品盈利改善预期。
    evidence_sources:
    - 新能源车销量
    - 电网投资计划
    - 行业盈利预测
  - step: 4
    name: 分化时机预判
    question: 短期分化后何时是低吸窗口？
    UP_logic: 利好刺激高开导致分化，但分化时间短，明日下午最迟后天重新走强；需等商品期货大面积调整数日行情才见顶。
    evidence_sources:
    - 板块日内走势
    - 商品期货价格
    - 历史分化规律
  risk_factors:
  - 商品期货大面积持续调整
  - 宏观催化消退（如美元反弹）
  - 供给约束被政策打破
  confidence_indicators:
  - 龙头股连续涨停脱离期货走势
  - 机构净买入持续增加
  - 业绩预增公告密集出现
  source_raw:
  - sources/raw/财经/复盘：26-01-28：2.97万亿大宗商品类主线，铝产能天花板，化工双拐点.md
- pattern_id: ai_value_redistribution_chain
  name: AI产业价值重分配推理
  description: 从AI技术革命出发，通过产业价值重分配逻辑，推导出算力基础设施为最高确定性环节的推理模式
  applicable_themes:
