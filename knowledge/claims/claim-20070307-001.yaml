- id: claim-20070307-001-e
  source_path: sources/chanlun/lesson_034.md
  source_date: '2007-03-07'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 走势即当下
  timeframe: permanent
  statement: 对于股市来说，只有走势是当下的，离开走势一切都与当下无关；一切闻见学行只能依走势而闻见学行，离开此都是瞎闹。不符合当下走势的判断，即使正确也白搭。当下的走势就是一切，一切股市的秘密都在其中，这秘密对任何人都一视同仁、明明白白地彰显，无须向外求。
  evidence_quote: 而对于股市来说，只有走势是当下的，离开走势，一切都与当下无关。一切“闻见学行”，只能依走势而“闻见学行”，离开此，都是瞎闹。不符合当下走势的，上帝说正确也白搭。……当下的走势就是一切，一切股市的秘密就在其中。这秘密，是大道，没有任何的遮掩，对任何人都一视同仁、明明白白地彰显，你还向外求什么？
  interpretation: 把『当下』概念落实到可操作的唯一对象——走势。基本面判断、消息、预测若与当下走势不符，即使事后证明正确也没有操作价值。市场的一切信息已公开显现在走势中，向外求（打听消息、寻找秘籍）是骑驴找驴。
  confidence: high
  status: active
  intensity: high
