  subject: 上涨下跌盘整的定义
  topic: 用相邻高低点关系定义三种走势，一切判断建立在确定的周期图表上
  statement: 所有走势都可以分解成上涨、下跌、盘整三种情况，这是市场分析唯一值得依靠的基础。定义（必须建立在一定的周期图表上）：上涨：最近一个高点比前一高点高，且最近一个低点比前一低点高；下跌：最近一个高点比前一高点低，且最近一个低点比前一低点低；盘整：最近一个高点比前一高点高且最近一个低点比前一低点低，或者最近一个高点比前一高点低且最近一个低点比前一低点高。日线上的盘整在30分钟线上可能就是上涨或下跌，图表的选择相关于资金、性格、操作风格。把握高低点必须用均线系统过滤，只有在吻前后出现的高、低点才有意义。
  evidence_quote: 上涨：最近一个高点比前一高点高，且最近一个低点比前一低点高。下跌：最近一个高点比前一高点低，且最近一个低点比前一低点低。盘整：最近一个高点比前一高点高，且最近一个低点比前一低点低；或者最近一个高点比前一高点低，且最近一个低点比前一低点高……所有上涨、下跌、盘整都建立在一定的周期图表上……只有在“吻”前后出现的高、低点才有意义。
  interpretation: 这是缠论整个体系的第一块基石：用相邻高低点的相对关系给出三种走势的可操作定义，排除一切主观形态识别。定义自带级别前提，同一走势在不同周期图表上归类不同，因此谈走势必先定图表级别。
