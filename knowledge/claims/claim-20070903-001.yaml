  subject: 洗盘洁癖庄家的死穴
  timeframe: permanent
  statement: 有洁癖、总想把盘洗得一尘不染的庄家最容易在时间上被害死：只要不断在里面折腾，让他感觉里面人特乱、筹码特乱，他就会一直洗，洗到行情都走完了还在洗；经验不足、资金实力偏弱的庄家尤其容易被这样害死。
  evidence_quote: 有些心理有毛病的庄家，最容易被时间上害死。特别那些有洁癖的，总是希望把盘给洗得一尘不染，这种人，最容易玩了。你只要不断在里面折腾，让他感觉到里面人特乱，筹码特乱，那么这些无聊的家伙就是洗呀洗的，洗到行情都走完了，还在那里洗。很多庄家，就是太有洁癖了而被害死的，特别那些经验不足的，资金实力又有限的。
  interpretation: 时间阻击的本质是利用对手的性格缺陷拖其错过行情窗口，攻击的是心理而不是价格，对手越追求完美控盘越容易被拖死。
