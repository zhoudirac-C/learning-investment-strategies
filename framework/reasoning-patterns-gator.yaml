- pattern_id: gator-ch24-blackswan-response
  school: gator
  name: 突发事件应对体系
  chapter: 24
  description: 鳄鱼派（gator school）第24章：突发事件应对体系。 事件只有两种走向：逐渐发酵 / 逐渐消散（利好利空各二，共四种组合） 无论利好利空，市场在事件刚出现时反应最剧烈；即便发酵，影响也递减； 后市走势由新变量驱动，不再由原事件驱动 从来没有一个大趋势由单一事件驱动，都是多个独立事件的组合 涉及：24.1 市场反应第一定律；24.2 四变量检查（判断趋势是否反转的兜底）；24.3 按交易者类型选应对。 用于鳄鱼派资金生态位与规则体系的判断。
  trigger:
  - IF 事件消散 AND 无新变量 THEN 市场逐渐修正回吐（利好消散=A 字；利空消散=深 V 修复）
  - IF 拿旧事件解释新走势 THEN 停——看的是新变量
  - IF 担心牛转熊 THEN 四变量逐项检查是否"严重恶化"
  - IF 只有单一负面因素 THEN 不作为减仓/做空的充分依据
  - IF 事件前品种大势与事件同向 THEN 开仓或增仓（锦上添花）
  - IF 事件与品种仅情绪关联 THEN 默认沿原趋势开仓——情绪杀不改趋势
  steps:
  - 24.1 市场反应第一定律
  - 24.2 四变量检查（判断趋势是否反转的兜底）
  - 24.3 按交易者类型选应对
  thresholds:
