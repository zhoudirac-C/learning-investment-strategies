  subject: 科技内部风格切换至中报业绩驱动
  timeframe: short-term
  statement: 6月17日收盘复盘判断：科技内部开始风格切换，资金集体抢筹业绩有望持续高增的方向，定价逻辑正从题材想象前移到中报兑现。存储因业绩确定性最高率先走强。非科技方向被进一步边缘化——早盘冲高回落过程中超跌和滞涨方向无任何异动，过去科技高位震荡时资金短暂切防御板块的动作都省略了。这是极强的信号，资金注意力高度锁定在科技内部。
  evidence_quote: 今日的核心变化不是科技涨不涨，而是科技内部开始风格切换：资金集体抢筹业绩有望持续高增的方向，其中存储表现最为强势。这标志着市场定价逻辑正从题材想象前移到中报兑现。早盘冲高回落的过程中，超跌方向与滞涨方向并没有出现明显异动。如果没有增量资金进场，非科技方向大概率会被进一步边缘化。
  interpretation: UP通过盘面细节（科技震荡时资金不再切防御板块）判断市场进入科技内部轮动的新阶段。核心结论：定价逻辑从题材想象切换到中报业绩兑现，存储率先受益。非科技板块没有独立行情，资金的注意力高度锁定在科技内部，外部板块被边缘化。
