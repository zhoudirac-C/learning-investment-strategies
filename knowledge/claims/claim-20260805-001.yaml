  subject: 云厂的大山正在被搬开
  timeframe: trend
  statement: 之前压在云上面的大山是：云厂投入巨额资本买GPU建数据中心，若绝大部分任务必须调用少数闭源模型，则模型厂商掌握需求入口和定价权、云厂承担重资产投入却被拿走增量利润。现在格局开始变化：开源模型越来越强越来越便宜，AI调用从「一个模型解决所有问题」转向分层路由（最难任务调最强模型、普通任务调便宜小模型或开放模型、稳定大规模负载由云厂自行部署+自研ASIC降低推理成本）；模型之间越可替代，云厂越能掌握路由权、客户入口和定价权——过去闭源模型是云上游的收费站，未来模型更像云平台可自由调度的计算资源。
  evidence_quote: 现在这个格局开始变化。开源模型越来越强、越来越便宜……未来的 AI 调用会从「一个模型解决所有问题」转向分层路由……模型之间越可替代，云厂商越能掌握路由权、客户入口和定价权。过去闭源模型是云上游的收费站，未来模型更像云平台可以自由调度的一种计算资源。
