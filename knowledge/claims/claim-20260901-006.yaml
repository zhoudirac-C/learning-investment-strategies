  statement: 东升宇航计划今年出厂两颗高性能互联网卫星及一颗高性能SAR遥感卫星，已完成7000kg超大型通用卫星平台研制及地面试验，正研制10kW级大型算力卫星。据长江证券测算（卖方口径，标注待核实），中国星网与千帆星座规划卫星总数近2.8万颗，按ITU第九年完成10%部署要求，我国仅2026年就需30-50次发射任务，2027-2029年每年约70次。个人判断太空算力把商业航天与算力两条叙事接在一起，有中期跟踪价值，但目前多数停留在研制与规划阶段，右侧确认应等发射节奏与订单落地而非等规划数字。
