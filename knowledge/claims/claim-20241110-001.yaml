  subject: 市盈率的含义
  topic: 市盈率等于总市值除以净利润，含义是回本年限
  timeframe: permanent
  statement: 市盈率=公司总市值÷净利润，含义是以当前盈利水平买入后靠盈利回本的年限（如100亿市值、20亿净利即5倍市盈率=5年回本）；它随总市值（股价）和净利润每年变动，是普通而常用的估值参考指标
  evidence_quote: 市盈率就是一家公司的总市值除以一家公司的净利润。比如说一家公司它是100亿的一个总市值，它的净利润今年达到了20亿，它的市盈率就是100除以20等于5，5倍。……意思就是说你要5年之后才算回本，才算买到了它真正的价值。
  interpretation: 面向新手的估值概念科普，把市盈率翻译成「回本年限」便于理解。属工具性知识定义，UP定位其为「判断价格贵还是便宜」的指标。
