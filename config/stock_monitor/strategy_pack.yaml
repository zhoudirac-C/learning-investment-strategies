  - 全A开盘方向+量能预估
- window: 09:30-10:00
  name: 开盘确认
  action_bias: 只观察，等9:30后连续K线确认趋势
  rules:
  - 【节后首日】第一大量能定性——观察10点前成交额同比(节前)趋势
  - 【节后首日】第二看科技方向——涨价链（CCL/存储/铟/光互联）是否延续强势
  - 【节后首日】第三看科创50——高估值下海外映射是否偏正
- window: '10:00'
  name: 10点确认（量能第一节点）
  action_bias: 可评估（仅限量能维持3万亿趋势+全A中阳线）
  rules:
  - 10:00量能对比：达到或超节前→偏积极；明显缩量→推翻预期
  - 全A是否延续K型分化（双创强vs沪指弱）
  - 涨价链方向是否出现连板核心
- window: '11:20'
  name: 上午收盘前
  action_bias: 只观察
  rules:
  - 上午量能定性+科技修复进展
  - 持仓止损检查
- window: '13:10'
  name: 午后风险窗口
  action_bias: 午后只看不买
  rules:
  - 【节后首日】留意科创50走势——高Beta可能放大海外映射
  - 量能趋势确认：上午放量延续vs午后缩量
  - 涨价线是否维持（CCL/存储/铟/光互联）
  - 是否有尾盘杀信号
- window: '14:00'
  name: 下午量能第二节点
  action_bias: 只看不买
  rules:
  - 量能趋势确认：上午放量延续vs午后缩量
  - 涨价线是否维持
  - 是否有尾盘杀信号
- window: '14:52'
  name: 尾盘条件单
  action_bias: 可尾盘低吸（仅限全A放量中阳线确认日）
  rules:
  - 全日定性为强修复（全A中阳线+放量3万亿+维持）→可评估轻仓介入
  - 弱修复/量能回落/等待确认阶段→不操作
  - 雅克科技止损检查
