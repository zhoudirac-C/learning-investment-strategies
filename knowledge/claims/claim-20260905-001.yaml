  subject: 百年六轮贸易失衡的三构件与三条规律
  timeframe: permanent
  statement: 过去一百年六轮大贸易失衡（1920年代、二战后、1970年代石油美元、1980年代日德、1997亚洲、2000年代欧元区）都由三构件组成：维持机制（顺差回流逆差国）、触发器（回流机制停转）、付账人（谁被迫调整结构）。三条规律：①六轮中五轮触发器是美国货币条件（1929联储收紧、1981沃尔克、1985广场协议、1997加息强美元、2008次贷危机），只有战后轮无触发器、是唯一非危机完成的再平衡；②真正危险在于失衡背后是否积累大量没有对应生产能力的债务；③成本落在顺差方还是逆差方没有固定答案，取决于谁有能力拒绝成为最后承担需求收缩的人。
  evidence_quote: 每一轮失衡都有三个部件构成：第一是维持机制……第二是触发器……那么第三就是负账人。……在这六轮当中，有五轮它的触发器都是美国的货币条件……其次，就是说真正危险的在于失衡背后，有没有同时积累大量没有对应生产能力的债务。……还有第三个规律，就是成本落在顺差方还是逆差方没有固定答案，取决于谁有能力拒绝成为最后那个承担需求收缩的人。
  interpretation: 宏观分析骨架：用维持机制/触发器/付账人三构件拆解任何一轮失衡；历史最强引线是美国利率。
