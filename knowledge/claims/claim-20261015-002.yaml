- id: claim-20261015-002-f
  claim_type: methodology
  subject: 做空的生态位选择
  timeframe: permanent
  statement: 我做空选择在市场疯狂、大盘处于高位时动手，赚的是泡沫破灭的钱，而不选择在恐慌杀跌中做空赚恐慌的钱，也不做赶尽杀绝。
  evidence_quote: 我喜欢在月底月初大盘4100多，市场疯狂的时候做空，赚科技泡沫破灭的钱。当然，也有人喜欢在大盘3700，科技腰斩再腰斩……的时候做空，赚恐慌的钱。同样是飞行员，咱们流派和理念不同，我不做赶尽杀绝。
  interpretation: 鳄鱼派明确自己的资金生态位：在情绪高位做空（赚均值回归的钱），而非在恐慌低位继续做空（赚踩踏的钱）。生态位选择决定了入场时机与风险收益结构，是他判断「何时该出手」的底层框架。
  confidence: medium
  stance: view
  intensity: high
  topic: 高位放空而非追杀恐慌
