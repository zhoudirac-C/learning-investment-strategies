- id: claim-20080413-001-b
  source_path: sources/chanlun/lesson_105.md
  source_date: '2008-04-13'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 简单工具的熟练优先
  topic: 最简分型分类足以处理行情，未熟练掌握前学更多无意义
  statement: 每天只用一个最简单的分型以及能否延伸为笔的最基本标准进行分类，就完全可以处理震荡行情。人总爱复杂的东西、看不起简单的，而简单工具的熟练掌握才是真工夫；挣钱本来就是很简单的事情，不过就是一个良好习惯与操作策略的结果，费力才能挣到的钱也守不住。如果分型这最简单的分类导致的操作都还没熟练把握，再学其他内容就没有意义。
  evidence_quote: 每天，就是用一个最简单的分型以及能否延伸为笔的最基本标准进行分类，就完全可以处理如此震荡的行情，人总爱复杂的东西，看不起简单的，而这才是真工夫。挣钱，本来就是很简单的事情，不过就是一个良好习惯与操作策略的结果……人总爱贪多，请问，分型这最简单的分类导致的操作，你把握了吗？如果这都没熟练把握，你再学其他又有什么意义？
  interpretation: 这是对学习次序的明确要求：先把分型与笔这一最小工具练到熟练，再谈中枢、级别等高级内容，与第103课先学防狼术再学屠龙术的说法互为呼应。
