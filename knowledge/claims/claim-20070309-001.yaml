  subject: 最低级别中枢的定义
  timeframe: permanent
  statement: 最严格意义下，每笔交易是最低级别的，连续三笔相同价位的交易构成最低级别的中枢；市场交易如同物理世界一样并非想当然地无限连续，存在类似量子的最小分析单位。
  evidence_quote: 所谓的最低级别，就如量子力学的量子概念，物理世界不是想当然地无限连续的，而市场的交易同样如此。最严格去定义，每笔的交易是最低级别的，连续三笔相同价位的交易，就构成最低级别的中枢。
  interpretation: 缠论把理论原点锚定在逐笔成交上，用三笔同价位交易定义最小中枢，类比量子概念强调市场存在不可再分的最小结构单位。这是整个递归定义体系的起点。
