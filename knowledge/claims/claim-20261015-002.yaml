- id: claim-20261015-002-j
  claim_type: methodology
  subject: 人性与利益优先于基本面技术面
  timeframe: permanent
  statement: 股票是人的游戏，了解人性比研究基本面、技术面更加重要；而人性其实很简单，利益是驱动大多数人行动的主要原因。
  evidence_quote: 股票最终，是人的游戏，了解人性，比研究基本面、技术面，更加重要。人性说来复杂，其实也很简单，利益，是驱动大多数人行动的主要原因。
  interpretation: 鳄鱼派的方法论根基层：把市场行为归因到参与者利益，而不是归因到估值或形态。这与「资金生态位」框架一致——先看各方的利益与约束，再推演他们会怎么做。
