  subject: 模式内减仓不算卖飞
  topic: 符合模式的减仓再涨也不算卖飞
  timeframe: permanent
  statement: 模式内的减仓做T不算卖飞：只要是按既定模式执行的减仓，之后股价再涨也不属于卖飞
  evidence_quote: 那么有的兄弟会说，诶，你在这边你在这边算卖飞了啊。不是的，如果说你跟我熟的话，你就知道我说我这个不算卖飞。就是我的模式，我有写过。
  interpretation: UP对「卖飞」的重新定义：评价操作的标准是是否符合模式，而非事后股价。这是操作纪律层面的自我一致性要求。（背景：当日大券商涨逾4个点，UP在大金融拉升中减仓两笔各约10万。）
