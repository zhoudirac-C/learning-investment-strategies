- id: claim-20070302-001-b
  source_path: sources/chanlun/lesson_033.md
  source_date: '2007-03-02'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 中枢延伸段数的限制规则
  topic: 中枢延伸以5段为限，出现第6段延伸即构成更大级别中枢
  timeframe: permanent
  statement: 对中枢延伸的数量进行限制就可以消除延伸造成的多义性：一般来说中枢的延伸不能超过5段，一旦出现6段的延伸，加上形成中枢本身那3段，共9段就构成更大级别的中枢。
  evidence_quote: 这种情况，只要对中枢延伸的数量进行限制，就可以消除多义性，一般来说，中枢的延伸不能超过5 段，也就是一旦出现6 段的延伸，加上形成中枢本身那三段，就构成更大级别的中枢了。
  interpretation: 这是一条可机械执行的计数规则：延伸5段为限，第6段出现即触发级别升级（3段本中枢加6段延伸共9段，每3段构成一个本级别中枢，3个本级别中枢重合形成更大级别中枢），使中枢归属唯一确定，避免同一走势被无限期解释为原级别中枢的延伸。
