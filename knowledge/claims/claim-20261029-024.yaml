subject: 钙钛矿与新能源：北京“十五五”规划推动技术应用，若机器人AI硬件仍占主要增量可能只有局部脉冲
timeframe: temporary
statement: 北京市印发新型能源体系规划聚焦钙钛矿太阳能电池、高效光伏组件研发制造，隆基绿能百兆瓦中试线、金辰股份设备研发、亚玛顿小批量供货均属于预期阶段；若机器人和AI硬件仍占据主要增量，钙钛矿方向可能只有局部脉冲。
evidence_quote: 北京规划推动技术与应用场景。隆基绿能此前拟建设一条100MW高效晶硅—钙钛矿叠层电池中试产线，百兆瓦级中试意味着从实验验证向工程化推进，尚不能直接等同于成熟大规模商业生产。亚玛顿超薄轻型钢化氧化铟锡玻璃已向钙钛矿组件厂商小批量供货。若机器人、AI硬件仍占据主要增量，它可能只有局部脉冲。
interpretation: UP 对钙钛矿板块的判断将政策催化（北京规划）与产业验证阶段（中试线、小批量供货、设备研发）分开处理，并明确指出如果机器人和AI硬件仍占主要增量，钙钛矿方向可能只有局部脉冲，而非新的主升方向。
