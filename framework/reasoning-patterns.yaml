      name: 映射受益板块个股
      question: 哪些A股方向和标的最可能受益？
      UP_logic: 军工（海军装备/扫雷艇）、电解铝/资源品、化工涨价四类品种，分别给出通达股份、海兰信、焦作万方等核心标的。
