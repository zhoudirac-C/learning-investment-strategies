  subject: 赌徒心理识别
  topic: 赌徒心理预设虚拟目标无视市场，对治靠严格操作程序与错过就等下次
  statement: 市场中最大的敌人之一就是赌徒心理、赌徒思维，以赌徒心理参与市场，结局就已经注定。赌徒心理最大的特点是预设一个虚拟的想象中的目标，完全无视市场本身，例如亏钱了就想等反弹到多少多少一定出来，这看起来很不赌徒，其实也是赌徒心理；还有一个特点是怕失去机会，怕失去了赚大钱的机会。常见行为还有：砍了又追、追了又砍，完全被无明的业力牵引；不敢操作，看到机会来了怕，等机会真起来了又后悔追上去，5元不敢买的过段时间50元都敢买；听消息找捷径；以及带着赚钱买房子车子这类具体目标来炒股。对治：市场真正的成功都是严格的操作下完成的，一个严格的操作程序足以保证长期的成功；错过了就错过了，后面有无数的机会等着，平静地按照自己的韵律、按照市场的显现去与日俱增地强大自己。
  evidence_quote: 赌徒心理一个最大的特点，就是预设一个虚拟的目标，一个想象中的目标，完全无视市场本身。还有一个特点，就是怕失去机会，怕失去了赚大钱的机会……市场真正的成功，都是严格的操作下完成的。操作失误了有什么大不了的，市场的机会不断涌现，一个严格的操作程序，足以保证你长期的成功……错过了，就错过了，后面有无数的机会等着。
  interpretation: 识别清单的价值在于自检：等反弹到某价位一定走这种看似不赌的想法，本质也是赌徒心理。对治不是心理素质训练，而是用严格操作程序替代情绪决策；市场中生存从来不是靠一次暴富得到的。
