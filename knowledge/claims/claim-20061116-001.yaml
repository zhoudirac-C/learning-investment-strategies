  subject: 牛市轮动节奏
  topic: 牛市第一阶段一线股先涨，其后按节奏轮动，借回档踏准轮动
  statement: 牛市有明确节奏：以指数股为代表的一线股先涨，这是牛市的第一阶段，它们不到位其他股票涨不动，但最终所有股票都有表现机会。错过第一节奏的应对：跟盘技术还行的，在回档时跟进强势股票，牛市里跌就是爹，一跌就等于发钱。牛市超额收益的核心原则是避开大的回档、借回档踏准轮动节奏；散户则一定要等趋势明确才介入或退出，不要整天想着抄底逃顶。
  evidence_quote: 而目前以金融股等为代表的指数股上涨，是牛市的第一阶段。96 年的时候，深发展长了N 倍了，很多股票还没怎么动。牛市的第一阶段都是这样的，一线股先长，它们不到位，其他股票怎么长……如果你跟盘技术还行的，就要在回档的时候跟进强势股票。散户就怕跌，但牛市里，跌就是爹，一跌就等于爹来了，又要发钱了……就一个原则：避开大的回挡，借回挡踏准轮动节奏……散户，一定要等趋势明确才介入或退出，这样会少走很多弯路。
  interpretation: 这是缠论罕见的直接讲市场阶段结构的课。节奏感的两个落点：定位当前处于轮动的哪一段，以及用回档而非追涨完成切换。2006年的金融股、深发展只是节奏示例，作者声明该规律"全世界的牛市都基本这样子"。
