  extracted_at: '2026-07-18'
  subject: 每日收盘后十分钟复盘
  topic: 每天收盘后花十分钟复盘当天操作与看盘心理过程
  statement: 认清市场首先要认清自己：知道自己的弱点在哪里，自己在市场中的每个行为都要清楚地意识到。具体做法：每天收盘后，都找十分钟，把自己当天的操作以及看盘时的心理过程复一次盘，这是十分必要的。
  evidence_quote: 要认清市场，首先要认清自己，知道自己的弱点在哪里，自己在市场中的每个行为，都要清楚地意识到。每天收盘后，都找十分钟，把自己当天的操作以及看盘时的心理过程复一次盘，这是十分必要的。
  interpretation: 缠论少见的明确复盘规范：复盘对象同时包括操作行为与心理过程两条线，时长只需十分钟，重点是建立对自己行为的觉察，服务于十种不适合类型的自我排查。
