  subject: 第一类买卖点与V型反转
  topic: 任何第一类买卖点后都对应某级别V型反转，其级别决定中阴的级别与力度
  statement: 其实任何转折，也就是第一类买卖点之后，都对应着某一级别的V型反转，这个V型反转的级别，决定了中阴的级别与力度。既然线段有中阴阶段，那么其他级别当然也有，所以无论任何级别，在一个顶点出来后，都有对应级别长度的中阴阶段。
  evidence_quote: 其实任何转折，也就是第一类买卖点之后，都对应着某一级别的V 型反转……这个V 型反转的级别，决定了中阴的级别与力度……既然线段有中阴阶段，那么其他级别当然也有。所以无论任何级别，在一个顶点出来后，都有对应级别长度的中阴阶段。
  interpretation: 这把中阴阶段从模糊感觉变成可度量的结构：先定位第一类买卖点对应V型反转的级别，就知道要应对多长、多强的中阴震荡。课中的标号体系（Xn记线段、Yn记一分钟、Wn记五分钟等）是为多级别跟踪服务的记号工具。
