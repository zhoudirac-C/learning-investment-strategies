  statement: 机构互爆的恶性循环是跌出来的：低成交量下某些资金卖出造成连锁反应，杀跌触发止盈、绝对收益结构被动卖出、量化调仓、赎回压力下卖未跌停持仓，相互踩踏持续放大
  evidence_quote: 这个恶性循环本身其实是跌出来的。某一些资金的卖出，在成交量低迷的时候，造成连锁反应的恶性循环。卖出造成杀跌，杀跌导致有些机构触发止盈，有些机构绝对收益的结构也跟着被动卖出。当然这里面还有量化的调仓，机构资金的相互踩踏。……如果这些基金再遇到赎回，跌停卖不出去只能卖没跌停的。
  interpretation: UP区分两种风险生成方式：'涨出来的风险'跌一波消化估值就结束，'跌出来的风险'会自我强化成恶性循环。机制链条：低成交→卖出→杀跌→触发止盈/风控/赎回→被动卖出→再杀跌。这是可复用的市场结构分析框架，解释为何此类下跌'与基本面无关'却能持续。
