  data_requirements:
  - name: 事件与政策催化
    channel: 新闻公告 / 政策文件
  - name: 资金流向与情绪指标
    channel: 行情数据 / 龙虎榜 / 涨停池
  - name: 板块量价对比
    channel: 行情数据（主线与补涨板块涨幅/成交量对比）
  - name: 产业链环节映射
    channel: knowledge/industry-chains（segments/mappings 字段查询）
  - name: 环节价值量与壁垒
    channel: knowledge/industry-chains（value_share/barrier 字段）/ 研报
  - name: 估值与涨幅位置
    channel: 行情数据（估值分位数/各环节涨幅对比）
  - name: 订单与认证验证
    channel: knowledge/industry-chains（cert_status/order_evidence 字段）/ 公司公告
  - name: 龙头封单与板块量能
    channel: 行情数据（封单量/板块成交量变化）
  steps:
  - step: 1
    name: 判断轮动触发因素
    question: 是什么触发了这次板块轮动？事件/政策/资金/情绪？
    action: 将触发因素归类为事件驱动（突发消息）、政策驱动（顶层设计）、资金驱动（主线溢出）、情绪驱动（恐高切换）四种之一，不同触发因素对应不同持续性假设
    data:
    - 事件与政策催化
    - 资金流向与情绪指标
  - step: 2
    name: 评估轮动质量
    question: 这次轮动是"健康轮动"还是"劣质切换"？
    action: 对比主线与补涨板块的量价：主线内部高低切且低位补涨有产业逻辑支撑为健康轮动；主线暴跌+支线脉冲且无增量资金为劣质切换，按一日游处理
    data:
    - 板块量价对比
    - 资金流向与情绪指标
  - step: 3
    name: 定位受益环节与标的
    question: 轮动资金最可能流向哪些细分环节？
    action: 查询产业链知识库做扩散筛选四问——环节价值量增幅大不大（value_share）、供给壁垒高不高（barrier）、当前涨幅位置低不低、有无订单/认证验证（cert_status/order_evidence）；或按估值洼地逻辑定位涨幅落后+业绩未兑现+有催化的方向
    data:
    - 产业链环节映射
    - 环节价值量与壁垒
    - 估值与涨幅位置
    - 订单与认证验证
  - step: 4
    name: 判断轮动持续性并操作
    question: 轮动能否持续？何时介入、何时离场？
    action: 有持续催化的轮动按1-3天窗口对待，无催化的日内轮动不追；介入点选首日启动确认，离场点选次日高开低走或龙头断板
    data:
    - 事件与政策催化
    - 龙头封单与板块量能
  falsification:
  - 主线核心标的不止跌反破位（轮动实为资金撤退前的补涨）
  - 补涨分支次日无溢价、龙头断板（一日游证伪）
  - 大盘系统性破位下行或宏观政策重大转向
  - 板块情绪退潮：核心标的放量滞涨、联动失效
  validation:
    historical_hit_rate: pending-m1
    applicable_regime: null
    known_failures: []
    confidence_indicators:
    - 多个独立数据源交叉验证
    - 板块内多只个股联动
    - 机构研报密集覆盖
    - 成交量持续放大
