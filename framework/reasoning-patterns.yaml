  - step: 1
    name: 识别技术革命本质
    question: 当前技术革命对产业结构的根本影响是什么？
    UP_logic: AI技术革命加速≠简单行业扩容，本质是产业价值重新分配，类似电力、互联网革命的历史规律
    evidence_sources:
