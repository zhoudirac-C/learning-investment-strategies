  timeframe: intraday
  statement: 昨日盘面四个观察点：一、电力股缺席——指数越跌资金没买电力股，说明回调定性为换手而非避险；二、小票反包——九安医疗(002432)和共进股份(603118)盘中反包资金坚决；三、大票主动性——华虹宏力从一开盘就主动走强非被指数带上去；四、连续两日放量后注意情绪过热回调风险。放量本身中性，关键看第三天能否承接。
  evidence_quote: 其一·电力股的缺席：昨天早盘指数越跌，资金反而没有继续买电力股。防御品种在下跌中不被增配，说明资金对这次回调的定性不是避险，而是换手。其二·小票的反包：盘中九安医疗和共进股份出现反包，尤其是前者，资金异常坚决。其三·大票的主动性：大票这边除了基本盘易中天之外，昨天半导体之所以能一枝独秀，离不开华虹宏力的功劳。这家六千多亿市值的公司，和九安医疗这类小票一样，是从一开盘就主动走强的。其四·情绪的过热风险：在连续两日的放量之后，需要注意情绪过热之后的回调风险。放量本身是中性的，关键看第三天能否承接。
  interpretation: UP给出了四个盘口层面的信号，用于判断反弹质量。关键点：电力缺席=资金认为这是科技内部换手而非系统性避险（正面）；九安/共进反包资金坚决=资金主动做多（正面）；华虹宏力主动走强=大资金态度明确（正面）；放量第三天承接=今天的关键观察（中性偏谨慎）。
