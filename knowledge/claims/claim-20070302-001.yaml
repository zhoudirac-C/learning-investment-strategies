  subject: 围绕中枢的操作原则
  topic: 底背驰介入、顶背驰力度定去留、回抽不进中枢为第三类买卖点
  timeframe: permanent
  statement: 围绕中枢的操作原则：每次向下离开中枢只要出现底背驰就可以介入，然后看相应回拉出现顶背驰的位置能否超越前面一个向上离开的顶背驰高点，不行一定要走，行也可以走；但次级别回抽一旦不重新回到中枢里，就意味着第三类买点出现，一定要买回来；如果从底背驰开始的次级别回拉不能重新回到中枢里，就意味着第三类卖点出现，必须走，然后等待下面形成新的中枢再重复类似过程。
  evidence_quote: 每次向下离开中枢只要出现底背驰，那就可以介入了，然后看相应回拉出现顶背驰的位置是否能超越前面一个向上离开的顶背驰高点，不行一定要走，行也可以走，但次级别回抽一旦不重新回到中枢里，就意味着第三类买点出现了，就一定要买回来。而如果从底背驰开始的次级别回拉不能重新回到中枢里，那就意味着第三类卖点出现，必须走，然后等待下面去形成新的中枢来重复类似过程。
  interpretation: 这是一套完整闭环的中枢震荡操作纪律：底背驰买入，回拉顶背驰力度决定卖出，回抽不破中枢构成第三类买点须回补，回拉不进中枢构成第三类卖点须离场，随后等新中枢重复流程，把背驰判断与第三类买卖点串联为可执行规则。
