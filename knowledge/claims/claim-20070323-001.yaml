  subject: 操作韵律与错则停手
  topic: 向上段先买后卖与向下段先卖后买是最大韵律，一步错就停止操作
  statement: 机械化操作程式内含基本韵律，最大的是向上段先买后卖与向下段先卖后买，这个韵律错了操作就一团糟；每向上向下段中各小段间的操作也有韵律，只要其中一步错了舞步就乱，此时唯一正确的选择是停止操作，先把心态、韵律调节好才继续。至于对错的标准：只要赚钱卖出就无所谓错误，只要卖了能低价位回补就无所谓错误；卖了还涨、回补还跌只是技术精确度问题，靠按机械要求反复训练形成韵律来解决。
  evidence_quote: 其中最大的就是向上段先买后卖与向下段先卖后买的韵律，如果这个韵律都错了，那操作就一团糟……显然，只要其中一步错了，这舞步就乱了。这时候，唯一正确的选择就是停止操作，先把心态、韵律调节好了才继续……对于任何操作来说，只要赚钱卖出，是无所谓错误的……只要卖了能低价位回补，就无所谓错误。
  interpretation: 这条给出操作错误的两种性质：韵律错误是结构性错误必须停手重来，精度错误是技术问题靠训练改善。它把"卖飞"去罪化，与第41课"节奏比精度更重要"互为表里。
