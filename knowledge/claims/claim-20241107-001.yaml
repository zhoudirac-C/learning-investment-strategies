  subject: 区分主线与轮动
  topic: 先区分市场在炒主线还是炒轮动，再定选股策略
  timeframe: permanent
  statement: 操作前必须区分市场是在炒主线还是在炒轮动，两种行情对应完全不同的选股策略
  evidence_quote: 所以我们一定要区分好是在炒主线还是在炒轮动，这一点是非常非常非常重要的兄弟们。
  interpretation: 主线行情适合持有强者恒强，轮动行情适合卖强买弱——行情性质定性错误会导致策略完全用反。这是UP方法论中「先判断市场状态、再选策略」原则的体现。
