  subject: 顶部结构的复杂度差异
  topic: 分力越多顶部越复杂，大盘顶部折腾出来且破位前多犹豫，个股顶部大多简单
  statement: 顶部复杂程度由集中其中的分力多少决定：大盘的顶部和个股的顶部不同，分力更多合力更复杂，一般都不会是简单的图形，越大型的顶部越是这样，即使真的形成，最后破位前反而要有很多的犹豫；大盘的顶部都是折腾出来的，所以大盘顶部时反而机会多多，因为很多不死心的人会不断折腾，板块个股跳来跳去。个股的顶部大多都不复杂，除非是很多人参与的大型股票，原因就是分力少，对比太明显，复杂不起来。
  evidence_quote: 大盘的顶部和个股的顶部不同，要复杂得多，因为集中其中的分力更多，所以其合力当然要更复杂。一般来说，大盘的顶部都不会是简单的图形，都是十分复杂。而且即使真的形成，最后破位前反而要有很 多的犹豫，越大型的顶部越是这样……大盘的顶部都是折腾出来的，所以一般在大盘顶部时，反而机会多多……个股的顶部，大多都不复杂，除非是很多人参与的大型股票
  interpretation: 操作含义：大盘顶部区域不是立即死亡而是反复折腾的震荡环境，可按震荡思路参与板块轮动；个股见顶则通常干脆，不宜恋战。本课主体是做顶出货的庄家故事，但这一段是独立的结构判断，与故事无关。
