# SEG-005 古怪线段标准化（课78）
# claim-20070906-001-c：线段中最高/最低点不是端点时，以线段为基础的分析中可把该线段
# 标准化为最高低点都在端点；向上线段以最低点开始最高点结束，向下线段反之。
# 构造（对应课78"古怪线段唯一成因"：第一种情况笔破坏后未在该方向发展出线段破坏，
# 且破坏笔突破原线段高点 → 线段开始点不是最高点）：
#   向下线段 B = bi0..bi8：20→16→18→14→21→15→17→13→16→12。
#   - bi3 上（14→21）对 B 构成第一种情况笔破坏（21 > bi1 高 18），但特征序列
#     X1=bi1[16,18]、X2=bi3[14,21]：X2 低点 14 < X1 低点 16 → 无顶分型 → B 未被破坏；
#   - 随后向下线段 bi4..bi6（21→15→17→13）跌破 bi3 的底 14 → 按课78，B 没结束、继续延续；
#   - bi3 高 21 > B 的起点 20 → 出现"线段的开始点并不是最高点"的古怪情形；
#     标准化后该向下线段按实际区间视为 21（最高）→ 12（最低）。
#   - 特征序列续：X3=bi5[15,17]、X4=bi7[13,16]、X5=bi9[12,15.5]、X6=bi11[14,16.5]；
#     X5 高低点均最低成底分型，X4/X5 有重合 [13,15.5]（无缺口）→ 第一种情况，
#     seg0 在 bi8 底（bar37=12.0）结束，sure=true。
#   seg1（bi9..bi11 向上）首三笔重合 [14,15.5] 成段未被破坏 → sure=false。
# 分型中心间隔 4 根 K 线，腿内单调无包含；pivot 极值精确落位（20@1/16@5/18@9/14@13/
# 21@17/15@21/17@25/13@29/16@33/12@37/15.5@41/14@45/16.5@49）。
# 注：Segment 模型字段为 (start_bi, end_bi, dir, sure)，标准化区间不直接体现在 expect.seg，
#   本用例以 seg0 覆盖 bi0..bi8（含内部最高点 21）钉住"古怪"结构，供实现对表时验证
#   其线段区间计算取 [12,21] 而非 [12,20]。
