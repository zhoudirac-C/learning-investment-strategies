  subject: 按技术能力选择把握的级别
  topic: 把握不住日线级别调整就去把握周线月线，给自己安排力所能及的活动
  statement: 把握调整（暴跌）的级别很重要：日线上的一夜情与年线上的一夜情力度显然不一样。如果把握不住日线级别的暴跌，证明技术程度达不到把握日线一夜情的程度，那就去把握周线、月线的，那对技术精确的要求要低；给自己安排一些力所能及的活动，能否在各级别的调整中游刃有余，是对技术把握度的考验。对暴跌的正确态度不是欢呼也不是恐惧，而是当作真正操作者减低成本、增加筹码的大好时机；操作的精确度是可以用市场磨练达到的，技术高就该有更好的收益，而思路、方法的错误才是不可救药的。
  evidence_quote: 一个日线上的一夜情与一个年线上的一夜情，显然力度上不一样。如果你把握不住日线的一夜情，证明你的技术程度达不到把握日线一夜情的程度，那么就去把握周线、月线的，那对技术精确的要求要低。给自己安排一些力所能及的活动，一夜情也是有级别的，能否在各级别的一夜情中游刃有余，是对你技术把握度的考验……但这决不是空头用嘴欢呼的借口，而是真正操作者减低成本、增加筹码的大好时机。
  interpretation: 级别匹配原则在调整应对上的应用：操作级别应设在技术能稳定把握的位置，与第41课初学者不低于30分钟进出的纪律一致。暴跌在此被重新定义为大级别操作者的低成本增仓窗口。
