- id: claim-20070905-001-b
  source_path: sources/chanlun/lesson_077.md
  source_date: '2007-09-05'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 笔的划分规则与唯一性
  topic: 笔必须一顶一底且中间有独立K线，满足条件的笔划分唯一
  statement: 笔的规则：笔必须是一顶一底，而且顶和底之间至少有一根K线不属于顶分型与底分型；同一笔中，顶分型中最高那根K线的区间至少要有一部分高于底分型中最低那根K线的区间，顶都在底的范围内或顶比底还低不可接受。满足条件的笔划分是唯一的。划分步骤：一、确定所有符合标准的分型，先按包含关系与结合律处理标记，不能有K线分属不同分型；二、前后两分型同一性质的，顶保留更高者、底保留更低者，前面那个划掉；三、处理后相邻一顶一底即划为一笔；若相邻性质一样，连续同性质分型后必出现反性质分型，把最先一个与该新分型连成一笔，中间的划掉。
  evidence_quote: 笔，必须是一顶一底，而且顶和底之间至少有一个K 线不属于顶分型与底分型……在同一笔中，顶分型中最高那K 线的区间至少要有一部分高于底分型中最低那K 线的区间，如果这条都不满足，也就是顶都在低的范围内或顶比底还低，这显然是不可接受的……综上所述，显然，笔的划分是唯一的。……一、确定所有符合标准的分型。二、如果前后两分型是同一性质的，对于顶，前面的低于后面的，只保留后面的，前面那个可以X 掉；对于底，前面的高于后面的，只保留后面的，前面那个可以X 掉。……三、经过步骤二的处理后，余下的分型，如果相邻的是顶和底，那么这就可以划为一笔。
  interpretation: 原文给出了笔划分唯一性的完整数学证明，是缠论完全分类风格的典型样本：先定义再证明唯一性，划分规则才成为可执行程序。相邻分型之间必须满足结合律即不允许有K线分属不同分型，是易被忽略的前提。
