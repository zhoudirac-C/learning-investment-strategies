  subject: 线段被笔破坏与线段分解定理
  topic: 前三笔须有重叠才成线段，线段破坏的充要条件是被另一线段破坏
  statement: 从向上笔开始的线段，其分型构成序列d1g1d2g2直到dngn（di为第i个底、gi为第i个顶），若找到i和j（j大于等于i+2）使得dj小于等于gi，则称向上线段被笔破坏；向下线段反之（gj大于等于di）。线段最基本的前提：前三笔必须有重叠部分，并不是连续三笔就一定构成线段。缠中说禅线段分解定理：线段被破坏，当且仅当至少被有重叠部分的连续三笔的其中一笔破坏；只要构成有重叠部分的前三笔，就必然形成一线段，换言之，线段破坏的充要条件就是被另一个线段破坏。
  evidence_quote: 如果找到i 和j，j>=i+2，使得dj<=gi，那么称向上线段被笔破坏……线段有一个最基本的前提，就是线段的前三笔，必须有重叠的部分，这个前提在前面可能没有特别强调，这里必须特别强调一次。线段至少有三笔，但并不是连续的三笔就一定构成线段，这三笔必须有重叠的部分……缠中说禅线段分解定理：线段被破坏，当且仅当至少被有重叠部分的连续三笔的其中一笔破坏。而只要构成有重叠部分的前三笔，那么必然会形成一线段，换言之，线段破坏的充要条件，就是被另一个线段破坏。
  interpretation: 缠论第一个以作者命名的定理，是线段划分的严格判据：笔破坏是预警，线段破坏才是确认。67课再用特征序列给出可操作化的精确划分标准。
