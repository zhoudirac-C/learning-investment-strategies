  claim_type: technical-knowledge
  subject: 中枢震荡的分解归宿
  timeframe: permanent
  statement: 任何围绕日线级别的震荡，最终都必然可以分解为若干已完成的30分钟走势类型加一段未完成的30分钟走势类型，该未完成段只要还围绕日线中枢震荡，最终一定会完成30分钟的走势类型；且已完成段数必须小于9，否则就变成周线中枢，整个分解要升级到按日线进行。
