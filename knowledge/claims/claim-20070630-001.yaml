  subject: K线包含关系合并规则
  topic: 相邻K线有包含关系须合并，向上取高高向下取低低
  statement: 相邻两K线可以出现包含关系，即一根K线的高低点全在另一根K线的范围里，此时必须合并处理：在向上时，把两K线的最高点当高点、两K线低点中的较高者当低点，合并成一根新K线；在向下时，把两K线的最低点当低点、两K线高点中的较低者当高点，合并成一根新K线。经过这样的处理，所有K线图都可以处理成没有包含关系的图形，分型等后续识别都在处理后的图形上进行。
  evidence_quote: 相邻两K 线可以出现如图6 这种包含关系，也就是一K 线的高低点全在另一K 线的范围里，这种情况下，可以这样处理，在向上时，把两K 线的最高点当高点，而两K 线低点中的较高者当成低点，这样就把两K 线合并成一新的K 线；反之，当向下时，把两K 线的最低点当低点，而两K 线高点中的较低者当成高点，这样就把两K 线合并成一新的K 线。经过这样的处理，所有K 线图都可以处理成没有包含关系的图形。
  interpretation: 包含关系处理是分型识别的前置工序。高低点均含影线，比常见孕线、吞没的实体口径更严格。向上取两高与较高低、向下取两低与较低高的规则在65课被进一步数学化并补充顺序合并原则。
