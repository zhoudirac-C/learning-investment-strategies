      - 半日成交1.41万亿元
      - 早盘超七成个股收绿
    - step: 2
      name: 锁定绝对主线
      question: 资金聚焦和赚钱效应集中在哪个方向？
      UP_logic: CPO、PCB、液冷、电子布、CPU等反复活跃且赚钱效应突出，确认AI算力硬件为绝对主线。
      evidence_sources:
      - 板块动向：算力硬件成绝对主线
      - CPO/PCB/液冷/电子布/CPU反复活跃
    - step: 3
      name: 拆解主线内部结构
      question: 主线内各细分和个股处于什么角色？
      UP_logic: 区分中军（中际旭创）、情绪核心（东山精密）、低位补涨（光迅/华工）、最强补涨（电子布）和扩散分支（设备/CPU），观察高低位切换。
      evidence_sources:
      - 中军中际旭创高位震荡
      - 东山精密开盘突破上周五涨停高点
      - 宏和科技、中国巨石涨停
      - 科瑞技术涨停
      - 海光信息、龙芯中科走强
    - step: 4
      name: 验证轮动健康度与反弹阶段
      question: 这种轮动是良性扩散还是退潮前的补涨？
      UP_logic: 核心领涨未主动走弱+低位科技补涨+梯队完整则良性；按“周三启动→周四弱分歧→周五回流”定位反弹后半程，确定性下降。
      evidence_sources:
      - 板块内高低位切换顺畅
      - 核心领涨标的未出现主动走弱
      - 反弹进入后半程
    - step: 5
      name: 转化为操作纪律
      question: 当前阶段应该如何应对？
      UP_logic: 反弹后半程不追高，等大盘分歧回落低吸主线内优质标的；盯紧东山精密主动性作为风格漂移预警。
      evidence_sources:
      - 不建议盲目追高
      - 等待大盘分歧回落后寻找主线内优质标的低吸切入点
      - 盯紧东山精密的主动性变化
    risk_factors:
    - 核心领涨标的（如东山精密）主动性转弱或断板
    - 板块横向扩散失败，算力租赁等接力方向未获资金响应
    - 反弹进入后半程，成交萎缩或指数再度走弱
    confidence_indicators:
    - 板块内高低位切换顺畅，低位标的持续补涨
    - 核心中军和情绪龙头保持高位，未出现主动走弱
    - 成交额维持高位，资金在板块间而非离场
    - 产业增量信息强化分支景气逻辑，如电子布
    merge_suggestion: 主线内部高低切与补涨扩散，评估轮动健康度和持续性
  - pattern_id: tech_internal_rotation_20260427
    name: 科技高低切与补涨性质识别
    source_raw:
    - sources/raw/财经/午盘：26-04-27：窄幅震荡无方向，科技高低切半导体最强，DeepSeek昇腾分歧.md
    key_themes:
    - 科技板块内部高低切
    - 事件驱动后的板块联动验证
    - 低位补涨与主升识别
    - 攻防板块资金跷跷板
    - 主线持续性判断
    reasoning_chain:
    - step: 1
      name: 定位市场阶段
      question: 当前处于大主升后的哪个阶段？
      UP_logic: 通过指数窄幅震荡、涨跌参半、跌停集中在个股瑕疵而非扩散，判断为'大主升之后的混沌消化期'。
      evidence_sources:
      - 原文：三大指数维持窄幅震荡，全A涨跌参半
      - 原文：跌停股集中在业绩问题或个股自身瑕疵，未扩散成系统性情绪杀跌
    - step: 2
      name: 判别上涨性质
      question: 低位科技上涨是新主线主升还是补涨？
      UP_logic: 用涨停数量、板块联动性、上涨驱动来源交叉验证：涨停不多、联动变弱、上涨靠个股新属性，定性为补涨而非全面主升。
      evidence_sources:
      - 原文：半导体涨停数量不多，整体偏趋势修复和补涨
      - 原文：很多上涨是个股叠加产业消息、业绩预期、订单预期或供应链属性
    - step: 3
      name: 事件冲击力对比
      question: 后续还会不会有更强主线？
      UP_logic: 以华为昇腾/DeepSeek这类高冲击事件为标尺：这种级别没带出强联动，后续小事件更偏局部补涨，资金合力不足。
      evidence_sources:
      - 原文：华为昇腾/DeepSeek周末发酵后早盘出现分歧
      - 原文：短期很难再出现比华为昇腾、DeepSeek更有冲击力的科技事件
    - step: 4
      name: 推导操作纪律
      question: 这个阶段应该追涨还是低吸？
      UP_logic: 混沌轮动阶段不盲目追涨，'买阴不追阳'可信度更高；关注低位科技能否维持、新消息能否扩散、细分趋势能否承接。
      evidence_sources:
      - 原文：不适合盲目追涨，'买阴不追阳'策略可信度更高
      - 原文：午后重点观察低位半导体、OpenAI手机扩散、交换机芯片趋势
    risk_factors:
    - 高位核心标的重新放量带动板块普涨，说明不是补涨而是新主升
    - 跌停潮扩散、情绪系统性恶化，说明不是混沌消化而是退潮
    - 低位方向出现涨停潮与强联动，推翻'局部补涨'判断
    confidence_indicators:
