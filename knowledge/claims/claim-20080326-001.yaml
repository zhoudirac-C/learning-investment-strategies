  subject: 能量动力结构的几何对应
  timeframe: permanent
  statement: 在现代物理（规范场、超弦、膜空间等涉及超越直观的几何学）里，能量、动力等结构对应着一些特殊的几何结构，这才是现代物理的主流。
  evidence_quote: 而后面，到规范场、超弦、膜空间等等，就涉及各种超越一般人直观的几何了。在那些几何学里，能量、动力等结构对应着一些特殊的几何结构。这才是现代物理的主流。
  interpretation: 能量动力不是只能靠微积分、级数等算法刻画的量，而是可以对应为几何结构。这一现代物理主流观点正是缠论把走势能量动力形态几何化的理论依据。
