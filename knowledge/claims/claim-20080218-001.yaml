  subject: 走势完成后的级别必然性
  topic: 走势级别完成后必然面临更大级别中枢震荡，最后中枢是关键指标位
  statement: 走势的最大特点：连接中枢的走势级别一定小于中枢，换言之，一个走势级别完成后必然面临至少大一级别的中枢震荡，例如5分钟上涨结束后必然至少有一个30分钟的中枢震荡，没有任何走势可以逃脱。由此，任何后续更大级别中枢震荡必然至少落在前一走势类型的最后一个中枢范围里，这是正常、健康的中阴状态；一旦中枢震荡回到原走势类型的第二甚至更后中枢里，对应的中阴状态就是不健康、危险的，原走势最后一个中枢就成了关键的指标位置。危险是相对的：对原下跌走势，中阴危险意味着回升力度够强，对多头意味着好事情。
  evidence_quote: 连接中枢的走势级别一定小于中枢，换言之，一个走势级别完成后必然面临至少大一级别的中枢震荡……任何一个后续的更大级别中枢震荡，必然至少要落在前一走势类型的最后一个中枢范围里，这是一个必然结论……但，一旦其中枢震荡回到原走势类型的第二甚至更后中枢里，那么，对应的中阴状态就是不健康的，是危险的，而原来走势的最后一个中枢，就成了一个关键的指标位置。
  interpretation: 这是两重表里关系第三课的核心定理，把行情诊断变成有明确位置界限的判断：最后一个中枢是健康与不健康的分界线。结合分型使用时，分型对应的小级别中枢位置几乎决定该分型是否是最后真正的顶或底。
