  subject: AI上游材料——最强分支，抗分歧创新高
  statement: AI上游/上上游材料是今日表现最强势的方向——抗过本轮分歧并创出新高的个股大多来自这一方向。半导体内部也以最上游的硅片最强。这一结构容易让人联想到2021年的PVDF行情。核心逻辑：高端产能扩产壁垒高、释放慢，使得涨价更具持续性。
  evidence_quote: AI上游/上上游材料表现最为强势，抗过本轮分歧并创出新高的个股，大多来自这一方向；半导体内部也是最上游的硅片最强。这一结构很容易让人联想到2021年的PVDF行情。
  interpretation: UP 引用 PVDF（2021年锂电池上游材料）行情类比。PVDF行情背景：新能源爆发→上游材料技术壁垒高→产能释放慢→价格持续上涨→股价持续新高。UP
    认为当前 AI 上游材料有类似特征：高端产能扩产难度更大（对比新能源），且本轮分歧已筛选出真正的强势品种。这构成一个中期的确定性方向——'已被资金验证的主线'。
