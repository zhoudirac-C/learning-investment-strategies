  interpretation: 操作纪律：①4033点是清仓线——收盘跌破即执行，不是盘中跌破；②4130点是满仓线——向上突破即满仓；③纪律线不带感情——这是博主反复强调的交易纪律；④与昨日（6月2日）4032点相比，清仓线上移至4033点，满仓线维持4130点不变；⑤心理承受力偏弱的人，死守这一条标准即可。这是明确的操作规则，属于durable
