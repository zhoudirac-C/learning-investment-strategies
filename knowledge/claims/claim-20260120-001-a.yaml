subject: 大盘分析三要素：量能+大金融+情绪
timeframe: permanent
statement: "UP判断大盘状态使用三个核心要素：1)量能——缩量意味着跌不透又涨不动，放量意味着方向选择；2)大金融——是否承接资金，是护盘还是拖累；3)情绪——跌停家数变化、连跌停修复情况、资金自救信号。三要素同时判断，缺一不可。"
evidence_quote: "大盘三要素：量能2.71万亿（缩量3179亿），短时间剧烈缩量→跌不透又涨不动；大金融延续弱势，未能承接资金；情绪跌停从45→23家。鲁信创投/华夏幸福/亿晶光电三连跌停修复，海格通信尾盘竞价亿元买单（资金自救）"
interpretation: "UP首次系统化提出大盘分析的三个维度：量能、大金融（权重/防御）、情绪。这与后来的'全A+微盘股+情绪'框架不同但互补。这里的'三要素'是盘面即时判断工具，后来的'四层框架'（L1-L4）是多时间维度的结构分析。两者构成UP大盘分析体系的上下两层。"
