  subject: 亏损重来的纪律
  topic: 唯一资本没有后援，输光再给机会前必须彻底解剖失败根源，再败则退出
  statement: 把你完全不影响生活的钱拿出来，告诉自己这就是你唯一的资本，你没有后援，然后就用这创造你自己的神话。如果输光了，可以再给自己一次机会，但在给自己这次机会之前，必须把自己彻底解剖一次，把所有失败的根源都挖出来，然后告诉自己这是最后的尝试。如果又输光了，那么就退出，不是每一个人都适合市场；然后给自己N年的机会去学习、去历练，N年以后觉得有足够信心重新回到市场了，再给自己一次机会，如果这还不行，这一生就和市场永远再见，买基金买国债什么都可以，但还是别亲自到市场来了。
  evidence_quote: 你可以把你完全不影响生活的钱拿出来，告诉自己，这就是你唯一的资本，你没有后援……但在给自己这次机会之前，你必须把自己彻底解剖一次，把你所有失败的根源都挖出来……如果这还不行，那这一生，你就和市场永远再见。买基金，买国债，什么都可以，但还是别亲自到市场来了。
  interpretation: 罕见的从破产到退出市场的完整纪律设计：资金上限前置、重来次数受限、每次重来以彻底复盘为前提、承认不适合市场也是合法结局。市场只是生活的一部分。
