  timeframe: intraday
  statement: 8月18日午后操作分两种情形：若下午继续走弱，60分钟高9不成立、双左侧的离场点也不存在，只能等60分钟DIF拐头向下、顶部结构确认成立后再处理；若下午涨速转快，60分钟顶部钝化自然消失、原有结构不成立；两种情形都要等结构给出确认再动。
  evidence_quote: 操作节奏上分两种情形：若下午继续走弱，60分钟高9就不成立，双左侧的离场点也就不存在，那么只能等60分钟DIF拐头向下、顶部结构确认成立后再处理；若下午涨速转快，60分钟顶部钝化则会自然消失，原有结构不成立。两种情形都要等结构给出确认再动。
  interpretation: 操作纪律核心：不预判、等结构。情形A（继续走弱）=高9/双左侧失效，等DIF拐头+顶部结构确认再离场；情形B（涨速转快）=钝化自然消失、无需离场。无论哪种都不提前动手，等待结构信号确认。
