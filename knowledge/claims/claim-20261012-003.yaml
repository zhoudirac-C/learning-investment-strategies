  subject: 受迫盘出清时的操作纪律
  timeframe: permanent
  statement: 交易层面的老话是「买在不得不卖，卖在不得不买」：受迫盘出清之际，正是坚守或加仓之时；对A股而言，能做到基于交易视角的低位买入并持有，便能跑赢绝大多数资金。
  evidence_quote: 交易层面的老话是"买在不得不卖，卖在不得不买"。受迫盘出清之际，正是坚守或加仓之时。对A股而言，能做到基于交易视角的低位买入并持有，便能跑赢绝大多数资金。
  interpretation: UP的操作纪律：受迫盘（不得不卖的盘）砸出的价格是被动低价，对应买点而非卖点；逆向操作的对象是「被迫交易」而非「主动看空」。结合003-c，当前正处受迫盘主导阶段，操作含义是坚守或加仓而非减仓。
