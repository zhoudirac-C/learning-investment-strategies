statement: 短线机会需提前识别，重点寻找能在分歧中保留主动性的方向；今日需区分三种资金行为（围绕原有主线继续强化核心/在主线内部切换到低位分支/离开一致性较强的方向寻找军工、云厂商等其他板块），三种行为对应的持续性不同，不能把所有异动都理解为新的主线启动。
evidence_quote: 个人判断，短线机会需要提前识别，重点是寻找能够在分歧中保留主动性的方向。今天要区分三种资金行为：围绕原有主线继续强化核心；在主线内部切换到低位分支；离开一致性较强的方向，寻找军工、云厂商等其他板块。三种行为对应的持续性不同，不能把所有异动都理解为新的主线启动。
interpretation: UP提出短线机会识别的核心是寻找分歧中保留主动性的方向，并建立三种资金行为分类框架以区分持续性。
