  timeframe: short-term
  statement: 单纯缩量不足以证明企稳：成交收缩的同时跌停减少、指数不再持续创新低才更像抛压衰减；若反弹时量能始终跟不上、稍有回落就再放量，则市场仍在利用回升减仓。观察量价关系落在两处：领跌指数能否在早盘分歧后守住新的盘中低点，以及科技权重回升时是否带动更多个股而非靠少数大市值公司独自拉指数。
  evidence_quote: 对明天而言，单纯缩量不足以证明企稳：若成交收缩的同时跌停减少、指数不再持续创新低，才更像抛压衰减；若反弹时量能始终跟不上、稍有回落就再放量，则市场仍在利用回升减仓。观察量价关系要落在两处。一处是创业板等领跌指数能否在早盘分歧后守住新的盘中低点，另一处是科技权重回升时是否带动更多个股，而非靠少数大市值公司独自拉指数。
  interpretation: UP的企稳确认框架：缩量必须同时伴随跌停收敛与指数不创新低才有意义；无量反弹视为减仓窗口。两个观察落点分别验证领跌指数的承接与反弹的个股广度。
