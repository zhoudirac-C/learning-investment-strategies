    - 美联储/油价/美债联动
    reasoning_chain:
    - step: 1
      name: 隔夜事件双线分类
      question: 隔夜海外信息应当如何阅读？
      UP_logic: 将隔夜信息拆为宏观风险端和基本面支撑端两条线，分别评估方向，再合并为“极致对冲”而非单边利好/利空。
      evidence_sources:
      - 原油逼近110美元
      - 美联储8:4创34年最大分裂
      - 美股四大科技巨头财报
    - step: 2
      name: 宏观风险传导链
      question: 宏观风险如何传导至A股？
      UP_logic: 油价暴涨→通胀预期→美联储降息空间压缩甚至加息→美债/美元走强→全球流动性收紧，压制A股风险偏好。
      evidence_sources:
      - 油价+6%逼近110美元
      - 加息概率20%升至40%
      - 10年期美债4.43%
      - 美元指数突破布林线中轨
    - step: 3
      name: 产业基本面验证链
      question: 产业基本面如何传导至A股？
      UP_logic: 四大财报验证AI商业化正循环：AI收入、云增速、订单积压同步高增，为A股科技成长主线提供基本面底盘。
      evidence_sources:
      - 微软AI年化收入370亿美元+123%
      - 谷歌Cloud+63%且订单积压4600亿美元
      - Meta广告量价齐升
      - 亚马逊AWS+28%
    - step: 4
      name: 映射A股受益环节
      question: A股哪些环节承接海外验证？
      UP_logic: 海外云厂商AI验证→按产业链上游映射国内算力租赁/IDC、CPO/光模块/PCB、定制芯片、存储等环节。
      evidence_sources:
      - 原文：直接映射A股上游环节
      - 算力租赁/IDC
      - CPO/光模块/PCB
      - 定制芯片/存储
    - step: 5
      name: 结合本地环境定操作
      question: 今日具体操作如何定？
      UP_logic: 外部对冲后叠加节前最后一个出金日，选择5~7成仓持股过节、不追高、不开新仓，方向偏多但动作克制。
      evidence_sources:
      - 沪指4080~4120
      - 预期缩量至2.0~2.4万亿
      - 核心原则：主线持股过节
    risk_factors:
    - 油价继续上行或美联储加息概率再升，全球流动性收紧压制A股
    - AI云增速/订单积压后续放缓，AI正循环验证被证伪
    - 节前出金日抛压超预期，北向资金大幅流出并跌破4080
    - 高位题材放量破位，连板情绪恶化，主线资金撤退
    confidence_indicators:
