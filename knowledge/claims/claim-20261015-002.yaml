- id: claim-20261015-002-e
  claim_type: methodology
  subject: 护盘只起引导作用
  timeframe: permanent
  statement: 护盘的涨跌结果由抛压与护盘力度的相对大小决定：市场抛压大于护盘时依然会跌，市场买盘大于抛压时依然会涨；护盘方只起引导作用，机构和市场资金的响应才是关键。
  evidence_quote: 当市场抛压大于龙哥护盘时，依然会跌，当市场买盘大于龙哥抛压时，依然会涨。龙哥只起引导作用，机构和市场资金的响应才是关键。
  interpretation: 护盘不是价格决定项而是引导项：真正定价的是市场自身买卖力量的对比。推论是「护盘次数多」不能推出「收盘必涨」，观察护盘应看资金是否响应而非护盘动作本身。这是鳄鱼派资金生态位框架下的核心机制判断。
  confidence: high
  stance: view
  intensity: high
  topic: 护盘是引导而资金响应才是关键
  supersedes: []
