  statement: Lumentum于当地时间8月11日盘后发布的2026财年第四财季业绩：当季营收10.1亿美元、同比增长109%，调整后每股收益3.23美元、同比增长267%，非GAAP毛利率50.4%、经营利润率36.6%；2027财年第一财季指引营收12.3亿至12.8亿美元（中值较市场预期高约8%）、调整后EPS中值高出约16%、非GAAP经营利润率指向40%附近。管理层提到超高功率CPO激光器需求增长、ELS模块获得首批订单、NPO业务推进，认为光学技术正开始向机架内连接渗透。这份财报验证的是全球高速光互联的景气度，尤其是光学从机间走向机架内的方向性变化。
  evidence_quote: 据Lumentum于当地时间8月11日盘后发布的2026财年第四财季业绩，公司当季营收10.1亿美元、同比增长109%，调整后每股收益3.23美元、同比增长267%，非GAAP毛利率50.4%、经营利润率36.6%；更关键的是2027财年第一财季指引，营收12.3亿至12.8亿美元，中值较市场预期高约8%，调整后EPS中值高出约16%，非GAAP经营利润率指向40%附近。公司管理层提到超高功率CPO激光器需求增长、ELS模块获得首批订单、NPO业务推进，认为光学技术正开始向机架内连接渗透。这份财报验证的是全球高速光互联的景气度，尤其是光学从机间走向机架内的方向性变化，这一点值得记录。
