  statement: 本轮科技下跌主因在筹码而非基本面：机构筹码高度集中于少数科技赛道，叠加同质化量化止损策略形成多米诺骨牌式连锁踩踏。算力紧缺的需求逻辑没有任何变化，调整结束后仍然只等科技、不换方向。
  evidence_quote: 关于本轮下跌为何又快又猛，倾向于认为主因在筹码而非基本面：机构筹码高度集中于少数科技赛道，叠加同质化的量化止损策略，一批资金触发5%止损线砸出的抛盘，把价格进一步砸向下一批10%的止损线，形成多米诺骨牌式的连锁踩踏。这类筹码型下跌的特征是快而猛烈、可能一步划到底；但它也意味着下跌与产业基本面无关——算力紧缺的需求逻辑没有任何变化，这正是调整结束后仍然只等科技、而不换方向的原因。
  interpretation: UP将此轮下跌定性为筹码型（而非基本面型），这意味着：①可能急跌到底而非阴跌 ②产业逻辑未变，调整后仍聚焦科技 ③不因恐慌切换方向。这是支撑'调整后仍然只等科技'的核心逻辑。
