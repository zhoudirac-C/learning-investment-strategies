  topic: 市场要的是新增就业6到10万且工资温和的报告，三种情景区间的资产含义可推演
  timeframe: short-term
  statement: 非农数据的市场检验框架：市场需要的不是越差越好的报告，而是「刚刚好」的金发姑娘区间——新增就业6万-10万且工资增速温和、无衰退信号；情景一大于15万为过热，打破鸽派预期、10月加息概率回升、美股黄金面临回调；情景二小于5万为过冷，打消加息预期但引发衰退担忧、风险资产可能先涨后跌；情景三6-10万强化按兵不动预期，最利于股债金齐涨；华尔街共识预期8.4万-9万已在区间内，市场提前定价了部分乐观，数据偏离区间两端都会引发明显波动。
  evidence_quote: 市场需要的，不是一份“越差越好”的非农报告，而是一份“刚刚好”的报告——也就是所谓的“金发姑娘区间”：新增就业人数在6万-10万之间，同时工资增速温和，没有衰退信号。
  interpretation: UP的非农情景推演：把单点数据事件转化为三区间×资产反应的决策矩阵，并指出共识预期已内嵌区间假设（利好兑现风险）；10月2日晚20:30数据公布后可直接对照执行。
