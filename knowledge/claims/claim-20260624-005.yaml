  subject: 看涨吞没条件体系与信号分级
  timeframe: permanent
  statement: 看涨吞没（Bullish Engulfing）出现在下跌末端，共8个条件。基础4条（必须满足）：①前期至少5个交易日下跌；②第一根为阴线；③第二根为阳线；④第二根阳线实体完全包裹第一根阴线实体。加分4条：①包裹影线（不仅实体）；②阳线实体远大于阴线；③成交量放大超过前一根1.5倍；④出现在长期下跌后支撑位。满足全部8条件=A级信号，满足基础+1-3加分=B级，满足基础+1加分=C级（仅视为小反弹）。
  evidence_quote: 看涨吞没一共8个条件，前4个为必须满足的基础条件：1.前期至少5个交易日下跌；2.第一根为阴线；3.第二根为阳线；4.第二根阳线实体完全包裹第一根阴线实体。后4个为加分条件：1.包裹影线；2.阳线实体远大于阴线；3.成交量放大超过1.5倍；4.出现在长期下跌后支撑位。满足全部8个条件为A级，满足前4个加1-3个加分条件为B级，满足前4个加1个加分条件为C级。
  interpretation: 看涨吞没的加分条件本质是确认力量反转的强度。阳线越大说明多方进攻越强，放量说明有增量资金进场，支撑位说明位置也配合。A级信号包含位置、量能、力度三重确认。
