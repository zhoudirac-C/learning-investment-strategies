- id: claim-20261015-002-k
  claim_type: methodology
  subject: 左侧右侧的群体行为纪律
  timeframe: permanent
  statement: 市场下跌像刹不住时人们不愿左侧捡便宜，止跌后右侧行情来临时又犹豫不决，最终往往在反弹结束、行情末端才进场梭哈。
  evidence_quote: 每当市场跌起来像刹不住的时候，人们都不想左侧捡便宜，但止跌后，右侧行情来临时也犹豫不决，最终反弹结束了再进场梭哈。
  interpretation: 对群体行为时序的刻画：恐慌时不敢买、修复时不敢追、末端才梭哈。反推出的纪律是要在左侧有限次介入、右侧确认后按预案加仓，而不是等情绪最热时才动手。
  confidence: medium
  stance: view
  intensity: high
  topic: 左侧不敢买右侧末端梭哈
  supersedes: []
