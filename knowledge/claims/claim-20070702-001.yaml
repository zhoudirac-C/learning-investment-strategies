  subject: 只有坏的操作者没有坏的股票
  topic: 利润来自操作而非标的，小资金选股性好的，大资金可改造股性
  statement: 站在纯理论的角度，没有任何股票是特别有操作价值的，中枢震荡的股票不一定比相应级别单边上涨的股票产生的利润少。只有坏的操作者，没有坏的股票：股票只是废纸，本质上都是垃圾，技术、心态不到位，任何股票都可以让你倾家荡产。对于小资金来说，一定要选择股性好的股票；对于大资金来说，股性是可以改造的，任何股票的股性都可以被改造，只不过需要的能量不同。
  evidence_quote: 而站在纯理论的角度，没有任何股票是特别有操作价值的，中枢震荡的股票不一定比相应级别单边上涨的股票产生的利润少。只有坏的操作者，没有坏的股票。股票只是废纸，本质上都是垃圾，如果技术、心态不到位，任何股票都可以让你倾家荡产。当然，对于小资金来说，一定要选择股性好的股票；而对于大资金来说，股性是可以改造的……任何股票的股性都可以被改造，只不过需要的能量不同而已。
  interpretation: 把选股问题降权、把操作问题升权：利润来自操作级别内买卖点的执行而非标的本身。股性即波动活性，是小资金唯一的选股实质标准；没有把握时老老实实按级别分析操作，别把自己当高手。
