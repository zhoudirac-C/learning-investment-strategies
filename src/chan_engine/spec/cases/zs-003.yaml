#   zs3=bi7..bi9：[15.5,18]/[15.5,17.8]/[16.2,17.8] → [max(15.5,15.5,16.2), min(18,17.8,17.8)] = [16.2,17.8]
#   三个本级别中枢的重合区间 = [max(16,16.5,16.2), min(17,18,17.8)] = [16.5,17]
#   → 更大级别中枢 level=2，start_idx=5（bi1 起点）、end_idx=41（bi9 终点）。
#   bi10 上（16.2→19）离开。expect 只列升级后的 level=2 中枢（3 个 level=1 中枢为
#   中间产物，见本注释公式），与"9 段即构成更大级别中枢、归属唯一"的口径一致。
# 分型中心间隔 4 根 K 线，腿内单调无包含；pivot 极值精确落位（13@1/17@5/15@9/
