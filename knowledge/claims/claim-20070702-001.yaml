  subject: 图的级别与走势级别
  topic: 图的级别与中枢级别无必然关系，图是显微镜，走势类型是观察物
  statement: 什么级别的图和什么级别的中枢没有任何必然关系。走势类型以及中枢如同显微镜下的观察物，是客观存在的，其存在性由最原始的递归定义保证；而级别的图就如同显微镜，不同倍数的显微镜看同一客观对象，看到的精细程度不同，不能把显微镜和显微镜观察的东西混在一起。选定最低级别图（如1分钟图）为基本图后，就可以定义分型、笔、线段，进而定义最低级别中枢与走势类型，再按递归方法逐步定义5分钟、30分钟、日、周、月等级别的中枢和走势类型。
  evidence_quote: 再次强调，什么级别的图和什么级别的中枢没有任何必然关系，走势类型以及中枢就如同显微镜下的观察物，是客观存在的，其存在性由上面所说最原始的递归定义保证，而级别的图，就如同显微镜，不同倍数的看这客观的图就看到不同的精细程度，如此而已。所以，不能把显微镜和显微镜观察的东西混在一起了……如果我们首先确立了显微镜的倍数，也就是说，例如我们把1 分钟图作为最基本的图，那么就可以开始定义上一课程说的分型、笔、线段等等。有了线段，就可以定义1 分钟的中枢，然后就是1 分钟的走势类型，然后按照递归的方法，可以逐步定义5 分钟、30 分钟、日、周、月、季度、年的中枢和走势类型。
  interpretation: 这是缠论级别概念的总开关：中枢与走势类型是对象本身的结构，图只是观察工具。推论：换图不等于换级别，看1分钟图也不等于做超短线；选更大周期的图只是显微镜倍数调小、看得更粗糙。
