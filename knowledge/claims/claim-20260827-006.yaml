  timeframe: permanent
  statement: 财务报表很重要，但行业所处阶段不同，基本面与预期的权重就不同：景气度趋势投资要看业绩兑现与估值性价比，要靠谱；新技术导入阶段的主题波段要看终局叙事与进展催化，要性感。以光刻机环节为例：技术最难所以关注度高、估值容忍度高，业绩不好可以原谅，但前提是要有持续催化（外部封锁事件、行业进展、新技术转化、客户验证加单）；如果业绩很好且体量很大，反而与「国产替代皇冠上的明珠」相背离。
  evidence_quote: 正因为技术最难所以关注度高、估值容忍度高，如果业绩很好而且体量很大，反而与"国产替代皇冠上的明珠"这一形容相背离。业绩不好可以原谅，但前提是要有持续的催化：外部封锁的事件催化、光刻机的行业进展、光通信的新技术转化、下游新客户验证通过后的加单。……行业所处阶段不同，基本面与预期的权重就不同——景气度趋势投资要看业绩兑现与估值性价比，要靠谱；新技术导入阶段的主题波段要看终局叙事与进展催化，要性感。
  interpretation: 估值范式选择器：先判定标的处于「景气兑现」还是「主题导入」阶段，再决定用哪套权重。反直觉洞察：皇冠明珠类标的业绩太好反而是卖点（兑现=想象空间终结）。
