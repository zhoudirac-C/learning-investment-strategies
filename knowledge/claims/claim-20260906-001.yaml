  subject: 非农偏强未点燃通胀恐慌估值压制有边界
  timeframe: short-term
  statement: 8月非农新增就业16.2万人远超预期（一致预期5.3万），失业率持平4.1%，时薪环比+0.3%/同比+3.1%未加速，前值合计上修5.5万；数据抬升加息预期但未点燃通胀恐慌，市场会读成'劳动力市场没有衰退'，对估值的压制因此是有边界的。
  evidence_quote: 新增偏强、时薪温和、失业率未升、前值上修，四项里只有新增一项明显偏热，时薪3.1%的同比增速并未加速。这份数据抬升的是加息预期，通胀恐慌并未被点燃，市场会把它读成'劳动力市场没有衰退'，对估值的压制因此是有边界的。
  interpretation: 非农数据的四项拆解中只有'新增'一项偏热，时薪/失业率/前值均偏温和，因此定性为'加息预期升温'而非'滞胀/通胀失控'——这是后续所有A股判断的地基：估值会承压但幅度有限，市场不会进入恐慌性抛售。该判断是9/6晚间对隔夜非农的官方定调，直接决定周一A股开盘的定价输入性质。
