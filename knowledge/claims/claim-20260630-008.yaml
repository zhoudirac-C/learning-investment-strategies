  timeframe: permanent
  statement: A级乌云盖顶出现当天先减仓50%；第三天若继续下跌并跌破第二根阴线最低点，减至80%；第三天若再来一根阴线包掉第二根阴线，则清仓100%。
  evidence_quote: 你看到乌云盖顶的当天就立刻减仓百分之五十，好吧？……第二步你观察第三天，如果第三天继续下跌，跌破第二天的最低点，减仓到百分之八十。如果第三天再来一根阴线包掉第二天，那么减仓到百分之百，好吧，完全清仓。
  interpretation: 减仓节奏与建仓镜像但更快：首日即减半，不等确认；后续按第三日价格行为加到80%/100%。
