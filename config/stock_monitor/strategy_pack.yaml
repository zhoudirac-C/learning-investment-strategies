market_framework:
  current_stage: 调整第17天接近尾声。AI上游材料端最确定。非科技尾声。昇腾超跌赔率升高，6月中下旬回归。
  core_question: 创业板低开高走？赚钱效应夯实？AI上游材料延续最强？昇腾赔率窗口？
  up_quote: 6月5日早盘：第17天接近尾声。4033/4130。重心AI上游材料。做T为主。昇腾赔率升高。
  key_assumptions:
  - 调整第17天接近尾声
  - AI上游材料端最确定
  - 非科技方向尾声
  - 昇腾赔率升高6月中下旬回归
  - 做T/持股不开新仓
  - 4033/4130不变
  invalidation_conditions:
  - 收盘跌穿4033→清仓
  - 创业板低开高走证伪
  - AI上游材料集体走弱
intraday_schedule:
- window: 09:15-09:30
  name: 集合竞价
  action_bias: 只观察
  rules:
  - 观察AI上游材料端(MLCC/铜缆/光纤/超级电容)是否延续强势
  - 观察煤炭/大消费是否走弱
  - 观察昇腾链是否企稳
  - 观察创业板低开→能否高走
- window: 09:30-09:45
  name: 开盘观察
  action_bias: 确认AI上游材料方向
  rules:
  - 看AI上游材料端主动走强
  - 看煤炭见顶回落
  - 看昇腾链止跌
  - 看创业板低开高走兑现
- window: 09:45-10:30
  name: 急跌确认
  action_bias: 等确认，不水下盲吸
  rules:
  - 调整不创新低(4000上)且放量收回→观察
  - AI上游材料回调关注企稳
  - MLCC只观察不介入
  - 昇腾止跌可关注航天电器/意华股份
- window: 10:30-13:30
  name: 主修复窗口
  action_bias: 可做T，可观察
  rules:
  - 趋势未破的化工涨价硬逻辑票，满足分时确认后可观察
  - MLCC已提前提示，现在追涨是韭菜行为——只观察不介入
  - 反弹到预设区但板块不扩散，优先观察不介入
  - 现金为主，新增观察池买点必须等情景确认
- window: 13:30-15:00
  name: 午后风险窗口
  action_bias: 只看不买
  rules:
  - 午后冲高无扩散，优先观察不介入
  - MLCC已提前提示，现在追涨是韭菜行为——只观察不介入
  - 尾盘回落跌破4000，降低次日预期
  - 若尾盘再度快速修复但成交不能放大，警惕继续透支次日预期
agent_analysis_schedule:
- id: open_auction
  time: 09:26
  name: 集合竞价后
  focus: MLCC/煤炭/化工是否超预期，科技是否继续低开，今天偏进攻还是防守。**判断大盘是否止跌企稳：低开高走/平开震荡=企稳信号；低开低走/高开低走=未企稳。若企稳可观察准备低吸，若未企稳继续等待。**
- id: open_confirm
  time: 09:45
  name: 开盘15分钟确认
  focus: 指数是否失守4000，MLCC/化工谁主动，科技是否继续杀跌，跌停是否缩短。**判断大盘是否止跌企稳：15分钟内不创新低且放量收回=企稳；继续创新低=未企稳。**
- id: morning_confirm
  time: '10:30'
  name: 30分钟确认
  focus: 调整是否不创新低，MLCC/化工能否做T或观察。**判断大盘是否止跌企稳：30分钟内出现日内低点后反弹且持续=企稳。**
- id: noon_review
  time: '11:20'
  name: 上午收盘前
  focus: 上午定性为强修复、弱修复、防御切换还是继续分歧。**判断大盘是否止跌企稳：上午收盘在日内高点附近=企稳。**
- id: afternoon_risk
  time: '13:10'
  name: 午后风险窗口
  focus: 按午后只看不买纪律，重点观察冲高回落和板块扩散衰竭。**判断大盘是否止跌企稳：午后开盘不跳水且维持震荡=企稳。**
- id: mid_afternoon
  time: '14:00'
  name: 午盘监控
  focus: 午后一小时盘面验证：MLCC/化工是否触发观察点、持仓是否触发风控。只讲当下，不预判尾盘。**判断大盘是否止跌企稳：14:00前后出现低点后反弹=企稳。**
- id: tail_condition
  time: '14:50'
  name: 尾盘条件单
  focus: 判断是否符合尾盘观察、规避尾盘杀的条件。**判断大盘是否止跌企稳：尾盘维持震荡或小幅回升=企稳；尾盘跳水=未企稳。若企稳可低吸，若未企稳只观察不买。**
position_rules:
- id: opportunity_panic_oversold
  name: 恐慌超卖策略
  description: 对应机会模式1。当板块系统性回调（非个股利空），日内跌>5%时触发
  action: 评估赔率后试探买入
  max_position: 1成
  stop_loss_pct: 3
  claim_basis: UP的'别人恐慌我贪婪'思想
- id: opportunity_breakout
  name: 平台突破策略
  description: 对应机会模式2。横盘2+周后放量突破区间上沿
  action: 确认突破有效性（次日不回落）后追入
  max_position: 1.5成
  stop_loss_pct: 5
- id: opportunity_technical_support
  name: 技术支撑确认
  description: 对应机会模式3。回踩关键均线/平台企稳，缩量确认
  action: 企稳后试探买入
  max_position: 1成
  stop_loss_pct: 3
- id: opportunity_sector_rotation
  name: 板块轮动早期
  description: 对应机会模式4。新方向首日启动，龙头涨停，观察次日持续性
  action: 龙头首日不追，次日确认后轻仓试探
  max_position: 0.5成
  stop_loss_pct: 5
- id: opportunity_leader_pullback
  name: 龙头分歧低吸
  description: 对应机会模式5。主线龙头首次大分歧，缩量回踩
  action: 分歧日尾盘或次日低吸
  max_position: 1.5成
  stop_loss_pct: 3
- id: opportunity_tail_condition
  name: 尾盘条件单
  description: 对应机会模式6。14:30后符合特定技术条件（回踩不破、放量企稳）
  action: 尾盘确认后买入
  max_position: 0.5成
  stop_loss_pct: 2
- id: opportunity_event_driven
  name: 事件驱动
  description: 对应机会模式7。突发利好/利空导致赔率突变
  action: 评估事件实质影响后决策
  max_position: 1成
  stop_loss_pct: 5
