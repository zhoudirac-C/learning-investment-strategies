  subject: 美债收益率高企与美元不涨的联手指升日元链条
  timeframe: trend
  statement: 美国财政部当前面对两个问题：新债认购倍数与压低付息成本，二选一前者更重要——美债平均久期不超过7年，长端更陡，短期付息压力可承受，发短购长也能部分控制综合成本。真正致命的是需求侧收缩：挪威主权基金下调债券投资比例至50%，到期的一部分美债不再续买，缺口需要其他投资者补上。美债需要市场溢价重新定价，收益率高企正是给出溢价、确保新债顺利发行的手段。传统逻辑下收益率高企对应美元走强，但近期美元指数不涨反跌。美国财长贝森特与日本财相长时间会谈，目的在推升日元，防止日本政府救市时大量抛售美债；美元不能升，才能守住近一个月美日联手推升日元的成果。美元不升又要维持美债吸引力，任务落在通胀预期上：沃什在央行年会的鹰派表态是推高收益率的一只手，油价90美元附近时美方对伊朗动武、油价向100美元上攻是另一只手。这条链条能否成立，观察变量是CPI公布后美元与10年期收益率是否继续背离。
  evidence_quote: 美元不能升，才能守住近一个月美日联手推升日元的成果。美元不升又要维持美债吸引力，任务就落在通胀预期上：沃什在此前央行年会上的鹰派表态是推高收益率的一只手，油价在90美元附近时美方对伊朗动武、油价向100美元上攻，是另一只手。这条链条能否成立，观察变量是CPI公布后美元与10年期收益率是否继续背离。
  interpretation: 美债定价链条推演（UP宏观推演框架）：①美债核心矛盾=新债发行需求（挪威主权基金减配50%代表需求侧收缩），收益率高企=给溢价保发行；②美元不升反跌的解构=美日联手推日元（防日本抛美债），贝森特-日财长会谈；③推高收益率的'两只手'=沃什鹰派表态+伊朗动武推油价至100；④证伪锚点=CPI公布后美元与10Y是否继续背离（若背离持续=链条成立，若恢复同向=链条证伪）。这是观察级别的推演，非确定性结论。
