statement: 民主党限制 AI 发展速度、数据中心建设放缓，但并非不发展 AI，市场关于 AI 的叙事不会一致性转向，依然会有逢低去做多的。AI 下半场一定是应用，大模型应用落地才是产业链健康发展方向。
