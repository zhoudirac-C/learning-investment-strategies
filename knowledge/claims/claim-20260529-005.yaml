  timeframe: long-term
  statement: 半导体卡脖子的关键是光刻机，上海微电子/新凯来最迟2027年IPO，届时100-200亿市值的标的买不到。汇成真空、茂莱光学都是占未来的
  evidence_quote: 正儿八经半导体卡脖子的是什么是光刻机，所以汇成真空茂莱光学这些东西，它都是占未来的，那么上海微电子新凯来什么时候上？我估计他们也是在后面差不多要上了，我觉得最迟应该二七年就要就要IPO了
  interpretation: 博主给出半导体设备国产化的远期投资逻辑：①当前炒的是扩产（长鑫存储），还没到卡脖子关键节点；②真正卡脖子的是光刻机，上海微电子/新凯来是核心；③最迟2027年IPO，届时相关产业链标的（汇成真空、茂莱光学）100-200亿市值将买不到；④当前有业绩的半导体设备股（汇成真空Q2业绩应该很好）可以高看一眼；⑤强芯（已要上）→上海微电子/新凯来（下一波预期），这是半导体炒作的两阶段逻辑
