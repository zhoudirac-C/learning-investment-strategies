  subject: 初学者均线纪律
  topic: 初学者用5周5日线做机械束缚，分型后有效破了一定走
  statement: 对于初学者，一定要机械地给点束缚，等于那死猴子带上个圈圈，这个束缚就是5周、5日这些线，一旦分型后有效破了，一定走，这就是束缚；当然对熟练的就不需要这些了，严格的走势分类自动就给出一切。学了理论脑子里必须时刻有级别两个字，有了级别就是节奏问题；不会卖出，就等于失去了下次买入的机会，这个节奏之所以难，说白了就是贪嗔痴疑慢作怪。
  evidence_quote: 对于初学者，一定要机械地给点束缚，等于那死猴子带上个圈圈。这个束缚，就是5 周、5 日这些线，一旦分型后有效破了，一定走，这就是束缚。当然，对熟练的，就不需要这些了，严格的走势分类自动就给出一切……不会卖出，就等于失去了下次买入的机会。
  interpretation: 与第93课看5周均线有效跌破就走互为印证：均线纪律是级别不清时的降级保护方案，本质是用人造的简单边界替代还不会做的走势分类，待熟练后由严格分类自动接管。
