  subject: 上游涨价链持续居前——MLCC/光纤/电子布/CCL中报业绩确定性
  timeframe: trend
  statement: 上游涨价链条——MLCC、光纤、电子布/树脂/CCL——近期持续居前，推断主因在于中报业绩确定性相对较高。验证信号：关注上游涨价能否扩散至非半导体的部分化工品种——这是区分"炒一时业绩"还是"持续业绩"的关键。
  evidence_quote: 整体看，上游涨价链条——MLCC、光纤、电子布/树脂/CCL——近期持续居前，推断主因或在于中报业绩确定性相对较高。此外，可跟踪上游涨价能否扩散至非半导体的部分化工品种——这是区分"炒一时业绩"还是"持续业绩"的验证信号。
  interpretation: |
    UP确认当前盘面最强逻辑=中报业绩确定性→上游涨价链。这与6/4"找低位+Q1超预期→中报不差"的选股方法论一致。但UP加了验证条件：涨价能否扩散到非半导体化工？能→持续业绩逻辑，不能→只是炒一时。
    
    主板可关注的上游涨价链：MLCC（风华高科000636/三环集团300408不可交易）、光纤（长飞光纤601869/亨通光电600487/中天科技600522）、CCL（华正新材603186/金安国纪002636）。
