  subject: 形态不合格直接放弃的纪律
  timeframe: permanent
  statement: 当形态成立但量能、位置、环境不配合时，正确动作是直接错过、不参与，而不是降低仓位去试；宁可漏掉，也不要为「形态已经出现」找理由进场。
  evidence_quote: 所以如果只是在形态上满足了刺透或者乌云，但是量能位置、环境都不配合的话，那么这种信号我们可以直接错过，好吧，就不去操作，那么这个样子就会更为稳妥一点。
  interpretation: 这是信噪比优先的取舍：形态是入场券不是买入理由，三重配合缺一项即放弃，机会成本由纪律承担。
