chain_id: power-generation
name: 电力（绿电运营）产业链
thesis: 资金切入绿电运营商，逻辑指向电力市场化改革、绿证绿电溢价及迎峰度夏供需偏紧。传导路径：上游发电设备与燃料→中游绿电运营（核心受益，业绩弹性最大）→下游电网消纳与绿电消费场景。运营商是最直接的受益环节，设备与储能联动受益。
