  subject: 提款机时机原则
  topic: 市场是提款机，时机到了才提款，时机不到就搁着
  statement: 股票市场如同提款机：时机到了就去提款，时机不到就让它搁在那里。必须耐心等待市场的骚动，市场不骚动就不能搞。操作含义：不交易是默认状态，出手只发生在市场给出合格机会时；没有机会时强行频繁操作，只会被市场反噬。
  evidence_quote: 对于本ID 来说，这股票市场就如同提款机，时机到了，就去提款，时机不到，就让他搁在那……必须耐心等待他的骚动，他不骚动，是不能搞的。
  interpretation: 空仓等待被定义为主动选择而非错过。与第8课"市场能进入可投资的视界，首先要显示其萌动，否则一边凉快去"是同一条原则的两种表述，构成缠论择时体系的总开关。
