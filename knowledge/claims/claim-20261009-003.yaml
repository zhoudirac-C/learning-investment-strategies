  evidence_quote: 你对于中期逻辑扎实，但短线滞涨的优质优质的标的，对吧？你可以选择卖出短期的交易仓，保留中长期的一个趋势底仓。后续走弱你就继续减仓，后续强行突破，那么你就去把交易仓买回来。……你的底仓只能留给经过深度研究、经过你认真分析后的这种核心。普通的那种跟风票或者是听消息的票，完全没有必要去给他们留底仓。……但是差异必须是事先定好的规则，而不是盘中的情绪临时判断。
