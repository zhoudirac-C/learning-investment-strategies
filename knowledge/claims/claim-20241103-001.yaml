  topic: 做T的第一前提是选对短期趋势向上的股
  timeframe: permanent
  statement: 做T的前提是真正看好该股、且它在短期（1至3个月）内有上涨预期、处于上升趋势，否则没有做T的意义
  evidence_quote: 首先，你选的一只股，你最重点的是什么呢？你要知道它其实是有上涨预期的，而且在短期内是有上涨预期的，你才有做T的意义。短期呢，是在1至3个月。
  interpretation: 做T不是摊低成本的万能手段，趋势向下的股做T只会越套越深。UP以2022年20万系列的某ST股为例：被套五六个跌停板但因判断是上升趋势，不断加仓做T，最终该股赚7万走人、系列做到28万结束。
