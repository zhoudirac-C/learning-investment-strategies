  timeframe: permanent
  statement: 滞涨后的大跌容易引发两种极端判断——认为趋势彻底结束，或认为逻辑没破坏完全不用处理——两者都过于简单：大跌可能只是趋势内正常回调（后续仍可能回补缺口、均线止跌、箱体震荡、再挑战前高），但对高位买入者而言短期赔率已明显恶化。交易处理不需要等到中期逻辑彻底破坏，只要短期预期已经落空就可以减仓轮动或退出；不能用回调后重新走强甚至翻倍来反推高位追入后死扛是低成本策略，因为持仓期间要面对其他板块轮动、资金注意力占用和心理考验，多数人高估自己的耐心。
  evidence_quote: 因此交易处理不需要等到中期逻辑彻底破坏，只要短期预期已经落空就可以减仓轮动或者是退出。
