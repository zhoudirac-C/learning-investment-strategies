  subject: K线形态（流星线）
  topic: 流星线（高档）和倒装铁锤线（低档）：多方力竭 vs 多方首次反击
  statement: 流星线：实体很小，上影线极长（实体2-3倍），下影线极短或无，出现在上涨末端。含义是多方进攻最后尝试宣告失败——推高后遭遇强大卖盘压回收盘，比上吊线更危险，减仓应更多（50%）。化解条件更苛刻：次日必须高开高走且站上流星线最高点。倒装铁锤线：同一形态出现在下跌末端，含义相反——上影线说明多方第一次尝试反攻，虽然被压回但关键在于'多方第一次有了反击能力'，是空方绝对控盘松动的早期信号。上影线越长反击力度越强。需次日高开高走站上最高点确认。核心原则：在上涨末端，长上影线=多方力竭；在下跌末端，长上影线=多方觉醒。位置决定意义。
  evidence_quote: 流星线表达的意思就是说，当这种形态出现在了顶部的时候，意思就叫做多方进攻最后的尝试宣告断了，宣告结束了。它跟上吊线的意思其实是相反的，上调线它是空方进攻的开始，那么流心线它属于是多方进攻的一个衰弱。
  interpretation: 流星线与上吊线都是顶部信号但叙事不同：上吊线=空方开始进攻，流星线=多方已经力竭。流星线比上吊线更危险（减仓50% vs 30%），组合信号'上吊线+流星线=必死无疑'。倒装铁锤线是低位看多变体。
