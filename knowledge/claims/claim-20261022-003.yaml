  subject: 离岸信托补税压力的两个征税环节与「上市越早涨幅越大压力越重」对应关系
  timeframe: permanent
  stance: view
  statement: 离岸信托补税压力的差异核心来自两个征税环节的规则设计：装入环节视同财产转让、按「装入时市值-财产原值」差额征收20%个税；存续环节对信托存续期间产生的所有收益（无论是否实际分配）均需缴20%个税，2025年及以前的历史未分配收益需在窗口期内一次性打包申报补缴。这套规则设计完美对应「上市越早、涨幅越大，压力越重」的特征。
  evidence_quote: '此次补税压力的差异，核心来自两个征税环节的规则设计，完美对应“上市越早、涨幅越大，压力越重”的特征：

    装入环节：居民个人将股权等财产装入离岸信托，视同财产转让，按“装入时市值-财产原值”的差额征收20%个税。政策原则上追缴2023年1月1日之后的装入行为，金额较大的可依法延长追缴年限。

    存续环节：离岸信托存续期间产生的所有收益（无论是否实际分配给受益人），均需缴纳20%个税。2025年及以前的所有历史未分配收益，需在窗口期内一次性打包申报补缴。'
  interpretation: 把「装入差额」与「存续累计收益」两个计税基数拆开，才能解释为什么同类架构下不同标的的压力差异巨大：基数是历史累积的市值差与未分配利润，不是当期业绩。这是把政策条款转译为可比较指标的关键一步。
