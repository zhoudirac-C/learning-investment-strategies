  subject: 缺口的力度分类
  topic: 按是否回补把缺口分为强势平势弱势，衰竭性缺口至少制造大一级别的调整
  statement: 缺口是在该单位K线图上两相邻K线间出现没有成交的区间；缺口的回补是缺口区间最终全部再次出现成交的过程，可能在下一K线就出现，也可能永远不再出现。根据缺口是否回补构成对走势行情力度的分类：一、不回补，显然是强势的；二、回补后继续新高或新低，这是平势的；三、回补后不能新高、新低因而出现原来走势的转折，这是弱势的。一般来说，突破性缺口极少回补；中继性缺口回补的几率对半，但都一定继续新高或新低；衰竭性缺口回补后不再新高、新低，一旦出现至少出现较大级别的调整，该级别至少大于缺口时所延续趋势的级别，一个日线级别趋势的衰竭性缺口至少制造一个周线级别的调整。在盘整走势中的缺口属于普通缺口，一般都回补，没有太大分析意义。
  evidence_quote: 何谓缺口，就是在该单位K 线图上两相邻的K 线间出现没有成交的区间……根据缺口的是否回补，就构成了对走势行情力度的一个分类。一、不回补，这显然是强势的；二、回补后继续新高或新低，这是平势的；三、回补后不能新高、新低，因而出现原来走势的转折，这是弱势的。……而一旦缺口回补后不再新高、新低，那么就意味着原来的趋势发生逆转，这是衰竭性缺口的特征，一旦出现这种情况，就一定至少出现较大级别的调整，这级别至少大于缺口时所延续的趋势的级别。也就是说，一个日线级别趋势的衰竭性缺口，至少制造一个周线级别的调整。
  interpretation: 注意这里的级别指缠论走势类型级别，与缺口所在的K线图周期无关；日K线图有缺口，日线以下任何周期图都相应有缺口，而回补日线缺口不一定能回补小周期图上的缺口。1994年7月上证指数339-377缺口是作者亲历的历史案例，长期未回补，仅作分类示例。
