  claim_type: technical-knowledge
  subject: 组合K线相对单根K线的信息优势
  timeframe: permanent
  statement: 单根K线记录的是一天的市场行为，组合K线记录的是多日的市场行为；单根像照片只给某个瞬间的状态，组合像视频给出状态如何变化。因为市场永远在变，所以「变化」的信号比「状态」的信号更有信息量、更有价值。
  evidence_quote: 单根K线它记录的是一天的市场行为，而组合K线它记录的是多日的市场行为。……就好比说单根K线它是一张照片，而组合K线它就像更像是一段视频。那么一个照片告诉你的是当天或者是某个瞬间的状态，而一段视频它告诉你的是这个状态在如何的变化。那么这个变化它对于状态来讲就更有信息量。
  interpretation: 这是整门课的方法论前提：从单根走向两根、三根，不是叠加信息量，而是从「状态判断」升级为「变化判断」。所以判断两根组合时不能把两根K线简单相加（长红+长黑可以回到原点），要看特定的形态对比关系。
