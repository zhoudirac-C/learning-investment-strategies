  subject: 市场维护非维护所有股票价格
  timeframe: permanent
  statement: 维护市场稳定不等于维护所有股票的价格，更不等于垃圾股不能跌。真正需要维护的是资本市场的正常融资功能、交易秩序和投资者信心；真正值得资金拥抱的是具备产业趋势、真实业绩、核心竞争力和长期价值的优质资产。
  evidence_quote: 这里需要正确理解：维护市场稳定，不等于维护所有股票的价格，更不等于垃圾股不能跌。真正需要维护的，是资本市场的正常融资功能、交易秩序和投资者信心；真正值得资金拥抱的，是具备产业趋势、真实业绩、核心竞争力和长期价值的优质资产。
  interpretation: UP阐述了一个方法论原则：市场维稳≠托市，资金应聚焦优质资产而非期待全面救市。这是投资理念层面的框架性观点，具有永久有效性。
