  subject: 收入低解释不了中国消费率低的结构论证
  timeframe: permanent
  statement: 消费率拆解：居民消费占GDP比重=居民可支配收入占GDP×收入中花掉的比例；2025年农村人均可支配收入24456元、人均消费20259元（花掉82.8%），收入最高的北京人均可支配收入89090元、消费50667元（56.9%），上海收入91987元、消费54765元（59.5%）——收入最低的农村居民消费比例最高，收入最高的京沪比例最低；储蓄主体集中在56-64岁年龄段，收入最高10%家庭持有近一半家庭总资产；若收入分配不变，中国越富消费率反而可能越低。
  evidence_quote: 农村人均可支配收入在2025年是24456元，人均消费是20259元，花掉了约82.8%。……是89090元，是农村居民人均可支配收入的三到四倍。那么人均消费呢，是50667元，花掉了56.9%。上海的人均可支配收入是91987元，人均消费是54765元，花掉了59.5%。……收入低，它只能解释人均消费金额为什么低，但是解释不了居民消费占GDP的比例为什么低。收入越高的群体的储蓄倾向越高，意味着如果收入分配不变，中国会变得越来越富，但是消费率反而可能会越来越低。
  interpretation: 反驳'收入低所以消费低'的常见论点：消费率低是收入分配与储蓄倾向问题而非发展水平问题，再平衡必须动分配结构。
