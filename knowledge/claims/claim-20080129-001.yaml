  extracted_at: '2026-07-18'
  subject: 买卖点原则的修炼层次
  topic: 一般程度必须严格按买卖点操作，纯熟之后才谈得上偏移
  statement: 具体操作上，在一般程度上必须遵守买卖点的原则去买卖；只有达到自由于格律、得心应手的境界后，才可能根据需要在买卖点偏移一点的地方买卖，以成交更多数量或达到更大目的。如同写格律诗：开始必须严格按格律，没按格律是水平问题而非在写拗体，以拗体自我安慰将永远与真正的格律诗无缘；纯熟之后自设声律构成奇响，才是出神入化的过程。
  evidence_quote: 具体说，就是在一般程度上，你必须遵守买卖点的原则去买卖。但是，这并不是一定的。例如，本ID 就经常愿意在买卖点偏移一点的地方去买卖，为什么？因为那样，可以买卖到更多的数量，或者可以制造出一些特别的东西达到更大的目的……你开始的时候，必须严格按格律来，如果没有按格律来，那是你的水平问题，你千万别以自己是写拗体来自我安慰，那将害了你
  interpretation: 给出原则与灵活的关系次序：偏移是游刃有余之后的特权，不是初学者的借口。对绝大多数学习者，这一条应读作严格遵守买卖点纪律的要求，而非偏离规则的许可。
