- pattern_id: gator-ch18-trading-system-3-investors
  school: gator
  name: 交易体系：目标定体系 + 三种投资人
  chapter: 18
  description: 鳄鱼派（gator school）第18章：交易体系：目标定体系 + 三种投资人。 交易体系 = **认知 + 规律 + 技术**；九个字：买什么、怎么买、怎么卖。 IF 双开（投资+投机） THEN 资金比 7:3，分两个账户（与"7:2 底仓/波段"是两回事） IF 稳定盈利之前 THEN 投机资金 ≤ 总资金 30%；稳定盈利后 ≤ 60% **① 风险投资人（做 0→1）**：AI应用/商业航天/低空经济等未跑通商业化的领域。把自己当风投：十笔亏七八笔，成了就是三五倍起步；**不跨一个量级绝不走**（一两百亿看四五百亿、四五百亿看千亿）。选股三看：管理团队/技术/赛道， 涉及：18.1 体系九字与三档目标；18.2 三种投资人 = 成长股三种参与姿势（20260517）；18.3 十年演化与"变与不变"（20250923，人格建模关键）。 用于鳄鱼派资金生态位与规则体系的判断。
  trigger:
  - IF 双开（投资+投机） THEN 资金比 7:3，分两个账户（与"7:2 底仓/波段"是两回事）
  - IF 稳定盈利之前 THEN 投机资金 ≤ 总资金 30%；稳定盈利后 ≤ 60%
  - IF 找爆发力强的成长股 THEN 市值不能太大（"万亿的再翻几倍，全球有几个英伟达？"）
  - IF 做高股息 THEN 唯一出局条件=连续多年分红力度下滑；偶尔一年不分红不算
