  subject: 震荡中轴监视器
  topic: 中枢区间中点为震荡中轴Z，各次级震荡区间中点Zn在Z上偏强在Z下偏弱
  statement: 中枢震荡最终一定以某级别的第三类买卖点结束，如何监控这震荡逐步走强还是走弱是有操作价值的问题。一个中枢确立后，中枢区间的一半位置称为震荡中轴Z，每一个次级震荡区间的一半位置依次用Zn表示，最标准的状态是Zn刚好就是Z，但很特殊。Zn在Z之上，证明这个震荡是偏强的，反之偏弱。震荡的中枢区间是[A，B]，A、Z、B三条直线刚好等距，Zn的波动连成曲线，构成一个监视中枢震荡的技术指标。Zn的数量不会超过9个数据，超过了次级别就要升级了。
  evidence_quote: 一个中枢确立后，中枢区间的一半位置，称为震荡中轴Z。而每一个次级震荡区间的一半位置，依次用Zn 表示……显然，Zn 在Z 之上，证明这个震荡是偏强的，反之偏弱。震荡的中枢区间是[A，B]，那么，A、Z、B 这三条直线刚好是等距的，Zn 的波动连成曲线，构成一个监视中枢震荡的技术指标。
  interpretation: 这是中枢震荡的量化监视工具：用中点位置把强弱感觉变成可比较的读数。Zn的变动相对平滑，因此可以大致预计其下一个区间，当下震荡的低点或高点可据此大致算出下一个震荡的高低点。
