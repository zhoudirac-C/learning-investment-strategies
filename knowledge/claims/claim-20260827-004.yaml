  subject: 每天一成加仓当前三四成合理
  timeframe: short-term
  statement: 从周一的视频开始每天一成一成加仓，按照七月底抄底的节奏来做；从位置上讲周一已经差不多了，再跌一下更好，会出现日线级别的大周期；从上周三开始调整的6-8个交易日已经符合，因此现在仓位3-4成是合理的；如果还没建仓，今天观察上证指数能否尾盘站稳3932，站稳则明天开始加仓3成左右；目前还不具备满仓条件。
  evidence_quote: 其次就是仓位问题，从周一的视频开始，我让大家每天一成一成的加仓，还是按照七月底抄底的节奏来做，因为从位置上来讲，周一已经差不多了，再跌一下更好，会出现日线级别的大周期，但因为距离调整时间和调整周期都很近，从上周三开始调整的6-8个交易日也已经符合，因此现在的仓位3-4成是合理的，如果你还没有建仓，那么今天观察上证指数能否尾盘站稳3932，如果站稳，明天开始加仓，依旧是3成左右。目前还不不具备满仓的条件。
  interpretation: 加仓节奏量化：每天一成、当前位置 3-4 成、站稳 3932 后未建仓者加至 3 成——节奏锚定调整周期计数（6-8 交易日）与关键点位双重验证，与「仓位不该是感觉，应该是从纠错点位倒推出来的结果」一致。
