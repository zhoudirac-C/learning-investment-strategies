  timeframe: intraday
  statement: 隔夜外围企稳，昨日A股以反核和普涨收场情绪明显释放。今天的核心变量不在指数本身，而在分歧的力度。在趋势突破确认之前，这里只应是试错仓位的博弈，不是加仓的位置。两种浪型划分（日线4浪vs周线5浪）都指向同一个买点：趋势突破。
  evidence_quote: 隔夜外围企稳，昨日A股以反核和普涨收场，情绪明显释放。今天的核心变量不在指数本身，而在分歧的力度。在趋势突破确认之前，这里只应是试错仓位的博弈，不是加仓的位置。昨天的这根反弹，目前可以有两种浪型划分方式：其一，是日线级别的4浪反弹；其二，是周线级别的五浪上涨。但是，不管最终是哪一种划分，这个位置都只存在「趋势突破」这一个买点。
  interpretation: UP定调7/22的核心矛盾不是方向（科技反弹已确认），而是分歧力度——即今天科技股是延续强势还是冲高回落。浪型归属（日线4浪vs周线5浪）不影响当前操作纪律：只存在趋势突破这一个买点。未突破前维持试错仓位，不加仓。
