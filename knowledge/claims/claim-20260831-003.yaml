  statement: 8月31日《后西游记》正式定档，作为国内首部上星播出的AI长剧，由Seedance 2.0、Seedance2.5提供AI技术支持，采用AIGC完成画面与人物演绎、无真人演员参与，并采用边制作边审核边播出创新模式，为广电21条发布后首部边审边播剧集，标志AI内容从技术展示进入主流内容产业。
