  subject: 止跌的两条量价路径与信号可靠性标准
  timeframe: permanent
  statement: 观察止跌有两条量价路径：一是低位继续缩量但指数和领跌核心不再创新低、卖盘减少后价格横住；二是成交主动放大、指数逐步收复本周阴线失地。盘中拉起只是初步信号，收盘能否保住修复、次日是否延续，才决定信号的可靠程度。
  evidence_quote: 观察止跌有两条量价路径：一条是在低位继续缩量，但指数和领跌核心不再创新低，卖盘减少后价格能够横住；另一条是成交主动放大，指数逐步收复本周阴线所对应的失地。……盘中拉起只是初步信号，收盘能否保住修复、次日是否延续，才决定信号的可靠程度。
  interpretation: UP的止跌识别方法论：止跌路径分「缩量横住」与「放量收复」两类，且信号确认以收盘价和次日延续性为准，不用盘中脉冲代替确认。可复用于任何调整末期的量价判断。
