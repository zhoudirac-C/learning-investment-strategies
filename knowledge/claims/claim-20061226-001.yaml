- id: claim-20061226-001-b
  source_path: sources/chanlun/lesson_018.md
  source_date: '2006-12-26'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 走势类型的延伸
  topic: 趋势延伸是同向中枢不断产生，判别延伸是否结束看是否产生新的中枢
  statement: 走势类型延伸的实质：对于趋势，延伸就在于同级别的同向缠中说禅走势中枢不断产生；对于盘整，延伸就在于不能产生新的缠中说禅走势中枢。盘整在三个重叠的连续次级别走势类型后随时结束都是完美的，但也可以不断延伸下去；趋势形成两个依次同向的中枢后随时可以结束而完美，也可以不断延伸形成更多中枢。走势类型延伸是否结束的判断关键就在于是否产生新的缠中说禅走势中枢；趋势与盘整的判别关键也在于是否产生新的中枢。很多人抓不住牛股、经常在第一个中枢时被震下马，最主要就是对此没有明确认识；逃顶抄底难归根结底就是走势类型的延伸闹的。
  evidence_quote: 对于趋势来说，其“延伸”就在于同级别的同向“缠中说禅走势中枢”不断产生；而对于盘整来说，其“延伸”就在于不能产生新的“缠中说禅走势中枢”……“走势类型延伸”是否结束的判断关键就在于是否产生新的“缠中说禅走势中枢”。
  interpretation: 延伸概念解释了为什么满足完成条件的走势可以不结束：完美是充分的而非即时的。操作含义直接：持股中不见新中枢反向产生就不必下马，这是对治过早落袋与盲目抄底同一根源的理论解释。
