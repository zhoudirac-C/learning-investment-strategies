  subject: 判断产能过剩的四个指标
  timeframe: permanent
  statement: 判断行业产能过剩须同看四件事：产能有没有持续扩张、价格有没有下降、产能利用率有没有偏低、企业利润有没有被持续压缩；四者同时出现才可说供给增长快于有效需求。当前数据：2026Q2全国规模以上工业产能利用率73%、制造业73.5%（六年来最低），汽车70.8%、电气机械70.3%、化工69.4%偏低，通用设备80.1%、计算机通信电子78.7%偏高；2024年光伏出口数量+82.8%但金额-16%（量增价跌典型案例）；2026年6月PPI同比+4.1%、7月+3.5%，但部分是输入型因素，PPI转正不意味下游制造业结束价格竞争。
  evidence_quote: 所以，对于所谓的产能过剩，我们至少要看四个东西：你产能有没有持续扩张，价格有没有下降，产能利用率有没有偏低，企业利润有没有被持续压缩。如果这四件事情同时出现，那么我们可以说这个行业的供给增长正快于有效需求。
  interpretation: 可操作的过剩判定框架，避免用单一PPI或出口数据下结论；上游输入型涨价与下游内卷可以并存。
