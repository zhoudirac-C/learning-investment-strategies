  subject: 光博会前光模块位置谨慎
  timeframe: short-term
  statement: 光博会召开前高盛等外资对光模块吹票力度过大，当前位置应保持谨慎，防利好落地变利空；大会虽有催化但不一定板块齐涨，判断依据主要是近期位置和涨跌幅。
  evidence_quote: 光博会明天就开了，这次高盛吹的太厉害了，这种位置还是谨慎一些，小心利好落地变利空，当然大会肯定会有一些催化，但是不一定会一起涨。主要还是近期的位置和涨跌幅。
  interpretation: 事件驱动风控观点：当卖方一致预期极强（高盛集中吹票）且板块已处高位时，产业大会这类明牌催化更可能走出'预期兑现即回落'。两层含义：①节奏层明确光模块当前位置不追不加；②方法论层给出事件催化的处理判据——看位置和涨跌幅，不看事件本身强度。与9/9盘前'不急于做T、持股观察'一脉相承。
