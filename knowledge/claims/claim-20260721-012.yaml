  statement: 7月20日至少30家上市公司宣布拟回购或增持，单日累计超100亿元。中煤能源(601898)、中国中车(601766)、中国铝业(601600)等央企相继披露增持计划。历史经验看回购后标的多有显著超额，若后续市场超预期下行稳市措施有望对标去年4月力度。与其博弹性，不如把它当作情绪地板的参照。
