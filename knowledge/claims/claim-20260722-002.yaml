  subject: 超节点主升后必有分歧-二次入场节点在大盘二次回踩时
  timeframe: short-term
  statement: 超节点走完主升之后必有分歧，第二个安全入场节点大概率是超节点分歧、大盘二次回踩的时候。今天下午的回落还不构成那个节点，更像是主升途中的量能消化。在分歧真正出现之前，这里只有接力模式，认准最核心的品种，不做扩散。
  evidence_quote: 配合上午的判断，节奏没有变：超节点走完主升之后必有分歧，第二个安全入场节点大概率是超节点分歧、大盘二次回踩的时候。今天下午的回落还不构成那个节点，更像是主升途中的量能消化。在分歧真正出现之前，这里只有接力模式，认准最核心的品种，不做扩散。
  interpretation: UP给出了超节点方向的入场节奏判断：当前处于主升途中（7/22回落是量能消化而非真正分歧），第二个安全入场节点要等超节点出现真正分歧+大盘二次回踩同时出现。在此之前只有接力模式（只做最核心品种紫光股份(000938)），不扩散不补涨。这是对"等分歧再买"方法论的具象化。
