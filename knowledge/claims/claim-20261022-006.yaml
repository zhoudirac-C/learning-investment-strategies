  subject: 信龙哥或空仓二选一不割又传恐慌者销户
  timeframe: trend
  statement: 要嘛继续信龙哥护得住，要嘛一开始就不信、空仓看戏——空仓没任何毛病，有些选手就是只做右侧的；但现在又不割、又天天四处传播恐慌的人，那还是销户吧。
  evidence_quote: 要嘛继续信龙哥护得住，要嘛一开始就不信，空仓看戏。空仓没任何毛病，有些选手就是只做右侧的。但现在，又不割，又天天四处传播恐慌的人，那还是销户吧。跟我们924之前抄底一样，那会儿评论区也是天天一堆冷嘲热讽的。
  interpretation: 鳄鱼派「二选一纪律」的强化版：空仓是合法策略（右侧选手），持仓信护盘也是合法策略，唯一不合法的是「持仓+传播恐慌」的矛盾态——既承担风险又自我强化负面情绪。924 抄底时的冷嘲热讽者两年没赚钱是历史佐证。销户论第二次出现（10-20 首次）。
