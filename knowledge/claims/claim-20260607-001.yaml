  topic: 科技股调整节奏：等非理性下跌+长黑线=低档长黑
  statement: 当前科技股处于高档长红开始做空，一路向下跌到黄金坑位置。等行情调整到出现非理性下跌（连续大阴线加速、跌幅远超平常值）+出现长黑线时，就是低档长黑——届时是做多信号。挖得越深，后面反弹越大。
  evidence_quote: 你现在属于是高档的长红开始做空，那么一路向下跌，跌到一个黄金坑的位置，如果再已经经历过后面经历过一段时间下跌再出现一根长黑线，那么我们就可以把它判定为是一个低档长线，这就是我们到时候做多的地方...科技股行情没有结束...你挖的越深，后面反弹的越大。
  interpretation: UP 给出了完整的操作剧本：当前阶段（高档长红做空）→等待阶段（继续下跌）→买入信号（低档长黑出现）。这是一个从技术分析框架延伸到实战操作的方法论应用。低档长黑的核心特征是：已跌了很长时间+突然加速非理性下跌+出现长黑线。
