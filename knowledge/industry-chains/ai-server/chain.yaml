  - 热泵配套
  value_share: ~15%
  barrier: 液冷渗透率
  trend: 加速
- id: seg-dc
  name: 下游应用
  materials:
  - AI数据中心
  value_share: ~10%
  barrier: CSP资本开支
  trend: 高增长
