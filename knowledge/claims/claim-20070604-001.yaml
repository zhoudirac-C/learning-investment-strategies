  subject: 线段的基本构成规则
  topic: 线段除非缺口必须由至少三折组成，相邻上下不重合则可一直延伸仍是一个线段
  statement: 一个线段除非是缺口，否则必须由至少上-下-上或下-上-下的三折组成；只要互相相邻的上或下不重合，这个模式可以一直延伸下去而依然还是一个线段。一段下-上-下-上-下的走势中如果没有任何重合，即第二个上的终点没有触及第一个上的起点，这种图形和直接的一个下没有任何区别，只是一个线段。
  evidence_quote: 而一个线段，除非是缺口，否则必须由至少上-下-上或下-上-下的三折组成，只要互相相邻的上或下不重合，则这个模式可以一直延伸下去而依然还是一个线段……因为这段中的下-上-下-上-下中，没有任何的重合，也就是第二个上的终点没有触及第一个上的起点，这种图形，和直接的一个下没有任何区别。
  interpretation: 这是线段判定的形态学标准：线段由次级别三折及其重叠关系定义，延伸与否看相邻折之间的重合而非幅度，与第59课前后相邻线段不同向的规则配套使用。
