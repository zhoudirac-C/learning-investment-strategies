- pattern_id: gator-ch23-liquidity-fund-behavior
  school: gator
  name: 流动性底层逻辑与资金行为
  chapter: 23
  description: 鳄鱼派（gator school）第23章：流动性底层逻辑与资金行为。 上涨需要增量资金，且价格越高需要的钱越多；断了就"游戏暂停或结束" 下跌不需要增量资金——只需原来的人不玩（多杀多→流动性枯竭型下跌） 流动性枯竭型下跌：一点成交量砸出大坑（冷门股 9000 元成交=跌 10%=市值蒸发 50 亿）； 砸盘者=割肉的家人、赎回的基民、被动砍仓的机构，不是大股东 涉及：23.1 流动性第一性原理；23.2 杠杆资金与融资余额（20250710/20260415）；23.3 撤退路径与 ETF 视角（20260715/20260524）。 用于鳄鱼派资金生态位与规则体系的判断。
  trigger:
  - IF 高位放量滞涨 THEN 卖出的=大股东在源源不断出货
  - IF 寻找流动性重构受益方向 THEN 找"类似证券"的行业：估值低+业绩增长确定性
  - IF 融资余额持续增加 THEN 融资客偏买方，强势市场
  - IF 回调 AND 融资余额同步持续减少 THEN 往往有不小的下跌
  - IF 融资余额连续 3–4 天减少 THEN 提高警惕：大资金可能在撤离
  - IF 两融余额增长越来越陡峭 THEN 会引来"巴掌"强行降温
  steps:
  - 23.1 流动性第一性原理
  - 23.2 杠杆资金与融资余额（20250710/20260415）
  - 23.3 撤退路径与 ETF 视角（20260715/20260524）
