  subject: 这波AI高波动但不至于新能源式A杀
  timeframe: trend
  statement: AI浪潮有高波动性，但不至于到新能源那种A杀程度：新能源当年业绩见顶后立刻反转，很多中上游股票几乎完成A杀（除有品牌溢价的龙头如宁德时代(300750)、比亚迪(002594)跌回原位）；AI沉淀下来的除了当年赚到的钱，还有未来可能赚到更多钱的场景价值。科技股不会像15年那样完全A杀回去，因为需求的上限没有见到——不像新能源渗透率已很难提升（老登思维固化不买，增量只能等新人新陈代谢和海外市场，而海外增量是加法关系不是乘法关系）。
