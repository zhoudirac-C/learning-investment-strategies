  subject: 底部的走势类型定义
  topic: 一买出现到第三类买卖点前是底部构造过程，三买确立三卖证伪
  statement: 底部都是分级别的。站在精确走势类型的角度，第一类买点出现后，一直到该买点所引发的中枢第一次走出第三类买卖点前，都可以看成底部构造的过程；如果是第三类卖点先出现，就意味着这底部构造失败了，反之第三类买点意味着底部构造的最终完成并展开新的行情。顶部的情况反过来定义就是。
  evidence_quote: 底部都是分级别的，如果站在精确走势类型的角度，那么第一类买点出现后一知道该买点所引发的中枢第一次走出第三类买卖点前，都可以看成底部构造的过程。只不过如果是第三类卖点先出现，就意味着这底部构造失败了，反之，第三类买点意味着底部构造的最终完成并展开新的行情。
  interpretation: 底部不是一个点而是一个有明确起止的构造过程，一买到三类买卖点之间都是构造期，这澄清了抄底概念的时间结构。与第107课上升趋势的精确定义衔接：第三类买点既是底部完成信号，也是趋势形成信号。
