market_framework:
  current_stage: 放量信号待验证 — 周五全市场放量至3万亿+，大概率增量资金入场。核心验证看周一：量能维持3万亿+非单日脉冲→结构性转向全面行情；回落2.5万亿以下→推翻。全A中阳线仍是唯一确认信号，但周五量价结构比前几日积极。科技走弱与超跌走强不是跷跷板，独立评估。
  core_question: 周一量能能否维持3万亿上方？这是全面行情预期的唯一硬验证。同时看科技修复是否在放量中完成、地缘跳空是否影响开盘。雅克科技持有不动（成本129.68，止损123.2），总仓位1.4%。
  up_quote: 「周五放量至3万亿上方，大概率由增量资金带来。关键看周一能否持续——放量持续则结构性→全面行情；缩量至2.5万亿以下则推翻。科技与超跌方向各自独立评估，非跷跷板。周一三看：量能>科技修复>地缘跳空。」
  key_assumptions:
  - 周五放量3万亿+是积极信号，但持续性待周一验证——验证成功=结构性转全面行情，失败=情绪宣泄
  - 调整不到位就抢筹模式识别：午后提前修复+次日高开分化=伤害最大，遇此形态观望
  - 科技与超跌方向不是跷跷板—独立评估各自节奏
  - 大金融A+H是转向全面行情的抬轿力量（观察而非参与）
  - 焦炭连续提涨为确定性右侧涨价信号（潞安环能/晋控煤业关注）
  - Anthropic出口管制强化国产算力逻辑（可埋伏方向，非追涨）
  - 长鑫295亿IPO为显著流动性抽水事件
  invalidation_conditions:
  - 周一量能快速回落至2.5万亿以下→推翻全面行情预期
  - 全A指数继续破位且30分钟不能收回→筑底失败→全部降仓至1成以下
  - 外围（美股AI capex叙事）系统性崩坏→涨价逻辑证伪
  - 6/17 FOMC点阵图降息预期归零+油价持续上行→提高对冲仓比例
  - 雅克科技跌破123.2止损
  direction_priority:
  - direction: 资源涨价（焦炭/钼/铜）
    intensity: 强
  - direction: 科技上游材料（覆铜板/球硅/前驱体）
    intensity: 中
  - direction: 国产替代（半导体设备/材料）
    intensity: 中
  - direction: 大金融A+H（抬轿观察，非参与）
    intensity: 观察
sector_rotation_rules:
- id: price_increase_vs_low_recovery
  name: 涨价线 vs 低位修复轮动
  description: 涨价方向（电子特气/覆铜板材料/钨）和低位修复方向（光伏/医药/证券）之间的轮动
  offensive_groups:
  - pricing_power
  defensive_groups:
  - low_recovery
  min_spread_pct: 2.0
  min_red_ratio_spread: 15
  require_offensive_positive: true
  signal:
    pricing_leading: 涨价方向领涨→弱市涨价逻辑被强化→侧重涨价仓
    recovery_leading: 低位修复领涨→市场风险偏好回暖→适当扩大低位修复仓
- id: hedge_rotation
  name: 情景A/B对冲轮动
  description: 根据CPI/油价/美联储预期变化，在进攻仓和对冲仓之间调整
  scenario_a_stocks:
  - 雅克科技
  - 隆基绿能
  scenario_b_stocks:
  - 昊华科技
  - 中钨高新
  trigger:
    scenario_a: 核心CPI软+油价回落+降息预期→进攻仓（AI硬件+硅片）
    scenario_b: 油价升级+地缘恶化+加息预期→对冲仓（涨价材料+能源地缘）
index_rules:
- trend_defense: 3950
  name: 上证趋势防线
  description: UP自高点调整300点后月线支撑区。若收盘跌破→筑底失败信号。
  trigger_condition: close_below
- valid_close_level: 4033
  name: 上证生命线（已降级）
  description: UP 6/3引入4033清仓线，6/9已下调至4000并转"观望不杀跌"。4033仅作为历史参考保留，不作为当前操作锚。
  deprecated: true
  replaced_by: 地量信号+情景A/B框架（缩量修复/放量防守）
- weak_close_level: 4000
  name: 上证心理关口
  description: 4000点心理关口。缩量站回4000不算有效修复，需放量+科技高低切确认。
- close_between:
  - 3900
  - 4000
  name: 上证当前运行区间（已替代4033上限）
  description: 6/11收盘3962，实际运行在3900-4000区间。区间下限对应月线支撑3950，上限对应4000心理关口。
position_rules:
- id: right_side_entry
  name: 右侧进场量价确认
  description: 建仓动作只在全A中阳线企稳后展开。当前轻仓持有（2.8%），不追高、不加仓、紧守止损。加仓窗口需要全A放量中阳线+量价确认同时满足。
  condition: index_yang_line AND volume_confirm AND leader_sector_active
  max_position_first_buy: 1成
- id: yakou_stop_loss
  name: 雅克科技止损明细
  description: 6/12高开低走（开140→收133，最高144.5→最低131.81），振幅9.54%，成交量91万手为近期天量。多空分歧巨大，但成本129.68保护线未破。
  apply_to:
  - 雅克科技(002409)
  risk_levels:
    level_1_warning:
      description: 跌破125（MA10附近）→减半仓位
      price: 125.0
      action: 减至50股
    level_2_hard_stop:
      description: 跌破123.2（止损线）→无条件清仓
      price: 123.2
      action: 清仓
    level_3_atomic:
      description: 全A继续破位+雅克跌破130→防御模式
      price: 130.0
      action: 不补仓，只减不增
  monitor_points:
  - 周一开盘方向：低开但守住130→卖压释放完毕，持有；低开破131.81→分歧持续
  - 全A中阳线出现前不扩大仓位
  - ⚠️ 注意：周五放量3万亿+若周一不能持续，雅克科技持有不动，不加仓
  - ⚠️ 注意：长鑫295亿IPO抽水压力可能影响整体流动性，紧缩时雅克止损收窄至123.2
- id: pricing_power_intersection
  name: 涨价+低位交集策略
  description: 只买低位+涨价交集（六氟化钨/球硅/前驱体）。涨价已扩散至高潮，补涨看设备/封测。纯低位修复只用ETF；纯高位涨价只做右侧轻仓止损。
  eligible_directions:
  - 覆铜板上游材料（雅克科技/中化国际）
  - 电子特气二线（昊华科技）
  - 钨产业链（中钨高新）
  max_single_position: 1.5成
  max_theme_position: 3成
  hard_stop: 买入价下方5%
- id: rebound_reduce
  name: 反弹减仓纪律
  description: 存储/CPU/科创50/锂矿/煤炭反弹即减仓。不做T、不加仓、不补仓。
  apply_to:
  - 存储
  - CPU
  - 科创50
  - 锂矿电池
  - 煤炭
  - 稀土
  - 石油
  - 黄金
  - 房地产
  action: 反弹至关键均线（60日线/20日线）即撤
- id: defense_day_rule
  name: 防守纪律
  description: 全A中阳线出现前，市场处于等待确认阶段。持有不追、不加仓、紧守止损。仅在全A放量中阳线后再评估扩大仓位。
  triggers:
  - 全A成交缩量+银行保险领涨→防守日确认
  - 涨停<60家或二连板<15家→弱修复
  action_bias: 只观察、不买入
- id: semiconductor_range_trade
  name: 半导体降级为区间交易
  description: 6/11 早盘明确：半导体应由「持股待涨」转向「区间交易」。不追涨、不做突破策略，以区间内做T为主。
  apply_to:
  - MLCC
  - 被动元件
  source_claim: claim-20260611-001-e
- id: defense_sector_crowding
  name: 防御方向拥挤警示
  description: 红利/银行/电力是过渡板块非进攻主线。连涨后警惕拥挤——不做追涨，不做加仓。若防御板块持续领涨→市场仍在避险模式，非进攻信号。
  source_claim: claim-20260611-001-e
intraday_schedule:
- window: 09:15-09:30
  name: 集合竞价
  action_bias: 只观察，不参与极端跳空
  rules:
  - 【周一特殊】地缘跳空窗口——霍尔木兹协议周末信息撕裂，原油可能跳空开
  - 开盘前15分钟不参与极端跳空，让给算法
  - 观察持仓标的（雅克科技）竞价强度
  - 全A开盘方向+量能预估
- window: 09:30-10:00
  name: 开盘确认
  action_bias: 只观察，等9:30后连续K线确认趋势
  rules:
  - 【周一核心】第一大量能定性——观察10点前成交额同比(周五)趋势
  - 【周一核心】第二看科技修复——放量完成抛压释放=有效vs缩量阴跌=证伪
  - 【周一核心】第三看地缘跳空——等9:30后连续K线确认方向
  - 雅克科技是否跌破止损123.2
  - 焦炭/钼涨价方向是否延续（潞安环能/晋控煤业）
- window: '10:00'
  name: 10点确认（量能第一节点）
  action_bias: 可评估（仅限量能维持3万亿趋势+全A中阳线）
  rules:
  - 10:00量能对比：达到或超周五同期→偏积极；明显缩量→推翻预期
  - 全A是否不创新低+出现放量领涨→可评估
  - 全A继续破位→继续等待
- window: '11:20'
  name: 上午收盘前
  action_bias: 只观察
  rules:
  - 上午量能定性+科技修复进展
  - 持仓止损检查
- window: '13:10'
  name: 午后风险窗口
  action_bias: 午后只看不买
  rules:
  - 【周一特殊】霍尔木兹第三时段——14:00欧洲开市+G7前瞻，特朗普可能扔重磅
  - 油价是否异动影响科技方向
  - 持仓止损复查
- window: '14:00'
  name: 下午量能第二节点
  action_bias: 只看不买
  rules:
  - 量能趋势确认：上午放量延续vs午后缩量
  - 涨价线是否维持
  - 是否有尾盘杀信号
- window: '14:52'
  name: 尾盘条件单
  action_bias: 可尾盘低吸（仅限全A放量中阳线确认日）
  rules:
  - 全日定性为强修复（全A中阳线+放量3万亿+维持）→可评估轻仓介入
  - 弱修复/量能回落/等待确认阶段→不操作
  - 雅克科技止损检查
agent_analysis_schedule:
- id: open_auction
  time: 09:26
  name: 集合竞价后
  focus: 持仓竞价强度、雅克科技涨停次日是否高开低走、全A开盘方向判断情景。
- id: open_confirm
  time: 09:45
  name: 开盘15分钟确认
  focus: 全A方向确认。MLCC板块联动验证。雅克科技止损检查。是否出现全A中阳线信号。
- id: morning_confirm
  time: '10:00'
  name: 10点确认
  focus: 30分钟后今日基调。全A中阳线→可评估；弱修复→持有不动；放量下杀→止损纪律。
- id: opportunity_scan
  time: '10:30'
  name: 30分钟确认
  focus: 全A是否不创新低。涨价线是否维持。持仓止损检查。
- id: noon_review
  time: '11:20'
  name: 上午收盘前
  focus: 上午定性：是否有全A中阳线迹象。持仓方向确认。
- id: afternoon_risk
  time: '13:10'
  name: 午后风险窗口
  focus: 冲高回落信号、板块扩散衰竭信号。持仓止损复查。
- id: mid_afternoon
  time: '14:00'
  name: 午盘监控
  focus: 午后一小时盘面验证。涨价线是否维持、是否有尾盘杀信号。
- id: tail_condition
  time: '14:52'
  name: 尾盘条件单
  focus: 判断是否符合全A中阳线条件。不符合则不做任何操作。
