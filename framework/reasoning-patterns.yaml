  - 半导体设备
  - 国产替代
  - 季报/年报解读
  - 新能源产业链
  - 液冷散热
  - 电子材料
  - 算力基建
  - 锂矿
  - 题材炒作
  data_requirements:
  - name: 财报主表与附注
    channel: financial_reports 表（get_financial_reports，kline_cache.py）/ 财报原文
  - name: 管理层讨论与会计政策
    channel: 财报"管理层讨论与分析"章节 / 会计政策变更说明
  - name: 扣非与同口径经营数据
    channel: 财报（扣非净利润/毛利率同比/同口径收入/分产品收入）
  - name: 行业格局与客户结构
    channel: 研报（行业竞争格局/客户集中度/订单Pipeline）/ 汇率行情
  - name: 估值与机构持仓
    channel: 行情数据（历史毛利率/行业估值中枢）/ 机构持仓披露
  steps:
  - step: 1
    name: 拆解财报异常项
    question: 财报中利润/现金流异常的原因是什么？
    action: 不只看净利润数字，先读公司解释与附注：识别子公司出表、股份支付、汇兑损失、资产减值等一次性因素
    data:
    - 财报主表与附注
    - 管理层讨论与会计政策
  - step: 2
    name: 还原主营趋势
    question: 剔除一次性因素后，主营业务是否真正改善？
    action: 核对扣非净利润、同口径收入、毛利率同比变化；主营改善则异常仅按短期扰动处理
    data:
    - 扣非与同口径经营数据
  - step: 3
    name: 定性风险性质
    question: 该异常是短期扰动还是长期恶化？
    action: 汇兑损失、股份支付等按短期账面波动处理；若行业竞争格局恶化、核心客户流失则判定为长期风险
    data:
    - 行业格局与客户结构
  - step: 4
    name: 判断估值逻辑
    question: 当前股价是否反映了主营改善？市场给的是什么估值？
    action: 比较毛利率新台阶与股价反映程度：若新技术/新业务改变增长曲线而股价尚未反映，判定存在估值重估机会
    data:
    - 扣非与同口径经营数据
    - 估值与机构持仓
  falsification:
  - 扣非口径连续两季恶化（主营改善证伪）
  - 一次性因素反复出现（利润调节嫌疑）
  - 行业格局恶化或核心客户流失被证实
  - 大盘系统性破位下行或宏观政策重大转向
