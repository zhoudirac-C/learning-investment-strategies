      name: 验证新催化正反馈
      question: 新题材能否得到资金认可？
      UP_logic: 苹果测试先进玻璃基板消息催化，沃格光电涨停、相关标的平均涨6.5%：新催化获正反馈，情绪温度高。
      evidence_sources:
      - 沃格光电涨停
      - 玻璃基板板块涨幅
    - step: 6
      name: 综合定性并定应对
      question: 从分歧性质推导操作策略？
      UP_logic: 外围扰动下强韧，主线良性分歧验证趋势资金介入深度，后续聚焦AI算力硬件低吸与新催化。
      evidence_sources:
      - 整体判断原文
    risk_factors:
    - 地缘局势进一步升级，指数从低开回升转为低开低走，则韧性判断失效
    - CPO主线中军放量下跌、低位补涨标的次日无溢价或杀跌，结构完整性被破坏
    - 玻璃基板等新催化方向冲高回落或次日闷杀，说明资金正反馈失效，情绪可能转弱
    confidence_indicators:
