statement: 基民赎回有稳定的时序规律：浮亏 20-30% 或持有 1-3 个月时基本不赎回；浮亏 30-50% 或持有 4-5 个月时基本要赎回——可用"幅度轴+时长轴"双轴估计赎回压力是否接近尾声
evidence_quote: 跌百分之二十三十他不见得赎回。啊，好，三十四十五十了，或者说一个月两个月三个月不见得赎回，四个月五个月哈，基本上要赎回了。
interpretation: 把"恐慌"量化为可跟踪的双轴指标：跌幅维度（30% 与 50% 是两道心理线）和时间维度（4-5 个月是忍耐极限）。隐含推论：本轮从高点调整的时长与幅度一旦进入"双超"区间，被动卖压就接近物理尽头，寻底窗口临近。这是
  004-a 流程定位的定量支撑。
