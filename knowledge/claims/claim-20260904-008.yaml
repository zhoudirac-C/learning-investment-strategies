statement: 旅游、体育、机器人等'事件催化+超跌板块'模型：第一天不成气候且炸板多于封板，看哪个题材先有个股反包，反包比追当天新题材更符合右侧确认纪律。
evidence_quote: 旅游、体育、机器人等概念，依旧是「事件催化＋超跌板块」的模型。由于都是第一天，其实都还不成气候，并且昨天炸板的比封住涨停的还多。今天不妨看看哪个题材先有个股反包，反包反而容易吸引资金关注，这比追当天的新题材更符合右侧确认的纪律。
interpretation: 方法论：超跌事件板块第一天不追，用'次日反包'作为资金认可的确认信号。反包个股比新题材首板更可靠，因为反包意味着有资金愿意在分歧后再次承接。
