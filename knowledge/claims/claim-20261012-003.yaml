  evidence_quote: 这一轮出清周期显著长于过往，根源在保险、年金、固收+等绝对收益资金占比快速抬升--它们年内全面转亏后，被迫卖出成为当下主导力量。
  interpretation: UP对本轮回撤时间长于历史同期的归因：边际定价权转移到绝对收益资金（保险/年金/固收+），这类资金有刚性止损/降仓纪律，年内转亏后被迫卖出形成持续抛压，使受迫盘出清阶段被拉长。含义：出清结束的信号应跟踪这类资金的减仓压力是否释放完毕，而非仅看技术形态。
