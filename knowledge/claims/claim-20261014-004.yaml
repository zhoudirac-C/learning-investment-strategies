  subject: 数据后收益率反应比数据本身更重要
  timeframe: short-term
  statement: 判断美债是否真正转强要看数据公布后收益率的反应方式而非数据好坏：CPI略超预期但10Y/30Y只短暂上升随后回落，说明高收益率对买盘吸引力在增强；CPI符合或低于预期但收益率持续上涨，则需警惕乐观预期已提前反映。10年期与30年期要对照：同步回落=改善一致；10Y回落30Y上涨=长期债券仍有额外压力。
  evidence_quote: 但判断美债是否真正转强，还要看数据公布后，收益率如何反应，而不能只看数据好坏。如果CPI略超预期，10年期和30年期收益率却只短暂上升、随后回落，说明偏热的数据没有推动持续抛售……两种期限的表现也要对照：同步回落，说明改善较为一致；10年期回落、30年期却上涨，则说明长期债券仍有额外压力。
  interpretation: 方法论：价格反应（含预期消化）>数据读数本身；用反应模式反推债市结构。10Y/30Y 期限对照是免费的结构信息。
