    - 政府工作报告
    - 微软/谷歌/OpenAI等企业承诺书
  - step: 2
    name: 识别刚性需求环节
    question: AI算力爆发后哪些环节存在刚性增量需求？
    UP_logic: 寻找AI带来的刚性需求，如电力缺口（150GW）、散热瓶颈（Rubin功耗突破风冷极限）、带宽瓶颈（MicroLED CPO）。
    evidence_sources:
    - 北美燃机交付预测
    - LightCounting出货预测
    - 微软MOSAIC方案
  - step: 3
    name: 叠加政策与供需缺口
    question: 该环节是否有政策催化或供需缺口放大？
    UP_logic: 政策首次写入（算电协同入政府报告）、供给受限（PTA无新增产能、百草枯退出）、海外投资周期（美国750亿美元输电扩建）。
    evidence_sources:
    - 政府工作报告
    - 行业产能数据
    - 海外政策公告
  - step: 4
    name: 筛选国产替代标的
    question: 该环节中国产化率低、技术壁垒高的公司有哪些？
    UP_logic: 寻找国产化率极低（如25G+电芯片国产化率仅7%）、技术领先（东方电气G50燃机效率36.5%）、订单确定（海外订单排至2030年）的标的。
    evidence_sources:
    - 国产化率数据
    - 公司技术参数
    - 订单公告
  risk_factors:
  - AI算力需求不及预期
  - 国产替代进度缓慢
  - 政策落地力度不足
  - 中东地缘政治不确定性
  confidence_indicators:
  - 机构净买入金额大（如东方电气2.17亿）
  - 板块涨停潮（如Micro LED涨停潮）
  - 政策首次写入政府工作报告
  source_raw:
  - sources/raw/财经/复盘：26-03-05：十字星普涨，Micro LED涨停潮，算电协同入报告，燃机千亿赛道.md
- pattern_id: supply_chain_bottleneck_qualify
  name: 供应链瓶颈选股法
  description: 从全球供应链突发事件导致关键材料供给缺口出发，筛选具备国产替代能力且已进入核心客户供应链的标的
  applicable_themes:
  - 半导体材料
  - 化工涨价
  - 资源涨价
  reasoning_chain:
  - step: 1
    name: 识别供给冲击
    question: 当前是否存在因突发事件导致的供给缺口？
    UP_logic: 全球近四成氮气供应受阻，高纯氦气涨价50%+
    evidence_sources:
    - 行业新闻
    - 价格数据
  - step: 2
    name: 确认国产替代能力
    question: 国内是否有企业具备该材料的自主生产能力？
    UP_logic: 半导体自主可控关键材料，多款特气实现进口替代
    evidence_sources:
    - 公司公告
    - 行业研报
  - step: 3
    name: 验证客户壁垒
    question: 该企业是否已进入下游核心客户供应链？
    UP_logic: 打入台积电/海力士供应链
    evidence_sources:
    - 公司公告
    - 供应链调研
  risk_factors:
  - 供给缺口快速修复（如制裁解除或产能恢复）
  - 替代材料出现导致需求转移
  - 公司产能不足无法兑现订单
  confidence_indicators:
  - 涨价幅度持续扩大（如氦气涨价50%+）
  - 下游客户为行业龙头且需求刚性
  - 公司已公告扩产或新签长单
  source_raw:
  - sources/raw/财经/复盘：26-03-16：4050三次长下影强支撑，存储领涨，明日中阳预期，OFC三大MSA.md
- pattern_id: second_leg_entry_qualify
  name: 二次回踩入场点判断
  description: 通过观察指数反弹后的分歧窗口和资金兑现信号，判断二次回踩形成的确定性入场节点
  applicable_themes:
  - 指数择时
  - 主线板块入场时机
  reasoning_chain:
  - step: 1
    name: 识别反弹阶段
    question: 当前市场处于反弹的哪个阶段？
    UP_logic: 连续两日普涨反弹后临近短期关键压力位，资金兑现欲望抬升
    evidence_sources:
    - 沪指走势
    - 成交量变化
  - step: 2
    name: 判断分歧窗口
    question: 分歧窗口何时到来？
    UP_logic: 一轮杀跌后企稳修复周期通常2~3个交易日，已完成两日反弹→临近首次分歧窗口
    evidence_sources:
    - 历史修复周期规律
    - 连板晋级率变化
  - step: 3
    name: 观察资金切换
    question: 是否有资金兑现信号？
    UP_logic: 午后资金防守切换（军工+福建板块）=兑现欲望抬头
    evidence_sources:
    - 板块轮动数据
    - 资金流向
  - step: 4
    name: 确认入场节点
    question: 何时是确定性入场节点？
    UP_logic: 震荡反复、二次回踩夯实支撑仍是大概率事件，调整形成的「第二只脚」=本轮行情优质确定性入场节点
    evidence_sources:
    - 指数支撑位
    - 成交量萎缩信号
  risk_factors:
  - 指数直接突破压力位未回踩，错过主升浪
  - 二次回踩幅度过深破坏趋势
  confidence_indicators:
  - 分歧日成交量明显萎缩
  - 主线板块核心个股抗跌企稳
  source_raw:
  - sources/raw/财经/复盘：26-03-25：沪指重回3900，电力二波主升高潮，华电8连板，等第二只脚入场.md
