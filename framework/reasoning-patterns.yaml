- pattern_id: technical_timing
  name: 技术择时分析框架
  description: 当用户询问大盘或个股的技术位置、买卖点、支撑压力、K线形态、波浪结构、指标信号、止盈止损时使用。典型查询：大盘技术位置、XX股能买吗、什么时候止损、压力位在哪里、波浪结构怎么看。该框架判断技术位置、分析形态结构、确认买卖信号、设置风控，给出具体的技术面操作建议。
  trigger:
  - 指数或个股接近关键支撑/压力位（前高前低、均线、布林轨）
  - 出现顶部/底部钝化、高9等序列信号
  - 单根大阳线/大阴线等关键K线形态出现
  - 持仓标的跌破或突破既定技术位，触发止盈止损评估
  source_raw:
  - sources/raw/财经/周复盘：26-02-01：二月投资策略：安全优先.md
  - sources/raw/财经/复盘：26-05-18：B站视频复盘-大盘将迎来反弹.md
