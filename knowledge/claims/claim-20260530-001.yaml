  subject: 港股核心矛盾是盈利预期而非流动性，高股息有长期资金支撑
  timeframe: trend
  statement: 港股走弱的核心原因是盈利预期下调，打破了"人民币升值港股就涨"的惯性认知。高股息逻辑有险资和南向资金的长期支撑，比单纯抄底估值更可靠
  evidence_quote: "人民币对美元升值约4-5个点，但港股依然偏弱。港股走弱的核心原因是盈利预期下调。港股70%是内资，和中国经济深度绑定。南向资金去年净买入约1.4万亿，险资总资产39万亿年新增约1万亿股票资产，偏好港股高股息。OCI会计规则下股价波动不影响利润，港股高股息长期持有免税。"
  interpretation: 港股的分析框架需要修正：①不能简单用"人民币升值→港股涨"的惯性逻辑；②核心矛盾是盈利预期（恒指在地缘冲突后是全球唯一下调盈利预期的主要指数）；③资金结构决定了高股息的长期配置价值（险资OCI+免税、南向资金越跌越买）；④外资持续流出后港股筹码结构较轻，若中国经济超预期或AI出现风险，向上弹性较大。
