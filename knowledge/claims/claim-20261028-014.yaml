statement: 《影之刃零》10月29日发售，初期媒体评分高于《黑神话：悟空》常被引用的81分，但评分会动态更新、平台和媒体样本会影响比较，初期口碑最终还要看玩家体验与销量兑现；第三方估算的Steam预售约50万份不是官方销量披露，与《黑神话：悟空》约73%的对比存在预售区间及发售前70天节点的口径差异，暂不据此做确定性销量推演；内容供给增加值得关注，商业化强度仍需发售后检验。
