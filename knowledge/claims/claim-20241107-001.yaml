  claim_type: methodology
  subject: 轮动行情选股法
  topic: 轮动行情卖强买弱，单边持续则轮动结束
  timeframe: permanent
  statement: 轮动行情中先观察哪些板块在交替上涨并加自选、观察板块中个股强弱；当板块A上涨时卖出其底仓，用这笔钱买入正在回调中的板块B，赚钱概率较高；若出现一个一直涨、另一个一直跌，则代表轮动结束
  evidence_quote: 在轮动行情中，我们通过先观察，观察主要是哪些板块在涨，在交替地涨，我们就把这些板块加自选，观察一下板块中个股的强弱。……一旦证券行情上涨的时候呢，我们就选择把证券行情的底仓卖出，卖出来的钱呢，买入正在回调中的人工智能板块。……那轮动行情有可能它一直涨上去，另外一只一直跌下去呢？那就代表轮动结束嘛。
  interpretation: 轮动的本质是资金在几个板块间来回，操作节奏是「卖强买弱」而非追涨。同时给出轮动模式的失效信号（一边持续单边），有明确的退出判据。
  confidence: high
