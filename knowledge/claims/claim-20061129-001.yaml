  subject: 湿吻与行情转折
  topic: 行情转折很大几率由湿吻引发，长期男上位后的湿吻下跌多是介入良机
  statement: 任何的行情转折，在很大几率上都是由湿吻引发的，分两种情况：一、先湿吻，然后按原趋势来一个大的高潮，制造一个陷阱，再转折；二、反复湿吻，构造一个转折性箱型，其后完成体位转化。男上位情况下一旦出现湿吻就要密切注意，特别是长期男上位后出现的湿吻，其后的下跌往往是介入的良机，因为空头陷阱的概率太大了；但这一点对趋势形成的第一次湿吻不成立。湿吻之后必有高潮，唯一的区别只是体位的区别，关键判断的是体位而不是高潮的有无。
  evidence_quote: 任何的行情转折，在很大几率上都是由湿吻引发的，这里分两种情况：一种是先湿吻，然后按原趋势来一个大的高潮，制造一个陷阱，再转折；另一种，反复湿吻，构造一个转折性箱型，其后的高潮，就是体位的转化了……一旦出现湿吻，就要密切注意了，特别是这个湿吻是在一个长期"男上位"后出现的，就要更加注意了，其后的下跌往往是介入的良机，因为空头陷阱的概率简直太大了。必须提醒，这一点对趋势形成的第一次湿吻不成立。但湿吻之后必有高潮，唯一的区别只是体位的区别，关键判断的是体位而不是高潮的有无。
  interpretation: 湿吻的两种转折路径是第12课两个买点的雏形：长期空头后的湿吻下跌=空头陷阱（第一买点原型）。注意例外条款：趋势形成后的第一次湿吻通常是中继而非转折，与第12课"女上位第一次缠绕中继可能性极大"互为镜像。
