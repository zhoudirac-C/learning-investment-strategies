  timeframe: short-term
  statement: 8月27日沪深两市成交额2.13万亿元,较前一交易日放量3172亿元;此前8月25日全市场成交额1.83万亿元为下半年新低。本轮反弹走的是'地量启动、温和放量'路径,8月27日是量价配合最好的一天。今日量能观察点不在总额而在分布:放量集中开盘半小时午后逐级缩量是情绪性放量,开盘小幅放量盘中慢慢往上垫才是增量资金。2.5万亿是放量确认位,短期冲上3万亿以上反而要警惕情绪过热与随之而来的分歧;今日合意区间2.2万亿至2.5万亿。
  evidence_quote: 本轮反弹走的正是'地量启动、温和放量'的路径,昨天是量价配合最好的一天。今日量能的观察点不在总额,而在分布。如果放量集中在开盘半小时、午后逐级缩量,那是情绪性放量;如果开盘小幅放量、盘中慢慢往上垫,才是增量资金。按本栏目一贯的框架,2.5万亿是放量确认位,短期一旦冲上3万亿以上,反而要开始警惕情绪过热与随之而来的分歧。今天的合意区间个人倾向于放在2.2万亿至2.5万亿。
  interpretation: 量能判据从总额转向分布与节奏:增量资金(全天垫量)与情绪资金(早盘堆量)的区别决定反弹可持续性。区间锚:低于2.2万亿量能不济,2.2-2.5万亿健康,2.5万亿确认放量,超3万亿过热预警。
