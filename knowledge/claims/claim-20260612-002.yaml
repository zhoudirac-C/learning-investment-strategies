  subject: 商业航天右侧信号是国产不是美股
  timeframe: short-term
  statement: 商业航天回调已近尾声但不等于可以左侧介入，它的右侧信号是国产的——看发射节点能否兑现、看组网进度能否超预期，而不是看美股哪天反弹。IPO落地后将从AI硬件阵营挪回国产替代阵营。
  evidence_quote: 按此前的判断，这一轮回调已近尾声，但'近尾声'不等于'可以左侧'：它的右侧信号同样是国产的——看发射节点能否兑现、看组网进度能否超预期，而不是看美股哪天反弹。换句话说，IPO落地之前，它跟着全球流动性的剧本走；IPO落地之后，定价锚确立、虹吸出清，它才会切回自己的国产日历。届时它在跷跷板上的位置，大概率从'AI硬件阵营'挪回'国产替代阵营'。
  interpretation: UP明确给出了商业航天的操作框架：回调近尾声但不可以左侧抄底。右侧确认信号是国产指标（发射节点/组网进度），不是美股反弹。IPO是分水岭——IPO落地后商业航天将从AI硬件阵营切回国产替代阵营，持仓属性也相应改变。
