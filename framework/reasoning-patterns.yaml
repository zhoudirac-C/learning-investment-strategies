  - pattern_id: ai_chain_verify_and_diffuse_20260416
    name: 算力景气验证到产业链扩散推理
    source_raw:
    - sources/raw/财经/复盘：26-04-16：全线反包创业板近11年新高，算力产业链全面爆发，宁德时代反超中石油.md
    key_themes:
    - AI算力产业链
    - 算力租赁
    - 光模块/CPO/液冷
    - 国产算力
    reasoning_chain:
    - step: 1
      name: 验证产业景气度
      question: 如何确认主线爆发有真实产业支撑而非纯情绪？
      UP_logic: 用H100租赁价5个月涨40%、云商上调AI算力报价、CoreWeave获百亿订单等数据，验证算力需求真实高景气。
      evidence_sources:
      - H100租赁价格
      - 云服务商AI报价
      - CoreWeave订单
    - step: 2
      name: 拆解产业链传导
      question: 景气向上游哪些环节扩散？
      UP_logic: 由算力租赁景气推导硬件全链条受益：光模块、PCB、存储、液冷、CPO逐一用数据确认，覆盖高景气细分。
      evidence_sources:
      - 中际旭创Q1业绩
      - DRAM/NAND价格
      - 覆铜板市占率
      - 台系液冷营收
    - step: 3
      name: 识别产业升级方向
      question: 哪些环节具备更强产业逻辑？
      UP_logic: 商业模式从卖算力向卖Token升级、行业集中度向头部聚拢、国产算力从芯片替代到系统架构创新，锁定产业升级方向。
      evidence_sources:
      - 商业模式变化
      - 国产超节点2026年Q3出货预期
    - step: 4
      name: 锚定龙头定节奏
      question: 主线分歧时如何制定交易节奏？
      UP_logic: 以中际旭创盘面反馈为锚：龙头大高开大幅回落则规避业绩线；龙头承接有力则分歧即低吸窗口，并参考历史主线分歧节奏。
      evidence_sources:
      - 中际旭创盘面反馈
      - 历史主线分歧节奏
    risk_factors:
    - H100租赁价格停止上涨或云厂商报价回落
    - 中际旭创等龙头大高开大幅回落且无承接
    - 成交额持续缩量，难以支撑权重与题材共振
    - 算力租赁分歧时间超预期，主线回流延迟
    confidence_indicators:
    - 海外算力租赁价格继续上涨且大额订单持续
    - 产业链多个细分环节业绩/涨价数据互相印证
    - 机构资金净买入算力硬件低位标的
    - 政策催化（全国一体化算力网、固态电池标准等）
    merge_suggestion: 涨价订单验证后，沿AI产业链扩散并锚定龙头，归入该框架
