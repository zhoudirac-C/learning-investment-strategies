  subject: 止蚀的本质
  topic: 不存在真正的止蚀问题，只存在股票是否依然在能搞范围内的问题
  statement: 从来不存在真正的止蚀问题，只存在股票是否依然在能搞的范围内的止蚀：一只股票的走势从能搞变成不能搞时才退出。退出并不意味着操作失败，可能已经大大赢利，唯一退出的原因只是走势已经不能搞了。投资市场中一个最坏的毛病就是根据盈亏进出，而盈亏不是先验的，是根据当下的走势当下决定的、是被动的，根据盈亏进出就是根据被动的因数进出。认为亏损多少就要止蚀的方法，最终都不可能大成功。
  evidence_quote: 其实，从来不存在真正的止蚀问题，只存在股票是否依然在能搞的范围内的问题，只有这种意义下才存在止蚀：一只股票的走势从能搞变成不能搞……唯一退出的原因只是股票的走势已经不能搞了。投资市场中一个最坏的毛病就是根据盈亏进出，而盈亏不是先验的，是根据当下的走势当下决定的，是被动的。
  interpretation: 把止损从价格维度（亏多少百分比）改写为走势维度（买入逻辑是否被破坏），这是缠论风控的核心立场。退出判断的锚是当初介入的走势依据是否失效，与浮动盈亏无关；赢利状态下该走也要走，亏损状态下依据没破坏则不因数字恐慌出局。
