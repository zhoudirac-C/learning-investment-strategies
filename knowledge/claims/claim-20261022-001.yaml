  evidence_quote: 因此，月底的信息落地有助于减少部分不确定性，行情接下来的方向仍取决于实际结果与原有预期之间的差距。对A股而言，盈利预期影响企业能够赚多少钱，利率预期影响资金愿意为这些盈利支付多少估值，这两端都在重新定价。
  interpretation: 「预期差定价」框架：把三季报（分子端盈利）与议息（分母端贴现率）统一为一次估值重定价事件，反对把两者当独立消息分别交易。可作为事件窗口前的仓位节奏参考。
