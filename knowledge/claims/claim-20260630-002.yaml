  timeframe: permanent
  statement: 预期差能带来更大弹性，但也意味着更高不确定性；若后续只有概念而没有订单、产品和商业场景验证，方向容易停留在情绪炒作层面并被证伪。
  evidence_quote: 但预期差也有两面性。它能带来更大的弹性，也意味着更高的不确定性。如果后续只有概念，没有订单、产品和商业场景验证，那么这个方向就容易停留在情绪炒作层面，最终被证伪。
  interpretation: UP提示预期差不是单向利好，需要产业验证来支撑，否则只是情绪炒作。
