statement: 液冷产业景气：山东广东等地液冷产线满产运行，核心设备CDU订单排至2026年底部分交付延至2027年；中金看好光通信散热赛道，硅油冷却液有望成为氟化液最佳替代品（欧盟PFAS限制驱动）。
evidence_quote: 据央视财经，山东、广东等地液冷产线满产运行，核心设备CDU订单已排至2026年底，部分交付周期展望至2027年。据中金公司研报，看好AI算力集群持续扩容背景下光通信散热赛道的高成长性，重点关注光模块VC、液冷Cage及共封装交换机液冷机会。据东方证券研报，实际应用表明硅油冷却液有望成为氟化液的最佳替代品；随着欧盟等地区推出对PFAS类物质的限制政策，环保收紧背景下硅油冷却液具备一定发展潜力。
interpretation: 产业景气三层证据：央视（产线满产+CDU排单）、中金（光通信散热）、东方证券（硅油替代氟化液）。新增细分方向=硅油冷却液（PFAS环保收紧逻辑），相关标的集泰股份(002909)、金帝股份(603270)。
