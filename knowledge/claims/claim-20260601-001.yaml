    subject: 早盘操作预案：先观察再动手，不急于抄底
    timeframe: intraday
    statement: 今日早盘建议保持谨慎，先观察再动手，不要急于抄底。若泓淋电力竞价良好+AI板块快速走强+跌停家数减少，可小仓位参与新热点首板及PCB辨识度个股；若竞价不及预期+科技股低开低走+跌停家数多，则继续观望。PCB不盲目追高，等明确领涨龙头再跟进
    evidence_quote: 今日早盘建议保持谨慎，先观察再动手，不要急于抄底。若早盘泓淋电力竞价表现良好，AI板块开盘后快速走强，且跌停家数明显减少，则可小仓位参与新热点的首板机会，以及PCB板块中辨识度较高的个股。若早盘泓淋电力竞价不及预期，科技股继续低开低走，跌停家数仍然较多，则继续保持观望，等待指数企稳信号出现。对于手中持有的科技股，若跌破关键支撑位，应及时减仓控制风险。对于PCB板块的机会，建议不要盲目追高，等待板块内出现明确的领涨龙头后再考虑跟进。
    interpretation: 操作纪律：①总体原则——谨慎、观察优先、不急于抄底；②积极条件（同时满足）：泓淋电力竞价良好 + AI快速走强 + 跌停家数减少 → 小仓位参与新热点首板+PCB辨识度个股；③消极条件（任一出现）：泓淋电力竞价不及预期 / 科技股低开低走 / 跌停家数多 → 继续观望；④持仓管理：科技股跌破关键支撑→减仓；⑤PCB特殊纪律：不追高，等领涨龙头确认。这是一个完整的多情景操作预案，体现了博主的风控优先原则。
