  subject: 单边区间与无中枢走势的判断含义
  topic: 单边区间只出现在第四或第五根K线故变盘在午盘前后，无中枢走势防骗线
  statement: 两中枢走势中两中枢不能有重叠（否则转化成单中枢情形），其最大特点是两中枢之间至少有一根30分钟K线有部分区间不属于任何一个中枢，这个区间称为单边区间，是其后走势的关键位置。由于一天只有8根30分钟K线，单边区间只可能在第四根或第五根K线，由此可知为什么所有出现单边走势的，变盘时间都在中午收盘的前后30分钟之内。无中枢的最强单边走势要警惕骗线：往往很多骗线就是故意用这类走势构成，特别是在大的日K线中枢中出现时更大可能是骗线；但如果是在一个第三类买卖点后出现这种走势，出现大级别强势趋势的可能性就极大。
  evidence_quote: 这个区间，成为单边区间，这是这种走势最重要的特点，是其后走势的关键位置。注意，具有单边区间的K 线不从属任何一个中枢……由此就知道，为什么所有出现单边走势的，变盘时间都在中午收盘的前后30 分钟之内……往往很多骗线就是故意用这类走势构成，特别是在大的日K线中枢中出现这种情况，更大可能是骗线……但如果是在一个第三类买卖点后出现这种走势，出现大级别的强势趋势的可能性就极大了。
  interpretation: 单边区间给出了日内变盘的时间窗解释（第四、五根K线对应午盘前后），并把最强日内形态与所处位置挂钩判断真假：中枢内多为骗线，第三类买卖点后多为真趋势启动。
