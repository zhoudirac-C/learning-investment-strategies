  subject: 走势级别延续定理
  topic: 更大级别中枢产生前该级别走势类型延续，波动区间重叠则级别扩张
  statement: 缠中说禅走势级别延续定理一：在更大级别缠中说禅走势中枢产生前，该级别走势类型将延续，即只能是只具有该级别中枢的盘整或趋势的延续。缠中说禅走势级别延续定理二：更大级别缠中说禅走势中枢产生，当且仅当围绕连续两个同级别缠中说禅走势中枢产生的波动区间产生重叠。含义：中枢延伸与趋势（围绕前后中枢的波动互不重叠）这两种情况下都不可能形成更大级别的中枢；要形成更大级别中枢，必然是围绕新同级别中枢产生的波动与围绕前中枢的某个瞬间波动区间产生重叠，此时不能再认为是趋势。
  evidence_quote: 缠中说禅走势级别延续定理一：在更大级别缠中说禅走势中枢产生前，该级别走势类型将延续……缠中说禅走势级别延续定理二：更大级别缠中说禅走势中枢产生，当且仅当围绕连续两个同级别缠中说禅走势中枢产生的波动区间产生重叠。
  interpretation: 这两条定理给出走势结束与级别扩张的精确判据：趋势延续的否定条件不是涨幅大，而是更大级别中枢出现。原文以连续涨停只有1分钟中枢、以及2006年指数最多日线中枢为例，说明看涨多了要跌是误解级别。
