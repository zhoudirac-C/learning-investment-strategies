# INCLUDE-001 向上包含合并（课62）
# claim-20070630-001-b：向上时取两 K 线最高点当高点、两低点中较高者当低点合并。
# 构造：bar1/bar2 有包含（bar2 全在 bar1 内），方向向上（g1=11.6 >= g0=11.0），
#   向上合并得 M=[h 11.6, l 10.6]（高 11.6 来自原始 bar1）。
#   合并后序列 [11.0,9.5] / [11.6,10.6] / [11.0,9.8] 恰成顶分型——
#   不做包含处理则无任何分型（bar1 低点 10.2 < bar2 低点 10.6，双最高条件不成立），
#   故该顶分型是合并正确性的可观测证据。
# idx 约定：分型 idx 指贡献分型极值的原始输入 bar 的 0 基下标（此处=1）。
# 末尾分型未被后续走势确认 → sure: false。
case_id: INCLUDE-001
claim_refs:
  - claim-20070630-001-b
bars:
  - [10.0, 11.0, 9.5, 10.8]
  - [10.8, 11.6, 10.2, 11.4]
  - [11.1, 11.2, 10.6, 10.8]
  - [10.8, 11.0, 9.8, 9.9]
expect:
  fx:
    - {idx: 1, type: up, sure: false}
