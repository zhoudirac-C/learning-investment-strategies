  statement: 情形B（反弹无量、指数与情绪再度共振走弱）：科技核心继续创新低、反弹很快回吐；同一时段成交较今天下降但价格重心持续下移；固态电池出现集中炸板或高位股大幅补跌——若这些信号延续到午后及收盘，按承接继续减弱处理。操作上降低主动暴露，放弃没有承接依据的抄底，优先处理破坏原有持有逻辑的仓位；个别股票的急拉不能替代整个持仓方向的风险判断。分界规则：指数偏弱而少数题材保持强势时维持局部观察，不强行套入全面转强；只有缩量、没有新低也不机械判为情形B；两套预案的分界是承接质量、价格重心和赚钱效应的联动。
