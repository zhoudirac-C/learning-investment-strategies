  subject: 左侧卖出的目标与内生成本
  timeframe: permanent
  statement: 左侧卖出的目标是在上涨动能衰减时主动锁定利润、提前规避大幅回撤，而非精准卖在最高点；其内生成本是更高的卖飞概率，卖飞少赚的利润相当于换取其他交易少回撤和少深套的保险费
  evidence_quote: 它的核心目标只有三个：首先是上涨动能衰减时，你需要主动锁定利润；第二，提前规避大幅回撤；第三，不等趋势彻底走坏再被动离场。所以对应的代价也非常的明确，就是用更高的卖飞概率去换取更低的深套概率。……所以你卖飞少赚的那部分的利润，就是你在其他交易里少亏少回撤的保险费。
  interpretation: UP把左侧模式定义为回撤控制工具，而不是逃顶工具。评价它必须同时计算卖飞成本和避免深套的收益，不能只统计少赚部分。
