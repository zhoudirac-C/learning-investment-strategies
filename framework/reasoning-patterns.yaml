  data_requirements:
  - name: 市场量能与情绪指标
    channel: 行情数据（全市场成交额/涨跌家数/涨停家数）/ 东财
  - name: 政策与产业催化
    channel: 政策文件 / 产业新闻
  - name: 海外锚点走势
    channel: 美股行情（映射板块）
  - name: 业绩预告与景气数据
    channel: 财报与业绩预告公告
  - name: 板块强度与梯队数据
    channel: 行情数据（板块涨幅排名/龙头连板天数/子板块联动）
  - name: 资金流向数据
    channel: 龙虎榜 / 融资余额 / ETF申赎
  - name: 分时与量价细节
    channel: 行情数据（分时图/板块成交量）
  steps:
  - step: 1
    name: 确认市场阶段与核心矛盾
    question: 当前市场处于什么阶段？核心矛盾是什么？
    action: 用全市场成交额、涨跌家数比、涨停家数判断市场处于主升/震荡/调整/恐慌哪一阶段；存量博弈（成交额不增）环境下主线退潮时支线不受益，只有增量资金入场才支撑主线切换
    data:
    - 市场量能与情绪指标
  - step: 2
    name: 识别候选主线/板块
    question: 哪些板块具备成为主线的条件？
    action: 从四个维度筛选候选：政策级别（国家战略/大国博弈）、海外锚点（美股映射板块走势）、产业景气度（业绩预告增速）、资金认可度（涨停家数多且放量）
    data:
    - 政策与产业催化
    - 海外锚点走势
    - 业绩预告与景气数据
    - 板块强度与梯队数据
  - step: 3
    name: 验证主线强度与持续性
    question: 候选主线是否具备持续性和发散性？
    action: 核对三项：板块强势持续多日（留有研究时间）、赚钱效应扩散到多个子题材、龙虎榜与成交结构显示游资/机构/散户资金共振；单日脉冲不判定为主线
    data:
    - 板块强度与梯队数据
    - 资金流向数据
  - step: 4
    name: 排除假切换与干扰信号
    question: 当前是否出现"假切换"信号？
    action: 区分超跌反弹与真切换：无增量资金入场时单纯"跌多了"不构成切换理由；确认切换需观察到非主线方向出现个别超高收益率标的且增量资金持续跟进
    data:
    - 业绩预告与景气数据
    - 资金流向数据
  - step: 5
    name: 制定操作策略
    question: 确认主线后如何操作？分歧时如何应对？
    action: 主升浪中回调后拉回视为买点、不追高，等分歧回踩或缩量确认；无法买个股时通过ETF/可转债参与；双主线并存时按优先级链式配置
    data:
    - 分时与量价细节
    - 市场量能与情绪指标
  falsification:
  - 大盘系统性破位下行或宏观政策重大转向
  - 主线产业逻辑被证伪（景气数据反转、核心公司业绩暴雷）
  - 板块情绪退潮：核心标的放量滞涨、板块联动失效
