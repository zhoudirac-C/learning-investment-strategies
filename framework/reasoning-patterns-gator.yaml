  name: 技术分析核心与关键阈值
  chapter: 26
  description: 鳄鱼派（gator school）第26章：技术分析核心与关键阈值。 ① 前兆信号 vs 确立信号：放量加速=见顶前兆（可分批止盈/持有/博鱼尾）； 见顶确立=放量大跌 / 非自然回撤 / 三日或长时间横盘不新高 → 确立信号出现，持仓全清 ② K线会说谎（突发事件与人为操控）→ 接受不确定性，做大概率的操作 ③ 理性比经验重要：IF 历史经验与当下盘面冲突 THEN 以当下盘面为主 涉及：26.1 K 线语言四核心（20250519）；26.2 数字阈值汇总 [可计算]；26.3 缺口与节奏（20240922/20260415）；26.4 缩量判读与"图形 ≠ 信号"（2026-09-29）`[重要]`；26.5 非自然回撤（趋势股见顶/离场信号） `[核心][可计算]`。 用于鳄鱼派资金生态位与规则体系的判断。
  trigger:
  - ③ 理性比经验重要：IF 历史经验与当下盘面冲突 THEN 以当下盘面为主
  - IF 大跌后连阳放量上涨 THEN 弱转强=拐点
  - 指数单日涨跌 > 2%           = 异常波动，找拐点（多数时候在 2% 以内）
  - 上证50 单日跌 ≤1.5%         = 权重稳住，题材可继续炒；>1.5% = 大跌，题材炒作难以为继
  - 创业板大跌后当日收涨 >2%    = 弱转强买入信号；填坑中 >2% = 强者恒强；
  - 填坑完成后或大涨后 >2% = 加速见顶卖出信号
