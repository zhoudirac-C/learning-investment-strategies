  subject: 地缘敞口筛选三步法：先算对美收入再谈规避
  timeframe: permanent
  statement: 筛选行政令影响个股的正确顺序：先看该公司对美直接收入占比，再看是否经由第三国产能或海外主体交付，最后才看是否属于行政令定义清单里的设备类别；三个条件同时满足才构成真实敞口，只满足第三条的属于情绪误伤而非基本面受损。
  evidence_quote: 这里不点具体个股，原因是筛选变量不在题材归属，而在对美收入敞口，这个数字必须逐家去年报和半年报里核对，不能用板块标签代替。正确的顺序是：先看该公司对美直接收入占比，再看是否经由第三国产能或海外主体交付，最后才看它属不属于行政令定义清单里的设备类别。三个条件同时满足才构成真实敞口；只满足第三条的，属于情绪误伤而非基本面受损。
  interpretation: 可泛化的地缘风险筛选方法论：用「收入敞口→交付路径→设备类别」三重过滤区分真实受损与情绪误伤，反对用板块标签代替基本面核对。适用于一切出口管制类事件（此前的
    FCC、光模块禁令同理）。
