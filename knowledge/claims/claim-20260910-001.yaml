  subject: 位置决定意义的修复判断条件
  timeframe: short-term
  statement: 地量附近、防御领涨、题材分歧与数据窗口，共同说明市场正在降低参与强度。明天优先观察情绪回流的方向与持续性，下周一再评估CPI落地对指数环境的影响；这两个观察窗口之间，始终以实际量价修正判断。位置决定意义：若成交改善、亏钱效应收敛、核心方向形成承接，修复判断才得到支持；若这些信号缺席，就继续等待右侧确认。
  evidence_quote: 位置决定意义。若成交改善、亏钱效应收敛、核心方向形成承接，修复判断才得到支持；若这些信号缺席，就继续等待右侧确认。
  interpretation: 修复判断的三条件（可证伪锚点）：①成交改善（量能回升）②亏钱效应收敛（高位股止跌）③核心方向形成承接。三信号齐全=修复确认；缺席=等待右侧。'位置决定意义'=同样的K线形态在不同位置含义不同，地量+低位分歧+数据窗口的组合决定了当前是'降低参与强度'阶段而非'出清'阶段。与claim-017三信号（核心先稳/板块扩散/回落有承接）形成日线+分时两级观察体系。
