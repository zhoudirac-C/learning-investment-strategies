  subject: 缠论有效的两个前提
  topic: 价格充分有效市场与非完全绝对趋同交易是理论仅有的两个界限
  statement: 缠论是对价格充分有效市场里非完全绝对趋同交易的一个完全的数学公理化理论，只有这两个界限。其一，市场必须价格充分有效，即交易以时间的不可逆为前提完全等价地反映在价格轨迹上，交易可以随便更改、算账不算的市场不在其列；其二，交易不能完全绝对趋同，一个完全绝对趋同的交易等价于赌博，只要还有人买入或持有哪怕1股，理论就可以描述。只要是价格充分有效市场里的非完全绝对趋同交易，理论就永远绝对有效，应用理论唯一需要监控的就是这两个前提是否还存在。
  evidence_quote: 本ID 的理论只有这两个界限，只要是价格充分有效市场里的非完全绝对趋同交易，那本ID 的理论就永远绝对有效……唯一需要监控的就是价格充分有效市场与非完全绝对趋同交易这两个前提是否还存在。
  interpretation: 即使所有人都学习应用该理论，由于社会结构多层性与个体差异也不会造成完全绝对趋同交易，理论依然有效，这是作者敢于公开理论的深层原因。应用相同理论也不会有相同结果：资金规模、资金管理水平、选股策略、基本面把握、交易者性格气质使同一理论呈现不同面貌。
