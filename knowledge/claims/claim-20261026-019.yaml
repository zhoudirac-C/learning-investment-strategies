statement: 右侧行情走起来不一定非要等两融回升。融资客是右侧交易选手，历史上（如七月底止跌、八月初才回；四月龙哥捞人后一个月未回；六二五摔杯节点才大幅回来）显示，杠杆资金滞后于指数止跌，需要看到指数持续上涨才会回来。
evidence_quote: 那什么情况下，你说右侧能够走起来嘞？是两融回升了才走起来吗？哎，其实也不是，就是说融资客他是一种右侧交易选手。啊，我们去看前面的，比如说七月份的。啊，这。你发现市场的话在这七月多就，七月底就止跌了，但杠杆哥什么时候回来的？八月初才回来的。
interpretation: 不应以两融回升作为入场必要条件，右侧交易应基于指数趋势确认，而非等待杠杆数据改善。
