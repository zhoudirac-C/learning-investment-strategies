  subject: 平衡市靠轮动实现，科技无创新高支线说明仍是反弹
  timeframe: short-term
  statement: 平衡市的运行方式不是靠某一条主线走强实现的，而是靠轮动实现的：科技线上午11点出头就出现分歧，市场前二的高价股联讯仪器（688808）、源杰科技（688498）触及全天最高价后回落，随后非科技方向接棒，脑机接口/高压氧舱、房地产、大消费、医药、化工、人形机器人、工业母机等穿插轮动，下跌方向主要是油气概念。在2.15万亿的量能下市场没有能力让多主线并行走强，所以可交易方向增多与单一方向持续性下降是同一件事的两面。还有一个隐患必须写下来：科技至今没有走出创新高的支线，这意味着当前仍是反弹，而不是反转。
  evidence_quote: 科技线在上午11点出头就开始出现分歧，市场前二的高价股联讯仪器、源杰科技触及全天最高价后回落，成交额居前的科技龙头也陆续冲高回落；随后非科技方向接棒，临近11点脑机接口/高压氧舱概念急速拉升，下午1点半后房地产板块震荡走强，大消费异动拉升，医药板块反复活跃，化工、人形机器人、工业母机等细分题材穿插轮动；下跌方向主要是油气概念。这正是当前平衡市的运行方式：它不是靠某一条主线走强实现的，而是靠轮动实现的。还有一个隐患必须写下来：科技至今没有走出创新高的支线，这意味着当前仍是反弹，而不是反转。
