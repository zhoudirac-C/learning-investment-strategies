  subject: 两中枢上涨的MACD形态
  topic: 标准两个中枢的上涨在MACD上有可对照的完整形态演化
  statement: 一个标准的两个中枢的上涨，在MACD上表现出的形态：第一段，黄白线从0轴下面上穿上来，在0轴上方停留的同时形成第一个中枢与第二类买点；其后突破该中枢，黄白线快速拉起，这往往是最有力度的一段，所谓指标钝化经常出现在这一段，一般在一个次级别背驰中结束；然后进入第二个中枢的形成过程，黄白线逐步回到0轴附近；最后继续突破第二个中枢，黄白线与柱子重复前面的过程，但这次黄白线不能创新高，或柱子面积、伸长高度不能突破新高，即出现背驰，结束整个两个中枢的上涨。
  evidence_quote: 一般来说，一个标准的两个中枢的上涨，在MACD 上会表现出这样的形态，就是第一段，MACD 的黄白线从0 轴下面上穿上来，在0 轴上方停留的同时，形成相应的第一个中枢，同时形成第二类买点……然后进入第二个中枢的形成过程中，同时MACD 的黄白线会逐步回到0 轴附近，最后，开始继续突破第二个中枢……但这次，黄白线不能创新高，或者柱子的面积或者伸长的高度能不能突破新高，出现背驰，这就结束了这一个两个中枢的上涨过程。
  interpretation: 把抽象的两中枢趋势翻译成MACD可观察清单：0轴上穿、0轴附近回拉、二次拉升不创新高。注意MACD在0轴附近盘整与回抽0轴形成的中枢至少是该级别中枢，也可以构成更大级别中枢。000572的日线周线双重第二类买点是文中2006至2007年历史案例。
