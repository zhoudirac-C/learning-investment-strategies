  claim_type: technical-knowledge
  subject: 孕线定义与观察视角
  timeframe: permanent
  statement: 孕线又称母子线，观察视角从左到右、重点看第一根大K线，与从右向左观察第二根K线的吞没形态完全相反。核心判定是实体包裹实体：第一根大K线包裹第二根小K线，第二根的最高价必须小于第一根实体上端，最低价必须大于第一根实体下端。
  evidence_quote: 孕线也被称为母子线，观察视角是从左到右，重点关注第一根大K线，和从右向左观察第二根K线的吞没形态完全相反。……运线的核心是实体包裹实体，第二根K线的最高价必须小于第一根K线的实体上端，且第二根K线的最低价必须大于第一根K线的实体下端。……吞没形态是第二根大K线包裹第一根小K线，运线是第一根大K线包裹第二根小K线，二者虽然都是两根K线的包裹结构，但市场逻辑完全不同。
  interpretation: 定义层：把观察顺序与实体包裹口径固定下来，是与吞没形态区分的第一道门。
