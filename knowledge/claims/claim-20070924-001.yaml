  subject: 分型成笔的精确判断
  topic: 用小级别最大中枢的第三类买卖点判断分型是否延伸成笔，中继确认后要回补
  statement: 判断顶分型是否延伸成笔的更精确简单的方法：顶分型成立后，该分型区间在小级别里一定形成某级别的中枢，选择其中最大的一个，日顶分型后一般最大的就是5分钟中枢，30分钟没可能因为时间不够；如果该5分钟或1分钟中枢出现第三类卖点，并该卖点不形成中枢扩张的情形，那么几乎百分之百可以肯定，一定在日线上要出现笔了。反过来，要不出现笔并最终有效破坏该顶分型，那一定要出现某级别的第三类买点，否则就算有短时间的新高也一定是假突破。操作上：利用顶分型卖了以后一定要注意是否要回补，一旦确认是中继的应该回补，否则就等着笔完成再说；中继顶分型后，如果其后的走势在相应小级别出现背驰或盘整背驰，那么下一顶分型是中继的可能性将大幅度减少，中继分型有点类似刹车，第一次刹车后车速已明显减慢证明刹车有效，第二次刹住的机会就极大。
  evidence_quote: 如果该5 分钟中枢或1 分钟中枢出现第三类卖点，并该卖点不形成中枢扩张的情形，那么几乎100%可以肯定，一定在日线上要出现笔了。……可以100%肯定的，要不出现笔并最终有效破坏该顶分型，那一定要出现某级别的第三类买点，否则就算有短时间的新高，也一定是假突破……如果一旦确认是中继的，应该回补，否则就等着笔完成再说……中继分型，有点类似刹车，一次不一定完全刹住，但第一刹车后如果车速已明显减慢，证明刹车系统是有效的，那么第二次刹住的机会就极大了。
  interpretation: 这条把第79课的5日线经验过滤器升级为精确的小级别结构判据：第三类卖点加不形成中枢扩张，两个条件缺一不可。一般情况下中继的都是第三类卖点后形成中枢扩展，给出一个盘整底背驰让你重新介入。能有效分辨中继分型，操作就会有大的进步。
