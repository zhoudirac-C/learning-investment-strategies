  evidence_quote: 第一，盘面还会不会出现强势股随机补跌。若补跌不再频繁出现，科技反弹的节奏会顺畅很多；反之大概率仍以轮动为主。第二，国产链与前期抗跌标的能不能跟上节奏、走出强者恒强。这直接决定本轮反弹的广度与高度。第三，光互连方向明日的分时形态。低开拉起说明市场已把它当作雷声大雨点小的老故事，高开回落则说明政策风险被真实定价。第四，防御端是否回补。若红利与消费重新走强，说明资金又切回防御，这对反弹持续性是减分项。
