  subject: 区间套定位法
  topic: 围绕中枢两段比力度，背驰段内逐次下找背驰段，当下精确定位转折点
  statement: 比较力度、发现背驰，首先要搞清楚是哪两段比较：只要是围绕同一中枢的两段走势都可以比较力度。对尚未走完的走势段，可以先假设其进入背驰段；一旦走势实际走出来力度大于前者，就可断定背驰段不成立。在没有证据否定背驰之前，逐次观察该段内部结构中的背驰情况，这种方法可以逐次下去，就是区间套的定位方法，可以在当下精确地定位走势的转折点。另外，背驰段的内部若没有创新高（新低），背驰是不存在的，新高之后才进入真正的背驰危险区。
  evidence_quote: 要比较力度，发现背驰，首先要搞清楚是哪两段比较，其实，只要是围绕一中枢的两段走势都可以比较力度……在实际操作中，65 开始的走势，由于没实际走出来，所以在和55-60 比较时，都可以先假设是进入背驰段。而当走势实际走出来，一旦力度大于前者，那么就可以断定背驰段不成立，也就不会出现背驰。在没有证据否定背驰之前，就要观察从65 开始的一段其内部结构中的背驰情况，这种方法可以逐次下去，这就是区间套的定位方法，这种方法，可以在当下精确地定位走势的转折点……因为背驰如果没有创新高，是不存在的。
  interpretation: 区间套是缠论背驰精确定位的核心操作流程：本级别粗判背驰段后，逐级缩小级别在背驰段内部再找背驰段，多重嵌套确认。本课示范了用65、69、71开始的四重背驰段嵌套定位72点这个卖点。MACD对应段柱子面积之和是力度的辅助判断工具。
