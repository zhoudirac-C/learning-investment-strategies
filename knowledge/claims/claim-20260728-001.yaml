  subject: 光刻机产业链三层分级框架
  timeframe: trend
  statement: 光刻机产业链按弹性与确定性分为三层：第一层整机与专用分系统（弹性最大、确定性最低，直接绑定整机出货节奏）；第二层通用半导体设备零部件（真正的瓶颈层，需求来自全部工艺设备，不依赖光刻机单一变量）；第三层量产后被上修的配套设备（链条最长、单体规模最大，需等验证节点明确）。
  evidence_quote: '第一层 · 整机与专用分系统

    弹性最大 · 确定性最低 · 直接绑定整机出货节奏


    第二层 · 通用半导体设备零部件

    真正的瓶颈层 · 需求来自全部工艺设备 · 不依赖光刻机单一变量


    第三层 · 量产后被上修的配套设备

    链条最长 · 单体规模最大 · 需等验证节点明确'
  interpretation: UP按弹性/确定性对光刻机产业链进行三层分层，这是一个投资视角的分析框架。第一层弹性最大（整机出货量爆发时弹性高），但确定性最低（完全绑定单一变量）；第二层确定性最高（需求横跨全部工艺设备，不只看光刻机），UP明确将其定义为'真正的瓶颈层'；第三层链条最长、体量最大，但需要等验证节点过后才会放量。三层之间弹性递减、确定性递增。该框架可用于指导不同风险偏好阶段的光刻机主题配置。
