  subject: 做好配置可躺平两头吃，越要警惕风格切换
  timeframe: short-term
  statement: 6月25日11:30操作建议：做好配置可以躺平两头吃，既不用FOMO追涨也不担心踩踏。但越是这种强修复行情，越要警惕可能的风格切换——一旦出现切换必须听从信号，防止利润大幅回撤。
  evidence_quote: 做好配置，你可以躺平两头吃，既不用FOMO，也不会担心踩踏。但同样越是这种时候，越要警惕可能的风格切换，一旦风格切换，我说了你得听，不要再让利润出现大幅回撤。
  interpretation: 这是UP中期配置框架在当天的具体应用——"两头吃"指均衡配置不同风格/板块，使组合无论市场走哪种路径都能受益。但提示强修复行情容易让人放松警惕，风格切换可能在不经意间发生，届时必须果断应对（止盈/调仓），这是防止利润回撤的关键纪律。
