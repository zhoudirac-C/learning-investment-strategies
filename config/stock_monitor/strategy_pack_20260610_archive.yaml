notification_policy:
  only_notify_when:
  - 燃气轮机方向(杰瑞/应流/万泽)触发买入点或风控
  - 工程机械(徐工)触发观察点或企稳确认
  - 创新药(药明康德)止跌信号确认
  - 大盘4000支撑验证或跌破
  - 万泽逼近/触发风控线30.5
  - 全A指数与上证出现背离
  suppress_when:
  - 只是普通红绿波动
  - 单票异动但板块不共振
  - 同一信号按类型差异化去重（风控15min/减仓30min/板块轮动30min，见dedupe_by_type，已代码实现）
  - 当前不在A股交易时段
  - 规避方向（半导体/消费）的普通波动
  dedupe_by_type:
    risk_alert:
      dedupe_minutes: 15
      breakthrough_if_price_change_pct: 1.0
    reduce_alert:
      dedupe_minutes: 30
      breakthrough_if_price_change_pct: 2.0
    sector_rotation:
      dedupe_minutes: 30
      breakthrough_if_price_change_pct: 0
  message_fields:
  - time
  - action
  - stock
  - price
  - position_context
  - trigger
  - market_context
  - suggested_plan
  - invalidation
  - next_check
