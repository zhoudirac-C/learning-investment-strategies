  statement: 打野号持有三只药（万邦、汉森制药(002412)、药明康德(603259)），昨日买入药明康德(603259)16万作为趋势中军，逻辑是哈药股份(600664)上板带动医药情绪且已配弹性品种；没进哈药股份(600664)的原因是已有四只药且哈药股份(600664)拉得太快；后续对药明、汉森制药(002412)开始做T。
