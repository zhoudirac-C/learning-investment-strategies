    - 产业逻辑分析
  - step: 2
    name: 分解价值分配维度
    question: 产业价值在哪些环节重新分配？
    UP_logic: 从软件护城河、商业模式、利润分配、市场分歧四个维度分析价值迁移方向
    evidence_sources:
    - 软件护城河变化
    - 商业模式变化
    - 利润分配结构
    - 市场分歧点
  - step: 3
    name: 定位确定性最高环节
    question: 哪个环节在价值重分配中确定性最高？
    UP_logic: 算力层承担最大Capex，需求增长趋势明确，技术革命早期最先确定赢家的往往是底层基础设施资产
    evidence_sources:
    - 算力供给紧张状态
    - 卡供应瓶颈缓解预期
    - 谷歌Capex翻倍指引
  - step: 4
    name: 验证产业供需状态
    question: 当前产业供需是否支持该环节的确定性？
    UP_logic: 产业端反馈算力供给仍处紧张状态，持续扩容仍难满足需求，谷歌26年Capex接近翻倍，供需仍趋紧张
    evidence_sources:
