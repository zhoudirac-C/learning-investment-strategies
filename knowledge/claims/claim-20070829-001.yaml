  subject: 散户只看合力结果
  topic: 散户对合力的影响力可忽略，操作可完全只看合力最终结果而不必关心分力博弈
  statement: 走势是由合力构成的，各分力背后代表的都是真实的、有思想有感情的人。对于一般散户，其影响力对于合力可以完全忽略不算，因此其操作可以完全只看合力最终的结果，而不需要关心每一刻合力所对应的各分力间的博弈。对散户来说，多了解一点市场心理层面的事情，并不能改变对走势完全严格客观的态度。
  evidence_quote: 走势是由合力构成的，但各分力后面代表的，都是真实的、有思想有感情的人，因此，了解一下一些心理层面的东西，还是有好处的……对于一般的散户，其影响力对于合力可以完全忽略不算，因此，其操作，当然就可以完全只看合力最终的结果，而不需要关心每一刻合力所对应的各分力间的博弈。
  interpretation: 这是本课杂史中唯一具普遍操作含义的判断：资金量决定关注点，散户研究庄家心理的边际价值低，把精力放在合力结果即走势本身即可。第79课按资金规模分层选择操作方法是同一逻辑的展开。本课其余内容为坐庄与搞死庄家的杂史故事，无明确可复用规则，未提取。
