  evidence_quote: 今天亚洲市场是弱，但不会一起跌。日本、韩国这类对全球利率和科技估值更敏感的市场应当相对谨慎，因为真正压制亚洲风险资产的已经不是某一个人的表态，而是美债收益率高、油价高、加息预期高这三件事同时存在。
  interpretation: 外围压制从单一事件（沃什表态）升级为三重变量叠加的系统性压制，日韩比A股更敏感，A股因PMI结构支撑相对抗跌是后续判断的前提。
