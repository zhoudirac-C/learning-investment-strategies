  extracted_at: '2026-07-18'
  subject: 走势中枢三定理
  topic: 连接中枢的必然是次级别以下走势，中枢破坏当且仅当回抽不回到中枢内
  statement: 缠中说禅走势中枢定理一：在趋势中，连接两个同级别缠中说禅走势中枢的必然是次级别以下级别的走势类型；相连走势类型的级别越低表示力度越大，这是缺口有较强技术含义的理论依据。定理二：在盘整中，无论离开还是返回中枢的走势类型必然是次级别以下的。定理三：某级别中枢的破坏，当且仅当一个次级别走势离开该中枢后，其后的次级别回抽走势不重新回到该中枢内；定理三中两个次级别走势的组合只有趋势+盘整、趋势+反趋势、盘整+反趋势三种，站在实用角度最用力的破坏是趋势+盘整，其后上涨往往比较有力，特别当这种突破在底部区间。维持中枢的充分必要条件是任何离开该中枢的走势类型以次级别以下走势类型返回。
  evidence_quote: “缠中说禅走势中枢定理一”：在趋势中，连接两个同级别“缠中说禅走势中枢”的必然是次级别以下级别的走势类型……“缠中说禅走势中枢定理二”：在盘整中，无论是离开还是返回“缠中说禅走势中枢”的走势类型必然是次级别以下的……某级别“缠中说禅缠中说禅走势中枢”的破坏，当且仅当一个次级别走势离开该“缠中说禅走势中枢”后，其后的次级别回抽走势不重新回到该“缠中说禅走势中枢”内。
  interpretation: 三条定理覆盖中枢的维持与破坏：定理一解释了跳空缺口的力度含义，定理三给出的离开加回抽不返正是第20课第三类买卖点的严格原型。最用力的破坏组合趋势+盘整提示底部区间此类突破后的上涨倾向。
