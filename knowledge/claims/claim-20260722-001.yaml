  subject: 半导体设备景气度确认-SEMI数据2026年涨23.2%-产业链补逻辑
  timeframe: industry
  statement: SEMI报告2026年全球半导体设备销售额预计增长23.2%达1659亿美元，2028年将创历史新高2295亿美元。三星评估将美国泰勒厂初期生产规模扩大至原计划2倍，台积电2026年capex指引上调至600-640亿美元。国内东北证券认为全球半导体景气度高位且持续性增强，设备环节量价齐升逻辑验证。但这一组数据是给昨日板块爆发补产业逻辑而非构成新催化——景气度是慢变量盘口才是快变量。
  evidence_quote: 产能扩张：据报道，三星电子晶圆代工正评估将美国泰勒厂的初期生产规模扩大至原计划的2倍。此前台积电已将2026全年资本支出指引上调至600亿至640亿美元区间。行业数据：据全球半导体行业协会（SEMI）发布的报告，2026年全球半导体设备销售额预计将增长23.2%，达到1659亿美元；到2028年将创下历史新高，达到2295亿美元。个人判断，这一组数据的作用是给昨日的板块爆发补上产业逻辑，而不是构成新的催化。景气度数据是慢变量，盘口才是快变量——不要用年度资本开支指引去解释一天的涨跌。
  interpretation: UP明确区分了产业数据（慢变量）和盘口（快变量）的不同作用。SEMI数据+三星扩产+台积电指引是基本面支撑，但不应作为追涨的理由——它们是验证逻辑而非催化逻辑。这个区分对操作很有价值：产业数据好不等于明天就要涨，盘口的资金行为才是短期决策依据。
