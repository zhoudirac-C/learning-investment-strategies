  claim_type: technical-knowledge
  subject: 股市失败者类型
  timeframe: permanent
  statement: 股市中的失败者只有两种类型：面首，即被市场玩弄、被股票忽悠着在亢奋与萎靡之间不断晃悠的人；怨男，即被市场用废之后只剩嘴炮的人，或去当股评卖假阳具骗人，或对着市场顾影自怜，或编故事对着往昔梦境意淫，以及那些从来不能玩真的、企图用口眼制造快感的发育不良者。识别这两类失败模式是进入市场前的第一课。
  evidence_quote: 股市中的失败男人，只有两种，面首与怨男，当然也就包括其中最不可爱的两者交集。面首，被股票所消费者，被股票所玩弄者，被股票忽悠着从阳亢到阳痿间不断晃悠者。怨男，有两种，一种是当面首时被用废的，能用的只剩下嘴了，或者去当当股评卖卖假阳具去骗骗人，或者每天对着股市这镜子顾影自怜，或者就编编故事对着往昔的梦境再梦里阳亢一把；另一种是拍AV
    的、说评书的、当狗崽的、玩裸聊的，总之，都不是能玩真的，都是些企图用口眼就能制造快感的发育不良者。要快感就玩真的，真刀真枪来，总是当医疗器械的免费宣传者那算什么事？
  interpretation: 缠论对失败参与者的分类学：面首=情绪化实盘亏损者，怨男=脱离实盘的嘴炮者与意淫者。其共同病根是『不能玩真的』——要么被市场情绪牵着走，要么干脆不敢直面真实交易。这一分类为后文『四正』与『当下』的正面主张提供了反面镜像。
