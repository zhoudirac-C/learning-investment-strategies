  subject: 高位科技修复的性质
  topic: 高位科技修复定性为超跌反弹，套利锚定抱团风向标
  timeframe: short-term
  statement: 高位科技现在的修复更多是超跌反弹；没有明确右侧时想做高位科技的短线修复套利，可以锚定中际旭创(300308)和长鑫存储（未上市）——分别对应光模块AI硬件、存储芯片两大热门主线，是资金抱团的风向标；短线一定要注意高抛低吸、设置好止盈止损
  evidence_quote: 高位科技现在的修复，更多的我认为是超跌反弹。那就拿这个德明利举例，上周五不是涨停吗，然后就遇到大量的获利盘砸盘，股价最后负一收。所以说如果没有明确右侧的时候，你想做高位科技的短线修复套利，我认为可以锚定中际旭创还有长鑫，这两个票分别对应就是光模块的AI硬件、存储芯片两大热门主线啊，是资金抱团的一个风向标。但是做短线的话一定要注意高抛低吸，设置好止盈止损，注意风险。
  interpretation: 德明利(001309)涨停后被获利盘砸至负一收盘，是「超跌反弹而非趋势反转」的论据。锚定风向标的作用：抱团票不止跌，高位科技套利就没有安全边际。UP同时表示「有明确右侧的时候实盘号再做也来得及」，体现不抢左侧的纪律。
