- id: claim-20070302-001-i
  source_path: sources/chanlun/lesson_033.md
  source_date: '2007-03-02'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 背驰的中枢角度释义
  topic: 背驰是离开力度弱于前次离开，中枢对离开有相同回拉作用故必然拉回中枢
  timeframe: permanent
  statement: 站在中枢B的角度可对背驰给出另一种释义：对a+A+b+B+c，背驰的大概意思是c段力度比b小；不妨假设b+B+c是一个向上的过程，则b可看成向下离开中枢B、c可看成向上离开中枢B，顶背驰就是最后这个中枢向上离开比向下离开要弱。中枢的特性是对无论向上或向下离开都有相同的回拉作用，既然向下离开都能拉回中枢，更弱的向上离开当然也能拉回中枢：对b+B+c向上的走势构成顶背驰，对b+B+c向下的走势构成底背驰。
  evidence_quote: 对a+A+b+B+c，背驰的大概意思就是c 段的力度比b 的小了。那么，站在B 这个中枢的角度，不妨先假设b+B+c 是一个向上的过程，那么b
    可以看成是向下离开中枢B，而c 可以看成是向上离开中枢B。所谓顶背驰，就是最后这个中枢，向上离开比向下离开要弱，而中枢有这样的特性，就是对无论向上或向下离开的，都有相同的回拉作用，既然向上离开比向下离开要弱，而向下离开都能拉回中枢，那向上的离开当然也能拉回中枢里，对于b+B+c
    向上的走势，这就构成顶背驰，而对于b+B+c 向下的走势，就构成底背驰。
  interpretation: 背驰的动力学本质是离开力度衰减叠加中枢回拉力恒定：背驰后重回中枢不是经验规律，而是中枢回拉机制的结构性推论，这把背驰判断从指标比较升级为对走势结构的推理。
