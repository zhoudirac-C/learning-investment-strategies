  subject: 第三类卖点的大级别背景
  topic: 小级别第三类卖点的操作意义取决于大级别中枢处于上移下移还是震荡
  statement: 同一个小级别第三类卖点，在不同大级别背景下操作意义完全不同：一、大级别中枢上移中，唯一注意的是这卖点扩展出的走势是否改变大级别上移本身，操作意义不大，关键是警戒意义，短差也只是中枢震荡中的操作点；二、大级别中枢下移中，意义只看是否让下移继续，基本没有操作价值，因为好的卖点早已过去；三、大级别中枢震荡中，看是否延伸出大级别第三类卖点，没有这种危险就只是短线震荡机会，而且很可能反而延伸出大级别买点，这在震荡中太常见了。
  evidence_quote: 在一个大级别的中枢上移中，一个小级别的第三类卖点，唯一注意的，就是这个卖点扩展出来的走势，是否会改变大级别中枢上移本身……如果说卖，大级别都中枢下移了，好的卖点估计都过去了N 的N 次方个了……很有可能，一个小级别的第三类卖点后，反而延伸出大级别的买点，这在震荡中太常见了。
  interpretation: 这是本课杜绝一根筋思维主题的具体展开：概念不能脱离走势背景静态套用。多空通杀正是利用买卖点在震荡中轮番转折、模式不断变化，让不同操作模式都被破裂一次来搞乱所有人的舞步。
