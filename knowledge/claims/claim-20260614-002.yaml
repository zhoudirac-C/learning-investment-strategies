  evidence_quote: 你的第二根阳线的收盘价是要大于第一根阴线的开盘价的。那么第二根阳线的开盘价你是要小于第一根阳第一根阴线的收盘价。那么只有满足这两个条件的时候，它第二根阳线的实体也就完全的包裹住了第一根阴线的实体。
