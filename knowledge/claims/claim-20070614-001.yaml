  subject: 线段结束的确认方法
  topic: 趋势中用背驰确认线段结束，其他情况用盘整背驰，突发性事件看第二类买卖点
  statement: 把握线段结束的方法与大级别走势段一样：在趋势中用背驰来确认，其他情况用盘整背驰来确认；如果有突发性事件，就要看第二类的买卖点，其道理是一样的，只是所用到的级别特别小而已。线段中途出现反抽高于前低等情况时不能确定该线段已经完成，还要看后面走势，未完成时不预测其完成。
  evidence_quote: 由此可以知道如何去把握线段的结束：一般来说，线段的结束与大级别的走势段是一样的，在趋势中用背驰来确认，其他情况用盘整背驰来确认，如果有突发性事件，就要看第二类的买卖点，其道理是一样的，只是所用到的级别特别小而已。
  interpretation: 线段级别的结束确认复用整套背驰体系，形成级别无关的统一方法论。未完成的线段不预测其完成，与第60课市场自身没完成时不预期的原则一致。
