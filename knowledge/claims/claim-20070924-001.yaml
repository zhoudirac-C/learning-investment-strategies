  subject: 分型结构的三次心理较量
  topic: 顶分型是买分力三次努力与卖分力三次阻击的结果，如同中枢经三次反复较量
  statement: 一个顶分型之所以成立，是卖的分力最终战胜了买的分力，其中买的分力有三次的努力，卖的分力有三次的阻击。用最标准的已经过包含处理的三K线模型：第一根K线的高点被卖分力阻击后出现回落；第二根K线出现一个更高的高点，但这个高点与第一根K线高点中出现的买分力相比，一定在小级别上出现力度背驰，从而至少制造了第二根K线的上影部分；第三根K线买分力再次攻击，但完全被卖的分力击败，不能成为新高点，在小级别上大致出现一种第二类卖点的走势。一个分型结构的出现如同中枢，都是经过三次的反复心理较量过程，只是中枢用的是三个次级别，所谓一而再、再而三、三而竭；底分型的情况反过来就是。
  evidence_quote: 显然，一个顶分型之所以成立，是卖的分力最终战胜了买的分力，而其中，买的分力有三次的努力，而卖的分力，有三次的阻击……由上可见，一个分型结构的出现，如同中枢，都是经过一个三次的反复心理较量过程，只是中枢用的是三个次级别。所谓一而再、再而三，三而竭，所以一个顶分型就这样出现了，而底分型的情况，反过来就是。
  interpretation: 作者强调分型不是分形：缠论逻辑直接来源于市场走势本身，而不是把分形这个数学分支的研究成果硬套到市场上。分型每一根K线都对应小级别的可检验结构（力度背驰、第二类卖点），心理分析因此可落地为图形验证。
