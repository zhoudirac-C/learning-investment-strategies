  subject: 成交量度量市场分歧
  timeframe: permanent
  statement: 成交量反映市场参与者对当前价格的分歧和筹码交换程度，而不是单纯的资金流入流出或涨跌方向；价格给出多空博弈结果，量能用于检验这个结果是否获得资金认可及其持续性。
  evidence_quote: 成交量它反映的从来不是单纯的资金流入和或者是流出，它反映的是市场参与者之间对于当前价格形成了多大的分歧。所以成交量它是市场分歧的一个度量，而非是方向的指标。
  interpretation: 放量不能直接等同上涨动力强，缩量也不能直接等同动力弱。量价分析的问题是价格变化是否有市场基础，而非用一个量能符号机械预测方向。
