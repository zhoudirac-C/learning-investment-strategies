  action: 4055支撑跌破
  trigger_template: 收盘跌破{threshold}
  interpretation: 5月30日上证4068.57收盘已跌破4055支撑。4055是30分钟底部结构支撑，跌破意味着小级别反弹预期失效，回归调整剧本。需降低仓位，等待新的支撑位确认。
