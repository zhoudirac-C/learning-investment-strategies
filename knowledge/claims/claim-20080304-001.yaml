  subject: 走势必完美的唯一分解含义
  topic: 分型笔线段与走势类型构成递归函数，把任何走势唯一分解
  statement: 所谓走势必完美，就是缠论给出的分型、笔、线段、不同级别走势类型所对应的递归函数，能将行情的任何走势唯一地分解。分型等于递归函数的a0，其设计完全可以随意，如何设计都不会影响唯一分解定理的证明；分型不需要任何假设，只需要符合定义就可以，是否符合只有唯一的答案。一个具备唯一分解定理的理论都是强有力的，缠论由此可以包含所有其他的走势理论并指出其不足，因为它解决了最根本的理论问题即唯一分解。
  evidence_quote: 所谓走势必完美，就是本ID 所给出的分型、笔、线段、不同级别走势类型所对应的递归函数，能将行情的任何走势唯一地分解……分型等于递归函数的a0，这完全可以随意设计，如何设计都不会影响到唯一分解定理的证明……分型不需要任何假设，只需要符合定义就可以，是否符合，只有唯一的答案，不需要任何假设。
  interpretation: 这一条澄清两个常见误解：走势必完美不是预测走势必然如何走，而是结构可分解性定理；分型的定义细节不是理论要害，整天纠缠分型等于没看懂理论。对应用者的结论是把操作方法搞明白即可，数学背景只影响理解深度。
