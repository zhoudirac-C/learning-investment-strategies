statement: "双冰点结构的确认方法：昨日尾盘恐慌盘集中释放+今日低开且红盘家数<1000→双冰点结构确认。其他情景：红盘开盘但<1500→弱修复；红盘>2000→修复偏快需警惕追高。情绪修复路径为：跌停减少→5家以内→完全消灭。"
evidence_quote: "昨日尾盘半小时恐慌盘集中释放，红盘一度压缩至700家。今日情绪判断：低开+红盘<1000→双冰点结构确认；红盘开盘但<1500→弱修复；红盘>2000→修复偏快，警惕追高。情绪修复路径：跌停减少→5家以内→完全消灭。"
interpretation: "UP首次系统化定义'双冰点'概念并给出量化阈值（红盘<1000）。这是情绪周期判断中冰点概念的完整成型——不仅有定义，还有操作含义（双冰点=可保持基础仓位关注修复机会）。同时给出了情绪修复的三阶段路径（跌停减少→5家以内→完全消灭），这是UP情绪判断框架的核心骨架。"
