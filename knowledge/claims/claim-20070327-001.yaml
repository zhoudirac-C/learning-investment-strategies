  subject: 小级别操作换档大级别操作
  topic: 小级别进入遇大级别上涨可自动换档，是否换档视资金与风格而定
  statement: 小级别进入后遇到大级别上涨有两个选择：一、继续按小级别操作，代价是相当累、对精确度要求比大级别高、资金容纳程度低；二、升级为大级别操作基础上部分保持小级别操作，资金比较大的投资者后者更实用。机制上，同级别分解下 Ai 与 Ai+2 之间的盘整背驰会演化出 Ai+3 跌破或升破 Ai 的高低点，相应演化出高一级别的中枢，这保证了在同级别分解下一个小级别的操作可以按一个自动模式换档成高级别的操作。是否换档与时间、操作风格、资金规模有关，但出现明显大级别走好时，换档能获得稳定的大级别波动利益，如同开车根据路况决定档位。
  evidence_quote: 一个小级别的进入，结果出现大级别的上涨，这时候怎么办？这时候有两个选择：一、继续按小级别操作，这样的代价是相当累，而且小级别操作的问题是对精确度要求比大级别高，而且资金容纳程度低；二、升级为大级别操作基础上部分保持小级别操作。对于资金比较大的投资，后者是比较实用的……但这个现象就保证了，在同级别分解下，一个小级别的操作是可以按一个自动模式换档成一个高级别的操作……根据当下的情况去决定是否换档，就如同开车时根据路况等决定档位一样。
  interpretation: 换档机制打通了缠论小级别与大级别操作：高级别中枢由低级别走势生长出来，所以升级不需要重新开始，只需按规则切换分解级别。短线变中线是作者对小资金也建议的用法。
