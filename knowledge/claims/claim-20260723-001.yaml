  statement: 量化标准维持不变：突破4000加至六成仓，突破4050加至满仓，点位随时间推移逐步下调。上证指数能否重回年线上方是本周剩余交易日最值得盯住的变量。若从跌破年线到重新突破耗时不超过10个交易日且最大回撤不超5%，可视作上涨中继震荡。经过前两日大起大落叠加明显缩量，指数波动已趋稳，后续最差以横盘和小幅震荡为主。
