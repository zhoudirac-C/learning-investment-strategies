  subject: 背驰与盘整背驰的关系
  topic: 背驰是最基础的概念，盘整背驰只是其力度分析方法在中枢震荡场景的推广用法
  statement: 背驰有着最基础的意义，盘整背驰只是利用背驰相应的力度分析方法进行的一个推广用法，主要用在与中枢震荡相关的力度比较中。在a+B+c的结构中，a和c的盘整背驰其实都可以看成是B的中枢震荡，虽然a存在时B还没出现，但也不妨这样看。
  evidence_quote: 对于背驰与盘整背驰，前者是有着最基础意义的，而后者，只是利用前者相应的力度分析方法进行的一个推广用法，主要用在与中枢震荡相关的力度比较中。注意，a+B+c 中，a 和c 的盘整背驰，其实都可以看成是B 的中枢震荡，虽然a 存在时，B 还没出现，但也不妨这样看。
  interpretation: 明确两类背驰的层级关系：盘整背驰没有独立地位，是把趋势背驰的力度比较移植到中枢震荡场景，这为中枢震荡差价的高抛低吸提供了理论依据。
