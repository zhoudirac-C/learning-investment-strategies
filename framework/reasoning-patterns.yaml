- pattern_id: sector_rotation_low_risk_arbitrage
  name: 板块轮动低位避险进攻模式
  description: 当高位主线分歧加大时，资金转向超跌低位板块（如医药）进行避险和进攻，通过分析龙头强弱、板块内部分化来筛选补涨机会。
  applicable_themes:
  - 板块轮动
  - 超跌反弹
  - 低位补涨
  - 资金避险
  reasoning_chain:
  - step: 1
    name: 识别主线分歧
    question: 当前市场高位主线是否出现分歧或退潮？
    UP_logic: 观察连板股晋级率下滑、高位股分歧加大，判断短线情绪与指数背离，高位主线风险上升。
    evidence_sources:
    - 连板股晋级率
    - 高位股走势
    - 短线情绪指标
  - step: 2
    name: 锁定低位板块
    question: 哪些板块具备超跌反弹和业绩预期，且资金可能流入？
    UP_logic: 资金在高位主线分歧时选择低位医药板块避险和进攻，核心逻辑是超跌反弹叠加业绩预期。
    evidence_sources:
    - 板块涨幅
    - 涨停家数
    - 资金流向
  - step: 3
    name: 验证龙头强度
    question: 板块内龙头股是否强势？是否有隐患信号？
    UP_logic: 龙头美诺华走势弱于板块、万邦德不及预期，说明板块内部分化，明日大概率前排晋级、后排回落。
    evidence_sources:
    - 龙头股走势
    - 板块内个股表现对比
  - step: 4
    name: 制定操作策略
    question: 如何利用板块分化进行低风险操作？
    UP_logic: 建议关注低位补涨机会，坚决避免追高高位分歧股，因为板块分化后后排回落风险大。
    evidence_sources:
    - 历史板块轮动规律
    - 资金行为模式
  risk_factors:
  - 龙头股转弱导致板块整体退潮
  - 指数回踩超预期拖累板块
  - 地缘冲突等外部冲击改变资金偏好
  confidence_indicators:
  - 板块内多只个股涨停且封板坚决
  - 机构资金明显加仓该板块
  - 板块指数放量突破关键阻力位
  source_raw:
  - sources/raw/财经/复盘：26-04-01：三指收涨科创50涨超3%，智立方奥瑞德富临广联.md
- pattern_id: multi_logic_convergence_qualify
  name: 多逻辑共振板块筛选法
  description: 通过识别同一板块内多个独立且同时发生的驱动逻辑，判断该板块是否具备成为主线的潜力。
  applicable_themes:
  - 化工板块分析
  - 周期板块分析
  - 事件驱动型板块
  reasoning_chain:
  - step: 1
    name: 识别独立驱动逻辑
    question: 该板块内有哪些独立的上涨驱动因素？
    UP_logic: 博主将化工板块涨停潮拆解为有机硅、硫酸产业链、AI电子材料、PVA赛道四个独立逻辑，每个逻辑有各自的事件、供需或政策驱动。
    evidence_sources:
    - 行业新闻
    - 公司公告
    - 地缘政治事件
  - step: 2
    name: 验证逻辑的独立性
    question: 这些驱动因素是否互不依赖、各自成立？
    UP_logic: 博主分别说明有机硅（减排+关停）、硫酸（地缘+供应）、AI材料（国产替代）、PVA（成本优势）的独立来源，证明逻辑之间无重叠。
    evidence_sources:
    - 行业数据
    - 企业产能信息
    - 海外事件
  - step: 3
    name: 评估共振强度
    question: 多个逻辑同时爆发是否形成合力？
    UP_logic: 博主指出多个逻辑同时驱动同一板块，导致涨停潮，且每个逻辑都有龙头股批量涨停，形成板块内多点开花。
    evidence_sources:
    - 涨停个股名单
    - 板块涨幅数据
  - step: 4
    name: 判断主线持续性
    question: 多逻辑共振是否意味着该板块具备持续性主线潜力？
    UP_logic: 博主将化工板块称为“日内最强主线”，并后续在策略中建议“聚焦龙头、跟踪价格与订单数据”，隐含多逻辑共振是主线持续性的重要信号。
    evidence_sources:
    - 板块成交额
    - 资金流向
  risk_factors:
  - 逻辑中某个驱动因素被证伪或消退
  - 多个逻辑同时弱化导致共振消失
  - 市场缩量导致资金无法支撑多逻辑板块
  confidence_indicators:
  - 板块内涨停个股数量显著高于其他板块
  - 每个逻辑都有明确的龙头股且走势强劲
  - 板块成交额持续放大
  source_raw:
  - sources/raw/财经/复盘：26-04-07：宽幅震荡缩量收红，化工涨停潮101只涨停，AI内部分化.md
- pattern_id: emotion_turnaround_confirm
  name: 情绪拐点确认与主线筛选
  description: 通过逆势异动个股确认短线情绪拐点，再结合板块容量与主线结构判断风格切换真伪，最后制定低吸策略。
  applicable_themes:
  - A股短线情绪周期
  - 板块轮动与主线判断
  - 混沌期交易策略
  reasoning_chain:
  - step: 1
    name: 识别情绪拐点信号
    question: 当前市场情绪是否已出现拐点？
    UP_logic: 午后指数走弱但短线情绪逆势回暖（华电双雄异动、金螳螂回封），打破指数与情绪同步负反馈，提前锁定情绪修复预期。
    evidence_sources:
    - 华电能源4连板
    - 华银电力涨停
    - 金螳螂回封
  - step: 2
    name: 判断风格切换真伪
    question: 情绪载体是否具备板块性主线特征？
    UP_logic: 当前情绪载体仅限抱团个股，氮气/工业气体题材容量过小，无法承接主流资金，属热钱过渡性行为，不支持风格切换。
    evidence_sources:
    - 工业气体板块容量小
    - 无明确板块性主线
  - step: 3
    name: 确认拐点修复条件
    question: 拐点性修复何时确认？
    UP_logic: 需满足两个条件：大盘指数共振 + 新强势板块形成完整阵型，二者缺一不可。
    evidence_sources:
    - 大盘指数走势
    - 新板块阵型完整性
  - step: 4
    name: 制定低吸策略
    question: 在混沌期如何选股与操作？
    UP_logic: 执行俯卧撑式买阴卖阳，选AI硬科技主线抗跌标的或日内冲高回落品种，要求短期无持续大涨、无高位筹码松动风险。
    evidence_sources:
    - 主线人气股日内中阴线调整
    - 日内新启动因大盘拖累冲高回落
  risk_factors:
  - 情绪拐点信号被次日走势证伪（如华电双雄次日大跌）
  - 大盘继续缩量下跌，无共振信号出现
  confidence_indicators:
  - 逆势异动个股次日继续走强并带动板块扩散
  - 新强势板块出现多只涨停且形成梯队
  source_raw:
  - sources/raw/财经/复盘：26-04-28：创业板4连阴，情绪拐点已现.md
- pattern_id: sector_rotation_upstream_diffusion
  name: 主线扩散与上游材料筛选
  description: 从主线板块内部资金溢出和风格切换出发，识别未充分定价的上游材料/利基细分，并验证供需缺口与国产替代逻辑。
  applicable_themes:
  - AI算力产业链
  - 半导体材料
  - 光通信上游
  - 先进封装材料
  reasoning_chain:
  - step: 1
    name: 识别主线板块内部分化
    question: 当前主线板块内部哪些子方向已经涨幅过高、业绩充分兑现？
    UP_logic: 观察4月涨幅过高的光模块龙头（中际旭创、新易盛）滞涨，资金不再聚焦已充分兑现业绩的模块龙头。
    evidence_sources:
    - 板块涨幅数据
    - 龙头个股走势对比
  - step: 2
    name: 定位资金扩散方向
    question: 资金从主线龙头溢出后流向哪些未充分定价的细分赛道？
    UP_logic: 资金转向AI上游核心材料、未充分定价的细分赛道，如先进封装材料（T布、锡焊膏）、光通信上游材料（光纤光缆、硅光芯片）。
    evidence_sources:
    - 异动标的列表
    - 资金流向数据
  - step: 3
    name: 验证供需缺口与涨价逻辑
    question: 这些细分赛道是否存在明确的供需缺口或涨价周期？
    UP_logic: 先进封装材料：AI驱动需求非线性增长，2027年供给缺口达27%，日东纺垄断85%市场份额，国产替代窗口打开。锡焊膏：高速光模块封装迭代带动焊点数量提升+高端焊膏涨价。
    evidence_sources:
    - 行业供需报告
    - 涨价公告
    - 市场份额数据
  - step: 4
    name: 确认国产替代窗口
    question: 国内厂商是否具备替代条件或已进入替代进程？
    UP_logic: 宏和科技等核心标的获资金重点关注（T布替代）；唯特偶、华光新材异动（锡焊膏国产替代）。
    evidence_sources:
    - 个股异动数据
    - 国产替代进展公告
  risk_factors:
  - 主线板块整体退潮导致扩散方向失去支撑
  - 供需缺口预期落空或涨价周期提前结束
  - 国产替代进度不及预期
  confidence_indicators:
  - 主线核心标的（如中国长城）封单强度高、未开板
  - 扩散方向标的出现批量涨停或连续放量
  - 行业催化事件（如英伟达与康宁合作）持续落地
  source_raw:
  - sources/raw/财经/复盘：26-05-06：CPO商业化元年+风格切换确认.md
- pattern_id: upstream_bottleneck_equipment
  name: 上游瓶颈设备筛选法
  description: 从下游需求爆发出发，沿着产业链向上游寻找产能扩张周期最长、壁垒最高的瓶颈环节，锁定不可替代的设备供应商。
  applicable_themes:
  - 光通信
  - PCB产业链
  - 半导体设备
  - 新能源材料
  reasoning_chain:
  - step: 1
    name: 确认下游爆发
    question: 哪个下游环节需求正在爆发？
    UP_logic: 从800G/1.6T光模块或AI服务器PCB需求激增出发，确认下游高景气度。
    evidence_sources:
    - 行业报告
    - 龙头公司订单公告
  - step: 2
    name: 识别上游瓶颈
    question: 上游哪个环节产能扩张最受限？
    UP_logic: 寻找产能扩张周期长（如织布机交付18-24个月）、全球产能集中的环节，如电子布、磷化铟。
    evidence_sources:
    - 设备交付周期数据
    - 全球产能分布数据
  - step: 3
    name: 锁定核心设备商
    question: 哪个设备供应商是扩产的'卡脖子'环节？
    UP_logic: 寻找该瓶颈环节中市占率极高（如国内90%+）、技术壁垒高（如独家适配超细纱加工）的设备商。
    evidence_sources:
    - 公司市占率数据
    - 技术认证信息
  - step: 4
    name: 验证订单与财务
    question: 订单和财务数据是否支持扩产逻辑？
    UP_logic: 检查是否已签订史上最大额订单、营收增长、亏损收窄、经营现金流转正等信号。
    evidence_sources:
    - 公司公告
    - 季报/年报
  risk_factors:
  - 下游需求增速放缓或见顶
  - 新进入者打破设备垄断
  - 公司订单交付不及预期
  - 技术路线变更导致设备需求消失
  confidence_indicators:
  - 下游龙头宣布大规模扩产计划
  - 设备商获得重复订单或长协
  - 设备商毛利率提升或预收款增加
  - 行业政策明确支持该环节国产替代
  source_raw:
  - sources/raw/财经/复盘：26-05-11：周末复盘补充，一超多强格局，电子布卓郎智能，Token工厂，算力网国常会.md
- pattern_id: ai_upstream_material_screening
  name: AI上游材料筛选法
  description: 从AI算力主线出发，通过技术迭代、供需缺口、价值量提升三个维度筛选上游核心材料标的
  applicable_themes:
  - AI算力产业链
  - 半导体上游材料
  - 光通信
  reasoning_chain:
  - step: 1
    name: 识别主线方向
    question: 当前市场主线是什么？
    UP_logic: 确认算力硬件为市场主线，并判断其处于分化休整阶段，但上游物料逆势领涨，说明资金向上游迁移
    evidence_sources:
    - 盘面板块涨幅排名
    - 资金流向数据
  - step: 2
    name: 筛选上游材料
    question: 哪些上游材料具备逆势领涨特征？
    UP_logic: 从算力硬件中细分出陶瓷基板、磷化铟、电子布、光纤等具体材料，并关注事件催化（如中瓷电子调研纪要、蒙娜丽莎连板）
    evidence_sources:
    - 个股涨停/连板数据
    - 调研纪要
    - 行业新闻
  - step: 3
    name: 验证供需与价值
    question: 这些材料是否有供需缺口或价值量提升逻辑？
    UP_logic: 以联瑞新材为例，指出AI高速基板迭代导致球形二氧化硅价值量与毛利率显著提升；特发信息指出全球光纤供需缺口延续至2027年下半年
    evidence_sources:
    - 机构研报
    - 行业供需数据
    - 公司公告
  - step: 4
    name: 确认技术路线
    question: 材料是否绑定主流技术路线？
    UP_logic: 光莆股份强调与台积电同源的EPIC技术路线，海光信息强调国产唯一x86路线，确保技术路径的确定性和稀缺性
    evidence_sources:
    - 公司技术公告
    - 行业技术路线图
  risk_factors:
  - 主线题材轮动过快导致上游材料补跌
  - 技术路线被替代或迭代速度不及预期
  - 供需缺口提前修复导致涨价逻辑失效
  confidence_indicators:
  - 板块内出现多只连板/涨停个股形成板块效应
  - 有明确的事件催化（如光博会）临近
  - 机构研报同步推荐相关标的
  source_raw:
  - sources/raw/财经/复盘：26-05-12：指数缩量震荡，算力上游逆势领涨，电力电网AI补涨，光博会催化临近.md
- pattern_id: ai_hardware_chain_qualify
  name: AI硬件产业链景气传导筛选
  description: 从AI算力需求爆发出发，沿产业链上游物料、设备、封装等环节逐一筛选受益标的，并验证业绩与产能数据。
  applicable_themes:
  - AI硬件
  - 半导体产业链
  - 算力基建
  - 电子材料
  reasoning_chain:
  - step: 1
    name: 需求源头确认
    question: AI算力需求是否出现爆发性增长信号？
    UP_logic: 引用Token消耗周度数据（2.1T→24.5T，增幅280%）及大厂资本开支加速转化为业绩，确认需求爆发。
    evidence_sources:
    - Token消耗周度数据
    - 阿里云/腾讯云提价公告
    - 协创数据/利通电子Q1业绩
  - step: 2
    name: 供需缺口定位
    question: 产业链哪个环节出现供给瓶颈？
    UP_logic: 指出原厂产能被HBM抢占导致普通内存/闪存缺货至2027年，合约价环比大涨（DRAM 58~63%，NAND 70~75%）。
    evidence_sources:
    - DRAM/NAND合约价环比数据
    - 原厂产能分配信息
  - step: 3
    name: 增量环节识别
    question: 新技术架构带来哪些纯增量环节？
    UP_logic: Rubin架构引入Midplane/CPX载板/正交背板等纯增量环节，M9覆铜板加速钻针磨损，高长径比钻针需求跳跃式放量。
    evidence_sources:
    - Rubin架构技术资料
    - PCB企业资本开支增速182%
    - 头部5家PCB设备净利+124%
  - step: 4
    name: 受益标的筛选
    question: 哪些国内企业具备稀缺供应能力？
    UP_logic: 筛选国内少数具备高端钻针生产能力的企业（鼎泰高科、金洲精工），以及唯一可提供M6/M7/M8全系列PPO树脂的圣泉集团。
    evidence_sources:
    - 企业产能数据
    - 产品系列覆盖情况
  - step: 5
    name: 业绩验证
    question: 受益标的业绩是否已兑现？
    UP_logic: 引用圣泉集团PPO产线满产、金洲精工月产能突破8000万支、中金岭南铟锭产量同比+757%等数据确认业绩落地。
    evidence_sources:
    - 圣泉集团满产公告
    - 金洲精工产能数据
    - 中金岭南产量数据
  risk_factors:
  - AI需求增长不及预期导致供需缺口收窄
  - 美国芯片出口政策进一步收紧影响产业链
  - 行业竞争加剧导致产品价格下降
  confidence_indicators:
  - 大厂资本开支持续上调
  - 合约价连续环比大涨
  - 受益企业产能满产且扩产
  source_raw:
