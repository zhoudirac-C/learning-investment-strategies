  subject: 完全分类与当机立断
  topic: 机会不是预测而是完全分类下的必然边界，任何当下都可列出必然出现的机会
  statement: 学本ID理论第一层次就是要达到当机立断。机会是可以预先分析的，但这分析不是预测，而是建立在完全分类基础上的边界分划，这分划完全来自理论的纯数学构造，其唯一性与精确性保证了分类与边界的当下确认性。任何一个当下，都可以根据理论马上给出后面必然要出现的机会，市场的机会与理论的输出严格一一对应。之后面临的只是选择问题：根据自己当下的心情、资金等等，选择介入的机会，放弃不想介入的机会；如果想搞，就需要把通道的、资金的、一切的安排都安排好，关键要把退出的边界条件也设置好，然后等待机会的显现，当机立断。
  evidence_quote: 机会，是可以预先分析的，但这分析，不是预测，而是建立在完全分类基础上的边界分划……任何一个当下，你都可以根据本ID 的理论马上给出后面必然要出现的机会……注意，任何的机会，必然在本ID 理论的输出中。市场的机会与本ID 理论的输出，是严格一一对应的……然后关键要把退出的边界条件也设置好。
  interpretation: 操作流程三步：第一时间把理论给出的机会反应出来、按自身情况选择、设好退出边界等待显现。T+1条件下设置退出条件还要参考机会出现的时间，早上出现的买卖点可能当天买了卖不掉，下午的胆子可以大点。
