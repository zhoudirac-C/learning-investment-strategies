  subject: 零投入资金管理
  topic: 第一笔钱运作好后把本拿走，用利润滚动，投入一定不能无限增加
  statement: 对于市场有一个观点：市场就是要0投入去赚钱。给市场众生的第一忠告：把你的第一笔钱运作好，然后把本拿走，最后把这利润变成巨大的数字，这才是市场中的真正操作。投入市场的钱一定不能无限增加，如果第一笔投入都能赚到钱，就没有追加的必要；问题不是投入的多少，而是技术与操作，只要有稳定的技术和操作，初始投入多少根本不重要，就算只有1万元，10次翻倍操作后也是1000万，即使开始有1000万元，10次连续亏损后也没有多少钱了。市场上的真正成功是以十年为单位的，一笔0成本、0投入的钱，让你在市场中无比轻松。
  evidence_quote: 市场，就是要0 投入去赚钱……把你的第一笔钱运作好，然后把本拿走，最后把这利润变成巨大的数字，这才是市场中的真正操作……你投入市场的钱，一定不能无限增加……问题不是投入的多少，而是技术与操作……市场上的真正成功，是以十年为单位的。
  interpretation: 与第87课零成本筹码原则同构，一个对坐庄资金一个对个人资金：本金抽走后心态与风险承受力完全不同。实践起点是用一笔绝对不影响生活的钱操作，因贪婪而不断加码投入是作者点名的危险行为。
