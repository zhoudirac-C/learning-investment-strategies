  claim_type: market-cycle
  subject: 调整期1到2个月仓位策略
  timeframe: trend
  statement: 这一轮调整时间差不多是1-2个月：调整期内，国产替代的回撤可控性更强，是可以拿着穿越波动的；AI硬件只能做美股企稳后的右侧弹性；商业航天介于两者之间，等IPO落地后看切换。完全没有理由单边押注，科技内部的对冲比传统科技对防御的哑铃更贴合当前资金行为。
  evidence_quote: 上周的周复盘就说过，这一轮调整时间差不多是1-2个月：调整期内，国产替代的回撤可控性更强，是可以拿着穿越波动的；AI硬件只能做美股企稳后的右侧弹性，调整期内任何左侧加仓，本质上都是在赌别人的市场；商业航天则介于两者之间，等IPO这只靴子落地，再看它切换阵营。在这样的情况下，完全没有理由单边押注——既然资金不出科技，科技内部的对冲，比传统'科技对防御'的哑铃更贴合当前的资金行为。
  interpretation: UP重申调整周期1-2个月，并给出了三类硬科技的仓位应对框架：国产替代可拿着穿越（回撤可控）、AI硬件只做右侧弹性（左侧本质是赌美股）、商业航天夹在中间等IPO落地。核心观点是'科技内部对冲'优于'科技vs防御'的哑铃策略，因为资金没离开科技。
