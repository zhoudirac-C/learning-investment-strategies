- id: claim-20070518-001-b
  source_path: sources/chanlun/lesson_052.md
  source_date: '2007-05-18'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 背驰级别不小于转折级别
  topic: 背驰的级别一定不小于转折的级别，本级别顶背驰后必然下跌或扩展为超级别盘整
  statement: 背驰的级别一定不小于转折的级别，这是市场预测的最基础手段。据此任何本级别下跌及本级别以上的盘整都没必要参与：例如30分钟级别的操作者，当一个30分钟顶背驰出现后要绝对退出，因为后面必然是一个30分钟级别下跌或扩展成30分钟级别以上的盘整，这是被理论绝对保证的预测，这才是真正的预测。
  evidence_quote: 而背驰的级别一定不小于转折的级别，是市场预测的最基础手段。例如，你是一个30 分钟级别的操作者，那么，任何30 分钟级别下跌及30 分钟级别以上的盘整，你都没必要参与。因此，当一个30 分钟的顶背驰出现后，你当然就要绝对退出……就是后面必然是一个30 分钟级别下跌或扩展成30 分钟级别以上的盘整，这就是最有用、最绝对的预测。
  interpretation: 这条给出背驰的可操作推论：退出不是概率判断而是级别保证，与第49课不参与操作级别下跌与超过操作级别盘整的习惯互为表里。底背驰的情况反过来即是买入依据。
