  subject: 大资金阻击原则
  topic: 阻击在低位大级别第三类买点进行较安全，前提是资金绝对自由且控制好量
  statement: 大资金不想变庄家又要资金利用率高，阻击一般在低位的大级别第三类买点进行比较安全：第一类买点不适合，先进去大家都看着你会找机会吃你；第二类买点可以，但一般采取温柔的办法慢慢来；第三类买点介入要求有一定功力。安全性的依据：低位第三类买点位置庄家已经货不少、成本还在附近，大力打压时你有实力在低位顶住，庄家不可能亏钱把所有货倒给你；阻击位置不能与庄家成本相差太远。阻击的前提：资金必须绝对自由、没有期限，一笔自有的、没有利息压力的资金是阻击最安全的保障；干耗也不怕，不断弄短差把成本降下来。阻击一定要控制好量，最失败的阻击就是阻击成了庄家。
  evidence_quote: 一般来说，这种阻击，在一个低位的大级别第三类买点进行是比较安全的，首先，第一类买点不适合……这样的前提是资金必须绝对自由、没有期限。一笔自有的，没有利息压力的资金，是阻击的一个最安全的保障。阻击一定要控制好量，最失败的阻击就是阻击成了庄家。
  interpretation: 把三类买点按大资金进场的隐蔽性与安全性排序：一买暴露、二买温和、三买高效但要求功力。核心约束是资金性质（自有资金、无期限、无利息）与仓位上限（不成庄），这是三类买点理论在大资金场景的应用边界。
