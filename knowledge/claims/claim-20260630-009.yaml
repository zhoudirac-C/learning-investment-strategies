  subject: 刺透与乌云的跳空反包陷阱
  timeframe: permanent
  statement: 两类形态会被反向利用：刺透后第三日跳空低开并跌破第二日最低点（刺透+向下跳空缺口），是空方诱多，目的是让多头进场后再次砸盘、集中套牢盘；乌云后第三日跳空高开并站上第二日最高点（乌云+向上跳空缺口），是多方诱空，目的是让空头进场后再度拉升、打爆空头。
  evidence_quote: 出现刺透之后，它第三天跳空低开，跌破了第二天的最低点，形成了刺透加跳空缺口下跌，那么这其实就是空方的一个诱多。刺透是为了让多头进场，然后再次砸盘，目的就是让套牢盘更加集中。……出现乌云之后，第三天跳空高开，站在了第二天最高点……那么这就是多方的诱空。
  interpretation: 第三日的跳空缺口是最强否决信号：它把「力量已切换」的叙事直接反转，见到即按失败处理，不补仓、不摊薄。
