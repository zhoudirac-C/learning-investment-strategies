  subject: 走势必完美
  topic: 所有图形必然完成，分型可修改恰恰证明图形未完成
  statement: 缠论的关键不是中枢、走势类型，而是走势必完美，这才是理论的核心：所有图形必然完成。分型在当下可以暂时确定、之后被修改，但可修改性恰恰证明图形没完成——一旦完成的图形，修改就不可能了。这个可修改性反而是对走势判断极为有利的性质：利用图形未完成的性质，在理论框架下只剩极少的可能，这些可能成为综合判断的关键条件，使走势的边界条件极端明确与狭小，且这是百分百的纯理论保证，与概率无关。分型、笔、线段在月线图上的划分标准与1分钟图一样，只是显微镜精度超低、只能看大概，但这个大概是最实质性的大方向。分型成笔的两条规范：顶和底之间至少有一根K线；顶必须接着底、或底必须接着顶。
  evidence_quote: 一旦完成的图形，这修改就不可能了。分型可修改，证明图形没完成……但所有图形必然完成，走势必完美。如何才能完美，这样，在理论的框架下，只有极少的可能，而这些可能，就成为综合判断的关键条件。然后根据各级别图形的未完成性质，就可以使得走势的边界条件极端的明确与狭小，这对具体操作，就是极为有利的。注意，这可和概率无关，是百分百的纯理论保证，最终所依据的，就是在本ID 理论最早反复强调的走势必完美原则。其实，本ID 的理论的关键不是什么中枢、走势类型，而是走势必完美，这才是本ID 理论的核心。
  interpretation: 可修改性不是缺陷而是信息：分型被修改等于确认走势未完成。课内示范：上海指数月线第三段要成段至少三笔，当时连一笔都没走完，故即使该笔走完、调整后至少还有一个向上的笔，行情幅度由此可测；2245到998点区域的类中枢不破则构成类第三类买点，作历史案例。
