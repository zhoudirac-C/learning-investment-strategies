  subject: 长期持股的唯一理由
  topic: 长期持有股票的唯一理由是长期买点出现后长期卖点还没到来
  statement: 任何股票如果是因为有价值而持有，都不过是唬人的把戏。长期持有某种股票的唯一理由就是：一个长期的买点出现后，长期的卖点还没到来。站在这个角度，年线图就是最长线的图，一个人大概只能经历七八十根年K线，一个年线的第一类买点加一个年线的第一类卖点基本就是全部，把握好这两点比任何价值投资的人都要牛。
  evidence_quote: 任何股票，如果是因为有价值而持有，那都不过是唬人的把戏。长期持有某种股票的唯一理由就是，一个长期的买点出现后，长期的卖点还没到来。站在这个角度，年线图就是最长线的图了，因为任何一个人大概也就能经历70、80 根的年K 线，一个年线的第一类买点加一个年线的第一类卖点，基本就没了。把握好这两点，比任何价值投资的人都要牛了。
  interpretation: 把长期持有从价值信仰改写成买卖点纪律：持有期长短不决定对错，决定对错的是对应级别买卖点是否出现。本课其余内容为针对基金的攻击性时评与2007年2月市场评论，属时效性内容，未提取。
