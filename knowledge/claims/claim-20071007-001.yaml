- id: claim-20071007-001-b
  source_path: sources/chanlun/lesson_084.md
  source_date: '2007-10-07'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 中枢定义的递归结构
  topic: 递归定义的起始程序可随意设置，分型只是启始程序可被收盘价或成交量等替代
  statement: 中枢定义的关键在于定义的递归性。一般的递归定义由两部分组成：一、f1(a0)=a1，即最低级别中枢、走势类型的构造规则；二、f2(an)=an+1，即最低级别以上的中枢过程规则。关于第二条的规则一直没有任何改变，而关于第一条其实可以随意设置任何的，都不会改变中枢定义的递归性，而且两条可以是完全不同的两个函数。分型只是中枢与走势级别递归定义的一个启始程序，甚至可以说并不是缠论中必然需要的东西，完全可以用别的定义去取代，例如用收盘的价位去定义顶分型、底分型结构，也可以用成交量给出相应的递归开始部分，只要能保证分解的唯一性就可以。
  evidence_quote: 分型只是中枢与走势级别递归定义的一个启始程序，甚至可以说，并不是本ID 理论中必然需要的东西，其目的，不过是为了中枢等的递归性定义中给出其最开始的部分，完全可以用别的定义去取代。例如，我们可以用收盘的价位去定义顶分型、低分型结构，也可以用成交量给出相应的递归开始部分，只要能保证分解的唯一性，就可以。……关于第二条的中枢过程规则，是一直没有任何改变的，而关于第一条，其实，可以随意设置任何的，都不会改变中枢定义的递归性。
  interpretation: 很多人搞不清楚中枢正是因为不懂这一点：分型、线段只是构造最低级别a1的一套可选f1，级别以上的f2规则才是中枢定义的本体。这解释了体系的可扩展性，也划清了分型工具在理论中的从属地位。
