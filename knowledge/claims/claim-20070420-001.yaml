  subject: 第三类卖点后的离开与回补节奏
  topic: 第三类卖点是理论保障的最后离开机会，卖出后耐心等待理论买点回补
  statement: 跌破5日线后的反抽若构成对前一日中枢的第三类卖点，就是被理论保障的最后离开机会；其后在一个下跌里，除了最后那一个位置，所有的卖出都是对的，但那是在赌不是最后的位置，与理论无关。卖出后若走势很快拉起来，自然会有一个符合理论的买点出现，既然已经卖出就耐心等待，让市场自己去选择。回补早了很正常，以后多总结经验提高技术精度即可，但节奏是重要的：站在小级别操作角度，补早了也比没走傻看着强。操作级别决定应对尺度：按日线级别操作的，这种震荡根本无须理会，日线卖点没出现就等出现再说；按周线级别操作的大资金更无所谓。
  evidence_quote: 跌破5 日线后有一个反抽，在11 点08 刚好构成对前一天中枢的第三类卖点，这就是最后的、被本ID 理论所保障的离开机会。那么，后面去走，就完全与本ID 的理论无关了，在一个下跌里，除了最后那一个位置，所有的卖出都是对的，但这和本ID 的理论无关，这类似赌博，就赌不是最后的位置……站在小级别操作的角度，就算你补早了，也比没走傻看着强……如果是按日线级别操作，那这些震荡根本无须理会。
  interpretation: 这条划出理论保障与赌博的边界：第三类卖点之内是理论，之后是概率。同时确立回补原则——节奏优先于精度，回补错误是技术问题，不走是节奏错误，性质更严重。20070419的暴跌是分析案例。
