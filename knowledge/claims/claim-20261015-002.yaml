- id: claim-20261015-002-i
  claim_type: methodology
  subject: 救市三板斧流程
  timeframe: short-term
  statement: 救市（放粮赈灾）遵循三板斧流程：买大金融与中字头、买宽基指数ETF、开会发利好。
