  topic: 周五市场大幅分化
  source_path: sources/raw/财经/复盘：26-05-31：科技震荡消化拥挤，被动元件全面进入周期上行.md
  source_date: 2026-05-31
  source_type: 复盘
  extracted_at: 2026-05-31
  claim_type: market-cycle
  subject: 科技主线震荡消化拥挤，不切换；低位方向缺增量资金时是反弹非反转
  timeframe: short-term
  statement: 周五市场大幅分化，防御品种涨幅居前。在存量博弈环境下，科技见顶+消费见底的顺畅叙事难以认同；主线（硅基通胀/AI算力）地位无可替代，近期震荡只是消化拥挤而非切换。低位方向若没有增量资金，大概率是反弹而非反转
  evidence_quote: 在存量博弈环境下，科技见顶+消费见底的'顺畅叙事'难以认同；主线（硅基通胀/AI算力）地位无可替代，近期震荡只是消化拥挤，而非切换。存量环境下，主线退潮时支线并不会因此受益（资金属性反直觉）；超跌方向若没有增量资金，大概率是'反弹'而非'反转'。
  interpretation: 主线判断的核心逻辑：①周五科技与防御的极端分化引发"风格切换"讨论，但博主认为这种叙事在存量环境下不成立；②资金属性反直觉——主线退潮时资金不会自动流向支线，而是可能一起下跌；③除AI外其余板块微观调研下确实没有景气度，这是本轮牛市根基；④科技震荡是因为前期涨幅过大需要消化拥挤，但没有任何板块能替代硅基通胀的主线地位；⑤
    tactical应对：增厚止盈安全垫，等图形与趋势再度走好时卷土重来。
