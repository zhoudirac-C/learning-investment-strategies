  subject: 线段必须被线段破坏
  topic: 单纯一笔不能破坏线段，线段被线段破坏才算真破坏
  statement: 线段必须要被破坏才算结束，但线段必须要被线段破坏才算是真破坏，单纯的一笔是不能破坏线段的，这就避免了一些特偶然因素对走势的干扰。
  evidence_quote: 线段必须要被破坏才算结束，但必须要强调的是，线段必须要被线段破坏才算是真破坏，单纯的一笔是不能破坏线段的，这就避免了一些特偶然因数对走势的干扰。
  interpretation: 这是线段破坏的总原则，过滤单笔毛刺以保证线段级别结构的稳定性。67课用特征序列将其精确化，作者自述67课就是把这条充要条件精确化，以后线段划分都以精确定义为基础。
