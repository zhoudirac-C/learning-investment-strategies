  interpretation: UP拆解谷歌CAPEX资金分配比例以精细化受益环节筛选。60%服务器意味着服务器（及相关配套供应链）受益最大，40%数据中心与网络设备对应的是传输（光模块/光纤）、供电（电源/UPS/变压器）等环节。这提供了更精确的选股指引——优先服务器链，其次光模块和电力配套。
