- pattern_id: gator-ch19-stop-profit-loss-winrate
  school: gator
  name: 止盈止损与胜率赔率效率
  chapter: 19
  description: 鳄鱼派（gator school）第19章：止盈止损与胜率赔率效率。 IF 波段交易 THEN 单笔止盈目标 5%–10% IF 趋势交易 THEN 单笔止盈目标 20%–30%（基础模型：止盈30%/止损-8%/持有上限2个月） IF 长线投资 THEN 单笔止盈目标 30%–50% IF 触及 止盈/止损/持有时间上限 三者之一 THEN 本笔交易结束 涉及：19.1 分档目标与三种结局；19.2 投机四原则（20250524）[核心]；19.3 胜率赔率效率的不可能三角（20260328）[核心]；19.4 止盈执行的补充（2026-09）`[次要]`。 用于鳄鱼派资金生态位与规则体系的判断。
  trigger:
  - IF 波段交易 THEN 单笔止盈目标 5%–10%
  - IF 趋势交易 THEN 单笔止盈目标 20%–30%（基础模型：止盈30%/止损-8%/持有上限2个月）
  - IF 长线投资 THEN 单笔止盈目标 30%–50%
  - IF 触及 止盈/止损/持有时间上限 三者之一 THEN 本笔交易结束
  - IF 出现其他任何结果（含中途小赚离场） THEN 判定执行失败
  - IF 做波段/打野 THEN 持有时间上限 25 个交易日，到期不论盈亏都处理
