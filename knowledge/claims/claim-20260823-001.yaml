  subject: 强趋势股由合力资金持续进场形成
  timeframe: permanent
  statement: 强趋势股形成于短线合力资金持续进场：趋势资金看到突破后进场、短线资金追随强度、板块资金向核心集中、踏空资金回调中补仓、中线资金提高配置、量化和趋势模型顺势增加敞口；盘口呈现连续拉升、分时流畅、回落承接迅速、高点不断抬升、突破很少反复犹豫的特征。判断股票是否真正进入强趋势，要看有没有新的合力资金持续进场；如果每天都在涨但分时越来越拖沓、每次突破艰难、上涨主要靠尾盘偷袭，则趋势质量很可能已在下降。
  evidence_quote: 那么趋势资金在看到突破后进场，短线资金呢就追随强度，整个板块资金向核心集中，踏空资金在回调当中补仓，中线资金呢继续提高配置，量化和趋势模型顺势增加敞口。这些资金的共同作用就是让盘口会呈现出非常明显的一个特征，就是连续拉升、分时流畅、回落承接迅速、高点不断抬升。
  interpretation: 强趋势的本质定义是"新增合力资金持续进场"而非"价格在涨"——价格涨幅可以靠存量维持，分时流畅度与突破效率才是增量资金的指纹。
