  subject: 最小中枢为何用线段构建
  topic: 笔构成的最小中枢稳定性极差，线段不受偶尔单笔错误影响，特征序列分型提供三次确认
  statement: 不能用笔构成最小中枢的原因：实质上可以设计用笔当构成最小中枢零件的程序，但这样构造出来的系统稳定性极差，因为一笔的基础是顶和底分型，而一些瞬间的交易（例如突然有人打错单或给老鼠仓送货）就足以影响其结构，全天走势的分析就大变样了。而由线段构成最小中枢则不存在这个问题：一个线段的改变不会因为一个偶尔一笔的错误而改变，线段受偶尔性的影响比较少。从心理上看，偶尔因素只要不被再次确认，就证明其对原来的心理合力没有大影响；线段破坏本身反应着一种微妙的心理结构的变化，特征序列分型的引入本质上就是勾勒这种变化，如同一般分型要三次确认才能构成，有效性极大增加。三个K线的折腾可以决定一笔的转折，一个线段的破坏转折则需要三个特征序列分型的折腾，市场买卖双方都有足够的时间去反应，体现出的合力痕迹具有了一定的延续性。
  evidence_quote: 一笔的基础是顶和底分型，而一些瞬间的交易，就足以影响其结构……而由线段构成最小中枢，则不存在这个问题。为什么？一个线段的改变，不会因为一个偶尔一笔的错误而改变，也就是说，线段受偶尔性的影响比较少……特征序列分型的引入，本质上就是去勾勒这种心理结构的变化的。就像一般的分型，三次的确认才能构成，特征序列的分型，本质上也是一样的，这样的确认，其有效性就极大增加了……如果说三个K 线的折腾就可以决定一笔的转折，那么一个线段的破坏转折，就需要三个特征序列分型的折腾，这样，市场买卖双方都有足够的时间去反应，从而使得体现出的合力痕迹，当然具有了一定的延续性。
  interpretation: 这是缠论体系构建的关键设计决策：最低级别零件的选择标准是抗噪音能力而非颗粒度，稳定性优先于灵敏度，这是整套递归定义可靠的前提。线段至少由三笔组成，也使转折后的新线段能让合力得到充分体现，对比两个不同方向的线段，买卖双方的心理与实力对比一目了然。
