  subject: 基准量公式划分四级量能
  timeframe: permanent
  statement: UP以五日均量、十日均量和二十日均量的算术平均作为基准量，并按转写所述系数分级：高于基准量的1.382倍为明显放量，上涨时称推升量而下跌时称出货量；0.618倍至1.382倍之间为正常交易；低于0.618倍为ASR所称凹动量；低于基准量一半为ASR所称极动量。
  evidence_quote: 主要就是五日均量，然后再加上十日均量，再加上二十日均量，它除以三，我们获得一个基准量……上轨呢就是基准量乘以一点三八二，那么下轨呢就是基准量乘以零点六幺八……极动量，也就是说成交量它小于基准量乘以零点五的一个区域。
  interpretation: 这些数值均为课程转写明确给出的工具参数，不是本次自行创造的阈值；凹动量与极动量按ASR原词保留，未用画面核对术语和公式，实盘采用前应回看课件。
