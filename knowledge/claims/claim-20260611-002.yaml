  subject: 半导体材料对日替代主线
  timeframe: trend
  statement: 半导体材料板块核心驱动是自主可控与对日替代逻辑的集中强化。国内晶圆厂（长存、长鑫、中芯(688981)、华虹(688347)）扩产正系统性重构供应链——能国产的用国产，暂不能替代的转向韩国，中韩蜜月、挤出日系的格局初步成形。
  evidence_quote: 今日半导体材料板块的核心驱动，是"自主可控＋对日替代"逻辑的集中强化。产业调研反馈显示，国内逻辑与存储晶圆厂新一轮扩产正系统性重构供应链——从设备、零部件到材料，能国产的用国产，暂不能替代的转向韩国，韩国方面亦在邀请国内耗材企业赴韩投资配套其存储扩产，"中韩蜜月、挤出日系"的格局初步成形。
  interpretation: UP明确将半导体材料的对日替代定义为当前主线，这是产业趋势级别的判断。中韩联手挤出日系在供应链重构上是一个结构性变化，不是短期题材。涨价持续性和扩产体量都支持中长期逻辑。
