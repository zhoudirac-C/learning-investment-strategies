  subject: 特征序列包含关系的前提
  topic: 包含关系只对同一特征序列的元素成立，线段划分可当下假设验证
  statement: 特征序列中元素讨论包含关系，首先的前提是这些元素都在同一特征序列里；两个不同特征序列之间的元素，讨论包含关系没有意义。特征序列元素的方向与其对应线段的方向刚好相反，因此相邻异向线段的特征序列元素之间不可能存在包含。假设转折点前线段的最后一个特征元素与转折点开始的第一笔同方向，这两者之间已被假设不是同一性质的东西，不存在包含关系；但假设转折点后的分型元素属同一性质（或同属原线段特征序列、或同属新线段非特征序列），可以应用包含处理。线段划分可以当下完成：假设某转折点是两线段的分界点，用线段划分的两种情况去考察是否满足，满足其中一种则该点是真正的分界点，不满足则原线段依然延续。另外，线段要被笔破坏，必须其最后一个特征序列的缺口被封闭，否则不存在被笔破坏的情况。
  evidence_quote: 特征序列的元素要探讨包含关系，首先必须是同一特征序列的元素，这在理论上十分明确的……特征序列的元素的方向，和其对应的段的方向是刚好相反的……线段的划分，都是可以当下完成的，无非是如下的程序：假设某转折点是两线段的分界点，然后对此用线段划分的两种情况去考察是否满足，如果满足其中一种，那么这点就是真正的线段的分界点；如果不满足，那就不是，原来的线段依然延续，就这么简单……线段要被笔破坏，那么必须其最后一个特征序列的缺口被封闭，否则就不存在被笔破坏的情况。
  interpretation: 67课标准的操作细则，解决特征序列分型构造中哪些元素能合并的边界问题。假设验证程序把线段划分变成可机械执行的当下流程，假设不成立就维持原划分。
