  subject: 内部问题比外部大前二十大机构猛开空
  timeframe: short-term
  statement: 外部问题是外资撤出（新兴市场不看好+加息应对，在这赚不到钱还担风险不如去拿5%稳定收益）；但内部问题更大——从股指期货仓单看往前翻100天也找不到多头强势的时候，前二十大机构猛猛开空做对冲，不如主观多头先把指数干回4000点。
  evidence_quote: 外部的问题是外资撤出，有对新兴市场的不看好，对加息的应对，毕竟在你这儿赚不到钱，还担那么大的风险，我不如去白头鹰拿至少5%以上的稳定收益。内部的问题其实更大，从股指期货的仓单来说，你往前翻100天也找不到多头强势的时候，灭霸打一个响指的目的是消灭宇宙一半的人口觉得消耗了太多资源，其实他本可以打一个响指让宇宙的资源翻一倍而让大家活的更美好啊，前二十的大机构们猛猛开空做对冲，不如主观多头先把只是干回4000点！
  interpretation: 鳄鱼派对市场压力源的归因排序：外部（外资撤出）是次要问题，内部（前二十大机构在股指期货持续开空对冲）才是主要矛盾——100天无多头强势说明机构对冲做空是常态化的内部压制力量。这解释了为什么护盘要持续『托而不举』：对抗的不是散户恐慌，是机构的系统性做空对冲。
