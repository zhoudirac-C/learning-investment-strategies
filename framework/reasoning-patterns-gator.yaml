- pattern_id: gator-ch42-main-contradiction-ai-bubble
  school: gator
  name: 主要矛盾方法论与 AI 泡沫监控
  chapter: 42
  description: 鳄鱼派（gator school）第42章：主要矛盾方法论与 AI 泡沫监控。 **抓住主要矛盾**（他"大量化时代做长线/趋势"的核心方法论）： 矛盾 = 对手盘：矛盾大小 = 资金分歧大小；矛盾由大变小 → 资金一致 → 走单边（对手盘纠错进场） 两套矛盾：现实中的矛盾 vs 市场资金认为的矛盾；IF 两者分歧 THEN 以市场资金为重（"我们是做交易的，不是做实体的老板"） 做长线 = 只跟踪主要矛盾是否变化，没变就不频繁操作（猪例：只跟踪供给/产能/补贴，一年赚一两次季节性钱） 用于鳄鱼派资金生态位与规则体系的判断。
  trigger:
  - 两套矛盾：现实中的矛盾 vs 市场资金认为的矛盾；IF 两者分歧 THEN 以市场资金为重（"我们是做交易的，不是做实体的老板"）
  - IF 头部七巨头出现违约 THEN 大问题（目前无违约）；IF 中小科技公司违约率环比持续上行 THEN 留意（当前约 4.5%）
  - IF 罗素2000 约 17 倍等价值洼地仍在 AND 轮动良性 THEN 不触发全面大跌
  - IF "高山上的湖泊"（全面高估无任何洼地，如 2015 A股/2007 全球） THEN 要出大问题
  - IF 大家开始争相恐慌做空美股 THEN 全球股市要出大问题
  - IF 高位放量滞涨 THEN 大股东/大资金在源源不断出货
