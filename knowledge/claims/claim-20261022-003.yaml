  subject: 离岸信托征税的政策本质是征管规范化而非政策性加税
  timeframe: permanent
  stance: view
  statement: 离岸信托征税在法理层面不是开征新税种，而是对个税「居民个人全球所得纳税」原则的细化执行，属于国际通行的税收征管惯例；其本质是税收征管的补位与规范化，而非政策性加税。
  evidence_quote: 这不是开征新税种，而是对《个人所得税法》“居民个人全球所得纳税”原则的细化执行，属于国际通行的税收征管惯例。过去由于离岸司法管辖区信息不透明、征管规则模糊，大量离岸信托处于合规灰色地带；此次政策明确了财产装入、存续收益、终止清算三个环节的穿透征税规则，统一适用20%比例税率，本质是税收征管的补位与规范化，而非政策性加税。
  interpretation: UP 用「补位与规范化 vs 政策性加税」这组二分给政策定性，落到投资含义就是冲击的持续性判断：规范化类政策不会因情绪退潮而撤销，敞口是永久性的。
