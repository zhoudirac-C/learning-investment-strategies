  statement: AI短剧在制作效率提升之后仍要打通分发和变现，平台分账、广告、内容付费及品牌合作决定收入能否形成；573亿元行业预测对应免费微短剧整体市场而非AI短剧单独规模；长期竞争围绕内容质量、IP资源、连续制作能力和跨平台运营。
  evidence_quote: 2026年中国免费微短剧市场规模的行业预测约为573亿元。该预测对应免费微短剧整体市场，并非AI短剧的单独规模。AI有望降低部分制作与本地化环节的成本……长期竞争仍围绕内容质量、IP资源、连续制作能力和跨平台运营展开。引力传媒自制AI短剧以海外市场为核心，已搭建TikTok Minis短剧业务平台，支持广告变现与应用内付费项目……吉视传媒与捷成股份9月20日签署文化出海战略合作协议，涉及AIGC微短剧联合投资、开发及国际传播……天音控股所涉塔读网文IP可列为改编资源线索，但暂不预设对应的短剧收入规模。
