  timeframe: permanent
  statement: 吞没共 8 个条件：前 4 条（位置方向 + 阴/阳顺序 + 实体包裹）是必要条件，必须全部满足；后 4 条是加分项，满足越多信号越强。B 级 = 前 4 条满足 + 1~2 项加分；C 级 = 勉强满足前 4 条 + 1 项加分。
  evidence_quote: 那么这也是前面的一个四个条件，这个是四个必须要条必须的条件，后面几个是加分条件。……你前四个条件你是必须要满足的，好吧？就你形态上那四个条件是必须要满足的。你后面四个条件那是加分项，你越多越好。
  interpretation: 分级不是主观打分，而是「必要条件 + 加分项」的结构：必要条件决定是否成立，加分项决定仓位大小。这也避免了「形态差不多就上」的模糊判断——差一项必要条件就不是吞没，不是弱吞没。
