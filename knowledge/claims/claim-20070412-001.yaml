- id: claim-20070412-001-b
  source_path: sources/chanlun/lesson_045.md
  source_date: '2007-04-12'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 走势不可预测但可完全分类
  topic: 预测毫无意义，理论的意义在于完全分类后根据市场当下的选择来选择
  statement: 走势类型的任何可能性都不可能被事先确认，预测是毫无意义的：走势是干出来的，是市场所有参与者合力的结果，市场中没有上帝，大资金或高技巧可以引导市场按自己的剧本演绎，但没有人能完全事先确定走势类型完成的所有细节。理论的意义在于：一切走势类型的可能结构与类型是可以分类的，每一类之间有明确的界限，因此唯一需要做的是观察市场当下的走势，让市场去选择可能的结构与类型，然后根据市场的选择来选择。无论任何规模的资金，归根结底都只是市场的分力而不是合力本身，企图把自己当合力、把自己装扮成上帝的，最终结局都是死无葬身之地。
  evidence_quote: 说明预测是毫无意义的，走势是干出来的，是市场合力的结果，而不是被上帝所事先确定的，市场中没有上帝，市场的方向只有所有参与者的合力决定……一切虽然不可以预测，但一切走势类型的可能结构与类型，却是可以分类的，每一类之间都有着明确的界限，因此，你唯一需要的，就是观察市场当下的走势，让市场去选择可能的结构与类型，然后根据市场的选择来选择。
  interpretation: 这是缠论认识论的核心表述：用完全分类替代预测，用当下应对替代事前判断。一个30分钟走势类型最低标准是形成一个30分钟中枢，中枢一旦形成该走势类型随时结束都符合理论——分类边界即应对边界。
