  timeframe: short-term
  statement: 昨日沪深两市成交2万亿元（缩量5446亿），一步到位缩到2万亿，位置上对应去年10月中旬与今年2月中旬那两次量能首次跌至2万亿；理论上距离一波量价齐升的反弹不远了，但两轮历史样本里首次到2万亿之后都还有一段在这一带的反复，直接从此起爆的概率并不高于先去1.8至1.9万亿再磨一次的概率——把快到了当成就是今天，是这个位置最容易犯的错。
  evidence_quote: 按此前归纳的量能路径：峰值近 4 万亿先降至 2.5 至 2.6 万亿区间，再回升至 3 万亿以上，跌破 2.5 万亿后进一步缩至
    2 万亿，在此反复一段时间，最后才落到 1.5 至 1.6 万亿的地量——分别对应去年 11 月底和今年 4 月初。昨天是一步到位缩到 2 万亿，位置上对应去年
    10 月中旬与今年 2 月中旬那两次「量能首次跌至 2 万亿」。个人判断，理论上距离一波量价齐升的反弹不远了；但两轮历史样本里，「首次到 2 万亿」之后都还有一段在这一带的反复……把「快到了」当成「就是今天」，是这个位置最容易犯的错。
  interpretation: UP用历史量能路径定位当前：昨日2万亿=历史两次首次跌至2万亿的位置（去年10月中/今年2月中）。判断：距反弹不远但首次到2万亿后通常还有反复，不排除先去1.8-1.9万亿再磨。核心警示：快到了≠就是今天，防止左侧抢跑。
