  subject: 线段的标准化处理
  topic: 最高最低点不在端点的线段可标准化为端点即高低点，作为中枢分析的标准部件
  statement: 如果线段中最高或最低点不是线段的端点，那么在任何以线段为基础的分析中，例如把线段为基础构成最小级别的中枢等，都可以把该线段标准化为最高低点都在端点。因为在以线段为基础的分析中，线段被当成一个没有内部结构的基本部件，只需要关心其实际区间即高低点。标准化后，所有向上线段都以最低点开始最高点结束，向下线段都以最高点开始最低点结束，所有线段的连接形成一条延续不断、首尾相连的折线，为后面的中枢、走势类型等分析提供最标准且基础的部件。
  evidence_quote: 如果线段中，最高或最低点不是线段的端点，那么，在任何以线段为基础的分析中，例如把线段为基础构成最小级别的中枢等，都可以把该线段标准化为最高低点都在端点。因为，在以线段为基础的分析中，都把线段当成一个没有内部结构的基本部件，所以，只需要关心这线段的实际区间就可以，这样就可以只看其高低点。……经过标准化处理后，所有向上线段都是以最低点开始最高点结束，向下线段都是以最高点开始最低点结束，这样，所以线段的连接，就形成一条延续不断、首尾相连的折线。
  interpretation: 标准化的合法性来自分析层次的抽象：在线段以上的级别，线段内部结构不参与计算，只看区间。这是从线段通往中枢与走势类型分析的技术桥梁，使复杂图形标准化。
