  subject: 顶部级别与买卖点不患
  topic: 顶部有级别，中期顶部调整后就不再是顶；任何庄家花招最终都逃不出买卖点
  statement: 顶部是有级别的，一个中期顶部，中期调整后，就不是顶部了，所以顶部以后也不一定是世界末日，是否世界末日由走势今后的发展决定；如果对任何顶部都想长线一把，最终命运多数是被走势上上下下折腾死，真正解决问题要靠分清级别、按照买卖点去操作。无论什么花招，最终合力的结果还是买卖点，买卖点是不患的，任何庄家、大资金都不可逃避；散户其实不需要知道里面的故事，只要看好走势，一切就尽在把握中。
  evidence_quote: 当然，顶部是有级别的，一个中期顶部，中期调整后，就不是顶部了，所以顶部以后，也不一定是世界末日……必须注意，无论什么花招，最终合力的结果还是买卖点，买卖点是不患，任何庄家、大资金，包括本ID 本身，都不可逃避。所以，对于散户来说，其实不需要知道里面的故事，而只要看好走势，一切就尽在把握中了。
  interpretation: 不患是缠论核心术语，意为必然、不以任何参与者意志为转移。这条把整课的做顶故事收回到体系：消息与庄家手法不可知也不必知，可把握的只有走势结构给出的级别与买卖点。
