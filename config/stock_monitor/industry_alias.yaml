# 盲判方向中文名 → 证监会行业分类（新浪行业板块名）同义词映射
#
# 背景：盲判 LLM 偶尔输出中文名方向（如"银行""煤炭"），不在 TDX 概念板块
# （sector_members.json concept）和 direction_pool id 集合内，导致
# direction_scores 成员为空 → samples=0 静默失明（2026-08-19/8-20 实测）。
#
# 本表是 _direction_members 的第三级回退：中文名 → 本表 → 证监会行业名 →
# stock_sector_mapping.json（每日 cron 自动刷新）反查成分股。
#
# 匹配规则：value 是证监会行业名的精确匹配；若精确名不存在，则按 key 做
# 行业名子串匹配（key 是行业名的公共前缀/关键词）。
# 维护口径：只加映射，不删（新行业名出现时追加 value 即可）。
# 建表依据：stock_sector_mapping.json 2026-08-27 快照（84 个行业名）。

