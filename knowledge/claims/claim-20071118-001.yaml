  subject: 盘整与趋势的区别
  topic: 盘整是只有一个中枢的走势类型，趋势有两个以上中枢，盘整不一定比趋势弱
  statement: 本ID理论的盘整和一般所说的区间震荡盘整的概念不是一回事，指数从10000点跌到0也可以是一个盘整，只要中间只有一个中枢。盘整和中枢也不是一个概念：中枢如果是苹果，盘整就是只有一个苹果的苹果树，趋势就是可以有两个以上直到无穷个苹果的苹果树。千万别以为盘整就一定比趋势弱，有些盘整第一段就杀得天昏地暗，后面一段即使力度没有第一段力量，两者加起来也可以超越所谓的趋势。
  evidence_quote: 本ID 理论的盘整和一般所说的区间震荡盘整的概念不是一回事，指数从10000 点跌到0 也可以是一个盘整，只要中间只有一个中枢……中枢如果是苹果，那么盘整就是只有一个苹果的苹果树，而趋势就是可以有两个以上直到无穷个苹果的苹果树……千万别以为盘整就一定比趋势弱，有些盘整，第一段就杀得天昏地暗的，后面一段，即使力度没有第一段力量，两者加起来，也可以超越所谓的趋势了。
  interpretation: 缠论走势类型按中枢个数精确划分而非按涨跌幅或形态感觉：一个中枢为盘整，两个以上中枢为趋势。操作含义是不要用盘整等于弱的成见，一个中枢的下跌同样可以致命。
