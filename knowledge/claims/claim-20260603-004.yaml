- id: claim-20260603-004-e
  topic: 选接力标的时
  source_path: sources/raw/财经/复盘：26-06-03：冲高回落，结构未坏，光互连主线.md
  source_date: 2026-06-03
  source_type: 复盘
  extracted_at: 2026-06-04
  claim_type: methodology
  subject: 接力标的选择方法论——板块内部要有支撑，中军稳则龙头抛压被快速消化
  timeframe: permanent
  statement: 选接力标的时，板块内部要有支撑——要么板块指数往上，要么板块中军稳定。中军稳→龙头高开抛压被快速消化→封板，这个细节极大增加了接力胜率。亨通光电盘前锁定、竞价验证、开盘承接、迅速封板的完整案例验证了该方法
  evidence_quote: 方法论提炼：选接力标的时，板块内部要有支撑——要么板块指数往上，要么板块中军(长飞光纤)稳定。中军稳→龙头高开抛压被快速消化→封板，这个细节极大增加了接力胜率。
  interpretation: '接力交易方法论（durable rule）：①盘前选股——锁定当日最佳板块阵型（光纤），排除失去竞争力的方向（MLCC/风华高科因昨日开板失去竞争力）；②竞价验证——亨通高开8.3%，中军长飞光纤同步高开，板块整体高开=阵型成立；③开盘承接——亨通因高开有抛压，但中军长飞持续往上，板块正向循环支撑；④封板确认——承接抛压后迅速封板，板块联动性上涨不会孤单拖后腿；⑤核心规则：板块内部支撑（板块指数往上或中军稳定）是接力胜率的关键条件。这是可复用的交易规则，已多次验证，标记为permanent进framework。

    '
