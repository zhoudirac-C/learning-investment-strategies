  subject: 看图操作的无我心态
  topic: 看图操作唯一的对象只有图，做不到无我无股票看到的只是自己的贪婪与恐惧
  statement: 看图形操作必须做到无我、无股票，只有走势图形；做不到这一点，有我有股票、被自己的贪婪恐惧所牵引，看到的图也不过就是自己的贪婪与恐惧，那基本可以不看图了。看图操作唯一的对象只有图，谁说都没用，市场是当下发生着的，没有人能替你去反应。股票就是废纸，该卖的时候不卖、把股票当宝，是投资的最大软肋。就算没技术，只按最简单的跌破5日线就走的纪律执行，也足以应对大跌。
  evidence_quote: 如果你看图形操作时，做不到无我无股票，只有走势图形，那基本可以不看图了，因为有我有股票，被自己的贪婪恐惧所牵引，你看的图，也不过就是自己的贪婪与恐惧，那何必看图……看图操作，唯一的对象只有图，谁说都没用，市场是当下发生着的，没有人能替你去反应。
  interpretation: 这条把心态要求落到可检验标准：卖点出现时是否被幻想蒙蔽、能否无幻想执行。最简单的检验就是5日线纪律，技术不足时纪律兜底。
