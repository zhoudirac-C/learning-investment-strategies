  subject: 小背驰大转折定理
  topic: 小级别背驰引发大级别转折的必要条件是最后次级别中枢出现第三类买卖点
  statement: 缠中说禅小背驰-大转折定理：小级别顶背驰引发大级别向下的必要条件，是该级别走势的最后一个次级别中枢出现第三类卖点；小级别底背驰引发大级别向上的必要条件，是该级别走势的最后一个次级别中枢出现第三类买点。注意只有必要条件而没有充分条件：最后一个次级别中枢出现第三类买卖点，并不必然导致大级别转折；而那些小级别背驰后能在最后一个次级别中枢正常震荡的，都不可能转化成大级别的转折。
  evidence_quote: 缠中说禅小背驰-大转折定理：小级别顶背驰引发大级别向下的必要条件是该级别走势的最后一个次级别中枢出现第三类卖点；小级别底背驰引发大级别向上的必要条件提是该级别走势的最后一个次级别中枢出现第三类买点。注意，关于这种情况，只有必要条件，而没有充分条件……对于那些小级别背驰后能在最后一个次级别中枢正常震荡的，都不可能转化成大级别的转折，这个结论很重要。
  interpretation: 定理给出小转大的确认观察点：盯最后一个次级别中枢是否被第三类买卖点破坏，能正常震荡则排除小转大。必要非充分的性质决定了操作上只能分步应对，不能一把梭，与本课下一条的操作程序配套。
