  subject: 区间套方法的理论依据
  topic: 区间套是走势必完美的重要应用，使买卖点精确定位成为可能
  statement: 走势必完美对应的是一种最特殊、最强有力的唯一分解：市场走势有着类似自然数记数法（幂级数唯一分解）的整体结构。正因为缠论的递归函数是有级别的、级别依次升大，才有区间套方法的应用：如果市场走势没有这种整体结构，区间套就不会存在，也就没有操作意义；有了区间套，买卖点的精确定位才有可能，这是操作中最牛的一种方式。级别在缠论中极端关键，搞不明白级别，根本就不明白缠论。
  evidence_quote: 正因为本ID 的理论揭示了看似毫无规律的市场走势有如此完美的整体规律，所以才有了其后一系列的操作可能……如果市场走势没有本ID 所揭示的整体结构，那么区间套是不会存在，也就是没有操作意义的。因此，区间套的方法，就是走势必完美的一个重要的应用。有了区间套，买卖点的精确定位才有可能，也就是说走势必完美的存在导致了买卖点可以精确定位
  interpretation: 区间套不是独立技巧而是唯一分解结构的推论，买卖点的精确定位由此获得理论保证。这回答了区间套为什么有效：有效性来自走势的级别化整体结构，而非经验统计。
