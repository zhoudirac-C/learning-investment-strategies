  subject: 无压力资金原则
  topic: 资金必须长期无压力，自己的资金一定不能交给别人管理
  statement: 一个无压力的资金是投资的第一要点：资金必须长期无压力，借钱投资赢利后继续加码，结果都是一场游戏一场梦。另外一个重要的，就是自己的资金一定不能交给别人管理，自己的盘子一定要自己负责，不能把自己的命运交给别人。不能把自己放置在危险的境地，背水一战、置之死地而后生都不是资本市场应该采取的态度，这样的态度可能一时成功，但最终必然失败。
  evidence_quote: 资金，必须长期无压力，这是最重要的……一个无压力的资金，是投资的第一要点……另外一个重要的，就是自己的资金，一定不能交给别人管理，自己的盘子，一定要自己负责……所谓背水一战、置之死地而后生，都不是资本市场应该采取的态度。这样的态度，可能一时成功，但最终必然失败。
  interpretation: 课中两个反面案例：1996年一东北朋友高比例透支从不到10万做到2000多万，最后三周急跌中被强制平仓回到不到20万；1992年一朋友把几千万盘子交给别人管理，被透资抄底后灰飞湮灭。与第26课有限期的钱互相印证，同属缠论资金管理的第一层纪律。
