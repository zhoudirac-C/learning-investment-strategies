  subject: mSAP工艺紧缺：PCB精度三年内由30μm向5μm跨越
  timeframe: trend
  statement: mSAP（半加成法）是高端PCB制造主流选择，伴随PCB高频高速趋势规模化应用。核心催化为英伟达CoWoP封装路线取消传统基板、芯片模组直接焊接至HDI PCB主板。2027-2028年有望迎来亚10μm技术成熟，2030年达5μm规模化应用。关注PCB厂商（鹏鼎控股、深南电路、兴森科技、沪电股份、景旺电子），上游设备材料国产替代（方邦股份、芯碁微装、东威科技等）。
  evidence_quote: mSAP（半加成法）是高端PCB制造的主流选择，将伴随PCB高频高速趋势规模化应用，当前具备mSAP能力的厂商均在扩产。核心催化在于2025年7月英伟达流出的CoWoP封装路线图——取消传统封装基板、将芯片模组直接焊接至高密度PCB主板。2027–2028年有望迎来亚10μm技术的成熟与规模化，到2030年实现5μm/5μm线宽线距的规模化应用。
  interpretation: 据国海证券，非UP独立判断。mSAP是PCB产业链从"传统基板"到"高密度主板"的结构性跃迁，AI服务器是核心驱动力。UP在此处引用机构研报，主要是提供产业链标的清单。注意标的中有多个科创板/创业板不可交易标的，主板可交易标的包括鹏鼎控股(002938)、深南电路(002916)、兴森科技(002436)、沪电股份(002463)、景旺电子(603228)。
