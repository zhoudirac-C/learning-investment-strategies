  claim_type: sector-theme
  subject: 机器人与物理AI成为两条新主线
  timeframe: short-term
  statement: 非科技方向的机器人与科技方向的物理AI成为当前两条主线。机器人：宇树科技过会+英伟达推新品催化，资金从消息驱动/容量/位置三维度认可。物理AI：AI方向需要区别于硬件的低位方向，英伟达Cosmos官宣成为催化。两者共性：低位+有催化+资金认可。但UP补充评论明确：下一波并不一定就要起机器人，今天观望，小心两头挨打。
  evidence_quote: 与其说是英伟达推新，不如说资金本身迫切希望走出新方向，而机器人从消息驱动、容量、位置三个维度都较符合资金需求。物理AI能够脱颖而出逻辑类似：AI方向资金同样需要一个有消息催化、且区别于AI硬件的低位方向。
  interpretation: |
    UP在正文中正面描述机器人与物理AI的崛起逻辑，但随后在评论中降温——"下一波并不一定就要起机器人，今天观望吧，小心两头挨打"。这说明：
    ①机器人/物理AI的崛起是市场事实（资金行为），但UP对其持续性存疑
    ②"小心两头挨打"=不要因为怕错过机器人而去追机器人，也不要因为看好其他方向就忽视机器人可能的持续性
    ③态度：认可逻辑但不下注，观望等确认
