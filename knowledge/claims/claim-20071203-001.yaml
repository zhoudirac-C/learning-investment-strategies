  subject: 布林收口预判中阴结束
  topic: 某级别布林通道收口意味着低一级别中阴过程将级别扩展或结束
  statement: 布林通道最有用的是关于中阴结束时间的预判：一般来说，布林通道的收口，就是对中阴结束时间的最好提示。某一级别的布林通道收口，就意味着比这低级别的某个中阴过程要级别扩展或结束了，一般都对应着有相应的第三类买卖点。技巧上不是1分钟级别就一定要看1分钟的布林通道，例如一个5分钟的中阴过程，对应的是看30分钟的布林通道。
  evidence_quote: 布林通道最有用的，还是关于中阴结束时间的预判上。一般来说，布林通道的收口，就是对中阴结束时间的最好提示……某一级别的布林通道收口，就意味着比这低级别的某个中阴过程要级别扩展或结束了，一般都对应着有相应的第三类买卖点……一个5 分钟的中阴过程，对应的是看30 分钟的布林通道。
  interpretation: 级别对应是本技巧的关键：看大一到两级的布林通道收口来判断当前级别中阴的结束时间。作者明言这比MACD判断背驰的技巧性还高，只是把月亮指给各位，变成自己的还要自己努力。
