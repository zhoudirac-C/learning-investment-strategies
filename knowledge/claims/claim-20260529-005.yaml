  subject: 机构市回调幅度规律
  timeframe: permanent
  statement: 机构看好的方向，指数回调20%时个股回调36-40%是正常幅度。牛市多急跌，长期看好方向回调30-40%非常正常
  evidence_quote: 你从顶上回调，你随便看一下板块回调20%，你这种东西，它回调起来都会很夸张的。随便拉一下36%，40%这么多，每一轮回调它都得这个幅度的。你指数回调20个点，个股上回调40个点是正常的
  interpretation: 博主用上一轮牛市锂电池类比，给出机构市回调的量化规律：①机构重点看好的方向（如燃气轮机、锂电池），不代表不回调；②指数回调20%，个股回调36-40%是正常幅度；③这是牛市特征——急涨急跌，回调幅度大但修复也快；④当前半导体指数跌约10%，个股跌约20%，还有回调空间；⑤长期看好的方向，硬扛是唯一选择，此时割肉不像话
