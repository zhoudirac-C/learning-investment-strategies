  subject: 结合律与走势分解
  topic: 结合律下分解可变换而分析原则不变，取最有利观察的分解
  statement: 对于走势来说，结合律就是连接走势之间关系最重要的规则。无论如何结合，缠论对走势的分析原则不变：这套理论就是走势保持结合律下具有变换不变性的理论，而且可以严格证明，是唯一能保持分解变换不变且保持结合律的理论。实践中，因为结合律，可以对走势进行最有利观察的分解，随着走势当下发展不断变换所看的中枢，这样才能更容易明白走势究竟在干什么。按多样性分解原则，新中枢暂时先从最后一个低级别中枢开始算起，后面的操作先以此为准，等走势走出最自然的选择再继续更合理的划分；按照暂时的划分，并不影响任何操作。另外，分段的结束位置不一定是最高、最低点，关键是要有至少三笔。
  evidence_quote: 对于走势来说，结合律就是连接走势之间关系最重要的规则，不深切明白这一点，如何能明白走势本身？无论如何结合，本ID 的理论对走势的分析原则是不变的。可以这样认为，本ID 的理论，就是走势保持结合律下具有变换不变性的一套理论，而且可以严格地证明，是唯一能保持分解变换不变且保持结合律的一套理论……因为结合律，我们可以对走势进行最有利观察的分解，这样，才能更容易明白走势究竟在干什么……按照多样性分解原则，新的5 分钟中枢，暂时先从最后一个1 分钟中枢开始算起，后面的操作先以此为准，等走势走出最自然的选择再继续更合理的划分。按照这暂时的划分，并不影响任何操作。
  interpretation: 分解不唯一但操作唯一：多种合法划分并存时取最有利观察的一种，操作结论不变。这是缠论多义性分解的方法论根基，也解释了为何作者解盘时可以不断变换所看中枢而不自相矛盾。
