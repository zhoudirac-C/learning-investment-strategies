  subject: 独立程序组乘法原则
  topic: 用三个互相独立的程序组成程序组，早泄率按乘法大幅下降
  statement: 任何孤立的操作程序都不会有太低的早泄率，一个程序的早泄率低于10%就是超一流、基本不存在。解决办法是数学中的乘法原则：假设三个互相独立的程序早泄率分别为30%、40%、30%，由它们组成的程序组早泄率就是30%×40%×30%=3.6%，即做100次只会出现不到4次早泄。关键前提是三个程序必须真正互相独立：同属价量输入的技术指标互相都不独立，人气指标和资金面其实是一回事情，把非独立的程序凑在一起一点意义也没有。
  evidence_quote: 任何一个孤立的程序都不会有太低的"早泄"率，如果一个程序的"早泄"率低于10%，那就是超一流的程序了……假设三个互相独立的程序的"早泄"率分别为30%、40%、30%，这都是很普通的并不出色的程序。那么由这三个程序组成的程序组，其"早泄"率就是30%×40%×30%=3.6%……但原则是一致的，就是三个程序组之间必须是互相独立的，像人气指标和资金面其实是一回事情，各种技术指标都是互相相关的等等，如果把三个非独立的程序弄在一起，一点意义都没有。
  interpretation: 缠论方法论中最具可操作性的数学结论：信号过滤的威力来自独立性而非单个信号的精度。自检视错清单：多个买入条件是否本质上是同一个信息源（例如均线与其他价量衍生指标同源）？只有信息源独立，失败概率才能相乘。
