evidence_quote: 高开低走的直接原因是科技股的回落幅度超出预期，液冷在昨日小高潮后出现分化，资金重回防御方向，农林牧渔再度领涨，消费、地产、大金融、两岸发展等多个方向同步异动。攻守两端的拉锯在预期之内，进攻品种的退让幅度在预期之外，这一差异是今天盘面略低于预期的核心原因。
interpretation: UP区分'拉锯在预期内'与'退让幅度超预期'，把今日定性为'略低于预期'。液冷分化是触发因素——前一日小高潮透支了弹性，资金回流防御（农金消地两岸）。这与今日持仓诊断完全对位：新朋/集泰/英维克开盘买在 8% 跌幅位置、液冷兑现力度弱。
