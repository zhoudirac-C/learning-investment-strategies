  subject: 强势上涨中的顶背离只是黄灯
  timeframe: permanent
  statement: 强势上涨中顶背离可以连续出现而价格继续走高，因此顶背离只是黄灯，不是立即卖出或摸顶依据。应继续观察价格是否守住前一个低点：前低不断抬高时背离可被趋势消化，价格跌破前低才说明结构恶化，并应通过止损控制风险。
  evidence_quote: 强势上涨中，顶背离很常见。这里接连出现背离，价格却越走越高。这几次，价格都守住了前一个低点；而这一次，价格跌破了前低。再用止损管住风险。
  interpretation: 课程把背离预警与价格破坏分开：前低是否守住是案例给出的结构验证，跌破后不能用‘只是背离’为继续硬扛辩解。
