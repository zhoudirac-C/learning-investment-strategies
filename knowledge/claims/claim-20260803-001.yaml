  subject: 两种情形操作预案：筑底延续vs情绪高点
  timeframe: intraday
  statement: 情形A（筑底延续）：不高开或小幅低开、存储链承接且德明利(001309)/兆易创新(603986)不破上周五低点、二板12-13家以上且首板不锐减、成交2.4万亿以上、零跌停→按原预案执行，波段方向做T为主、短线方向保留先手。情形B（情绪高点）：高开冲高回落、上影线无法反包、跌停死灰复燃、封板率跌破40%、成交缩至2.2万亿附近→短线方向无主动性即取消关注，仓位回落至观察档。共同前提是不追高：位置决定意义，右侧确认，不见量价确认不动手。
  evidence_quote: 情形A（筑底延续）：不高开或小幅低开，存储链能够承接、德明利与兆易创新等不破上周五低点，二板家数在12–13家以上、首板家数不锐减，成交维持2.4万亿以上，跌停家数继续为零。此情形下按原预案执行——已关注的波段方向以做T为主，短线方向保留先手。情形B（情绪高点）：高开冲高回落、周五上影线无法反包，上周五已经消灭的跌停死灰复燃，封板率跌破40%，成交缩至2.2万亿附近。此情形下短线方向若无主动性即取消关注，仓位回落至观察档，等待下一次量价确认。两种情形的共同前提是不追高。位置决定意义，右侧确认，不见量价确认不动手。
  interpretation: UP给出当日双情形操作预案：情形A是筑底延续的多头预案（做T+保留先手），情形B是情绪高点的防御预案（取消关注+降仓至观察档）。验证变量清单明确：开盘位置、存储链承接、德明利(001309)/兆易创新(603986)低点、二板家数、成交额、跌停家数、封板率。共同纪律：不追高、右侧确认、量价确认后才动手。
