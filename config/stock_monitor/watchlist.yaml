market_framework:
  up_quote: 「6/21 22:35复盘专栏：指数定环境——双创创新高、沪指回落，K型分化深化。板块定方向——科技强者恒强，光模块/CCL/存储/AI新材料多点开花。个股定时点——中报预告临近，业绩高增进入炒作高峰。涨价确定性排序：存储/HDD ≈ 高端CCL（满产满销、订单到2027）＞ 铟/磷化铟（副产品供给刚性）＞ 光互联（CPO节奏，位置最高）＞ 氮化铝/ABF/HBM（认证阶段）。科创50估值历史最高（PE 225倍/PB 9.43倍），看作需随时减仓的高Beta。」
  current_stage: K型分化深化期 — 双创创新高、沪指偏弱，资金向业绩+产业落地方向集中。涨价链未扩散至非AI上游前相对安全。科创50高估值需警惕海外映射下杀。
  core_operation: 6/22节后四看——量能(是否维持节前水平)、涨价链(CCL/存储/铟/光互联是否延续)、科创50方向(高估值风险)、EUV催化(国产光刻链脉冲)。ETF持有，不追涨停，等回踩。
  opening_scenarios:
    scenario_A_海外偏暖+放量接续: 节后海外科技偏暖正反馈到A股，量能3万亿+，涨价链延续强势→可评估介入但绝不追高
    scenario_B_平淡回归+缩量震荡: 海外偏暖未传导，量能<3万亿，K型分化延续→持有不动，等待尾盘确认
    scenario_C_科创50杀跌+量能退潮: 科创50高估值+海外波动传导，量能<2.5万亿→仅持ETF，不新开仓
  intraday_observation:
    1_量能是第一硬指标: 10:00、11:30、14:00三个时间节点横向对比量能趋势
    2_涨价链延续: CCL（东材科技/圣泉集团）、存储（兆易/德明利）、铟（锡业股份）、光互联（旭创/长飞）方向关注
    3_科创50方向: 高估值下海外映射方向决定短线风险
    4_EUV催化: 光刻机争议能否发酵成节后情绪催化
  invalidation_conditions:
  - 科创50高估值下海外半导体板块大跌→高度敏感，随时减仓
  - 涨价主线扩散至非AI上游纯主题→减仓信号
  - 量能快速回落至2.5万亿以下→推翻接续预期
  - 全A指数继续破位且30分钟不能收回→筑底失败
