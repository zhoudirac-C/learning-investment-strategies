  subject: 英伟达H200对华出口管制
  timeframe: short-term
  statement: 特朗普政府出口管制官员确认仅有少量英伟达H200芯片获批运往中国，新增获许可企业为中兴康讯（中兴通讯(000063)子公司）、服务器厂商Maginfra及金山软件旗下横琴云享智胜，新一代Blackwell系列仍维持全面禁运。
  evidence_quote: 彭博消息显示，特朗普政府出口管制官员在国会听证会上确认，仅有少量英伟达H200芯片获批运往中国，美方官员反复强调出货规模微不足道，不会冲击自身技术安全底线。本次拿到采购许可的新增企业共三家，中兴康讯、服务器厂商Maginfra可采购英伟达H200，金山软件旗下横琴云享智胜则获准采购AMD对标级AI芯片，所有交易均需通过美国严格终端审查，新一代Blackwell系列芯片依旧维持全面禁运。
  interpretation: 本次听证会对华AI芯片出口管制口径没有放松，Blackwell全面禁运维持，H200仅象征性放行少量，且新增获许可企业数量与规模均有限，对整体供给格局影响有限。
