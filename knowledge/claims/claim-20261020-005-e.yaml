subject: 护盘的目标函数
timeframe: permanent
statement: 护盘的目标是两件事：阻断负反馈（跌→机构赎回→融资客砍仓→股民卖出→再赎回的螺旋），然后建立正反馈；7 月创业板单日拉 6 个点就是阻断负反馈的力度
evidence_quote: 护不护得住啊？目前来看是能护住的啊，那这个托而不举啊，它有托和举啊。托的是什么？托的是什么？其实无非就那几个东西：阻断负反馈啊，建立正反馈。什么叫阻断负反馈？其实我们之前不刚经历过吗？啊，看创业板就最明显，七月份的这种，这就叫负反馈啊，对吧？当当当当当啊，跌跌的机构赎回啊，融资客砍仓啊，股民卖出，卖出之后干嘛嘞？啊，再赎回，再砍仓，再卖出啊，这就叫负反馈啊，它要阻断负反馈啊。
interpretation: 这是鳄鱼派护盘理论的核心：护盘不是「把指数拉上去」，而是先阻断下跌螺旋（负反馈），再让市场自发走（正反馈）。他用 7 月创业板 6%
  单日拉升作为「阻断负反馈」的力度参照——当前不需要那么猛，因为「套牢盘已经消化掉了」。
