- id: claim-20061201-001-c
  source_path: sources/chanlun/lesson_012.md
  source_date: '2006-12-01'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 缠绕中继与转折判断
  topic: 用缠绕次数、前期力度与成交量判断缠绕是中继还是转折
  statement: 体位互相缠绕只有中继或转折两种性质，没有任何方法可以百分百确定，但有三条提高准确率的判断规则：一、女上位趋势出现的第一次缠绕是中继的可能性极大，第三、四次出现则转折的可能性加大；二、出现第一次缠绕前，短期均线的走势必须十分有力，不能疲软，这样缠绕极大可能是中继，其后至少还有一次上升的过程；三、缠绕出现前的成交量不能放得过大，量突然放太大而又萎缩过快，骗线出现的几率大大增加，一般即使没有骗线，缠绕的时间也会增加，成交量会出现两次收缩的情况。男上位则相反，要寻找最后一次缠绕的转折。
  evidence_quote: 女上位趋势出现的第一次缠绕是中继的可能性极大，如果是第三、四次出现，这个缠绕是转折的可能性就会加大；还有，出现第一次缠绕前，5 日线的走势必须是十分有力的，不能是疲软的玩意，这样缠绕极大可能是中继，其后至少会有一次上升的过程出现；第三，缠绕出现前的成交量不能放得过大，一旦过大，骗线出现的几率就会大大增加，如果量突然放太大而又萎缩过快，一般即使没有骗线，缠绕的时间也会增加，而且成交量也会现在两次收缩的情况。
  interpretation: 三条规则分别对应位置（第几次缠绕）、力度（缠绕前走势质量）、量能（成交是否异常），是把中继还是转折这个不可确定问题转化为概率判断的示范。它们直接服务于第二买点的安全性确认：女上位第一次有力缠绕后的低位才值得买。
