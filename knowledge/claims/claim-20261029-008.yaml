subject: 中航光电：Q3营收净利双增，具身智能已进入头部企业批量供货，区分供货与利润贡献
timeframe: temporary
statement: Q3营收68.82亿元（+47.87%）、归母净利8.16亿元（+172.13%）；具身智能已进入国内头部企业批量供货。仍应区分“已经供货”和“已形成较大利润贡献”。
evidence_quote: 中航光电：电源、光传输、高速互连与液冷协同。第三季度营业收入68.82亿元，同比增长47.87%；归母净利润8.16亿元，同比增长172.13%。具身智能方向，公司围绕电池供电、控制、执行和感知四大系统，构建连接器及相关组件矩阵，提供光、电、液一体化解决方案。产品已覆盖具身机器人、人形机器人和四足机器人等类型，并进入国内头部具身智能企业批量供货。仍应区分“已经供货”和“已形成较大利润贡献”，后者需要收入规模进一步验证。
interpretation: UP 认可中航光电的业绩兑现（营收净利双增）和产业布局（具身智能批量供货），但同时强调区分“已供货”和“已形成较大利润贡献”的验证层次，避免将产业布局直接映射为当前利润贡献。
