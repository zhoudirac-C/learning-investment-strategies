  subject: 高潮次日去弱留强-只做最强势不选跟风
  timeframe: intraday
  statement: 高潮次日的原则只有一条：去弱留强，要做只能做最强势的，不能再选跟风的。超节点（紫光股份(000938)）是全市场唯一趋势主升，即便盘中补量回落也仍是留的对象；半导体作为有地位的修复方向可以观察；AI海外链这类跟风分支在高潮次日的回落中就是要去掉的部分。扩散和补涨性价比最低，越往边缘回撤幅度越难控制。
  evidence_quote: 高潮次日的原则只有一条：去弱留强，要做只能做最强势的，不能再选跟风的。超节点是全市场唯一的趋势主升，紫光股份这类核心品种即便盘中补量回落也仍是留的对象；半导体作为有地位的修复方向可以观察；而AI海外链这类跟风分支，在高潮次日的回落中就是要去掉的部分。这个位置扩散和补涨的性价比最低，越往边缘去，回撤的幅度越难控制。
  interpretation: UP给出了高潮次日（7/22）的操作方法论——去弱留强，并将可操作方向分为三个梯度：超节点（紫光股份(000938)）=核心品种留/可接力；半导体=有地位的方向可观察；AI海外链=跟风分支应去掉。"扩散补涨性价比最低"是对散户追后排行为的明确警告。
