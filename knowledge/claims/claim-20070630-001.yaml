  subject: 笔的定义与结合律
  topic: 相邻顶底构成一笔，顶底之间至少隔一根K线，线段至少三笔
  statement: 两个相邻的顶和底之间构成一笔，顶和底之间的其他波动都可以忽略不算，但一定是相邻的顶和底，隔了几个就不是一笔。结合律必须遵守：顶和底共用一根K线违反结合律，不算一笔；光是顶和底、中间没有其他K线，一般也不算一笔；实际分析中要求顶和底之间至少有一根K线，这是成笔的最基本要求。上升的一笔一定是底分型加上升K线加顶分型，下降的一笔是顶分型加下降K线加底分型，中间K线可以无数根，只要一直保持定义。线段至少由三笔组成。
  evidence_quote: 两个相邻的顶和底之间构成一笔，所谓笔，就是顶和底之间的其他波动，都可以忽略不算，但注意，一定是相邻的顶和底，隔了几个就不是了。而所谓的线段，就是至少由三笔组成……顶和底之间必须共用一个K 线，这就违反结合律了，所以这不算一笔……在实际分析中，都必须要求顶和底之间都至少有一K 线当成一笔的最基本要求……上升的一笔，由结合律，就一定是底分型+上升K 线+顶分型；下降的一笔，就是顶分型+下降K 线+底分型。
  interpretation: 笔把分型连接成可运算的结构，结合律（不共用K线、至少一根间隔K线）是排除划分歧义的关键约束。中间的上升或下降K线数量不限，是笔的弹性所在。
