- id: claim-20070321-001-b
  source_path: sources/chanlun/lesson_038.md
  source_date: '2007-03-21'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 同级别分解的组合规则
  topic: 操作级别内允许盘整加盘整且不定义中枢延伸，以下级别反之
  statement: 一套不违反结合律且保证分解唯一性的同级别分解规则：在操作级别中不定义中枢延伸，允许该级别上的盘整+盘整连接（只要次级别三段上下上或下上下类型有价格区间重合就构成中枢，次级别延伸出6段就当成两个盘整类型的连接）；同时规定该级别以下所有级别都允许中枢延伸、不允许盘整+盘整连接；该级别以上级别根本不考虑，因为所有走势都已按该级别分解。同级别分解的次级别分解不需要也是同级别分解；组合规则只为方便操作与判断，只要不违反连接的结合律与分解唯一性就是允许的，关键在明晰且易于操作。注意：不允许盘整+盘整是非同级别分解方式下的规则，不要搞混。
  evidence_quote: 可以制定出这样的同级别分解规则：在某级别中，不定义中枢延伸，允许该级别上的盘整+盘整连接；与此同时，规定该级别以下的所有级别，都允许中枢延伸，不允许盘整+盘整连接；至于该级别以上级别，根本不考虑，因为所有走势都按该级别给分解了……注意，以前说不允许“盘整+盘整”是在非同级别分解方式下的，这在下面的课中会讲到，所以不要搞混了。
  interpretation: 这条规则常被误读：盘整+盘整是否合法取决于分解方式而非走势本身。同级别分解把中枢延伸、扩展概念排除在操作级别之外，换来分段的离散性与可机械执行性。
