  subject: 震荡行情差价手法
  topic: 震荡市敢卖敢买，用中枢震荡在大买点与大卖点之间弄差价
  statement: 震荡行情最容易玩出利润，但绝对不适合一根筋思维的人。对待震荡行情要敢卖敢买，该卖一定要卖，买却不一定每次都买，技术有问题的要控制好仓位，没把握的在关键均线重新站稳之前可以不参与。核心手法是用中枢震荡弄差价：等适合自己资金的、针对具体个股的较大买点介入，到较大级别卖点一定要卖，否则就是坐电梯。股票都是废纸，只有能弄出差价来才是抽血，否则上涨下跌不过是坐电梯。
  evidence_quote: 震荡行情是最容易玩出利润来的，但这绝对不适合一根筋思维的人……特别对待震荡行情，就是要敢卖敢买，该卖一定要卖，反而买却不一定，特别对技术有点问题的，仓位可以控制好……股票都是废纸，只有能弄出差价来才是抽血，否则上涨下跌不过是坐电梯，和你有什么关系？而要弄差价，用中枢震荡的手法，就是最好的……玩震荡一定要等适合自己资金的针对具体个股的较大买点，然后到较大级别卖点一定要卖，否则就是坐电梯，没意义了。
  interpretation: 出自本课附录的两段解盘（2007-06-28、06-29），是对中枢震荡操作最直白的原则表述。与区间套定位配套：区间套负责找买卖点，本条负责震荡市的仓位与买卖纪律。不熟练者只能参与大级别活动，太小的级别因交易成本没有参与价值。
