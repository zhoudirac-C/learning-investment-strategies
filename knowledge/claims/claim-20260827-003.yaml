  subject: 四个规避方向的敞口排序：逆变器储能最重光伏设备最轻
  timeframe: trend
  statement: 按三步法看四个方向的敞口排序（个人判断，待120天实施细则校准）：并网逆变器与储能系统（对美直接出口占比最高且被明文列举）＞电网智控软件与工业软件（涉及远程接入与固件更新，最容易被软件与全生命周期维护条款捕捉）＞高压设备与变压器（美国本土产能缺口大、替代难度高，反而可能进预合格清单）＞光伏组件设备（多数已通过第三国产能交付，不在69千伏以上定义核心清单内）。
  evidence_quote: 按这个顺序看四个方向的敞口排序，个人判断由重到轻大致是：并网逆变器与储能系统（对美直接出口占比最高、且被明文列举）＞电网智控软件与工业软件（涉及远程接入与固件更新，最容易被"软件与全生命周期维护"这一条捕捉）＞高压设备与变压器（美国本土产能缺口大、替代难度高，反而可能进预合格清单）＞光伏组件设备（多数已通过第三国产能交付，且不在69千伏以上定义的核心清单内）。这个排序是待验证的推断，需要以120天后的实施细则来校准。
  interpretation: 反直觉的一点：高压设备与变压器虽然被点名，但美国本土产能缺口大，反而最可能进预合格清单获得豁免——受损程度与「不可替代性」成反比。市场按板块标签一刀切抛售时，这个排序提供了分层视角。
