- id: claim-20070309-001-c
  source_path: sources/chanlun/lesson_035.md
  source_date: '2007-03-09'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 最低级别走势类型的完全分类
  timeframe: permanent
  statement: 有一个最低级别中枢的走势是最低级别的盘整走势类型；有两个最低级别中枢的走势是最低级别的趋势走势类型，第二个中枢比第一个高即为上涨走势类型，反之为下跌走势类型。
  evidence_quote: 有一个最低级别中枢的走势，就是最低级别的盘整走势类型；有两个最低级别中枢的走势，就是最低级别的趋势走势类型，如果第二个中枢比第一个高，那就是上涨走势类型，反之就是下跌走势类型。
  interpretation: 盘整与趋势的区分被严格量化到中枢个数上：一个中枢为盘整、两个以上为趋势，趋势方向由前后中枢的高低关系判定。这套分类不依赖任何主观感觉，是纯结构化的。
