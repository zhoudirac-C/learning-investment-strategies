  subject: CPI前夜两情形操作预案
  timeframe: intraday
  statement: 距离美国8月CPI公布还剩一个交易日，抢跑或提前下注的资金会陆续出现，昨天午后农业、大消费方向已有资金撤退迹象，今天可以通过是否放量来甄别。情形A：低开后承接有力，指数快速翻红或收复失地，量能较昨日温和放大，市场把外围利空当作一次性定价，向上突破概率加大，操作上继续以做T为主，不主动加减总仓位。情形B：低开后承接乏力，收盘价跌破3909，横盘七日的压缩以向下方式释放，纪律先于观点，总仓位降至五成，不限个股。
  evidence_quote: 情形 B · 低开后承接乏力：收盘价跌破 3909。这意味着横盘七日的压缩以向下方式释放，纪律先于观点，总仓位降至五成，不限个股。
  interpretation: 两情形预案的分界是收盘价而非盘中。A情形做T不加减仓是保留灵活性的中性操作；B情形降到五成不限个股是无条件纪律执行，纪律先于观点。决策锚两项：收盘3909是否守住、量能是否较1.65万亿温和放大。这是今日加减仓决策的唯一决策树。
