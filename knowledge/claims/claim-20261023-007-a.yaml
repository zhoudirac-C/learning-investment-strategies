  subject: 操作品种要考虑安全垫，上证50安全垫最高
  timeframe: short-term
  statement: 本轮看多做多的主要逻辑是护盘，那么安全垫最高的指数是上证50，因为科技最少，低位权重最多，护盘的顺序也是先上证50。大家可能想搏弹性，直接选中证500和1000做，做指数ETF没问题，分批捡便宜，又没杠杆，多急杀几天也没关系。但是，如果是股指期货，假如今天龙哥不想护盘，想下周再护，那很多人今天就会爆仓、被强平，后续的大涨也会与你无关。不能一味图弹性，要考虑安全垫，特别是带杠杆的东西，极端行情下，仓位不能太重，看对只是赢了一半，不被淘汰出局是另一半。
