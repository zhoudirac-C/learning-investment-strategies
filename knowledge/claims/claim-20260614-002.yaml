  evidence_quote: 首先第一条就是前期必须要有一段时间的下跌，并且你下跌时间在五个交易日以上是最好的。……第二根就是第二个条件就是你第一根必须是阴线。然后第三个条件，你第二根必须是阳线。第四个条件就是你第二根阳线的实体是完全包裹住了第一根阳阴线的实体。
