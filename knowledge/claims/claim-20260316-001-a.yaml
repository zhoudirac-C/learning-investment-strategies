evidence_quote: "4050点半个月内出现3次长下影线→明确强支撑区间→明日有望中阳线修复"
interpretation: "UP提出支撑位的确认逻辑：不是一次触及就算支撑，而是需要多次长下影线的反复验证。3次同价位长下影=强支撑确认。这个方法论结合了K线形态（长下影=承接）和统计学（多次验证=可靠性提升），是技术分析中支撑位判断的经典应用。后续UP在关键点位分析中始终使用这个逻辑。"
