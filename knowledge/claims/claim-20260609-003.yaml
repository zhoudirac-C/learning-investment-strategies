  claim_type: sector-theme
  subject: 半导体普涨修复——洁净室/硅片偏强，芯片跟随，消息面未证实
  timeframe: short-term
  statement: 半导体板块以普涨修复为主。洁净室、硅片分支偏强，芯片在硅片带动下集体走高（相关消息面尚未证实，盘后需留意是否有新闻落地）。PCB、CPO以跟随修复为主，阵型一般。整体科技修复缺乏聚焦，难以形成具引领性的新分支。
  evidence_quote: 半导体板块以普涨修复为主，洁净室、硅片分支偏强，芯片在硅片带动下集体走高(相关消息面尚未证实，盘后需留意是否有新闻落地)；PCB、CPO以跟随修复为主，阵型一般。
  interpretation: |
    半导体是普涨而非结构性突破。洁净室/硅片偏强但消息面未证实=资金在赌消息但信心不足。PCB/CPO跟随修复=被动上涨，无独立逻辑。
    
    这与6/4"科技阶段性规避"不矛盾——规避是指不追高建新仓，但已有科技持仓趁修复减仓是合理的。等消息面落地后再判断半导体是否有持续性。
