- pattern_id: earnings_analysis
  name: 个股业绩拆解与定性分析框架
  description: 当用户询问个股业绩、财报分析、业绩暴雷识别、业绩超预期、估值判断、季报年报解读时使用。核心关注利润表、营收质量、一次性损益、主营趋势。典型查询：XX业绩怎么样、财报怎么看、业绩超预期能追吗、怎么避雷、业绩是否符合预期、估值贵不贵。该框架拆解财报异常项、还原主营趋势、定性风险性质、判断估值逻辑，区分一次性因素与真实经营改善。
  trigger:
  - 财报/业绩预告披露期（季报、年报、业绩快报）
  - 个股净利润或现金流出现异常波动（同比大幅偏离）
  - 业绩超预期或低于预期的市场定价窗口
  - 股价大涨大跌后需要验证基本面是否支撑
  source_raw:
  - sources/raw/财经/周复盘：26-04-15：节奏预期，日线高9，算力租赁生死考验，趋势中做短线.md
