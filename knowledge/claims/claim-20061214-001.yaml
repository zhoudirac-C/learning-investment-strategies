- id: claim-20061214-001-b
  source_path: sources/chanlun/lesson_016.md
  source_date: '2006-12-14'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 下跌加上涨买卖法
  topic: 只选下跌盘整下跌后出现第一类买点的品种，介入后一旦出现盘整坚决退出
  statement: 中小资金的高效买卖方法，实质是六种基本走势中只参与下跌+上涨一种。选择买入品种的标准程序：一、只选择出现下跌+盘整+下跌走势的；二、在该走势的第二段下跌出现第一类买点时介入；三、介入后一旦出现盘整走势，坚决退出（可利用低一级别的第一类卖点退出，肯定不会亏钱，因为不操作盘整，盘整浪费时间且之后有一半可能是下跌）。如果买入后不出现盘整，股票将至少回升到前面下跌+盘整+下跌的盘整区域，在日线或周线上出现这种走势进而成为大黑马的可能相当大。反向应用即是卖点方法：前面出现上涨+盘整+上涨走势的，一旦第二段升势出现第一类卖点，一定要走。
  evidence_quote: 综上所述，对于“下跌+上涨”买卖方法方法来说，对股票的选择就只有一种情况，就是：出现第一类买点且之前走势是“下跌+盘整+下跌”类型……三、介入后，一旦出现盘整走势，坚决退出……一定要记住，操作一定要按标准来，这样才是最有效率的。
  interpretation: 这是缠论给出的第一个完整闭环交易系统，过滤条件逐级收紧：下跌+上涨排除上涨+下跌，再排除上涨+盘整+下跌，最终只剩下跌+盘整+下跌一种可介入结构。退出纪律的理由不是预测而是效率：不参与盘整。课中驰宏锌锗与北辰实业均为2004-2006年历史案例。
