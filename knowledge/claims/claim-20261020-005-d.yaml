statement: 护盘方（龙哥）换着拉权重（先科创50、尾盘再拉上证50）是为了防止「大家都往东走」的套利——如果连续两三天拉同一方向，机构会薅羊毛
evidence_quote: 龙哥这种换着拉，防的是那种大机构，对吧？大机构啊，不听话的机构啊……你看今天上证五那个科创五零拉了，然后尾盘又拉了拉这个上证五零，对吧？啊，你看如果大家如果连续两三天拉上证五零会出现什么，对吧？会出现往东走，大家都往东走，那还得了，对吧？啊，那龙哥的钱也也是干嘛嘞？也不是大风刮来的啊，他会干嘛？他会换个地方拉啊，让大家觉得我不往东走了，我要往西走。
interpretation: 把护盘的「轮动」解释为「防套利」：护盘资金（龙哥=某队/国家队）不是慈善，要防大机构盯着单一方向套利。这与他 14:41 那条转发（护盘是轮动换仓）同逻辑，但给了具体行为细节（换
  ETF 品种、换权重/小盘）。
