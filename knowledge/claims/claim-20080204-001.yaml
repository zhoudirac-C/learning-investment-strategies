  subject: 背驰后的完全分类
  topic: 背驰后理论只保证回拉原中枢，其后走势必须完全分类并预设对策
  statement: 一个背驰后，无论盘整背驰还是真正的背驰，理论只能保证其回拉原来的中枢；回拉之后如何涉及预测，正确思维是把回拉后出现的情况进行完全分类，根据每种分类对应的后果决定对策，这与有没有消息、是否有利好毫无关系。操作者在操作时，后续所有可能面对的情况与对策都必须了然，否则就没资格操作；对真正的操作者没有任何情况是意外的，所有相应对策事先已有，只是等市场自己去选择、去触及事先给定的开关。
  evidence_quote: 一个背驰后，无论是盘整背驰还是真正的背驰，理论只能保证其回拉原来的中枢，这是正确的思维方式，那么，回拉之后如何，这涉及预测。正确的思维是，把回拉后出现的情况进行完全的分类，根据每种分类对应的后果，决定你自己的对策……你在操作时，你后续的所有可能面对的情况与对策都必须了然，否则你就没资格操作。对于一个真正的操作者，没有任何情况是意外的，因为，所有的情况都被完全地分类了
  interpretation: 这是缠论不预测而应对的方法论核心：理论的确定性边界止于回拉原中枢，超出边界就用完全分类加预案覆盖。课中362点到364点的指数推演是2008年当日案例，方法本身不依赖具体点位；是否触及操作分类界限是唯一决策依据，利好利空不改变操作逻辑。
