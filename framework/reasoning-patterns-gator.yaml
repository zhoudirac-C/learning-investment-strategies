- pattern_id: gator-ch46-signal-two-faces
  school: gator
  name: 信号的两副面孔：趋势指标 vs 震荡指标
  chapter: 46
  description: 鳄鱼派（gator school）第46章：信号的两副面孔：趋势指标 vs 震荡指标。 **一句话：同一个信号在不同环境下含义可以完全相反。先用宏观定环境，再定信号用法。** 判别：看宏观——经济预期（增长 vs 负增长）+ 货币宽松还是紧缩 IF 趋势环境 THEN 顺势用（上证涨两个点 = 还要继续涨） IF 震荡环境 THEN 反着用（上证涨两个点 = 阶段见顶；跌两个点 = 阶段见底） 用于鳄鱼派资金生态位与规则体系的判断。
  trigger:
  - IF 趋势环境 THEN 顺势用（上证涨两个点 = 还要继续涨）
  - IF 震荡环境 THEN 反着用（上证涨两个点 = 阶段见顶；跌两个点 = 阶段见底）
  - IF 同一方向的数据信号越多 THEN 判断准确度越高（前提："资金是不会骗人的"）
  steps:
  - 信号的两副面孔：趋势指标 vs 震荡指标
  thresholds:
  - IF 趋势环境 THEN 顺势用（上证涨两个点 = 还要继续涨）
  - IF 震荡环境 THEN 反着用（上证涨两个点 = 阶段见顶；跌两个点 = 阶段见底）
  - IF 同一方向的数据信号越多 THEN 判断准确度越高（前提："资金是不会骗人的"）
  table_rules:
  - 信号 | 趋势环境（有驱动/有钱/宽松） | 震荡环境（被压制/没钱/紧缩）
  - 指数共振（上证+2%、创业板+3%） | 开启单边上涨的标配（摔杯） | **加速见顶**（拉小票半个月后 50/300 突然补涨=阶段顶）
  - 放量 | 好信号 | 见顶（24年10月8日天量3万亿=坏；9·24前一两万亿=好）
  - 中期买盘 >2%（到 3-4%） | 该往上看 | 已短期超买、环境不允许 → 不往上看
  - 基差（IF/沪深300，**看加权**） | 牛市应为负数或个位数 | 变成**超买超卖**：越大越涨、空头越加，加到极限一路向下；跌完空头平仓基差自然缩小（6月 200-300 → 9/28 为 114）
  - 涨停破百 | 情绪好可跟 | **阶段情绪高点**
  - 跌停 40+ 家 + 创业板 -4% + 上证 -2% | 继续看跌 | 反而**短期超卖** → 可博反弹
