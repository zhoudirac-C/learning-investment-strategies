  timeframe: trend
  statement: 微软第四财季营收900.1亿美元同比增长18%，Azure同比增长43%创2022年初以来最高增速，资本开支维持1900亿美元指引未上修，并释放新财年正向自由现金流信号。压制全球AI链一个月之久的估值绳索被解开大半，但压制解除的是估值端而非产业端——产业端从来没有坏过。
  evidence_quote: 隔夜微软以一份云加速＋资本开支不再上修＋自由现金流转正的财报，把压制全球AI链一个月之久的估值绳索解开了大半。但需要说清楚：压制解除的是估值端，不是产业端——产业端从来没有坏过。微软预计2026自然年资本支出为1900亿美元，与此前预期一致，微软由此成为第一家未上调资本开支指引的美股科技巨头。
  interpretation: UP明确了本轮AI修复的定性：微软财报的关键不是增速多高，而是资本开支不再上修+自由现金流转正，直接拆掉了市场过去一个月最担心的估值叙事（资本开支无限扩张吞噬自由现金流）。同时强调产业基本面从未恶化，是估值修复而非逻辑修复。
