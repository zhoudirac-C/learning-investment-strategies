  subject: 60分钟底部结构两段论与加仓标准
  timeframe: short-term
  statement: 加仓标准的两段论：60分钟底部钝化只提示下行动能可能减弱（随后仍可能延长或消失），只有钝化发展为底部结构形成才进入既定加仓标准；不把一次急拉直接当成结构完成。态度上不怕再跌一些，怕的是有效机会出现时没有准备——准备工作包括备选方向、结构条件和失效后的应对；若60分钟底部结构形成即满足加仓标准，只有钝化时继续等待。
  stance: view
  evidence_quote: 指数今天重点留意60分钟，观察是否出现底部钝化，以及钝化能否进一步形成底部结构。钝化提示下行动能可能减弱，随后仍可能延长或消失；结构形成才进入既定加仓标准。盘前只设观察条件，盘中按持续使用的指标和参数确认，不把一次急拉直接当成结构完成。……我的态度是，这里不怕再跌一些，怕的是有效机会出现时没有准备；准备工作包括备选方向、结构条件和失效后的应对。若60分钟底部结构形成，就满足我的加仓标准；只有钝化时，继续等待。
  interpretation: 核心操作纪律：钝化≠结构，结构=加仓触发器；急拉不算数。当前阶段的主要任务是准备（备选方向/结构条件/失效应对）而非抢跑。
