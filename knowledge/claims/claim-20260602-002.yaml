  evidence_quote: "海外是确定性（Bloom拿下甲骨文大单、Marvell需求爆发），国内多是预期博弈（SOFC国产化早期、DSP国产替代在研）。真正有业绩支撑的，供电端看材料卡位、互联端看模块龙头；而SOFC国产化和DSP国产替代这两端弹性最大，但都要等订单、流片、量产这些硬信号落地，才能从概念走向业绩。"
