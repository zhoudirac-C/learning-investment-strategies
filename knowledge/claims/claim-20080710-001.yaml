  subject: 缠中说禅板块强弱指标
  topic: 板块内股票类别数平均即板块强弱指标，N类顶背驰换股轮动
  statement: 判别一板块的强弱很简单：把板块内股票的类别数（按均线九类分类）平均一下，越大越强，这个平均类别数就叫缠中说禅板块强弱指标。最强的板块属于领涨板块，其动态十分关键；把所有板块的强弱指标列在一个图上，轮动的次序与节奏就一目了然，配合具体股票的走势分析，轮动操作就极为简单。轮动节奏上，每类股票一旦在N类调整，要到N+1类至少有很大一段时间折腾，所以一旦一个趋势级别的走势在N类上出现顶背弛，就可以先出来，去找已经调整可以再启动的股票或者补涨的。注意轮动只是节奏的一种方式，最重要的节奏还是买卖点，一切节奏都必须以此为基础。
  evidence_quote: 要判别一板块的强弱很简单，就是把类别数平均一下，越大越强，而这个平均类别数，可以叫缠中说禅板块强弱指标……一旦一个趋势级别的走势在N 类上出现顶背弛，就可以先出来一下，至少有几天偷欢的时间可以去找找别的已经调整可以再启动的股票或者补涨的……轮动只是节奏的一种方式，而最重要的节奏，还是买卖点，一切的节奏都必须以此为基础，当然轮动也不例外。
  interpretation: 板块强弱指标把个股均线分类聚合成板块级信号，构成从个股到板块到轮动的完整链条。顶背驰换股的前提是节奏以买卖点为基础，当顶分型风险出现时轮动也可能是刀口舔血。
