- pattern_id: others
  name: 其他独立分析框架
  description: 当用户询问无法归入上述九大框架的独立分析场景时使用，包括行业估值比较（PE/PB体系）、板块拥挤度分析、外盘联动风险、新股上市影响、特殊政策解读、非周期非AI的独立事件分析等。该框架先识别特殊信号、分析影响与机会、制定应对方案，作为通用补充分析路径。
  trigger:
  - 出现极端盘面信号（连续跌停、无量涨停、天地板等）
  - 行业估值比较（PE/PB体系）或板块拥挤度极端分化
  - 外盘联动风险事件（美股大跌、海外政策突变）
  - 新股上市、特殊政策等非周期非AI的独立事件
  source_raw:
  - sources/raw/财经/午盘：26-05-27：今天不能抄底，注意外盘风险.md
  - sources/raw/财经/复盘：26-03-16：4050三次长下影强支撑，存储领涨，明日中阳预期，OFC三大MSA.md
  - sources/raw/财经/视频：26-02-19：F10财务分析（三）之PE估值.md
  applicable_themes:
  - A股外盘联动风险
  - A股行业估值
  - PE估值体系
  - 化工涨价
  - 半导体材料
  - 科技板块拥挤度分析
  - 美股风险预警
  - 行业比较分析
  - 资源涨价
  data_requirements:
  - name: 极端行情信号
    channel: 行情数据（涨跌停/成交量异常/估值分位数）
  - name: 供应链与产业消息
    channel: 新闻 / 供应链消息
  - name: 历史类似案例
    channel: knowledge/cases（案例库）/ 历史行情
  - name: 情绪与资金数据
    channel: 行情数据（市场情绪指标/资金流向）
  - name: 个人持仓与风险预算
    channel: config/stock_monitor/positions.yaml（本地私有，不进 git）
  steps:
  - step: 1
    name: 识别特殊信号
    question: 是否出现极端或特殊的market signal？
    action: 筛查极端信号（连续跌停、无量涨停、天地板）与特殊结构（供应链瓶颈、估值极端分化）
    data:
    - 极端行情信号
    - 供应链与产业消息
  - step: 2
    name: 分析影响与机会
    question: 该信号带来什么风险或机会？
    action: 极端信号按转折点候选对待：风险信号先规避，机会信号对照历史类似案例验证后再参与
    data:
    - 历史类似案例
    - 情绪与资金数据
  - step: 3
    name: 制定应对方案
    question: 如何应对或利用该信号？
    action: 风险信号对应减仓或空仓；机会信号小仓位试错、确认后加仓，仓位按 operation_strategy 框架的公式与上限执行
    data:
    - 个人持仓与风险预算
    - 情绪与资金数据
  falsification:
  - 极端信号后无转折、沿原方向延续（信号证伪）
  - 历史案例对照失效（结构条件不同）
  - 大盘系统性破位下行或宏观政策重大转向
  - 板块情绪退潮：核心标的放量滞涨、联动失效
  validation:
    historical_hit_rate: pending-m1
    applicable_regime: null
    known_failures:
    - 极端信号的解读部分依赖信息层与主观经验，无法完全客观化，待能力边界标注
    confidence_indicators:
    - 多个独立数据源交叉验证
    - 板块内多只个股联动
    - 机构研报密集覆盖
    - 成交量持续放大
  examples:
  - pattern_id: extreme_signal_risk_evasion
    name: 极端信号叠加风险规避
    source_raw:
    - sources/raw/财经/午盘：26-05-27：今天不能抄底，注意外盘风险.md
    key_themes:
    - 美股风险预警
    - A股外盘联动风险
    - 科技板块拥挤度分析
  - pattern_id: supply_chain_bottleneck_qualify
    name: 供应链瓶颈选股法
    source_raw:
    - sources/raw/财经/复盘：26-03-16：4050三次长下影强支撑，存储领涨，明日中阳预期，OFC三大MSA.md
    key_themes:
    - 半导体材料
    - 化工涨价
    - 资源涨价
