  topic: 评估AI模型公司收入时要分清ARR与年化运行率，后者可能是单月收入乘十二
  timeframe: permanent
  statement: 讨论AI收入时需要分清年度经常性收入（ARR）与年化收入运行率：后者可能只是把最近一个月的收入乘以十二；按用量收费业务的收入稳定性需由客户持续消费和合同承诺支撑，包含集中试用、重复运行或未受预算约束消耗的单月高额数据，未必能够持续一年。
  evidence_quote: 讨论 AI 收入时，需要分清“年度经常性收入”和“年化收入运行率”。前者通常被简称为 ARR，后者可能只是把最近一个月的收入乘以十二。
  interpretation: UP给出的AI收入口径方法论：判断模型公司增长持续性时先核对收入口径，运行率数据（如媒体转述的Meta百亿美元采购预测）不能直接当成已获得收入；该判据可用于过滤AI算力链公司的订单/收入新闻成色。
