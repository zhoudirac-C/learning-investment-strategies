  data_requirements:
  - name: 涨跌停与连板数据
    channel: 东财涨停池（涨停/跌停家数、连板高度、炸板率）
  - name: 市场量能与涨跌分布
    channel: 行情数据（成交额/涨跌家数比）
  - name: 分时恐慌盘与核心标的表现
    channel: 分时行情 / K线缓存
  - name: 首板与新题材数据
    channel: 东财涨停池 / 新题材首板统计
  - name: 套牢盘与资金流向
    channel: 行情数据（板块筹码分布/资金流入排名）
  - name: 历史情绪周期参照
    channel: 历史行情回放 / K线缓存（infra/data/kline_cache.db）
  steps:
  - step: 1
    name: 定位情绪周期阶段
    question: 当前市场情绪处于哪个阶段？
    action: 用涨跌家数比、涨停跌停比、连板高度、炸板率、恐慌盘等指标对照近期区间，判定处于冰点/修复/高潮/退潮哪一阶段（术语客观定义见 framework/up-glossary.md）
    data:
    - 涨跌停与连板数据
    - 市场量能与涨跌分布
  - step: 2
    name: 识别情绪拐点信号
    question: 是否出现情绪拐点的确认信号？
    action: 左侧拐点核对：恐慌盘涌出+缩量+核心标的不跌停；右侧拐点核对：首板增多+连板高度回升+炸板率下降
    data:
    - 分时恐慌盘与核心标的表现
    - 涨跌停与连板数据
  - step: 3
    name: 筛选情绪修复方向
    question: 情绪修复时哪些方向最可能率先反弹？
    action: 冰点修复优先看两类——前期主线龙头（辨识度最高）与低位新题材（无套牢盘）；避开高位补跌方向
    data:
    - 首板与新题材数据
    - 套牢盘与资金流向
  - step: 4
    name: 制定仓位与操作策略
    question: 不同情绪阶段应采取什么仓位策略？
    action: 按阶段定仓位：冰点轻仓试错或空仓观望、修复期逐步加仓主线、高潮期减仓兑现、退潮期空仓或切换防御
    data:
    - 历史情绪周期参照
    - 市场量能与涨跌分布
  falsification:
  - 冰点判定后继续放量下跌、核心标的补跌跌停（拐点证伪）
  - 修复期首板次日无溢价、连板高度不升反降（修复失败）
  - 大盘系统性破位下行或宏观政策重大转向
  - 板块情绪退潮：核心标的放量滞涨、联动失效
