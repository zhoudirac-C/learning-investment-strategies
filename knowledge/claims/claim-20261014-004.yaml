  subject: 美国CPI的核心检验点：能源涨价是否扩散
  timeframe: short-term
  statement: 本次CPI最需要检验的是油价上涨带来的通胀压力有没有扩散到能源以外的商品和服务：整体CPI环比升至0.6%已被市场接受、未必带来额外冲击；核心CPI达0.2%或更低则支持美债收益率继续回落；核心CPI明显超预期意味着非能源通胀压力比想象顽固，此前债市修复判断会受到挑战。
  evidence_quote: 这次美国CPI最需要检验的，是油价上涨带来的通胀压力，有没有扩散到能源以外的商品和服务。按照预期，市场已经接受整体CPI环比升至0.6%，同时预计核心CPI降至0.2%……整体CPI达到0.6%，未必会带来额外冲击，因为市场已经有所准备；核心CPI达到0.2%或更低，则可能支持近期美债收益率继续回落。反过来，核心CPI如果明显超预期，就意味着非能源领域的通胀压力可能比市场想象的更顽固……
  interpretation: 宏观数据解读框架：分整体 vs 核心两条线，关键问题不是数据本身高低而是「是否已被预期消化」——已消化的坏数据不冲击，未消化的核心超预期才冲击。
