  subject: 第二类卖点的当下确认方法
  topic: 看向上段的内部结构，内部背驰且未创新高或盘整顶背驰就一定是第二类卖点
  statement: 当下确认第二类卖点的方法与区间套定理一样：看该向上段的内部结构，一旦内部出现背驰而当时位置没创新高，或与前面走势产生盘整顶背驰，那么就一定是第二类卖点，可以用理论完全明确地确认，没有含糊的地方。辅助判断可以用成交量，或比较MACD柱子与前后柱子绝对值的大小。
  evidence_quote: 具体的方法和区间套定理是一样的，就是看A 段的内部结构，一旦内部出现背驰而当时位置没创新高或与前面走势产生盘整顶背驰，那么就一定是第二类卖点……这可以成交量，或从第一个红箭头所指的MACD 绿柱子与后面红柱子绝对值大小比较辅助判断。因此，这个第二类卖点，可以用理论完全明确地确认，一点含糊的地方都不会有。
  interpretation: 把第二类卖点从形态描述变成可当下执行的检查清单：不创新高加内部背驰。判断的严格性来自内部结构而非对后市的预测。
