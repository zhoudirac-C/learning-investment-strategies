subject: 周二仓位安排与三种情形进退条件
timeframe: short-term
statement: 周二仓位安排：5—6成仓用于已关注方向的超跌反弹；2—3成仓尝试破冰龙或拐点卡位龙；2—3成资金保留机动。可执行组合：5成超跌＋2成试错＋3成机动，或5成超跌＋3成试错＋2成机动；若超跌提高到6成，则配合2成试错与2成机动。做T仅围绕适用交易规则下的已有可卖持仓开展，A股普通股票当日新买入部分不能当天卖出，不把机动资金理解成无限加仓额度。三种情形：情形A科技止跌与题材回流共振，优先完成已关注方向的超跌修复；情形B指数横住个股继续分化，超跌以承接稳定的品种为主；情形C托底失效补跌重新扩大，下调仓位与试错强度，重新检验底部判断。看多框架必须接受市场验证，不能因为“最确定”的个人判断，就忽视失败信号。
evidence_quote: 我的周二安排是：5—6成仓用于已关注方向的超跌反弹；2—3成仓尝试破冰龙或拐点卡位龙；2—3成资金保留机动……情形A：若“易中天”与二线PCB抛压减轻，指数回落有人承接……则优先完成已关注方向的超跌修复，再比较轮动的主动方向。情形B：若量能仍弱、权重托住指数，但连板晋级与跌停并未改善，则继续按混沌试错期处理。情形C：若指数再次放量走弱，科技权重持续压盘，连续跌停增加，且已确认的日线结构出现破坏，就应下调仓位与试错强度，重新检验底部判断。看多框架必须接受市场验证，不能因为“最确定”的个人判断，就忽视失败信号。
interpretation: UP给出周二具体仓位安排（5-6成超跌、2-3成试错、2-3成机动的三种组合）和三种情形的进退条件，强调看多框架必须接受市场验证，不能忽视失败信号。
