chain_id: biobased-biodegradable-chem
name: 生物基/生物降解化学制品（乳酸-聚乳酸）产业链
thesis: 金丹科技为乳酸及聚乳酸龙头，醋化股份主营醋酸衍生物可用于生物降解塑料增塑，恒大高新涉足化工新材料。生物基材料以玉米等为原料经发酵制乳酸，聚合成聚乳酸（PLA），用于可降解包装、农膜等。政策推动下可降解塑料渗透率提升，带动中游乳酸/PLA及上游生物发酵环节。
last_verified: '2026-10-14'
