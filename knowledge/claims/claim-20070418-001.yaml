  subject: 单中枢平衡市的强弱细分
  topic: 前三根30分钟K线定全天区间，按高低点出现位置与收盘位置定强弱
  statement: 单中枢平衡市下，一般情况下开盘后前三根30分钟K线就决定了全天的波动区间，全天的极限位置至少有一个出现在前三根K线上（不是创出当天高点就是创出当天低点，不是完全绝对）。细分为三小类：一、前三根K线出现当天高点，称弱平衡市，最弱是当天低点收（与是否红盘无关，高开红盘收也可形成最弱形态），次弱收在中枢之下，收在中枢是一般，收在当天高点附近最强；二、前三根K线出现当天低点，称强平衡市，最强以当天高点收，次强收在中枢之上，收在中枢一般，收在当天低点附近最弱；三、前三根K线不出现当天高低点，称转折平衡市，同样按收盘位置定义强弱。注意中枢位置不一定是前三根K线的重叠，可以是后面几根的。
  evidence_quote: 这种走势，是典型的平衡市，一般情况下，开盘后前三根30 分钟K 线就决定了全天的波动区间，而全天的极限位置，基本上，至少有一个都出现在这前三根30 分钟K 线上……在前三根30 分钟K 线出现当天高点，这可以称为弱平衡市，其中最弱的是当天低点收，注意，这和当天是否红盘无关……在前三根30 分钟K 线出现当天低点，这可以称为强平衡市，其中最强的，就是以当天高点收，同样，这与当天是否红盘无关。
  interpretation: 强弱判断用结构位置而非红绿盘：收盘相对中枢与高低点的位置才是强弱标准。这套细分可把每天盘面归到9格强弱矩阵里，服务于日内辅助判断。
