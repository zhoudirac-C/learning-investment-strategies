  subject: 买错比卖错严重
  topic: 对散户没有卖错只有买错，确认买错必须手起刀落，第二三类买卖点是改正机会
  statement: 对于散户，本质上没有卖错，只有买错：卖错又不会亏钱，买错就不同了；卖错了有钱，市场上这么多股票可以被面首，为什么要一棵树吊死。钢铁战士标准：买点总在恐慌的下跌中形成，只要买点出现就要义无反顾地买进；上涨中抵抗住各种情绪干扰把股票持住，决不中途被抛下车；卖点总在疯狂的上涨中形成，只要卖点出现手起刀落让股票见鬼去；买错比卖错严重，一旦确认买错一定要手起刀落；第一类买卖点是市场给的第一次改正机会，没把握还有第二类买卖点，第二类还没把握还有第三类，两次机会都没把握就该退出；任何操作失误只是一次跌倒，失误就要总结，绝对不在同一错误上犯两次。
  evidence_quote: 对于散户来说，本质上没有卖错，只有买错。为什么？卖错又不会亏钱，买错就不同了。卖错了，有钱，这么多股票可以被面首，为什么要一棵树吊死？……五、买错比卖错严重，一旦确认买错了，一定要手起刀落，让股票见鬼去。如果市场给你一次改正错误的机会你没把握，也就是第二类买卖点，那就买豆腐回家；如果市场给你第二次改正错误的机会你没把握，也就是第三类买卖点，那就直接回家磨墙。……失误就要总结，绝对不在同一错误上犯上两次。
  interpretation: 卖点出现还幻想新高、顶分型出来反而假设是假的，被作者归因于贪嗔痴疑慢而非技术问题。没有手起刀落修为的人先把仓位减下来，干自己能力范围内的事情，市场上不是每一笔钱都适合任何人去赚。
