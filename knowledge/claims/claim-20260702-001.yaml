  statement: UP重申核心方法论：不赌、只做右侧；降低成功率与收益率预期，在四千多家里找高切低与在几百家主线里聚焦难度完全不同。主线唯一的缺点就是高与贵，一旦调整充分又会重新成为高性价比机会。
  evidence_quote: 降低成功率与收益率的预期，在四千多家里找高切低，与在几百家主线里聚焦，难度完全不同——不赌、只做右侧。贯穿全文，UP反复强调只在有放量、资金关注、出现右侧信号的标的上逐步上仓，不去赌左侧。
  interpretation: UP的系统性方法论总结：①「不赌」=不在缺乏信号的方向上下重注 ②「只做右侧」=等放量、资金关注后再上仓 ③高切低≠随便买低位，而是找基本面保护+右侧信号的标的。这段也解释了为什么UP操作风格偏保守：聚焦主线（几百家）比乱切低位（四千多家）的胜率高得多。
