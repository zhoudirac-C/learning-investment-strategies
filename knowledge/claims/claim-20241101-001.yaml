  subject: 短线选股口诀涨停放量回调缩量
  topic: 短线选股四步口诀「涨停放量回调缩量」，缩量日买入分两批卖出
  timeframe: permanent
  statement: 短线选股口诀「一涨停、二放量、三回调、四缩量」：首日涨停，次日放出比首日更长的量柱，第三日回调，第四日缩量至约为首日成交量一半时，在缩量日买入，后续分两批陆续卖出
  evidence_quote: 首先记住一个口诀：一涨停，二放量，三回调，四缩量。你看在8月27号它涨停了，8月28号有一个放量，比第一天的柱子还长。第三天回调，第四天缩量，它的量大概缩到了第一天成交量的一半。对吧，那我在缩量的这天买入，分两笔在陆续在后续卖出。
  interpretation: UP称该方法2021年就已提出、非常适合新人，并自陈「不一定百分百准确」「盈亏自负」。逻辑链条：涨停确认强度、放量确认资金跟进、回调给出低点、缩量确认抛压衰竭，缩量日是赔率最好的买点。属涨停板后缩量回踩买入模式。
