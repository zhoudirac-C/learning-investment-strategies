updated_at: '2026-06-05'
patterns:
- pattern_id: upstream_price_cycle_qualify
  name: 上游涨价周期的定性判断——区分"真周期"与"外溢映射"
  description: UP 在分析 MLCC/被动元件涨价时，不盲目类比"存储大缺货"，而是通过需求占比、产线兼容性、价值量对比三个维度判断涨价的真实级别。
  source_raw:
  - sources/raw/财经/复盘：26-05-31：科技震荡消化拥挤，被动元件全面进入周期上行.md
  - sources/raw/财经/视频：26-05-23：Rubin BOM拆解，PCB、MLCC、ABF涨价与半导体光互联扩散.md
  applicable_themes:
  - MLCC
  - 被动元件
  - 存储
  - 硅片
  - PCB
  - ABF基板
  reasoning_chain:
  - step: 1
    name: 算AI对总需求的真实占比
    question: AI对这个行业的需求占总量多少？
    UP_logic: MLCC：AI对全球MLCC需求只有约10%。如果AI占比小，涨价逻辑就不是"AI需求爆发"，而是"产线转换造成的结构性缺口"。
    evidence_sources:
    - 行业数据（全球需求总量、AI服务器用量）
    - 公司调研纪要
    - 机构研报
  - step: 2
    name: 检查产线兼容性——高容能否挤占普通品
    question: AI所需的高端产品产线能否切换去生产普通品？反过来呢？
    UP_logic: 高容产线不能兼容低容，但低容产线可以被改造去生产高容。当原厂把产能向高容倾斜时，中低容产能被压缩，造成"全品类紧缺"的假象——本质是结构性转移，不是需求全面爆发。
    evidence_sources:
    - 原厂产能公告
    - 交期数据（常规8-10周→12周+）
    - 稼动率分层数据
  - step: 3
    name: 对比历史周期位置
    question: 当前处于历史周期的哪个阶段？与上一轮大缺货的差距有多大？
    UP_logic: 订单出货比1.2，仅为2017年历史高点的1/3。稼动率80-95%均低于历史缺货期90%+。价格仅为历史峰值的50-60%。结论：涨价初期，而非高潮。
    evidence_sources:
    - 历史订单出货比
    - 历史稼动率
    - 历史价格峰值
  - step: 4
    name: 判断涨价性质——"量的改善"还是"价的爆发"
    question: 这轮涨价是量驱动的还是价驱动的？
    UP_logic: 量的改善强于价的改善。MLCC承接海外超高产能挤压出的外溢需求。AI所需高容海外也在扩产。价值量、扩产难度、供需格局都无法与存储类比。A股偏"海外映射"行情。
    evidence_sources:
    - 海外龙头扩产计划
    - 海外涨价函（村田、三星、太阳诱电）
    - 国内外价差
  - step: 5
    name: 判断持续性
    question: 这个缺口能持续多久？
    UP_logic: 缺口大约还能持续半年以上。中低端紧缺至少延续至2026年底（扩产周期6-9个月）。日韩厂商主动退出中低端。若全行业稼动率突破90%将触发大幅涨价。
    evidence_sources:
    - 扩产周期（设备订购→量产6-9个月）
    - 日韩产能退出计划
    - 渠道库存水平
  risk_factors:
  - 涨价被证伪（原厂辟谣/产能快速释放）
  - 大盘系统性风险（指数大跌>3%）
  - 下游AI资本开支削减
  - 渠道库存突然增加（从3-4个月升至>6个月）
  confidence_indicators:
  - 多家海外龙头同步涨价
  - 交期持续拉长
  - 渠道库存降至历史低位
  - 稼动率突破90%
  related_wiki:
  - knowledge/wiki/市场分析/MLCC与被动元件.md
- pattern_id: upstream_beneficiary_screening
  name: 涨价周期中的受益标的筛选——三条受益逻辑
  description: UP 在上游涨价周期中，用三条逻辑线筛选受益标的：高端承接、上游供货、弹性最大。每条逻辑线的受益逻辑和风险不同。
  source_raw:
  - sources/raw/财经/复盘：26-05-31：科技震荡消化拥挤，被动元件全面进入周期上行.md
  applicable_themes:
  - MLCC
  - 被动元件
  - PCB
  - 存储
  - 硅片
  reasoning_chain:
  - step: 1
    name: 逻辑一——高端承接
    question: 谁能吃下海外高端产能外溢出的需求？
    UP_logic: 有大批量、高良率、低成本的高端产品能力的企业，能吃下超高端AI挤压让出的高端市场需求实现跃升。国产高容第一梯队：三环集团（高容占比25-30%）、风华高科（约20%）。
    selection_criteria:
    - 高容产品占比
    - 良率水平
    - 是否进入海外供应链
    typical_stocks: 三环集团、顺络电子、利和兴
  - step: 2
    name: 逻辑二——上游/海外供货
    question: 谁面向海外大厂供货，直接受益海外需求暴涨？
    UP_logic: 面向村田、三星等海外大厂供货的上游企业，直接受益海外需求暴涨。这些企业不直接面对终端涨价，但出货量随海外大厂扩产同步增长。
    selection_criteria:
    - 是否村田/三星/太阳诱电供应商
    - 单客占比
    - 扩产跟随能力
    typical_stocks: 洁美科技、博迁新材、国瓷材料
  - step: 3
    name: 逻辑三——弹性最大
    question: 如果出现全面涨价（"类存储"情景），谁弹性最大？
    UP_logic: 若2027年出现海外转产、MLCC全面涨价，弹性最大的标的通常是国内产能最大、产品线最全、对涨价最敏感的企业。这是高赔率但低确定性的逻辑。
    selection_criteria:
    - 产能规模（国内最大）
    - 产品线广度
    - 涨价敏感度（毛利率对价格弹性）
    typical_stocks: 风华高科
  risk_factors:
  - 高端承接逻辑：技术突破不及预期、迟迟无法进海外供应链
  - 上游供货逻辑：海外大厂砍单、国产替代放缓
  - 弹性逻辑：全面涨价未兑现、产能过剩
  related_wiki:
  - knowledge/wiki/市场分析/MLCC与被动元件.md
- pattern_id: sector_mainline_judgment
  name: 主线是否切换的判断——存量博弈下的"假切换"识别
  description: UP 在判断市场是否出现风格/主线切换时，用增量资金、产业景气度、替代板块业绩三个维度排除假信号。
  source_raw:
  - sources/raw/财经/复盘：26-05-31：科技震荡消化拥挤，被动元件全面进入周期上行.md
  applicable_themes:
  - 主线判断
  - 风格切换
  - 存量博弈
  reasoning_chain:
  - step: 1
    name: 判断是震荡还是反转
    question: 科技下跌是正常震荡消化拥挤，还是主线终结？
    UP_logic: 存量环境下，主线退潮时支线并不会因此受益。超跌方向若没有增量资金，大概率是"反弹"而非"反转"。资金凝聚共识只靠产业景气度，只靠"跌多了"凝聚不了。
    evidence_sources:
    - 全市场成交额
    - 增量资金流向
    - 融资余额变化
  - step: 2
    name: 检查替代板块景气度
    question: 有没有任何一个板块能替代当前主线的产业景气度？
    UP_logic: 微观调研下来，除AI外其余确实没有景气度。业绩与景气度没有一个能打的。这是本轮牛市的根基与底色——主线切换需要出现一两只巨高收益率的非主线标的。
    evidence_sources:
    - 各行业Q1/Q2业绩预告
    - 产业调研纪要
    - 行业景气度指数
  - step: 3
    name: 找到真正的方向——"已兑现业绩"优先于"有想象空间"
    question: 如果主线不切换，应该聚焦主线内的哪类标的？
    UP_logic: 已看到业绩增速的算力硬件（光通信、PCB、部分算力上游涨价品种）仍相对强势，不少核心个股逆势创新高。先进制程/国产算力业绩释放大概率在下半年Q3起。跟着"产业趋势+已兑现业绩"找方向。
    evidence_sources:
    - Q1季报
    - 订单/出货数据
    - 涨价函
  risk_factors:
  - 大盘系统性风险（指数跌破关键支撑位）
  - AI资本开支大幅削减
  - 新主线板块出现超预期业绩
  - 政策重大转向（如关税、制裁）
  related_wiki:
  - knowledge/wiki/投资方法论/主线判断.md
- pattern_id: bom_value_migration
  name: BOM价值量扩散——从单点升级到全链条扩散的产业趋势判断
  description: UP 在分析英伟达新一代架构（Rubin/VR200）BOM拆解时，识别出"GPU占比下降、周边组件价值量暴涨"的产业趋势，并据此找出最有斜率的方向。
  source_raw:
  - sources/raw/财经/视频：26-05-23：Rubin BOM拆解，PCB、MLCC、ABF涨价与半导体光互联扩散.md
  applicable_themes:
  - Rubin BOM
  - PCB
  - MLCC
  - ABF
  - 存储
  - 液冷
  - 电源
  reasoning_chain:
  - step: 1
    name: 找价值量增幅最大的环节
    question: 新一代架构中，哪些组件的价值量增幅最大？
    UP_logic: 不只看绝对金额。GPU绝对金额在涨但占比在降。内存+435%、PCB+233%、MLCC+182%、ABF+82%——增幅排序就是产业关注优先级。
    evidence_sources:
    - 摩根士丹利/大摩BOM拆解研报
    - 英伟达技术白皮书
    - 供应链调研
  - step: 2
    name: 区分增量来源——量增/价增/新品
    question: 价值量增长是靠什么驱动的？量、价、还是新增品类？
    UP_logic: PCB的三重升级：层数提升（22→26层）、材料升级（M7→M8）、新增品类（Midplane中板+ConnectX模组PCB）。三重驱动叠加，是"斜率之王"。
    evidence_sources:
    - 技术规格对比表
    - 供应商报价
    - 层数/材料升级路径
  - step: 3
    name: 映射到A股标的——谁在供应链里
    question: 这个方向的A股标的有哪些？谁最受益？
    UP_logic: PCB板厂→胜宏科技/鹏鼎控股/生益科技；钻针→中钨高新/欧科亿；覆铜板/电子布→生益科技/南亚新材。MLCC原厂→三环/风华/利和兴；上游→洁美/博迁/国瓷。
    evidence_sources:
    - 公司公告（供货关系）
    - 产业链调研
    - 机构供应链报告
  risk_factors:
  - Rubin量产延期
  - 技术路线变更（正交背板被铜缆替代）
  - 供应链份额被海外厂商抢占
  - AI资本开支下调影响后续迭代节奏
  related_wiki:
  - knowledge/wiki/市场分析/PCB与先进封装.md
  - knowledge/wiki/市场分析/MLCC与被动元件.md
- pattern_id: stock_qualify_chain
  name: 个股业绩拆解与定性链
  description: 通过拆解财报异常项、区分一次性因素与主营趋势，判断个股是否属于‘假爆雷’或‘真利好’，并评估其估值重估逻辑
  applicable_themes:
  - 个股财报分析
  - 业绩暴雷识别
  - 估值重估判断
  reasoning_chain:
  - step: 1
    name: 拆解异常项
    question: 财报中利润/现金流下降的原因是什么？
    UP_logic: 不只看净利润数字，先看公司解释：是否因子公司出表、股份支付、汇兑损失等一次性因素导致
    evidence_sources:
    - 公司财报附注
    - 管理层讨论与分析
  - step: 2
    name: 还原主营趋势
    question: 剔除一次性因素后，主营业务是否真正改善？
    UP_logic: 扣除股份支付及汇兑损失后净利润同比增长33%，且毛利率同比提升，说明主营在变好
    evidence_sources:
    - 扣非净利润
    - 毛利率同比数据
    - 同口径收入对比
  - step: 3
    name: 定性风险性质
    question: 该异常是短期扰动还是长期恶化？
    UP_logic: 汇兑损失是会计重估而非真实结汇损失，且公司海外现金多、无换汇必要，属于短期账面波动
    evidence_sources:
    - 公司现金持有结构
    - 汇率走势
    - 海外业务占比
  - step: 4
    name: 判断估值逻辑
    question: 当前股价是否反映了主营改善？市场给的是什么估值？
    UP_logic: 市场过去给旧行业估值，AI改变增长曲线后毛利率站上30%+，股价才慢慢涨，说明估值逻辑在切换
    evidence_sources:
    - 历史毛利率对比
    - 行业估值中枢变化
    - 股价与业绩的滞后关系
  risk_factors:
  - 一次性因素被误判为长期恶化
  - 主营改善但市场不认可新估值逻辑
  - 汇兑损失持续扩大且真实结汇发生
  confidence_indicators:
  - 毛利率连续多季度同比提升
  - 公司主动解释异常项且逻辑自洽
  - 同行业可比公司出现类似趋势
  source_raw:
  - sources/raw/财经/周复盘：26-04-26：交易需要不完美，也需要接受不完美.md
- pattern_id: sector_qualification_three_drivers
  name: 三力驱动板块筛选法
  description: 通过分析一个板块是否同时具备宏观、产业和资金三重驱动力，来判断其投资价值和行情持续性。
  applicable_themes:
  - 板块分析
  - 主题投资
  - 行业轮动
  reasoning_chain:
  - step: 1
    name: 宏观驱动力判断
    question: 该板块是否受益于当前的宏观经济环境或政策导向？
    UP_logic: 分析宏观数据（如PPI、CPI、汇率）和政策方向，判断是否存在对该板块有利的宏观驱动力。例如，PPI回升利好上游周期品，人民币升值利好核心资产。
    evidence_sources:
    - CPI/PPI数据
    - 人民币汇率走势
    - 美联储政策
    - 政治局会议
  - step: 2
    name: 产业驱动力判断
    question: 该板块是否具备坚实的产业逻辑或需求支撑？
    UP_logic: 分析产业趋势、技术变革或供需格局，判断是否存在独立的、可持续的产业驱动力。例如，AI算力需求拉动上游硬件，能源价格上升强化储能需求。
    evidence_sources:
    - AI产业趋势
    - 半导体国产替代
    - 全球资源品周期
    - AI电气化需求
  - step: 3
    name: 资金驱动力判断
    question: 当前市场资金是否正在流入或准备流入该板块？
    UP_logic: 分析市场资金结构（如融资盘、换手率、ETF申赎），判断资金是否形成合力。例如，融资买入额占比高位意味着行情弹性大但脆弱；资金从AI流出后可能流入有色。
    evidence_sources:
    - 融资买入额占比
    - 行业换手率
    - 宽基ETF净申赎
    - 板块成交量
  risk_factors:
  - 宏观驱动力逆转（如货币政策收紧、汇率转向贬值）
  - 产业逻辑证伪（如AI需求不及预期、技术路线改变）
  - 资金结构恶化（如杠杆资金踩踏、成交量持续萎缩）
  confidence_indicators:
  - 三个驱动力同时成立，且相互强化
  - 板块估值处于相对低位，具备安全边际
  - 市场出现新的催化事件（如政策落地、产品发布）
  source_raw:
  - sources/raw/财经/视频：26-05-17：5月中旬A股周复盘，CPI-PPI、人民币汇率、美联储与A股策略.md
- pattern_id: mainline_identification_framework
  name: 主线行情识别框架
  description: 通过政策级别、海外锚点、持续性、发散性、资金共振五个维度判断板块是否为主线行情，并跟踪游资-机构-散户三阶段资金演绎
  applicable_themes:
  - 科技板块主线判断
  - 新兴行业投资机会
  - 政策驱动型行情
  reasoning_chain:
  - step: 1
    name: 政策级别判断
    question: 该主题是否上升到国家战略/大国博弈层面？
    UP_logic: 最大级别消息是政策，判断是否属于中央经济工作会议定调或十五五规划重点方向
    evidence_sources:
    - 中央经济工作会议
    - 十五五规划
  - step: 2
    name: 海外锚点对标
    question: 有没有海外对标股走出浩浩荡荡的行情？
    UP_logic: 寻找海外市场已出现的主线龙头，作为国内板块空间参照
    evidence_sources:
    - 美股科技股走势
    - 海外龙头公司股价
  - step: 3
    name: 持续性验证
    question: 行情是否持续多日，给足研究时间？
    UP_logic: 主线不会一天两天结束，会给你足够时间研究，不会今天进明天套
    evidence_sources:
    - 板块指数走势
    - 龙头股连板天数
  - step: 4
    name: 发散性检查
    question: 是否扩散到多个子题材？
    UP_logic: 主线会从单一概念扩散到多个子方向，如商业航天→太空算力/火箭发射/卫星制造
    evidence_sources:
    - 子板块联动情况
    - 新概念出现频率
  - step: 5
    name: 资金共振确认
    question: 游资、机构、散户、外资是否都愿意参与？
    UP_logic: 游资打第一波连板，机构后续介入走趋势，散户外资跟进形成合力
    evidence_sources:
    - 龙虎榜数据
    - 机构持仓变化
    - 北向资金流向
  risk_factors:
  - 政策力度不及预期或转向
  - 海外对标股行情结束或回调
  - 资金共振未能形成，仅游资炒作无机构跟进
  confidence_indicators:
  - 多个维度同时满足（政策+海外+持续性+发散性+资金）
  - 机构票开始走趋势（如上影线减少、成交量放大）
  - 龙头股打出4板以上高度且带动板块内其他个股
  source_raw:
  - sources/raw/财经/周复盘：25-12-21：A股反弹周期能持续多久.md
- pattern_id: cycle_shift_asset_pricing
  name: 康波周期切换资产定价法
  description: 基于康波周期萧条期末尾向复苏期切换的历史规律，判断资产定价逻辑从美元信用转向技术创新，并筛选受益资产。
  applicable_themes:
  - 大宗商品定价
  - 贵金属投资
  - 新能源产业链
  - AI应用投资
  reasoning_chain:
  - step: 1
    name: 定位周期阶段
    question: 当前处于康波周期的哪个阶段？
    UP_logic: 通过历史五轮康波周期时间表，定位当前为第五轮萧条期末尾，即将进入第六轮复苏期起点。
    evidence_sources:
    - 康波周期历史时间表
    - GDP增速、失业率等经济数据
  - step: 2
    name: 识别历史对照
    question: 历史上类似周期阶段发生了什么？
    UP_logic: 对照1980年第四轮康波萧条期尾声，当时滞涨+美元信用危机导致白银暴涨，作为当前周期切换的参照。
    evidence_sources:
    - 1980年白银暴涨历史数据
    - 布雷顿森林体系崩溃记录
  - step: 3
    name: 分析新定价逻辑
    question: 新周期下资产定价的核心变量是什么？
    UP_logic: 从旧逻辑（美元信用）转向新逻辑（技术创新），贵金属从单纯避险变为货币信用压舱石+工业需求双重定价。
    evidence_sources:
    - 新能源产业白银需求数据
    - 数字货币跨境支付试点进展
  - step: 4
    name: 筛选受益资产
    question: 哪些资产在新逻辑下受益？
    UP_logic: 有技术壁垒的新能源/AI/生物科技成为核心资产，白银因工业需求爆发式增长而具备结构性上涨基础。
    evidence_sources:
    - AI应用商业化落地进展
    - 新能源汽车市场份额数据
  risk_factors:
  - 技术商业化落地不及预期
  - 美元信用体系未显著削弱
  - 全球经济复苏延迟
  confidence_indicators:
  - AI应用从实验室走向工业制造等实际场景
  - 新能源成本持续下降且市场份额突破30%
  - 央行数字货币跨境支付试点扩大
  source_raw:
  - sources/raw/财经/周复盘：26-01-04：2026全球经济新周期.md
- pattern_id: price_increase_profit_leverage
  name: 涨价利润弹性分析
  description: 通过分析产品涨价对利润的杠杆效应，判断相关公司业绩爆发潜力的推理模式。
  applicable_themes:
  - 化工
  - 存储芯片
  - 资源品
  - 有色金属
  - 锂电材料
  reasoning_chain:
  - step: 1
    name: 确认成本不变
    question: 涨价的核心成本（如原材料、制造费用）是否基本保持不变？
    UP_logic: 假设成本不变，涨价部分将直接转化为利润增量。原文逻辑：'成本10元，涨价到12元，成本不变'。
    evidence_sources:
    - 行业研报
    - 公司财报
    - 产业链调研
  - step: 2
    name: 计算利润弹性
    question: 涨价幅度与利润增幅的数学关系是怎样的？
    UP_logic: 计算涨价百分比对利润百分比的放大效应。原文逻辑：'涨价不到10%（从11到12），利润翻倍（+100%）'。
    evidence_sources:
    - 产品价格数据
    - 公司历史毛利率
  - step: 3
    name: 寻找涨价信号
    question: 是否有确凿的证据表明产品正在或即将涨价？
    UP_logic: 寻找第一手、非公开的涨价信息作为触发点。原文逻辑：'建议加一些硬件渠道群、QQ群，拿到第一手涨价资料'。
    evidence_sources:
    - 渠道商报价
    - 行业微信群
    - QQ群
    - 现货市场价格
  - step: 4
    name: 映射到投资标的
    question: 哪些上市公司能直接受益于该产品的涨价？
    UP_logic: 找到生产该涨价产品的核心上市公司。原文逻辑：'存储芯片 → 显卡显存涨价'，映射到相关存储公司。
    evidence_sources:
    - 公司主营业务
    - 产品营收占比
  risk_factors:
  - 涨价逻辑被证伪，即成本同步或更快上涨
  - 涨价不可持续，是短期炒作而非供需结构变化
  - 公司无法将涨价完全传导至下游客户
  confidence_indicators:
  - 多个独立渠道交叉验证涨价信息
  - 涨价产品是公司核心利润来源，营收占比高
  - 行业进入去库存周期尾声，需求开始复苏
  source_raw:
  - sources/raw/财经/周复盘：26-01-11：A股暴涨之下如何守住繁华.md
- pattern_id: sector_rotation_qualify
  name: 主线板块回调上车法
  description: 通过判断主线板块是否处于主升浪，等待回调确认后寻找买点，并利用ETF或可转债作为替代工具。
  applicable_themes:
  - AI应用
  - 商业航天
  - 新能源
  reasoning_chain:
  - step: 1
    name: 确认主线地位
    question: 当前哪个板块是市场最强主线？
    UP_logic: 通过观察板块涨停潮、资金承载量（如7000~8000亿）和持续性（如AI应用连续多日最强）来确认主线。
    evidence_sources:
    - 板块涨停数据
    - 资金流向
    - 博主历史提示
  - step: 2
    name: 判断主升浪状态
    question: 该主线是否处于主升浪？
    UP_logic: 如果板块连续上涨且未出现大级别顶部信号（如30分钟顶部钝化+高9），则判断为主升浪。
    evidence_sources:
    - 技术指标（顶部钝化、高9）
    - 板块指数走势
  - step: 3
    name: 等待回调买点
    question: 主升浪中何时是安全上车点？
    UP_logic: 主升浪中，回调后拉回的时刻（如早盘砸后拉回）是买点，不追高，等回调确认。
    evidence_sources:
    - 日内分时图
    - 个股回拉形态（如美登科技）
  - step: 4
    name: 替代工具选择
    question: 如果无法直接买入个股怎么办？
    UP_logic: 若权限受限或个股一字板，可通过ETF持仓反推个股，或直接做ETF/可转债（如塞力转债）来参与行情。
    evidence_sources:
    - ETF持仓列表
    - 可转债价格与正股联动
  risk_factors:
  - 板块出现日线级别顶部信号（如美元持续贬值引发大盘风险）
  - 主升浪结束转为震荡或下跌
  confidence_indicators:
  - 板块持续放量
  - 龙头股回调后快速拉回
  - ETF出现涨停潮
  source_raw:
  - sources/raw/财经/周复盘：26-01-13：商业航天还有机会吗.md
- pattern_id: metal_short_term_anchor_judgment
  name: 有色短期双锚点判断法
  description: 通过沪纽比值和纳斯达克指数两个核心锚点，判断有色金属（白银/黄金）短期是否具备企稳或反弹条件。
  applicable_themes:
  - 有色金属
  - 贵金属
  - 白银
  - 黄金
  - 大宗商品周期
  reasoning_chain:
  - step: 1
    name: 确认资金抽血源头
    question: 导致有色下跌的流动性压力是否仍在持续？
    UP_logic: 纳斯达克下跌 → 长期资本需补仓自救 → 从短期炒作资金抽血 → 有色下跌。因此，纳斯达克不止跌，有色难企稳。
    evidence_sources:
    - 纳斯达克指数走势
  - step: 2
    name: 评估现货需求强度
    question: 当前市场是否有真实的现货抢购需求来支撑价格？
    UP_logic: 通过白银期货沪纽比值与美元/人民币汇率对比：比值高于汇率（如7.1以上）= 现货抢货，有支撑；比值等于汇率 = 观望；比值低于汇率（如6.9以下）=
      无支撑，还会下杀。
    evidence_sources:
    - 白银期货沪纽比值
    - 美元/人民币汇率
  - step: 3
    name: 综合判断与决策
    question: 两个锚点是否同时发出企稳信号？
    UP_logic: 只有当纳斯达克停止下跌（流动性压力解除）且沪纽比值回升至汇率上方（现货需求回归），才具备企稳或反弹条件。否则，应保持观望，不轻易抄底。
    evidence_sources:
    - 步骤1结论
    - 步骤2结论
  risk_factors:
  - 纳斯达克指数持续下跌，导致长期资本持续抽血。
  - 沪纽比值跌破关键汇率水平（如6.9），表明现货需求疲软，价格仍有下行空间。
  confidence_indicators:
  - 纳斯达克指数出现明确的企稳或反弹信号。
  - 沪纽比值回升至相关汇率（如7.1-7.2）以上，并保持稳定。
  source_raw:
  - sources/raw/财经/周复盘：26-01-31：金银暴跌，后续怎么看.md
- pattern_id: sector_rotation_bollinger_band
  name: 板块轮动与布林线波段操作
  description: 基于宏观逻辑判断主线板块，结合布林线技术指标进行波段操作，实现安全优先的仓位管理。
  applicable_themes:
  - AIDC
  - AI应用
  - 化工
  - 固态电池
  - 有色贵金属
  reasoning_chain:
  - step: 1
    name: 宏观定调
    question: 当前市场的主导宏观逻辑是什么？
    UP_logic: 从效率优先转向安全优先，理解商品、AI、军工等波动的底层逻辑。
    evidence_sources:
    - 美联储换帅
    - 全球供应链重构
    - AI物理铁律
  - step: 2
    name: 主线板块识别
    question: 哪些板块符合宏观逻辑且具备持续性？
    UP_logic: AIDC、AI应用、化工、固态电池等符合安全优先和AI物理铁律，有色短期回避。
    evidence_sources:
    - 板块轮动节奏
    - 个股走势强度
    - 涨价逻辑
  - step: 3
    name: 技术面择时
    question: 如何利用布林线确定买卖点？
    UP_logic: 强势股沿中轨持有，跌破中轨2-3天不拉回离场；震荡股下轨支撑位介入，上轨卖出。
    evidence_sources:
    - 布林线参数
    - 个股历史走势
    - 机构使用习惯
  - step: 4
    name: 风险控制
    question: 如何避免追高和连环亏损？
    UP_logic: 不追高，错过就错过；有色短期回避，等补跌后捡带血筹码；对冲优于all-in。
    evidence_sources:
    - 有色跌停案例
    - 商业航天暴跌节奏
    - 布林线跌破信号
  risk_factors:
  - 宏观逻辑突变（如沃什政策转向）
  - 技术面信号失效（如布林线持续下杀）
  - 板块轮动节奏被打乱
  confidence_indicators:
  - 板块内部轮动有序
  - 个股布林线支撑有效
  - 涨价逻辑持续传导
  source_raw:
  - sources/raw/财经/周复盘：26-02-01：二月投资策略：安全优先.md
- pattern_id: energy_shock_to_asset_revaluation
  name: 能源冲击下的资产定价重估
  description: 从全球能源冲击的持续时间出发，推演其对美元、油价、通胀、美联储政策的影响，并最终传导至A股风格切换和板块定价权重估的宏观分析框架。
  applicable_themes:
  - 宏观策略分析
  - 大宗商品周期
  - A股风格切换
  - 行业比较
  reasoning_chain:
  - step: 1
    name: 设定核心赌局
    question: 当前全球资产定价的核心矛盾是什么？
    UP_logic: 将所有资产定价归结为对‘能源冲击持续时间’的赌局，并设定‘短期化’和‘长期化’两种情景及其对A股的影响。
    evidence_sources:
    - 全球资产价格走势
    - 地缘政治事件
  - step: 2
    name: 分析定价锚传导
    question: 能源冲击如何通过美元这个全球定价锚影响市场？
    UP_logic: 分析美元因‘抢油’而走强，但指出其本质是‘全球金融系统失血’，并推导出‘美元在风险中等时最强，风险升级为衰退时拐点向下’的反直觉规律。
    evidence_sources:
    - 美元指数
    - 全球贸易数据
    - 新兴市场外债数据
  - step: 3
    name: 设定油价斩杀线
    question: 油价达到什么水平会触发全球经济系统性风险？
    UP_logic: 设定120美元为‘全球消费者体感熔断线’，并基于历史数据（2008、2022）论证其‘尖顶形态’和‘自我毁灭’特性，推导出高油价最终利好中国。
    evidence_sources:
    - 原油期货价格
    - 历史油价走势
    - OPEC/页岩油产能数据
  - step: 4
    name: 推导通胀拐点
    question: 通胀何时见顶，从而改变市场预期？
    UP_logic: 从‘油价传导滞后’、‘高基数效应’、‘高油价自我毁灭’、‘就业传导’四个机制，推导出五月是通胀见顶确认的认知拐点。
    evidence_sources:
    - CPI数据
    - 炼油/零售价格数据
    - 非农就业数据
  - step: 5
    name: 重估A股定价权
    question: 在能源冲击和AI冲击下，A股的定价逻辑如何变化？
    UP_logic: 提出‘代码膨胀vs食物稀缺’的宏观叙事，将行业分为受损/重塑/堡垒/受益四象限。并利用中美服务业就业结构差异，论证A股核心矛盾是‘利润率修复’而非‘AI替代风险’。
    evidence_sources:
    - 中美欧服务业就业占比数据
    - A股公司ROE数据
    - 全球市占率数据
  risk_factors:
  - 能源冲击迅速结束（如地缘冲突快速缓解），则‘长期化’推演失效。
  - 美联储政策转向超预期鹰派，导致全球流动性危机，而非简单的风格切换。
  - 中国宏观经济复苏不及预期，导致‘利润率修复’逻辑无法兑现。
  confidence_indicators:
  - 油价持续在120美元以上高位运行超过一个季度。
  - 美元指数在100以上高位震荡，同时美债收益率开始掉头向下。
  - 中国制造业PMI数据持续向好，验证‘优势制造’的盈利能力。
  source_raw:
  - sources/raw/财经/周复盘：26-03-22：能源冲击的时间赌局：从全球定价锚重塑到A股定价权重估.md
- pattern_id: geopolitical_oil_risk_chain
  name: 地缘油价传导链分析
  description: 从地缘冲突事件出发，推导油价走势、通胀压力、资产定价锚变化，最终映射到A股策略的推理链条
  applicable_themes:
  - 地缘政治
  - 大宗商品
  - 宏观对冲
  - A股策略
  reasoning_chain:
  - step: 1
    name: 地缘事件定性
    question: 当前地缘冲突是否陷入僵局或升级？
    UP_logic: 从战争进展判断双方是否陷入两难，如伊朗控制霍尔木兹海峡导致美国进退维谷
    evidence_sources:
    - 战争进展报道
    - 海峡控制权信息
  - step: 2
    name: 油价传导机制
    question: 地缘事件如何影响原油供需和价格？
    UP_logic: 从供应中断（海峡阻断→在途原油减少→库存消耗）推导油价上涨逻辑，并区分消息面与基本面驱动切换
    evidence_sources:
    - 布伦特原油价格
    - 库存数据
    - 航运跟踪
  - step: 3
    name: 宏观定价锚判断
    question: 油价上涨如何影响美债收益率和全球资产定价？
    UP_logic: 油价推升通胀预期→美债收益率逼近4.4%生死线→主权基金减持+对冲基金杠杆风险→全球资产重估
    evidence_sources:
    - 10年期美债收益率
    - 通胀预期数据
    - 央行持仓报告
  - step: 4
    name: A股映射与拐点
    question: 宏观风险如何传导至A股，拐点条件是什么？
    UP_logic: 油价回落+政策加码是修复条件，结合事件时间表（4月数据出炉、5月访华）判断拐点窗口
    evidence_sources:
    - 上证指数点位
    - 板块估值百分位
    - 政策发布时间表
  risk_factors:
  - 油价突破关键阻力位（109/115）导致通胀失控
  - 美债收益率突破4.5%引发流动性危机
  - 地缘冲突升级至胡塞武装断海峡
  confidence_indicators:
  - 布油回落至85附近
  - 美债收益率稳定在4.4%以下
  - 中美高层会晤确认并释放缓和信号
  source_raw:
  - sources/raw/财经/周复盘：26-03-29：特朗普的选择，5月15全球命运交汇点.md
- pattern_id: supply_shock_recession_trade
  name: 供给侧冲击衰退交易逻辑
  description: 从供给侧冲击事件出发，推导出经济衰退和最终降息的必然路径，并据此进行资产配置。
  applicable_themes:
  - 地缘政治冲突
  - 大宗商品价格冲击
  - 宏观经济周期判断
  - 全球资产配置
  reasoning_chain:
  - step: 1
    name: 识别冲击性质
    question: 当前的经济冲击是需求侧还是供给侧？
    UP_logic: 区分2022年需求侧通胀与2026年供给侧战争冲击，强调根本驱动因素不同。
    evidence_sources:
    - CPI数据
    - 基准利率水平
    - 冲突事件
  - step: 2
    name: 推导经济后果
    question: 供给侧冲击（如高油价）对经济体的传导路径是什么？
    UP_logic: 高油价通过抽血效应（财富转移）、压制消费、破坏行业需求，最终导致经济下滑。
    evidence_sources:
    - 油价数据
    - 贸易逆差数据
    - 行业盈利预警
  - step: 3
    name: 判断政策应对
    question: 面对经济下滑，央行的政策选择是什么？
    UP_logic: 高油价拖累经济，最终倒逼央行降息，而非市场误判的加息。引用1990年海湾战争和2008年历史案例。
    evidence_sources:
    - 历史利率走势
    - 央行政策声明
    - 政治约束分析
  - step: 4
    name: 识别市场错位
    question: 当前市场定价与正确逻辑之间是否存在偏差？
    UP_logic: 市场错误套用2022年旧剧本（高油价=通胀=加息），忽略了供给侧冲击的最终结局是衰退和降息。
    evidence_sources:
    - 非农数据
    - 市场利率期货定价
    - 美债收益率
  - step: 5
    name: 制定配置策略
    question: 基于上述逻辑，如何进行资产配置？
    UP_logic: 短期防御（持有美元、能源股），中期布局认知错位反转机会（等待衰退交易启动，布局美债、A股港股）。
    evidence_sources:
    - 资产价格走势
    - 历史估值分位
    - 政策催化
  risk_factors:
  - 冲突迅速结束，油价快速回落
  - 需求侧意外强劲，经济未受冲击
  - 央行因政治压力被迫持续加息
  confidence_indicators:
  - 油价持续高位运行
  - 非农等经济数据转弱
  - 长端美债收益率突破关键阈值（如4.5%）
  source_raw:
  - sources/raw/财经/周复盘：26-04-06：现实的误判，全球资产重新配置新策略.md
- pattern_id: ppi_cpi_scissors_analysis
  name: PPI-CPI剪刀差传导分析
  description: 通过PPI与CPI的背离（剪刀差）判断中下游企业利润被挤压的风险，并推导出结构性投资机会
  applicable_themes:
  - 周期涨价
  - 中游制造
  - 消费行业
  reasoning_chain:
  - step: 1
    name: 确认剪刀差存在
    question: PPI和CPI是否出现方向背离？
    UP_logic: PPI涨了（+0.5%），CPI没涨（同比仅1%），两者剪刀差扩大
    evidence_sources:
    - PPI同比数据
    - CPI同比数据
  - step: 2
    name: 分析利润传导路径
    question: 剪刀差如何影响产业链利润分配？
    UP_logic: PPI涨→工厂出厂价贵了；CPI没涨→老百姓没感受到物价上涨→中下游企业成本无法转嫁→利润被挤压
    evidence_sources:
    - PPI分项数据
    - CPI分项数据（猪价、菜价、旅游、金饰）
  - step: 3
    name: 推演极端后果
    question: 如果剪刀差持续，产业链会发生什么？
    UP_logic: 中下游扛不住成本→减产/倒闭→全行业需求萎缩→整体利润往下掉
    evidence_sources:
    - 历史类似案例
    - 行业调研
  - step: 4
    name: 得出结构性结论
    question: 这种环境下哪些方向有机会？
    UP_logic: 高价石油本身无法维持，涨价机会是结构性的，不是买了就能躺到年底
    evidence_sources:
    - 油价走势
    - 行业景气度指标
  risk_factors:
  - 油价超预期持续暴涨，导致PPI进一步上行
  - CPI突然跟涨，剪刀差收窄，逻辑失效
  confidence_indicators:
  - PPI环比涨幅持续扩大
  - CPI中非食品项（如服务、交通）开始走弱
  source_raw:
  - sources/raw/财经/周复盘：26-04-14：是反弹不是反转，市场为什么对中东冲突麻木了.md
- pattern_id: industry_upgrade_chain_analysis
  name: 产业升级链分析框架
  description: 从产业升级阶段、供应链地位、业绩兑现时间三个维度判断板块投资机会的推理模式
  applicable_themes:
  - AI算力
  - 液冷散热
  - 光模块
  - PCB
  - 锂矿
  reasoning_chain:
  - step: 1
    name: 产业升级阶段定位
    question: 该行业当前处于产业升级的哪个阶段？
    UP_logic: 判断产业是否有明确的技术代际升级路径（如400G→800G→1.6T），每一代对应不同材料标准，产业链持续爆发
    evidence_sources:
    - 产业技术路线图
    - 行业标准演进
  - step: 2
    name: 供应链准入判断
    question: 该标的是否进入核心供应链（如英伟达朋友圈）？
    UP_logic: 能否进入核心供应链是判断标的关键标准，如液冷最大优势是英伟达要用它，能进英伟达机柜的都得跟着用
    evidence_sources:
    - 供应商公告
    - 产业链调研
  - step: 3
    name: 业绩兑现时间评估
    question: 业绩预期在第几季度兑现？当前是否已到放量节点？
    UP_logic: 如液冷需等Rubin架构出货功耗上来才有业绩爆发，当前一季报承压；算力涨价直接反映到利润上
    evidence_sources:
    - 财报数据
    - 产品出货节奏
  - step: 4
    name: 涨价传导验证
    question: 涨价能否直接反映到利润上？
    UP_logic: 涨价是A股最硬的概念，如锂矿业绩好就是因为涨价直接反映到利润，算力租赁同理
    evidence_sources:
    - 产品价格数据
    - 公司毛利率变化
  risk_factors:
  - 产业升级路径不清晰或停滞
  - 核心供应链准入被排除
  - 业绩兑现时间大幅延后
  - 涨价无法传导至利润（如成本同步上涨）
  confidence_indicators:
  - 有明确的技术代际升级路线
  - 已进入或有望进入核心供应链
  - 产品价格持续上涨且毛利率提升
  - 龙头公司业绩超预期
  source_raw:
  - sources/raw/财经/周复盘：26-04-15：节奏预期，日线高9，算力租赁生死考验，趋势中做短线.md
- pattern_id: ai_compute_chain_4stage
  name: AI算力全产业链四阶段炒作路径
  description: 基于Token经济学和产业落地节奏，将AI算力产业链划分为算力租赁→国产芯片→AIDC→CDN四个依次递进的炒作阶段，每个阶段有明确的触发条件、核心标的和切换时机。
  applicable_themes:
  - AI算力产业链
  - 科技主题投资
  - 产业周期轮动
  reasoning_chain:
  - step: 1
    name: 确认产业质变信号
    question: 产业是否从烧钱阶段进入赚钱阶段？
    UP_logic: Token用量已起来且能算清账，类似新能源从补贴到盈利的质变，预期将重新打开。
    evidence_sources:
    - Token用量数据
    - 算力涨价信息
    - 政策改名（词元）
  - step: 2
    name: 划分产业链四阶段
    question: AI算力产业链按受益顺序如何划分？
    UP_logic: 按产业落地顺序：先炒算力租赁（有卡者受益）→国产芯片（DeepSeek V4适配）→AIDC基建（液冷/供电/光模块）→CDN（边缘延迟需求）。
    evidence_sources:
    - 产业调研
    - 公司公告
    - 政策时间节点
  - step: 3
    name: 筛选各阶段核心标的
    question: 每个阶段哪些公司具备实质性产业逻辑？
    UP_logic: 算力租赁选能拿到最新卡（GB300）的公司；国产芯片选性价比高且适配大模型的；AIDC选已签分成协议或业绩释放的；CDN选毛利率回升的。
    evidence_sources:
    - 公司公告
    - 财报数据
    - 产业链调研
  - step: 4
    name: 确定切换时间与催化剂
    question: 何时从当前阶段切换到下一阶段？
    UP_logic: 算力租赁→国产芯片：DeepSeek V4发布前后；国产芯片→AIDC：5月特朗普访华后H200引进；AIDC→CDN：AI应用爆发（自动驾驶/直播等）。
    evidence_sources:
    - 事件日历
    - 政策预期
    - 产业新闻
  risk_factors:
  - Token用量增长不及预期，算力租赁需求回落
  - DeepSeek V4发布延迟或国产芯片适配效果差
  - 特朗普访华后H200引进谈判失败
  - AIDC建设进度慢于预期，业绩释放推迟
  confidence_indicators:
  - 算力租赁公司持续公告新订单或分成协议
  - 国产芯片获得大厂批量采购订单
  - AIDC相关公司（液冷/供电）出现业绩预增
  - CDN公司毛利率连续两个季度回升
  source_raw:
  - sources/raw/财经/周复盘：26-04-20：跟上节奏，AI算力四阶段炒作路径.md
- pattern_id: stock_qualify_through_earnings_decomposition
  name: 业绩拆解与真伪判断
  description: 通过拆解财报中的非经常性损益、合并范围变化、汇兑损失等一次性因素，还原公司真实经营趋势，判断业绩是否爆雷或改善。
  applicable_themes:
  - 个股财报分析
  - 季报/年报解读
  - 业绩避雷
  reasoning_chain:
  - step: 1
    name: 识别表面数据
    question: 财报表面数据（净利润、现金流）是否异常？
    UP_logic: 先看净利润减少37%、经营现金流减少29.52%等表面数据，判断是否看起来像爆雷。
    evidence_sources:
    - 公司季报/年报利润表
    - 现金流量表
  - step: 2
    name: 拆解异常原因
    question: 表面异常是由一次性因素还是经营恶化导致？
    UP_logic: 检查合并范围变化（子公司在出表）、股份支付费用、汇兑损失等非经常性项目，剥离后看核心利润。
    evidence_sources:
    - 财报附注
    - 管理层讨论与分析
    - 非经常性损益明细
  - step: 3
    name: 还原真实趋势
    question: 剔除一次性因素后，公司主营业务的盈利趋势如何？
    UP_logic: 扣除股份支付及汇兑损失后净利润同比增长33%，且销售毛利率改善，说明主业实际向好。
    evidence_sources:
    - 同口径下收入同比数据
    - 毛利率变化
    - 扣非净利润
  - step: 4
    name: 评估持续性风险
    question: 一次性因素未来是否可能反复？是否掩盖了其他问题？
    UP_logic: 汇兑损失可能持续（人民币升值），但属会计重估非真实结汇；账上大量现金无好项目是长期隐忧。
    evidence_sources:
    - 公司现金及现金等价物
    - 海外业务占比
    - 资本开支计划
  risk_factors:
  - 一次性收益/亏损被误判为趋势性变化
  - 管理层解释可能掩盖真实经营恶化
  - 汇兑损失等会计因素可能持续影响利润
  confidence_indicators:
  - 毛利率持续改善
  - 扣非净利润连续多季增长
  - 公司对异常项目的解释清晰合理
  source_raw:
  - sources/raw/财经/周复盘：26-04-26：交易需要不完美，也需要接受不完美.md
- pattern_id: event_driven_sector_impact
  name: 事件驱动板块影响推演
  description: 通过分析重大地缘政治事件中各方核心诉求与交易结构，推演其对不同产业板块的短期利好与利空影响。
  applicable_themes:
  - 地缘政治事件分析
  - 重大政策解读
  - 中美关系博弈
  - 行业轮动预判
  reasoning_chain:
  - step: 1
    name: 拆解事件与各方诉求
    question: 这个事件的核心是什么？参与各方（如中美）各自最想得到什么？
    UP_logic: 将事件（特朗普访华）定性为‘战时危机公关’，并分别列出特朗普（短期降压：油价、通胀、股市）和中国的（长期结构性让步：科技限制、关税）核心诉求。
    evidence_sources:
    - 事件背景分析
    - 地缘政治新闻
    - 双方公开表态
  - step: 2
    name: 推断交易结构与议题
    question: 基于双方诉求，可能达成什么样的‘交易’？核心谈判议题是什么？
    UP_logic: 推断出‘交易结构’：中国加大采购（农产品、天然气）换取美国放松（科技限制）。并识别出核心议题排序：伊朗（能源）> 关税 > 科技 > 汇率。
    evidence_sources:
    - 历史谈判模式
    - 双方经济结构
    - 随行企业名单
  - step: 3
    name: 映射到具体企业与板块
    question: 谈判议题和交易结构会直接利好或利空哪些具体的上市公司和行业板块？
    UP_logic: 将随行高管（英伟达、埃克森美孚、波音等）视为‘六张牌’，每张牌对应一个政治成果和产业影响。例如：埃克森美孚→能源采购→利好油气但可能利空战争溢价资产。
    evidence_sources:
    - 随行企业高管名单
    - 产业链关系
    - 行业基本面
  - step: 4
    name: 区分短期情绪与长期逻辑
    question: 这个事件的影响是短期的情绪炒作，还是改变了长期的产业趋势？
    UP_logic: 明确指出短期影响（如科技限制边际缓和→海外AI链情绪修复）与中长期逻辑（国产算力逻辑不变，因美国保留代差控制）。区分‘交易’和‘趋势’。
    evidence_sources:
    - 产业趋势分析
    - 技术发展路径
    - 政策长期方向
  risk_factors:
  - 谈判结果不及预期（如只有模糊表态，无具体订单）
  - 市场提前交易，导致‘利好落地变利空’
  - 事件后续发展出现超预期负面变量（如地缘冲突升级）
  confidence_indicators:
  - 随行企业名单与核心议题高度相关
  - 双方公开表态与推断的诉求一致
  - 市场成交量与情绪配合，未出现过度透支
  source_raw:
  - sources/raw/财经/周复盘：26-05-10：特朗普访华，六张牌交易框架，4200攻防，国产算力主线.md
- pattern_id: rotation_quality_assessment
  name: 轮动质量评估模式
  description: 通过观察特定板块（如碳化硅）在分歧后的修复行为，判断市场轮动是良性还是劣性，进而指导操作策略。
  applicable_themes:
  - 板块轮动分析
  - 短线情绪判断
  - 热点持续性评估
  reasoning_chain:
  - step: 1
    name: 识别关键观察标的
    question: 哪个板块或个股能作为判断轮动质量的‘试金石’？
    UP_logic: 选择周四高潮、周五兑现的板块（如碳化硅），其周一反馈决定轮动质量。
    evidence_sources:
    - 原文2.1碳化硅部分
  - step: 2
    name: 设定修复情景
    question: 该标的在分歧后出现哪种走势？
    UP_logic: 设定两种情景：低开后快速修复（良性轮动） vs 高开低走或低开低走（劣性轮动）。
    evidence_sources:
    - 原文2.1碳化硅部分
  - step: 3
    name: 推导轮动质量
    question: 根据修复情景，市场轮动属于良性还是劣性？
    UP_logic: 修复→资金愿意承接高弹性方向，轮动良性；走弱→每个方向只能涨一天，追随难度极高。
    evidence_sources:
    - 原文2.1碳化硅部分及劣性轮动定义
  - step: 4
    name: 制定操作策略
    question: 基于轮动质量，应采取何种操作？
    UP_logic: 良性轮动可继续参与高弹性方向；劣性轮动应减少追逐热点，降低仓位等待。
    evidence_sources:
    - 原文3.2策略部分
  risk_factors:
  - 观察标的可能受突发消息干扰，导致修复行为失真
  - 市场整体情绪突变可能使轮动质量判断失效
  confidence_indicators:
  - 观察标的在分歧后出现预期中的修复走势
  - 其他高位板块也出现类似修复信号
  source_raw:
