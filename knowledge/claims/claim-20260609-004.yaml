  interpretation: UP用四拐点框架分析商业航天爆发逻辑。这种"政策+技术+成本+需求"多变量共振的分析范式可复用于其他新兴产业链（如低空经济、氢能、量子计算等）。四拐点同时出现=产业从主题投资向基本面投资切换的前兆。
