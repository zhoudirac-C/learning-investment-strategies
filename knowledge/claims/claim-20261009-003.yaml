  subject: 卖出后的四类重新介入触发
  timeframe: permanent
  statement: 左侧卖出后必须保留重新介入机制：高位平台不破且回调缩量、板块回暖并放量突破时可重新建仓；弱势后快速强反包可小仓跟随；突破后等待回踩平台确认再介入；出现新的业绩、政策或产业催化时重新评估逻辑
  evidence_quote: 第一，高位横盘转强，平台不破，回调缩量，板块回暖，个股放量突破，那么就可以重新建仓。第二，卖出后快速反包。因为短期走弱卖出，但股票很快走出了强反包，直接否定了弱势结构，那么就可以小仓位的进行跟随。第三是突破后回踩确认。不追高突破，等待回踩平台不破，支撑有效，再择机介入。第四，就出现新的催化。……整个预期差重新打开，那么你就需要重新评估介入。
  interpretation: 四类触发分别对应趋势再确认、弱势证伪、突破后的低风险确认和基本面预期差重建。卖出只结束上一笔交易，不等于永久放弃标的。
