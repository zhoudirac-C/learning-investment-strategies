  extracted_at: '2026-07-18'
  subject: 买入程序成功率与市场强度
  topic: 同一买入程序在强市场成功率九成以上，弱市场则明显降低
  statement: 买入程序的成功率和市场的强度有关：在强的市场里，买入程序的成功率基本都在90%以上，但在弱的市场里，这成功率就要低多了。此外，任何根据均线等技术系统构成的买卖程序都只是一个综合判断的一个子判断；相同程序选出来的股票有些涨得多、有些涨得少，技术系统是海选，其后还需要复赛、PK才能选出真正可以介入的股票。
  evidence_quote: 买入程序的成功率和市场的强度有关，在强的市场里，买入程序的成功率基本都在90%以上，但在弱的市场里，这成功率就要低多了……任何根据均线等技术系统构成的买卖程序，都只是一个综合判断的一个子判断，并不是说这一招就可以了。
  interpretation: 定量事实：作者给出的经验数字是强市场成功率90%以上，弱市场显著下降，意味着程序使用必须叠加市场强度这一前置过滤。技术选股只完成海选，力度排序需要后续筛选，这是第13课为后续章节埋的引子。
