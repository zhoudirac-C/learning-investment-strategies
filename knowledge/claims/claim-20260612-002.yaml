  subject: 商业航天IPO双面效应
  timeframe: short-term
  statement: 商业航天产业逻辑完全国产（发射节点/组网进度），但资金面被SpaceX巨型IPO牵着走——IPO前虹吸抽血、IPO后定价锚确立和虹吸出清。前期回调深度源于两者叠加。
  evidence_quote: 商业航天：最自主的产业，最不自主的资金面。按上面这条'自主程度'的标尺，商业航天本该排在国产替代这一侧——它的催化日历完全是国产的：下半年密集的发射节点、垣信与星网的组网进度，产业逻辑不需要看纳指的脸色。但这个板块眼下的资金面，却被一个美国IPO牵着走：SpaceX的巨型IPO对它是一体两面——虹吸效应抽走的是全市场的流动性，商业航天作为映射板块首当其冲；但路演定价一旦落地，它又会反过来成为整个赛道的估值锚，给A股的对标公司提供重定价的参照系。
  interpretation: UP提出商业航天的特殊定位：产业上最'自主'（国产催化日历），资金面上最'不自主'（受SpaceX IPO影响）。IPO前虹吸效应导致回调，IPO后定价锚确立+虹吸出清将推动修复。这是理解商业航天板块近期走势和后市判断的核心框架。
