  topic: 中线做T标的选与大盘共振的品种，例证东方财富
  timeframe: permanent
  statement: 中线做T标的首选与大盘强共振的品种（UP以券商股东方财富(300059)为例）：逻辑是大盘冲关券商一定冲，可按大盘目标点位（如4000点、5000点）对应推算其价格
  evidence_quote: 我为什么选东财？因为它是比如大盘冲它券商一定冲嘛……东财能涨到多少我没有底，但是大盘比如说到4000点5000点东财对应的价格是多少，我当时在直播中有提过啊。
  interpretation: 中线做T标的的选择标准是与指数相关性的确定性，而非个股弹性——做T需要的是可预判的波动节奏。东方财富(300059)是方法例证而非买入推荐。
