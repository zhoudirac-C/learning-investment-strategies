- id: claim-20260602-002-c
  source_path: sources/raw/财经/动态：26-06-02：半导体AI硬件缩量反弹，MLCC已说很久.md
  source_date: '2026-06-02'
  source_type: 动态
  extracted_at: '2026-06-02'
  claim_type: market-cycle
  subject: 半导体缩量反弹符合调整中继，AI硬件放量但放不大，缩量上涨=阶段结束
  timeframe: short-term
  statement: 半导体今日反弹是缩量的（符合调整中继特征），AI硬件还在放量但"应该放不大"。等科技方向出现缩量上涨，资金就会流向调整已久的价值股，风格切换调整时间不会短
  evidence_quote: "半导体和AI硬件，你们需要去看一下量，看一下是不是缩量反弹，半导体算是符合了，Ai硬件那边还在放量，但是应该放不大。等这些东西缩量上涨，那么基本上就结束了，出来的量就会去做别的方向，一些调整比较久的价值股，有业绩预期的都会迎来修复，那么一旦这种情况形成，调整时间都不会短。"
  interpretation: 量能与风格判断：①半导体缩量反弹=调整中继——不是反转，是下跌过程中的技术性修复；②AI硬件放量但"放不大"——增量资金有限，难以持续；③关键信号："缩量上涨"——当科技方向出现缩量上涨，意味着资金开始流出，阶段结束；④资金去向：调整较久的价值股、有业绩预期的标的；⑤调整时间不会短——风格切换一旦形成，周期较长；⑥与早盘claim-20260602-001-b"弱势放量=砸盘资金增多"形成呼应：半导体缩量=抛压减少但买盘也未增加，AI硬件放量=最后的买盘涌入但即将衰竭。
  confidence: high
