  subject: 反转形态的三种时态层级
  timeframe: permanent
  statement: 吞没、刺透/乌云、孕线构成反转的三档时态：吞没=反转完成时（力量已彻底转换，执行标准最高）；刺透/乌云=反转进行时（力量已切换大部分，可果断执行）；孕线=反转早期（仅力量衰竭，属警惕信号）。
  evidence_quote: 吞没呢它代表是反转完成时，就是力量已经彻底转换，它的执行标准就会很高。但是刺透和乌云是相当于是反转进行时，那么力量已经切换了，对吧，已经发发生了大部分，那么可以去果断执行。那么孕线呢它是反转的一个早期，只是力量的衰竭，还没有真正切换，所以是一个警惕的信号。
  interpretation: 三类形态不是并列关系而是进度条：孕线预警、刺透/乌云执行、吞没确认。判断形态前应先定位「反转走到哪一步」，再决定动作强度。
