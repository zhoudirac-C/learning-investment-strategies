  timeframe: trend
  statement: 上证指数2007/2015/2021构成收敛三角形，2024年9月前曾两次跌破下轨（国运线，当时叠加房地产低迷确实有点慌），但最终以巨幅拉升拉回趋势线上方并突破上轨、完成惊天大逆转；理论上这里应该有超级主升浪，但从家长的角度不希望指数级大幅跃升，更可能走此消彼长、慢慢悠悠的上涨（科技调整到位老登股跌一点、老登股跌差不多科技又涨太多，来回调节）。
  evidence_quote: 上证指数从2007年啊，然后2015年到2021年，它是一个，我认为是一个收敛三角形……然后当时是在23年的时候是有点惨的，24年，对，24年的时候有两次破了收敛三角形底部，似乎选择了向下，……但是最终呢，它还是用一次巨大幅的这种，以常人没有想象过的一种拉升，拉回了这个趋势线上方。……理论上这块应该是有个超级主升浪的啊。但是现在我又，哎呀，我又不是觉得这个超级主升浪能那么快地来到。因为从我们的家长的角度来讲，它是不希望有这种指数级的大幅的跃升的。
