  evidence_quote: 本轮下跌与历史多数调整有一个关键的结构差异：以往的持续下跌中间通常会出现整理平台，市场休整之后再继续调整，呈跌歇跌的台阶式节奏；而这一次是连续性的阴跌，中间没有像样的休整平台，也没有过度的单边恐慌杀跌。这种温水煮蛙式的持续阴跌在历史上极为少见，意味着市场承接力量在持续而缓慢地消耗，而非一次性出清。
