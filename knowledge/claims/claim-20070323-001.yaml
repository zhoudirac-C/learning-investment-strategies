- id: claim-20070323-001-b
  source_path: sources/chanlun/lesson_039.md
  source_date: '2007-03-23'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 同级别分解的盘整背驰机械化操作
  topic: Ai与Ai+2比较力度，盘整背驰决定买卖点，图形分两类区别应对
  statement: 在同级别分解基础上围绕中枢的更精确机械化操作：把 a+A 中 A 分解为 m 段同级别走势类型 A=A1+A2+…+Am（奇数段与原方向相反、偶数段相同），并把 a 定义为 A0，则 Ai 与 Ai+2 之间可不断比较力度，用盘整背驰的方法决定买卖点：只要盘整背驰，就在 i+2 为偶数时卖出、为奇数时买入；若没有盘整背驰，当 i 为偶且 Ai+3 不跌破 Ai 高点则继续持有，直到 Ai+k+3 跌破 Ai+k 高点后在不创新高或盘整顶背驰的 Ai+k+4 卖出（k 为偶数），i 为奇数时反向处理。该方法把图形基本分为两类——一类是 i 为偶时 Ai+3 不跌破 Ai 高点或 i 为奇时 Ai+3 不升破 Ai 低点，一类是 Ai 与 Ai+2 之间盘整背驰——对两类采取不同操作策略，构成机械操作方法；中枢从30分钟扩展到日线周线都不影响该操作。
  evidence_quote: 把a定义为A0，则Ai与Ai+2之间就可以不断地比较力度，用盘整背驰的方法决定买卖点……只要盘整背驰，就在i+2 为偶数时卖出，为奇数时买入……以上的方法，最大的特点是，就是在同级别分解的基础上将图形基本分为两类，一类是“当i为偶Ai+3不跌破Ai高点”或“i为奇数Ai+3不升破Ai低点”；一类是“Ai与Ai+2之间盘整背驰”。对这两种情况采取不同的操作策略，构成了一种机械的操作方法。
  interpretation: 这是第38课机械程式在中枢震荡阶段的细化版，用奇偶段的编号把盘整背驰判断程序化。作者自评这段表述最精确但也最难，需对照画图理解；实际操作中下一个 Ai+2 是当下产生的，不影响前面各段的同级别唯一性分解。
