- id: claim-20061122-001-c
  source_path: sources/chanlun/lesson_009.md
  source_date: '2006-11-22'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 三类独立程序示例
  topic: 价量技术、比价关系与基本面三类互相独立的程序示例
  statement: 原文给出三个互相独立程序的示例：其一，技术指标都单纯涉及价量的输入，互相之间都不独立，只需任选其一个构成买卖程序，对水平高的人来说一个带均线和成交量的K线图比任何技术指标都有意义；其二，任何股票都处在整个市场的比价关系中，比价关系的变动可构成一个与市场资金流向相关的买卖系统；其三，可用基本面构成甄别程序，但这个基本面不是单纯指公司赢利之类，而是对市场参与者、对人性的了解（例如从管理者出身推断其不会让股票长期跌破发行价、认沽权证基本不会让兑现这类行为结构判断）。
  evidence_quote: 首先，技术指标，都单纯涉及价量的输入而来，都不是独立的，只需要选择任意一个技术指标构成一个买卖程序就可以……其次，任何一个股票都不是独立的，在整个股票市场中，处在一定的比价关系中，这个比价关系的变动，也可以构成一个买卖系统，这个买卖系统是和市场资金的流向相关的……最后，可以选择基本面构成一个甄别"早泄"男程序，但这个基本面不是单纯指公司赢利之类的……这需要对市场的参与者、对人性有更多的了解才可能精通。
  interpretation: 三类程序对应三个独立信息维度：价量（走势本身）、相对价值（股票之间的比较）、参与者行为（人性与利益结构）。第11课明确"技术派必须也只能在三个独立系统里才有大功效"，与本课互为呼应。举例中的个股与权证均为2006年历史案例。
