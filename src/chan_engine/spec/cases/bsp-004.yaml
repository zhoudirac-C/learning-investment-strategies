# BSP-004 二、三类买点重合（一买后凌厉上破前下跌最后中枢，回抽不触及）
#
# 结构：下跌最后中枢(6→21) + 一买 idx=26（16.9，中枢下方）；
#   随后一个次级别走势凌厉直接上破该中枢：26→31 单笔从 16.9 拉到 21.5，
#   顶 21.5 > ZG 20.2；再回抽 31→36，低点 20.3 > ZG 20.2，不触及中枢
#   → idx=36 同时是二类买点（一买后第二段次级别走势的低点）与三类买点
#   （回试不跌破 ZG），二三类重合。expect.bsp 用同 idx 的两条记录表达重合。
# claim 原文依据（claim-20070109-001-b，课21）：当第一类买点出现后，一个
#   次级别走势凌厉地直接上破前面下跌的最后一个中枢，然后在其上次级别回抽
#   不触及该中枢，此时出现二、三类买点重合，往往引发大级别上涨。
#
# 中枢：高点 {20.6, 20.6, 20.2} → ZG=20.2；低点 {17.8, 18.3, 18.3} → ZD=18.3。
# 上破力度代理：26→31 段 Σ|Δc|=4.18（全例最大单腿），符合"凌厉"。
