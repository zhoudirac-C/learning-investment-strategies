  subject: 十五分钟KDJ的基础买卖规则
  timeframe: intraday
  statement: 日内T以15分钟KDJ为基础：买点原则上要求20以下形成金叉，标准卖点是80以上死叉；弱势行情难以到达80时，50以上形成有效死叉也可卖出，买点应保持严格而卖点可适度放宽
  evidence_quote: 也就是说买点要要在二十以下形成金叉我们才去买，那么在八十以上形成死叉我们去卖。当然最近的行情不太好，对吧，很很少成很少有时候它能够在八十以上形成一个死叉。因此我们其实无所无所谓，就是说你不需要非得等到八十，你基本上在靠近八十五十以上，它能够形成一次有效的死叉，那么我们在这种时候做出卖出的动作都是没有什么问题的。
  interpretation: 规则的不对称性在于低位买点需要苛刻确认，高位卖点则可随弱势环境下移；50以上是UP对弱势盘的放宽口径，不能脱离趋势状态机械套用。
