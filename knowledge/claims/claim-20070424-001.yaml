  subject: 牛市最大风险是丧失筹码
  topic: 股价市盈率无绝对意义，成本为0前降成本为0后挣筹码
  statement: 认为股价、市盈率高了风险就大、低了风险就小是错误观点，这些都是变动的因数，没有任何绝对意义；风险对于市场是绝对的，任何时候都在风险之中。站在社会财富增长的角度，最大的风险是财富增长赶不上社会平均财富的增长，放在牛市里就是丧失筹码：一个大的上涨，3元有1万股，到4元只有1千股，后来到了30一股没有，这就是最大的风险——市场的上涨没有为你制造应得的总体利润，没有筹码就没有赢利的准入证。正确的大思路：在成本为0前不断降低成本，在成本为0后不断挣筹码，这样股价越上涨筹码越多、真正市值才越来越大；每一次震荡都是降低成本、增加筹码的机会，最高境界是大牛市真正结束那天拥有股票的数量最多而成本是0——0成本就是绝对的无风险。
  evidence_quote: 有一种对风险的错误观点，仿佛股价、市赢率高了才风险大，股价、市赢率低了就风险小了，却不知道股价、市赢率都是些变动的因数，并没有任何绝对的意义……一个大的上涨，3 元有1 万股，到4 元只有1 千股，后来到了30，一股没有，这就是最大的风险，因为市场的上涨并没有为你制造应该的总体利润……在成本为0 前不断降低成本，在成本为0 后不断挣筹码，这样股价越上涨，你的筹码越多，你的真正市值才会越来越大……无风险是可以创造出来的，0 成本就是绝对的无风险。
  interpretation: 这条把风险定义从价格波动改为机会丧失，给出牛市持股的总战略：用震荡做差价把成本降到0再转为攒筹码。它与第38课机械化减成本操作、本课暴跌是减成本增筹码时机的说法构成完整体系。
