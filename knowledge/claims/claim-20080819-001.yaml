  subject: 上升趋势的精确定义
  topic: 第一中枢后出现第三类买点并非背驰类向上，即趋势形成
  statement: 上升趋势形成的最精确定义：在第一中枢后出现第三类买点并形成非背驰类向上。出现这个结构就可以持股睡觉等第二中枢甚至第三、四、五中枢完成、出现背驰后第三类卖点再说；只要趋势没有扭转的信号就可以持有。反之，没出现该结构之前，随时都有被反回来的风险。一定不要去预测什么反弹还是反转，这根本没意义，反弹越搞越大最后就自然成了反转，是否如此根本没必须知道。
  evidence_quote: 只要在第一中枢后出现第三类买点并形成非背驰类向上，才可以流着口水地持股睡觉等其余中枢形成，否则，随时都有被反回来的风险……这里其实也给出了什么是上升趋势形成的最精确定义，就是在第一中枢后出现第三类买点并形成非背驰类向上。趋势形成，只要趋势没有扭转的信号，当然就可以睡觉
  interpretation: 第三类买点加非背驰向上是从反弹到趋势的确立信号，把反弹还是反转的预测问题转化为结构确认问题。该定义同时给出持股条件与风险边界，也说明缠论可以给正确的常识以合理的理论基础。
