- id: claim-20070528-001-b
  source_path: sources/chanlun/lesson_055.md
  source_date: '2007-05-28'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 大级别建仓的前戏模式
  topic: 大级别买入必然反复，底部区域借中枢延伸扩展降低成本，脱离底部时成本应在区域之下
  statement: 一个大级别的买的过程即建仓过程必然是反复的，买中有卖，不断灵活地根据当下走势调整建仓的成本与数量；底部区域可以进行最复杂的中枢延伸与扩展，唯一目的是取得足够的、成本不断降低的筹码，这同时兼备改造股票股性的任务，也是能顺利退出的底线。一个好的买入，当股票脱离底部区域时成本应该早在该区域之下；在大级别中枢上移中只会减少成本，只有最愚蠢的拉抬才会增加成本。一个出色的卖，是在大级别高潮的后继乏力、背驰中退出。底部不一定是在平衡水平线上的中枢震荡，还可以是斜率很小、充满激烈震荡的通道式上升。
  evidence_quote: 对于一个大级别的买的过程，或者说一个大的建仓过程，买必然是反复的，买中有卖，不断灵活地根据当下的走势去调整建仓的成本与数量，底部区域可以进行最复杂的中枢延伸与扩展，唯一的目的只有一个，取得足够的、成本不断降低的筹码……当脱离底部区域时，其成本应该早在该区域之下。而在大级别中枢上移中，只会减少成本，只有最愚蠢的拉抬，才会增加其成本……一个出色的卖，就是在那大级别高潮的后继乏力、背驰中退出。
  interpretation: 建仓方法本质上与第49课中枢震荡降低成本的模式一致，只是放在大资金语境，并补充了底部形态的多样性。成本在底部区域之下是前戏合格的验收标准。
