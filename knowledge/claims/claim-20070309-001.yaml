- id: claim-20070309-001-e
  source_path: sources/chanlun/lesson_035.md
  source_date: '2007-03-09'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 高级别中枢的形成机制
  timeframe: permanent
  statement: 三个连续的最低级别走势类型所分别经过的价格区间有交集，即发生重叠关系，就形成高一级别的缠中说禅中枢；依照最低级别上的分类方法，高级别上同样可以把走势完全分类，该过程可逐级上推，从而不涉及循环定义地严格定义各级别的中枢与走势类型。
  evidence_quote: 三个连续的最低级别走势类型之间，如果发生重叠关系，也就是三个最低级别走势类型所分别经过的价格区间有交集，那么就形成了高一级别的缠中说禅中枢。有了该中枢定义，依照在最低级别上的分类方法，同样在高级别上可以把走势进行完全的分类，而这个过程可以逐级上推，然后就可以严格定义各级别的中枢与走势类型而不涉及任何循环定义的问题。
  interpretation: 这是递归定义的关键一环：次级别三段走势的价格区间重叠生成高级别中枢，同一套分类规则在每一级别上复用。级别由此不是主观周期选择，而是由走势结构自底向上生长出来的客观层级。
