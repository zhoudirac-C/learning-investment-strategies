subject: 欣氟材：PEEK上游单体（DFBP），关注认证与销售兑现，不应将全部金属结构折算为PEEK需求
timeframe: temporary
statement: PEEK在机器人轻量化方案中有应用价值，但替代比例取决于具体部件强度、磨损、加工成本与客户方案；DFBP占PEEK总成本30%-40%为敏感性假设；中欣氟材已布局5000吨/年DFBP产能，但产能不等于订单兑现。核心观察依次是客户认证、稳定批量交付、产能利用率与利润贡献。
evidence_quote: PEEK兼具耐高温、耐腐蚀、较高机械强度及较低密度，在人形机器人关节、传动等部件的轻量化方案中具有潜在应用价值。替代比例仍取决于具体部件的强度、磨损、加工成本与客户方案，不能把机器人全部金属结构都折算为PEEK需求。DFBP是PEEK合成的重要单体。按每生产1吨PEEK约消耗0.8吨DFBP的工艺测算，PEEK放量有望向上游传导需求；DFBP占PEEK总成本30%—40%甚至更高的估算，则会随原料价格、工艺收率及成本核算方式变化，适合作为敏感性假设，不宜视为固定比例。
interpretation: UP 对欣氟材的判断包含两个层次：一是PEEK应用潜力的技术边界（不能将全部金属结构折算为PEEK需求）；二是商业化验证的阶段性（客户认证→批量交付→利润贡献），明确指出产能不等于订单兑现，避免将远期空间直接映射为短期利润。
