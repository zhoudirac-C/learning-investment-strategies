    extracted_at: 2026-06-06
    claim_type: market-cycle
    subject: 市场阶段判断——磨底期
    timeframe: short-term
    statement: 指数磨底期，4033生命线/4130满仓线。选股核心：找低位+一季报超预期（「炸裂」=Q1超预期→中报不差），UP推荐的方向内也要优先选低位+Q1好的。港股左侧建仓OK。非科技方向：燃气轮机(杰瑞股份/中国动力/万泽股份)、储能六氟(天赐材料/恩捷股份/鹏辉能源)、消费(罗莱生活/亚朵)、创新药(药明康德/百济神州/信达生物)、出海链(大金重工/银轮股份/涛涛车业)、商业航天(窗口期有限)。规避科技股+有色金属
    evidence_quote: |
      我们最近指数我不会看往下跌太多了，基本上也就是一个磨底行情，那么磨底行情是非常难受的。 收盘价跌穿4033点清仓，向上突破4130点满仓，两点之间持股做T。
    interpretation: |
      磨底期的核心判断：①4033是硬止损线（跌穿则开启下一波下跌）；②4130是加仓信号（突破则进入主升）； ③中间位置不操作、不看盘，避免被量化来回洗。UP明确表示不看向下跌太多（"毕竟还是牛市"）， 但磨底期的煎熬是必须承受的。
