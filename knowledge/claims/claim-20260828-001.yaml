  statement: 特朗普8月26日签署第14420号行政令,以国家安全为由宣布主电力系统进入国家紧急状态,禁止美国采购、进口或安装特定外国制造的大型电力系统设备及软件,覆盖变电站变压器、大型发电机、工业控制系统、电池储能系统等,主要针对高压输电,不适用于地方配电;要求能源部120天内制定实施规则、180天内提出《联邦采购条例》修订建议。8月27日思源电气(002028)跌10%,金盘科技(688676)跌7.71%,明阳电气(301291)跌6.97%。思源电气(002028)回应称禁令处于120天规则制定期,具体影响尚无法评估,去年对美出口占比约不超过2%。读法与此前FCC逆变器禁令一致:短期是交易情绪,中期观察规则口径,长期比拼产品良率与交付。2025年中国变压器产能占全球60%;今年1至7月国内变压器累计出口额329.53亿元同比增长31.85%,对美份额本就不高。今天真正要看的不是跌幅,而是消息公布次日能否出现放量止跌——利空第二天的承接,往往比第一天的杀跌更能说明资金态度。
