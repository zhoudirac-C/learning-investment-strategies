- id: claim-20070801-001-b
  source_path: sources/chanlun/lesson_067.md
  source_date: '2007-08-01'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 线段结束的两种情况
  topic: 特征序列分型一二元素间无缺口当场确认，有缺口须反向特征序列出分型
  statement: 标准特征序列中构成分型的三个相邻元素只有两种情况。第一种：特征序列的顶（底）分型中，第一和第二元素间不存在特征序列的缺口，那么该线段在该顶（底）分型的高（低）点处结束。第二种：第一和第二元素间存在缺口，则须从该分型最高点开始的向下一笔（或最低点开始的向上一笔）的新序列的特征序列出现底（顶）分型，该线段才在该顶（底）分型的高（低）点处结束；此时后一特征序列不一定封闭前一特征序列相应的缺口，且第二个序列中的分型不分两种情况，只要有分型就可以。出现特征序列的分型，是线段结束的前提条件。
  evidence_quote: 特征序列的顶分型中，第一和第二元素间不存在特征序列的缺口，那么该线段在该顶分型的高点处结束，该高点是该线段的终点……第一和第二元素间存在特征序列的缺口，如果从该分型最高点开始的向下一笔开始的序列的特征序列出现底分型，那么该线段在该顶分型的高点处结束……强调，在第二种情况下，后一特征序列不一定封闭前一特征序列相应的缺口，而且，第二个序列中的分型，不分第一二种情况，只要有分型就可以……显然，出现特征序列的分型，是线段结束的前提条件。
  interpretation: 这是线段破坏的充要条件就是被另一个线段破坏的精确化。无缺口意味着反抽无力，当场确认；有缺口意味着原线段可能延续，必须等反向走势自证成段。两种情况给出全部线段划分标准，作者声明以后线段划分都以此精确定义为基础。
