  interpretation: MLCC涨价与供需的具体数据：①涨价分化严重——高容30% vs 常规5%，6月常规可能跟进；②景气强度仅处初期（订单出货比1.2，约为2017年高点1/3）；③中低容交期显著拉长是供给收缩的直接证据；④扩产瓶颈（设备交付6-9个月）决定了紧缺延续性；⑤全行业稼动率（日系90-95%、国产约80%）突破90%将触发大幅涨价。这些数据提供了跟踪MLCC景气度的量化锚点。
