market_framework:
  current_stage: 上升期 — FOMC偏鹰落地后首日，市场快速消化外部压力，科创50放量大涨4.69%验证科技承接强劲。但微盘股广度验证不充分（国证2000+0.39%
    < 全A+0.40%），处于'深度验证通过、广度待确认'的分化上升阶段。
  core_question: 6/17 FOMC落地后首日——①偏鹰措辞是否被市场快速消化(开盘30分钟定价)②科技(铜箔/MLCC/光通信)消化后能否有承接，分歧转一致③全A能否站稳6000，上证3950支撑是否有效④量能：3万亿+可上仓位，<2.5万亿全面防守
  up_quote: 「6/15早盘：站上4088，具备交易能力和理想的可以满仓干。不知道做什么、问方向个股的继续躺。晚间复盘：普涨而无核心是修复性回流非情绪进攻，缩量+聚焦度不足。明天关键：尾盘补涨验证广度，情绪核心验证深度。」
  key_assumptions:
  - 【框架升级 6/16】全A中阳(+1.45%)已兑现，不再讨论中阳概率。框架主线转向：指数间联动验证广度
  - 【FOMC 6/17已落地】维持利率不变3.50-3.75%，偏鹰但预期内→利空出尽逻辑成立，但富时A50凌晨下跌说明海外偏鹰情绪还需消化
  - 中证2000持续弱于全A→微盘股是广度短板。若中证2000补涨跑赢全A→全面联动信号
  - 6/16是分歧日，早盘冲高不应追，应等回踩确认承接后再动手
  - 分歧日通常是好的上车机会（诺德铜箔/风华MLCC回踩是机会不是风险）
  - 科技股博弈重心正从题材想象转向业绩验证，中报窗口临近博弈前移
  - 诺德股份（600110）HVLP4代铜箔订单排至2027下半年，铜箔是AI硬件中弹性最好的细分之一
  - 锂电中报高增预期（亿纬锂能超预期），蔚蓝锂芯（002245）主板可跟踪
  - 焦炭涨价右侧信号已现（潞安环能601699），6/15煤炭走弱正好给回踩机会
  invalidation_conditions:
  - 中证2000持续弱于全A且连续3日收MA20下方→广度证伪、微盘破位确认，降仓至10%
  - 微盘股破位→拖累全A→拖累AI科技，需持续监控（中证2000是观测标的）
  - 情绪核心无法浮出（MLCC/铜箔冲高回落无回流）→深度不足，不加仓
  - 富时A50凌晨下跌→A股早盘承压，但A股核心矛盾在内不在外(量能+核心)
  - 全A指数收阴且30分钟不能收回→防守
  direction_priority:
  - direction: 铜箔（HVLP4代）
    intensity: 高
    source: 复盘判断：诺德股份涨停+10.03%，订单排至2027下半年
  - direction: MLCC超级周期
    intensity: 高
    source: 复盘判断：风华高科+4.89%，趋势强劲
  - direction: 光通信/OCS
    intensity: 中高
    source: 复盘判断：光迅科技+5.21%，谷歌第八代TPU采用OCS
  - direction: 商业航天
    intensity: 中
    source: UP/盘面：再升科技涨停+9.97%，SpaceX上市催化
  - direction: 科创50
    intensity: 中
    source: 复盘判断：+4.69%放量，科技情绪锚点
