market_framework:
  current_stage: 调整第15天，上升途中调整临近尾声 + 短期企稳概率较大
  core_question: 调整是否真正结束？资金能否从普涨共振走向强共振聚焦？MLCC能否强者恒强？光互连资金接力意愿如何验证？
  up_quote: 6月3日早盘：调整第15天，15度角浅调整，上升途中歇脚而非趋势反转。AI多数方向回撤约20%处于历史调整区间下沿。两个止跌信号叠加（120分钟低9+30分钟底部结构）。纪律线：收盘跌穿4033清仓，突破4130满仓。
  key_assumptions:
  - 上证15度角浅调整=趋势中继而非反转
  - AI回撤20%=历史区间15-30%下沿
  - 120分钟低9+30分钟底部结构=短期企稳信号
  - 成交额前5%个股占比达2018年以来高点=风格切换继续
  invalidation_conditions:
  - 收盘跌穿4033点→清仓
  - 创业板指跌破4000且不能收回→调整延长
  - AI主线集体破位→上升途中调整证伪
intraday_schedule:
- window: 09:15-09:30
  name: 集合竞价
  action_bias: 只观察
  rules:
  - 观察MLCC/被动元件是否延续强势
  - 观察煤炭/化工涨价是否发酵
  - 观察科技板块是否继续低开
  - 观察跌停家数是否边际缩短
  - 不因单票高开直接追买
- window: 09:30-09:45
  name: 开盘观察
  action_bias: 确认方向
  rules:
  - 看MLCC是否主动走强
  - 看煤炭/化工是否扩散
  - 看科技是否继续杀跌
  - 看指数是否快速失守4000
- window: 09:45-10:30
  name: 急跌确认
  action_bias: 等确认，不水下盲吸
  rules:
  - 若调整不创新低（4000之上），并放量收回分时均线，可进入观察
  - 若科技继续杀跌，暂停观察池买入
  - 只买化工涨价等结构性方向核心，不买破位后排
  - MLCC已提前提示，现在追涨是韭菜行为——只观察不介入
- window: 10:30-13:30
  name: 主修复窗口
  action_bias: 可做T，可观察
  rules:
  - 趋势未破的化工涨价硬逻辑票，满足分时确认后可观察
  - MLCC已提前提示，现在追涨是韭菜行为——只观察不介入
  - 反弹到预设区但板块不扩散，优先观察不介入
  - 现金为主，新增观察池买点必须等情景确认
- window: 13:30-15:00
  name: 午后风险窗口
  action_bias: 只看不买
  rules:
  - 午后冲高无扩散，优先观察不介入
  - MLCC已提前提示，现在追涨是韭菜行为——只观察不介入
  - 尾盘回落跌破4000，降低次日预期
  - 若尾盘再度快速修复但成交不能放大，警惕继续透支次日预期
agent_analysis_schedule:
- id: open_auction
  time: 09:26
  name: 集合竞价后
  focus: MLCC/煤炭/化工是否超预期，科技是否继续低开，今天偏进攻还是防守。**判断大盘是否止跌企稳：低开高走/平开震荡=企稳信号；低开低走/高开低走=未企稳。若企稳可观察准备低吸，若未企稳继续等待。**
- id: open_confirm
  time: 09:45
  name: 开盘15分钟确认
  focus: 指数是否失守4000，MLCC/化工谁主动，科技是否继续杀跌，跌停是否缩短。**判断大盘是否止跌企稳：15分钟内不创新低且放量收回=企稳；继续创新低=未企稳。**
- id: morning_confirm
  time: '10:30'
  name: 30分钟确认
  focus: 调整是否不创新低，MLCC/化工能否做T或观察。**判断大盘是否止跌企稳：30分钟内出现日内低点后反弹且持续=企稳。**
- id: noon_review
  time: '11:20'
  name: 上午收盘前
  focus: 上午定性为强修复、弱修复、防御切换还是继续分歧。**判断大盘是否止跌企稳：上午收盘在日内高点附近=企稳。**
- id: afternoon_risk
  time: '13:10'
  name: 午后风险窗口
  focus: 按午后只看不买纪律，重点观察冲高回落和板块扩散衰竭。**判断大盘是否止跌企稳：午后开盘不跳水且维持震荡=企稳。**
- id: mid_afternoon
  time: '14:00'
  name: 午盘监控
  focus: 午后一小时盘面验证：MLCC/化工是否触发观察点、持仓是否触发风控。只讲当下，不预判尾盘。**判断大盘是否止跌企稳：14:00前后出现低点后反弹=企稳。**
- id: tail_condition
  time: '14:50'
  name: 尾盘条件单
  focus: 判断是否符合尾盘观察、规避尾盘杀的条件。**判断大盘是否止跌企稳：尾盘维持震荡或小幅回升=企稳；尾盘跳水=未企稳。若企稳可低吸，若未企稳只观察不买。**
position_rules:
- id: empty_position_discipline
  name: 空仓纪律
  applies_to:
  - all
  all_required:
  - 空仓可上3成以内（调整深化，控制仓位）
  - 等调整确认不创新低后再加仓
  - 只参与化工涨价结构性机会，不抄底科技，不追MLCC
  forbidden:
  - 情景未明时建新仓
  - 追高潮
  - 抢一字
  - 防御板块追高
  - 买入半导体/消费（博主明确规避或定性为过渡）
- id: full_position_discipline
  name: 满仓纪律
  applies_to:
  - all
  all_required:
  - 满仓应大幅降仓至3成以内
  - 增厚止盈安全垫，等图形与趋势再度走好时卷土重来
  forbidden:
  - 满仓不动
  - 追高加仓
  - 抄底科技
- id: mlcc_entry
  name: MLCC观察纪律（不介入）
  applies_to:
  - mlcc_high_end_core
  - mlcc_mainboard_core
  all_required:
  - MLCC已提前1-2周提示，现在追涨是韭菜行为
  - 只观察不介入，等回调或新催化
  - 若已持有，可做T但不加仓
  forbidden:
  - 任何价位新建MLCC仓位
  - 回调时"抄底"MLCC
  - 追涨风华高科/火炬电子/三环集团
  action: 只观察不介入
  position_ratio: '0'
- id: chemical_entry
  name: 化工涨价介入确认
  applies_to:
  - refrigerant_pfa_dual
  - acesulfame_potassium_leader
  all_required:
  - 化工涨价组强于全A或强于防御组
  - 个股不是一致高开后的追高点
  - 分歧后放量收回分时均线
  - 涨价逻辑持续（安赛蜜/制冷剂价格上行）
  forbidden:
  - 发酵日追高
  - 单票异动但板块不共振
  action: 第二优先级介入
  position_ratio: 巨化股份1成 + 醋化股份1成 = 2成
- id: avoid_sector_discipline
  name: 规避方向纪律
  applies_to:
  - avoid_semiconductor
  - avoid_consumer
  all_required:
  - 博主明确规避半导体
  - 消费/白酒过渡性质确认，防御走强是分化而非切换
  forbidden:
  - 买入半导体
  - 买入消费/白酒
  - 抄底半导体
  - 追防御板块
  action: 只观察不介入
