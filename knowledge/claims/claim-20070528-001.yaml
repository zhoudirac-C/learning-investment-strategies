  subject: 散户大级别介入的买点选择
  topic: 较大级别介入不必在第一类买点，散户可等第二类甚至第三类买点，大资金至少从第二类买点介入
  statement: 一般散户在较大级别的介入中，例如日线以上的介入，不一定都要在第一类买点介入，因为其后的前戏过程不一定是一般散户可以忍受的，可以在第二类买点出现后才考虑介入，或者更干脆等第三类买点出现再介入。但资金有一定规模、需要一定数量筹码，或者要为以后储备经验的，一个至少从第二类买点开始利用部分前戏的介入是必须的，其中要如大资金一样利用前戏的震荡降低成本、增加筹码，最重要的好处是熟悉其股性。
  evidence_quote: 对于一般的散户投资者，在一些较大级别的介入中，例如日线以上的介入中，并不一定都要在第一类买点介入，因为，其后的前戏过程，并不一定是一般的散户可以忍受的，一般地，可以在第二类买点出现后才考虑介入，或者更干脆的，是第三类买点出现再介入。但如果资金有一定规模，需要一定数量的筹码……一个至少从第二类买点开始利用部分前戏的介入是必须的。
  interpretation: 买点选择因资金规模与承受力分层：第一类买点后的磨底有成本优势但心理难度大，第三类买点介入最干脆但成本最高。股性涉及频率、幅度、形态复杂度，是同一模式展开出千差万别图形的原因。
