- id: claim-20070309-001-q
  source_path: sources/chanlun/lesson_035.md
  source_date: '2007-03-09'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 次级别部分操作与成本管理
  timeframe: permanent
  statement: 定好操作级别后应该安排次级别以下的部分操作：进入操作级别的次级别盘整或下跌（可忍受的最大级别非上涨走势）时当然要操作一下来降低成本，操作级别很大时其次级别的次级别也可用来部分操作，使整个操作具有立体性从而更降低风险；降低成本是唯一能降低风险的活动，只有当成本为0时才算真正脱离风险。
  evidence_quote: 制定了相应级别，是否按照次级别以下进行部分操作，那是操作风格问题，而实际上是应该安排这种操作的，特别当进入一个你的操作级别的次级别盘整或下跌，这是你可以忍受的最大级别非上涨走势，当然要操作一下来降低自己的成本。如果你的操作级别很大，那么其次级别的次级别，也可以用来部分操作的。这样，整个操作就有一定的立体性，从而更降低其风险，也就是能进行把成本降低这唯一能降低风险的活动，只有当成本为0
    时，才算真正脱离风险。
  interpretation: 主级别定方向、次级别做差价的多层次立体操作是缠论风险管理的核心手法：风险不靠预测规避，而靠持续摊低成本消解，成本归零即立于不败之地。这是把风险控制转化为可执行操作的独特思想。
