# GOLD-003 金标：上证指数 30 分钟中枢 [2760,2858] + 回抽 2871 第三类买点
# （课36 课文实例，等比 synthetic）
#
# 课文结论（课36《走势类型连接结合性的简单运用》，2007-03-13 发文）：
#   "例如，在最近走势中，30 分钟图上，2760 到 2858 这 30 分钟中枢，
#    03081000 的 5 分钟回抽确认了一个第三类买点"
#   "03081000 的 5 分钟回抽低点 2871 点比上一中枢的最高点 2888 点要低"
# claim 原文依据：
#   - claim-20070105-001-b（课20 第三类买卖点定理）：向上离开中枢后回试
#     低点不跌破 ZG → 第三类买点；
#   - claim-20070313-001-f（课36 走势的重新组合应用）：实例出处课，
#     课文用结合律重新组合使该三买意义显现。
#
# 降级说明（ADR-005）：2007 年 3 月分钟级数据公开源不可得（baostock 分钟线
#   查询 2007-03 返回 0 行；akshare 东财分钟线仅近期），按课文描述等比
#   synthetic：课文点位 2760/2858/2888/2871 原样保留，每课文段映射为 1 笔
#   （段=笔口径，同 cases），pivot 间距 4 根 K 线。
#
# 结构推导（pivot 精确落位，fx/bi/zs/bsp 全文断言）：
#   - 引导笔 idx1(2740 底)→idx5(2858 顶)；
#   - 中枢三笔：段1 下 idx5→9 [2760,2858]、段2 上 idx9→13 [2760,2880]、
#     段3 下 idx13→17 [2755,2880] 三段重叠：
#     ZD=max(2760,2760,2755)=2760、ZG=min(2858,2880,2880)=2858
#     → 中枢 [2760,2858]，start_idx=5（首段起点 pivot），end_idx=17（第三段
#     终点 pivot），三段完成即确立 → sure=true（课文原值 2760/2858）；
#   - 离开笔 idx17(2755)→idx21(2888 顶)：GG=2888 = 课文"上一中枢的最高点 2888"；
#   - 回抽笔 idx21→idx25：低点 2871 = 课文回抽低点；2871 > ZG 2858 不跌破
#     → 第三类买点 idx=25；且 2871 < 2888（课文原话的大小关系成立）；
#   - 确认笔 idx25→idx29 上行至 2920；末位 fx/bi 右侧未被反向笔确认 → false。
