  subject: 操作级别与背驰反应
  topic: 某级别背驰是否构成操作信号取决于操作级别，低于操作级别的震荡可忽略
  statement: 某一级别的背驰是否该操作，取决于你的操作级别：操作级别是1分钟的，1分钟顶背驰就该走，之后跌幅大小与你无关，只需耐心等待市场走出新的1分钟底背驰；操作级别是月线的，1分钟顶背驰与你无关，该级别所有震荡都可以接受、可以忽略。按大级别操作就必须忍受小级别震荡，不能大级别操作者看小级别晃动也跟着晃动。
  evidence_quote: 如果你的操作级别是1 分钟级别的，那么1 分钟的顶背驰你就该走了，至于后面的跌幅是大是小，和你有什么关系？你只要耐心等待市场走出新的1 分钟底背驰就可以。反之，如果你的操作级别是月线的，那么1 分钟的顶背驰和你有什么关系？……1 分钟级别的所有震荡都是可以接受的，可以忽略的。
  interpretation: 这条规则把何时该走从主观判断转为级别匹配问题，消除背驰后跌多跌少的伪问题。配套推论：按年线级别操作，你比巴菲特还要巴菲特，关键是有没有这样的耐心。2007年530大跌对月线操作者只是可忍受的震荡，作历史案例。
