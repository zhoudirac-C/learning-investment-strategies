  subject: 非同步分歧→科技即将补跌→主升前必要条件
  timeframe: short-term
  statement: 全A已走第一分歧调整，科技靠光纤还在扛故为非同步分歧。科技一两日内也会形成分歧与全A同步。分歧同步不是风险，是主升前必要条件：同步=洗筹完成+位置重置+资金统一预期→三位一体→三层共振→主升。观察重点：光纤何时松→科技进入同步分歧信号→主升倒计时，不是利空。
  evidence_quote: 全A走的是第一分歧调整，目前比科技略弱；科技这边靠光纤这个大分支还在扛，所以现在是「非同步分歧」——大盘先松、科技未跟。这种错开状态不利于直接演绎主升。大概率科技一两日内也会形成分歧、与全A走向同步。而分歧同步不是风险，是主升前的必要条件：同步等于洗筹完成、位置重置，资金重新统一预期，三位一体才可能三层共振。观察重点就是光纤这个最后的强分支何时松——它一松，是科技进入同步分歧的信号，是主升的倒计时，不是利空。
  interpretation: 未来1-2天科技大概率补跌，光纤松动是核心观察信号。补跌不是趋势破坏而是主升前洗筹，应视为布局窗口而非逃顶信号。全A+科技分歧同步后才是下一波主升的起点。
