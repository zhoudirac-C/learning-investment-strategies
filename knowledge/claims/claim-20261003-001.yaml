  evidence_quote: 如果此时的成交量突然增加，那么就意味着新的资金开始重新关注这个价格区域，那么市场正在从低活跃状态转向重新交易，分歧也从冰点开始回升，那么它往往就是趋势启动的一个前置信号。
  interpretation: 该信号的关键前提是长期下跌和低活跃背景，增量信息是交易重新活跃。后续仍需价格与资金持续参与来确认趋势，不能把前置信号等同即时买点。
