  subject: 市场先生与龙哥两只手的博弈
  timeframe: intraday
  statement: 市场有两只手：市场先生和龙哥。当天上午市场先生想大涨（日韩大涨+科技利好，一度4000多家上涨），但龙哥看到快速冲高就回收资金（卖银行、中字头），导致权重搭台没搭稳、题材唱戏歇一歇，普涨转普跌。
  evidence_quote: 市场两只手，一只是市场先生，一只是龙哥。市场先生今天上午想大涨一下，因为日韩大涨，昨天又出了科技的利好，上午一度4000多家上涨。但涨着涨着，创业板就是起不来，原来是宁德杀业绩报大跌，市场先生就只好退而求其次，走个小涨。龙哥今天上午看到市场快速冲高，想着既然老乡们回来了，那就回收点资金。于是银行、中字头，挨着卖了一圈。
  interpretation: 鳄鱼派『两只手』框架的实战应用：市场先生（自发力量）想涨时，龙哥（护盘资金）反而回收资金——因为护盘目标是『磨底』不是『快涨』，涨太快会透支。理解这两只手的博弈就能理解为什么底部区域总是『涨一天歇一天』。
