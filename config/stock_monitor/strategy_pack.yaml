market_framework:
  current_stage: |-
    7月6日（周日）复盘：今日指数早盘下探回升，午后再度小幅回落，量能相较上一交易日小幅放大，但全市场超3000只个股下跌，赚钱效应整体偏弱，短线投机方向全天走弱、亏钱效应较为明显。市场仍处于混沌期，但科技内部的主线正在逐步清晰：这是一次内部的高低切换，而非全面的风格切换。
    指数层面信息量不大，早盘下探回升说明下方仍有承接，午后小幅回落说明上方缺乏进攻意愿，量能小幅放大但没有形成方向性表态。真正值得记录的是市场宽度——超3000只个股下跌，配合短线投机方向全天走弱，说明情绪端在退潮。调整更接近内生性的轮动消化，而非外力驱动的系统性风险：海外链压力来自Kyber延迟这一具体扰动，国产链维持相对强势。
    板块方向：科技股依然是带动市场的核心力量，但内部分化较大，国产链相对强势。国产算力链交换机领衔，超节点逻辑走向落地；海外算力链受Kyber延迟压制，PCB、CPO及上游材料走弱，但基本面未崩；机器人如期分化，后续关注Optimus量产进展；非科技方向（医药、船舶、互联网金融、防洪）日内脉冲、缺乏接力，不宜重仓追逐。
    7月5日回顾：三大指数冲高回落，A股科技在隔夜美股科技大跌背景下走出独立修复，但午后涨幅明显收窄、成交缩量。当前仍处于超跌反弹而非趋势反转阶段，市场处于混沌期，资金试错方向多、轮动速度快，操作难度明显加大。结构性行情走向全面行情的大方向不变，但节奏会比预期更慢。
    指数定性：位置决定意义——超跌位置反弹合理，但没有量能确认前不能当作右侧信号；情绪回暖但主线筹码尚未出清完毕。在轮动混沌期，指数的意义让位于结构，重点看资金往哪里沉淀。
    右侧确认之前，仓位纪律优先于观点，当前不是重仓押注单一方向的时点。混沌期纪律：不猜切换终点，只跟资金沉淀方向。
  core_question: 7月7日（周一）及后市关键验证——①国产算力链（交换机/AI芯片）能否从相对强势升级为明确主线 ②WAIC大会催化是否兑现并带动量能放大 ③中报预告密集披露期哪些方向业绩超预期 ④每周Token调用数据是否持续验证国内外需求剪刀差 ⑤海外算力链（PCB/CPO/光互连）何时量价企稳 ⑥人形机器人分化后核心标的低吸机会
  up_quote: "7/6复盘：混沌期的纪律只有一条：不猜切换的终点，只跟资金沉淀的方向。若WAIC催化如期兑现、量能同步放大，国产算力链有望从相对强势升级为明确主线；若中报预告证伪部分高预期方向、量能持续萎缩，则轮动混沌期延续，控制仓位、只做右侧确认后的核心标的。"
  key_assumptions:
  - 【框架升级 7/6晚间】7/6复盘专栏新增14条claims：市场仍处于混沌期，科技内部主线逐步清晰，从海外高位硬件向国产自主可控算力产业链切换；国产算力链交换机领衔、超节点逻辑落地，海外链受Kyber延迟压制；机器人如期分化，非科技方向日内脉冲不宜重仓；后市关注WAIC大会、中报预告、Token调用数据三个催化节点
  - 【7/6国产算力链成主线观察窗口】资金正从依赖海外需求的高位算力硬件，流向国内自主可控、业绩确定性强的国产算力产业链；交换机与AI芯片为海内外算力产业链区分度最高环节；星网锐捷(002396)为锐捷网络(301165❌)母公司市值倒挂估值修复标的
  - 【7/6海外算力链右侧确认前不接回】海外链受Kyber延迟影响全天承压，PCB首当其冲（M9材料），CPO/光互连一并走弱；基本面未崩但修复需时间，不见量价企稳不急于接回
  - 【7/6 AIDC电源链新增映射】美银预计2027年全球云与AI基础设施资本支出达1.5万亿美元，AIDC核心环节订单业绩双兑现；新增中恒电气(HVDC配电)、蔚蓝锂芯(BBU电芯)作为AIDC电源链主板映射
  - 【7/6机器人分化后逢低关注核心标的】机器人自上周五高潮后如期分化，后排跟风大跌；后续随Optimus量产进展披露大概率仍有反复活跃，策略是逢低关注核心标的（拓普集团601689），不在后排博弈晋级
  - 【7/6非科技方向不宜重仓】医药、船舶、互联网金融、防洪等方向呈现日内脉冲、缺乏接力特征，属于混沌期资金试错，观察即可，不宜重仓追逐
  - 【7/6事件驱动方向低参与】青龙管业(002457)受益台风巴威驱动的排水管网修复预期，但事件驱动型、时点跟随台风落地与政策表态，低持续性，观察即可
  - 【框架升级 7/5晚间】7/5复盘专栏新增42条claims：A股科技独立修复但午后回落，仍是超跌反弹而非趋势反转；市场处于混沌期，轮动加速、操作难度加大；结构性行情走向全面行情大方向不变但节奏更慢；右侧确认前仓位纪律优先于观点
  - 【7/5半导体上游补跌见底】强势方向半导体上游材料周五补跌，是调整走向尾声的标志之一；补跌后往往伴随超跌反弹，可叠加韬定律V2催化
  - 【7/5韬定律V2催化】华为何庭波7月3日发布韬定律V2，补充工程落地细节与实测数据；先进封装、混合键合设备与增量耗材是逻辑交汇最密集区域，重点关注先进封装/晶圆制造/设备耗材/光传输/EDA
