- pattern_id: gator-ch27-longterm-allocation
  school: gator
  name: 长线配置与"小马过河"
  chapter: 27
  description: 鳄鱼派（gator school）第27章：长线配置与"小马过河"。 大象（巴菲特型）：只等月K级以上大跌出手，十年一次 → 普通人做不到，别模仿 松鼠（超短型）：做日K级，听说周K调整明天就清仓 → 这是它的生存方式 小马（绝大多数人）：别信大象说水不深，别怕松鼠说水深——自己踩着石头过河 "看多大级别的周期，就做多大级别的周期"——两套周期不混用 涉及：27.1 小马过河：方法没有对错，只有适配；27.2 大儿子种庄稼 / 小儿子做生意 / 老太爷；27.3 配置规则；27.4 心态规则。 用于鳄鱼派资金生态位与规则体系的判断。
  trigger:
  - IF 听别人说答案 THEN 没用——"你不理解其中的道理，别人说了你也拿不住"
  - IF 红利持仓 THEN 基本不用卖，至少一半底仓常年不动（吃分红是大头）
  - IF 熊市里红利像妖股走加速 THEN 可阶段性止盈 1/3 或 1/5
  - IF 做美股 THEN 只在以年为单位的大机会（2000/08/18 级别）配；走合规渠道
  - IF 看好但不想承担高风险 THEN 上证50 = 科技含量最低的宽基去处
  - IF 博科技反弹 THEN 选前期没大涨、被打压、这波反弹幅度小的（避免套牢+获利双压力）
  steps:
