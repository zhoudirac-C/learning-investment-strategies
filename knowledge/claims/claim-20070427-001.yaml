  subject: MACD辅助判断的使用顺序
  topic: 先根据中枢与走势分析选定要比较力度的走势段，再选择看几分钟的MACD
  statement: MACD的计算方法决定了不同周期的MACD之间没有实质区别，只是计算周期不同带来的稍微灵敏与迟钝的区别。正确的使用顺序是：先根据中枢与走势运动的分析，选出需要比较力度的走势段，然后才选择看几分钟的MACD更适宜辅助判断——同样的两段走势，在哪个周期上柱子面积与黄白线变化更清楚标准就用哪个。MACD只是力度比较的辅助，不能反过来先看指标再找走势，这个顺序原则不能因为级别与周期的经验对应关系而改变。
  evidence_quote: 必须明白一个道理，就是MACD 的计算方法决定了，1 分钟和30 分钟MACD 之间并没有实质的区别，只是计算的周期不同而已……问题的关键是，MACD 只是力度比较的辅助，因此，是先定好比较哪两段走势，然后才去选择看是1 分钟的还是30 分钟的更适宜辅助判断……但这不能因此而改变先根据中枢与走势运动的分析，然后选出需要比较力度的走势段，最后才用MACD 辅助判断的顺序原则。
  interpretation: 这澄清了背驰判断中技术指标从属于走势结构的地位：走势分解是主，指标是辅。虽然某级别走势变化经常对应同周期MACD，但这只是经验相关而非顺序依据，先指标后走势是本末倒置。
