  interpretation: UP明确指出半导体和国产链的拉锯关系——两者是跷跷板而非同向共振。指数强→半导体强，指数弱→国产链相对占优。半导体胜在确定性，国产链胜在独立性（不依赖指数方向）。关键信号：共进股份(603118)高举高打+锐捷开板体现国产链的弹性与脆弱并存。操作建议：当轮动处理，不追涨。
