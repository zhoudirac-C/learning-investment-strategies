  timeframe: permanent
  statement: 自以为远离金钱与市场就是道的人，其所谓的道不过是自渎的产物；道不远人，道并不与市场相违，人的贪婪、恐惧与市场的诱惑、陷阱都不与道相远。
  evidence_quote: 但有一种人，自以为清高，自以为远离金钱、市场就是所谓的道。可怜这种人不过是废物点心，他们所谓的道不过是自渎的产物，道不远人，道又岂何市场相违？人的贪婪、恐惧、市场的诱惑、陷阱，又哪里与道相远？
  interpretation: 批判把远离市场当作修行境界的避世态度：道不在市场之外，直面贪婪与恐惧才是修行，逃避市场恰是未得道的表现。
