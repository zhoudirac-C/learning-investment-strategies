  evidence_quote: 光模块的散热链条是：芯片 → 导热界面材料（TIM1）→ 铜凸台/均热板（VC）均热 → 顶盖/散热齿 →（风冷空气，或 TIM2
    → 冷板 → 冷却液）。其中前半段属于光模块内部散热，后半段属于模块外部的 cage 散热…中石科技(300684)做的是模块内部的导热界面材料与均热板，而鼎通科技(688668)、奕东电子(301123)的产品落在
    cage 侧，应用场景与客户都不是同一批。个人判断，随着功耗抬升，液冷化是确定方向，但选股上不能混为一谈——同一则消息刺激下，两类标的的业绩兑现节奏并不同步。
  interpretation: 同一事件（旭创锁中石科技(300684)）刺激下两类标的路径不同：模块内部（中石科技(300684)）vs cage侧（鼎通科技(688668)、奕东电子(301123)），业务兑现节奏不同步——把选股从概念炒作拉回业务环节拆解（技术拆解本身已在8/14提取，本条是标的映射增量）。
