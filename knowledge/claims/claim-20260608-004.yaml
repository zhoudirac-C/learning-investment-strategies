      "机构资金大概率也不会在这个阶段去博弈超跌方向。最近的超跌反弹基本是小微盘股借流动性溢价的反弹，这些构成了承接短线热钱的次要方向，性质上偏博弈而非趋势。"
    interpretation: UP明确区分"机构行为"和"短线热钱行为"：机构不碰超跌，只有短线资金在博弈小微盘流动性溢价。这是对早盘001-e（3200+个股上涨）的修正——个股层面的"韧性"不代表趋势性机会，更多是博弈性质
