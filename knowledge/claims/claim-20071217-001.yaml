- id: claim-20071217-001-b
  source_path: sources/chanlun/lesson_091.md
  source_date: '2007-12-17'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 相邻级别的表里关系
  topic: 大级别笔状态过滤小级别波动，小级别状态变化构成未病到已病的预警
  statement: 考察两个相邻时间周期：如果大级别是(1,1)或者(-1,1)的状态，小级别里前面的任何波动都没有太大价值，因为无论波动如何大，都没到足以改变大级别状态的程度，这里就有十分明确的过滤作用。大级别要改变状态，至少要在小级别上先出现(1,0)或(-1,1)：小级别出现(1,0)是一个小警告，被确认了重要的警告就成立，将向欲病发展；小级别出现(-1,1)并导致大级别(1,0)在形成中，就是欲病向已病发展；大级别(1,0)也确认向(-1,1)发展时就确认已病。未病、欲病、已病对应的界限就是相应级别的第一、二、三类买卖点，对于上涨来说踏空也是一种病，涨跌之病是相对的。
  evidence_quote: 如果5 分钟里是（1，1）或者（-1，1）的状态，那么1 分钟里前面的任何波动，都没有太大的价值……1 分钟出现（1、0）是一个小的警告……如果这个1 分钟的（1，0）被确认了，那么一个重要的警告就成立了，这就是将向欲病发展了……未病-欲病-已病，对应的界限就是相应级别的第一、二、三类买卖点，注意，对于上涨来说，踏空也是一种病，涨跌之病是相对的。
  interpretation: 这套联立判断让操作者只需盯三个连续级别（如1、5、30分钟）共64种状态组合。每一种状态后并不是随机到任何另一种状态，可变的状态组合很少，从中可分析出最大可能赢利的必然转折状态。
