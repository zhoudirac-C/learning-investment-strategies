  claim_type: market-cycle
  subject: 短线情绪扩散能力
  timeframe: intraday
  confidence: medium
  intensity: medium
  stance: market-regime
  statement: 当前短线情绪仍是高位局部承接、低位新增活跃减少，扩散能力继续收缩；情绪改善必须同时满足极端下跌减少和新增活跃品种增加。
  evidence_quote: 高位仍有局部承接，低位新增活跃品种却在减少，说明情绪的扩散能力继续收缩。情绪能否改善，要同时看极端下跌减少和新增活跃品种增加。
  interpretation: UP判断情绪没有进入全面修复，只是局部高标维持；若跌停不减少或首板不恢复，反弹只能视为局部情绪波动。
