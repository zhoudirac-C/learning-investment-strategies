  subject: 无顶分型则无顶
  topic: 所有顶必然是顶分型，操作级别图上没顶分型就可以持有睡觉
  statement: 由自相似性结构推出的对任何股票、任何走势都适用的结论：所有的顶必须是顶分型的，所有的底都是底分型的；也就是没有顶分型没有顶，没有底分型没有底。实际操作推论：如果在你操作级别的K线图上没有顶分型，那你就可以持有睡觉，等顶分型出来再说。
  evidence_quote: 一个最简单的结论：所有的顶必须是顶分型的，反之，所以的底都是底分型的……没有顶分型，没有顶；反之，没有底分型，没有底。那么，在实际操作中，如果在你操作级别的K 线图上，没有顶分型，那你就可以持有睡觉，等顶分型出来再说。
  interpretation: 该结论与第80课一旦出现顶分型离开就是唯一选择互为正反两面：本课给持有过滤器，第80课给卖出触发器，合起来覆盖顶部的完整判断闭环。
