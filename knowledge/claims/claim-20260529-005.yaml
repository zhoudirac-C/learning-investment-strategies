  timeframe: short-term
  statement: 软件/AIPC在6月可以高看一眼，时间窗口合适（低位+适合炒+持续催化），但七八月炒业绩时就没法炒了。中国长城是AIPC/CPU绕不开的标的
  evidence_quote: 软件它必然是没业绩的。你没业绩，6月份炒一炒OK了，你等到七八月份开始炒业绩了，你这东西没法炒。从时间窗口来讲，一是低位，二是确实适合炒，三是有持续的催化。那么我觉得最近可以高看一眼。中国长城这个东西，你如果真要炒AIPC炒CPU这个东西一定是绕不开的
  interpretation: 博主给出软件/AIPC的6月炒作逻辑：①软件必然没业绩，但6月没法证伪，适合炒概念；②时间窗口三要素：低位+适合炒+持续催化（台北电脑展6/1-4、AIPC发布会6/2-5、苹果开发者大会6/9等）；③七八月炒业绩时，没业绩的软件必须下来；④中国长城是AIPC/CPU绕不开的标的，但看好的人太多太一致+市场环境不好，走得不顺畅；⑤参与节点：等半导体反弹时软件被砸出来的坑
