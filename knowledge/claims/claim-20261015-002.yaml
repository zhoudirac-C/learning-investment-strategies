- id: claim-20261015-002-d
  claim_type: operation
  subject: 捡便宜播种红鳄的次数纪律
  timeframe: short-term
  statement: 近期已发出两次捡便宜播种信号，不会再有第三次；这两次播种的成效将在三个交易日内显现。
  evidence_quote: 最近发了两次捡便宜播种的红鳄，不会有第三次了。三个交易日内，这两次的播种就会有成效。
  interpretation: 左侧捡便宜的操作次数被明确限定（两次），不因继续下跌而无限加码——这是鳄鱼派左侧介入的纪律：有限次、给定时限兑现，避免在下跌中不断摊薄。
