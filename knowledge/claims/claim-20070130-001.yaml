  subject: 技术分析的风险控制前提
  topic: 一切风险都反映为价格波动，唯一不可控的是交易被突然停止
  statement: 站在纯技术的角度，一切风险最终都反映为价格波动的风险，不用考虑市盈率之类的东西。缠论成立的一个最重要前提，是被理论分析的交易品种必须在可预见的时间内能继续交易；技术上唯一不能控制的是交易被突然停止或交易不算数，这是技术上的最大死穴。只要交易延续、交易算数，理论就没有任何盲点。应用结论：对那些要停止交易的品种最好别用任何理论；停牌之类不影响理论对风险的控制。
  evidence_quote: 站在纯技术的角度，一切风险都必然体现在价格的走势上，所有的风险，归根结底，最终都反映为价格波动的风险……唯一不能控制的就是，不知道交易什么时候被突然停止，这种事情是技术上的最大死穴……所以，在应用本ID 的理论时，唯一需要提防的风险就是交易能否延续以及是否算数。
  interpretation: 327国债事件是作者亲历的交易不算数案例，其最后一天在319平仓不是看图，而是对该类信用风险采取坚决不信任的纪律性退出。该前提划清了技术分析的适用边界：品种筛选时先排除有退市、停止交易风险的标的，再谈买卖点。
