  subject: 吞没形态是自我完成的信号
  timeframe: permanent
  statement: 铁锤线、倒装铁锤线、上吊线、流星线这类单根信号都必须等次日K线确认；吞没形态不同，第一根代表原主导力量、第二根代表反超力量，信号与确认在同一组两根K线内完成，不需要次日再确认。这是吞没形态最大的价值，也是它在K线体系中地位较高的原因。
  evidence_quote: 像我们之前所有讲到的底部信号，铁锤线、倒装铁锤线，那么这些都是需要后续K线的确认。但看涨吞没它是一个较为完整的确认性信号。……但看跌吞没呢，它就是自己的一个完整的信号加确认。这就是吞没形态它最大的价值，就是自我完成的一个力量切换的信号。
  interpretation: 「自我完成」直接改变了操作时点：单根信号只能等次日，吞没可以在第二根收盘时按形态成立与否决策，这是它与单根反转K线最本质的差别，不是强度差别而是确认机制差别。
