  subject: 多义性与含糊性的区别
  timeframe: permanent
  statement: 多义性不是含糊性：一个含糊的理论，其分类、概念呈现的含糊性只证明该理论基础的含糊；而多义性是站在严格、精确的理论基础上，用同一理论的不同视角对同一现象进行分析。
  evidence_quote: 必须注意，多义性不是含糊性，一个含糊的理论，其分类、概念等呈现的含糊性，只是证明该理论基础的含糊。而多义性，是站在一个严格、精确的理论基础上，用同一理论的不同视角对同一现象进行分析。
  interpretation: 这是对缠论理论品质的自我辩护：多种分解并存不意味着理论不严格，恰恰相反，多义性以概念的严格定义为前提，不同视角的结论各自确定且都符合理论，与模棱两可的含糊有本质区别。
