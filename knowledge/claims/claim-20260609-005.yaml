  subject: 国产算力——彭博报道确认2万亿计划，但处于补涨预期阶段
  statement: 彭博正式报道中国2万亿(约2950亿美元)5年AI数据中心建设计划，80%技术须来自华为等本土供应商，意在排除英伟达(NVDA)和AMD(AMD)。涉及A股标的：中国移动(600941)、中国电信(601728)将运营大部分数据中心。国产算力从'纯题材想象'推进到了'有金额、有部门、有国产化硬约束的产业逻辑'。但从盘面看，国产算力仍处于消息刺激下的补涨预期阶段，尚未像AI上游材料那样走出'抗分歧、创新高'的确认型强势。两条线的参与逻辑不同：AI材料=右侧确认跟随，国产算力=等独立量价确认后再参与。
  evidence_quote: 把国产算力从'纯题材想象'向'有金额、有牵头部门、有国产化比例硬约束的产业逻辑'推进了一步。但从盘面结构看，国产算力目前仍处于消息刺激下的补涨预期阶段，尚未像AI上游材料那样走出'抗分歧、创新高'的确认型强势。
  interpretation: UP 对国产算力做了精准定位——题材升格（彭博报道给了产业逻辑背书）但盘面未确认（还没走出材料那样的强势结构）。关键操作规则：①不等同于
    AI 上游材料——材料是主线、算力是补涨候选②确认规则：龙头放量突破+扛住次日分歧=量价确认完成③不确认不入场——'在消息刺激当天追情绪高点'是 UP 此前的明确纪律。三条不确定性保留：草案阶段/框架延续/时滞长度。
