  subject: 修正-冰点找不到趋势股的底
  timeframe: permanent
  statement: 修正提法：短线情绪冰点不适用于趋势股找底。连板情绪股可用冰点找拐点，但趋势股的调整是一段完整的下跌，需等下跌趋势放缓→缩量跌不动→磨底→右侧，不能单纯凭冰点判断见底。
  evidence_quote: 这里需要修正此前的一个提法：短线情绪冰点在本轮下跌中已出现过多次，但对趋势股的调整而言，冰点找不到底。连板情绪股可以用冰点找拐点；趋势股的调整是一段完整的下跌，途中会出现好几根伴随冰点的大阴线。真正的底，要等下跌趋势放缓、出现缩量跌不动的状态，再经历磨底进入右侧——可参照2021年初那轮赛道股调整的路径。
  interpretation: 这是对方法论的重要修正。UP此前常用冰点判断短线情绪拐点，但明确指出这适用于连板情绪股而非趋势股。趋势股调整需要完整的量价磨底过程，多次冰点大阴线是常态。
