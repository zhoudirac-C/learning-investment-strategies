    - 上游材料
    - 电子化学品
    - 铜缆/MLCC
    - 半导体材料
    reasoning_chain:
    - step: 1
      name: 观察板块内部强细分
      question: AI板块内哪些细分方向近期表现强势？
      UP_logic: 罗列铜缆、光纤、MLCC、超级电容等均有不错表现，发现共同点是AI基建上游材料端。
      evidence_sources:
      - 板块涨幅数据
      - 个股走势
    - step: 2
      name: 归纳共性并关联其他板块
      question: 这些强势细分的共同属性是什么？是否在其他板块得到印证？
      UP_logic: 归纳为AI基建上游材料端，并指出半导体中电子化学品（也是上游材料）率先创新高，强化共性。
      evidence_sources:
      - 半导体板块内电子化学品（中船特气、唯特偶）创新高
    - step: 3
      name: 推断方向确定性与持续性
      question: 这个方向是否具有高确定性，不易被短期情绪逆转？
      UP_logic: 上游材料大方向不会轻易扭转，即使短线情绪遇冷，因其逻辑硬、多细分共振，且非科技方向已近尾声。
      evidence_sources:
      - 非科技方向（煤炭、电力）加速上涨的见顶征兆
    risk_factors:
    - 上游材料个股补跌风险
    - 指数破位导致系统性下跌
    - 产业需求不及预期
    confidence_indicators:
    - 多个细分方向同时走强形成共振
    - 电子化学品等创新高证明资金认可
    - 非科技方向接近尾声，资金可能回流科技
