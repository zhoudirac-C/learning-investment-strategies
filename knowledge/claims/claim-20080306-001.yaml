  subject: 操作级别的选择与级别递进
  topic: 高级别改变必先从低级别开始，一般用1、5、30分钟三级别分解即可
  statement: 级别存在的必然结论：任何高级别的改变都必须先从低级别开始，绝对不可能出现5分钟从下跌转折为上涨而1分钟还在下跌段中。从1分钟一直到年对应8个级别（名字可随意取，只是这样符合习惯），任何走势都可以唯一地表示为a1A1+a5A5+a30A30的形式；但一般操作没必要分解到年、季、月级别，1、5、30分钟三个级别的分解就足以应付所有的走势，大点的资金可以考虑加上日级别。完全分类是级别性的、有明确点位界限的，缠论因此完全是数量化、精确化的，里面不存在任何含糊的地方。
  evidence_quote: 级别的存在，一个必然的结论就是，任何高级别的改变都必须先从低级别开始。例如，绝对不可能出现5 分钟从下跌转折为上涨，而1 分钟还在下跌段中……一般来说，1、5、30 分钟三个级别的分解，就足以应付所有的走势。当然，对于大点的资金，可以考虑加上日级别的……完全分类是级别性的，是有明确点位界限的。
  interpretation: 高级别必从低级别先变给出多级别联立的推演次序，是第100课三层次完全分类推演的理论基础。三级别分解够用的结论，把理论落到可执行的日常分析工作量上。
