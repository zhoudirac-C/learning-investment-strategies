# === 明确规避/反弹减仓清单 ===
avoid_and_reduce:
  avoid:
    - 存储芯片（M头+颈线+量价顶背离，反弹减仓）
    - CPU（走弱，先出来观察）
    - 科创50（趋势走坏，反弹是卖点）
    - 煤炭（高位出货风险，反弹撤）
    - 房地产（只有交易性机会，无配置价值）
  reduce_on_rebound:
    - 锂矿电池（位置偏高，反弹至60日线撤）
    - 稀土（60日线撤）
    - 石油（地缘支撑减弱，反弹撤）
    - 黄金（美元/实际利率压制，等反弹）
