  subject: 集合竞价红绿柱读法
  topic: 竞价未匹配买单多则主力做多意愿强开板概率低
  timeframe: permanent
  statement: 集合竞价图下方柱体是双方已匹配成功的单量、上方柱体是未匹配成功的单量：上方绿色越多代表排队卖的资金多，应换一只；上方基本红色且下方细微红色，代表排队等买资金多、市场认可度高、主力做多意愿比较强、开板概率比较低，可以参考
  evidence_quote: 下面的这一块呢，是双方已经匹配成功的单量。上面的这一块呢，是双方没有匹配成功的单量。……上面的这个如果是绿色越多呢，就代表说排队卖的资金比较多。那我们换一只。像这只，上面基本都是红色的，下面也是细微的红色，就代表说排队等买的资金多。那就代表着切过来的这只呢，市场的认可度高，主力的做多意愿比较强，开板的概率比较低。
  interpretation: 未匹配买单堆积=想买而买不到的资金，是开盘后继续推高的潜在力量。UP同时指出：9:15-9:20同样封板但后续走弱的，是主力想做多但能力或意愿不强。
  confidence: high
  status: active
  intensity: high
