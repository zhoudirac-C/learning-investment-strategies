  subject: 走势必完美与当下判断
  timeframe: permanent
  statement: 当下判断的基础在于采取的分解方式：在小级别分解中完成的走势，在大级别分解中不一定完成；根据走势必须完美的原则，未完成的走势必完成，因此在不同的分解角度，可以在当下看到不同级别的未完成走势根据走势必完美原则产生的运动。
  evidence_quote: 当下判断，其基础在于采取的分解方式。例如，一个按5分钟分解的操作角度与一个按30 分钟分解的操作角度，在同一时间看到的走势意义是不同的。更重要的是，在5
    分钟分解中完成的走势，在30 分钟却不一定完成。例如A+B，A、B 都是5 分钟的走势类型，那么A+B走势，对于30 分钟的分解就是未完成的。根据走势必须完美的原则，未完成的走势必完成
  interpretation: 这是把“走势必完美”原理转化为可操作判断的关键：同一段走势在小级别已结束、在大级别尚未结束，未结束的大级别走势必然继续生长，操作者可通过切换分解角度提前看到大级别尚未释放的运动空间。
