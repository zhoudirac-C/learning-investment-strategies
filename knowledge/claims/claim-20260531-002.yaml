- id: claim-20260531-002-b
  topic: 被动元件（MLCC为代表）进入周期上行
  source_path: sources/raw/财经/复盘：26-05-31：科技震荡消化拥挤，被动元件全面进入周期上行.md
  source_date: 2026-05-31
  source_type: 复盘
  extracted_at: 2026-05-31
  claim_type: sector-theme
  subject: MLCC全面进入周期上行，但本质是外溢承接而非类存储大紧缺
  timeframe: industry
  statement: 被动元件（MLCC为代表）进入周期上行，海外巨头落实涨价、连接器二度提价、电容配套放量。但MLCC行情本质不是类存储的持续涨价大紧缺周期，而是承接海外超高产能挤压出的外溢需求。量的改善强于价的改善
  evidence_quote: 市场自媒体把MLCC类比存储的'持续涨价大紧缺周期'，但更准确的逻辑是：MLCC承接海外超高产能挤压出的外溢需求。原因在于：AI对全球MLCC的需求只有约10%；由于产线不兼容、需要改造，高容产品对普通产品的挤出效应大约在20%；而AI所需的高容产品海外也在扩产。价值量、扩产难度、供需格局都无法与存储类比。量的改善强于价的改善。
  interpretation: MLCC行情的核心认知纠偏：①不是"类存储"的大紧缺涨价周期，而是海外产能结构性转移（低容→高容）造成的外溢承接；②AI对MLCC全球需求仅占10%，高容挤出效应约20%，海外也在扩产高容，供需格局远不及存储紧张；③A股MLCC偏海外映射行情，量的改善强于价的改善；④缺口可持续半年以上，具备中长期逻辑但需降低涨价预期。这是本次复盘最重要的认知更新。
  confidence: high
