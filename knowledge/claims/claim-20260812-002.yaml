  evidence_quote: 今天是一根缩量普涨的阳线：指数全天稳步走高，午后高位震荡，尾盘小幅抬升，双创明显强于主板。但这根阳线真正的信息量不在涨幅，而在量能已经退到本轮反弹以来的阶段地量。上证指数涨0.32%，深证成指涨1.09%，创业板指涨1.49%，科创50涨1.61%，北证50涨0.23%；沪深两市成交额约21524亿元，较前一交易日缩量约1686亿元。全市场4128只个股上涨、1280只下跌，上涨家数为本月最多的一天。
  interpretation: UP定调：8/12缩量普涨且宽度（上涨家数）创本月新高，但量能退到反弹以来阶段地量——涨幅不是信息量核心，量能才是。双创明显强于主板。
