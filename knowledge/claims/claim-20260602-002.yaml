  claim_type: sector-theme
  subject: AI数据中心瓶颈向两端延伸：供电端SOFC和互联端DSP
  timeframe: medium-term
  statement: AI数据中心瓶颈从"算力"向供电端（电不够用）和互联端（互联卡脖子）延伸。SOFC（固体氧化物燃料电池）是供电新解法，甲骨文与Bloom Energy 2.8GW大单；DSP是800G/1.6T光模块核心芯片，全球仅4家量产
  evidence_quote: "AI数据中心的瓶颈正在从'算力'向两端延伸——一端是电不够用，一端是互联卡脖子。"
  interpretation: AI硬件产业新催化：①瓶颈转移：算力→供电+互联——这是AI基础设施演化的重要判断；②SOFC：固体氧化物燃料电池，发电效率50%-65%，甲骨文2.8GW大单。A股间接逻辑：潮州三环（电解质陶瓷）、潍柴动力（系统/整机）；③DSP：数字信号处理器，800G/1.6T光模块"大脑"，成本占比20%-30%。全球仅博通/Marvell/MaxLinear/Credo四家量产。确定性层：中际旭创、新易盛、天孚通信；预期层：裕太微、光迅科技、烽火通信；④海外确定性 vs 国内预期：SOFC和DSP都是海外有订单/需求，国内多在早期/在研；⑤硬信号等待：订单、流片、量产落地才能从概念走向业绩。这是两个新的AI硬件细分方向，属于产业链认知更新。
