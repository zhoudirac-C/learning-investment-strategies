  timeframe: permanent
  statement: UP自我反思：这波没有追高、没有买在很高位置，但高点在模式内的减仓没有做或做得非常少（仅有的减仓都是需要用钱的被动减仓，杯水车薪）——这也是一种上头：不管看到的是真相还是假象，不顾风险追求想要的东西这件事本身值得反思；现在回撤不用钱没影响，但以后更大仓位、更重要战役时这么大波动过于大，后面操作要完善操盘模式、让曲线更平滑。
  evidence_quote: 因为我在高点在模式内的减仓，我是没有做的，或者说做的非常少非常少，那个减仓都是被动减仓……所以我认为呢，这也是一种上头吧，可可以这么认为……我不后悔这次的操作，但是我觉得在后面的操作中可能会更加的完善自己的这个，嗯，就是说操盘的一个模式吧，就是让它更加平滑一点这个线。
