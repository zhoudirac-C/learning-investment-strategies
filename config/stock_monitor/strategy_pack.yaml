operation_plan:
  date: '2026-06-30'
  type: daily_operation
  gold_rule: >-
    6/29晚间复盘定调：全A破位后进入情绪扰动阶段，一天之内风格三次大变，市场尚未形成合力。

    上证跌破关键支撑，下跌结构未完全证伪；情绪扰动为主、内生结构尚未走顺，不适合放心右侧加仓。

    半导体上游（设备/材料/洁净室）+ 存储是当前产业逻辑最扎实的主线，但持续逆势与情绪周期不同步，未必是最舒服的参与节奏。

    算力硬件（光通信/PCB/液冷/存储）短期退潮，等待企稳信号而非急于抢反弹。

    真正值得等待的买点：大盘指数再次回踩阴线 + 全A不破6/29下影线 + AI硬科技大分支连续调整2-3日之后的再回踩。

    核心纪律：右侧确认为先，不追涨，买阴要求更高。半导体与大盘共振放量才可跟踪右侧，否则等回踩买阴。
  step_by_step:
  - step: 开盘（09:25-09:40）
    action: 观察竞价方向。若半导体上游（设备/材料/洁净室）高开不追，等盘中分歧。若算力硬件（光通信/PCB/存储）继续低开走弱，确认退潮延续。关注季末消费轮动是否开盘即兑现
    note: 全A破位后开盘追高是最大风险；周末复盘讲的方向今日动了也不追高
  - step: 早盘确认（09:40-10:30）
    action: 观察五个验证维度：①全A是否守住6/29下影线并放量 ②半导体上游是否与大盘共振 ③算力硬件退潮是否趋缓 ④存储末端（模组/封测/内存互连）是否补涨 ⑤季末消费轮动是否形成有效对冲
    note: 缩量企稳第一，无企稳无合力；半导体逆势孤军时不追
  - step: 方向确认（10:30-11:20）
    action: 确认半导体上游是否分化走强、算力硬件是否企稳、功率半导体是否延续强势、季末消费轮动是否有效。若放量+承接好+与大盘共振→按优先级评估分歧买点。若缩量震荡或半导体逆势→持有不动
    note: 6/30是季末最后交易日+中报持仓确立日，方向选择和风格漂移落地是核心
  - step: 尾盘（14:52）
    action: 验证今天是否形成明确的企稳信号。半导体上游是否与大盘共振；算力硬件是否止跌；季末消费轮动是否延续。仅当共振放量时才考虑轻仓跟随上游设备材料+存储末端
    note: 尾盘条件单是最佳介入窗口，前提是当日已确认分歧企稳+共振放量
