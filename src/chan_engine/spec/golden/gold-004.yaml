# GOLD-004 金标：601628 中国人寿 5 分钟趋势背驰第一类卖点
# （课24 课文实例，等比 synthetic）
#
# 课文结论（课24《MACD 对背弛的辅助判断》，2007-01-18 发文）：
#   "请看 601628 人寿的 5 分钟图：11 日 11 点 30 分到 15 日 10 点 35 分构成一个
#    中枢。15 日 10 点 35 分到 16 日 10 点 25 分构成 A 段。16 日 10 点 25 分到
#    17 日 10 点 10 分，一个标准的三段构成新的中枢，也相应构成 B 段，同时 MACD
#    的黄白线回拉 0 轴。其后就是 C 段的上涨，其对应的 MACD 红柱子面积明显小于
#    A 段的，这样的背驰简直太标准了。"
#   以及"背驰后其回跌一定至少重新回到 B 段的中枢里，看看 601628 人寿昨天的
#    回跌，就一目了然了"。
# claim 原文依据：
#   - claim-20070118-001-a（课24 MACD 判断背驰的标准方法）：A 段之前有中枢，
#     B 是另一个中枢并把黄白线回拉 0 轴，C 段完成时 MACD 柱子面积比 A 段小
#     → 标准背驰；
#   - claim-20070118-001-b（课24 背驰-买卖点定理）：任一背驰必然制造某级别
#     买卖点；背驰后回跌一定至少重新回到 B 段中枢里。
#
# 降级说明（ADR-005）：2007 年 1 月分钟级数据公开源不可得（baostock 分钟线
#   查询 2007-01 返回 0 行；akshare 东财分钟线仅近期），按课文描述等比
#   synthetic：课文"中枢/A 段/B 段（三段新中枢）/C 段"结构逐段映射，
#   段=笔口径（同 cases），pivot 间距 4 根 K 线；价格量级仿人寿当期（约 40 元）。
#
# 结构推导（上涨趋势两中枢 + C 段力度衰竭 → 一类卖点，fx/bi/zs/bsp 全文断言）：
#   - 引导笔 idx1(38.0 底)→idx5(39.6 顶)；
#   - 中枢1（课文"11日11:30~15日10:35 的中枢"）：段1 下 idx5→9 [38.5,39.6]、
#     段2 上 idx9→13 [38.5,39.5]、段3 下 idx13→17 [38.6,39.5]：
#     ZD=max(38.5,38.5,38.6)=38.6、ZG=min(39.6,39.5,39.5)=39.5 → [38.6,39.5]，
#     start_idx=5，end_idx=17，sure=true；
#   - A 段上 idx17(38.6)→idx21(41.5 顶)，幅度 2.9（课文"15日10:35~16日10:25 A 段"）；
#   - 中枢2=B 段（课文"16日10:25~17日10:10 三段构成新的中枢"）：
#     段1 下 idx21→25 [40.6,41.5]、段2 上 idx25→29 [40.6,41.3]、
#     段3 下 idx29→33 [40.7,41.3]：ZD=max(40.6,40.6,40.7)=40.7、
#     ZG=min(41.5,41.3,41.3)=41.3 → [40.7,41.3]，start_idx=21，end_idx=33，
#     sure=true；中枢2 整体高于中枢1（40.6>39.5）两中枢无重叠 → 上涨趋势；
#   - C 段上 idx33(40.7)→idx37(42.0 顶)，幅度 1.3 ≪ A 段 2.9（力度/面积代理：
#     段内 Σ|Δ收盘| A=2.9、C=1.3，C<A 成立）→ 标准顶背驰，
#     C 段终点 idx=37 为第一类卖点（dir=down，卖点=down）；
#   - 回跌笔 idx37→idx41 至 41.0，重新跌回 B 段中枢 [40.7,41.3] 内
#     （课文"回跌一定至少重新回到 B 段的中枢里"✓）；末位 fx/bi → false。
