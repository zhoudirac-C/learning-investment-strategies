  timeframe: short-term
  statement: 社融数据增加但经济数据偏弱（二季度GDP 4.3%低于预期4.5%），验证了此前设定的情景框架正在按剧本演化——市场将从"数据公布前预设框架"阶段进入"按情景框架定价"阶段，剧本（情形二→情形三演化）已经启动。
  evidence_quote: 社融数据增加，经济数据拉跨，剧本已经开始了，来吧，告诉我会发生什么事情，之前讲过的。
  interpretation: 社融（宽信用）增加说明政策端在发力，但需求端（消费/地产/投资）仍然偏弱，经济结构剪刀差扩大。UP用"剧本"一词确认此前设定的情形二（工业/出口/科技强）向情形三（消费/地产弱→市场押注政策宽松→指数先跌后稳）的演化路径已经启动。
