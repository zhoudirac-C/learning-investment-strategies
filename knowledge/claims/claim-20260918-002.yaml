  topic: 周三增量资金真实但持续性待验证；预估值上修不等于新增成交
  timeframe: short-term
  statement: 周三盘中量能逐步抬升（10点半预估1.5万亿至11点1.6万亿加，午后实际1.84万亿）说明参与意愿在增强，但预估值上修与实际成交额增加是两个口径，不能把约3000亿的预估变化直接称作新增成交或净流入；持续性仍待验证
  evidence_quote: 据所提供的盘中观察记录，10 点半前后全天成交额预估约为 1.5 万亿元，11 点升至 1.6 万亿元以上，午后进一步上修，最终实际成交约
    1.84 万亿元。这条路径说明参与意愿在交易过程中增强，比单看指数收盘涨幅更有价值。但预估值上修与实际成交额增加是两个口径，不能把约 3000 亿元的预估变化直接称作新增成交或净流入。
  interpretation: 这是对量能数据的解读而非播报。门槛判定：数据+解读，只提解读部分。
