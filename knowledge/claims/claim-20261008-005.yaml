  subject: 成长板块风向标与最后一跌规律
  timeframe: short-term
  statement: 成长板块是市场风险偏好的风向标，对判断情绪底非常重要；历史上多次（今年3-4月、去年11月）经历大跌后跳空低开，往往都是成长板块的最后一跌，标志整个市场做空动能完全释放。
  stance: market-regime
  evidence_quote: 他们是作为市场风险偏好的一个风向标，对市场我们来判断情绪底它是非常重要的。因为在历史上我们多次就是看到这样的情况发生……比如说我们在今年的三四月份的时候，它也是经历过一段大跌，然后跳空低开。这一般来讲，这种地方都是相对来讲非常底部的一个地方。包括说我们在去年十一月份的时候，也都出现过这样的情况。都是在经历过一段长一段时间的下跌，特别是从直接一轨二轨直接往下跌，跌到五轨、底轨，情况下出现的跳空低开，它往往都是成长板块的最后一跌。那么也就标志着整个市场做空动能完全释放。
  interpretation: UP 用历史类比为今日大跌定性：『一轨二轨直接跌到五轨底轨+跳空低开』的形态组合=最后一跌的历史模板（今年3-4月、去年11月两次先例）。这是他『抄底』标题的周期层依据，与 d 条的技术信号互补。
