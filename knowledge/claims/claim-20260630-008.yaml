  subject: 加减仓的不对称纪律
  timeframe: permanent
  statement: 仓位处理在加仓与减仓之间刻意不对称：买入可以渐进试探（首日加20%~30%），卖出必须当日先执行一半（50%）；因为风险处理不允许用「再等等确认」换时间。
  evidence_quote: 这个和加仓不一样，加仓你第一天你加百分之二十、三十，但是你减仓你第一天要减仓百分之五十。
  interpretation: 同一套形态信号，买入侧可以给三次确认机会，卖出侧只给一次；对称处理会把止盈止损拖成被动持有。
