  subject: 中阴阶段的定义
  topic: 前一走势类型死亡到新走势类型确立之间的模糊阶段，一律表现为某级别盘整
  statement: 走势分解本质上只有延续与转折两类，一个走势类型的死必然意味着一个走势类型的生。前一个走势类型的背驰或盘整背驰宣告了它的死亡，到新的走势类型确立，中间有一个模糊的如同中阴般的阶段。中阴阶段无一例外都表现为不同级别的盘整，也就是围绕前一走势的某一部分所构成的中枢震荡，即使是所谓的V型反转也一样，只是震荡的区域回得更深而已；注意这只是从截取这一阶段的形态说，并不是说新的走势类型一定是盘整。
  evidence_quote: 如果说前一个走势类型的背驰或盘整背驰宣告了前一个走势类型的死亡，那么到新的走势类型确立，这里有一个模糊的如同中阴般的阶段……中阴阶段，无一例外，都是表现为不同级别的盘整（注意，这是只从截取这一阶段的形态说，并不是说新的走势类型一定是盘整）。也就是围绕前一走势的某一部分所构成的中枢震荡，即使是所谓的V 型反转，也一样，只是震荡的区域回得更深而已。
  interpretation: 中阴是缠论走势生死轮回框架的关键环节：把握这阶段必须把前一段走势的部分走势结合起来分析，借前面形成的中枢完成分析与操作，获得双重分析保证。很多人逃了顶又被套住、抄了底又被震出，就是被相应级别的中阴阶段搞死的，越大级别转折后的中阴阶段越能搞死人。
