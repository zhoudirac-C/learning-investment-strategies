  statement: 不能因为核心CPI降到2.5%就直接喊不加息：CPI公布前9月加息25个基点的概率大约在46%至50%基本是五五开；美联储在7月29日以9票赞成、3票反对连续第五次维持联邦基金利率目标区间在3.5%至3.75%不变。鹰派失去一个必须马上加息的理由，但鸽派也没拿到通胀彻底解决的证据；美联储真正盯的是PCE而不是CPI，据路透调查7月核心PCE同比可能仍在3.3%左右。这份CPI明显降低了因通胀失控而被迫加息的尾部风险，但9月到底加不加仍要看8月CPI、PCE、就业与能源价格——8月CPI将于9月11日发布，FOMC会议在9月15日至16日召开并同时公布经济预测摘要与点阵图，那才是真正的决胜局。
