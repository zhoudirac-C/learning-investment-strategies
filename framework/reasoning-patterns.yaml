    - 对标补涨路径可能缩容，如海南发展单日独苗
    - 缩量环境下题材呈大杂烩，难以形成持续主线
    confidence_indicators:
    - 放量环境下题材具备延续性
    - 大成交额首板今日能维持赚钱效应
    - 盘中主动走弱后再度走强
    - 复制强上加强走势吸引资金
