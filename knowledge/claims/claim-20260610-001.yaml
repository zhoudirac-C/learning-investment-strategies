  claim_type: methodology
  subject: 修复质量的两种情形推演——强修复 vs 弱修复
  timeframe: short-term
  statement: 对于明后两天，两种情形推演：①强修复——今日科技明显修复，明日弱分歧，全A指数补涨，同向修复使全A短期脱离破位风险区。到时AI科技分歧回落时可考虑低吸，新的情绪载体核心可能出自PCB上游CCL与树脂、或光纤龙头。②弱修复——科技独立修复，微盘股与全A继续破位，类似5月22日、6月2日全A后续创新低的走法。因本次硬科技聚焦程度不及那两次，市场预期应相应降低。时间维度经验：5月22日和6月2日即便后续全A破位也用了两日半，尾盘低吸埋伏有三两日空间。但本次全A距破位更近（尤其微盘股），需更谨慎。
  evidence_quote: 第一种情况：今日科技为明显修复，明日弱分歧，全A指数补涨，从而形成同向修复，全A短期脱离破位风险区。第二种情况：科技独立修复，而微盘股与全A继续破位，类似5月22日、6月2日全A后续继续创新低的走法。
  interpretation: 这是 UP 的核心推演框架——用两种情形（强/弱）框定明后两天的观察重点。关键变量是「全A指数能否跟随补涨」。这与6/4提出的「大小盘同步决定主升质量」方法论一脉相承——即使科技修复质量再好，全A不跟就只是局部反弹而非趋势反转。操作含义：强修复→分歧低吸科技核心；弱修复→更谨慎。
