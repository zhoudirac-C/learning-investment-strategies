  subject: 科技内部跷跷板效应
  timeframe: short-term
  statement: 物理AI/机器人与半导体材料/光模块构成了科技内部的跷跷板，资金根本没有离开科技，只是在里面换座位。
  evidence_quote: 之前总说机器人是大盘逆子，更准确地讲，是硬科技逆子。昨天半导体高潮、物理AI跌停，今天物理AI借大盘情绪反包，又和光模块一类的硬科技形成明显反差。这和此前提到的'资金在科技股内部游走'是同一件事的两面：物理AI/机器人与半导体材料/光模块构成了科技内部的跷跷板，资金根本没有离开科技，只是在里面换座位。
  interpretation: UP将科技内部轮动概括为跷跷板效应——物理AI/机器人在一端，半导体材料/光模块在另一端，资金在两者之间切换而非离开科技板块。这与此前'资金在科技股内部游走'的判断一致，意味着不必因科技板块某方向调整而担心整体撤退。
