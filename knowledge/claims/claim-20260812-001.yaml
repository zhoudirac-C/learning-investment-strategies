  timeframe: short-term
  statement: 据行情数据，8月11日沪指低开0.40%报3950.71点，全天走势偏弱、收跌近1%，创业板指微涨。这两天资金围绕吃药喝奶看电影改变了此前沪弱创强的格局，形态上有点类似去年12月底。背后的深层原因可能与近期基金公司因产品风格漂移、无资质大V带货被追责这条新闻有关——它直接改变的是机构资金敢不敢在风格上继续漂移。至于昨天的分化：沪指要逼近4000点所以跌；创业板指因为中际旭创(300308)和德明利(001309)企稳所以涨。不过上午只是象征性拉了一波，午后就开始冲高回落，说明拉升缺乏承接。
  evidence_quote: 背后的深层原因可能与近期“基金公司因产品风格漂移、无资质大 V 带货被追责”这条新闻有关——它直接改变的是机构资金敢不敢在风格上继续漂移。
  interpretation: UP解读沪弱创强成因：基金风格漂移被追责改变机构行为+吃药喝奶看电影高低切；创业板靠中际旭创(300308)/德明利(001309)企稳，午后冲高回落说明缺乏承接。
