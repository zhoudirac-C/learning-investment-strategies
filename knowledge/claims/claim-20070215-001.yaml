- id: claim-20070215-001-c
  source_path: sources/chanlun/lesson_031.md
  source_date: '2007-02-15'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 一次性买入与短差纪律
  topic: 准备好一次性买入绝不向上加码，短差不增加股票数量
  statement: 最坏的习惯是股票不断上涨就不断加仓，这样一定会出问题；买股票宁愿不断跌不断买，也绝对不往上加码。投入资金买一只股票必须有仔细充分的准备，基本面技术面研究好了介入就要坚决、一次性买入；如果连一次性买入的信心都没有，证明根本没准备好，一股都不要买。买入后下跌了，除非买入理由没有了、技术上出现严重形态，否则不能抛一股。针对每只买入的股票要留部分机动资金（例如十分之一）弄短差让成本降下来，但每次短差一定不能增加股票的数量；该买多少、占总体资金多少一开始就应该研究好，投入以后就不能再增加。
  evidence_quote: 一些最坏的习惯，就是股票不断上涨，就不断加仓，这样一定会出问题。买股票，宁愿不断跌不断买，也绝对不往上加码……针对每只买入的股票，都要留部分机动的资金，例如1/10……但每次短差，一定不能增加股票的数量，这样，成本才可能真的降下来。
  interpretation: 加仓方向纪律与短差纪律是成本为0程序的配套规则：向上加码抬高成本并把仓位暴露在高位，短差增股数则把成本游戏变成加仓游戏。另外资金是按比例损失的，一万亿和一万元变成0的速度一样，永远保持最大的警觉是资金管理最重要的一点。
