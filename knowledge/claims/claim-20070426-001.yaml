  subject: 固定级别的操作完全分类
  topic: 入市先找最后一个本级别中枢，按当下相对中枢的三种位置分类应对
  statement: 确定操作级别后，打开走势图首先要找当下之前最后一个该级别中枢，它一定可以马上确认、无须任何预测。当下只有三种情况：一、在中枢之中，此时中枢在延伸，怎么演化都是对的，不操作是最好的操作，技术好的可按次级别第二类买点参与；二、在中枢之下，按之前是否已出现第三类卖点分两小类，未出现的用类似背驰比较力度的方法以MACD辅助找买点，已出现的不参与，等新中枢或更大级别中枢完成后再定介入时机；三、在中枢之上，按之前是否已出现第三类买点分类，未出现就等待，已出现且离买点形成不远可介入。对一个中枢来说，最有价值的买点是其第三类买点以及中枢向下震荡力度出现背驰的买点。必须养成不参与操作级别及以上级别的下跌与超过操作级别的盘整的习惯。
  evidence_quote: 进到市场，打开走势图，首先要找什么？就是找当下之前最后一个30 分钟中枢……将会出现三种情况：一、当下在该中枢之中。二、当下在该中枢之下。三、当下在该中枢之上……由于这时候怎么演化都是对的，不操作是最好的操作……对于一个中枢来说，最有价值的买点就是其第三类买点以及中枢向下震荡力度出现背驰的买点……但没必要参与操作级别及以上级别的下跌与超过操作级别的盘整，这种习惯，必须养成。
  interpretation: 这是把缠论落地为机械操作流程的总纲：完全分类消除了预测需要，每种位置对应唯一动作。第三类买点后的向上走势形成新中枢的过程最能获利，力度背驰买点则是围绕中枢震荡做差价、降低成本的入口。
