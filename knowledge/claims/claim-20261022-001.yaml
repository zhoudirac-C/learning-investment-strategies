  interpretation: 给出了「修复成立」的双条件判据：广度（少数品种→更广行业）+ 时间（承接延续到盘中而非仅开盘冲高）。这把「消息刺激=行情」的常见误判排除掉，判据可复用：单点冲高是买卖力量的一次性表达，扩散+持续才是自发修复。
