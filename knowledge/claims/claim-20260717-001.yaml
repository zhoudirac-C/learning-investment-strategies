  evidence_quote: 据大会官方信息，WAIC 2026今日至7月20日在上海举行，超1100家企业参展、3000余项成果、超300款全球首发产品。镇馆之宝揭晓：商用全尺寸人形机器人智元远征A3 Ultra入选，是十件镇馆之宝中唯一的具身智能机器人；它石智航将发布通用具身大模型AWE 3.5并把1:1复刻的汽车线束产线搬进现场，傅利叶展出16公斤负载的轮式双臂机器人GRW，中国具身智能机器人十强榜单也将在会期发布。谐波减速器、六维力传感器、空心杯电机等核心零部件面临「量产大考」。个人判断，会议题材历来有见光节奏，具身智能这条线同样要用两个条件过滤：一看是否兼具超跌属性，二看会期是否出现订单或量产级别的实证催化——只有叙事没有位置的，宁可错过。
