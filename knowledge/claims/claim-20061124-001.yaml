  subject: 好恶必察原则
  topic: 在股市里没有好恶，恶之必察焉，好之必察焉
  statement: 在股市里要摒除个人好恶：众恶之必察焉，众好之必察焉——无论个人对某政策、某股票多么厌恶或喜欢，都必须照样审察其市场后果。作者自述：他严重反对人民币升值与国有股流通，但知道本币历史性升值带来历史性牛市，于是2005年6月时隔四年后重看股票。书呆子有好恶而无察，企图以理论来理论现实，不适宜投机市场。
  evidence_quote: 但在股市里，本ID 从来没有好恶。只要有点金融常识的人都知道，本币的历史性升值所带来历史性牛市曾被太多国家所经历……书呆子是不适宜投资市场的……知识分子为什么可笑，就是有好恶而无"察"，企图以理论来理论现实……股票，恶之，必察焉；股票，好之，必察焉。
  interpretation: 察是对走势与事实后果的客观审察，好恶是主观立场，操作依据只能是前者。这是第3课"杜绝喜好"在宏观判断层面的展开：即使对政策有强烈价值判断，交易决策也只认其市场后果。
