subject: 假摔与拐点的两日走势组合判断法
timeframe: permanent
statement: "区分假摔和拐点的核心方法不是看单日走势，而是看连续两日的走势组合：①假摔=今日不强修复（震荡或下跌）+明日强修复→拐点延后但方向不变，今天尾盘或明天早盘是布局窗口；②直接修复=今日强修复→拐点今日确认，盘中确认后跟进。两种路径都指向拐点确认，差异只在时间节奏。若今天不强修复且明天也不修复→假摔判定证伪，需重新评估。"
evidence_quote: "如果这里判定为假摔，那么明天会强修复；如果今天强修复，那么就是确认拐点。所以这个节点，是要去判断明天的方向的。拐点的确认不看单日，看连续两日的走势组合。"
interpretation: "UP提出假摔判断的两日窗口法——单日走势不能区分假摔还是真拐点，必须看连续两日的组合。假摔=先弱后强（今天不强+明天强），直接修复=今天就强。两者均指向拐点确认，但操作节奏不同（假摔=明天布局，直接修复=今天跟进）。如果两天都不修复则重新评估。这个框架给了左侧交易和右侧交易之间的一个'半左侧'操作窗口，是判断拐点节奏的重要工具。"
