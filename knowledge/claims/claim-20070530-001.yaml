  subject: 突发消息下的可操作卖点
  topic: 突发消息使第一类卖点无法实际操作时，第二类或第三类卖点是唯一被理论保证的卖点
  statement: 第二类卖点除了在小级别转大级别上比第一类卖点优越，在特殊的突发情况下就是最佳卖点。当走势进入背驰段但因尾盘高收等原因无法用区间套定理确认背驰时，盘后的突发消息会使背驰被立刻确认，此时第一类卖点已经在实际操作中不可能存在，唯一可以进行操作的只能是第二或第三类卖点，这在开盘前就可以确定：一旦大幅度低开，现实的、能被理论完全保证的卖点就是第二类或第三类卖点。
  evidence_quote: 第二类卖点除了在小级别转大级别上比第一类卖点优越，在一些特殊的突发情况下，就是最佳的卖点……而晚上的突发消息，使得这个背驰被立刻确认，这时候，第一类卖点已经不可能在实际操作中存在，那么，唯一可以进行操作的，只能是第二或第三类卖点。这，在开盘前就可以有一个确定，也就是说，一旦大幅度低开，现实的、能被理论完全保证的卖点就是第二类或第三类卖点。
  interpretation: 这是2007年530印花税事件复盘的规则化：事前不能确认的背驰被突发低开确认后，操作锚点从第一类卖点平移到第二、三类。大盘走势是平均走势，特别弱的股票可能直接是第三类卖点，大盘的第二类卖点不意味着个股也是第二类。
