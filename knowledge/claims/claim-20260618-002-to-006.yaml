  subject: 创新药与价值成长股奖励坚守者非追涨者
  timeframe: trend
  statement: 创新药和其他价值成长股的上涨，属于苦苦坚守的人，不属于看到涨了就想去吃一口的人。它磨人、波动大、兑现慢，奖励的本就是在没涨时还拿得住的人
  evidence_quote: 无论是创新药，还是其他价值成长股，他们的上涨，属于那些苦苦坚守的人，而不属于看到涨了就想去吃一口的人。它磨人、波动大、兑现慢，奖励的本就是在没涨时还拿得住的人。
  interpretation: UP以创新药为例说明价值成长股的投资逻辑：需要提前布局并忍受波动，而非看到上涨后追入。结合6/17复盘中医创新药方向被提及，UP判断医药属于'跌透了等反弹'而非'逻辑反转'，但强调坚守的价值——属于已持有者而非新追入者。
