- id: claim-20070828-001-b
  source_path: sources/chanlun/lesson_074.md
  source_date: '2007-08-28'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 政策性风险的防范纪律
  topic: 不借贷炒股，泡沫化阶段只战略性持有，成本为零才安全，硬调控出现则在一切机会出逃
  statement: 防范政策性风险的操作纪律：一、注意仓位控制，借贷炒股绝对不允许，把资本市场当赌场的永远入不了资本市场的门；进入泡沫化阶段后，应坚持只战略性持有、不再战略性买入的根本原则，这样任何中短波动都有足够区间去反应。二、养成好的操作习惯，只有成本为0的才是安全的，这大概是彻底逃避市场风险的唯一办法。三、不要企望在硬调控出台前提早一天跑掉，关键是反应而不是神经叨叨的预测。四、一旦政策硬调控出现，则要在一切可能的机会出逃，历史上任何硬调控的出现，后面即使调整空间不大，时间也少不了。五、最终的赢利都在于个股，一个具有长线价值的个股是抵御一切中短分力的最终基础，底线不破则中短波动反而提供长期介入的买点。
  evidence_quote: 注意仓位的控制。现在透支已经不流行，但借贷炒股还是不少见。这是绝对不允许的，把资本市场当赌场的，永远也入不了资本市场的门。在进入泡沫化阶段后，应该坚持只战略性持有，不再战略性买入的根本原则……只有成本为0 的，才是安全的，这大概是彻底逃避市场风险的唯一办法……一旦政策硬调控出现，则要在一切可能的机会出逃，在历史上，任何硬调控的出现，后面即使调整空间不大，时间也少不了……最终的赢利，都在于个股，一个具有长线价值的个股，是抵御一切中短分力的最终基础。
  interpretation: 纪律的核心是把不可预测的政策风险转化为可管理的仓位与成本问题：保持好仓位、足够应对资金与低成本，让市场的风把你送到足够远的地方。原文另列以权证做必要对冲准备一条，属2007年特定工具环境，仅作历史注记不作通用规则。
