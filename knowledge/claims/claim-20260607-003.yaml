  subject: CPI数据（6月10日）——下周最大变量
  timeframe: short-term
  statement: 6月10日CPI数据是下周最大变量。能否破4是关键——若破4，这波有的跌。CPI数据出来前维持做空判断。最优情景：CPI后走ABC浪调整，节奏清晰。
  evidence_quote: 下周我们重点就要去看CPI...能否破四，如果破四了，上周这一波有的跌了。在整个CPI数据出现之前，我们还是先做空，没有什么问题。最好的情况是CPI出现之后能走一个ABC，我觉得是合适的。
  interpretation: CPI是短期方向的决定性变量。破4=利空加速下跌；不破4=可能止跌反弹走ABC。
