  subject: 持股与持币是最基本的操作
  topic: 买卖瞬间完成，持股与持币才是更长时间更重要的操作，本质是等待
  statement: 买入卖出1秒都不用就完成了，更多、更长时间填充在买入与卖出之间的两种最基本操作——持股与持币——才是更重要的操作。按某级别操作，在该级别买点买入后就进入持股这唯一的操作，直到宣告该走势类型结束的该级别卖点出现；卖出后进入持币操作，直到该级别买点出现。持股与持币归根结底是一种等待，等待那个被理论绝对保证的买卖点；所有股票的操作，归根结底只有两个字：等待。
  evidence_quote: 对于每一笔交易来说，买入卖出，1 秒都不用就完成了，更多、更长时间的，填充在买入与卖出之间两种最基本的操作：持股与持币，才是更重要的操作……在这个卖点到来之前，你就只在持股这唯一的操作里……持股与持币，归根结底就是一种等待，等待那个被理论绝对保证的买卖点。所有股票的操作，归根结底，只有两个字：等待。
  interpretation: 这条把"不操作"确立为操作的常态组成部分：级别买卖点之间的时间里唯一正确的动作就是持有或空仓等待，从理论结构上排除了频繁进出的正当性。
