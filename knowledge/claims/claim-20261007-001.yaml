  subject: 等锚定右侧跟随纪律
  timeframe: short-term
  statement: UP判断当下环境并不友好，有定力的投资者应等一个清晰的锚定，否则都是高难度操作。节后应对按两种情形准备：情形A补涨后量能温和回升、跌停家数明显减少、分化有序收窄，则再平衡顺利，重点观察科技内部趋势票与医药趋势突破；情形B补涨只停留在开盘定价、量能跟不上、跌停个股继续扩散，则调整中继延续，耐心等待二次恐慌或利空跌不下去两种锚定。大势短期向下但已逐步出现止跌预期，算一个小的左侧节点；节点信号越清晰交易价值越高，信号模糊时都只是一般的机会。
  evidence_quote: 个人判断，降低预期、放低频率，等走势越来越像企稳、出现长阳之后再做右侧跟随，把握一次高概率的确定性就够了。
  interpretation: 全篇落点操作纪律：左侧只做节点识别不做参与，右侧确认信号=长阳；以「信号清晰度与交易价值正相关」为仓位投放原则，目标是一次高概率确定性而非多次博弈。
