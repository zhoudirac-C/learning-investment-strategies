statement: 我对周二的基准判断是，持股所面对的系统性下跌风险较前期已经大大降低，日线信号支持提高参与度。若科技抛压减轻、回落承接稳定，反弹有望扩展；若只是权重托住指数，而跌停与补跌继续扩大，则仍按磨底中的结构修复处理，不能把技术底直接外推为全面反转。
