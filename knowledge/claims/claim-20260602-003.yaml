- id: claim-20260602-003-g
  topic: 在反复轮动、宽度有余而高度不足的格局下
  source_path: sources/raw/财经/复盘：26-06-02：共振修复，AI硬件普涨，情绪拐点确认.md
  source_date: 2026-06-02
  source_type: 复盘
  extracted_at: 2026-06-02
  claim_type: operation
  subject: 普涨轮动阶段，地位与卡位决定资金回流优先级，业绩兑现清晰的龙头优于纯情绪标的
  timeframe: short-term
  statement: 在反复轮动、宽度有余而高度不足的格局下，资金更倾向于回流到有明确产业卡位、份额或地位领先的龙头。核心思路：普涨轮动阶段，地位与卡位决定资金回流的优先级，业绩兑现节点清晰的龙头优于纯情绪炒作标的
  evidence_quote: 核心思路：普涨轮动阶段，地位与卡位决定资金回流的优先级，业绩兑现节点清晰的龙头优于纯情绪炒作标的。
  interpretation: 操作策略：①普涨轮动阶段的选股原则——地位/卡位优先，不是涨幅优先；②CPO供应链核心卡位：天孚通信（光引擎/FAU/ELS）、工业富联（CPO交换机）；③国产替代地位：鼎龙股份（光刻胶/CMP国产第一）、巨化股份（电子级PTFE）、裕太微（以太网PHY）；④全球市占地位：东山精密（FPC全球第二/PCB全球第三）、云铝股份（绿色铝龙头）；⑤MLCC环节：火炬电子、深圳华强；⑥核心纪律：业绩兑现节点清晰的龙头优于纯情绪炒作——这与博主一贯强调的「有真实订单/基本面的方向」完全一致。这是对当前操作环境的明确指导。
