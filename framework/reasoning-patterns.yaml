  - pattern_id: intraday_sector_rotation_signal_20260105
    name: 盘面板块轮动与强弱验证推理
    source_raw:
    - sources/raw/财经/午盘：26-01-05：机器人涨停潮，商业航天兑现，AI延续强势.md
    key_themes:
    - 板块轮动
    - 题材持续性
    - 高低切
    - 盘面情绪背离
    - 主线回流验证
    reasoning_chain:
    - step: 1
      name: 情绪背离识别
      question: 大盘与短线情绪是否同步？
      UP_logic: 早盘指数高开普涨，但连板股滞后、北交所无溢价，多数个股有溢价，推断资金或青睐低位地板股，与去年1月相似。
      evidence_sources:
      - 早盘指数高开
      - 连板股表现滞后
      - 北交所未溢价
      - 多数个股溢价
    - step: 2
      name: 板块强度定位
      question: 板块涨停潮是否具备真实强度？
      UP_logic: 机器人板块核心标的一字定方向，2个20cm一字板后资金追捧30cm弹性标的，竞价超预期；但高位+量化主导，持续性存疑。
      evidence_sources:
      - 创新医疗一字
      - 三博脑科竞价加速
      - 30cm弹性标的竞价
      - 板块高位
    - step: 3
      name: 板块间资金切换
      question: 板块兑现/回流时资金如何切换？
      UP_logic: 商业航天竞价情绪高点引发分歧，与脑机同为马斯克概念，资金板块间高低切；金风回封+中国卫通涨停确认主线回流。
      evidence_sources:
      - 竞价阶段情绪高点
      - 马斯克相关概念
      - 金风科技回封
      - 中国卫通涨停
    - step: 4
      name: 主线内部环节轮动
      question: 强势主线内部哪个环节更强？
      UP_logic: AI硬件端存储芯片取代光模块领涨，信创业绩确定性更强；应用端虽分流但围绕蓝色光标核心逻辑。
      evidence_sources:
      - 存储芯片领涨
      - 信创业绩确定性
      - 蓝色光标
    - step: 5
      name: 后续验证条件
      question: 午后走强需哪些信号确认？
      UP_logic: 若午后进一步走强需大金融发力突破新高，新股是标志性标的；关注机器人分化后回流强度。
      evidence_sources:
      - 大金融板块
      - 新股
      - 机器人回流强度
    risk_factors:
    - 机器人板块已高位且量化主导，接力不足则证伪持续性
    - 商业航天午后若放出亏钱效应，回流判断失败
    - 短线情绪偏弱，连板/北交所无溢价延续则普涨难持续
    confidence_indicators:
