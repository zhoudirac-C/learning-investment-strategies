market_framework:
  current_stage: 磨底期恐慌中后段，电风扇行情不追涨杀跌。突破4120才是趋势买点。工程机械/燃气轮机/创新药为低位配置方向。
  core_question: 指数能否站稳4000并突破4120？燃气轮机方向延续性？工程机械/创新药能否形成新主线？万泽风控线是否守住？
  up_quote: 6月9日：磨底期恐慌中后段。突破4120才是趋势买点。电风扇行情不追涨杀跌。工程机械/燃气轮机/创新药低位配置。
  key_assumptions:
  - 磨底期恐慌中后段，接近尾声
  - 突破4120才是趋势买点
  - 电风扇行情不追涨杀跌
  - 工程机械/燃气轮机/创新药为低位配置方向
  - 不碰消费和半导体
  - 4000/4120为关键点位
  invalidation_conditions:
  - 收盘跌破4000整数关→减仓
  - 燃气轮机方向集体走弱
  - 万泽跌破30.5风控线→执行减仓
intraday_schedule:
- window: 09:15-09:30
  name: 集合竞价
  action_bias: 只观察
  rules:
  - 观察燃气轮机方向(杰瑞/应流/万泽)是否延续强势
  - 观察工程机械(徐工)是否企稳
  - 观察创新药(药明康德)是否止跌
  - 观察全A指数(000985)是否与上证背离
- window: 09:30-09:45
  name: 开盘观察
  action_bias: 确认燃气轮机/工程机械方向
  rules:
  - 看燃气轮机方向主动走强还是回调
  - 看工程机械能否放量企稳
  - 看创新药止跌信号是否确认
  - 看科技是否继续上涨(UP规避但需观察)
- window: 09:45-10:30
  name: 急跌确认
  action_bias: 等确认，不水下盲吸
  rules:
  - 指数不创新低(4000上)且放量收回→观察
  - 燃气轮机回调关注企稳买点
  - 工程机械缩量回踩关注
  - 万泽逼近风控线30.5需重点监控
- window: 10:30-13:30
  name: 主修复窗口
  action_bias: 可做T，可观察
  rules:
  - 燃气轮机方向若强势可持有/做T
  - 工程机械/创新药等低位方向满足分时确认后可观察
  - 反弹到预设区但板块不扩散，优先观察不介入
  - 现金为主，新增买点必须等情景确认
  - 不碰消费和半导体
- window: 13:30-15:00
  name: 午后风险窗口
  action_bias: 只看不买
  rules:
  - 午后冲高无扩散，优先观察不介入
  - 电风扇行情不追涨杀跌
  - 尾盘回落跌破4000，降低次日预期
  - 若尾盘再度快速修复但成交不能放大，警惕继续透支次日预期
agent_analysis_schedule:
- id: open_auction
  time: 09:26
  name: 集合竞价后
  focus: 燃气轮机/工程机械/创新药是否按预期走，今天偏进攻还是防守。**判断大盘是否止跌企稳：低开高走/平开震荡=企稳信号；低开低走/高开低走=未企稳。若企稳可观察准备低吸，若未企稳继续等待。**
- id: open_confirm
  time: 09:45
  name: 开盘15分钟确认
  focus: 指数是否失守4000，燃气轮机/工程机械谁主动，持仓是否触发风控。**判断大盘是否止跌企稳：15分钟内不创新低且放量收回=企稳；继续创新低=未企稳。**
- id: morning_confirm
  time: '10:00'
  name: 10点确认
  focus: 30分钟后今天基调基本确定——强修复/弱修复/分歧/防御？写出今日机会模式初筛。**判断大盘是否止跌企稳：30分钟内出现日内低点后反弹且持续=企稳。**
- id: opportunity_scan
  time: '10:30'
  name: 30分钟确认
  focus: 调整是否不创新低，燃气轮机/工程机械能否做T或观察，万泽是否触发风控。**判断大盘是否止跌企稳：30分钟内出现日内低点后反弹且持续=企稳。**
- id: noon_review
  time: '11:20'
  name: 上午收盘前
  focus: 上午定性为强修复、弱修复、防御切换还是继续分歧。**判断大盘是否止跌企稳：上午收盘在日内高点附近=企稳。**
- id: afternoon_risk
  time: '13:10'
  name: 午后风险窗口
  focus: 按午后只看不买纪律，重点观察冲高回落和板块扩散衰竭。**判断大盘是否止跌企稳：午后开盘不跳水且维持震荡=企稳。**
- id: mid_afternoon
  time: '14:00'
  name: 午盘监控
  focus: 午后一小时盘面验证：燃气轮机/工程机械是否触发观察点、持仓是否触发风控、万泽是否逼近30.5。只讲当下，不预判尾盘。**判断大盘是否止跌企稳：14:00前后出现低点后反弹=企稳。**
- id: tail_condition
  time: '14:55'
  name: 尾盘条件单
  focus: 判断是否符合尾盘观察、规避尾盘杀的条件。**判断大盘是否止跌企稳：尾盘维持震荡或小幅回升=企稳；尾盘跳水=未企稳。若企稳可低吸，若未企稳只观察不买。**
position_rules:
- id: opportunity_panic_oversold
  name: 恐慌超卖策略
  description: 对应机会模式1。当板块系统性回调（非个股利空），日内跌>5%时触发
  action: 评估赔率后试探买入
  max_position: 1成
  stop_loss_pct: 3
  claim_basis: UP的'别人恐慌我贪婪'思想
- id: opportunity_breakout
  name: 平台突破策略
  description: 对应机会模式2。横盘2+周后放量突破区间上沿
  action: 确认突破有效性（次日不回落）后追入
  max_position: 1.5成
  stop_loss_pct: 5
- id: opportunity_technical_support
  name: 技术支撑确认
  description: 对应机会模式3。回踩关键均线/平台企稳，缩量确认
  action: 企稳后试探买入
  max_position: 1成
  stop_loss_pct: 3
- id: opportunity_sector_rotation
  name: 板块轮动早期
  description: 对应机会模式4。新方向首日启动，龙头涨停，观察次日持续性
  action: 龙头首日不追，次日确认后轻仓试探
  max_position: 0.5成
  stop_loss_pct: 5
- id: opportunity_leader_pullback
  name: 龙头分歧低吸
  description: 对应机会模式5。主线龙头首次大分歧，缩量回踩
  action: 分歧日尾盘或次日低吸
  max_position: 1.5成
  stop_loss_pct: 3
- id: opportunity_tail_condition
  name: 尾盘条件单
  description: 对应机会模式6。14:30后符合特定技术条件（回踩不破、放量企稳）
  action: 尾盘确认后买入
  max_position: 0.5成
  stop_loss_pct: 2
- id: opportunity_event_driven
  name: 事件驱动
  description: 对应机会模式7。突发利好/利空导致赔率突变
  action: 评估事件实质影响后决策
  max_position: 1成
  stop_loss_pct: 5
