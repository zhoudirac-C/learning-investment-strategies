  subject: K线包含的顺序处理
  topic: 包含关系不具传递性，多根连续包含必须按顺序逐根合并
  statement: 用[di,gi]记号第i根K线的最低、最高构成的区间：向上时，顺次n个包含关系的K线组等价于[maxdi,maxgi]区间对应的K线；向下时，等价于[mindi,mingi]区间对应的K线。包含关系不符合传递律：第1、2根K线是包含关系，第2、3根也是包含关系，并不意味着第1、3根就有包含关系。因此处理中还要遵守顺序原则：先用第1、2根K线的包含关系确认新的K线，再用新K线去和第三根比，有包含关系就继续按法则结合成新K线，没有就按正常K线处理。向上向下也可几何定义：设第n根与第n+1根有包含关系而第n根与第n-1根没有，若gn大于等于gn-1则称第n-1、n、n+1根向上，若dn小于等于dn-1则称向下。
  evidence_quote: 当向上时，顺次n 个包含关系的K 线组，等价于[maxdi,maxgi]的区间对应的K 线……向下时，顺次n 个包含关系的K 线组，等价于[mindi,mingi]的区间对应的K 线……结合律是有关本ID 这理论中最基础的，在K 线的包含关系中，当然也需要遵守，而包含关系，不符合传递律……因此在K 线包含关系的分析中，还要遵守顺序原则，就是先用第1、2 根K 线的包含关系确认新的K 线，然后用新的K 线去和第三根比，如果有包含关系，继续用包含关系的法则结合成新的K 线，如果没有，就按正常K 线去处理。
  interpretation: 62课合并规则的数学化版本，消除多根连续包含时的歧义：顺序合并是唯一能保证结果一致的处理次序。向上向下的几何定义使包含方向的判断摆脱看图感觉，整个分型识别由此可按统一标准得到唯一答案。
