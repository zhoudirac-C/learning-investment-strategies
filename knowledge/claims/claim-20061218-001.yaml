  subject: 走势分解定理
  topic: 任何走势可分解为同级别三种走势类型的连接，任何走势类型至少由三段次级别构成
  statement: 缠中说禅走势分解定理一：任何级别的任何走势，都可以分解成同级别盘整、下跌与上涨三种走势类型的连接。缠中说禅走势分解定理二：任何级别的任何走势类型，都至少由三段以上次级别走势类型构成。由原理定理可继续证明缠中说禅买卖点定律一：任何级别的第二类买卖点都由次级别相应走势的第一类买点构成；以及缠中说禅趋势转折定律：任何级别的上涨转折都是由某级别的第一类卖点构成的，任何的下跌转折都是由某级别的第一类买点构成的（这里只说某级别而不一定是次级别，因为存在不同级别同步共振出现第一类买卖点的情况）。
  evidence_quote: “缠中说禅走势分解定理一”：任何级别的任何走势，都可以分解成同级别“盘整”、 “下跌”与“上涨”三种走势类型的连接。“缠中说禅走势分解定理二”：任何级别的任何走势类型，都至少由三段以上次级别走势类型构成。
  interpretation: 分解定理把全部走势图还原为同级别三类型的连接与次级别三段的嵌套，使任何走势图都可被无歧义地拆解。趋势转折定律把第14课的买点定律推广到买卖点两侧，并预留了多级别共振的口子。课中驰宏锌锗与580991的对比是级别判别的历史案例。
