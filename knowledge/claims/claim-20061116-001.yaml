  subject: 中线持股与抛出纪律
  topic: 三十天线不破就拿着，抛出看加速与背弛两种情形
  statement: 中线持股纪律：一只股票涨起来千万别随意抛，中线只要连三十天线都没跌破，就证明走势很强，要拿着；高位抛掉的，只要中线图形没走坏，回档时一定要买回来，特别是没出现加速的股票。抛出原则分两种情形：一、缓慢推升型，一旦出现加速上涨，就要时刻注意出货的机会；二、第一波就火爆上涨型，调整后第二波上涨一旦出现背弛或放巨量的，一定要小心找机会走人。此外，对抛弃的股票一定不能有感情。
  evidence_quote: 一只股票长起来千万别随意抛了，中线如果连三十天线都没跌破，证明走势很强，就要拿着……有一个抛股票的原则，分两种情况，一种是缓慢推升的，一旦出现加速上涨，就要时刻注意出货的机会；另一种是第一波就火暴上涨，调整后第二波的上涨一旦出现背弛或放巨量的，一定要小心，找机会走人……对抛弃的股票一定不能有感情，股票就像男人，玩过就扔，千万别有感情。
  interpretation: 给出持有到卖出的完整闭环：三十天线做持有过滤器，加速、背弛、放巨量做卖出触发器。背弛与缠绕的配合在第12课被细化为第一、二卖点，本课是其经验版。作者明言火候问题没法教，只能在实践中体会。
