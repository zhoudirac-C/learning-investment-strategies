  subject: 走势分解的规范与选择
  topic: 分解必须符合结合律规范，并选当下有明确操作意义的分解
  statement: 分解图形有一条必须知道的原则：两个同级别中枢之间必须有次级别的走势连接，缺了连接的分解不被允许；但三个次级别走势扩展成高一级别中枢的情况不同，允许三者相加而之间没有次级别连接。走势分解存在多样性，采取哪种分解都可以，但对具体操作一定要选择当下有明确意义的分解，例如是中枢震荡的、或有第三类买卖点的；所有分解必须符合分解原则，否则就乱套了。多种分解不是麻烦，反而是相互印证的好办法。
  evidence_quote: 两个同级别中枢之间必须有次级别的走势连接……对于具体操作，一定要选择当下有明确意义的分解，例如是中枢震荡的，或有第三类买卖点的，但一定要注意，所有的分解必须符合分解的原则，否则就乱套了……但多种分解，其实并不是什么麻烦事，反而是相互印证的好办法。
  interpretation: 分解多样性是结合律允许的合法重组而非随意性，操作导向的选择标准让走势在能给出明确买卖点与震荡区间的分解下展开，这是多义性转化为可操作性的关键。
