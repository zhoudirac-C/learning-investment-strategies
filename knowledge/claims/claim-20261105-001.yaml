subject: 放量缩量反弹的市场逻辑
timeframe: short-term
statement: 越缩量，越低开，觉得反弹不能持续的人越多，市场反而容易上涨得越快；越放量，越冲高，觉得反弹能持续的人越多，市场反而容易震荡回落。反弹走势呈现放量缩量、走走停停的特征。
evidence_quote: 越缩量，越低开，觉得反弹不能持续的人越多，市场反而容易上涨的越快，因为跟风盘少，大资金可以快乐拉升。反过来，越放量，越冲高，觉得反弹能持续的人越多，市场反而容易震荡回落，因为做短线的大资金会趁着放量止盈做T，把货出给追高的散户。
interpretation: 反弹行情中，缩量反而利于上涨（跟风盘少，大资金可快乐拉升），放量则利于回落（短线资金趁机止盈出货）。投资者应关注量价关系，避免在放量冲高时追高。
