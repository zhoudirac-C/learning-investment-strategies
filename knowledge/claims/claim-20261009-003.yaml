  evidence_quote: 主要是这四项内容。首先就是买入模式……第二就是卖出模式……第三就是当下可见信号，你只记录自己卖出的那一刻能够看到的信息，不要去添加后续走势的结果。第四，去对你的这个交易进行事后评价。……模式卖出的实际收益，持股不动的潜在回撤，重新介入的新增收益，和长期多笔交易的整体收益分布才是合理的评价基准。K线的最高点它是事后的图表假象，是不可复制的交易收益。
