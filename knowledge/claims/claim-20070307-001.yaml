- id: claim-20070307-001-f
  source_path: sources/chanlun/lesson_034.md
  source_date: '2007-03-07'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 亏损与资金规模无关
  timeframe: permanent
  statement: 在股市中钱的大小根本不重要：亏损是按百分比计算的，所有资金无论从何处涨起来，在任何一个位置变成零的几率是一样的。这个几率当下存在，任何人、任何时候都不可能摆脱，这是『不患』的——即客观且不可回避的市场属性。
  evidence_quote: 在股市中，钱的大小根本不重要，亏损是按百分比的，所有的钱，无论你是从哪里涨起来的，在任何一个位置，变成0 的几率是一样的。这个几率是当下存在的，任何人、任何时候都不可能摆脱，这是“不患”的。
  interpretation: 破除大资金幻觉：规模不带来安全性，百分比风险面前人人平等。『不患』语出《论语》，缠论借指市场中不以人的意志为转移的客观结构。含义是风险管理对任何资金规模都同等重要。
