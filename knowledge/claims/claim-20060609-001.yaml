  subject: 杜绝喜好
  topic: 喜好就是死亡陷阱，买入的唯一理由是企图赢钱
  statement: 在市场中生存的第一条是杜绝一切喜好：市场的诱惑永远通过你的喜好陷你于死亡。任何买入一只股票的理由，都不是因为这股票如何好，只是你企图通过买入而赢钱；能赢钱的股票就是好的，否则都是废话。对股票需要露水之缘而不是天长地久，唯一值得天长地久的只有赢钱本身。
  evidence_quote: 但你的喜好，就是你的死亡陷阱！在市场中要生存，第一条就是在市场中要杜绝一切喜好……任何让你买入一只股票的理由，并不是因为这股票如何好或被忽悠得如何好，只是你企图通过买入而赢钱，能赢钱的股票就是好的，否则都是废话。
  interpretation: 喜好包括爱上持有的股票、偏好某板块、迷信某叙事。这条纪律与第7课"对抛弃的股票一定不能有感情"、第10课"只搞能搞的而不是只搞喜欢的"构成同一纪律链，是执行买卖点的心理前提。
