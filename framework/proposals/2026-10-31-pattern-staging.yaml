  - pattern_id: volume_benchmark_levels
    name: 基准量分档框架（推升量与出货量）
    description: 当需要判断成交量是否达到「明显放量」级别时使用。核心是先用 5/10/20 日均量构建相对基准，再用黄金分割设上下轨，把量能分成推升量/出货量、正常区、凹动量、极动量四档；同一档位在上涨与下跌中的含义不同。参数为课程口径待画面校订，使用时须标注 provisional。
    trigger:
      - 需要判断某日成交量是否达到有效放量级别
      - 上涨突破或下跌破位是否需要量能确认
      - 出现长期下跌后的极低量能，需要判断是否变盘前兆
    data_requirements:
      - name: 量能序列
        channel: VOL（个股）/AMO（指数）日序列
      - name: 价格序列
        channel: 日K线（infra/data/kline_cache.db）
    steps:
      - step: 1
        name: 构建基准量
        question: 这只标的的正常量能水平是多少？
        action: 基准量 = (5日均量 + 10日均量 + 20日均量) / 3；个股用 VOL，指数用 AMO，不跨标的比较绝对量
        data:
          - 量能序列
      - step: 2
        name: 分档
        question: 当日量能落在哪个档位？
        action: 上轨 = 基准×1.382（上涨中为推升量、下跌中为出货量）；正常区 = 基准×0.618 至 ×1.382；凹动量 = 低于 ×0.618；极动量 = 低于 ×0.5。判定按收盘值，不看盘中预估
        data:
          - 量能序列
      - step: 3
        name: 结合位置解释
        question: 同一档位在当前位置意味着什么？
        action: 低位放量偏机会、高位放量偏风险；上涨初期要推升量确认、上涨中期缩量可健康；形态反推场景缩量=反推无力，上涨途中缩量=筹码稳定。低量能只下状态结论，不预判方向
        data:
          - 量能序列
          - 价格序列
    falsification:
      - 推升量出现后价格重新跌回压力区，或二次上攻仍无价格推动，突破判断失效
      - 缩量整理期间重新放量下杀，不能沿用筹码稳定的解释
      - 高位放量能持续换取价格新高，不能仅凭放量判出货
      - 低位巨量后仍持续扩大跌幅、缺少承接，不得提前认定恐慌出清
    validation:
      historical_hit_rate: pending-m1
      applicable_regime: null
      known_failures:
        - 术语「凹动量」「极动量」为语音转写音译，系数 1.382/0.618/0.5 与边界含等号与否待课件画面校订
        - 未经独立样本回测，入库后应挂 provisional
    matched_framework: technical_timing
    applicable_themes:
      - 量价关系
      - 推升量
      - 出货量
      - 基准量
