  subject: 三种基本走势的六种组合
  topic: 上涨下跌盘整组合成陷阱式反转式中继式，多头只参与其中三种
  statement: 上涨、下跌、盘整三种基本走势有六种组合，代表三类走势：陷阱式：上涨+下跌、下跌+上涨；反转式：上涨+盘整+下跌、下跌+盘整+上涨；中继式：上涨+盘整+上涨、下跌+盘整+下跌。站在多头买入角度，有买入价值的是：下跌+上涨、下跌+盘整+上涨、上涨+盘整+上涨；没有买入价值的是：上涨+下跌、上涨+盘整+下跌、下跌+盘整+下跌。在下跌走势中买入比上涨时买入少一种没价值的情况，其后唯一需躲避的风险有两个：该段跌势未尽；该段跌势虽尽但盘整后出现下一轮跌势。
  evidence_quote: 上涨、下跌、盘整三种基本走势，有六种组合可能代表着三类不同的走势：陷阱式：上涨+下跌；下跌+上涨。反转式：上涨+盘整+下跌；下跌+盘整+上涨。中继式：上涨+盘整+上涨；下跌+盘整+下跌……有买入价值的是：下跌+上涨、下跌+盘整+上涨、上涨+盘整+上涨三种。
  interpretation: 六种组合的分类把买点选择转化为排除法：用第一类买点的背驰避开风险一（跌势未尽），用其后出现盘整先减仓退出避开风险二。所有讨论默认在同级别层面展开，抛开级别谈趋势与盘整毫无意义。
