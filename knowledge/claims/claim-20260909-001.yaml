  evidence_quote: 当时的商业航天是天时地利人和的主线行情，跟现在的农业完全不是一回事，最近机构调研过很多，厄尔尼诺对A股的农业公司几乎没有影响，更何况厄尔尼诺现象已经很多年了，一年比一年严重，这个题材太老，也无法形成周期共振，村长也不允许短线炒作，该罚是会罚的，每天就几个游资和量化在里面做，这种行情没有参与的价值。
