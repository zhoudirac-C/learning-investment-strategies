- pattern_id: sector_divergence_qualify
  name: 主线与补涨分歧定性法
  description: 通过对比主线品种与补涨品种在情绪分歧日的承接强度，判断各自后续修复概率，从而决定持仓处理方向。
  applicable_themes:
  - 半导体设备
  - Micro-LED
  - 算力
  - 电力
  - 机器人
  reasoning_chain:
  - step: 1
    name: 识别情绪阶段
    question: 当前市场处于什么情绪阶段？
    UP_logic: 根据盘面整体表现定性为‘情绪分歧日’，并指出缺少情绪载体导致周期难度更高。
    evidence_sources:
    - 盘面整体表现
    - 情绪载体观察
  - step: 2
    name: 区分品种性质
    question: 所讨论的板块属于主线品种还是补涨品种？
    UP_logic: 半导体设备有景气度、订单、国产替代、产业催化、机构共识等多重支撑，属于主线；Micro-LED偏远期叙事、靠资金推动，属于主线外溢补涨。
    evidence_sources:
    - 板块基本面支撑
    - 资金推动特征
  - step: 3
    name: 对比承接强度
    question: 在分歧日，不同品种的承接强度如何？
    UP_logic: 主线品种有扎实产业逻辑和资金基础，被砸后仍有资金愿意承接；补涨品种缺乏硬支撑，遇到兑现易被集体埋掉。
    evidence_sources:
    - 历史案例（长鑫业绩发酵后走势）
    - 当日盘面承接表现
  - step: 4
    name: 结合趋势状态
    question: 该品种的趋势是否被破坏？
    UP_logic: 算力、电力趋势已破，反弹按弱修复处理；机器人和半导体趋势未破，可继续观察。
    evidence_sources:
    - 关键均线/平台位置
    - 趋势线是否有效
  - step: 5
    name: 制定操作策略
    question: 基于以上分析，如何操作？
    UP_logic: 破趋势方向不留，趋势内方向等待分歧后资金回流，主线按趋势分歧处理，补涨按外溢分支处理。
    evidence_sources:
    - 下午分时均线观察
    - 时间窗口（周四/周五兑现魔咒）
  risk_factors:
  - 下午继续走弱，趋势方向放量回落，亏钱效应扩散
  - 补涨品种缺乏硬逻辑，分歧后无资金回流
  confidence_indicators:
  - 指数和科技核心重新拉回分时均线
  - 主线品种分歧后快速修复并创新高
  source_raw:
  - sources/raw/财经/午盘：26-05-21：情绪分歧日，半导体设备洗盘与Micro-LED补涨分化.md
- pattern_id: extreme_signal_risk_evasion
  name: 极端信号叠加风险规避
  description: 通过识别多个极端信号同时出现、叙事耗尽、拥挤度极高，判断市场面临系统性回调风险，从而建议主动规避而非等待。
  applicable_themes:
  - 美股风险预警
  - A股外盘联动风险
  - 科技板块拥挤度分析
  reasoning_chain:
  - step: 1
    name: 识别极端信号
    question: 当前市场是否存在多个反常的极端信号？
    UP_logic: 列举四个美股极端信号：股市与VIX同涨、消费者信心低位与纳指新高、对冲基金仓位与动量因子历史级别、英伟达跑输半导体指数。
    evidence_sources:
    - VIX数据
    - 消费者信心指数
    - 纳指走势
    - 对冲基金仓位数据
    - 英伟达相对表现
  - step: 2
    name: 验证叙事耗尽
    question: 市场依赖的核心叙事是否已接近尾声？
    UP_logic: 以美伊协议为例，指出特朗普、鲁比奥、伊朗三方表态均不积极，市场已提前消化利好，但实际进展边际走弱。
    evidence_sources:
    - 特朗普表态
    - 鲁比奥表态
    - 伊朗表态
  - step: 3
    name: 评估拥挤度与龙头钝化
    question: 仓位是否极致拥挤？龙头股是否开始走弱？
    UP_logic: 对冲基金半导体仓位历史级别、动量因子暴露历史级别，英伟达财报亮眼但跑输板块，说明龙头钝化、资金内部分配。
    evidence_sources:
    - 对冲基金仓位数据
    - 英伟达股价与板块指数对比
  - step: 4
    name: 叠加外盘假设脆弱性
    question: 外盘乐观情绪是否建立在脆弱假设上？
    UP_logic: 外盘'AI软着陆'叙事依赖伊朗协议、油价回落、美联储转鸽三重假设，但三者均未夯实且边际走弱。
    evidence_sources:
    - 伊朗协议进展
    - 油价走势
    - 美联储官员表态
  - step: 5
    name: 综合判断风险收益比
    question: 当前风险收益比是否支持主动规避？
    UP_logic: 仓位极致拥挤+龙头钝化+叙事讲完的组合，历史上往往不需要利空触发就会踩踏，硬扛性价比低。
    evidence_sources:
    - 历史类似组合案例
    - 当前市场结构数据
  risk_factors:
  - 外盘叙事被证实（如伊朗协议超预期达成）
  - 美联储突然转鸽导致风险偏好回升
  - A股出现独立强势逻辑脱离外盘影响
  confidence_indicators:
  - 多个极端信号同时出现且相互印证
  - 拥挤度指标达到历史极值
  - 龙头股开始跑输板块
  source_raw:
  - sources/raw/财经/午盘：26-05-27：今天不能抄底，注意外盘风险.md
- pattern_id: etf_cross_hold_screening
