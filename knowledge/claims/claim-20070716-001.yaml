  subject: 缠论的当下性与客观唯一性
  topic: K线走出来才有唯一答案，当下分析与事后分析结果相同
  statement: 分型、笔、线段的定义是唯一的、有统一答案的：可以在当下或任何时候明确无误地给出唯一答案，这答案与时间无关、与人无关，是客观的、不可更改的，唯一的要求就是被分析的K线已经走出来。当下那些K线还没走出来，具体的分型就找不出来，相应的笔、线段、最低级别中枢、高级别走势类型就不可能划分出来，无从分析；而一旦当下的K线走出来，就可以当下按客观标准唯一地找出相应的分型结构，当下的分析和事后的分析结果完全一样。当下性，其实就是缠论的客观性。
  evidence_quote: 这种定义是唯一的，有统一答案的……是可以在当下或任何时候明确无误地给出唯一答案的，这答案与时间无关，与人无关，是客观的，不可更改的，唯一的要求就是被分析的K 线已经走出来……如果当下那些K 线还没走出来，那么具体的分型就找不出来，相应的笔、线段、最低级别中枢、高级别走势类型等就不可能划分出来，这样就无从分析了。而一旦当下的K 线走出来，就可以当下按客观标准唯一地找出相应的分型结构，当下的分析和事后的分析，是一样的，分析的结果也是一样的，没有任何的不同。因此，当下性，其实就是本ID 的客观性。
  interpretation: 缠论认识论核心：分析对象必须是已完成的走势，未完成的只有边界条件、没有答案，这把分析与预测严格分开。大级别图上一时找不到分型只是显微镜倍数问题，换小级别图即可分辨，与操作级别无关。
