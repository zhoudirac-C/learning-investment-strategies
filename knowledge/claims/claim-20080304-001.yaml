  subject: 第二类买点的定义与强弱
  topic: 二买是一买次级别回抽后再次探底的结束点，分最强最弱一般三种
  statement: 第二类买点就是第一类买点的次级别回抽结束后再次探底或回试的那个次级别走势的结束点，卖点情况反过来就是。其三种可能：一、最强，二买刚好构成原来下跌最后一个中枢开始的震荡走势的第三类买点，即第二、三类买点合一，一般都对应V型反转的快速回升，最有力度；二、最弱，二买跌破第一类买点即二买比一买低，这是完全可以的，一般都构成盘整背驰，后面对应顺势平台到扩张平台等不同走势；三、一般性走势，第一、二、三买点依次向上，一个比一个高。注意只有在这回升的中阴状态下才有第一、二类买点，中阴状态结束后，所有中枢震荡只存在第三类买卖点以及中枢震荡的买卖点。
  evidence_quote: 所谓第二类买点，就是第一类买点的次级别回抽结束后再次探底或回试的那个次级别走势的结束点……第二类买点刚好构成原来下跌的最后一个中枢开始的震荡走势的第三类买点，也就是第二、三类买点合一了，这是最强的走势，这情况，一般都对应V 型反转的快速回升……第二类买点跌破第一类买点，也就是第二类买点比第一类买点低，这是完全可以的，这里一般都构成盘整背驰……只有在这回升的中阴状态下才有第一、二类买点
  interpretation: 二买的三种形态给出强度排序的可判断标准，二三买合一是最强介入形态。二买可以低于一买这一点常被误解为抄底失败，实则为理论允许的盘整背驰结构。第一、二类买点只存在于中阴阶段这一限定，明确了各类买卖点的时间窗口。
