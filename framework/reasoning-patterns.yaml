  - pattern_id: mlcc_cycle_analysis_20260531
    name: MLCC周期上行推理链
    source_raw:
    - sources/raw/财经/复盘：26-05-31：科技震荡消化拥挤，被动元件全面进入周期上行.md
    key_themes:
    - MLCC
    - 被动元件
    - 电子周期品
    - 涨价题材
    - 半导体上游
    reasoning_chain:
    - step: 1
      name: 判断行情本质
      question: MLCC涨价是类似存储的大紧缺周期还是其他？
      UP_logic: AI对全球MLCC需求仅10%，高容产品挤出效应约20%，价值量、扩产难度无法类比存储，所以是外溢承接行情。
      evidence_sources:
      - AI需求占比10%
      - 挤出效应20%
      - 海外扩产情况
    - step: 2
      name: 分析需求结构
      question: 哪些领域驱动MLCC需求？
      UP_logic: AI单机用量持续上行，汽车稳步增长，光伏走弱，消费类乏力，量的改善强于价的改善。
      evidence_sources:
      - GB200/GB300/Rubin MLCC用量表
      - 汽车单车用量
      - 光伏政策变化
    - step: 3
      name: 分析供给端转移
      question: 供给端如何变化导致全品类紧缺？
      UP_logic: 产能转向高容，日韩出清中低端，中低端产能紧张，交期拉长，扩产周期6-9个月。
      evidence_sources:
      - 转产情况
      - 交期数据
      - 扩产瓶颈
    - step: 4
      name: 评估价格与库存水位
      question: 当前价格处于什么阶段？后续如何？
      UP_logic: 高容价格远低于历史峰值150-180元，中低容刚脱离亏损，全行业稼动率未突破90%，涨价初期。
      evidence_sources:
      - 价格数据
      - 稼动率水平
      - 渠道库存
    - step: 5
      name: 识别边际催化与受益方向
      question: 最新事件强化逻辑？哪些环节受益？
      UP_logic: 日厂三度转产、近30种料号缺货、太阳诱电全系涨价，高端承接/上游供货/弹性最大三类受益逻辑。
      evidence_sources:
      - 缺货品种
      - 原厂停止接单
      - 企业产品结构
    risk_factors:
    - AI需求不及预期
    - 海外扩产快于预期
    - 国内厂商技术突破慢于预期
    - 涨价不持续被证伪
    confidence_indicators:
