interpretation: "UP首次系统化阐述'钝化→结构→操作'的完整链路。钝化=风险信号（观察），结构形成=执行信号（减仓），钝化消失=纠错信号（买回）。同时确立了级别权重原则：大周期（周线/月线）的判断优先于小周期（60/90/120分钟）。这是UP技术分析操作纪律的核心骨架。"
