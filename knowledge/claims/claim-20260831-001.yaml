  subject: 沃什杰克逊霍尔演讲三层偏鹰信号
  timeframe: short-term
  statement: 据财联社，北京时间8月28日22时美联储主席沃什在杰克逊霍尔年会发表就任以来首次主旨演讲《我们所处的时代》，释放鲜明谨慎偏鹰信号，核心三层：美国经济与劳动力市场依然具有韧性；当前金融环境很难称得上具有明显限制性；通胀仍显著高于2%目标、若基础通胀不能清晰且足够快回落则美联储还有工作要做；政策理念上减少对前瞻指引的依赖、避免提前承诺利率路径、更多依据实时数据决策。
  evidence_quote: 核心表述有三层：美国经济与劳动力市场依然具有韧性；当前金融环境很难称得上具有明显限制性；通胀仍显著高于2%目标，若基础通胀不能清晰且足够快地回落，美联储还有工作要做。
  interpretation: 8/30复盘已给定性（偏鹰），本次是内容级细节：三层结构决定鹰派成色——经济韧性+金融环境非限制性=有余力紧，通胀未达标=有必要紧；反前瞻指引=数据依赖强化，后续数据波动会被放大定价。
