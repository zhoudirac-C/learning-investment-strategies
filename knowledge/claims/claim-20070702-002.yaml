  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 精度预设一致性原则
  topic: 精度是人为预设，一旦预设就必须一路保持统一
  statement: 线段划分中用的精度是人为预设的前提，没有什么必然性：可以直接取整，可以严格到小数点后两位，也可以把相差0.5点之内的看成一样。没有什么精度是十全十美的，唯一必须遵守的，就是精度一旦预设，就一定要一路保持，关键是要统一，不要变来变去。不同软件对精细的图会有数值上的细微差别，预设统一精度就是消解这种差别的办法。
  evidence_quote: 这没有什么必然性，只是预设的前提，你可以采取严格到小数后两位的精确度，但其实不同软件，对1 分钟这么精细的图，都会有数值上的细微差别，所以，所谓的精确，往往不一定就是……所有预设精度，唯一必须遵守的，就是精度一旦预设，就一定要一路保持。注意，没有什么精度是十全十美的……所以这些细节，其实问题都不大，关键是要统一，不要变来变去。
  interpretation: 几何化体系对输入数据噪声的处理方案：标准可任意但必须一致。这一原则可推广到所有需要阈值的交易规则，阈值取值不如阈值稳定重要。
