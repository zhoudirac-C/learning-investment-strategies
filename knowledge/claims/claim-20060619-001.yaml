  subject: 介入模式的当下性
  topic: 真正的理性是当下的实践，时刻清楚自己介入模式的状态
  statement: 真正的理性不是依据某套价值系统去预测市场，而是当下的、实践的：市场参与者首要且时刻必须清楚自己目前介入模式的当下状态——用什么模式介入、这个模式现在处于什么阶段。任何介入模式都有生死周期，关键不是模式本身如何，而是模式如何被当下着、如何死去。市场中绝大多数人不知道自己在干什么，这与资金实力无关，大资金死起来更快。
  evidence_quote: 但真正的理性从来都是当下的，从来都是实践的，而实践，从来都是当下的理性……对于市场的参与者来说，首要且时刻必须清楚自己目前介入模式的当下，而市场中的绝大多数人，是不知道自己在干什么的……生的，总要死去，如果自然真有什么法则，这就是唯一的法则，市场上的法则也一样。
  interpretation: 介入模式的当下性是缠论走势分类思想的哲学先声：先明确自己用什么系统介入（第8、9课的能搞标准），再时刻定位走势在该系统分类中的当下位置（第12课的中继或转折判断）。模式必死=任何买入逻辑都有失效时点，退出机制与介入同等重要。
