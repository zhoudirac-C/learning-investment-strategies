- id: claim-20260609-004-c
  statement: 商业航天当前高度关注源于四大拐点同时出现：①政策拐点（完整政策体系已形成）；②技术拐点（可回收火箭、星间激光通信等同时从0到1）；③成本拐点（可回收火箭+批量化制造，目标入轨成本200美元/公斤）；④需求拐点（通信/遥感/物联网/AI四类清晰需求）。
  subject: 商业航天-四大拐点
  claim_type: methodology
