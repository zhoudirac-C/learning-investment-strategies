  subject: 隔夜外盘——美股深度回调，加息担忧升温
  timeframe: short-term
  statement: 隔夜美股开盘上涨后转跌，标普500盘中跌逾2%，纳斯达克100一度跌逾4%，收盘有所收窄。金价跌破4300美元，比特币下探6万美元，美元指数超跌反弹接近100关口。震荡加剧的触发点是北京时间22:00美国5月成屋销售数据（年化417万套，创5个月新高），市场将其解读为加息担忧的催化剂。CME
    FedWatch显示12月加息概率约68%。做市商大幅撤走买盘导致流动性极度匮乏，是盘中2-4%夸张振幅的合理解释。科技股遭集中抛售，但消费股上涨、小盘股一度翻红、防御板块相对抗跌——资金从偏贵板块向相对便宜方向切换。本轮高位洗牌是否完全结束较难判断，韩国股市周一跌停熔断、周二涨停熔断说明市场极度敏感。
  evidence_quote: 美股开盘上涨后转跌、跌幅扩大，标普500盘中一度跌逾2%，纳斯达克100一度跌逾4%，但收盘均有所收窄。与此同时，金价跌破4300美元，比特币向下测试6万美元，油价跌破90美元，美元指数超跌反弹、再度接近100关口。
  interpretation: UP 对隔夜外盘的解读框架：①核心触发是成屋销售数据好于预期→加息担忧重燃→科技被杀估值；②盘中剧烈震荡的性质是流动性崩塌（做市商撤单）而非基本面突变；③科技被抛但消费/小盘/防御上涨，说明是轮动而非全面崩盘；④韩国股市熔断式波动说明全球市场处于极端情绪化状态。三个观察企稳的信号：美股科技巨头波动率收窄、汇率稳定、油价进一步回落。
