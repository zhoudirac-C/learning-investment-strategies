  subject: 走势中枢的区间计算
  topic: 中枢区间取前三个次级别走势类型高点最低值与低点最高值之间
  statement: 缠中说禅走势中枢的具体计算以前三个连续次级别走势类型的重叠为准：次级别的连续三个走势类型A、B、C，分别的高、低点是a1/a2、b1/b2、c1/c2，则中枢的区间就是（max(a2,b2,c2)，min(a1,b1,c1)），实际用目测就可以。注意次级别的前三个走势类型都必须是完成的才构成该级别的中枢，完成的走势类型在次级别图上很明显，用不着再看更下面级别的图。另外，趋势中的缠中说禅走势中枢之间必须绝对不存在重叠。
  evidence_quote: 具体的计算以前三个连续次级别的重叠为准，严格的公式可以这样表示：次级别的连续三个走势类型A、B、C，分别的高、低点是a1\\a2,b1\\b2,c1\\c2。则，中枢的区间就是（max（a2,b2,c2），min（a1,b1,c1））而实际上用目测就可以，不用这么复杂。
  interpretation: 给出中枢区间的严格数学表达式，使中枢从图形直觉变为可计算对象：a1、b1、c1为三个次级别走势的高点，a2、b2、c2为低点，区间下沿取三个低点的最大值，上沿取三个高点的最小值，即三段的重叠部分。趋势中前后中枢绝对不重叠是趋势成立的硬条件。
