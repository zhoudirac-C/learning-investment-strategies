  subject: 本轮失衡的维持机制正在减弱
  timeframe: trend
  statement: 当前失衡的维持机制——中日海湾顺差美元回流美债与美元资产、中国政策性银行对南方国家贷款——两条都在减弱：外国官方持有美债份额在下降，中国海外贷款2016年见顶；维持机制减弱意味着对触发器更敏感。按历史规律触发器应在美国货币条件里找：美债长端收益抬升、美联储是否加息、期限溢价上行。
  evidence_quote: 维持机制那么是顺差回流，中国、日本、海湾国家的美元通过美债和美元资产回到美国，那么加上我们中国政策性的银行对南方国家的贷款，那么这两条都在减弱。外国官方持有美债的份额在下降，那么我们中国海外贷款在2016年见顶之后，整个维持机制是减弱，它意味着对于触发器会更敏感。触发器按历史规律应该在美国的货币条件，美债长端收益抬升，美联储是否加息，期限溢价上行。
  interpretation: 维持机制磨损是脆弱性累积的信号——同样的触发器在弱化的维持机制下引爆概率更高。
