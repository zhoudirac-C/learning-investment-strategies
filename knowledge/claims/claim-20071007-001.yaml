  subject: 级别与时间无关
  topic: 级别是按规则自生长的分类方法而非时间结构，不对任何时间结构有承诺
  statement: 级别本质上与时间无关，级别也不是什么时间结构，只是按照缠论的规则自生长出来的一种分类方法。而所谓的时间结构，本质上和电脑软件上的K线时间周期选择一样。一个最低级别不到的走势类型，可以生长100年不长成更高级别的，级别与时间本质上没有太大的关系。级别的关键就是缠论设计的那套规则；级别本质上不对任何时间结构有任何绝对的承诺，因为没有任何绝对的理论推导可以保证这一点，级别被破坏了就是因为被破坏了，只此而已，并不是因为有什么时间的因素结构就被破坏了。
  evidence_quote: 级别，本质上与时间无关，级别也不是什么时间结构。级别，只是按照本ID 的规则，自生长出来的一种分类方法。而所谓的时间结构，本质上和电脑软件上的K 线时间周期选择一样。一个最低级别不到的走势类型，可以生长100 年不长成更高级别的，级别与时间，本质上没有太大的关系。……级别被破坏了，就是因为被破坏了，只此而已，并不是因为有什么时间的因素、结构就被破坏了。
  interpretation: 这与第77课不同周期K线图如不同倍数显微镜、级别只和走势类型级别有关的说明互为印证。把级别当时间周期看是初学者最常见的混淆之一，本课明确二者之间没有任何绝对承诺关系。
