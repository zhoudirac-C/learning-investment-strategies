- id: claim-20070309-001-d
  source_path: sources/chanlun/lesson_035.md
  source_date: '2007-03-09'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 趋势延续与结束的判别标准
  timeframe: permanent
  statement: 依次存在N（N>2）个中枢时，只要保持第N个中枢高于第N-1个的状态就是上涨走势类型的延续，保持第N个低于第N-1个就是下跌的延续；上涨结束当且仅当第N个中枢不再高于、即等于或低于第N-1个中枢，下跌结束与此相反。
  evidence_quote: 假设依次存在着N（N>2）个中枢，只要依次保持着第N 个中枢比N-1 个高的状态，那么就是上涨走势类型的延续；依次保持着第N 个中枢比N-1
    个低的状态，就是下跌走势类型的延续。显然，根据上面的定义，在最低级别的上涨里，只要也只有出现依次第N 个中枢不再高于、即等于或低于第N-1 个的状态，才可说这最低级别的上涨结束。
  interpretation: 趋势的延续与终结有充要判别条件：看新生中枢相对前中枢的位置关系。这使趋势结束从经验判断变成严格命题——上涨只有当中枢不再上移时才被宣告结束，此前任何回调都只是延续中的波动。
