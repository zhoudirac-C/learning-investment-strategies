  timeframe: permanent
  statement: 操作框架由趋势状态决定：上升趋势无视节点；震荡趋势找止跌、做修复；下降趋势找超跌的止跌。
  evidence_quote: 先把操作框架放在最前面：上升趋势，无视节点；震荡趋势，找止跌、做修复；下降趋势，找超跌的止跌。今天这种极端调整之后，我们要回答的唯一问题是——现在处于哪一种趋势，对应做哪一种动作。
  interpretation: 该框架将市场划分为三种趋势状态并规定对应动作，强调先判断趋势类型再决定交易动作，避免在震荡或下降阶段盲目持股或追涨。
