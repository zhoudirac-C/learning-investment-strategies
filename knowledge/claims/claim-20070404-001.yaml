  subject: 不适合参与市场的十种性格
  topic: 十种性格类型作自我排查清单，严重的须先远离市场
  statement: 缠论列出十种特别不适合在市场中的类型，可作自我排查清单：一、耳朵控制大脑型，听到什么不经大脑立即由耳朵操纵手下单；二、疯狂购物型，几万元资金拥有十几甚至几十只股票，什么都想拥有；三、不受控制型，明明知道不对就是控制不住，关键时刻永远掉链子；四、永远认错型，死不改错，同样的毛病永远犯下去；五、祥林嫂型，永远哀声叹气甚至享受悲剧情调；六、赌徒型，把市场当赌场；七、股评型，市场不是用来操作是用来侃用来吹；八、入戏太深型，每个细微波动都情绪失控，开盘4小时煎熬4小时；九、偏执狂型，认死理万牛拉不回；十、赵括型，只会纸上谈兵。有这些表现不一定永远离开市场，关键是先调节过来，特别严重的必须先远离市场一段时间，彻底洗心革面才有可能改善。
  evidence_quote: 一、耳朵控制大脑型……二、疯狂购物型。这种人，最大的特点就是可能只有几万元的资金，竟然可以拥有十几甚至几十只股票……三、不受控制型……四、永远认错型。典型的永远认错，死不改错，同样的毛病，可以永远犯下去却永远改不了……九、偏执狂型。这种人，就爱认死理，万牛拉不回。偏执，对搞理论或其他事情可能影响不大，甚至有好处，但在万变的市场中，偏执狂是没有活路的。十、赵括型。市场操作，不同于纯粹的理论研究。市场就是市场，就如同战场，赵括之流同样是没有活路的。
  interpretation: 十种类型覆盖了交易失败的主要心理根源：听消息、过度分散、知行不一、不纠错、自怜、赌博心态、空谈、情绪化、偏执、脱离实战。每条都对应可自查的行为特征，比泛泛谈心态更具可操作性。
