- id: qing-2026-06-08-methodology-correct-vs-profitable-001
  topic: 操作对错与盈亏分离——赚钱≠正确，亏钱≠错误
  statement: 交易不存在确定性，赚钱的操作不一定是正确的，亏钱不赚钱的操作不一定是错误的。当前节点买老登防守是正确操作（哪怕没赚钱），追高高位AI才是错误操作。机器人赚钱只是运气好，刚好方向和资金切换方向一致。所有收益都是市场给的。
  source_path: sources/raw/财经/视频：26-06-08：美股终极决战，资金切换、外围推演与方向选择.md
  source_date: '2026-06-08'
  source_type: 视频复盘
  extracted_at: '2026-06-15'
  claim_type: methodology
  subject: 操作对错与盈亏分离——赚钱≠正确，亏钱≠错误
  timeframe: durable
  evidence_quote: 你做交易哪有确定性的东西...你选择做机器人你赚了钱就证明这个事情是个对的事情...这都是市场给的钱...你买了老登这件事情它绝对是一个正确的事情，但这个正确的事情没有赚到钱...你不能把一笔没有赚钱的对的操作去把它归结为一笔错误的亏钱的操作。
  interpretation: 这是方法论层面的核心 claim，建立了"操作正确性≠盈亏结果"的投资认知框架。正确性由方向判断和纪律决定，盈亏由市场决定。对充电用户的意义：(1) 不要因短期亏损否定正确策略；(2) 不要因短期盈利高估自己能力；(3) 心态上保持对市场的敬畏。这属于 durable rule。
