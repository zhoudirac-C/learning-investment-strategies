- id: claim-20070816-001-b
  source_path: sources/chanlun/lesson_071.md
  source_date: '2007-08-16'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 新线段形成的确认判据
  topic: 转折点首笔破坏后延伸三笔且第三笔破首笔结束位置，新线段即确认
  statement: 从转折点开始，如果第一笔就破坏了前线段，进而该笔延伸出三笔来，其中第三笔跌破（或升破）第一笔的结束位置，那么新的线段一定形成，前线段一定结束。更复杂的情况：第三笔完全在第一笔的范围内，则这三笔分不出向上还是向下，定义不了特征序列（特征序列方向与走势相反，走势没方向就无法确定元素归属），最终结果只有两种：一、最终先破了第一笔的结束位置，此时新线段显然成立，旧线段被破坏；二、最终先破第一笔的开始位置，则旧线段只被一笔破坏，接着延续原来的方向，旧线段依然延续，新线段没有出现。
  evidence_quote: 从转折点开始，如果第一笔就破坏了前线段，进而该笔延伸出三笔来，其中第三笔破点第一笔的结束位置，那么，新的线段一定形成，前线段一定结束……第三笔完全在第一笔的范围内，这样，这三笔就分不出是向上还是向下，这样也就定义不了什么特征序列……1、最终还是先破了第一笔的结束位置，这时候，新的线段显然成立，旧线段还是被破坏了；2、最终，先破第一笔的开始位置，这样，旧线段只被一笔破坏，接着就延续原来的方向，那么，显然旧线段依然延续，新线段没有出现。
  interpretation: 把线段被线段破坏落成逐笔确认流程，解决转折点附近待定状态如何收敛：待定笔只有延伸出三笔以上才谈得上新线段，此前讨论前线段特征序列的包含关系没有意义。
