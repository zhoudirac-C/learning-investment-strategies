  timeframe: intraday
  statement: 7月31日三种情形：情形A高开横住+双创90/120分钟底部结构形成→超跌反弹窗口成立，由防守转进攻，第一次回踩是介入位；情形B高开回落双创再跌但上证不创新低→最后一跌延续，继续做空性价比很低，越跌越往买方想；情形C上证跟随创新低→全部推演前提不成立，仓位必须回撤。
  evidence_quote: 情形A：高开之后能横住，权重不失守，双创90与120分钟形成明确底部结构并有量能确认。这种情况下超跌反弹的窗口成立，短期策略可由防守转为进攻。情形B：高开冲高回落，量能跟不上，双创再度杀跌但上证依然不创新低。这属于最后一跌的延续，越跌越要往买方想。情形C：上证跟随双创创新低。这是唯一需要真正警惕的情形，仓位安排必须同步回撤。
