  subject: 同级别分解的定义与唯一性
  topic: 按固定级别走势类型分解所有走势，分解唯一，操作只取上涨与盘整段
  statement: 同级别分解就是把所有走势按一固定级别的走势类型进行分解；根据缠中说禅走势分解定理，同级别分解具有唯一性，不存在任何含糊乱分解的可能。应用上，以某级别为操作标准，就把任何图形分解成一段段该级别走势类型的连接，操作中只选择其中的上涨和盘整类型而避开所有下跌类型；永远只针对一个正在完成着的同级别中枢，该中枢完成后继续关注下一个同级别中枢。在此视角下无所谓牛市熊市，该级别上涨就是牛市、否则就是熊市，可以完全不管市场实际走势如何。
  evidence_quote: 所谓同级别分解，就是把所有走势按一固定级别的走势类型进行分解。根据“缠中说禅走势分解定理”，同级别分解具有唯一性，不存在任何含糊乱分解的可能……对任何图形，都分解成一段段30 分钟走势类型的连接，操作中只选择其中的上涨和盘整类型，而避开所有下跌类型……在这种分解的视角下，市场被有效地肢解成一段段30 分钟走势类型的连接，如此分解，如此操作，如此而已。
  interpretation: 同级别分解是缠论把理论落成机械化操作的桥梁：用唯一性消除分解的主观随意，用只取上涨与盘整段把操作简化为分段连接，是后续机械程式（本课下条）与换档机制（第40课）的地基。
