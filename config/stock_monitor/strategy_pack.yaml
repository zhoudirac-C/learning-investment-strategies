market_framework:
  current_stage: |-
    7月10日00:51复盘定调：7月9日收盘120分钟底部结构已经形成，理论上一段约12个交易日的反弹有望带动大盘重新站稳上升趋势。上证指数收报4036.59点、涨1.65%，重新收复4000点整数关口；科创50全天最为强势，收涨8.41%；沪深两市合计成交约2.91万亿元，较前一交易日放量约3500亿元。恐慌抛压已显著收敛，主线资金回流信号明确；A股不再跟随外围情绪，外盘传导只反映在开盘定价，开盘后回归自身节奏。
    结构重于指数：国产算力产业链与指数、情绪形成共振，在7月9日确认成为本轮反弹的主线。国产化区分度优先级：高端AI交换机 > A芯片 > 智能网卡/DPU > 自主AI服务器整机；半导体芯片制造全产业链（晶圆制造、封测、设备及材料、洁净室）是更核心的载体。NPO光互连标准化提速（OIF 6.4T/12.8T工作组、2027年落地、谷歌1200万只订单、华为OPEN NPO项目）成为光互连方向新催化。存储涨价线再获兆易创新半年度业绩预增1099%验证。引线框架方向受益日月光先进封装报价上调与国内厂商涨价。
    7月8日回顾：沪指盘中失守4000点收报3990.24点，两市成交约2.58万亿缩量超5000亿，近4800只个股下跌进入冰点；但缩量代表主动抛压衰竭，反弹预期未被破坏。
    明日验证：①滞后资金是否进场、量能能否进一步放大 ②反弹范围能否从科技扩散至非科技 ③若仅科技独涨+量能不继，则反弹层级降级为超跌修复 ④国产算力主线内部分歧后的低吸机会。
    右侧确认之前仓位纪律优先于观点。7/9大涨后不追涨，等首次分歧（1-2日缩量回调）再评估产业链低吸机会；位置决定意义，今天这根阳线的意义要由明后两天量能来定。
  core_question: 7月10日（周四）及后市关键验证——①量能能否进一步放大（滞后资金进场）②反弹能否从科技扩散至非科技（区分第二阶段与超跌修复）③国产算力主线分歧后的低吸节点 ④NPO光互连/存储/引线框架等细分持续性 ⑤中报预告密集期业绩超预期方向
  up_quote: "7/10 00:51复盘：120分钟底部结构已经形成，理论上一段约12个交易日的反弹有望带动大盘重新站稳上升趋势。国产算力确认本轮反弹主线，科技一枝独秀。若明日滞后资金进场、量能放大且反弹扩散至非科技，则进入第二阶段；若仅科技独涨、量能不继，则按超跌修复对待，右侧确认前不因一根长阳改变仓位纪律。"
