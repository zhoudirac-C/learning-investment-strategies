  subject: 弱势行情放量等于砸盘资金变多，策略仍是等缩量等情绪回暖
  timeframe: short-term
  statement: 弱势行情下放量等于砸盘资金变多，头顶悬剑。日均成交已3万亿+，难指望进一步放量到4万亿。策略仍是等缩量、等情绪回暖、等利好落地，过程中重个股、轻指数
  evidence_quote: 弱势行情下放量=砸盘资金变多，头顶悬剑；日均成交已3万亿+，难指望进一步放量到4万亿。黄白线在10点半后被拉开，恰是东山精密跌停时点，传导至机构股引发跳水。策略仍是上周那句——等缩量、等情绪回暖、等利好落地，过程中重个股、轻指数。
  interpretation: 量能判断：①弱势放量=砸盘资金增多，不是增量入场——这是博主对弱势行情量能特征的核心判断；②3万亿+日均成交已接近上限，难到4万亿——说明当前量能水平已高，但方向是抛压而非买盘；③黄白线分离+东山精密跌停→机构股跳水——机构筹码松动是昨日指数走弱的核心原因；④策略不变：等缩量（抛压衰竭）、等情绪回暖（跌停家数下降）、等利好落地（催化确认）。重个股轻指数意味着结构性机会优先于指数贝塔。
