  claim_type: market-cycle
  subject: 美股暴跌本质——博通预期差引发的情绪冲击
  timeframe: short-term
  statement: 周五全球科技暴跌的真正原因是博通Q2 AI芯片收入指引下调（预期172亿→约200亿为下调，全年560亿未上调），而非非农数据超预期。博通一点指引下调就引发这么大的连锁反应，反证当前仅为情绪泡沫、并非实质泡沫（AI股有基本面支撑，与2000年互联网泡沫不同）。
  evidence_quote: 引起周五下跌的真正罪人是博通...管理层把下季度AI芯片收入指引调到了大约200亿美元，分析师给的预期是172亿，缺口是12亿...博通的一个资本下调就引发了整个情绪上的冲击。要去辩证地理解这件事情，这个事情它不会造成太大泡沫。
  interpretation: 博通指引下调引发的是情绪层面的连锁反应，不是AI基本面崩塌。与2000年不同——当前AI股有盈利支撑，博通事件反证市场仍在关注基本面而非纯粹炒作。
