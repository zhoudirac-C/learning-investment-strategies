  subject: 缩量调整期资金做高标抱团卡位题材
  timeframe: permanent
  statement: 每当行情缩量调整时，一般都会出现大高度的抱团票：因为缩量趋势大票做不了，但资金永不眠就会有人做这种方向，所以无论是医药、种业、金属都会出现这样的标的；而随着行情越来越好转，这类卡位题材的高标会渐渐走弱，能做就做，做不了不用强求。
  evidence_quote: 每当行情进行缩量调整的时候，一半都会出现这种大高度的抱团票，因为缩量，趋势大票做不了，但是资金永不眠就会有人出来做这种方向，所以无论是医药，种业，金属，都会出现这样的标的。……但是只要随着行情越来越好转，这一类的卡位题材的高标都会渐渐走弱，这些品种能做就做，做不了不用强求。
  interpretation: 缩量环境与高标抱团的因果机制：趋势票需要量能燃料，缩量下资金只能在无套牢盘的卡位题材上做高度。反向推论——卡位高标走弱反而是行情好转的信号（资金回流趋势票），这是一个可观察的
    Environment 指标。
