  subject: 大跌中的选股方向
  topic: 跌完涨得最快的是跌出第三类买点的股票
  statement: 跌完以后涨得最快的就是跌出第三类买点来的股票。大跌时就把眼睛放大，去找会形成第三类买点的股票，这才是股票操作真正的节奏与思维。
  evidence_quote: 而且，跌完以后涨得最快的是什么？就是跌出第三类买点来的股票……大跌，就把眼睛放大，去找会形成第三类买点的股票，这才是股票操作真正的节奏与思维。
  interpretation: 000416在2007年初的一跌形成完美的第三类买点，其后一个月100%幅度的上涨，是课文历史案例。第三类买点是次级别离开中枢后回抽不回到中枢的确认点，大跌提供的是批量筛选三买形态的窗口，把恐慌转化为选股清单。
