# BC-002 区间套多级定位（synthetic 两层：大级别=线段层 level 2，次级别=笔层 level 1）
#
# claim-20070202-001-c（课27 精确大转折点寻找程序定理）：大级别转折点可通过
#   不同级别背驰段逐级收缩范围确定 —— 先找大级别背驰段，再在次级别里找其
#   背驰段，转折点落在次级别背驰段确定的范围内。
#
# 两层结构（同一组 K 线，level 字段区分级别）：
#   level 2（大级别，笔按线段分组）：
#     A2 段 = 笔0-2（1→16，下-上-下，中值 29.65→23.65）；
#     B2 中枢 = 笔3-5（16→31），ZG=26.2 / ZD=23.9；
#     C2 段 = 笔6-8（31→46，下-上-下，中值 25.85→22.25），价格创新低。
#     面积代理 Σ|Δc|：A2 = 4.28+2.28+4.28 = 10.84；
#       C2 = 2.88+1.08+2.08 = 6.04 < A2 → 大级别背驰，C2 为大级别背驰段。
#   level 1（次级别，C2 内部的笔层 a1-b1-c1）：
#     a1 = 笔6（31→36，Σ|Δc|=2.88）；b1 = 笔7（36→41 回抽）；
#     c1 = 笔8（41→46，Σ|Δc|=2.08 < 2.88）→ 次级别背驰。
#     次级别中枢（笔6/7/8 重叠）：ZG=24.4 / ZD=22.9，idx 31→46。
#   区间套收敛：大级别背驰段 C2 的范围收缩到次级别背驰段 c1，
#     两级转折点同为 idx=46（bsp 表同 idx 两条、level 2 与 level 1 各一）。
#
# 【expect 降级说明】同 BC-001：MACD 面积无法入 expect（白名单限制），只断言
#   结构结论——双级别 zs（level 字段区分）、bi 表、两级背驰共振的一买 bsp。
#   seg 表未断言：线段层分组（A2/C2 为线段）已在 zs/bsp 的 level=2 记录中表达，
#   避免与实现特定线段划分口径过度耦合（详见 task-7c-report.md 歧义节）。
