  subject: 刺透50%阈值的原理
  timeframe: permanent
  statement: 刺透必须达到前一实体50%以上，因为实体中点是当日多空力量的平衡点与临界线：收盘站上一半，说明多方今日反击已超过空方昨日进攻力量的一半，是力量对比发生根本变化的客观证据；未过一半只说明反击不足以撼动空方，属失败反弹，不构成有效反转信号。
  evidence_quote: 为什么它一定要刺透百分之五十呢？而不是三十或七十？因为百分之五十它是一个心理的临界点。我们看任何一根K线实体的中点，那么其实就是当天多空力量的一个平衡点。……如果第二天阳线刺透到第一天阴线的百分之五十以上，也就意味着多方今天的反击力量已经超过了空方昨天的进攻力量的一半以上。这是一个力量对比已经反转的客观证据。
  interpretation: 阈值不是经验参数而是力量对比的守恒关系：50%=对方一半的攻击力被吃掉。低于50%的反弹应归入噪音，不进入交易决策。
