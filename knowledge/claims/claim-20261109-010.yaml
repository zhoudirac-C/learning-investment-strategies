timeframe: short-term
statement: 拿了一年股息收入没覆盖股价下跌，原因有四：1）不是长期稳定高股息公司（伪高股息）；2）买入时股息率就不高；3）周期性行业上升周期追高；4）没有分批导致成本过高。
evidence_quote: 我给大家列了几个，四点。第一个就是，哎，它不是一个长期稳定的高股息公司。...第二种就是买的时候股息率就不高。...第三个就是周期性行业...第四个就是没有分批，导致成本过高。
interpretation: 股息收入未覆盖股价下跌通常由四个可排查原因导致，逐一排除后即可安心持有吃息。
