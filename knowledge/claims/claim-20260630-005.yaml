  subject: 乌云盖顶定义与四条件
  timeframe: permanent
  statement: 乌云盖顶出现在上涨末段，第一根为阳线（大阳或中阳），第二根为阴线（大阴或中阴）；第二根开盘价须严格高于第一根阳线的最高价（跳空高开），收盘价须深入第一根阳线实体50%以上、但不得跌破第一根阳线的开盘价。
  evidence_quote: 就要出现在上涨的末段……第一根通常是阳线，那么可以是大阳线或者中阳线，那么第二根是阴线……第二根阴线的开盘价要高于第一根阳线的最高价……第二根阴线的收盘价要深入到第一根阳线的实体部分，但没有超过第一根阳线的一个开盘价。
  interpretation: 与刺透完全镜像：高开制造加速预期，收盘却反手盖住一半以上实体，属情绪反转的实证。
