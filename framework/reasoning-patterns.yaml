patterns:
- pattern_id: upstream_cycle
  name: 上游涨价周期分析框架
  description: 当用户询问上游周期品（MLCC、PCB、存储、硅片、ABF、有色、化工、锂电材料、稀土、钢铁、煤炭等）的涨价逻辑、周期位置、受益标的或能否介入时使用。核心关注价格变化、供需缺口、库存周期、扩产节奏。典型查询：XX涨价怎么看、周期品处于什么阶段、上游材料能不能买、被动元件/资源品机会、周期股估值。该框架通过验证涨价真实性、拆解供需驱动、对比历史周期位置、映射受益标的、判断持续性，给出周期定位与操作建议。
  trigger:
  - 上游核心品类（MLCC/PCB/存储/硅片/ABF/有色/化工/锂电材料等）出现涨价函、现货价连续上行或交期明显拉长
  - 技术升级或单机用量提升导致环节价值量跳变（BOM拆解显示增量）
  - 渠道库存低位与稼动率抬升同时出现
  - 上游板块内多只个股放量联动上涨
