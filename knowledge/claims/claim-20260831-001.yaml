  timeframe: trend
  statement: 8月28日央行与金融监管总局联合印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》共七章36条：个人住房贷款期限由最长30年延至40年；开发贷款期限由3年延至5到7年；新建住房现房销售的个人住房贷在销售备案后发放、预售的严格在项目竣工备案后发放；同日金融监管总局印发《商品住房开发贷款管理办法（试行）》等五个办法，预售项目贷期限原则不超3年、现售原则不超5年，建立开发贷主办银行制度、项目资金封闭管理；住建部等三部门《关于完善商品住房销售制度的通知》：预售单体建筑须主体结构封顶、购房资金全部存入监管账户、新出让土地项目优先现房销售。
