  extracted_at: '2026-07-18'
  subject: 输入输出无必然论
  topic: 任何投资理论都无法通过控制输入消除输的结果
  statement: 投资的结果只有输、赢两种，一切投资理论都企图通过控制某种输入把输去掉，其前提是输入与输出间存在必然的逻辑因果链条，而这种必然关系根本不存在：无论基本面、技术面、心理面、资金面，都不存在从输入到输出的必然保证。但人介入市场必然以某种理论、信念为基础，无法跳过输入直取结果，因此各种理论之间才有比较优劣的可能，好理论的判据是最终面向输赢结果。
  evidence_quote: 所有关于投资的理论把戏，都企图通过控制某种"输入"而把"输"这结果给去了。因此一切相关的理论前提就必然建立在这样一个逻辑假设之上：输入与输出间被某种必然的逻辑关系和因果链条所连接……投资领域，没有任何理论可以描述这种从"面"的输入到"里子"输出的必然关系，因为这种关系根本不存在。
  interpretation: 缠论的认识论基础：任何单一系统都是概率性的而非确定性的。由此推出两条后续结论：必须用乘法原则组合独立程序降低失败率（第9课）；任何介入都必须预设退出程序，因为输入不保证输出（第12课风险完全分类）。
