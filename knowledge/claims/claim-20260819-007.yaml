  subject: 种业情绪标的换仓魔芋股
  timeframe: intraday
  statement: 北交所种业老朋友秋乐种业(920087)30厘米涨停；康农种业(920403)25厘米时UP没追（种业做情绪标时秋乐往往冲在前面，虽然康农整体业绩更好）；退而求其次买了一致魔芋(920273)（30几万交割单可查）——魔芋兼具农产品加工和消费属性，UP把它当短线做，止盈止损、减仓做T会比较果断。
  evidence_quote: 昨天我们北交所的种子老朋友秋乐是30厘米涨停，那当时康龙也已经25厘米，我也就没有上康龙了，退而求其次是买了一只魔芋，魔芋股，这个30几万的交割单都可以查啊。因为其实往往种业在做情绪标的时候，秋乐往往是冲在前面的，虽然康龙整体的业绩会更好啊。那退而求其次是买的这个魔芋兼具的是农产品加工还有消费属性，我是把它当短线做的，止盈止损会比较果断，或者说减仓做T会比较果断。
  interpretation: UP展示了情绪题材内的标的选择逻辑（情绪龙头优先于业绩）与替代标的选择（跌出来就找相关低位属性标的），并明确短线定位与果断风控。
