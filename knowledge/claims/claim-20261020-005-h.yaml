statement: 护盘「托而不举」有两个原因：为将来的护盘保留资金（不把钱一次性花完），避免过热（防止疯牛）
evidence_quote: 不举是为什么呢，就两个原因，就第一个就是为将来的护盘保留资金。避免过热吧，对吧，避免过热
interpretation: 解释护盘为什么「不举」：一是保留弹药应对未来风险，二是防止局部牛变疯牛（拿银行举例：去年 4.7 关税后拉到 7 月底建立正反馈，之后就让它跌下来腾空间）。这为判断「护盘何时退出」提供了标尺——当正反馈建立、市场能自发走时，护盘就会退。
