  claim_type: methodology
  subject: 卖飞复盘的四类真问题
  timeframe: permanent
  statement: 卖飞后不应一律修改卖出规则；真正需要复盘的是卖出有无规则支撑、是否漏掉板块加速和相对强度等强信号、仓位是否超出承受能力，以及新信号出现后是否因固执拒绝买回，分别对应规则、判断框架、仓位和执行问题
  evidence_quote: 首先就是说这个卖出它有没有明确的规则支撑，有规则就是正常的模式，没有规则就是纯恐慌的卖出，那么对于这种卖出你才需要去改进。第二就是当时有没有被忽略的强信号，比如说板块加速，并且个股它强于指数，缩量健康，资金持续流入，对吧？……第三，是不是仓位太重导致自己提前卖出的？……第四就是说当新信号出现之后，是不是刻意的拒绝买回？
  interpretation: 复盘把表层卖飞拆成四种不同根因，避免把所有问题都误归为卖得太早。合规卖飞属于模式成本，无规则恐慌卖出才直接指向卖出规则改进。
  confidence: high
