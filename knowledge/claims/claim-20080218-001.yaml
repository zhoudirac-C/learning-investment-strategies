  subject: 走势划分的中枢优先原则
  topic: 划分必须首先保证中枢确立，再按结合律保持最完美形态
  statement: 走势划分的原则很明确：必须首先保证中枢的确立，在这前提下，可以根据结合律重新组合，使得连接中枢的走势保持最完美的形态。例如a+b+c+d+e是线段类上涨，f是类背驰后的回调，若其后f、g、h构成1分钟中枢，整个划分就可以变成a+b+c+d+e+（f+g+h），原来的线段类上涨得以保持；若回调延伸出9段，则划分中必须首先保证5分钟中枢的成立。
  evidence_quote: 换言之，划分的原则很明确，就是必须保证中枢的确立，在这前提下，可以根据结合律，使得连接中枢的走势保持最完美的形态。
  interpretation: 中枢确立优先于形态完美，是走势划分的第一优先级；结合律的运用只允许在中枢确立之后做形态优化。课中a到h的字母推演是纯结构示例，不依赖任何具体行情。
