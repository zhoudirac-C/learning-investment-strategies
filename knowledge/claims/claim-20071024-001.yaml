  subject: 趋势末段第三类卖点失效
  topic: 趋势第一个中枢的第三类买卖点是最后合适操作机会，第二个中枢后的三卖无意义
  statement: 趋势本质上就是中枢移动的延续，趋势中第一个中枢的第三类买卖点，本质上就是最后一个合适的操作机会，后面还需要操作就证明反应有大毛病。第二个中枢以后相对中枢的第三类卖点就没有什么操作意义了，反而要去看这趋势是否结束，例如跌了两个中枢以后要看是否有底背驰，那时候想的是买点不是卖点。另外，趋势背驰转折后第一个上去的线段卖点，很可能刚好形成最后一个中枢的第三类卖点，这个卖点几乎没有任何操作意义，反而要考虑下来的那个第二类买点。
  evidence_quote: 趋势，本质上就是中枢移动的延续，这种，第一个中枢的第三类买卖点，本质上就是最后一个合适的操作的机会……到第二个中枢以后，反而要去看是否这趋势要结束了……最后背驰转折后，第一个上去的线段卖点，很有可能刚好形成最后一个1 分钟中枢的第三类卖点，这时候，这个卖点，几乎没有任何的操作意义，反而是要考虑下来的那个第二类买点。很多抄底的人，经常在第一次冲起后就给震掉，然后再追高买回来，就是没搞清楚这种关系。
  interpretation: 操作含义：卖出要在趋势第一个中枢的三卖完成，之后是持仓等背驰的事；抄底时第一波段上冲后被震掉再追高，是没搞清楚转折后首个线段卖点与最后中枢三卖重合的关系。
