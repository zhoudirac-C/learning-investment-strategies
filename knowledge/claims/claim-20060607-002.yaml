  subject: 庄家神话批判
  topic: 市场没有无所不能的庄家，只有赢家和输家
  statement: 散户与庄家的二元对立是常识性谬误。被神话为能超越技术指标、基本面乃至大盘的"庄家"并不存在：所谓庄家前赴后继、尸骨堆成山，越摆庄家谱的基本在市场上混几年就尸骨无存。操作含义：不要把输赢归因于"庄家操纵"，也不要指望跟庄制胜，市场只分赢家和输家。
  evidence_quote: 庄家和散户这种二元对立……但常识往往就是共同谬误的同义词，不仅是所谓的散户，而且很多的所谓庄家，也就牺牲其中……但所谓的庄家，前赴后继，尸骨早堆成了山……市场没有什么庄家，有的只是赢家和输家！
  interpretation: 破除跟庄思维是建立独立交易系统的前提：把对手想象成无所不能的庄家，本质是把失败外包给一个虚构对象。缠论后续体系用走势结构（分类、买卖点）取代庄家叙事。
