  statement: 中美高层近期视频通话（美方追问稀土/农产品承诺落实，中方严正交涉美国经贸限制）、中美外交官员在马尼拉和华盛顿会面，双方在准备九月领导人会面；视频通话一天后FCC发布对中国产机器人和逆变器禁令、四天后传出光模块禁令消息。从技术角度看光模块理论上可制造中断/误码/供应链植入风险，但实现「大规模窃取数据、安装恶意软件」的技术链条远比主动网络设备复杂，目前也无FCC拿出中国光模块实际参与攻击的公开证据，实际出台限制的必要性比联网汽车/机器人小。个人判断光模块禁令是美方给中方施压的筹码——既然是筹码就还有谈的可能，关键在双方交换；9月有元首会晤、特朗普政府中期选举前需稳定中美关系。
