  subject: 缠中说禅买点定律
  topic: 大级别的第二类买点由次一级别相应走势的第一类买点构成
  statement: 缠中说禅买点定律：大级别的第二类买点由次一级别相应走势的第一类买点构成。例如周线上的第二类买点由日线上相应走势的第一类买点构成。有了这个定律，所有的买点都可以归结到第一类买点。该定律的实用场景：当大级别女上位后第一吻的调整不构成明显的下跌走势、第一类买点的背驰走法无法出现时，就要降低K线级别，从次级别图上寻找最佳买点。
  evidence_quote: 这里给出一个缠中说禅买点定律：大级别的第二类买点由次一级别相应走势的第一类买点构成……例如，周线上的第二类买点由日线上相应走势的第一类买点构成。有了这个缠中说禅买点定律，所有的买点都可以归结到第一类买点。
  interpretation: 这是缠论级别联立的第一条定律，解决了大级别二类买点位置模糊、难以精确把握的问题：不在本级别硬猜低点，而是到次级别找有背驰保证的一类买点。课中以贵州茅台2004年周线二买对应日线一买为历史案例演示。
