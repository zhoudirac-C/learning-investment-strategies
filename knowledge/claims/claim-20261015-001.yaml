- claim_type: sector-theme
  subject: 大金融观察逻辑：银行稳指数而券商需与成交回升同步
  timeframe: short-term
  statement: 银行稳定可缓和指数波动，券商若与成交回升同步走强才有助于确认风险偏好改善；如果只有权重护住指数而科技股、涨跌家数与短线接力持续恶化，赚钱效应仍未修复。保险资金与固收加调整科技仓位只是解释抛压的假设，不能靠盘口确定资金已出清。
  evidence_quote: 银行稳定可以缓和指数波动，券商若与成交回升同步走强，更有助于确认风险偏好改善；如果只有权重护住指数，而科技股、涨跌家数与短线接力持续恶化，赚钱效应仍未修复。保险资金与固收加产品调整科技仓位，可以作为解释抛压的假设，但仅靠盘口不能确定相关资金已经完成出清。
  interpretation: 权重护盘有效性判据：券商强度须与成交回升共振，否则是虚假稳定；「资金出清」类叙事在无盘口证据时只能作假设不作结论。
