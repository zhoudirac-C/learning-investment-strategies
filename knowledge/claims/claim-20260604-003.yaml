  text: 燃气轮机板块确定性很高，可类比上一轮牛市的锂电池，机构普遍看好且会格局，短期涨太多需要回调，回调是上车机会
  evidence_quote: 燃气轮机的话，反正你知道就是它的确定性很高的，就我知道其实很多机构都是看好这个板块...你可以类比成上一轮牛市的锂电池，就这个东西你是可以格局的...只是说短期涨太多了，它就是要回调的...就是回调的时候去上车就可以了。
  interpretation: 'UP对燃气轮机板块的定位：

