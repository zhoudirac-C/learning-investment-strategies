  subject: 赚了钱+有先手=隔日主动性
  timeframe: short-term
  statement: 尾盘拉升盈利+持有先手仓位，隔日不论涨跌都有主动性——上涨可加仓或持有，下跌可减仓或止损，不被动。
  evidence_quote: 赚了钱并且有先手，那么明天不管怎么动，都有主动性。
  interpretation: 先手优势的核心不是预测方向，而是保持操作弹性：①有浮盈→隔日低开不怕、高开可加；②有仓位→涨能持有、跌能止损；③做T或尾盘买入构建先手，是短线交易的核心纪律。
