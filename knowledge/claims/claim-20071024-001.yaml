  subject: 第二类买点介入程序
  topic: 不看背驰也能操作的稳妥办法，次级别回跌不破第一类买点就介入
  statement: 给对大级别背驰判断没信心者的稳妥程序：都在第二类买点介入，可以完全不管第二类买点形成中的背驰问题——反正第一类买点次级别上去后，次级别回跌，只要不破第一类买点的位置，就介入；之后只要后面的走势在下一个次级别不破第一个次级别上去的高点，就坚决卖掉，如果破，就拿着，等待是否出现第三类买点，出现就继续拿着，不出现就卖掉。按此程序甚至连背驰的概念都可以不管，分清楚走势类型其实就可以完美地操作了，其他概念只是如虎添翼。
  evidence_quote: 有一种稳妥的办法，给那些对大级别背驰判断没信心的，就是都在第二类买点介入……第一类买点次级别上去后，次级别回跌，只要不破第一类买点的位置，就介入。这样，只要后面的走势，在下一个次级别不破第一个次级别上去的高点，就坚决卖掉，如果破，就拿着，等待是否出现第三类买点，出现就继续拿着，不出现就卖掉。按上面的程序，你甚至连背驰的概念都可以不管，所以，分清楚走势类型，其实就可以完美地操作了。
  interpretation: 完全机械化的交易程序：介入、卖出、持有条件都用走势位置定义，不依赖任何力度判断，适合背驰判断未熟练前的过渡框架，也说明了走势类型分解本身是体系中最基础的操作依据。
