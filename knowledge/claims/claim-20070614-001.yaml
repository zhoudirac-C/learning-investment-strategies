  subject: 线段的方向与延伸规则
  topic: 线段看形态不看幅度，前后相邻两线段不可能同向，线段不存在直线走平
  statement: 是否线段关键看走出来的形态，和幅度没关系：如果任何低点比前一个高点都高，即使这情况无限延续下去也依然只是一线段。前后两线段之间不可能是同向的，同是向上或向下不可能构成两个前后相邻的线段。由于线段都至少呈现上下上或下上下，所以线段不存在一条直线走平的可能，一字涨停无论如何延续还是低于线段的级别，是最小级别的。线段划分涉及事先确认的精度，关键是统一按同一精度标准去看，按哪种精度没有实质影响。
  evidence_quote: 是否线段，关键看走出来的形态，如果任何低点比前一个高点都高，那么即使这情况无限延续下去，也依然只是一线段，这和幅度没关系。还有，前后两线段间，不可能是同向的，同是向上或向下不可能构成两个前后相邻的线段……一字涨停，无论如何延续，还是低于线段的级别，是最小级别的。
  interpretation: 三条规则合起来是线段划分的一阶逻辑：同向不分段、反向才分段、直线不算段。边界情形按统一精度处理，避免同一图上标准摇摆。
