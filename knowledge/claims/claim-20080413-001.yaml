  subject: 机械操作与远离聪明
  topic: 股市里聪明人死得最快，按完全分类的关节节奏机械操作
  statement: 股市里死掉的大半是聪明人，越聪明的死得越快；要在市场上生存，就必须远离聪明，因为你的聪明在市场面前一钱不值。机械化操作的本质是目无全牛而合其关节：市场结构已被理论彻底分解，站在理论角度不过是一堆关节，机械化操作就是逐步合于其关节的节奏，而不被全牛的繁复所影响。至于分解市场的那个标准是什么并不重要，即分类的原则并不重要，关键这分类能导致完全分类就行了。不爱聪明，不爱争论，更不爱预测，只负责挣钱。
  evidence_quote: 股市里死掉的，大半是聪明人，越聪明的，死得越快。要在市场上生存，就必须远离聪明，因为，你的聪明在市场面前一钱不值……机械化操作，就是逐步合于其关节的节奏，而不被全牛的繁复所影响。至于分解这市场的那个标准是什么并不重要，也就是分类的原则并不重要，关键这分类能导致完全分类就行了。
  interpretation: 庖丁解牛是机械化操作的心法比喻：理论完成分解后，操作者面对的不再是不可知的整个市场，而是可把握的关节节奏。分类标准本身可替换，能导致完全分类才是不可让渡的要求。
