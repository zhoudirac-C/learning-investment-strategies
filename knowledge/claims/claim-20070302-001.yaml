- id: claim-20070302-001-h
  source_path: sources/chanlun/lesson_033.md
  source_date: '2007-03-02'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 中枢合力与当下买卖力的关系
  topic: 任何走势图就是级别大小不同的中枢，已有走势的合力与当下交易的合力构成市场研究的另一角度
  timeframe: permanent
  statement: 把多义性看法推广到所有走势：任何走势图其实就是一些级别大小不同的中枢，把中枢看成不同的星球，当下位置之上的中枢产生向上的力、当下位置之下的产生向下的力，所有这些力的合力构成一个总的力量；而市场当下买卖也构成一个合力，买的是向上的力、卖的是向下的力。研究已有走势构成的当下的力与当下交易产生的力这两种力之间的关系，就构成市场研究的另一个角度。
  evidence_quote: 把这种看法推广到所有的走势中，那么任何的走势图，其实就是一些级别大小不同的中枢，把这些看成不同的星球，在当下位置上的星球对当下位置产生向上的力，当下位置下的产生向下的力，而这些所有力的合力构成一个总的力量……研究这两种力之间的关系，就构成了市场研究的另一个角度，也就是另一种释义的过程。
  interpretation: 这是把中枢结构动力学化的分析视角：历史走势留下的中枢布局形成一股现成的合力，当下资金买卖形成另一股合力，二者关系决定后续走向，是比形态划分更高阶的市场研究框架。
