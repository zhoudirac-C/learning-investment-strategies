- id: claim-20070111-001-b
  source_path: sources/chanlun/lesson_022.md
  source_date: '2007-01-11'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 组合中的流动性配置
  topic: 组合里一定要放一个稳健可随时变现的标的，资金安全是第一的
  statement: 在一个组合里，一定要放一个走势稳健、让人放心的标的，万一其他股票出现什么特殊的情况，马上变现这个去增援是能随时办到的，这样就一定不会出大乱子。市场里，安全是第一的；而对于资金的总体安全来说，一定的快速变现能力是最重要的。
  evidence_quote: 一般在一个组合里，一定要放一个这样老实巴交的面首，万一其他股票出现什么特殊的情况，马上变现这个去增援是能随时办到的，这样就一定不会出大乱子了。市场里，安全是第一的。而对于资金的总体安全来说，一定的快速变现能力是最重要的。
  interpretation: 组合管理原则：收益标的之外预留一个低波动高流动性仓位作为救火资金，功能等价于现金缓冲但以持股形式存在。这条与第13课的防护思想一致，都是先保证长期存活再谈收益。
