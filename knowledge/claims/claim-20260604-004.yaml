    subject: 磨底期选股方法论——低位+业绩+调整充分
    timeframe: trend
    statement: 磨底期核心选股法：找从5月初一路下跌、在6月2日低点企稳、有业绩支撑的低位标的；打开一季报看毛利/净利/收入；强势科技股做20日线/七轨布林线二轨接，跌破就走
    evidence_quote: |
      磨底期你就选那种从5月开头就一路下跌，并且在6月2号那个低点接住的那些票。 二轨接一波跌穿二轨，你直接走就行了。 你去找那种相对低位的，你就拿住就好了。不要瞎操作。
    interpretation: |
      两个层次的操作方法：①非科技方向（低位有业绩）：找5月初至今一路下跌+6/2低点企稳的标的， 拿住不动。②科技方向（有利润垫的人）：用七轨布林线二轨（MID+1×DEV）做强势股回调介入， 接不住立即清仓。UP强调"没利润垫的人不要碰科技"。
