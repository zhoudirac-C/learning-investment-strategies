  subject: 线段的基本性质
  topic: 线段至少三笔且笔数为单数，开始三笔必须有重合，必须被反方向线段破坏才算完成
  statement: 线段划分的基本原则：一、线段必须至少有三笔，由此推出线段中包含笔的数目都是单数；二、线段开始的那三笔必须有重合，开始三笔没有重合的构不成线段；三、和笔一样，线段不可能从一个顶开始结束于一个顶，或者从一个底开始结束于一个底，两端分型的性质必相反；四、线段必须被线段所破坏才能确定其完成，且必须不能是被同一性质的线段所破坏，从向上一笔开始的线段必然是被从向下一笔开始的线段所破坏。
  evidence_quote: 线段划分的最基本原则，就是线段必须至少有三笔，这是十分显然的……由此可见，线段中包含笔的数目，都是单数的。……而且，线段开始的那三笔，必须有重合，开始三笔没有重合的，是构不成线段的。……另外，线段必须被线段所破坏才能确定其完成……再者，线段被线段破坏，必须不能是被同一性质的线段所破坏，也就是从向上一笔开始的线段不可能被向上一笔的线段所有破坏，必然是被从向下一笔开始的线段所破坏。
  interpretation: 单数笔与反向破坏两条都可由定义直接推出，作者借此示范缠论的推导方式。第二种破坏情况中第二特征序列不再分第一二种情况，是为避免一串线段不断收敛后倒推的操作性简化，作者明言数学上绝对完美但操作太麻烦且该特殊情况很少见。
