- id: claim-20260604-003-e
  topic: 人民币升值利空海外业务公司
  text: 人民币强势对海外业务占比高的公司是利空（收美元换人民币变少），应尽量配置国内业务为主的公司
  evidence_quote: 人民币如果是比较强势的话，因为你像一些公司，它的产品卖到海外去的话，它收的是美元...那如果人民币很强势的话，那是不是它收的美元换成人民币就变少了，那是不是就是利空？...尽量的话就是买一些这个人民币这个业务，就是国内的业务为主的这些公司。
  interpretation: 'UP对汇率影响的板块配置思路：

    1. 人民币强势→海外业务公司（收美元）利润承压

    2. 典型利空标的：拓维信息、网宿科技（海外业务多）

    3. 配置方向转向：国内业务为主的公司

    4. 举例：金风科技（风电国内为主）、润泽科技（AIDC国内为主）

    5. 属于中期配置逻辑，非单日交易信号

    '
