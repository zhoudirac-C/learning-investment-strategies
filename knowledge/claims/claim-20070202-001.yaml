  subject: 盘整背驰的技术意义
  topic: 第一个中枢的背驰只是盘整背驰，二三类买点多由其构成，大级别盘整背驰对应历史性底部
  statement: 如果在第一个中枢就出现背驰，那不是真正意义上的背驰，只能算盘整背驰，其技术含义是一个企图脱离中枢的运动因力度不够被阻止而回到中枢里。小级别的盘整背驰意义不大且必须结合位置，高位风险更大；但多数第二、三类买点其实都由盘整背驰构成，而第一类买点多数由趋势的背驰构成。盘整背驰最有用的是用在大级别上，特别是至少周线级别以上，所发现的往往就是历史性的大底部，构成一种类似第一类买点的买点，因为超大级别里绝大多数股票其实是一个盘整。补充定义：某级别的某类型走势如果构成背驰或盘整背驰，就把这段走势类型称为该级别的背驰段。
  evidence_quote: 如果在第一个中枢就出现背驰，那不会是真正意义上的背驰，只能算是盘整背驰……因为多数的第二、三类买点，其实都是由盘整背驰构成的，而第一类买点，多数由趋势的背驰构成……盘整背驰最有用的，就是用在大级别上，特别是至少周线级别以上的，这种盘整背驰所发现的，往往就是历史性的大底部。
  interpretation: 盘整背驰比较的是两个走势类型之间的力度，两个盘整也可以比较。判断可配合MACD：回抽0轴的黄白线再次下跌不创新低，或柱子面积明显小于前一段，两者满足其一即是背弛信号。万科季线图1993至2005年三段走势构成历史大底是文中所用案例。
