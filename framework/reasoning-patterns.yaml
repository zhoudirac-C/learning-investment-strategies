    reasoning_chain:
    - step: 1
      name: 定位情绪周期位置
      question: 当前市场处于什么周期阶段？
      UP_logic: 上周日线高9后进入高10区间，情绪指数在80附近震荡，历史11连阳后无12连阳，判断处于高位风险区。
      evidence_sources:
