  topic: 位置决定意义——技术分析第一原则
  statement: 同一根K线形态在不同位置有完全相反的含义。高档出现是清仓信号，低档出现（尤其连续非理性下跌后）是机会信号。判断前必须先问：这根K线出现在什么位置？位置决定意义是技术分析的前提。
  evidence_quote: 同样的一根大阴线，可以是清仓信号，也可以是机会信号，这就是我反复强调的，你位置它决定这些的意义...当你看见一根大阴线的时候，你要先问自己一个问题，这根大阴线出现在什么位置。
  interpretation: 这是UP反复强调的技术分析核心原则，贯穿整个课程。上吊线vs铁锤线、流星线vs倒装铁锤线、高档长黑vs低档长黑——都是同一形态因位置不同而含义完全相反。
