subject: 磨底时长判据与左侧禁令
timeframe: short-term
statement: U 型磨底的参考时长是 8-18 个交易日（本轮已横 6 天，时长未满）；参照系是去年 12 月筑底（两次打新低才走出 U）与 7 月急护盘（三万多亿抛压下第二只脚未创新低）。操作上严禁左侧：必须等市场底出来，在"现货未止跌、空头气势正盛"时进场接飞刀必亏
evidence_quote: 八到十，呃，十到十八个交易日……横了一二三四五六个六个交易日了，就是从那个筑底磨底走 U 的那个时长来说是还没够的……一定要去等那个市场底……现货还没止跌，你期货这边的空头气势正盛的时候就很容易涨。
interpretation: 把"抄底"从点位问题改成时长问题：磨底有最小时长（8-18 个交易日），横 6 天就说见底为时过早。两个参照案例一慢（12 月双底）一快（7
  月急护无第二只脚），说明时长取决于护盘力度而非固定值。"等市场底"的纪律表述与商品期货"现货未止跌不接飞刀"类比，强调右侧确认优先于便宜。
