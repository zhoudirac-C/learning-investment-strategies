  subject: 下午回落内因是情绪过热-韩国只是触发由头
  timeframe: intraday
  statement: 下午的回落直接触发是韩国市场持续走弱A股跟随，但内因还是昨天的情绪太高潮了（创业板涨超7%/科创50涨10.73%/超百股涨停）。外围只是给了一个由头，真正的压力来自内部过热本身，这样的强度本就不具备连续性，今天回落属于情绪的正常消化。
  evidence_quote: 下午的回落，直接触发是韩国市场持续走弱，A股跟随；但内因还是昨天的情绪太高潮了。昨天创业板指涨超7%、科创50涨10.73%、超百股涨停，这样的强度本就不具备连续性，今天出现回落属于情绪的正常消化。
  interpretation: UP对下午回落的定性：外部触发（韩国走弱）不等于根本原因。根本原因是昨天情绪过热（创业板+7%/科创50+10.73%/百股涨停）不可持续。7/22回落是情绪正常消化而非趋势反转。这与早盘（claim-20260722-006）中"连续两日放量后注意情绪过热，第三天能承接否"的判断完全一致。
