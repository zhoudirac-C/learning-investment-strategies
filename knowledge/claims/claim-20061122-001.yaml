  subject: 早泄处置纪律
  topic: 一旦出现早泄现象必须马上退出，即使其后重新走强
  statement: 甄别早泄的首要纪律是严格的资金管理：一旦出现早泄现象，必须马上退出，即使下面突然又不早泄了、又强力高潮了，也必须这样干。原因是早泄特敏感，一个偶尔因素就可能导致，重新再来要经历很长的不应期，即使之后会高潮不断也浪费了时间，而有这时间可搞的东西多了去了，世界不只有一只股票。若有一套严格的分批介入和退出程序，执行这一切会简单得多。
  evidence_quote: 首要的就是严格的资金管理，一旦出现"早泄"现象，必须马上退出，即使下面突然又不"早泄"了，又强力高潮了，也必须这样干……一个长的调整过后，即使会高潮不断，也浪费了时间，有这时间，可搞的东西多了去了，这世界又不只有一个面首、一只股票。
  interpretation: 这条纪律的本质是用机会成本思维替代翻本思维：退出不是判断该股永远不行，而是时间的机会成本不划算。与第10课"能搞是相对的，一旦机失去就会在不能搞的泥潭难以自拔"互相印证。
