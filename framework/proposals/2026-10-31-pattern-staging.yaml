  - pattern_id: rebound_second_wave_qualify
    name: 暴跌反弹性质分层框架
    description: 当市场或个股暴跌后出现快速反弹，需要判断这是超跌反抽、旧主线修复、新趋势起势还是真正二波时使用。核心是「反弹本身不证明趋势重启」：反抽快而短、修复需要核心止跌与板块联动、二波需要新高与梯队重建。本框架只做性质定性，不出仓位动作（仓位动作走 position_by_cycle）。
    trigger:
      - 暴跌后出现快速反弹或连续阳线修复
      - 老龙头大幅回撤后再度上涨，需要判断是否二波
      - 板块普跌后出现单日联动反弹
    data_requirements:
      - name: 个股日K
        channel: 日K线（infra/data/kline_cache.db）
      - name: 板块指数
        channel: THS 板块指数日K
      - name: 量能
        channel: VOL/AMO 日序列与基准量
    steps:
      - step: 1
        name: 先分层性质
        question: 这是反抽、旧线修复、新趋势还是二波？
        action: 反抽看速度与持续性（快而短、不重建原趋势）；旧线修复看核心是否止跌、板块是否联动；新趋势需要新边际催化与独立强度；二波需要新高与梯队重建
        data:
          - 个股日K
          - 板块指数
      - step: 2
        name: 检查催化与资金
        question: 有没有新增基本面催化或新增资金？
        action: 无新催化的上涨按反抽或情绪修复处理；资金驱动型行情对流动性变化高度敏感，需同步看融资余额与成交结构
        data:
          - 量能
      - step: 3
        name: 二波五条件
        question: 二波成立的证据是否齐备？
        action: 龙头突破前高、成交良性放大、板块梯队重建、回调重心稳定、新增资金持续进入；缺两项以上不认定二波
        data:
          - 个股日K
          - 板块指数
          - 量能
      - step: 4
        name: 去杠杆期特别检查
        question: 是否处于去杠杆/集中赎回阶段？
        action: 该阶段前期涨幅大、拥挤度高、融资盘多的龙头反而容易成为集中抛售出口，不能把「龙头多条命」当成不会大跌
        data:
          - 量能
    falsification:
      - 只有快速大阳线、老核心辨识度或单日板块联动，不足以确认二波
      - 反弹无法突破关键压力、重心继续下移或修复逐次变弱，退回反抽或退潮判断
      - 高位放量但价格不再新高，二波判断撤销
    validation:
      historical_hit_rate: pending-m1
      applicable_regime: null
      known_failures:
        - 二波的五项条件为定性清单，未量化权重
        - 与 position_by_cycle 分工：本框架只定性，不出仓位
    matched_framework: technical_timing
    applicable_themes:
      - 暴跌反弹
      - 二波
      - 超跌反抽
      - 老龙头
