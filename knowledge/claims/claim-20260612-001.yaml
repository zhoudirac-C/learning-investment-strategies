  subject: 全球流动性扰动三大来源与边际缓解
  timeframe: short-term
  statement: 当前全球资本市场的流动性扰动主要来自三大来源：一是非农数据带来的美元利率扰动推动资金从新兴市场回落；二是SpaceX巨型IPO产生的虹吸效应；三是A股自身长鑫、长存、宇树等大型IPO待发。但边际上波动已明显减缓，不再像此前那样集中抛售与波动放大。
  evidence_quote: 包括A股与美股在内的全球资本市场，当前都或多或少受到流动性收紧预期的影响：一是上周非农数据带来的美元利率扰动，推动资金从新兴市场回落；二是SpaceX巨型IPO产生的虹吸效应；并且A股自身后续还有长鑫、长存、宇树等多个大型IPO待发。但边际上已能明显感受到市场波动逐渐减缓，不再像此前那样一旦外部冲击出现就引发集中抛售与波动放大。
  interpretation: UP梳理了三大扰动来源，但重点在边际变化——波动在减缓。这表明市场已在逐步消化这些利空因素，极端抛售行为在减少。
