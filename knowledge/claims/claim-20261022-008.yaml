  evidence_quote: 预期属于什么？还没有实现的时候猛炒一波，然后发现可能实现不了，迅速归零，归零之后发现好像这个预期还是有，后面再来一波，反复如此……从基本面来讲，AI还没有到危机的第二个层面。第一个层面是从金融市场上杀杀泡沫……你真正出现大的危机，那一定是债务危机，连锁到产业的产能过剩、订单下滑。
