  subject: 加速票四条件：连板加速的筛选框架
  timeframe: trend
  statement: 能走出加速的票需同时满足四个条件：①图形已走成趋势结构且属于主线或强相关方向；②踩在窗口上（指数给环境+板块给方向+个股给时点）；③是板块里的最（最正宗/最强/最有预期差/最有辨识度/交易锚点）；④涨停完成新高突破（筹码结构被打开）。
  evidence_quote: 能走出加速的票，通常要同时满足几个条件：第一，图形本身已经是趋势结构，并且属于主线或强相关方向。第二，要踩在窗口上：指数给环境，板块给方向，个股给时点。第三，它必须是板块里的「最」。第四，涨停最好完成新高突破。
  interpretation: 连板不再是独立判断信号，需从趋势结构、环境窗口、板块地位、筹码突破四个维度综合评估，四者缺一则连板可能只是脉冲而非加速确认。
