  timeframe: intraday
  statement: 今日四条预案：1.持股标尺盯紧一进二晋级率（15%以上即16家及以上为健康）与首板家数是否大幅减少；2.算力材料（培育钻石、磷化铟、钨、靶材、氧化锆、钼）观察持续，鉴于近赶顶期聚焦核心龙头或新催化方向；PCB、MLCC关注资金是否回流；3.留意成交量和场外变量（停牌核查、保证金等）；4.若AI方向走弱留意电力煤炭等防御承接方向。
  evidence_quote: 总体思路：已关注方向暂定以持股为主，视高潮与回流情况再定是否取关。1.持股标尺——盯紧一进二晋级率（≥15%、即16家及以上为健康）与首板家数是否大幅减少；两项维持则赚钱效应延续。2.主线持续性——算力材料观察是否能持续，鉴于已近赶顶期，向上聚焦核心龙头、向下关注新消息催化方向；PCB、MLCC关注资金是否回流。3.量能与场外变量——留意成交能否健康放量或缩量换空间，重点警惕停牌核查、保证金等政策面与场外消息扰动。4.防御预案——若科技/算力材料走弱，留意电力、煤炭等传统防御或其他承接资金的新方向。
