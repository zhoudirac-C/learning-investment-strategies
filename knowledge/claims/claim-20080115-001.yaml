  subject: 顶分型后的分类应对
  topic: (1,1)后出现(1,0)按水平分别处理，兑现成本留利润或震荡短差
  statement: 所有问题集中在(1,0)或(-1,0)之后怎么办，这之后都有(1,1)、(-1,1)两种可能；信号绝对明确、任何人都可以唯一确定，但同一信号不同水平的人处理方法不同：一、震荡操作水平一般、胆子小、喜欢落袋为安的，一个足够周期的(1,1)后出现(1,0)，例如周的或日的，意味着已有足够获利空间，最简单作法是把成本先兑现出来，留下利润让市场自己去选择；剩下的筹码如果出现(-1,1)，那么低周期图上肯定也出现(-1,1)，在这个向下笔结束后回来的向上笔只要不创新高，就可以把剩余筹码扔掉，或直接看5周均线，只要有效跌破就走。二、震荡操作水平好的，利用(1,0)后必然出现的震荡进行短差操作，由于都是先卖后买，如果发现市场选择了(-1,1)，那么最后一次就不回补了，完全退出战斗。
  evidence_quote: 一个足够周期的（1，1）后出现（1，0），例如周的或日的，这意味着已经有足够的获利空间，这时候，最简单的作法就是把成本先兑现出来，留下利润，让市场自己去选择……利用（1，0）后必然出现的震荡进行短差操作，由于都是先卖后买，所以如果发现市场选择了（-1，1），那么最后一次就不回补了，完全退出战斗……还可以直接就看周的5 周均线，只要有效跌破就走，这可能更简单。
  interpretation: 这是把笔状态信号落地为操作程序的关键一课：同一信号不同水平不同处理，没有统一答案。用短差操作时一定要先分析这个(1,1)到(1,0)所对应的走势类型级别，具体图形上一目了然。
