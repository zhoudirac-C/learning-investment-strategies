  statement: 当前经济结构呈现实际结果中情形二与情形三的混合特征：结构层面工业、出口与高技术制造延续较强表现，需求层面消费、地产与投资同步承压，供强需弱的剪刀差进一步扩大。
  evidence_quote: '实际结果呈现出情形二与情形三的混合特征:结构层面，工业、出口与高技术制造延续较强表现;需求层面，消费、地产与投资同步承压。

