  subject: 中枢震荡的先卖后买节奏
  topic: 中枢震荡中安全做法是先卖后买形成节奏，力度可能形成第三类卖点时停止回补
  statement: 中枢震荡中安全的做法是先卖后买、形成节奏：从低位上来的筹码，当发现单边走势结束、进入较大级别震荡时，标志就是出现顶背驰或盘整背驰，这要求减磅；然后等震荡下来出现底背驰或盘整背驰再回补，这样差价才出来、成本才下降。先买后卖的唯一可能是单边时仓位不高，这其实是节奏先错了的表现。一旦震荡的力度大于前面、有可能形成第三类卖点时，一定要停止回补，等待第三类卖点引发的下跌出现买点时再介入；心里先假设一个可能的跌幅、觉得肯定跌不深是大毛病，一定要养成只看图形操作的习惯。
  evidence_quote: 注意，在中枢震荡中，安全的作法应该是先卖后买、形成节奏……其标志就是出现顶背驰或盘整背驰，这就要求减磅，然后等震荡下来，出现底背驰或盘整背驰再回补，这样差价才出来，成本才下降……一旦震荡的力度大于前面有可能形成第三类卖点时，就一定要停止回补，等待第三类卖点引发的下跌出现买点时再介入，很多人经常出问题，就是心里先假设一个可能的跌幅，觉得肯定跌不深，这都是大毛病。一定要养成只看图形操作的习惯。
  interpretation: 节奏错位的根源在仓位结构：单边满仓者进入震荡只能先卖。停止回补的触发条件是力度比较而非价格猜测，政策、心理、消息都只是分力，走势是合力的结果。
