  subject: 缩量上行非弱势信号，真正需警惕的是放量冲高
  timeframe: permanent
  statement: 缩量上行本身不是弱势信号：场内获利盘兑现意愿不强、核心筹码锁定良好，是这段行情从启动以来的一贯特征；真正需要警惕的从来不是缩量新高，而是放量冲高。但硬币另一面同样清楚：持续缩量意味着场外增量入场节奏偏缓，这种结构决定行情走不成全面性的指数牛市，只能是结构性轮动。
  evidence_quote: 缩量上行本身不是弱势信号。场内获利盘兑现意愿不强、核心筹码锁定良好，是这段行情从启动以来的一贯特征；反过来说，真正需要警惕的从来不是缩量新高，而是放量冲高。但硬币的另一面同样清楚：持续缩量意味着场外增量入场节奏偏缓，这种结构决定了行情走不成全面性的指数牛市，只能是结构性轮动。
  interpretation: UP的量能方法论：缩量新高≠弱（筹码锁定好），放量冲高才是风险；持续缩量→增量偏缓→只能是结构性轮动而非全面牛市。
