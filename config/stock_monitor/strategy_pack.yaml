market_framework:
  current_stage: |
    双创创新高/科技独强/增量入场未结束 — 6/25上证横盘震荡，双创再度大涨并双双创出新高。
    量能较昨日有所放大但午后略低于预期（上午预测3.8万亿，下午增量不足）。传统方向明显回落，唯科技股依旧独强。
    增量资金入场大概率远未结束，放量节奏越来越紧凑、量能层级越来越高。结构性行情向全面行情切换仍可期待，关键观察点在券商能否突破年线。
    小微盘日益边缘化，资金持续向科技集中。主线明确：科技业绩 + 国产替代。
  core_question: 6/26能否延续强势？——①券商是否突破年线（全面行情确认信号） ②存储链能否从原厂向利基/模组/车规继续扩散 ③被动元件/MLCC分歧后是否企稳 ④华为昇腾950/智谱催化能否持续 ⑤微盘股是否继续边缘化 ⑥海外科技（美光盘后+18%/英伟达）映射强度
  up_quote: "6/25 22:49复盘：上证横盘震荡，双创再度大涨、双双创出新高。量能较昨日有所放大，但午后略低于预期。传统方向明显回落，唯科技股依旧独强。增量资金的入场大概率远未结束。放量节奏越来越紧凑、量能层级越来越高，结构性行情转向全面行情仍可期待。结构向全面切换的关键观察点仍在券商能否突破年线、带动超跌滞涨方向。位置决定意义，右侧确认为先，不追高、等分化。"
  key_assumptions:
  - 【框架升级 6/25晚间】6/25复盘专栏新增21条claims：双创创新高验证增量资金持续入场；科技业绩+国产替代双主线确认；存储链涨价逻辑升级为结构性重估；券商突破年线=全面行情确认信号
  - 【6/25存储链三波接力】美光FY26Q3业绩大超预期（营收+346%/净利+14倍/毛利率84.9%）→引爆存储板块。扩散路径：原厂 → 利基存储补涨（兆易创新/普冉/聚辰） → 车规存储第二波（北京君正） → 模组结构性重估（万润科技） → 封测补涨
  - 【6/25被动元件/电RAM】江海股份发布涨价函覆盖铝电解/薄膜/超级电容；GB300 NVL72单柜MLCC约44万颗，Rubin Ultra NVL576预计430万颗；电容复制存储涨价路径
  - 【6/25国产算力催化】中国电信高性能服务器2026-2027集采评审出炉；华为昇腾950有望三季度上市；智谱GLM-5.2实现昇腾/平头哥/摩尔线程/寒武纪全栈国产适配
  - 【6/25上游金属】钽是AI敞口最大、上涨斜率最陡的金属。供给端非洲占全球84.1%，Rubaya矿区塌方停采
  - 【6/25光模块测试仪器】1.6T/3.2T升级使测试仪器成卡脖子环节，采样示波器市场2027年有望突破200亿元、国产化率不足20%
  - 【6/25交换芯片国产替代】2025年全球以太网交换机市场551亿美元（+31.5%），数据中心部分+53.5%；中国商用以太网交换芯片国产份额仅1.6%（盛科通信）
  - 【6/25十五五储能规划】发改委/能源局印发规划：2030年新型储能装机达3亿千瓦。AIDC数据中心配储需求上行
  - 【券商年线信号】券商已在底部走出小趋势，突破年线将带动超跌滞涨品种。当前未突破，只跟踪不埋伏
  - 【框架升级 6/21晚间】6/21复盘专栏新增17条claims：K型分化深化、三层操作框架（指数定环境/板块定方向/个股定时点）、涨价链确定性排序、科创50估值高危
  - 【CCL涨价链（独立方向）】CCL已4-5轮提价累计涨50%，满产满销卖方市场，客户订单排至2027年底，涨势延续至2027下半年。M6以上高端CCL缺货严重。技术升级路径：M7→M8→M9（Dk~3.0/Df~0.0007）。核心CCL本体：生益科技(600183)、华正新材(603186)。上游材料：东材科技(601208)PPO/PPE树脂、圣泉集团(605589)电子树脂。CCL为本轮涨价发起端（上游物料驱动），与下游PCB制造（Rubin代际升级驱动）方向独立但产业链关联。CCL方向跟踪涨价数据+供给缺口，PCB方向跟踪认证/量产节奏。
  - 【铟/磷化铟供给刚性】铟价年内涨约60%，95%以上为锌铅副产品供给刚性，磷化铟扩产撞上铟天花板。锡业股份(000960)全球铟资源第一、国内最大原生铟生产基地
  - 【光互联三重逻辑叠加】涨价×产业落地×国产替代，CPO/NPO节奏2027为拐点。保偏光纤AI需求爆发，康宁需求达产能十倍转向中国采购（长飞/亨通受益）
  - 【存储涨价逻辑延续】DDR5均价累涨288%、HDD翻倍，AI挤占成熟制程产能→通用品种涨价，高价周期或延至2028
  - 【科创50估值风险】PE约225倍、PB约9.43倍，绝对水平与历史百分位均处最高估值区间→需随时准备减仓的高Beta位置
  - 【中报炒作节奏】下周起业绩预告渐次披露、下月初密集→业绩高增方向迎来炒作高峰；8月正式报告关注度反而下降→买预期、防兑现
  - 【三层操作框架】指数定环境、板块定方向、个股定时点。位置定有效性、逻辑定方向、K线给确认
  - 【减仓信号】涨价主线一旦扩散至非AI上游纯主题品种→重估接近尾声，减仓而非加仓
  - 【陆家嘴论坛政策】科创板第五套标准扩围至AI大模型，长期制度红利，当日A股科技股暴涨
  - 【中报业绩驱动】科技内部切换，纯题材→业绩验证，存储A档（兆易创新/德明利）、PMIC（东阳光）、晶合集成
  - 【减持风险】5-6月半导体高位减持93家，大基金=计划内回收（冲击可控），董监高=危险信号（容易被埋）
  - 【视频策略】上升初期打满仓位，执行去弱留强，选股能力决定收益
  - 中证2000持续弱于全A→微盘股是广度短板。若中证2000补涨跑赢全A→全面联动信号
  - 分歧日通常是好的上车机会（诺德铜箔/风华MLCC回踩是机会不是风险）
  - 诺德股份（600110）HVLP4代铜箔订单排至2027下半年，铜箔是AI硬件中弹性最好的细分之一
  - 锂电中报高增预期（亿纬锂能超预期），蔚蓝锂芯（002245）主板可跟踪
  - 焦炭涨价右侧信号已现（潞安环能601699），6/15煤炭走弱正好给回踩机会
  invalidation_conditions:
  - 董监高减持标的出现在持仓中→立即清仓，0%容忍
  - 大基金减持标的→减半，等反弹减仓
  - 旭创市值超越茅台为极值信号，主线高位利好兑现+拥挤交易反身性风险→用K线确认管理节奏，不线性外推
  - 涨价主线扩散至非AI上游纯主题品种→重估接近尾声，减仓信号
  - 科创50估值已无安全垫，若海外半导体板块大跌或催化兑现→高度敏感，随时准备减仓
  - 中证2000持续弱于全A且连续3日收MA20下方→广度证伪、微盘破位确认，降仓至10%
  - 微盘股破位→拖累全A→拖累AI科技，需持续监控（中证2000是观测标的）
  - 情绪核心无法浮出（MLCC/铜箔冲高回落无回流）→深度不足，不加仓
  - 全A指数收阴且30分钟不能收回→防守
  - 减持93家标的集体低开低走→板块风险扩散，暂停科技方向建仓
