  subject: K线量价关系
  topic: 长黑跌破箱体的量价关系：下跌不需要放量
  statement: 长红线向上突破箱体必须放量（否则可能是假突破），但长黑线向下跌破箱体不需要放量。缩量下跌往往更危险——说明卖盘不重但完全没有人承接。放量跌破则看空一致性更强。
  evidence_quote: 长红线向上突破一定要放量，如果不放量它有可能是假突破。但是长黑它不需要，它不一定非得要放量，因为缩量的下跌它往往会更加的危险，因为这意味着整个卖盘都不重，但是没有承接。
  interpretation: 这是长红与长黑在量价关系上的不对称性。向上需要资金推动（确认有买盘），向下只需要没人接（不需要主动卖盘）。
