  claim_type: macro
  subject: 中国宽货币紧信用-融资结构从信贷转向债券股权
  timeframe: industry
  statement: 社融存量同比+7.4%，M2同比+8%，上半年人民币贷款同比少增约1.98万亿元。新增融资越来越多依靠政府债券、企业债券和股票融资，银行贷款占比持续下降，货币宽松传导遇到需求约束。货币创造模式从依赖房地产/土地/信贷转向政府债券逆周期投资和企业股权融资，银行信贷对经济景气的解释力下降。
  evidence_quote: 核心金融数据表现：社融存量同比增长7.4%，M2同比增长8%，上半年人民币贷款新增10.72万亿元，对实体经济发放人民币贷款同比少增约1.98万亿元。融资结构转变特征：新增融资越来越多地依靠政府债券、企业债券和股票融资，银行贷款在融资结构中的占比持续下降，货币宽松的传导链条遇到了明确的需求约束。货币创造模式长期转型：政府债券供给扩大提升财政政策对经济的作用，股票和股权融资市场承担更多产业升级功能，资本市场建设重要性大幅提高，银行信贷总量对经济景气的解释力持续下降。
  interpretation: UP指出中国的货币创造正在经历从信贷驱动到债券+股权驱动的结构性转型。这意味着：（1）财政政策在经济调控中的权重上升；（2）资本市场制度建设（注册制、退市等）的重要性上升；（3）银行信贷数据对判断经济景气度的参考价值下降。这是理解A股市场环境变化的重要宏观背景。
