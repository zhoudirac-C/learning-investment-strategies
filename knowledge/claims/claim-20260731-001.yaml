  statement: 今日开盘若出现科技一片红的普涨式高开，反而要警惕，因为那是情绪定价而非产业定价。外盘传导只反映在开盘的那一下，开盘之后市场回归自身节奏。低开不可怕接不住才可怕；高开不可喜，冲高之后能不能横住才是关键。
  evidence_quote: 今天开盘若出现科技一片红的普涨式高开，反而要警惕，因为那是情绪定价而非产业定价。外盘传导只反映在开盘的那一下，开盘之后市场回归自身节奏。低开不可怕，接不住才可怕；同理，高开不可喜，冲高之后能不能横住才是关键。
