- id: claim-20070702-001-b
  source_path: sources/chanlun/lesson_063.md
  source_date: '2007-07-02'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 多级别图的配合使用
  topic: 大级别图记号已完成走势类型并辅助MACD判断，先粗后细定位买点
  statement: 选定1分钟图为基本图后，5分钟、30分钟、日线等大级别图仍有两个用途：一是把已完成的低级别走势类型在大级别图上记号，帮助记忆，这样在1分钟图上只需记住最近一个未完成的1分钟走势类型；二是看MACD辅助判断时不用对太多柱子面积相加，直接看大级别的MACD图一目了然，理论上没有特别之处，只是为了方便。实际操作顺序相反：一般人面对一只股票，先从日线甚至周、月、季、年入手，用倍数小的显微镜甚至肉眼先看大概，再转用倍数大的进行精细观察，定位好符合自己操作级别的买点建仓。
  evidence_quote: 走出一个1 分钟的走势类型，已经完成了，就可以在5 分钟图上相应记号上，这样的一个好处就是帮助记忆，否则当1 分钟图上的线段成千上万时，肯定要抓狂的……另外一个好处就是看MACD 辅助判断时，不用对太多的柱子面积进行相加，可以看大级别的MACD 图，这样一目了然……一般人面对一只股票，不可能就先看1 分钟图，大概都是先从日线，甚至周、月、季、年入手，这样等于先用倍数小的显微镜，甚至是肉眼先看一下，然后在转用倍数大的，进行精细的观察。
  interpretation: 给出多级别工作的工程化流程：粗级别筛选目标、细级别精确定位、大级别图归档已完成结构并辅助力度判断。日线背驰在1分钟图上看需要把大量MACD柱子相加，不切实际，故直接看日线图MACD。
