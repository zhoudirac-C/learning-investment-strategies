  subject: 买卖结构的不对等性
  topic: 钱换筹码与筹码换钱不同构，买卖策略因此不对等
  statement: 买和卖是不对等的，相应的策略也不一样，因为买卖的前后状态不同构：买是钱换筹码，卖是筹码换钱；钱与时间无关，只要还是钱就是不变的，而筹码今天的价值与明天的不同，筹码数量不变没有意义，最终算的还是钱。由于时间的不可逆转，钱换筹码与筹码换钱这两个结构不是同构的。这道理十分简单，却是操作逻辑的基础，最基础的往往最简单。
  evidence_quote: 买和卖，是不对等的，相应的策略也是不一样的，为什么？因为买卖的前后状态是不同构的。在市场里，买是钱换筹码，卖是筹码换钱，钱是与时间无关的，1 元，今天是，明天还是，只要还是钱，就是不变的。而筹码不是……而由于时间的不可逆转，因此（钱-筹码）与（筹码-钱）这两个结构，就不是同构的。
  interpretation: 这是缠论为买之前戏卖之高潮的策略不对称性给出的结构性解释：持币无时间风险，持筹承担时间风险，所以买入过程可以复杂反复，卖出必须果断。
