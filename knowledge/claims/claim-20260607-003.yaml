  evidence_quote: 目前是一个挖黄金坑的时候，而不是全面崩盘的时候...黄金坑砸完之后后面会非常夸张，这是非常非常难得遇见的一个机会...时间节点还没到，泡沫的时间还没到，程度也不够。
  interpretation: UP判断当前处于调整进行中（正在挖坑），而非坑底已现。调整完成后AI核心资产将迎来更大行情，但抄底需等信号确认（CPI、信用利差、黄金到位）。
