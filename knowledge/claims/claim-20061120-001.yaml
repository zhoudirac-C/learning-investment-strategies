  subject: 早泄现象与市场强度
  topic: 能搞的股票还要筛掉早泄的，早泄比例与市场总体强度相关
  statement: 按萌动标准选出能搞的对象后，还要防止其早泄：确定能搞的突然变成不能搞，介入变成套牢。早泄出现的比例与市场总体强度有关：熊市中这比例至少80%以上，牛市中则小得多，大概30%。把早泄的一类筛出去是最重要也是最困难的一步，很多所谓的高手就死在这一步上。
  evidence_quote: 而接下来，就要防止其"早泄"……投资市场里，这"早泄"的比例和市场总体强度有关，在熊市中这比例至少是80%以上，而牛市中这个比例就小多了，大概就30%。无论是选一个好面首还是一个好股票，把"早泄"的一类给筛出去可是最重要也是最困难的一步，很多所谓的高手，就死在这一步上。
  interpretation: 早泄=介入后走势未能延续，是任何操作程序都必然面对的问题，第9课展开为早泄率的数学处理。推论：市场强度决定信号容错率，同样的介入信号在牛市容错约七成、熊市容错不足两成，仓位与出手频率应随市场强度调整。
