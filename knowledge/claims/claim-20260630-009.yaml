  subject: 假信号的三个识别特征
  timeframe: permanent
  statement: 假信号有三个特征：①第二根量能不足（真信号应明显放量，缩量说明反推力量不真实、只是形态欺骗）；②位置不对（真信号在长期趋势末端的关键位，假信号在反弹或下跌途中的非关键位）；③环境不配合（大盘与板块同步转向时信号极强，只有个股单独出现形态时可信度很低）。
  evidence_quote: 首先就是说第二天的量能不够，真信号它第二天的会明显的放量……假信号就是第二天缩量反推的力量不真实，那么纯粹上它会出现一个技术面的形态欺骗，其次就是位置不对。……第三就是当前市场环境不支持大盘和板块如果都在做相同方向的反转准备的话，那么这种信号是极为真实且极为强的。但如果大盘和板块没有出现任何反转的迹象，只是个股出现了形态，那么这种独立形态的一个可信度呢就会非常的低。
  interpretation: 量能、位置、环境构成三重否决：任一缺失就应把信号从「可执行」降级为「不操作」，而不是打折执行。
  confidence: high
