  subject: 光纤板块强势——康宁亚马逊催化，亨通光电创新高
  timeframe: short-term
  statement: 光纤板块今日领涨科技修复。催化：康宁因亚马逊签下数十亿美元长期光纤采购协议（用于连接美国数据中心）涨5.61%。长飞光纤、亨通光电、中天科技等市占率较高的个股相对强势，亨通光电走出新高。
  evidence_quote: 盘面上AI硬科技多方向轮动进攻，几乎每个分支都有表现，其中以光纤为代表：康宁与亚马逊的合作消息盘前对光纤板块形成支撑，长飞光纤、亨通光电、中天科技等市占率较高的个股相对强势，亨通光电更走出新高。
  interpretation: |
    光纤是今日科技修复中最强分支。逻辑链清晰：康宁+亚马逊大单→AI数据中心光纤需求指数级增长→A股上游受益。亨通光电创新高说明资金认可这个逻辑。
    
    主板光纤标的全部可交易：长飞光纤(601869)、亨通光电(600487)、中天科技(600522)。但UP整体判断修复力度不够——光纤独强不代表市场转势。
