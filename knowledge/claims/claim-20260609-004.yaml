- id: claim-20260609-004-f
  statement: 太空算力是商业航天下一个十年的核心主线，当前存在四大瓶颈：能源供应（超柔性展开太阳翼）、热管理（太空只能辐射散热，是核心制约）、抗辐射计算（宇航级芯片vs商规芯片+容错两条路线）、星间通信。大规模太空数据中心至少需要10-15年验证。
