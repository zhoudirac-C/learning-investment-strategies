- id: claim-20070307-001-d
  source_path: sources/chanlun/lesson_034.md
  source_date: '2007-03-07'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 四正的含义
  timeframe: permanent
  statement: 正闻、正见、正学、正行是在股市里终有成就的必要条件，无此四正则无有是处。『正』不是正确的意思——所谓正确不过是名言之争辩；『正』是『正是』、是当下，只有当下才是正是。要当下闻、当下见、当下学、当下行，才是正闻、正见、正学、正行。
  evidence_quote: 正闻、正见、正学、正行，无此四正，要在股市里终有成就，无有是处。正，不是正确的意思，所谓正确，不过是名言之争辩。正，是正是，是当下，只有当下，才是正是，才是这个。要当下闻、当下见、当下学、当下行，才是正闻、正见、正学、正行。
  interpretation: 缠论核心心法概念：把『正』从『观点正确』重新定义为『契合当下』。追求观点正确是语言层面的争辩，只有与当下现实合一的闻见学行才具有实践意义。这是整个缠论『当下』哲学的总纲。
  confidence: high
  status: active
  intensity: high
  supersedes: []
  contradicts: []
  supplements: []
