subject: 明日推演三情形：先等小冰点再辨修复强弱，慢回流偏好但跟随证据修正
timeframe: short-term
statement: 明天基准判断是分歧延续，早盘可能伴随小冰点，随后有修复机会，观察顺序是先看指数能否稳住，再看科技是否反抽，最后看机器人活口与消费核心能否形成合力；若负反馈继续扩散、前排放量后没有接盘，修复时间向后顺延，宁愿明天完成更充分的筹码交换再观察后天的回流；若明天较早止跌、量能明显改善且机器人前排带动板块、科技和消费都有主动响应，就应及时调整判断，跟随证据修正预期。真正判断依据是承接质量与资金持续性。明日重点跟踪三件事：成交能否回到1.5万亿附近或以上并与指数止跌配合；机器人分歧后能否保留稳定活口、回流是否得到板块响应；上海九百(600838)换手后的承接以及慈文传媒(002343)等高位负反馈是否收敛。
evidence_quote: 明天的基准判断是分歧延续，早盘可能伴随小冰点，随后有修复机会。先看负反馈释放到哪里，再看是谁带着资金回来。……偏好慢回流，是因为筹码需要消化；一旦更强的增量承接完成确认，也要跟随证据修正预期。
interpretation: UP给出明日的完整决策树：基准情形是小冰点后修复（按指数→科技→活口与消费顺序验证），负反馈扩散则顺延，提前放量修复则上修；同时给出收盘前可核对的量化跟踪清单。
