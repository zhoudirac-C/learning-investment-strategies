- pattern_id: volume_surge_fade
  name: 冲量滑落形态识别框架
  description: 当盘中预估量能与实际量能出现大幅落差、或分时量能前高后低尾盘缩量时使用，用于校正「放量攻击」类量能定性。典型场景：盘中按成交节奏外推全天成交额显著高于收盘实际值、成交额环比放大但尾盘明显缩量。该框架先量化预估与实际的偏差、再确认分时量能形态、最后修正量能定性结论，防止证据与结论脱节。
  trigger:
  - 盘中预估全天成交额与收盘实际成交额偏差超过±30%
  - 分时量能曲线前高后低、尾盘（最后30-60分钟）明显缩量
  - 成交额环比放大但量能形态为冲量滑落而非逐级放大
  source_raw:
  - framework/proposals/2026-08-17-fix-blind-shadow-merged.md
  - evals/shadow/predictions/2026-08-17.json
  - evals/shadow/attributions/2026-08-17.json
  applicable_themes:
  - 量能形态识别
  - 冲量滑落
  - 放量攻击定性校正
  - 分时量能
  - 成交额预估偏差
  - 量价配合
  data_requirements:
  - name: 盘中预估与实际成交额
    channel: 分时成交数据外推（TDX 60min / 东财 trends2）/ 盲测数据包 intraday_amount 块
  - name: 分时量能曲线形态
    channel: 分时成交数据（infra/data/intraday_amount）/ 形态字段（冲量滑落/逐级放大/平量）
  - name: 两市成交额与环比
    channel: 行情数据（两市成交额、昨日成交额）
  steps:
  - step: 1
    name: 量化预估与实际落差
    question: 盘中预估量能与收盘实际量能偏差多大？
    action: 计算盘中外推全天成交额与收盘实际成交额的偏差比例，偏差超过±30%即标记为冲量滑落候选，禁止直接输出「放量攻击」类结论
    data:
    - 盘中预估与实际成交额
  - step: 2
    name: 确认分时量能形态
    question: 量能曲线是前冲后落还是逐级放大？
    action: 检查分时量能曲线：早盘冲量后逐级回落且尾盘缩量判定为冲量滑落；逐级放大才支持放量攻击定性
    data:
    - 分时量能曲线形态
    - 两市成交额与环比
  - step: 3
    name: 修正量能定性结论
    question: 当日量能应如何定性？
    action: 冲量滑落形态下量能定性降为「早盘冲量后力竭」，结论不得使用放量攻击/主升确认类措辞；引用证据与结论冲突时必须改写结论，并留待次日量能复检
    data:
    - 分时量能曲线形态
  falsification:
  - 次日补量越过前日量级且分时逐级放大（冲量滑落定性被证伪，可重新评估放量）
  - 盘中预估口径本身失真（外推算法或数据缺失导致假落差）
  - 尾盘缩量但指数与主线核心持续新高（量能落差未影响趋势，定性权重下调）
  validation:
    historical_hit_rate: pending-m1
    applicable_regime: null
    known_failures: []
- pattern_id: volume_source_qualify
  name: 量能源头判断框架（存量换手与增量入场）
  description: 当成交额显著放大、需要判断放量性质时使用。核心问题是「量从哪来」——存量调仓（板块间换手）与增量入场的持续性含义不同：换手行情的涨幅是结果，换手方向才是信息量。典型场景：指数中阳放量但需区分是板块间迁移（如消费到科技）还是场外资金净流入。该框架通过板块资金流对照、源头定性、换手方向持续性验证，给出放量性质与持续性判断。
  trigger:
  - 两市成交额环比显著放大，需判定放量性质（存量调仓或增量入场）
  - 板块间出现资金迁移迹象（一类板块净流出与另一类净流入大体对冲）
  - 指数中阳/大涨后需评估行情持续性
  source_raw:
  - framework/proposals/2026-08-17-fix-blind-shadow-merged.md
  - evals/shadow/predictions/2026-08-17.json
  - evals/shadow/attributions/2026-08-17.json
  applicable_themes:
  - 量能源头
  - 存量调仓
  - 板块间换手
  - 增量资金
  - 板块资金流
  - 高低切
  data_requirements:
  - name: 板块资金流向
    channel: 行业/概念资金流多窗口（即时/3日/5日/10日，infra/data/fund_flow）
  - name: 两路资金分层数据
    channel: 龙虎榜机构席位统计（jgmmtj）/ 逐股席位明细
  - name: 两市成交额与环比
    channel: 行情数据（两市成交额、昨日成交额）
  steps:
  - step: 1
    name: 回答量从哪来
    question: 放量来自存量调仓还是增量入场？
    action: 对照行业与概念净流入流出：流出板块与流入板块金额大体对冲判存量调仓（换手）；多数板块同步净流入且成交额越上前日量级判增量入场
    data:
    - 板块资金流向
    - 两市成交额与环比
  - step: 2
    name: 定性持续性含义
    question: 该源头对行情持续性意味着什么？
    action: 存量调仓下涨幅是结果、换手方向才是信息量，行情持续性取决于调入方向的承接，不支持全面性主升结论；增量入场才支持趋势加速判断
    data:
    - 板块资金流向
  - step: 3
    name: 验证换手方向持续性
    question: 资金从哪搬到哪、迁移是否持续？
    action: 用多窗口资金流确认迁移方向（单日迁移不定趋势），并结合两路资金分层数据验证调入方向的买方结构
    data:
    - 板块资金流向
    - 两路资金分层数据
  falsification:
  - 板块资金流与涨跌表现矛盾（净流入板块不涨、净流出板块不跌，流向数据疑似失真）
  - 换手方向次日即反转（迁入板块次日转为净流出，迁移不可持续）
  - 板块资金流数据缺失时不输出源头定性，降级标注信息差
  validation:
    historical_hit_rate: pending-m1
    applicable_regime: null
    known_failures: []
- pattern_id: position_context_qualify
  name: 位置决定意义框架（中阳定性前先定位置）
  description: 当指数或主线出现中阳/大阳线需要定性时使用。核心原则：同样的中阳在反弹修复段与趋势加速段含义不同——修复段第一根普涨中阳是位置属性而非加速信号，右侧确认标准放在补缺回踩之后能否量价配合，不以当日量价齐升直接判主升。典型场景：反弹窗口内首根普涨中阳、市场一致预期转向乐观时的定性校正。
  trigger:
  - 指数或主线出现中阳/大阳线，需区分修复段普涨与趋势加速
  - 反弹周期中的第一根普涨中阳出现
  - 量价齐升当日市场一致预期转向乐观，需给出阶段定性
  source_raw:
  - framework/proposals/2026-08-17-fix-blind-shadow-merged.md
  - evals/shadow/predictions/2026-08-17.json
  - evals/shadow/attributions/2026-08-17.json
  applicable_themes:
  - 反弹修复段
  - 趋势加速段
  - 右侧确认
  - 补缺回踩
  - 位置定性
  - 市场阶段判断
  data_requirements:
  - name: 反弹周期位置
    channel: 指数K线+结构信号（反弹第几天、缺口与结构位）
  - name: 缺口与关键位
    channel: 指数日K缺口、前高/结构位（K线缓存）
  - name: 量价配合数据
    channel: 行情数据（成交额环比）+ 分时量能形态
  steps:
  - step: 1
    name: 先定位置再定性
    question: 这根中阳处于反弹修复段还是趋势加速段？
    action: 用反弹天数、缺口回补进度与结构位定位行情位置；修复段第一根普涨中阳按位置属性处理，不定性为加速
    data:
    - 反弹周期位置
    - 缺口与关键位
  - step: 2
    name: 设定右侧确认标准
    question: 什么条件下修复段可升级为趋势确认？
    action: 右侧确认点放在补缺回踩之后：回踩不破关键位且再度量价配合上行才算确认；当日量价齐升不构成主升判据
    data:
    - 缺口与关键位
    - 量价配合数据
  - step: 3
    name: 匹配结论与操作语义
    question: 该位置定性对应什么结论与操作语义？
    action: 修复段中阳对应修复兑现/不追高语义，加速确认后才对应持股加仓语义；阶段结论与操作建议必须一致，不得出现主升结论配获利了结操作的自相矛盾
    data:
    - 量价配合数据
  falsification:
  - 补缺回踩后量价不配合（回踩破位或反抽无量，加速证伪）
  - 不回踩直接连续放量上行越过确认位（位置定性需上修）
  - 位置定位错误（加速段误判为修复段导致过早兑现，或反之）
  validation:
    historical_hit_rate: pending-m1
    applicable_regime: null
    known_failures: []
- pattern_id: fund_flow_segmentation
  name: 两路资金分层框架（机构与游资口径分离）
  description: 当普涨日需要解读资金结构、或出现高低切明显但高位无亏钱效应一类表面矛盾信号时使用。核心原则：机构口径与游资口径分开看——普涨下机构净卖出多于净买入、买入集中在个别高景气方向（如CPO/先进封装），说明普涨由游资情绪驱动，可解释高低切与高位韧性并存。情绪指标不得合并笼统使用。
  trigger:
  - 普涨日需解读资金结构（谁在买、谁在卖）
  - 高低切明显但高位无亏钱效应等表面矛盾信号出现
  - 使用综合情绪指标前需拆分资金口径
  source_raw:
  - framework/proposals/2026-08-17-fix-blind-shadow-merged.md
  - evals/shadow/predictions/2026-08-17.json
  - evals/shadow/attributions/2026-08-17.json
  applicable_themes:
  - 两路资金
  - 机构席位
  - 游资情绪
  - 龙虎榜
  - 高低切
  - 情绪指标分层
  data_requirements:
  - name: 机构席位统计
    channel: 龙虎榜机构买卖统计（jgmmtj：机构净买额、买卖方机构数）
  - name: 逐股席位明细
    channel: 东财龙虎榜日榜+逐股前五席位（含机构专用席位）
  - name: 涨跌停与情绪指标
    channel: 东财涨停池 / KPL情绪快照
  steps:
  - step: 1
    name: 拆分两路口径
    question: 机构与游资各自在做什么？
    action: 机构口径统计净买/净卖家数与金额及买入集中方向；游资口径看涨停梯队、题材热度与封板率，两路分别成账
    data:
    - 机构席位统计
    - 逐股席位明细
    - 涨跌停与情绪指标
  - step: 2
    name: 解释表面矛盾
    question: 高低切与高位无亏钱效应为何并存？
    action: 普涨下若机构净卖出多于净买入且买入集中在个别方向，则普涨由游资情绪驱动：资金在场内轮动而非离场，可解释高低切明显但高位无亏钱效应
    data:
    - 机构席位统计
    - 涨跌停与情绪指标
  - step: 3
    name: 分层使用情绪指标
    question: 情绪判断应采用哪个口径？
    action: 机构口径定中期方向与承接、游资口径定短线情绪温度；两路背离时合并指标无效，分别表述并降低综合置信度
    data:
    - 机构席位统计
    - 涨跌停与情绪指标
  falsification:
  - 龙虎榜数据缺失或机构席位口径失真
  - 两路资金同向时仍强行分层解读（过度解读）
  - 分层结论与次日走势持续背离（口径划分失效）
  validation:
    historical_hit_rate: pending-m1
    applicable_regime: null
    known_failures: []
- pattern_id: board_break_nature
  name: 断板性质区分框架（主动换龙与外力断板）
  description: 当连板梯队出现断板、需判断情绪影响时使用。核心区分：主动换龙（资金内生性轮动、有成交未封）不杀情绪，停牌/监管等外力断板才会打断梯队并形成负反馈；情绪票的关键变量在断板性质而非业绩。该框架通过断板名单生成、性质分类、情绪影响定性三步，判断断板对梯队与情绪的冲击。
  trigger:
  - 昨日连板个股今日未封板（断板名单出现）
  - 高位情绪票断板引发情绪退潮担忧
  - 龙头切换/换龙迹象出现
  source_raw:
  - framework/proposals/2026-08-17-fix-blind-shadow-merged.md
  - evals/shadow/predictions/2026-08-17.json
  - evals/shadow/attributions/2026-08-17.json
  applicable_themes:
  - 断板性质
  - 主动换龙
  - 外力断板
  - 连板梯队
  - 短线情绪
  - 亏钱效应
  data_requirements:
  - name: 连板梯队明细
    channel: 涨停池连板梯队（连板数≥2名单）/ 昨日涨停今日表现（zt_pool_previous）
  - name: 断板名单分类
    channel: 昨板与今日涨停池差集推导（冲板未封/温和断板/大面断板/无数据）
  - name: 监管与停牌信息
    channel: 公告/资讯检索（个股名+监管/停牌/核查）
  steps:
  - step: 1
    name: 生成断板名单
    question: 昨日连板个股今日哪些断板、当日表现如何？
    action: 昨日连板名单与今日涨停池取差集得到断板名单，按当日表现标注冲板未封/温和断板/大面断板/无数据
    data:
    - 连板梯队明细
    - 断板名单分类
  - step: 2
    name: 区分断板性质
    question: 断板是资金内生性轮动还是外力打断？
    action: 有成交未封且无监管停牌信息判主动断板（换龙候选）；当日无成交/停牌或检索到监管核查信息判外力断板
    data:
    - 断板名单分类
    - 监管与停牌信息
  - step: 3
    name: 定性情绪影响
    question: 断板对梯队与情绪的冲击多大？
    action: 主动换龙不杀情绪——资金在场内换载体，情绪票关键变量在断板性质而非业绩；外力断板打断梯队、形成负反馈，下调情绪评级并警惕连锁瓦解
    data:
    - 连板梯队明细
    - 断板名单分类
  falsification:
  - 主动断板次日出现大面积亏钱效应（换龙判断证伪，按退潮处理）
  - 断板原因归类错误（监管断板误判为主动换龙）
  - 梯队高度持续下移且无新龙补位（轮动失败）
  validation:
    historical_hit_rate: pending-m1
    applicable_regime: null
    known_failures: []
- pattern_id: promotion_rate_benchmark
  name: 晋级率折算框架（首板与次日二板健康区间）
  description: 当评估连板梯队健康度、跟踪短线情绪温度时使用。核心算法：前日首板家数×约15%晋级率≈次日二板健康区间，纳入连板梯队跟踪变量；实际晋级率显著偏离基准时修正情绪判断。约15%为经验参数、待回测验证，不作定律使用。
  trigger:
  - 评估次日连板梯队健康度（二板家数预期）
  - 首板家数显著变化（激增或萎缩）
  - 实际晋级率显著偏离经验基准，需修正情绪判断
  source_raw:
  - framework/proposals/2026-08-17-fix-blind-shadow-merged.md
  - evals/shadow/predictions/2026-08-17.json
  - evals/shadow/attributions/2026-08-17.json
  applicable_themes:
  - 晋级率
  - 连板梯队
  - 首板家数
  - 短线情绪温度
  - 赚钱效应
  data_requirements:
  - name: 首板与连板家数
    channel: 涨停池/连板梯队（首板数、各高度家数）
  - name: 晋级率序列
    channel: KPL情绪快照 promotion_rate / 历史晋级率
  - name: 情绪温度辅助指标
    channel: 封板率/炸板率/涨跌家数（东财涨停池、KPL情绪快照）
  steps:
  - step: 1
    name: 折算健康区间
    question: 次日二板家数的健康区间是多少？
    action: 用前日首板家数×约15%晋级率折算次日二板健康区间，作为连板梯队跟踪基准
    data:
    - 首板与连板家数
  - step: 2
    name: 对照实际偏离
    question: 实际晋级率与基准偏离多大、方向如何？
    action: 实际晋级率显著高于基准判情绪偏热（可上修评级），显著低于基准判承接不足（下修评级或确认退潮）
    data:
    - 晋级率序列
    - 首板与连板家数
  - step: 3
    name: 修正情绪判断
    question: 偏离如何纳入情绪周期定位？
    action: 连续两日低于基准视为承接转弱信号，结合封板率与炸板率交叉验证后修正情绪判断
    data:
    - 晋级率序列
    - 情绪温度辅助指标
  falsification:
  - 约15%经验参数在当前市场状态下系统性失效（按回测重新标定，不作定律使用）
  - 首板基数过小导致折算失真（样本不足不适用）
  - 晋级率正常但梯队高度持续压缩（折算指标让位于高度信号）
  validation:
    historical_hit_rate: pending-m1
    applicable_regime: null
    known_failures: []
