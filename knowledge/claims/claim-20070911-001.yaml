  subject: 顶点与中枢震荡卖点的两个结论
  topic: 所有顶点都必然是顶分型，中枢震荡的卖点都出现在向上离开中枢时
  statement: 缠论两个最简单的结论：一、所有的顶点都必然是顶分型。由此可严格推导出：一旦出现顶分型，离开就是唯一的选择，至于顶分型后是否形成笔，那是离开后再判断的事情；形成笔则调整是大的，不形成笔则调整是小的。二、中枢震荡的卖点都是出现在向上离开中枢时；该卖点后回抽如果回不到中枢，可能形成第三类买点，但这是卖点后的事情，没有任何可能比当下的卖点更重要，而且股票的交易规则没有规定卖了就不能再买。
  evidence_quote: 一、所有的顶点都必然是顶分型。这是本ID 理论的一个最简单的结论。从这可以严格推导出什么？就是一旦出现顶分型，离开就是唯一的选择。至于顶分型后是否形成笔，那是离开后再判断的事情……二、中枢震荡的卖点都是出现在向上离开中枢时。这也是本ID 理论中最简单的结论了……没有任何可能比当下的卖点更重要。而且，股票的交易规则，没有规定卖了就不能再买。
  interpretation: 两条结论把卖从预测变成执行：卖点出现后仍有第三类买点与回抽重新介入的后续路径，卖不等于踏空。课中用2007年9月大盘周线顶分型与5分钟中枢做当下演示，指数点位仅作历史背景。
