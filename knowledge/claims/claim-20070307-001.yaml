- id: claim-20070307-001-c
  source_path: sources/chanlun/lesson_034.md
  source_date: '2007-03-07'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 初始认知决定最终命运
  timeframe: permanent
  statement: 参与者对市场的初始认知决定其最终命运：自以为高明地把股市当赌场的人，一双赌眼看股市，怎么闹都是一条赌命，其命运由最开始的所谓高明所决定。『闻见学行』是一条因果链——有如此闻，而有如此见，复有如此学，终有如此行，错误的源头认知会以各人自渎的想象把股市变成参与者的坟墓。
  evidence_quote: 例如，自以为高明地把股市当赌场，这样，一双赌眼看股市，怎么闹都是一条赌命，其命运就由其最开始的所谓高明所决定了。“闻见学行”，有如此闻，而有如此见，复有如此学，终有如此行，如此股市就以各人自渎的想象成为众多股市参与者的坟墓。
  interpretation: 认知起点决定论：进入市场前建立什么样的市场观，决定了后续全部学习与行为的走向。把市场当赌场这一『闻』，必然导出赌博式的『行』。因此端正初始认知比学习任何技巧都更优先。
