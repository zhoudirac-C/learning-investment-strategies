# B站动态 claim 提取排除清单
#
# 用途：这些动态已落盘（保留原文存档），但**不进入 claim 提取管线**。
# 场景：抽奖/福利/活动/纯生活分享等与投资无关的内容。
#
# 维护方式：
#   - 新增：在 exclude 下追加 dynamic_id
#   - 每次历史补录或大批量提取前，先跑 scripts/bilibili_filter_noise.py 检测候选
#
# 字段说明：
#   dynamic_id  动态 ID（必填）
#   up_uid      UP 的 uid
#   reason      排除原因（抽奖/福利/生活/无实质内容）
#   added       加入日期

version: 1

# ── 关键词规则（自动检测候选，需人工确认后加入下方 exclude） ──
auto_detect_keywords:
  - 抽奖
  - 开奖
  - 中奖
  - 领奖
  - 抽杯
  - 抽40
  - 抽20
  - 抽10
  - 星巴克
  - 福利
  - 中奖名单
  - 开奖时间

# 注意：标题含"抽奖"但正文为行情分析的动态**不要排除**（如卢本圆复盘的
# "一不小心成了抽奖博主"标题，正文是加息预期/科技反弹的正经分析）。
# 排除前必须人工核对正文。

# ── 人工确认的排除清单 ──
exclude:
  - dynamic_id: "1241803984494133252"
    up_uid: "550494308"
    up_name: "卢本圆复盘"
    reason: "抽奖：抽40杯星巴克，纯福利与股市无关"
    added: "2026-09-15"

  - dynamic_id: "1238558840375476233"
    up_uid: "550494308"
    up_name: "卢本圆复盘"
    reason: "福利：电影《牛来》票根报销/开奖领奖，与股市无关"
    added: "2026-09-15"
