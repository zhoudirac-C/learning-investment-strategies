  subject: 人形机器人解决长尾工位自动化
  timeframe: industry
  statement: 传统机械臂和AGV建立在精确编码和预设程序上，适合年产几十万件的标准化工序，但大量低产量、多品种、快速变化的长尾工位自动化改造成本高于人工；人形机器人（具身智能）若通过自然语言和少量示范训练适应新工位，原本重新开发整套自动化系统的工作就变成一次软件升级，商业模式从一次性交付转向可持续的软件和服务收入——这是资本市场赋予人形机器人企业远高于传统机械设备公司估值的原因，市场真正定价的是平台化的可能性。
  evidence_quote: 人形机器人要解决的问题呢是传统的自动化体系当中最昂贵的一部分，也就是说为每一个场景重新进行工程开发。如果同一套机器人能够通过自然语言和少量的示范以及少量的训练去适应新的工位和物体，那么原本需要重新开发一整套自动化系统的工作，就可以转换成为一次的软件升级。这也是为什么资本市场愿意赋予人形机器人企业远高于传统机械设备公司的一个估值的原因。因为市场真正定价的是平台化的一个可能性，而非是单纯的那种硬件的销量。
  interpretation: UP从商业模式角度解释人形机器人估值溢价的来源：软件化升级替代工程重开发，估值锚是平台而非硬件销量。
