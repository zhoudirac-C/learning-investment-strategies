# GOLD-001 金标：工商银行（sh.601398）日线第三类买点（课20 课文实例）
#
# 课文结论（课20《缠中说禅走势中枢级别扩张及第三类买卖点》，2007-01-05 发文）：
#   "例如，工商银行在12月14日构成典型的日线级别第三类买点"。12月14日 = 2006-12-14。
# claim 原文依据：
#   - claim-20070105-001-b（课20 第三类买卖点定理）：次级别走势向上离开中枢，
#     以次级别走势回试，低点不跌破 ZG，构成第三类买点；必须是第一次回试。
#
# 数据（真实，零外泄：baostock 公开源）：
#   baostock query_history_k_data_plus("sh.601398", frequency="d", adjustflag="3"（不复权）)，
#   2006-10-27（A股上市首日）~2006-12-22，共 41 根日线，显式 [o,h,l,c] 落地。
#   取数脚本 /tmp/golden_dump_daily.py（不入仓）；工行该时段无除权，不复权=实际成交口径。
#
# 数据核对（人工读图）：
#   - idx0~idx30（10-27~12-08）价格长期在 3.25~4.01 区间震荡，构成中枢区域；
#   - idx31~33（12-11~12-13）放量上行至 h=4.39，向上离开该区域；
#   - idx34 = 2006-12-14：l=4.20，为干净底分型（idx33 h/l=4.39/4.21、
#     idx35 h/l=4.34/4.26，两侧均无包含），回试低点 4.20 未跌回上述震荡区域
#     （区域上沿 ≤4.05）→ 与课文"12月14日构成日线级别第三类买点"一致；
#   - 课文未给出该中枢的精确区间（ZD/ZG），中枢存在性由三买定理蕴含，
#     但其区间数值属分析者判断 → zs 表不断言，不过度断言课文没说的细节；
#   - 课文思考题二"工商银行在12月22日构成日线级别第三类买点吗？"课文未给答案，
#     idx40（12-22）不断言。
# sure 口径：课文为回溯确认结论；12-14 之后 idx35~40 上行、未再回试，
#   底分型右侧已确认 → bsp sure=true。
#
# 断言（只断言课文有明确结论的结构）：
#   bsp: idx=34（2006-12-14），bstype=3，dir=up（买点=up），level=1，sure=true。
