  subject: 底顶与中间的操作节奏
  topic: 底顶两段按中枢震荡操作且底先买后卖，中间连接段持有
  statement: 任何走势无论怎么折腾，都逃不出这个节奏：底、顶以及连接两者的中间过程。因此在两头的操作节奏就是中枢震荡，只是底的时候要先买后卖、顶的时候要先卖后买，这样更安全点；至于中间的连接部分就是持有，对于空头走势，小板凳（空仓）就是最好的持有，一直持有到底部构造完成。有技术的按操作级别分清楚目前是三阶段中的哪一段，然后随时可以操作；亏钱都是错误操作引起的，不断反省才会有进步。
  evidence_quote: 任何走势，无论怎么折腾，都逃不出这个节奏，就是底、顶以及连接两者的中间过程，因此，在两头的操作节奏就是中枢震荡，只是底的时候要先买后卖，顶的时候要先卖后买，这样更安全点。至于中间的连接部分，就是持有，当然，对于空头走势，小板凳就是一个最好的持有，一直持有到底部构造完成。
  interpretation: 三段划分把任何行情映射到三种标准操作模式，是先定位阶段再选策略的框架。空头走势中的持有即空仓等待，明确了不操作也是操作的组成部分。
