  subject: 第三类买卖点的认定要点
  topic: 第三类买卖点必须是次级别离开加次级别反抽，针对该级别最近那个中枢
  statement: 第三类买卖点必须是次级别离开、次级别反抽，而且是针对该级别中最近那个中枢；把反抽没触及某个孤立前高点当作判定依据是不对的，那样对应的中枢就乱了。对于一些快速变动的行情，往往第三类买卖点离开的距离会很远，离开距离远不影响其认定。
  evidence_quote: 注意，第三类买卖点必须是次级别离开，次级别反抽，而且是针对该级别中最近那个中枢，而以前也曾说过，对于一些快速变动的行情，往往第三类买卖点离开的距离会很远。
  interpretation: 这条纠正把任意前高当参照的误用：第三类买卖点的参照系是最近中枢的区间而非孤立价位。快速行情中离开距离远不削弱有效性，与第54课的说明一致。
