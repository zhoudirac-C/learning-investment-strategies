  timeframe: permanent
  statement: 宏观黑天鹅（美债、日元、特朗普）用圣维南原理处理：把持仓和股票市场看作孤立系统，这些是外部源，只需把边界分析清楚即可精准操作，不需要从源头研究（否则要从太阳黑子聊起）；可以关注但不作为股票操作依据。投资信念上：错了就立正挨打，坚决不在底部更改自己的信仰和看法（《迷雾》类比——别在迷雾散开前自我了断）；在无杠杆或很低杠杆可控前提下，不因大幅回撤（担心100跌到30最后跌到5块）改变持仓坚定性。
  evidence_quote: 因为咱们是学过这个弹性力学、材料力学的这个圣维南原理，对吧，就是我把我的这个持仓或者说我把股票市场作为一个孤立的一个系统，我把这些东西作为一些外部的源，我不一定要从源头美债、日元，甚至再源头特朗普脑子里头……我只要把边界分析清楚，那可能就可以做到一个一个精准的操作了，而不是需要说研究太多事情。
  interpretation: 方法论自洽声明：宏观噪声按边界条件处理；信念管理的前提是杠杆可控——无杠杆才扛得住'不改信仰'。
