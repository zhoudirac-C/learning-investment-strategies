  subject: 走势的自相似性本质
  topic: 分型与走势类型的本质是自相似性，源于人的贪嗔痴疑慢，级别由自相似性自组生长
  statement: 分型、走势类型的本质就是自相似性，走势必完美的本质也就是自相似性。其哲学基础是人的贪嗔痴疑慢：人的贪嗔痴疑慢都是一样的，只是跟随时间、环境大小不一，所以显示出自相似性，而走势是所有人贪嗔痴疑慢的合力结果，反映在走势中就使走势显示出自相似性。正因为走势具有自相似性，走势才是可理解的、才是可把握的，把握走势本质上就是把握其自相似性。自相似性最重要的特点是可以自组出级别：级别是自相似性自组出来、生长出来的，自相似性如同基因，走势如同有生命般自动生长出不同的级别，只要构成走势的人的贪嗔痴疑不改变，自相似性就存在，级别的自组性就必然存在。
  evidence_quote: 分型、走势类型的本质就是自相似性，同样，走势必完美的本质也就是自相似性……因为人的贪嗔痴疑慢都是一样的，只是跟随时间、环境大小不一，所以，就显示出自相似性。而走势是所有人贪嗔痴疑的合力结果，反映在走势中，就使得走势显示出自相似性。……正因为走势具有自相似性，所以走势才是可理解的，才是可把握的……自相似性还有一个最重要的特点，就是自相似性可以自组出级别来……级别是自相似性自组出来的，或者说是生长出来的。
  interpretation: 作者给出一条重要定理：有多少不同构的自相似性结构，就有多少种分析股市的正确道路，任何脱离自相似性的股市分析方法本质上都是错误的。分型与走势类型是两种不同构的自相似性结构，先把这两个最基础的搞清楚就能到罗马。注意第84课将自相似性统一改称为自同构性结构。
