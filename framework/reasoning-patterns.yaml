    reasoning_chain:
    - step: 1
      name: 识别板块异动
      question: 哪个板块成为日内最强主线？
      UP_logic: 化工板块二十余只成分股涨停，日内最强主线，需拆解背后的多逻辑共振。
      evidence_sources:
      - 涨停家数统计
