- id: claim-20261023-001-d
  claim_type: technical-signal
  subject: 上证指数底部结构模型
  timeframe: intraday
  confidence: high
  intensity: high
  stance: view
  statement: 上证指数日线底部结构以15:00收盘价判定：高于3708点则当前底部结构形成，低于3627点则结构条件消失，两者之间继续观察；60分钟结构跟随每根完整周期K线更新。
  evidence_quote: 按照当前跟踪模型，日线以15:00收盘价为准：高于3708点，满足当前底部结构形成条件；低于3627点，当前结构条件消失；两者之间继续观察。60分钟结构则跟随盘中每根完整周期K线的结果更新。
  interpretation: UP给出了可证伪的技术阈值：3708是日线结构确认线，3627是结构失效线，中间区域不算信号；盘中拉升只有收盘确认或60分钟完整K线确认后才进入模型。
