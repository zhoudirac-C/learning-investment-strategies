      name: 判断资金态度与市场环境
      question: 外部利空下市场是系统性撤离还是结构性调仓？
      UP_logic: 低开回升、半日1.41万亿、超七成个股收绿但核心主线赚钱效应突出，判断资金未离场而是板块间调仓。
      evidence_sources:
