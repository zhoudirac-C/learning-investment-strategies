- id: claim-20070410-001-b
  source_path: sources/chanlun/lesson_044.md
  source_date: '2007-04-10'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 小级别背驰按操作级别应对的程序
  topic: 不预测不跨级别全仓操作，按既定级别分步处理小级别背驰
  statement: 对背驰级别小于操作级别的顶背驰，不能一见就全部扔掉，否则就变成按小级别操作了；走势不能采取预测的办法，不可能假定任何小级别顶背驰都必然导致大级别转折。以30分钟操作级别为例的应对程序：小于30分钟的顶背驰必然首先至少导致一个5分钟级别向下走势，若该向下走势没有回到构成最后一个30分钟中枢第三类买点那个5分钟向下走势类型的高点，则无须理睬（最强情况下甚至不触及那5分钟向上走势的最后一个5分钟中枢，更无须理睬）；若跌破该高点，则任何向上回抽都必须先离开。筹码较多时分步处理：当构成第三类买点那5分钟向上走势类型的最后一个5分钟中枢出现第三类卖点时先出一部分，出现前述跌破情况时出清，未出现则可回补当作弄了一个短差。有一定量资金的，即使按30分钟操作，见到1分钟顶背驰也可先出部分筹码，再根据回调走势决定回补还是继续出，因为这种资金不可能在任何一定级别的卖点都全仓卖掉。底背驰情况反过来即可。
  evidence_quote: 如果那向下的5 分钟走势跌破构成最后一个30 分钟中枢的第三类买点那个5 分钟回试的5 分钟走势类型的高点，那么，任何的向上回抽都必须先离开……你不可能按30 分钟操作，而一见到1 分钟顶背驰就全部扔掉，这就变成按1 分钟级别操作了……即使按30 分钟操作，当见到1 分钟的顶背驰时，也可以把部分筹码出掉，然后根据后面的回调走势情况决定回补还是继续出，这样的操作，对一定量的资金是唯一可行的。
  interpretation: 这是小背驰-大转折定理的操作落地：以操作级别为锚，用第三类买点对应的位置作可容忍回撤的界线，线上不理、破线回抽必走；大资金用分批短差替代全仓进出。核心原则是级别纪律优先于对转折的预测。
