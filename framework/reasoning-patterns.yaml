  - pattern_id: market_style_switch_by_capacity_20260105
    name: 风格切换与板块应对推理
    source_raw:
    - sources/raw/财经/复盘：26-01-05：12连阳普涨，风格切换容量标的，脑机涨停潮.md
    key_themes:
    - 市场风格切换
    - 连板晋级率与赚钱效应
    - 容量标的/流动性溢价
    - 年报预披露期
    - 板块驱动归类
    reasoning_chain:
    - step: 1
      name: 观测连板晋级与赚钱效应
      question: 当前短线情绪是否健康？
      UP_logic: 连板高度长期未突破，神剑股份仅止步8连板，晋级率不及预期且伴随亏钱效应，判断短线情绪偏弱。
      evidence_sources:
      - 连板晋级率数据
      - 神剑股份连板高度
    - step: 2
      name: 对比容量标的表现
      question: 资金实际偏好在哪里？
      UP_logic: 中国卫星等容量标的持续超预期，蓝色光标凭流动性溢价走出20%连板，与弱连板形成鲜明反差。
      evidence_sources:
      - 中国卫星走势
      - 蓝色光标连板表现
    - step: 3
      name: 历史类比与窗口验证
      question: 这种分化是短期噪音还是趋势切换？
      UP_logic: 去年二三季度曾出现过类似市场特征，且当前与年报预披露窗口期高度适配，判断市场风格已完成切换。
      evidence_sources:
      - 去年二三季度历史行情
      - 年报预披露窗口期
    - step: 4
      name: 按驱动归类板块策略
      question: 各板块分别如何应对？
      UP_logic: 脑机接口判断为量化资金驱动，类比海南板块隔日接力难；商业航天热度缓降但会反复；AI硬件与六氟磷酸锂围绕业绩确定性展开。
      evidence_sources:
      - 脑机接口涨停潮
      - 海南板块类比
      - 存储业绩确定性
      - 六氟磷酸锂业绩逻辑
    risk_factors:
    - 连板晋级率回升且高度突破，风格可能重新切回小票连板
    - 量化资金快速撤离导致脑机等题材隔日大幅亏钱
    - 年报窗口结束或业绩预告不及预期，切换逻辑被证伪
    - 容量标的若高位放量滞涨，风格切换可能进入尾声
    confidence_indicators:
    - 指数12连阳且沪指重返4000，趋势性做多环境强化风格判断
    - 容量标的持续超预期并出现20cm连板，大资金态度明确
    - 年报预披露窗口期与业绩确定性主线形成共振
    merge_suggestion: 通过涨停结构与容量股表现识别风格切换，属主线识别
  - pattern_id: mainline_style_switch_20260105
