# GOLD-005 金标：000002 万科 15 分钟盘整背驰 → 第三类买点
# （课24 课文实例，等比 synthetic）
#
# 课文结论（课24《MACD 对背弛的辅助判断》，2007-01-18 发文）：
#   "例如，000002 万科的 15 分钟图，12 月 15 日 10 点 45 分，构成一个盘整背驰，
#    所以要出来，其后的次级别回跌并不重新回到前面的中枢里，就在 18 日 9 点 45 分
#    构成了标准的第三类买点，这时候就该重新回补了。"
#   盘整背驰规则原文："如果 C 段上破中枢，但 MACD 柱子的面积小于 A 段的，这时候
#    的原则是先出来，其后有两种情况，如果回跌不重新跌回，就在次级别的第一类买点
#    回补，刚好这反而构成该级别的第三类买点。"
# claim 原文依据：
#   - claim-20070118-001-c（课24 盘整背驰判断）：C 段上破中枢但面积小于 A 段
#     → 先出来；回跌不重新跌回中枢 → 构成该级别第三类买点（本例即课文原文案例）；
#   - claim-20070105-001-b（课20 第三类买卖点定理）：回试不跌破 ZG → 第三类买点。
#
# 降级说明（ADR-005）：2006 年 12 月分钟级数据公开源不可得（baostock 15 分钟线
#   查询 2006-12 返回 0 行；akshare 分钟线仅近期），按课文描述等比 synthetic：
#   "A 段/中枢/C 段上破/回跌不返中枢"结构逐段映射，段=笔口径（同 cases），
#   pivot 间距 4 根 K 线；价格量级仿万科当期（约 7~8 元）。
#
# 结构推导（fx/bi/zs/bsp 全文断言）：
#   - 引导笔 idx1(7.6 顶)→idx5(7.2 底)；
#   - A 段上 idx5(7.2)→idx9(7.9 顶)，幅度 0.7；
#   - 中枢：段1 下 idx9→13 [7.5,7.9]、段2 上 idx13→17 [7.5,7.85]、
#     段3 下 idx17→21 [7.55,7.85]：ZD=max(7.5,7.5,7.55)=7.55、
#     ZG=min(7.9,7.85,7.85)=7.85 → [7.55,7.85]，start_idx=9，end_idx=21，
#     sure=true；
#   - C 段上 idx21(7.55)→idx25(8.0 顶)：上破 ZG 7.85 但幅度 0.45 < A 段 0.7
#     （面积代理：段内 Σ|Δ收盘| A=0.7、C=0.45，C<A 成立）→ 盘整背驰
#     （课文"12月15日10点45分构成盘整背驰，所以要出来"）；盘整背驰本身是操作
#     信号而非五表结构元素，不单列断言；
#   - 回跌笔 idx25→idx29：低点 7.9 > ZG 7.85，不重新跌回中枢 → 构成该级别
#     第三类买点 idx=29（课文"18日9点45分构成了标准的第三类买点"）；
#   - 确认笔 idx29→idx33 上行至 8.3；末位 fx/bi → false。
