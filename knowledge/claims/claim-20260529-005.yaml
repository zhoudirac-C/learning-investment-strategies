  subject: 强势板块尾盘套利法
  timeframe: permanent
  statement: 板块发酵确认后（涨停超过七八个），不敢参与强势股的可以去20cm/30cm标的尾盘套利。买点在尾盘，第二天高开出。这是适用于大多数启动时间节点的套利方式
  evidence_quote: 板块发酵了，就算是如果整个涨停板的比例比较多，比如说连续涨停板等于超过七八个或者比较多的，那个时候你就可以看到是整体的一个板块发酵。你不敢去参与那种强势股票的一个打板，那么你就可以去参与这种强势板块的套利。强势板块套利，也就是这种，这种股票也就走出类似于这种射击之星或者仙人指路的样子之后，你去尾盘吸一把
  interpretation: 博主教授强势板块尾盘套利法：①前提：板块发酵确认（连续涨停超过七八个）；②标的：20cm或30cm的弹性票（如光云科技、新致软件、鼎捷智能、美登等）；③买点：尾盘，走出"射击之星"或"仙人指路"形态（长上影）时；④卖点：第二天高开位置出掉；⑤胜率：连续强势涨停的，第二天一般不会直接干下来，大概率能赚钱走；⑥适用：大多数启动时间节点，是右侧交易的补充策略
  confidence: high
