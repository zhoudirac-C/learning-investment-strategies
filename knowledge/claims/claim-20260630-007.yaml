  subject: 刺透与乌云的加分条件
  timeframe: permanent
  statement: 加分项包括：①刺入/覆盖比例越高信号越强；②第二根放量，说明力量切换有真实资金支撑；③出现在前期高低点或重要支撑压力等关键位置；④前期趋势持续越久、幅度越大越可信；⑤第一根本身就是趋势末端的标志性K线（刺透前为长黑线、乌云前为高档长红），形成多重信号叠加。
  evidence_quote: 其次呢就是一些加分条件，比如说你刺透或者盖住的比例越高，对吧？那么说明信号越强。其次呢就是说你第二根K线它要放量，如果放量呢就说明力量有切换，有真实的一个资金支撑。第三就出现了关键位置……前期的趋势的持续时间越长，那么幅度越大，整体的反转信号呢就越可信。还有就是说前一根它也是顶部或者底部的那种K线
  interpretation: 加分项用来在同一形态内部排序，而不是准入条件；实操上应把「比例+放量+位置」三项作为主要权重。
