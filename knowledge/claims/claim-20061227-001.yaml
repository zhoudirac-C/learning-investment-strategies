  subject: 技术分析的地位
  topic: 技术分析只是三个独立系统之一，单凭技术精通加资金管理即可长期战胜市场
  statement: 技术分析系统在缠论中只是三个独立的系统之一，最基础的是三个独立系统所依据的概率原则所保证的数学上的系统有效性。技术分析之所以重要，是因为对于完全没有消息的散户来说，这是最公平、最容易得到的信息：技术走势完全公开，对任何人都是第一手、最直接的，没有任何秘密、先后可言。单凭对技术分析的精通与资金管理的合理应用，就完全可以长期有效地战胜市场，这是一般投资者切实参与市场最稳靠的基础。
  evidence_quote: 技术分析系统在本ID 的理论中只是三个独立的系统之一，最基础的是三个独立系统所依据的概率原则所保证的数学上的系统有效性……单凭对技术分析的精通与资金管理的合理应用，就完全可以长期有效地战胜市场，对于一般的投资者来说，如果你希望切实参与市场之中，这是一个最稳靠的基础。
  interpretation: 给技术分析定位：它不单独构成全部决策，而是三个独立系统之一（另两个系统后文展开为基本面与比价关系），但它是散户唯一公平可得的一手信息。结论是有边界的肯定：技术精通加资金管理足以长期战胜市场，不需要内幕与预测。
