  subject: 快速行情中的级别灵活切换
  topic: 快速变动行情中低级别背驰的空间可超过高级别，操作可降级别进入而不必坐等本级别买点
  statement: 级别只是区分可操作空间的，通常情况下级别大操作空间就大；但在快速变动的行情中，一个5分钟的走势类型就可以跌个50%，这样一个5分钟底背驰的反弹空间就比一般情况下30分钟级别的都大，这时候即使按30分钟操作的也可以按5分钟级别进入，而不必坐等30分钟买点。
  evidence_quote: 还有，级别只是区分可操作空间的，为什么按级别？因为级别大，操作空间按通常情况下就大。但在快速变动的行情中，一个5 分钟的走势类型就可以跌个50%，例如这次大跌，因此，一个这样的5 分钟底背驰，其反弹的空间就比一般情况下30 分钟级别的都大，这时候，即使你是按30 分钟操作的，也可以按5 分钟级别进入，而不必坐等30 分钟买点了。
  interpretation: 固定操作级别不是僵化级别：空间标准压倒级别名义，暴跌后的低级别背驰提供了级别套利的例外窗口，与第54课大幅快速波动中小级别第三类买卖点足以介入一致。
