  claim_type: sector-theme
  subject: AI产能出清三变化-从抢卡到闲置到租赁
  timeframe: industry
  statement: AI产能出清经历三个核心变化：一是从缺卡到不缺卡，算力从供不应求转向闲置；二是AI资本市场从GPT时刻到验货时刻，大模型性能进步但商用化尚未证明；三是商业模式从自用推理转向租赁业务，算力资产面临从高估值到稳定回报模式的重构。
  evidence_quote: AI产能出清的三个核心变化：一是从缺卡到不缺卡，以前全球抢算力，现在算力开始闲置，云厂商开始出租算力资产，市场从供不应求切换到了供给释放阶段；二是AI资本市场从GPT时刻到验货时刻，大模型性能进入全球第一梯队，但商用化和收入增长还在早期，市场情绪从狂热转向观望，等AI兑现收益；三是AI商业模式从自用推理转向对外租赁算力，算力资产必须从创投模式转向公共事业模式。
