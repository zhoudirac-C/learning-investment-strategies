  subject: 线段的特征序列
  topic: 线段反向笔构成特征序列，经非包含处理后按分型考察
  statement: 用S代表向上的笔、X代表向下的笔，以向上笔开始的线段可表示为S1X1S2X2直到SnXn，其中向下笔序列X1X2直到Xn称为该线段的特征序列；以向下笔开始的线段，其特征序列是S序列（特征序列元素方向与线段方向相反）。特征序列两相邻元素间没有重合区间，称为该序列的一个缺口。把特征序列每一元素看成一根K线，如同一般K线图找分型的方法，也存在包含关系，可以进行非包含处理，处理后的称为标准特征序列（以后没有特别说明，特征序列都指标准特征序列）。参照K线顶底分型的定义确定特征序列的顶和底：以向上笔开始的线段只考察顶分型，以向下笔开始的线段只考察底分型。
  evidence_quote: 序列X1X2…Xn 成为以向上笔开始线段的特征序列；序列S1S2…Sn 成为以向下笔开始线段的特征序列。特征序列两相邻元素间没有重合区间，称为该序列的一个缺口……把每一元素看成是一K 线，那么，如同一般K 线图中找分型的方法，也存在所谓的包含关系，也可以对此进行非包含处理。经过非包含处理的特征序列，成为标准特征序列……以向上笔开始的线段的特征序列，只考察顶分型；以向下笔开始的线段，只考察底分型。
  interpretation: 特征序列是判死线段的显微镜：把线段的反向笔当K线、递归复用分型工具，使线段结束的判断获得与分型同等的严格性。这一精确化让同一级别图上的走势可以唯一地划分为线段的连接。
