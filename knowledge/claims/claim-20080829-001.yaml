  subject: 底部的分型定义
  topic: 底分型区间即底部，有效站上上边沿则成功，应在下探失败时买
  statement: 站在分型的角度，底部就是构成底分型的那个区间：跌破分型最低点意味着底部构成失败，反之有效站住分型区间上边沿，就意味着底部构造成功并至少展开一笔向上行情。底部是有级别的，日线图上的底分型对应着分型意义上的日线级别底部。操作要点：不是在底部的区间上买，而是相反，应该和中枢震荡的操作一样，在区间下探失败时买，这才是最好的买点。
  evidence_quote: 站在分型的角度，底部就是构成底分型的那个区间，而跌破分型最低点意味着底部构成失败，反之，有效站住分型区间上边沿，就意味着底部构造成功并至少展开一笔向上行情……不是在底部的区间上买，而是相反，应该和中枢震荡的操作一样，在区间下探失败时买，这才是最好的买点，连这都搞不明白，就白学了。
  interpretation: 分型定义是精确走势类型定义的粗糙替代，给一时把握不了精确分类的人一个将就办法，对把握大方向已经足够。课中2284点与2952点的当月区间是2008年8月案例，方法与点位无关；下探失败时买的规则把买点落在区间下沿的验证处。
