  subject: 趋势背驰的成立条件
  topic: a+A+b+B+c 要有背驰须先是趋势，且c为次级别并创新高或新低
  statement: 对典型形式 a+A+b+B+c 谈背驰有三条前提：一、没有趋势就没有背驰，A、B 必须是同级别的中枢，否则整个形式只能看成较大中枢的震荡，最多算盘整背驰；二、c 必然是次级别的，至少包含对 B 的一个第三类买卖点，否则应看成 B 中枢的小级别波动，用盘整背驰处理；三、若是上涨 c 一定要创出新高，下跌 c 一定要创出新低，否则即便 c 包含第三类买卖点，也按围绕 B 的次级别震荡用盘整背驰判断。多义性只是多角度观察，不是含糊性，不能因为有了把 b、c 当成 B 的次级波动这一个角度，就忘了 a+A+b+B+c 是趋势且 A、B 级别相同的角度。
  evidence_quote: 没有趋势，没有背驰，不是任何a+A+b+B+c 形式的都有背驰的。当说a+A+b+B+c 中有背驰时，首先要a+A+b+B+c 是一个趋势。而一个趋势，就意味着A、B 是同级别的中枢，否则，就只能看成是其中较大中枢的一个震荡……c 必然是次级别的，也就是说，c 至少包含对B 的一个第三类买卖点，否则，就可以看成是B 中枢的小级别波动，完全可以用盘整背驰来处理……如果a+A+b+B+c 是上涨，c 一定要创出新高；a+A+b+B+c 是下跌，c 一定要创出新低。
  interpretation: 这是把趋势背驰与盘整背驰区分开的判定清单，三条都满足才谈趋势背驰，否则一律降格为盘整背驰处理。两者对应的买卖点级别与后续力度完全不同，混用会把中枢震荡的卖点误判为趋势反转点。
