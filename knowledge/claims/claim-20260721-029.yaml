  subject: 油价破90美元压制AI科技股估值的传导机制
  timeframe: trend
  statement: 国际油价站上90美元，突破85美元阈值触发市场对通胀和利率路径的重新评估。油价上涨从折现端施压科技股：推高通胀预期和美债收益率→无风险利率提高→投资者降低对远期利润估值。AI板块高估值对实际利率变化尤为敏感。
  evidence_quote: 当前油价位置：国际油价已经站上90美元，此前分析时油价还处于80-85美元区间，油价突破85美元就会触发市场对通胀和利率路径的重新评估。油价压制科技股估值的机制：油价上涨从折现端施压科技股，推动高通胀预期和美债收益率上行，无风险利率提高后，投资者会降低对远期利润的估值，AI板块高估值对实际利率变化尤为敏感。
  interpretation: UP明确了油价→利率→科技股估值的三步传导链。85美元是通胀重新定价的阈值，90美元已突破。AI板块因估值高度依赖远期现金流预期（在高利率环境下折现价值大幅缩水），是受油价-利率传导影响最大的板块。这也是市场从AI叙事转向验货期的重要宏观背景。
