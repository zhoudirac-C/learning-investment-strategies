  subject: MACD判断背驰的标准方法
  topic: 同向趋势两段比较MACD柱子面积，C段面积小于A段构成标准背驰
  statement: 用MACD判断背驰的前提结构：两段同向趋势A、C之间有一个盘整或反向趋势B连接，A段之前一定是和B同级别或更大级别的一个中枢，B是这个大趋势的另一个中枢，B的中枢级别比A、C里的中枢级别都要大，B一般会把MACD的黄白线（DIFF和DEA）回拉到0轴附近。标准背驰的判定：C段的走势类型完成时对应的MACD柱子面积（向上看红柱子，向下看绿柱子）比A段对应的面积小。实用技巧：看柱子面积不需要全出来，一般柱子伸长的力度变慢时，把已经出现的面积乘2就可以当成该段的面积，所以在上涨或下跌的最后阶段判断就出来了，一般都可以抛到最高价位和买在最低价位附近。光用MACD辅助判断，只要能分清楚A、B、C三段，准确率应该在90%以上；配合上中枢则是100%绝对的。
  evidence_quote: 用MACD 判断背驰的前提是，A、B、C 段在一个大的趋势里，其中A 之前已经有一个中枢，而B 是这个大趋势的另一个中枢，这个中枢一般会把MACD 的黄白线（也就是DIFF 和DEA）回拉到0 轴附近。而C 段的走势类型完成时对应的MACD 柱子面积（向上的看红柱子，向下看绿柱子）比A 段对应的面积要小，这时候就构成标准的背弛。
  interpretation: 这是MACD辅助背驰判断的完整操作版：先验结构（A前中枢加B中枢拉回0轴）再比面积。面积乘2的估算技巧把背驰判断从确认后移到当下。作者明示其为不绝对精确但方便的替代方案，精确判断仍要从中枢本身出发。课中601628人寿5分钟图为2007年历史案例。
