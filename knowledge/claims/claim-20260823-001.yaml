  timeframe: permanent
  statement: 趋势初期的滞涨观测分三阶段：第一阶段上涨后次日有正反馈但分时不够流畅、冲高遇明显抛压，波动敏感者可开始左侧处理——在高点附近发现强度不够时直接卖，而不是等股价明显下跌后再承认滞涨；第二阶段连续两天高位震荡，高位横盘是良性整理还是资金衰竭，区别在于成交是否健康、回落是否迅速有承接、高点是否继续抬升、板块强时个股能否主动突破；第三阶段试图突破但分时不流畅、上冲立即回落反复碰压力位、量增价不脱离平台，说明是存量博弈，最差也应开始做滚动或降低仓位。
  evidence_quote: 重点就是在高点附近发现强度不够的时候直接卖，而不是等到股价已经明显下跌之后再去承认滞涨。
