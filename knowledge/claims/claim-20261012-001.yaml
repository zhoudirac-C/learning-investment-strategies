  subject: 今日三变量与处理顺序
  topic: 指数定环境板块定方向个股定时点，行动等待承接与结构确认
  timeframe: intraday
  statement: 今日跟踪三项变量：①前半小时及10点半后的成交变化是否伴随双创企稳和上涨家数扩大；②二板能否接近或超过9家、首板是否继续补充、跌停是否保持收敛；③影视传媒与网络安全能否承接分歧、电池能否形成独立回流、硬件核心是否止跌。处理顺序：指数定环境，板块定方向，个股定时点；反弹可以提高关注度，行动仍需等待承接与结构确认，避免把一次探底回升提前定义为反转。
