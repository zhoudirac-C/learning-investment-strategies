  timeframe: permanent
  statement: 纯理论上操作级别越低相应效率越高，但实际操作级别不可能随意低，按什么级别分析操作与资金等具体条件相关；T+1制度下按1分钟以下级别操作面临不能顺利兑现的风险，系统的操作要把所有可能情况考虑其中，因此完全按1分钟以下级别操作是不可能的，除非T+0。
  evidence_quote: 从纯理论的角度，操作级别越低，相应的效率越高，但实际操作级别是不可能随意低的，而究竟按什么级别来分析、操作，和你的资金等具体条件相关。例如，T+1
    的情况下，按1 分钟以下级别的操作，就面临着不能顺利兑现的风险，而系统的操作，要把所有可能的情况都考虑其中，因此完全按1 分钟以下级别的操作是不可能的，除非是T+0。
