- pattern_id: hardware_rotation_chain_analysis
  name: 算力硬件全产业链轮动分析
  description: 从行业景气度与业绩催化出发，沿产业链上下游依次筛选轮动分支，识别预期差标的。
  applicable_themes:
  - AI算力硬件
  - 半导体设备
  - 光通信
  - 液冷散热
  reasoning_chain:
  - step: 1
    name: 确认主线与催化
    question: 当前市场唯一有持续赚钱效应的主线是什么？核心催化是什么？
    UP_logic: 从市场表现中识别出AI算力硬件为唯一主线，并提取光纤涨价、CPO订单、液冷大会等具体催化事件。
    evidence_sources:
    - 市场涨跌数据
    - 行业新闻
    - 机构研报
  - step: 2
    name: 拆解产业链环节
    question: 主线内部有哪些细分赛道？每个赛道的景气度与业绩驱动因素是什么？
    UP_logic: 将算力硬件拆分为光纤光缆、CPO/光模块、液冷、半导体设备、光芯片等环节，并分别列出涨价周期、订单增长、供需错配等驱动逻辑。
    evidence_sources:
    - 行业报价
    - 公司公告
    - 机构预测
  - step: 3
    name: 筛选预期差标的
    question: 在已确认的细分赛道中，哪些标的市值小、涨幅低、但逻辑强，存在预期差？
    UP_logic: 对比同赛道龙头（如长飞光纤3000亿）与相关小市值公司（如通光线缆不足百亿），寻找合资、产能规划等关联逻辑。
    evidence_sources:
    - 市值数据
    - 公司公告
    - 产能规划
  - step: 4
    name: 验证机构资金动向
    question: 机构资金近期在哪些标的上有大额净买入？是否与上述逻辑一致？
    UP_logic: 通过龙虎榜等数据确认机构加仓方向（如东山精密、光迅科技），验证主线逻辑得到资金认可。
    evidence_sources:
    - 龙虎榜数据
    - 机构净买卖统计
  risk_factors:
  - 成交量持续缩量导致轮动节奏加快
  - AI应用端退潮引发情绪负反馈
  - 涨价周期或订单预期落空
  confidence_indicators:
  - 机构资金持续净买入主线标的
  - 细分赛道出现连板或创新高个股
  - 行业大会或政策催化临近
  source_raw:
  - sources/raw/财经/复盘：26-04-09：科技独强普跌，AI算力硬件全产业链轮动，光纤CPO液冷光芯片.md
- pattern_id: industry_cycle_chain_mapping
  name: 产业周期链式扩散映射
  description: 从核心环节的景气信号出发，沿产业链上下游依次识别受益分支，并筛选业绩兑现龙头。
  applicable_themes:
  - AI算力硬件
  - 新能源产业链
  - 半导体设备材料
  reasoning_chain:
  - step: 1
    name: 识别核心景气信号
    question: 哪个环节出现了明确的供需紧张或涨价信号？
    UP_logic: 引用海外龙头产能售罄、行业预测数据（如Lumentum产能售罄、LightCounting预测）作为景气起点。
    evidence_sources:
    - 海外龙头公告
    - 行业研究机构预测
  - step: 2
    name: 沿产业链扩散受益分支
    question: 该核心环节的景气会向哪些上下游分支传导？
    UP_logic: 从光通信→算力租赁→AI电力→PCB→CPU分销，逐层列举受益分支，并给出每个分支的供需逻辑。
    evidence_sources:
    - 产业链图谱
    - 行业新闻
  - step: 3
    name: 筛选业绩兑现龙头
    question: 每个分支中哪些公司具备全球竞争力和业绩兑现能力？
    UP_logic: 列举各分支核心标的，强调“业绩+产业趋势”双驱动，回避纯题材小票。
    evidence_sources:
    - 公司公告
    - 财务数据
  risk_factors:
  - 龙头抱团资金兑现风险
  - 海外龙头扩产超预期导致供需逆转
  confidence_indicators:
  - 核心环节产能售罄/订单积压至多年后
  - 行业预测CAGR持续上修
  source_raw:
  - sources/raw/财经/复盘：26-04-11：冲高回落创业板突破前高，AI算力硬件全产业链，风格切换业绩龙头.md
- pattern_id: ai_demand_chain_price_chain
  name: AI需求传导涨价链分析
  description: 从AI高端需求出发，推导产能挤占、供给短缺、全品类涨价的产业传导逻辑，并筛选受益标的。
  applicable_themes:
  - AI算力产业链
  - 电子布/玻纤
  - 光通信/CPO
  - 液冷散热
  - 算力硬件补涨
  reasoning_chain:
  - step: 1
    name: 需求端爆发识别
    question: AI技术发展是否带来了对特定材料或组件的非线性需求增长？
    UP_logic: 以AI服务器对PCB板层数、材料要求远超传统服务器为例，量化需求倍数（如3~5倍），并引用市场规模预测（如40亿元）和交付周期延长（超半年）作为证据。
    evidence_sources:
    - 英伟达GB200 PCB用量数据
    - 高端电子布市场规模预测
    - 交付周期数据
  - step: 2
    name: 供给端刚性分析
    question: 供给端是否存在短期无法扩产或产能被挤占的刚性约束？
    UP_logic: 分析头部厂商将产能转向高端导致中低端收缩、核心原料扩产周期长（18~24个月）、客户认证周期长、寡头垄断格局（如日东纺占70%产能）等供给刚性因素。
    evidence_sources:
    - 产能转向数据
    - 扩产周期数据
    - 客户认证周期
    - 全球市场份额数据
  - step: 3
    name: 价格端趋势确认
    question: 价格是否已进入持续上行通道，且涨价频率加快？
    UP_logic: 引用具体产品价格从底部到当前的变化（如7628电子布从4元/米涨至6.5元/米），以及涨价频率从季度级缩短至月度级，并叠加外部因素（如欧洲天然气价格暴涨）加速进口替代。
    evidence_sources:
    - 产品价格历史数据
    - 涨价频率变化
    - 欧洲天然气价格数据
  - step: 4
    name: 受益标的筛选
    question: 哪些公司在该传导链中具备核心竞争力和业绩弹性？
    UP_logic: 优先选择具备稀缺量产能力（如宏和科技唯一超薄电子布量产）、市占率高（全球第二）、或直接受益于出口替代的行业龙头（如中国巨石、中材科技）。
    evidence_sources:
    - 公司量产能力声明
    - 市占率数据
    - 出口替代逻辑
  risk_factors:
  - AI需求增速不及预期，导致涨价逻辑证伪
  - 供给端扩产周期缩短或新产能快速释放，打破供需失衡
  - 地缘政治或政策变化导致产业链转移或成本波动
  confidence_indicators:
  - 涨价频率持续加快（如从季度级缩短至月度级）
  - 头部厂商订单交付周期持续延长
  - 海外同类产品价格同步上涨或进口替代加速
  source_raw:
  - sources/raw/财经/复盘：26-04-14：沪指收复4000，AI算力全产业链爆发.md
- pattern_id: mainline_diverge_reentry
  name: 主线分歧回流交易模式
  description: 通过识别主线板块高潮后的分歧节点，结合龙头股盘面反馈判断分歧性质，制定低吸或规避策略
  applicable_themes:
  - 算力产业链
  - 新能源产业链
  - AI应用
  - 机器人
  reasoning_chain:
  - step: 1
    name: 识别主线高潮
    question: 当前市场主线板块是否已全面爆发？
    UP_logic: 算力租赁今日全面高潮，十余只成分股涨停，判断为高潮状态
    evidence_sources:
    - 板块涨停家数
    - 板块内个股涨幅分布
  - step: 2
    name: 预判分歧节点
    question: 高潮后分歧何时到来？持续时间多长？
    UP_logic: 明日分歧已是大概率事件，参考历史主线节奏，分歧持续时间不会太长，周一或周二有望回流
    evidence_sources:
    - 历史主线分歧规律
    - 当前市场情绪周期位置
  - step: 3
    name: 锚定龙头反馈
    question: 龙头股在分歧日的盘面表现如何？
    UP_logic: 核心锚定中际旭创盘面反馈：若大高开后大幅回落→规避业绩线跟风标的；若龙头承接有力→分歧即为低吸窗口
    evidence_sources:
    - 龙头股开盘价
    - 分时走势
    - 成交量变化
  - step: 4
    name: 制定交易预案
    question: 根据龙头反馈，应采取何种操作？
    UP_logic: 不盲目在分歧初期追高，根据龙头承接力决定是规避还是低吸
    evidence_sources:
    - 龙头股盘面反馈结果
  risk_factors:
  - 龙头股出现超预期利空导致板块全面退潮
  - 市场整体情绪转弱，分歧演变为持续调整
  confidence_indicators:
  - 龙头股在分歧日缩量回踩关键均线
  - 板块内仍有低位补涨个股活跃
  source_raw:
  - sources/raw/财经/复盘：26-04-16：全线反包创业板近11年新高，算力产业链全面爆发，宁德时代反超中石油.md
- pattern_id: market_anchor_dual_drive
  name: 双锚点驱动研判法
  description: 通过全球资产定价锚（原油）与A股量能/点位锚联动，判断市场趋势与交易节奏
  applicable_themes:
  - A股大盘趋势研判
  - 全球资产联动分析
  - 地缘冲突后市场修复
  reasoning_chain:
  - step: 1
    name: 识别全球核心锚
    question: 当前全球资产定价的核心变量是什么？
    UP_logic: 将原油价格作为全球资产定价核心锚，判断油价能否稳定在100美元下方决定全球大类资产方向
    evidence_sources:
    - 美原油价格走势
    - 布伦特原油价格走势
  - step: 2
    name: 判断A股量能性质
    question: 当前成交额是反弹还是反转信号？
    UP_logic: 对比历史反弹峰值量能（2.42万亿），判断2.43万亿已一步到位，大概率走双头而非V型反转
    evidence_sources:
    - 当日成交额2.43万亿
    - 历史对标数据（2025年10月、5月）
  - step: 3
    name: 验证技术面关键位
    question: 指数能否突破关键点位确立趋势？
    UP_logic: 以沪指4012点作为趋势确立分水岭，15点收盘价突破则上升趋势确立，否则观望
    evidence_sources:
    - 沪指15分钟级别收盘价
    - MACD金叉状态
  - step: 4
    name: 综合锚点定策略
    question: 如何根据锚点状态制定交易节奏？
    UP_logic: 全球锚（原油）与A股锚（量能+点位）联动：若油价稳+量能续+点位破，则积极；否则均值回归、聚焦低位补涨
    evidence_sources:
    - 原油价格区间
    - 成交额延续性
    - 沪指4012点突破情况
  risk_factors:
  - 原油价格重回100美元上方，全球资产重估
  - 成交额快速萎缩，反弹动能衰竭
  - 地缘谈判出现实质性突破或恶化
  confidence_indicators:
  - 沪指连续3日站稳4012点上方
  - 成交额维持在2万亿以上且不快速萎缩
  - 原油价格稳定在100美元下方且地缘无恶化
  source_raw:
  - sources/raw/财经/早盘：26-04-09：地缘情绪脉冲终结，2.43万亿普涨，AI全产业链绝对核心.md
- pattern_id: aidc_infrastructure_decomposition
  name: AIDC基础设施拆解框架
  description: 将AI数据中心拆解为算力、供电、散热、网络、运维五大子系统，逐一分析各子系统的核心组件、技术趋势和对应标的
  applicable_themes:
  - AI数据中心
  - 算力基础设施
  - 新基建
  - 科技产业链分析
  reasoning_chain:
  - step: 1
    name: 确立全球锚点
    question: 海外龙头走势如何映射国内板块？
    UP_logic: 以ASML/台积电/日月光/美光为锚点，当这些龙头走爬坡趋势时，国内对应板块大概率跟随
    evidence_sources:
    - 美股半导体龙头走势
    - A股半导体板块走势
  - step: 2
    name: 拆解AI服务器组件
    question: AI服务器由哪些核心部件组成？
    UP_logic: 按PCB/连接器/背板/CPU/电源/光模块/网卡/存储/机箱/散热/组装测试逐一拆解，每个部件对应A股标的
    evidence_sources:
    - AI服务器BOM清单
    - A股上市公司业务构成
  - step: 3
    name: 分类AIDC类型
    question: 不同区域和用途的AIDC如何分类？
    UP_logic: 按绿电训练型/低延迟推理型/区域平衡型/边缘算力型四类划分，每类对应典型区域和业主
    evidence_sources:
    - 国内超算集群分布数据
    - 各地电价和气候条件
  - step: 4
    name: 分层分析供电系统
    question: AIDC供电系统包含哪些层级？
    UP_logic: 从外部接入→直流化稳压→末端供电→备用电源逐层分析，每层对应不同标的，注意服务器级与AIDC级区别
    evidence_sources:
    - AIDC供电架构图
    - 上市公司产品线
  - step: 5
    name: 分层分析散热系统
    question: 散热系统如何随算力密度升级？
    UP_logic: 按芯片级→服务器级→CDU→二次冷却→冷却网络分层，GPU功耗上升驱动液冷替代风冷，一体式方案是趋势
    evidence_sources:
    - GPU功耗演进数据
    - 散热技术路线图
  - step: 6
    name: 按客户分类运维
    question: 不同客户类型的运维需求有何差异？
    UP_logic: 按字节系/阿里系/国资系/边缘算力四类客户，分析其核心需求、运维特征和盈利模式差异
    evidence_sources:
    - 主要客户AIDC建设案例
    - 上市公司客户结构
  risk_factors:
  - 海外半导体龙头走势逆转导致国内板块跟随下跌
  - GPU功耗增速不及预期导致散热/供电需求放缓
  - 国内AIDC建设进度低于规划
  - 国产AI芯片替代进度不达预期
  confidence_indicators:
  - 英伟达等海外龙头持续上调资本开支指引
  - 国内超大规模AIDC项目密集开工
  - 液冷渗透率快速提升
  - 供电/散热相关公司订单持续增长
  source_raw:
  - sources/raw/财经/视频：26-02-12：AI服务器与AIDC全产业链分析.md
- pattern_id: aidc_reits_profit_chain
  name: AIDC-REITs利润拆解与估值推演
  description: 通过拆解AIDC公司REITs模式下的一次性收益与经营利润，结合扩产计划推算未来利润与市值空间，判断主线地位。
  applicable_themes:
  - AIDC
  - 数据中心
  - REITs模式
  - 科技基础设施
  reasoning_chain:
  - step: 1
    name: 商业模式定性
    question: 公司如何通过REITs实现资金循环和利润？
    UP_logic: 建数据中心→通过REITs卖掉产权→保留运营权收租→回收资金再建下一批，形成轻资产高周转模式。
    evidence_sources:
    - 公司公告
    - REITs交易案例
  - step: 2
    name: 利润拆解
    question: 总利润中一次性收益和经营利润各占多少？
    UP_logic: 从总利润中剔除卖数据中心的一次性收益，得到实际经营利润，判断商业模式是否可持续。
    evidence_sources:
    - 财报利润表
    - 资产出售公告
  - step: 3
    name: 扩产测算
    question: 扩产计划对应的机柜数量、投资收益和市值空间是多少？
    UP_logic: 根据扩产机柜数×单机柜投资收益，推算未来总利润，再按合理PE估算对应市值。
    evidence_sources:
    - 扩产公告
    - 行业单机柜收益均值
  - step: 4
    name: 市场验证
    question: 次日封单量是否高，以确认市场认可该模式？
    UP_logic: 封单高=市场认可REITs模式，AIDC主线确立；封单低=模式存疑，需谨慎。
    evidence_sources:
    - 次日开盘封单数据
    - 市场情绪指标
  risk_factors:
  - REITs市场流动性不足导致资产出售困难
  - 数据中心需求增速不及预期
  - 监管政策变化影响REITs交易
  confidence_indicators:
  - 封单量持续高位
  - 后续扩产公告不断落地
  - 经营利润环比增长
  source_raw:
  - sources/raw/财经/视频：26-02-23：开工大吉节后复盘.md
- pattern_id: ai_infrastructure_capital_cycle
  name: AI基建资本循环推理
  description: 从资本开支、供需错配、商业模式升级三个维度，推导AI基础设施产业链的投资机会
  applicable_themes:
  - AI基础设施
  - 算力租赁
  - 数据中心
  - 光通信
  - 存储芯片
  reasoning_chain:
  - step: 1
    name: 资本循环确认
    question: AI基础设施是否有可持续的资本支撑？
    UP_logic: 大厂发债→建数据中心+买GPU→出租算力→还债，形成自我强化的资本循环
    evidence_sources:
    - 彭博社报道
    - 摩根士丹利债券发行预期
  - step: 2
    name: 建设拐点识别
    question: AIDC建设是否进入加速阶段？
    UP_logic: 国产算力放量（DeepSeek适配）+H200进口可能放开→AIDC项目大规模推进
    evidence_sources:
    - 国产算力出货量数据
    - 中美谈判预期
  - step: 3
    name: 供需错配判断
    question: 算力是否进入涨价周期？
    UP_logic: B300租赁价格涨35%+头部厂商全线涨价20%-40%+云厂商限购→供需缺口驱动涨价
    evidence_sources:
    - B300租赁价格
    - 优刻得/网宿/首都涨价公告
    - 阿里云/腾讯云涨价信息
  - step: 4
    name: 商业模式升级
    question: 算力租赁公司能否从收租升级为平台？
    UP_logic: 固定收租→参与token分成+模型服务收费，CoreWeave已谈成分成，国内头部推进中
    evidence_sources:
    - CoreWeave案例
    - 国内大模型公司动态
  - step: 5
    name: 财务重估逻辑
    question: 设备残值重估能否改善财务？
    UP_logic: 账面残值15% vs 真实经济价值70%→融资成本下降→净利率中枢上移
    evidence_sources:
    - 会计折旧数据
    - 机构预测数据
  risk_factors:
  - 地缘政治升级导致全球风险偏好受压
  - H200供给放量或国产算力超预期导致算力通胀缓解
  - 纯概念公司无真实业绩暴雷
  - 市场风格切换至非AI板块
  source_raw:
  - sources/raw/财经/视频：26-04-14：2026年AI产业深度研究：从AIDC建设拐点到算力租赁重估.md
- pattern_id: tech_breakdown_to_investment_chain
  name: 技术突破拆解与产业链传导
  description: 从单一技术突破（如昇腾950）出发，拆解其三层产业意义，并据此推导出八大受益环节的投资逻辑。
  applicable_themes:
  - 半导体设备材料
  - AI基础设施
  - 新能源技术
  - 任何由技术突破驱动的产业链分析
  reasoning_chain:
  - step: 1
    name: 识别技术拐点信号
    question: 当前产业中，哪个技术或产品事件是关键的、非线性的拐点信号？
    UP_logic: 从DeepSeek V4与昇腾950超节点的组合中，提取出‘超节点、价格下调、批量上市’三个关键词，认为它们分别对应了性能、经济性和交付三大门槛的跨越。
    evidence_sources:
    - 公司公告（如DeepSeek价格说明）
    - 产品发布信息
  - step: 2
    name: 拆解三层产业意义
    question: 这个技术突破对产业链各环节分别意味着什么？
    UP_logic: 从三个层面拆解：1) 解决单卡性能不足，放大对基础设施需求；2) 对先进封装提出集中需求，拉动上游设备和材料；3) 高度自主可控，将需求传导至国产供应链。
    evidence_sources:
    - 产业逻辑推演
    - 技术原理分析
  - step: 3
    name: 寻找产业链验证信号
    question: 是否有下游或上游的财务/经营数据，能验证这个技术突破带来的需求是真实存在的？
    UP_logic: 引用4月年报和一季报数据：算力租赁公司业绩超预期、半导体材料业绩集体超预期，作为‘需求真实存在’和‘制造链条景气兑现’的验证信号。
    evidence_sources:
    - 上市公司年报/一季报
    - 行业景气度数据
  - step: 4
    name: 推导受益环节与逻辑
    question: 基于上述分析，产业链上哪些具体环节会受益？受益的逻辑是什么？
    UP_logic: 根据技术突破（全液冷、高速背板、全光互联）和产业意义，推导出八大受益环节（设备、封装、材料、散热、互联、光通信、存储、电源），并为每个环节明确其受益逻辑和景气周期。
    evidence_sources:
    - 技术规格书
    - 产业链调研
    - 行业专家访谈
  risk_factors:
  - 技术路线被颠覆（如出现更优的互联架构）
  - 国产化进程不及预期（如关键设备/材料无法突破）
  - 下游需求证伪（如AI应用落地缓慢，算力需求萎缩）
  confidence_indicators:
  - 关键环节（如光刻、散热）出现批量订单
  - 产业链公司业绩持续超预期
  - 技术突破被更多下游客户采用和验证
  source_raw:
  - sources/raw/财经/视频：26-05-13：国产算力产业链与Token经济学，昇腾950拐点，Token工厂商业模式跃迁.md
- pattern_id: sector_rotation_priority
  name: 板块轮动优先级排序法
  description: 通过催化强度、业绩确定性、资金风格和风险收益比，对多个板块进行优先级排序的推理模式
  applicable_themes:
  - 板块轮动分析
  - 主线判断
  - 仓位配置
  reasoning_chain:
  - step: 1
    name: 识别催化强度
    question: 各板块有哪些近期催化剂？
    UP_logic: 从海外进展（如Neuralink量产）和国内事件（如太空实验）中提取催化信号，判断板块热度来源
    evidence_sources:
    - 海外公司公告
    - 国内科研进展
    - 政策文件
  - step: 2
    name: 评估业绩确定性
    question: 板块内公司是否有业绩兑现支撑？
    UP_logic: 优先选择有涨价逻辑（如存储价格上调100%）或业绩线（如六氟磷酸锂）的板块，排除纯概念炒作
    evidence_sources:
    - 行业价格数据
    - 公司财报预告
    - 券商研报预期
  - step: 3
    name: 判断资金风格
    question: 当前市场偏好容量标的还是连板小票？
    UP_logic: 观察连板高度是否受限（如神剑股份止步8板），容量标的是否持续走强（如中国卫星、蓝色光标），确认风格切换
    evidence_sources:
    - 涨停板高度统计
    - 成交额排名
    - 龙虎榜数据
  - step: 4
    name: 评估风险收益比
    question: 各板块的接力难度和回撤风险如何？
    UP_logic: 对量化驱动的板块（如脑机接口）提示隔日接力高风险，优先布局前排核心标的；对降温板块（如商业航天）关注回流机会
    evidence_sources:
    - 历史板块回撤数据
    - 量化资金参与度
    - 板块内部分化程度
  - step: 5
    name: 综合排序
    question: 如何排列板块优先级？
    UP_logic: 综合催化强度、业绩确定性、资金风格和风险收益比，给出AI产业链>脑机接口>商业航天>六氟磷酸锂>机器人>医药的排序
    evidence_sources:
    - 以上各步骤汇总
  risk_factors:
  - 催化事件低于预期或落空
  - 市场风格突然切换回连板小票
  - 板块内核心标的业绩暴雷
  confidence_indicators:
  - 多个独立催化剂同时出现
  - 业绩线标的持续超预期
  - 容量标的获得流动性溢价且连板高度持续受限
  source_raw:
  - sources/raw/财经/复盘：26-01-05：核心板块拆解，脑机AI商业航天优先级.md
- pattern_id: wave_theory_time_space_lock
  name: 波浪理论时空锁定法
  description: 利用波浪理论中时间和空间只需锁定一个确定项的原则，判断B浪反弹和C浪下跌的节奏与目标位
  applicable_themes:
  - 大盘指数波浪分析
  - ABC调整浪结构预判
  - 反弹与下跌节奏推演
  reasoning_chain:
  - step: 1
    name: 识别当前浪型阶段
    question: 当前市场处于ABC调整浪的哪个子浪？
    UP_logic: 通过A浪下杀流畅度、当日阳线支撑、W底形态判断A浪基本结束，即将开启B浪反弹
    evidence_sources:
    - 上证指数日K线走势
    - 分时图下杀流畅度对比
  - step: 2
    name: 锁定时间或空间
    question: B浪和C浪中哪个变量可确定？
    UP_logic: B浪空间可确定（约4200点），时间不确定；C浪时间可确定（6月中下旬结束），空间不确定。原则：时间和空间只需锁定一个确定项
    evidence_sources:
    - 波浪理论标准结构
    - 历史ABC调整浪幅度统计
  - step: 3
    name: 推演后续浪型目标
    question: 基于锁定项推演另一变量的可能范围？
    UP_logic: B浪反弹目标约4200点（不破前高），若放量突破则结构失效；C浪下跌幅度将超过4100点，关键支撑4080点，跌破则下探缺口
    evidence_sources:
    - 前高压力位
    - 关键支撑位4080点
    - 缺口位置
  - step: 4
    name: 结合量价验证拐点
    question: 当前拐点信号是否可靠？
    UP_logic: 第二个W底形态成功率高于第一个，叠加英特尔盘前上涨，拐点概率增大；反弹强度需观察能否重新站回4180点
    evidence_sources:
    - W底形态重复出现
    - 外围市场英特尔盘前走势
  risk_factors:
  - B浪反弹若放量突破前高，则ABC结构失效，需重新定性浪型
  - C浪空间不确定，若跌破4080点后加速下杀，黄金坑可能更深
  - B浪持续时间不确定，若反弹时间过短可能无法有效建仓
  confidence_indicators:
  - 当日阳线且下杀不流畅，下方支撑较强
  - 第二个W底形态出现，成功率高于第一个
  - 英特尔盘前企稳上涨，外围情绪配合
  source_raw:
  - sources/raw/财经/复盘：26-05-18：B站视频复盘-大盘将迎来反弹.md
- pattern_id: ai_industry_chain_resonance
  name: AI全产业链共振分析
  description: 通过识别AI产业链各环节（上游算力→中游模型→下游应用）的轮动完成度，判断主线高潮与分化节奏
  applicable_themes:
  - AI算力
  - 半导体产业链
  - 新能源产业链
  - 机器人产业链
  reasoning_chain:
  - step: 1
    name: 识别全链条轮动
    question: 产业链各分支（上游/中游/下游）是否都已轮动到位？
    UP_logic: 从上游IDC/芯片→中游大模型→下游应用，所有分支全部轮动到位，视为共振高潮信号
    evidence_sources:
    - 板块涨幅排名
    - 涨停个股分布
    - 行业新闻
  - step: 2
    name: 观察龙头强度
    question: 龙头股是否出现连续一字板或超强走势？
    UP_logic: 龙头连续一字板（如大位科技）+港股模型股4天翻倍，说明资金高度集中，是高潮特征
    evidence_sources:
    - 龙头股K线形态
    - 封单量
    - 港股联动
  - step: 3
    name: 区分风格切换
    question: 涨停板结构是否从情绪炒作转向产业逻辑？
    UP_logic: 2板几乎全是赛道股（产业逻辑+业绩预期），跌停板是纯情绪标的，说明大势转向景气主线
    evidence_sources:
    - 涨停板个股属性分析
    - 跌停板个股属性分析
  - step: 4
    name: 推演分化节奏
    question: 高潮后是直接兑现还是良性分化？
    UP_logic: 高潮后必然分化，但分化≠结束，往往是主线确立后的第一次换手，需观察次日AI是否崩盘
    evidence_sources:
    - 历史主线高潮后走势
    - 次日开盘表现
    - 龙头股承接
  risk_factors:
  - 次日AI板块直接大幅兑现（短线资金冲顶）
  - 情绪股回暖但AI分化崩盘
  - 缺乏新的大级别宏观催化
  confidence_indicators:
  - 龙头继续强势且板块分化不崩
  - 情绪股回暖+AI分化良性
  - 产业链出现涨价/订单等基本面催化
  source_raw:
  - sources/raw/财经/晚间复盘：26-02-12：风格切换，AI全产业链高潮，节前押宝假期发酵，智谱千亿市值.md
- pattern_id: sector_attack_formation_qualify
  name: 板块建制进攻判定法
  description: 通过产业消息、扩产逻辑、板块阵型、容量中军四要素判定板块是否具备建制进攻能力，并结合指数共振判断持续性
  applicable_themes:
  - 科技产业链
  - 半导体扩产
  - 新能源产业链
  - 军工产业链
  reasoning_chain:
  - step: 1
    name: 识别产业催化
    question: 板块是否有明确的产业层面新变化（非单纯消息刺激）？
    UP_logic: 长鑫扩产带来产业新变化，上游设备和材料同步共振，不是简单消息刺激
    evidence_sources:
    - 产业新闻
    - 公司公告
    - 行业调研
  - step: 2
    name: 检查板块阵型
    question: 板块是否具备完整的进攻阵型（一字板、涨停、容量中军）？
    UP_logic: 有一字板（合肥城建、上峰水泥）、上游核心涨停（深科技、雅克科技）、容量中军（兆易创新），十余只涨停
    evidence_sources:
    - 开盘封单
    - 涨停板数量
    - 中军走势
  - step: 3
    name: 评估指数共振
    question: 板块进攻是否带动指数共振？共振时长和力度如何？
    UP_logic: 早盘一度带着指数共振修复，但共振时间不长（约半小时），资金跟进力度不足
    evidence_sources:
    - 分时图
    - 量能变化
    - 指数走势
  - step: 4
    name: 判断持续性条件
    question: 板块能否从新生启动升级为阶段主线？需要哪些条件？
    UP_logic: 需要前排封单不减弱、中军承接不弱、指数放量回升共振，否则只是混沌轮动中的一次强势修复
    evidence_sources:
    - 封单变化
    - 中军承接
    - 指数量能
  risk_factors:
  - 指数无法形成情绪拐点共振
  - 中军承受抛压导致板块分歧后修复质量差
  - 量能持续缩减资金跟进不足
  confidence_indicators:
  - 板块有产业层面新变化而非单纯消息
  - 板块阵型完整（一字+涨停+中军）
  - 指数放量共振且共振时间延长
  source_raw:
  - sources/raw/财经/午盘：26-05-18：长鑫产业链新生启动，指数共振乏力待观察.md
- pattern_id: extreme_sentiment_rotation_qualify
  name: 极端情绪均值回归推演
  description: 从情绪极端回暖出发，推演短期均值回归概率，并预设强者恒强与风格切换两种情景下的应对策略
  applicable_themes:
  - 短线情绪周期
  - 题材轮动
  - 涨停板博弈
  reasoning_chain:
  - step: 1
    name: 情绪极端量化
    question: 当前市场情绪是否处于极端水平？
    UP_logic: 用集合竞价涨停数（16只，1/13以来新高）和国投白银LOF开板作为情绪极端回暖的客观证据
    evidence_sources:
    - 集合竞价涨停家数
    - LOF折溢价状态
  - step: 2
    name: 极端到极端推演
    question: 从上周五集体炸板到昨日全面爆发，这种跳跃是否可持续？
    UP_logic: 从极端冰点直接跳到极端高潮，中间缺少温和过渡，大概率会发生均值回归
    evidence_sources:
    - 上周五炸板率
    - 昨日涨停家数变化
  - step: 3
    name: 双情景预设
    question: 如何应对两种可能走势？
    UP_logic: 参考脑机接口阶段经验：若强者恒强则优先20cm短期利润；若均值回归则关注新强势题材切换机会
    evidence_sources:
    - 脑机接口历史走势
    - 商业航天/AI应用切换案例
  risk_factors:
  - 情绪持续亢奋不回归，导致预设的均值回归策略踏空
  - 新题材切换失败，资金回流旧主线
  confidence_indicators:
  - 集合竞价涨停数持续新高
  - AI应用端一字板数量维持高位
  source_raw:
  - sources/raw/财经/早盘：26-02-10：上证5连阳，Seedance2.0视频模型，铟价涨88%.md
- pattern_id: bom_value_increment_chain
  name: BOM价值增量传导链
  description: 从下一代AI服务器机柜BOM价值增幅出发，筛选零部件环节中价值量提升最大的方向，再结合盘面验证锁定核心标的。
  applicable_themes:
  - AI硬件产业链
  - 服务器升级周期
  - 电子元器件涨价
  - 科技硬件BOM分析
  reasoning_chain:
  - step: 1
    name: BOM价值增幅排序
    question: 下一代产品相比上一代，哪些零部件环节价值量增幅最大？
    UP_logic: 引用摩根士丹利拆解数据，列出Rubin/VR200机柜各零部件价值增幅，排序找出PCB(+233%)、MLCC(+182%)等增幅最大的环节。
    evidence_sources:
    - 摩根士丹利拆解报告
    - 机柜售价对比数据
  - step: 2
    name: 价值提升归因
    question: 该环节价值量提升的具体技术原因是什么？
    UP_logic: 对增幅最大的环节进行技术归因：PCB因层数升级和新增模块，MLCC因单柜用量提升30%以上，并列出具体升级细节。
    evidence_sources:
    - PCB层数变化数据
    - MLCC用量对比数据
  - step: 3
    name: 映射核心标的
    question: 该环节中哪些A股公司是核心受益标的？
    UP_logic: 根据环节属性，列出对应A股龙头标的，如PCB方向鹏鼎控股、深南电路，MLCC方向风华高科、三环集团。
    evidence_sources:
    - 行业公司名单
    - 市场认知
  - step: 4
    name: 盘面验证信号
    question: 如何通过盘面表现验证该方向是否被资金认可？
    UP_logic: 设定多个观察指标：龙头股能否封板、千亿市值公司能否保持强势、20cm标的表现、错杀股能否主动修复，综合判断主线强度。
    evidence_sources:
    - 盘面实时数据
    - 个股走势
  risk_factors:
  - 核心标的无法持续封板或冲高回落
  - 大盘系统性风险导致资金撤离
  - 产品量产或出货节奏不及预期
  confidence_indicators:
  - 龙头股连续封板且板块内多只个股跟涨
  - 大市值趋势股保持强势
  - 20cm标的提供弹性
  - 错杀股主动修复转为进攻
  source_raw:
  - sources/raw/财经/2026-05-25-早盘-指数反弹与AI硬件国产算力.md
- pattern_id: sector_dual_core_reversal
  name: 双核心分歧反包验证法
  description: 通过观察双核心板块在分歧日后的反包结构、情绪高度和防御方向联动，判断调整是否结束并指导仓位操作。
  applicable_themes:
  - 科技主线分歧修复
  - 板块轮动节奏判断
  - 情绪与指数背离分析
  reasoning_chain:
  - step: 1
    name: 定性分歧性质
    question: 板块回落是正常休整还是逻辑证伪？
    UP_logic: 科技回落是对昨日大涨的正常消化，是节奏内休整，不是逻辑证伪，后续按主线回流处理。
    evidence_sources:
    - 板块内部亏钱效应
    - 中军个股主动性
  - step: 2
    name: 观察反包结构
    question: 分歧日后的反包结构是否兑现？
    UP_logic: PCB和华为韬定律今日分歧，正常节奏应存在反包结构，若率先反包则调整近尾声。
    evidence_sources:
    - 板块指数走势
    - 龙头个股次日表现
  - step: 3
    name: 验证情绪高度
    question: 连板高度是否突破压制？
    UP_logic: 连板高度被压制至3板是调整未结束信号，出现4板以上龙头且板块联动好，才说明调整结束。
    evidence_sources:
    - 连板高度统计
    - 板块联动强度
  - step: 4
    name: 检查防御联动
    question: 防御方向与主线修复是否同步？
    UP_logic: 尾盘周期与大金融同步加强，若防御继续走强且与主线共振，则行情偏均衡；若防御加强而主线回落，需警惕资金撤退。
    evidence_sources:
    - 周期股表现
    - 大金融板块走势
  risk_factors:
  - 双核心均未反包，调整时间延长
  - 情绪端持续被压制，指数回升但行情未切换
  - 防御方向加强而主线再次回落，资金从主线撤退
  confidence_indicators:
  - 率先反包成功且板块联动强
  - 出现4板以上高度龙头
  - 防御方向与主线共振走强
  source_raw:
  - sources/raw/财经/动态复盘：26-05-26：双核心分歧修复，PCB与韬定律反包观察.md
- pattern_id: rubin_bom_diffusion_chain
  name: Rubin BOM扩散推理链
  description: 从英伟达Rubin平台架构升级出发，逐层推导PCB、材料、设备、耗材等BOM环节的价值量变化与投资机会
  applicable_themes:
  - AI硬件升级
  - 半导体设备材料
  - 电子元器件涨价
  reasoning_chain:
  - step: 1
    name: 架构升级识别
    question: 新AI平台相比上一代有哪些关键架构变化？
    UP_logic: 从Rubin平台正交背板、高层数PCB替代铜缆等架构变化出发，识别硬件密度提升的核心驱动
    evidence_sources:
    - 英伟达GTC大会信息
    - Rubin/Rubin Ultra平台技术文档
  - step: 2
    name: BOM价值量推导
    question: 架构升级如何改变各环节的价值量？
    UP_logic: 架构升级→PCB层数/厚度/材料等级提升→单台服务器PCB价值量提升超两倍，并带动MLCC、超级电容等被动元件需求
    evidence_sources:
    - PCB产业数据
    - MLCC行业报告
    - 超级电容市场调研
  - step: 3
    name: 工艺瓶颈定位
    question: 价值量提升后，哪些工艺环节成为瓶颈？
    UP_logic: PCB层数/硬度提升→钻孔难度增加→分段钻工艺普及→钻针消耗量上升；线路精度提升→mSAP工艺→LD曝光/图形电镀设备需求增加
    evidence_sources:
    - PCB制造工艺资料
    - 设备厂商调研
    - 钻针行业数据
  - step: 4
    name: 材料升级筛选
    question: 哪些材料因性能要求提升而受益？
    UP_logic: 高速高频需求→M9材料替代M8→碳氢树脂用量大幅提升（PPO:碳氢从2:1反转为1:2）→绑定CCL厂商的材料供应商受益
    evidence_sources:
    - 覆铜板材料配方数据
    - 东材科技公告
    - CCL厂商供应链信息
  - step: 5
    name: 涨价扩散验证
    question: AI需求是否引发全品类涨价？
    UP_logic: AI需求挤占高端产能→供给刚性约束→PCB高端板紧缺、光纤价格涨超400%、存储价格上行→涨价向材料/设备/耗材/互联/散热扩散
    evidence_sources:
    - 光纤现货价格数据
    - 存储行业报价
    - PCB供需报告
  risk_factors:
  - Rubin平台出货量不及预期
  - 高端PCB产能扩张超预期导致供需逆转
  - 材料验证周期过长导致订单延迟
  confidence_indicators:
  - 英伟达官方确认Rubin平台时间表
  - PCB/MLCC等环节出现连续涨价
  - 主流CCL厂商开始批量采购M9材料
  source_raw:
  - sources/raw/财经/动态：26-05-24：缩量修复超预期，Rubin BOM扩散与退潮尾声.md
- pattern_id: event_driven_rhythm_change
  name: 事件驱动节奏改变模型
  description: 识别因突发利好改变原有调整节奏的板块，并通过对比同类催化剂的后续表现，推演其短期走势和操作应对。
  applicable_themes:
  - 半导体
  - PCB
  - 消费电子
  - AI硬件
  - 华为产业链
  reasoning_chain:
  - step: 1
    name: 识别原有节奏
    question: 该板块在利好出现前，其内在的、预期的运行节奏是什么？
    UP_logic: 识别板块因“一致性太高”和“批量减持”等因素，原本存在“调整预期”。
    evidence_sources:
    - 市场情绪指标
    - 资金流向
    - 公司公告（减持）
  - step: 2
    name: 识别新催化变量
    question: 是什么突发利好改变了原有的运行节奏？
    UP_logic: 识别出“华为新技术”或“Rubin”等突发产业技术催化，作为改变原有调整节奏的新变量。
    evidence_sources:
    - 产业新闻
    - 公司公告
    - 技术发布会
  - step: 3
    name: 对比同类催化节奏
    question: 历史上或近期，由同类催化（新技术/新平台）驱动的板块，在利好发酵后次日表现如何？
    UP_logic: 将今日的“半导体+华为新技术”与上周五的“PCB+Rubin”进行对比，指出PCB已经出现“高开低走”，以此推演半导体次日可能面临类似风险。
    evidence_sources:
    - 板块K线图
    - 分时图
    - 历史走势复盘
  - step: 4
    name: 评估催化兑现周期
    question: 这个新催化剂的产业兑现周期是长还是短？
    UP_logic: 判断“华为新技术”需要“几年之后才能实现”，比“Rubin”的兑现周期更长，因此短期资金更多是“交易预期”，持续性存疑。
    evidence_sources:
    - 产业技术路线图
    - 产品发布计划
  - step: 5
    name: 设定关键验证条件
    question: 在什么条件下，这个由事件驱动的上涨才能延续？
    UP_logic: 提出“大盘能稳稳站上4170”作为半导体短线强度延续的关键外部条件，并对此表示怀疑。
    evidence_sources:
    - 大盘指数点位
    - 成交量
  risk_factors:
  - 利好发酵后次日承接不足，出现高开低走或冲高回落。
  - 大盘指数未能有效站上关键点位，无法提供支撑。
  - 催化剂兑现周期过长，导致短期情绪快速消退。
  confidence_indicators:
  - 同类催化板块在次日表现出持续承接，而非高开低走。
  - 大盘指数有效突破并站稳关键点位。
  - 催化事件有后续进展或更明确的产业落地信号。
  source_raw:
  - sources/raw/财经/午盘补发：26-05-25：保持思考.md
- pattern_id: post_holiday_repair_qualify
  name: 节后修复主线确认法
  description: 从节前极致冰点数据出发，结合假期外围表现与催化事件，筛选节后修复主线板块的推理流程
  applicable_themes:
  - 节后行情预判
  - 主线板块筛选
  - 修复行情策略
  reasoning_chain:
  - step: 1
    name: 冰点确认
