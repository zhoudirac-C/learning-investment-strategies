  statement: 个股调整时间越长、跌幅越充分，出现看涨吞没后反转的安全性越高、越值得介入。A级看涨吞没的标准是调整超过15个交易日且跌幅超过25%。厦门物业案例调整两个半月（约50个交易日）、跌幅36%，A级信号安全性极高。
  evidence_quote: 个股调整时间越长，跌幅越充分，出现看涨吞没后反转的安全性越高，越值得介入。A级看涨吞没：调整时间超过15个交易日，跌幅超过25%。厦门物业从3月到5月调整两个半月，跌幅达到36%。
  interpretation: 逻辑：调整越充分→套牢盘洗得越干净→抛压越小→反转阻力越小。实际操作中，调整时间和跌幅需要结合市场周期（牛/熊/震荡）灵活判断，但基本原则是"时间换空间"。
