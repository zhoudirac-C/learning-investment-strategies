subject: 底部确认两条件——阵型完整+大资金强度
timeframe: permanent
statement: "真正的底部企稳需要满足两个结构条件：①共振领涨板块具备完整阵型（中军+先锋主升结构，而非普涨超跌反弹）；②大资金进攻强度足够（成交额前20标的中出现明显主动强势品种）。普涨但无进攻结构=报复性情绪修复，不是底部确认。底线：底部不会一蹴而就，后续大概率多空反复争夺，等第二只脚确认才安全。"
evidence_quote: "普涨之下未形成强有效进攻结构：核心领涨方向缺乏完整板块阵型，大容量中军进攻力度偏弱。本次反弹=利好驱动情绪修复，非市场止跌企稳明确信号。真正企稳反转需两大结构验证：①共振领涨板块阵型完整性②大资金进攻强度（成交额前20标的中看不到明显主动强势品种）。趋势下跌中的底部不会一蹴而就→后续大概率多空反复争夺定价权。"
interpretation: "UP提出底部确认的量化标准（尽管量化程度有限，但方向明确）：不是看指数涨了多少，而是看涨的是什么、怎么涨。普涨+超跌反弹=假底部；板块阵型完整+大资金强势=真底部。这首次将'进攻结构'的概念从板块分析提升到市场底部判断的高度，是后来market-cycle-framework中修复判断体系的直接前身。"
