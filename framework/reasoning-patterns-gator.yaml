  description: 鳄鱼派（gator school）第17章：三类钱：认知体系总纲。 **增量资金传导链**：放水 → 银行/国债 → 第一批=金融机构、企业、杠杆资金 → 大涨后第二批=股民基民跑步进场 → 几股传花 → 机构途中止盈但横盘不掉头 → **增量枯竭 = 牛市结束**（2020-21 例；2022 美元 4% vs 国内 2.75% 外资搬家的利率逻辑）。 **机构六大类**：龙队/公募/私募/险资/外资/其他资管。公募占比最多**最不稳定**——基民集中赎回→基金被动砍仓→越跌越赎的负反馈，此时基本面再好也没用（医药 2020-21 抱团瓦解例）。机构的政策驱动 用于鳄鱼派资金生态位与规则体系的判断。
