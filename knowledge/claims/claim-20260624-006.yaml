  subject: 国产算力缺芯主线需更加重视
  timeframe: trend
  statement: 国内AI与算力产业链的核心薄弱点是"缺芯"，后市对国产算力产业链要更加重视。这契合"指数定环境·板块定方向·个股定时点"框架：环境偏暖、方向锁定国产算力，剩下是个股时点问题。此轮科技反弹集中在AI硬件上游物料（电子布、铜箔、四氯化硅、磷化铟衬底），多数辨识度标的完成反包。
  evidence_quote: 国内在AI与算力产业链上的薄弱点也非常明确——缺芯。因此后市对国产算力产业链这一块要更加重视，这也契合"指数定环境·板块定方向·个股定时点"的框架：环境偏暖、方向锁定国产算力，剩下的是个股时点问题。板块层面，科技迎来大面积修复，且修复力度相当不错，多数辨识度标的完成反包。算力硬件方面，存储、PCB、光通信、MLCC概念震荡反弹——其中存储受三星电子大涨刺激掀起涨停潮，其余分支的上涨集中在电子布、铜箔、四氯化硅、磷化铟衬底等上游物料。
  interpretation: UP明确了当前的核心主线：①缺芯是国内AI算力的最薄弱环节，也是国产替代的核心驱动力；②方向从模糊的"科技"收窄为明确的"国产算力产业链"；③本轮科技反弹的资金流向清晰——集中在AI硬件上游物料（铲子逻辑），而非普涨。这是"方向锁定"级别的判断，为后续择股提供了明确的产业锚点。
