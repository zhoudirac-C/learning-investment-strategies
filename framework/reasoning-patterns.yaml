  - pattern_id: sector_rotation_catchup_20260106
    name: 题材定位与补涨预期差分析
    source_raw:
    - sources/raw/财经/早盘：26-01-06：60分钟钝化，商业航天缩容，脑机补涨固态回归.md
    key_themes:
    - 板块轮动
    - 补涨扩散
    - 题材持续性
    - 预期差
    - 量能情绪
    reasoning_chain:
    - step: 1
      name: 定市场量能环境
      question: 当前是缩量轮动还是放量延续？
      UP_logic: 以盘中成交额承接判断：强势量能支撑是上涨核心；缩量环境属轮动，放量环境具备延续性。
      evidence_sources:
