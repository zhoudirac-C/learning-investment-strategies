  elasticity: core
current_stage: 阶段2-加速期
stage_confidence: 高
stage_evidence: DRAM现货价持续上涨；HBM SK海力士超2/3订单；长江存储科创板已受理
timing:
  current_recommendation: 上游设计（兆易）+中游封测（太极/深科技），不追高
  next_trigger: 长江存储IPO过会→估值重估
  risk: DRAM价格见顶回落
tracking_metrics:
- metric: DRAM现货价
  current: 上涨中
  signal_direction: 持续上涨=确认
  source: 研报/期货
- metric: 长江存储IPO进度
  current: 科创板已受理
  signal_direction: 过会=加强
  source: 公告
- metric: HBM产能
  current: SK海力士超2/3订单
  signal_direction: 扩产=加强
  source: 研报
- metric: 存储模组出货量
  current: 放量中
  signal_direction: 持续放量=确认
  source: 研报
- metric: 长鑫存储扩产/国产DRAM份额
  current: 扩产推进中，研报提示国产替代窗口期已至
  signal_direction: 扩产加速/份额提升=加强；扩产不及预期=削弱
- metric: ABF载板交期
  current: 拉长
  signal_direction: 交期进一步拉长=加强（封测材料紧缺度上升）；交期回归=警惕需求见顶
falsification:
- DRAM现货价连续2周回落
- 长江存储IPO撤回或无限期推迟
- 大盘系统性破位下行
- 存储板块核心标的（兆易/太极）放量滞涨、联动失效
chain_relations:
- target: ai-server
  relation: 下游需求来源
  note: AI服务器HBM需求驱动存储涨价
- target: domestic-compute
  relation: 上游供给
  note: 长江存储扩产受益国产存储链
