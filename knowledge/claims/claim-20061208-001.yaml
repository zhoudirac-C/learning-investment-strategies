  subject: 趋势力度与背驰判断
  topic: 没有趋势没有背驰，用前后两吻间均线面积比较力度判断背驰
  statement: 没有趋势，没有背驰；在盘整中无所谓背驰。缠中说禅趋势力度：前一吻的结束与后一吻开始由短线均线与长期均线相交所形成的面积。在前后两个同向趋势中，当缠中说禅趋势力度比上一次要弱，就形成背驰。该办法最稳妥，缺点是必须等再次接吻后才能判断，走势离真正转折点已有一点距离。解决办法一：看低一级别的图找出相应转折点。解决办法二：用缠中说禅趋势平均力度（当下与前一吻结束时两均线形成的面积除以时间）即时判断，本次比上次弱则背驰即将形成，再根据两均线的距离延伸长度缩短判断底部马上形成，此法能基本同步抓住转折点，但风险稍大、技巧要求高。所有判断只关系到两条均线与走势，和任何技术指标无关。
  evidence_quote: 必须注意：没有趋势，没有背驰。在盘整中是无所谓“背驰”的，这点是必须特别明确的……称为缠中说禅趋势力度：前一“吻”的结束与后一“吻”开始由短线均线与长期均线相交所形成的面积。在前后两个同向趋势中,当缠中说禅趋势力度比上一次缠中说禅趋势力度要弱，就形成“背驰”。
  interpretation: 背驰的第一个严格定义：用均线包围面积量化趋势力度，同向两段比较，力度衰减即背驰。两个改进方法对应稳妥与即时的权衡。盘整中无背驰是适用范围的红线，盘整中的类似判断要到第24课才以盘整背驰之名给出。
