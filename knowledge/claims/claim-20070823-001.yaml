  subject: 获利机会的绝对分类
  topic: 任何市场获利机会只有中枢上移与中枢震荡两种，短差机会只存在于中枢震荡
  statement: 在缠论下，任何市场的获利机会都有一个最明确的分类，只有两种：中枢上移与中枢震荡。中枢上移意味着该级别的上涨走势，其中不存在任何理论上的短差机会，除非上移结束进入新中枢的形成与震荡；中枢震荡就是短差的理论天堂，只要在任何中枢震荡向上的离开段卖点区域走掉，必然有机会在其后的中枢震荡中回补回来。回补唯一需要的技术要求是对第三类买点的判断：出现第三类买点不回补，可能错过一次新的中枢上移，但还有相当的机会是进入更大的中枢震荡，那样回补的机会还是绝对的。
  evidence_quote: 任何市场的获利机会，在本ID 理论下，都有一个最明确的分类，用本ID 理论的语言来说，只有两种：中枢上移与中枢震荡……在你的操作级别下，中枢上移中，是不存在着任何理论上短差机会的，除非这种上移结束进入新中枢的形成与震荡。而中枢震荡，就是短差的理论天堂。只要在任何的中枢震荡向上的离开段卖点区域走掉，必然有机会在其后的中枢震荡中回补回来，唯一需要一定技术要求的，就是对第三类买点的判断。
  interpretation: 这条分类把短差从经验技巧变成定理：短差的存在性不依赖盘感而依赖中枢形态。作者明言短差做不好的根因是中枢没分清楚、级别没搞懂、第三类买点糊涂。多级别纵向比较时，大级别中枢的位置决定小级别上涨是回拉遇阻还是离开被反拉。
