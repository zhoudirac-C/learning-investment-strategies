  subject: 趋势背驰的中枢位置
  topic: 趋势背驰至少发生在第二个中枢之后，日线以上级别占九成以上
  statement: 趋势一定有至少两个同级别中枢。对于背驰来说，肯定不会发生在第一个中枢之后，肯定至少是第二个中枢之后；第二个中枢后就产生背驰的情况占了绝大多数，特别在日线以上的级别几乎达到90%以上，因此日线以上级别出现第二个中枢就要密切注意背驰的出现。小级别如1分钟中该比例稍小但也占大多数。四五个中枢以后才出现背驰的都相当罕见。
  evidence_quote: 趋势，一定有至少两个同级别中枢，对于背驰来说，肯定不会发生在第一个中枢之后，肯定是至少是第二个中枢之后……特别在日线以上的级别，这种就几乎达到90%以上，因此，如果一个日线以上级别的第二个中枢，就要密切注意背驰的出现。
  interpretation: 给出背驰监控的启动条件：第一个中枢之后不必警惕背驰，第二个中枢形成后进入背驰警戒区。90%是作者的经验统计而非逻辑定理，级别越小可靠性越下降，延伸趋势的极端情况理论上可在第100个中枢后才背驰。
