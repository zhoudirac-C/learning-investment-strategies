    reasoning_chain:
    - step: 1
      name: 识别催化事件
      question: 什么事件可能改变板块预期？
      UP_logic: 中际旭创一季报炸裂成为最大变量，视为板块新催化。
      evidence_sources:
      - 中际旭创一季报
    - step: 2
      name: 验证市场反应
      question: 事件后股价表现是否验证利好有效？
      UP_logic: 未走高开低走，反而高位横盘稳住军心，说明资金承接强。
      evidence_sources:
      - 开盘走势
      - 盘口抛压
    - step: 3
      name: 检查板块共振
      question: 是否有二线标的同步走强形成合力？
      UP_logic: 剑桥科技、光迅科技等二线快速大涨，推动板块正向循环。
      evidence_sources:
      - 剑桥科技
      - 光迅科技
      - 板块涨幅
    - step: 4
      name: 判定行情级别
      question: 板块行情是普通反弹还是扩展级别？
      UP_logic: 板块梯队完整（核心/中军/补涨/上游），合力充足，确立扩展级别行情。
      evidence_sources:
      - 东山精密
      - 中际旭创
      - 科瑞技术
      - 天通科技
    - step: 5
      name: 推导扩散路径
      question: 后续产业链内部如何分化和轮动？
      UP_logic: 一季报落地后CPO强于光模块，上游设备和材料同步补涨，PCB、电子布配套扩散。
      evidence_sources:
      - 板块历史走势
      - 业绩释放节点
    risk_factors:
    - 一季报落地后利好兑现，资金借机出货
    - 高开低走或板块指数冲高回落，正向循环被打破
    - 二线补涨标的无法持续涨停，梯队断裂
    confidence_indicators:
    - 核心龙头高开横盘而非低走，显示抛压可控
    - 二线标的大涨形成板块共振，而非孤军奋战
    - 板块梯队层次清晰，上游/材料/配套同步活跃，合力充足
    merge_suggestion: 业绩事件触发产业链传导，通过市场反应验证板块扩展级别
