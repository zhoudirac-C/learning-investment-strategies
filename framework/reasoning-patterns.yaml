  data_requirements:
  - name: 涨价函与渠道报价
    channel: 原厂公告 / 生意社等公开价格源 / 渠道调研
  - name: 交期与产能数据
    channel: 原厂产能公告 / 供应链调研
  - name: 下游需求结构
    channel: 行业研报 / 下游出货数据
  - name: 稼动率与扩产计划
    channel: 原厂公告 / 产业链调研
  - name: 技术规格对比
    channel: 产品规格书 / 研报
  - name: 历史周期数据（订单出货比/价格峰值/库存）
    channel: 历史研报 / 行业协会数据
  - name: 供货关系与营收占比
    channel: 公司公告 / 财报
  - name: 价格弹性测算
    channel: 财报 / 机构测算（毛利率对价格弹性）
  - name: 产业链环节与标的映射
    channel: knowledge/industry-chains / 机构供应链报告
  - name: 龙头量价与板块成交
    channel: 行情数据 / K线缓存（infra/data/kline_cache.db）
  steps:
  - step: 1
    name: 确认涨价/价值提升真实性
    question: 该环节是否出现真实的涨价信号或价值量提升？是结构性还是全面性？
    action: 核对原厂公告、涨价函、渠道报价与交期数据，至少两个独立来源同向才确认涨价为真；将驱动归类为需求爆发、产能转移造成的结构性缺口或技术升级带来的价值量提升三者之一
    data:
    - 涨价函与渠道报价
    - 交期与产能数据
  - step: 2
    name: 分析供需结构与驱动因素
    question: 涨价的底层驱动是什么？需求侧、供给侧还是技术升级？
    action: 拆解需求结构（AI/新能源/消费电子各自占比）、供给约束（产线兼容性、扩产周期、海外厂商退出）、技术变化（层数提升、材料升级）三重因素，判断主导驱动
    data:
    - 下游需求结构
    - 稼动率与扩产计划
    - 技术规格对比
  - step: 3
    name: 对比历史周期位置
    question: 当前处于历史周期的哪个阶段？与历史高点的差距有多大？
    action: 用订单出货比、稼动率、价格水平、库存周期四个指标对照历史数据，定位当前处于底部/启动/加速/见顶哪一阶段，并量化与历史高点的距离
    data:
    - 历史周期数据（订单出货比/价格峰值/库存）
    - 稼动率与扩产计划
  - step: 4
    name: 判断受益逻辑与标的映射
    question: 哪些环节和公司最受益？受益顺序和弹性如何排序？
    action: 按三条逻辑筛选受益标的——①高端承接（能吃下海外外溢需求）②上游供货（面向海外大厂）③弹性最大（产能占比大、对涨价敏感）；对照产业链知识库核对环节归属与供货关系
    data:
    - 供货关系与营收占比
    - 价格弹性测算
    - 产业链环节与标的映射
  - step: 5
    name: 判断持续性并给出操作建议
    question: 涨价/价值提升能持续多久？当前位置是否适合介入？
    action: 按扩产周期（通常6-9个月）、库存水平与龙头量价动向判断持续性；启动期可介入，加速期不追高，等分歧回踩确认
    data:
    - 稼动率与扩产计划
    - 历史周期数据（订单出货比/价格峰值/库存）
    - 龙头量价与板块成交
  falsification:
  - 现货价连续2周回落或原厂撤回涨价函（涨价被证伪）
  - 下游砍单、渠道库存从低位快速回补（需求证伪）
  - 大盘系统性破位下行或宏观流动性/产业政策重大转向
  - 板块核心标的放量滞涨、联动失效（情绪退潮）
  validation:
