  subject: 操作纪律与证据层级
  timeframe: permanent
  statement: 操作纪律仍围绕证据展开：盘中表现用于观察，持续性需要收盘与后续交易验证；利好消息要区分预期与落地，产业进展要区分认证、订单、交付和收入；原有逻辑失效时应重新评估风险承受能力与敞口，不以补仓摊薄成本替代基本判断。本文不设统一仓位比例、目标价或具体买卖时点。修复可以跟踪，反转需要确认；产业可以研究，业绩必须兑现。
  evidence_quote: 原有逻辑失效时，应重新评估风险承受能力与敞口，不以补仓摊薄成本替代基本判断。本文不设统一仓位比例、目标价或具体买卖时点。修复可以跟踪，反转需要确认；产业可以研究，业绩必须兑现
  interpretation: 四组证据层级（观察/持续性、预期/落地、认证/订单/交付/收入、逻辑失效→重估敞口）+'不以补仓摊薄成本替代基本判断'是仓位纪律底线。'修复可以跟踪，反转需要确认；产业可以研究，业绩必须兑现'是本篇的方法论金句。
