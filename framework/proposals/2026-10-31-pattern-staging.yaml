patterns:
  - pattern_id: strong_trend_stage_qualify
    name: 强趋势阶段与新鲜度资格框架
    description: 当一只已经上涨一段的强趋势标的出现震荡、回踩、信号反复或板块后排扩散，需要判断「这波走到哪、还能不能追、要不要取消资格」时使用。核心是把「趋势类型—所处阶段—信号新鲜度」三件事分开：早期看强度，后期看位置；信号重复次数越多、传播越广，边际效用越低。输出是参与资格（可追/只低吸/只滚动/取消），不是买卖指令。
    trigger:
      - 强趋势标的已上涨一段，出现高位震荡、连续回踩或突破不再流畅
      - 同一支撑或同一信号被反复验证三次以上，强度边际下降
      - 板块内后排批量补涨、低辨识度标的扩散、研报与媒体讨论显著增多
      - 老龙头滞涨而新标的正创新高，需要判断是否切换核心
    data_requirements:
      - name: 个股日K
        channel: 日K线（infra/data/kline_cache.db，含复权与前复权口径）
      - name: 板块指数
        channel: THS 板块指数日K（infra/data/board_kline）
      - name: 量能序列
        channel: VOL/AMO 日序列与 5/10/20 日均量基准
      - name: 传播扩散度
        channel: 研报标题与资讯计数（可选，用于新鲜度辅助判断）
    steps:
      - step: 1
        name: 定趋势类型与观察级别
        question: 这是脉冲、强趋势还是普通反弹？观察级别是短线还是中线？
        action: 用涨幅斜率、回撤幅度、量能结构区分脉冲与趋势；先定级别再谈阶段，级别不同则同一形态的处置不同
        data:
          - 个股日K
          - 量能序列
      - step: 2
        name: 定所处阶段
        question: 现在处于主升、高位震荡还是退潮？
        action: 用运行时间、阶段涨幅、顶部结构数量、龙头与板块相对强弱四项定位；不预测唯一顶部，只标注阶段
        data:
          - 个股日K
          - 板块指数
      - step: 3
        name: 评估信号新鲜度
        question: 当前信号是第几次出现？还剩多少边际效用？
        action: 统计同一信号重复次数、走势完美程度、新增资金与新增合力；重复三次以上且无新催化时，把「可追」降级为「只低吸」
        data:
          - 量能序列
          - 传播扩散度
      - step: 4
        name: 板块与个股四象限
        question: 板块和个股分别处于起势还是充分演绎？
        action: 分别标注后形成四象限：双起势重点跟踪；板块起势而个股充分演绎防兑现；板块充分演绎而个股刚起势找新核心；双充分演绎不追高、严控仓位
        data:
          - 板块指数
          - 个股日K
      - step: 5
        name: 输出参与资格
        question: 现在允许的动作集合是什么？
        action: 输出四档之一——可追高、只可低吸、只可滚动降仓、取消资格；资格不等同于买入信号，买入仍需买点与失效条件
        data:
          - 个股日K
    falsification:
      - 出现新的产业催化或业绩上修，且价格重心重新上移、成交量良性放大，撤销时间衰减判断
      - 分时拖沓但次日放量突破前高并带动板块，原滞涨判断证伪
      - 老龙头在新催化下突破前高并持续带动板块，中军化判断撤销
      - 仅走势漂亮或多次支撑有效，不足以证明新鲜度仍在
    validation:
      historical_hit_rate: pending-m1
      applicable_regime: null
      known_failures:
        - 课程案例为事后回看，未做独立窗口验证，不得当作胜率
        - 「成立日期/二十个交易日/涨幅70%」等阈值需保留各自语境，不可机械化为通用买卖线
    matched_framework: technical_timing
    applicable_themes:
      - 强趋势
      - 主升浪
      - 高位震荡
      - 龙头切换
      - 充分演绎
