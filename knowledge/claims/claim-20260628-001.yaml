  subject: 半导体硅片涨价
  timeframe: industry
  statement: HBM、3D NAND及全球晶圆厂扩产驱动下，半导体硅片进入涨价周期，国产硅片需求刚性
  evidence_quote: 据台湾工商时报等，环球晶、合晶、台胜科等台厂6英寸硅片已率先完成涨价，8英寸需求快速升温，12英寸进入新一轮价格协商；信越化学、SUMCO、环球晶圆三大龙头年内已是第二轮提价，12英寸常规片涨5%—8%，适配AI/HPC的高端专用片涨18%—22%，年内累计涨幅超15%。逻辑上，同等容量下HBM对12英寸硅片的消耗约为主流DRAM的3倍，3D
    NAND全面切换双晶圆键合又使12英寸需求翻倍，存储工艺迭代正系统性抬升硅片消耗。据SEMI，到2028年全球预计新建108座晶圆厂，其中中国占47座，下游扩产持续释放对国产硅片的刚性需求。
  interpretation: UP梳理半导体硅片涨价逻辑：HBM和3D NAND技术迭代大幅提升12英寸硅片消耗，全球晶圆厂扩产（尤其中国47座）释放国产硅片刚性需求，台厂和海外龙头已启动年内第二轮提价。
