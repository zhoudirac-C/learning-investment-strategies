  subject: 护盘是轮动换仓不是单边推涨
  timeframe: short-term
  statement: 护盘不是一直朝一个方向拉，拉权重时人们觉得不拉小票情绪不好，今天拉小票了权重砸一砸又觉得护盘不行了；护盘方会「偶尔往西指一指」做换仓，不要因指数短期回落就判护盘失效
  evidence_quote: 如果大家还是没看懂，认为护盘护不起来。不明白为什么这儿拉一拉，马上又换那儿拉一拉，好不容易拉起来的权重，为什么又要砸一砸，可以再把这个视频也看一眼。如果一直指东，人们都知道要拿拉某个东西了，那还得了，924怎么来的？就是人们都朝东走了，然后就没得走了，要接受偶尔往西指一指。拉权重的时候，人们觉得不拉小票，情绪不好起来，今天拉小票了，权重砸一砸，又觉得权重砸了，护盘不行了。多把去年12月和今年7月底的盘面回顾回顾，咱只能点到这里了。
  interpretation: 鳄鱼派把「护盘」的口径从「单边托底」改为「换手与轮动」：护盘方不会让方向一直被看穿（924 的教训是大家都朝东走就没得走），所以会偶尔反向。这与青枫浦「ETF承接≠权重转强」「护盘是结构性承接」的判断同向，但鳄鱼派进一步给出「护盘会主动换仓」的行为解释——这是判断护盘是否仍在场的关键：不是看指数单日涨跌，而是看不同权重/小盘之间的轮动是否仍在发生。
