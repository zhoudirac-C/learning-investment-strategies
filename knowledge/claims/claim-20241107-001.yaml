  subject: 分歧行情选股法
  topic: 分歧行情选逆势上涨板块中增速快的强势股
  timeframe: permanent
  statement: 分歧行情（很多板块净流出、下跌）中，应在逆势上涨的板块里选择增速比较快的、强势的个股，这么做的胜率会比较大
  evidence_quote: 其实每一轮赚钱行情呢，都会有一个时间点是在分歧的，很多板块都会净流出，都会下跌，反而逆势上涨的板块呢，选择增速比较快的、强势的个股。分歧行情这么做呢，胜率是会比较大。
  interpretation: 分歧日是天然选股过滤器：市场普跌时逆势走强的板块与个股展示了资金的真实选择，比普涨日的跟涨股更有信息量。
