  timeframe: intraday
  statement: 情形A偏强：平开或小幅低开后CPO、交换芯片承接住外盘光通信强度、量能温和放大、跌停收敛至个位数，则已关注方向延续持股或做T，情绪确认好转后再适当增加短线品种（注意是确认之后而非预期之中）；情形B偏弱：低开且CPO冲高回落、中位股连续跌停或百花医药(600721)、传智教育(003032)松动，则不宜增加短线品种，医药防御属性放大；情形C震荡（概率最高）：指数不选方向、成交继续收缩，医药与部分国产链轮动填补，电力需先看到量价止跌才谈右侧确认。
  evidence_quote: 情形A（偏强）：平开或小幅低开后，CPO、交换芯片方向承接住外盘光通信的强度，量能温和放大，跌停家数收敛至个位数。此时指数自然水涨船高……情形B（偏弱）：低开且CPO冲高回落，上周五那批中位股出现连续跌停，或百花医药、传智教育等标杆高位股松动……情形C（震荡）：指数不选方向、成交继续收缩。这是概率最高的一种，医药与部分国产链承担轮动填补的角色；电力在大幅调整之后需要先看到量价止跌，才谈得上右侧确认，现在讨论抄底为时尚早。
  interpretation: UP的标准条件化预案模板：每种情形给出触发条件与对应操作，强调加仓动作必须发生在情绪确认之后，电力抄底为时尚早。
