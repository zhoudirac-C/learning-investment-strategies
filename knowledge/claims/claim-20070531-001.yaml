  subject: 持股的级别逻辑
  topic: 本级别没有卖点就持股，第三类买点后的中枢上移中不形成新中枢就没有卖点
  statement: 持股耐心由操作级别决定：按年线级别操作，一个年线买点后可能几十年才有卖点；按周线级别操作，可能数年没有卖点；按30分钟操作的，在一个30分钟第三类买点后的中枢上移中，只要不形成新的30分钟中枢，无论涨多少都要拿着，因为没有卖点。说学了缠论就拿不住股票的是没学到家，缠论的方法不是拼命弄短线。
  evidence_quote: 至于按30 分钟操作的，在一个30 分钟第三买点后的中枢上移中，如果这上移是从10 元开始，只要不形成新的30 分钟中枢，那么就算到了100000 元，你还是要拿着，为什么？没有卖点。所以那些说学了本ID 理论就拿不住股票的，自己好好反思一下，究竟你学了什么？
  interpretation: 持股的依据不是涨幅而是本级别卖点未出现，这从级别体系正面回答了拿不住股票的问题。卖点只由走势结构给出，与浮动盈亏无关。
