  timeframe: intraday
  statement: 上午​科技（方向）走弱、锂电走强，跟盘前格局掉了个个儿。碳酸锂期货先崩→利空出尽+成本改善→给电池厂低吸理由。科技（光/上游材料）连续强势后资金获利了结→往低位有业绩支撑的锂电倒，本质是高低切换而非方向选择。
  evidence_quote: 现在科技走弱、锂电反而走强，跟盘前的格局正好掉了个个儿，说明资金不是在做方向选择，是在做高低切换：科技（光、上游材料）连续强势后，资金获利了结、往低位且有业绩支撑的锂电倒，碳酸锂期货先崩反而把锂电的成本预期打下来、给了电池厂一个「利空出尽+成本改善」的低吸理由。
