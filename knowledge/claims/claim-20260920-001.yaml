  statement: 判断美债期限结构对股票的影响要先识别上行驱动：长端因需求与增长改善上行较利好周期资产，若因财政供给和期限补偿上行则未必；短端更强而长端稳定更利于盈利韧性科技股获得选择性买盘。
  evidence_quote: 同样对于两年期和十年期谁升得快，那么我们也需要有着一个原因的判断。如果说十年期升得更快，那么它背后是需求和增长改善，能源工业和部分金融公司它会相相对来讲会受益。如果主要是因为财政供给和长期风险补偿的上升，那么就未必是周期股的一个好的环境。所以如果两年期更强，而十年期相对稳定，那么拥有比较有韧性和盈利的科技股呢，就会继续获得一个选择性的买盘。所以这是我对于这两个呃国债的一个重要的判断的标准。
  interpretation: 曲线变化本身不是充分信号，必须拆解增长、通胀、财政供给和期限补偿。不同驱动对应不同板块受益方向，不能将长端上行统一解读为周期利好或科技利空。
