  subject: 大单刺激庄家的心理战术
  timeframe: permanent
  statement: 早期有效的手法是用一个帐号齐刷刷买入巨大惹眼的数量刺激庄家，等其适应麻木后再换新帐号买更大量制造新刺激，再在盘面上不时神经质地搞两下；但这些数量一般控制在流通量的2%以下，不能大到影响庄家坐庄的信心。该手法用多了现在基本没用。
  evidence_quote: 当时，喜欢用一个帐号，齐刷刷就买一个巨大的惹眼的数量。能坐庄的，基本都能打单，这样一个帐号，不可能不知道。……等他们适应一段时间，有点麻木，就要给新的刺激。例如，再找一个新的帐号买一个更大量的数量，注意，这些数量一般都控制在流通量的2%以下，不能大到影响这些家伙坐庄的信心。
  interpretation: 战术要点是刺激剂量控制：要足以引起对手注意和折腾，又不能大到吓退对手，目标是折腾而不是赶跑。作者明言此手法已失效，仅有方法论参考价值。
