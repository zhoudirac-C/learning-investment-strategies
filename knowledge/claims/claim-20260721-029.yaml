  subject: 全球资本市场从AI叙事进入业绩验货期
  timeframe: trend
  statement: 全球资本市场三大原有预期进入验货阶段：北美大型科技公司持续扩大AI资本开支、AI需求沿全链条扩散、经济承压时美联储降息释放流动性。市场不再单纯相信产业故事，转而要求企业用收入、订单、现金流证明前期投入的合理性，逢低必买的惯性已被打破。
  evidence_quote: 全球资本市场三大原有预期进入验货阶段。三大原有核心预期：分别是北美大型科技公司持续扩大AI资本开支、AI需求沿芯片-存储-光模块-服务器-数据中心-电力基础设施全链条扩散、经济承压时美联储会通过降息释放流动性支撑市场。验货期核心转变：市场不再单纯相信产业故事，转而要求企业用收入、订单、现金流证明前期投入的合理性，此前的逢低必买惯性已经被打破。
  interpretation: UP提出当前全球资本市场正处于AI叙事的验货期转折点——之前的三大底层逻辑（AI capex持续扩张、全产业链扩散、Fed降息兜底）正在被市场重新审视。核心变化是市场从信故事到信报表，AI板块的估值逻辑从产业趋势折现切换到业绩兑现验证，逢低买入策略失效意味着行情结构发生根本性改变。
