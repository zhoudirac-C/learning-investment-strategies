- id: claim-20070307-001-b
  source_path: sources/chanlun/lesson_034.md
  source_date: '2007-03-07'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 情绪傀儡命运
  timeframe: permanent
  statement: 面首与怨男最大的共同点是喜欢被玩：一旦某种情绪密码被输入，其行为程序就自动运行，人不过是傀儡且乐在其中。不摆脱被各种情绪操控的傀儡命运，就不足以言交易；更可怕的是很多人深陷其中而不能自拔，甚至不能自知。
  evidence_quote: 无论面首或怨男，最大的共同点就是喜欢被玩，当一种面首或怨男的密码被输入后，这面首或怨男的程序就自动运行。其人，不过是傀儡而已，但竟然也乐在其中，也算天下之奇事。不摆脱这各种情绪操控的傀儡命运，就无人可言，但更可怕的的是，很多人却深陷其中而不能自拔，甚至不能自知。
  interpretation: 指出交易失败的深层机制不是技术不足，而是情绪被人写入了『自动运行程序』——贪婪恐惧等反应模式一旦触发便不受理性控制。自知是摆脱的前提：最大的风险是身处傀儡状态而不自知。
