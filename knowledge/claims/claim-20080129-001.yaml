  subject: 拒绝预测的当下应对
  topic: 市场机会不需要预测点位与时间，到来时按理论当下应对即可
  statement: 操作中贪婪的最大表现是希望寻求预测性、一劳永逸的上帝式指标，先验地决定一切。正确思维：市场的机会如同要上门的病人，不需要对他预测什么，点位、时间都不需要，只需要等他来的时候对他望闻问切。机会必然按理论的要求输出，第一步完全吃透理论的分类，第二步看机会的显发并对之应对；这功夫靠多看走势图多练习，看走眼、被骗几次都是磨练中最正常的事情。
  evidence_quote: 在市场中，操作中，这贪婪的最大表现就是希望寻求一种预测性的、一劳永逸的上帝式指标、模式，先验地决定了一切……同样，市场的机会的到来，就如同要来的那个病人，你不需要对他预测什么，点位、时间、什么都不需要，你只需要等他来的时候对他望闻问切就可以了……一定要看走势图，那是世界上最昂贵的图画，最昂贵的艺术品，多看，就如同培养你的鉴赏力
  interpretation: 这是缠论操作心法的总纲之一：理论负责完全分类的输出，人负责当下的识别与应对，预测被明确排除在操作依据之外。望闻问切对应着对走势当下显发的判断功夫，作者明言这只能靠多看多练，被假形态骗是磨练过程的正常部分。
