- claim_type: methodology
  subject: 早盘验证顺序：先看30分钟强弱分布，再看午后首个30分钟量价配合
  timeframe: short-term
  statement: 开盘后先看30分钟内的强弱分布，再看午后开盘首个30分钟的量价配合；修复要有扩散基础（指数收复失地、科技核心止跌、上涨家数增加），若只是传媒或医药少数个股拉升而双创与多数个股继续下移，仍属局部轮动。
  evidence_quote: 开盘后先看30分钟内的强弱分布，再看午后开盘首个30分钟的量价配合。若指数低开后逐步收复失地、科技核心止跌，且上涨家数随之增加，修复才有扩散基础；若只是传媒或医药少数个股拉升，而双创指数与多数个股继续下移，仍属于局部轮动。
  interpretation: 盘中验证方法论：修复真伪=广度验证（多数个股+双创同向），少数板块拉升不算修复；时间锚点=开盘30分钟+午后首个30分钟。
  confidence: high
