  timeframe: short-term
  statement: 如果说周二是指数强所以半导体强，那昨日国产链能更胜一筹也纯粹因为指数跌了——不愿去老登股的资金只剩国产链这一个选择，且得益于龙头共进股份(603118)(603118)的高举高打。国产链困局：既有业绩(锐捷网络(301165)预增)又有催化(WAIC)，但指数强时资金优先考虑半导体，指数弱时又压制国产链日内强度(锐捷开板)。下一阶段主线可能还要反复拉锯一段时间，在此期间先当轮动处理不要盲目跟风追涨。
