  timeframe: short-term
  statement: 护盘资金的行为框架是"先礼后兵"：先密集释放利好（礼），市场不听就用自己的买入买到市场信为止（兵）；先例是 AI 防过度炒作时的"先礼后兵、不信就手动降温"。观察信号：科创50 出现资金承接迹象，说明"兵"的阶段已经开始
  evidence_quote: 先礼后兵啊，我发利好你们不听，对吧？后面涨起来了不怪我……市场不听不听就买，买到市场信为止。
  interpretation: 把护盘的"喊话"与"真金白银"分成两个阶段：利好喊话是礼，持续买入是兵。市场把利好当耳边风并不会让护盘失败，只会把护盘推向下一阶段（买入直至市场信）。对应到操作：识别"礼已尽、兵已至"的信号（权重承接）比猜政策底位置更有效。
