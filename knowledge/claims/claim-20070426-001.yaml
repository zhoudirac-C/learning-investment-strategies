  subject: 缠中说禅利润最大定理
  topic: 不换股模式与激进换股模式分别在固定品种与不同品种交易下利润率最大
  statement: 缠中说禅第一利润最大定理：对于任何固定交易品种，在确定的操作级别下，不换股操作模式的利润率最大——只参与该级别的盘整与上涨，盘整用中枢震荡方法处理以降低成本且不丢筹码，第三类买点后持股直到新中枢出现继续中枢震荡操作、中途不参与短差，最后在中枢完成的向上移动出现背驰后抛出所有筹码，完成一次该级别的买卖操作，等待下一个买点。缠中说禅第二利润最大定理：对于不同交易品种交易，激进换股模式的利润率最大——不参与中枢震荡，只在第三类买点买入，一旦形成新中枢就退出，往往会抛在该级别向上走势的最高点区间。第二定理需要激进的市场机会，第一定理除最恶劣的连续单边下跌外都可操作，实际操作中两者不能偏废。
  evidence_quote: 缠中说禅第一利润最大定理：对于任何固定交易品种，在确定的操作级别下，以上缠中说禅操作模式的利润率最大……缠中说禅第二利润最大定理：对于不同交易品种交易中，在确定的操作级别下，以上激进的缠中说禅操作模式的利润率最大……第二虽然激进，但也需要有激进的市场机会……所以在实际操作中，两者不能偏废。
  interpretation: 利润率指每次操作的平均利润除以需要占用资金的平均时间，总体利润还与操作频率有关。大资金因很多级别的操作不可能全仓参与而利润率递减，资金大到一定程度会遇到增长瓶颈。换股模式的退出信号是中枢完成向上后次级别向下再向上不能创新高或出现背驰、盘整背驰。
