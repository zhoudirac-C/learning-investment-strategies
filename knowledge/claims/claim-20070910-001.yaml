  subject: 按资金规模选择操作模式
  topic: 没时间者定投指数基金与成长股基金组合，有时间散户用第三买点法，大资金借中枢震荡降成本
  statement: 用缠论操作的最终结果是合力：理论把握程度是一个因素，资金规模以及操作时间是又一个因素。按此分层选择操作模式：一、很忙根本没时间操作的人，最好去买基金，可用指数基金加与指数关系不大的高速成长基金的组合，例如六成买指数基金、四成买高速成长股的基金，采取定投每个月投一次，至少能买到市场波动的平均；二、有充足时间、交易通道还行的散户，用第三类买点买卖法；三、资金量比较大的大散户，用所有资金去追逐第三类买点已不切实际，可对基本面上有长期价值的股票进行附骨抽髓式的操作，用各种级别的中枢震荡去减低成本增加筹码。资金量不同，操作方法自然不同，大资金资金效率没有第二种散户高。
  evidence_quote: 对于很忙，根本没时间操作的人，最好就去买基金……如果很忙，就用这两种方式进行一个基金组合，例如60%买指数基金，40%买高速成长股的基金，这样，就别自己搞股票了。采取的方式很简单，就是定投，每个月去投一次。这对于一般的散户投资者，最好了，你至少能买到市场波动的平均。……对于有充足时间的散户，如果交易通道还行，那就用本ID 在前面说过N 次的第三买点买卖法……资金量比较大的大散户，这时候，用所有资金去追逐第三类买点已经不切实际了，那么就可以对基本面上有长期价值的股票进行附骨抽髓式的操作，例如各种级别的中枢震荡去减低成本增加筹码。
  interpretation: 分层逻辑与第75课散户只看合力结果的判断一致：约束条件决定方法。投基金的关键提醒是投指数基金再投与指数关系大的基金就没意义，要配与指数关系不大且有足够成长性的品种。原文对基金行业的悲观预测属2007年时点判断，不作通用规则提取。
