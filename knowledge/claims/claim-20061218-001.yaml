  subject: 走势终完美原理
  topic: 任何级别的任何走势类型终要完成，完成的走势必然转化为其他类型
  statement: 缠中说禅技术分析基本原理一：任何级别的任何走势类型终要完成，简言之走势终完美。这句话有两个不可分割的方面：任何走势无论趋势还是盘整在图形上最终都要完成；一旦某种类型的走势完成以后，就会转化为其他类型的走势。缠中说禅技术分析基本原理二：任何级别任何完成的走势类型，必然包含一个以上的缠中说禅走势中枢。两个原理从实际图形中总结而来，是一切有关技术分析理论的唯一坚实基础。在任何一个走势的当下，是延续还是改变的两难问题永远存在，任何宣称自己能解决这个两难问题的是无效的，这是任何面对技术图形的人都必须时刻牢记的。
  evidence_quote: 由上可得到“缠中说禅技术分析基本原理一”：任何级别的任何走势类型终要完成。后面一句用更简练的话，就是“走势终完美”……“缠中说禅技术分析基本原理二”：任何级别任何完成的走势类型，必然包含一个以上的缠中说禅走势中枢。
  interpretation: 走势终完美是缠论的总纲：它不预测方向，只保证任何走势类型必然完成并转化。由此两类买卖点获得理论保证：下跌完成后只能转化为上涨与盘整（第一类买点的位置依据），上涨和盘整必须包含三个以上次级别运动（第二类买点绝对安全的依据）。
