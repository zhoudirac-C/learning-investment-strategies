  claim_type: operation
  subject: 顶部钝化分步执行小周期试探大周期拍板
  timeframe: intraday
  statement: 操作上按小周期到大周期分步执行不猜顶等信号确认再动。第一，15、30分钟先出顶部钝化可以先做T减一部分，就算错了下午还有机会接回来，损失只是小幅价差；第二，如果下午90、120分钟同时出现钝化加高9共振，属于大级别风险信号，尾盘只接回一部分整体降仓位；第三，如果高9消失只剩钝化，代表只是上涨动能变弱不算见顶，尾盘全部接回，等待真正的顶部结构成型再减仓。
  evidence_quote: 不提前预判顶，信号没出来就不操作，小周期先试探，大周期来拍板，坚持右侧确认，不见结构不减仓、不见结构不追高。
  interpretation: 顶部处理三步法：15/30m钝化=T减仓（可回补）；90/120m钝化+高9共振=大级别风险尾盘降仓；高9消失只余钝化=动能减弱尾盘接回；小周期试探大周期拍板的执行框架。
