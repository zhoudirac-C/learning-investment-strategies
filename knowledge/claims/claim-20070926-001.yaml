  subject: 骨牌效应与多杀多
  topic: 分力趋同性引发骨牌效应，第二种线段破坏一旦出现骨牌效应至少回到前一高低点形成V型走势
  statement: 线段的第二种破坏方式本质上是以时间换空间：反攻开始的力量很弱需要慢慢积累，这一方面代表原方向的力量很强，另一方面又要密切关注是否会形成骨牌效应，即开始的反攻力量很小却能迅速蔓延开，这往往证明市场原方向的分力结构具有趋同性，一旦有点风吹草动就集体转向。分力的趋同性所引发的骨牌效应，基本上就表现为多杀多、空杀空：一些猛烈上涨或下跌的股票，往往甚至由于一个1分钟的小顶分型就引发大跳水或大反弹；特别在一些大的趋势之后市场力量一边倒，这时候突然来一个加速，一旦逆转就会发生典型的多杀多、空杀空现象。一般来说，这种第二类的线段破坏一旦出现骨牌效应，至少要回到前一高、低点范围内，这就是市场上冲顶和赶底时发生的V字型走势。趋同性对于一般性品种来说，往往意味着庄家控盘程度高。
  evidence_quote: 至于线段的第二种破坏方式，本质上是以时间换空间，反攻开始的力量很弱，需要慢慢积累……也就是开始的反攻力量很小，却能迅速蔓延开，这往往证明，市场原方向的分力，其结构具有趋同性，一旦有点风吹草动，就集体转向……一些猛烈上涨或下跌的股票，往往甚至由于一个1 分钟的小顶分型就引发大跳水或大反弹，其原因，就是这种分力的趋同性所引发的骨牌效应。一般来说，这种第二类的线段破坏，一旦出现骨牌效应，至少要回到前一高、低点范围内，这就是市场上冲顶和赶底时发生的V 字型走势。
  interpretation: 该判断给第二种破坏提供了可操作的后果预期：骨牌效应成立则目标位至少是前一高低点范围。小结构引发大波动的条件是分力趋同，孤立的小分型本身不构成风险信号。
