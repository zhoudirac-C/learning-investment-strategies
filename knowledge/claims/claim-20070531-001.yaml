- id: claim-20070531-001-b
  source_path: sources/chanlun/lesson_057.md
  source_date: '2007-05-31'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 最小分析级别的设定
  topic: 先确定最小分析级别，其下波动都看成线段，三线段重合构成该级别中枢，缺口视同最低级别
  statement: 对着图首先要确定最小分析级别，这级别以下的都可以看成线段；站在最小分析级别的角度，每一线段就是其次级别走势类型，三个线段重合部分就构成最小分析级别的中枢。缺口被看成最低级别的，在1分钟图上缺口和1分钟以下级别是同级别的，都可以看成没有内部结构的线段。一般来说级别越大的图越简单，技术不好、通道不好的一般不用1分钟的图操作，把级别放大点。
  evidence_quote: 对着图，首先要确定最小分析级别，也就是说，这级别以下的都可以看成是线段，而站在最小分析级别的角度，每一线段就是其次级别走势类型，三个线段重合部分就构成最小分析级别的中枢……虽然缺口是最低级别的……但在1 分钟级别显微镜下，没有区别，都可以看成是没有内部结构的线段……一般来说，级别越大的图越简单，而操作上，技术不好，通道不好的，一般不用1 分钟的图，把级别放大点，这点必须明确。
  interpretation: 最小分析级别是精度前提的声明：选定后其下一切波动被抹平，这是可操作性与严格性之间的取舍。实际操作级别应与个人技术熟练度和交易通道条件匹配。
