  subject: 刺透强度分级
  timeframe: permanent
  statement: 刺透按刺入第一根阴线实体的比例分级：50%~70% 为 B 级（信号成立、强度一般），70%~90% 为 A 级（信号强烈，接近吞没水平），90% 以上接近完全吞没、可直接按吞没处理，100% 包裹即典型的看涨吞没。
  evidence_quote: 如果能够刺透百分之五十到百分之七十，那么它相当于是B级刺透，信号成立但强度一般。刺透百分之七十到百分之九十就是A级刺透，就信号非常强烈，已经接近于吞没的水平。如果刺透百分之九十以上，接近完全吞没……那么如果完全包裹百分之百，那就是一个典型的看涨吞没
  interpretation: 比例即强度刻度，可直接换算成仓位与执行力度：B级只观察或轻仓，A级才进入建仓流程。
