subject: 趋势方向决定九转信号有效性——主级正向波和主级逆向波的区分
timeframe: permanent
statement: "九转序列的信号有效性取决于大趋势方向：上升趋势（主级正向波）中出现高9容易失效（不宜据此减仓），低9有效（可作为反弹标准）；下跌趋势（主级逆向波）中出现高9有效（应卖出），低9容易失效（仅是反弹非反转）。当前大趋势向上，高9只意味着'别追高'而非'该清仓'，调整幅度不一定会大。"
evidence_quote: "但高9不等于减仓信号。这里有两个关键概念——主级正向波与主级逆向波。大趋势向上（主级正向波）出现高9容易失效，不宜据此减仓；大趋势向上出现低9有效，可作为反弹标准。大趋势向下（主级逆向波）出现高9有效，应该卖出；大趋势向下出现低9容易失效。当前大趋势向上，所以高9代表的含义很明确：今天别追高。阶段性偏高，后面可能走震荡，也可能小幅下探，但调整幅度不一定会大。"
interpretation: "UP明确区分了九转信号在不同趋势环境下的不同含义。核心是'信号是计数器，不是趋势判断工具'——它只告诉你涨/跌了多久，不告诉你方向变了没有。方向判断要靠MACD多级别结构。这解释了为什么单纯看高9/低9做操作会出错。"
