  subject: 技术分析的分类本质
  topic: 技术分析最核心的思想是分类，指标只是完全分类后的强弱评价
  statement: 技术分析最核心的思想就是分类：任何技术指标只是把市场所有可能的走势进行完全分类，指出在这个指标的视角下什么是能搞的、什么是不能搞的；任何技术指标、系统本质上都是一个评价系统，即告诉你在这个系统的标准下评价对象的强弱。指标对应的情况不可能百分百反映在实际走势上，否则所有人按指标操作就没有亏钱的人了。因此单纯的技术派不行，抱着指标买入信号当上帝暗示的识见很难有大成功，技术必须也只能在三个独立系统里才会有大的功效。
  evidence_quote: 技术分析，最核心的思想就是分类，这是几乎所有玩技术的人都搞不清楚的一点……任何技术指标，只是把市场进行完全分类后指出在这个技术指标的视角下，什么是能搞的，什么是不能搞的，如此而已……单纯的技术派是不行的，单纯的非技术派也是不行的。技术派的玩意，必须也只能在三个独立系统里，才会有大的功效。
  interpretation: 这把技术指标从预测工具降格为分类滤镜，是缠论技术分析的总纲。推论：强弱是相对的，同一走势在5日线上是强、在10日线下可能是弱，因此参数选择必须与资金量和操作周期匹配，大资金看不上日内的短期强势，超短则可看分钟线。
