- id: claim-20260604-003-d
  topic: 强势板块尾盘低吸套利策略
  text: 强势板块操作方法：尾盘低吸，次日高开即卖出，不要格局，不适合长期持有
  evidence_quote: 强势板块的话，你可以尾盘去低吸，第二天高开，然后你给它砸出去就可以了...强势板块，你也别什么，别什么一直格局什么的，不好做的。
  interpretation: 'UP对强势板块短线操作策略的明确纪律：

    1. 买入时机：尾盘低吸（避免盘中追高）

    2. 卖出时机：次日高开即砸（不贪多）

    3. 核心纪律：不格局、不长期持有

    4. 适用场景：强势板块的短线套利，非主升浪持仓

    5. 与中线格局（如燃气轮机）策略形成鲜明对比

    '
