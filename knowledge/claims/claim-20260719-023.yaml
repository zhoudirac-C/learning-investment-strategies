  statement: 强趋势买入后首根阴线即被套，应停止解释和加仓，明确次日及最迟第三天的修复要求，比较相对指数板块和其他核心的强度，修复不达标利用反弹退出，重新跌停、放量破位或连续失去关键支撑时执行底线。
  evidence_quote: 所以被套之后，首先要做的事情就是停止解释……第二步就是说你明确次日必须要看到什么……第三步观察相对强度……第四步修复不达标，利用反弹退出……第五就是底线位置必须要执行。
  interpretation: 首根阴线可能是普通分歧，也可能是调整起点；买入即被套说明缺少安全垫，需要缩短观察周期。最迟第三天和强修复是该课程情境下的反馈要求，不外推为所有交易的固定期限。
