statement: 近期盘面里如果午后不能迅速放量上涨、让资金看到真实承接，那么无论缩量还是平量都容易继续走弱，向下放量则卖压释放的信号更直接；宽基ETF小幅放量能换来的可能也只是止跌；观察ETF必须把成交额放大与净买入分开，成交放大本身不能证明有新增资金净流入，更不能据此确认某类资金身份；有效信号是ETF活跃与指数止跌相互配合、回落有承接、科技权重抛压减轻、个股上涨面开始扩展。周二高开低走真正缺少的，是卖盘出现之后能够接住并继续推动价格向上的增量。
evidence_quote: 如果午后不能迅速放量上涨，让资金看到真实承接，那么无论缩量还是平量，都容易继续走弱；如果向下放量，卖压释放的信号就更直接。……观察ETF时，还要把成交额放大与净买入分开。成交放大本身不能证明有新增资金净流入。
interpretation: UP的承接诊断工具箱：午后量价方向判断强弱，ETF成交放大是噪音、与指数止跌配合且回落有承接才是有效信号；市场缺的不是消息而是卖盘后的向上增量。
