  subject: 机器人从主题想象到产业验证的切换
  timeframe: trend
  statement: 物理AI和机器人更有预期差的核心，是市场对未来兑现程度尚未充分计入；一旦出现真实订单、明确产品、可复制商业场景，市场可能从主题想象切换到产业验证，估值和股价有重新定价可能。
  evidence_quote: 所以说物理AI和机器人更有预期差，核心含义不是它们基本面已经完全胜出，而是市场对它们的未来兑现程度还没有充分计入。一旦后面出现真实订单、明确产品、可复制商业场景，市场就可能从“主题想象”切换到“产业验证”，对应的估值和股价都有重新定价的可能。
  interpretation: UP强调机器人预期差的兑现路径：需要订单、产品、商业场景等产业验证信号，才能触发估值重估。
