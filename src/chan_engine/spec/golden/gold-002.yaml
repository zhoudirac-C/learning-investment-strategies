# GOLD-002 金标：北辰实业（sh.601588）日线第三类买点（课20 课文实例）
#
# 课文结论（课20《缠中说禅走势中枢级别扩张及第三类买卖点》，2007-01-05 发文）：
#   "北辰实业在11月14日构成典型的日线级别第三类买点"。11月14日 = 2006-11-14。
# claim 原文依据：
#   - claim-20070105-001-b（课20 第三类买卖点定理）：次级别走势向上离开中枢，
#     以次级别走势回试，低点不跌破 ZG，构成第三类买点；必须是第一次回试。
#
# 数据（真实，零外泄：baostock 公开源）：
#   baostock query_history_k_data_plus("sh.601588", frequency="d", adjustflag="3"（不复权）)，
#   2006-10-16（A股上市首日）~2006-11-23，共 29 根日线，显式 [o,h,l,c] 落地。
#   取数脚本 /tmp/golden_dump_daily.py（不入仓）。
#
# 数据核对（人工读图）：
#   - idx0~idx17（10-16~11-08）在 3.12~4.05 区间震荡，构成中枢区域
#     （区域上沿 ≈4.05，上市首日 idx0 高点）；
#   - idx18（11-09）收 4.15 跳空向上突破，向上离开该区域；
#   - idx19~21（11-10~11-14）在 4.08~4.43 回试，课文指认 11-14（idx21，l=4.20）
#     为第三类买点：回试低点 4.20 > 4.05，未跌回中枢区域；
#   - 其后 idx22~28（11-15~11-23）一路上行至 6.15，回试后再未返回中枢。
# 已知摩擦点（留 Task 9 评审归类）：
#   idx21 与 idx20 存在包含关系（idx20 [l=4.17,h=4.43] 包含 idx21 [l=4.20,h=4.39]），
#   严格包含处理后底分型落在合并 K 线（低点 4.17@11-13）；课文指认日期为 11-14，
#   expect 忠实课文断言 idx21。实现若按合并 K 线口径把三买落在 idx20，
#   属"课文指认日 vs 严格包含处理"的口径偏差，不在本用例内擅自拍板。
# sure 口径：课文为回溯确认结论；idx22 起上行确认 → bsp sure=true。
#
# 断言（只断言课文有明确结论的结构）：
#   bsp: idx=21（2006-11-14），bstype=3，dir=up（买点=up），level=1，sure=true。
#   中枢精确区间课文未给，zs 不断言。
