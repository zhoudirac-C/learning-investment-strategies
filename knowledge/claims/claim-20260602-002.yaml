- id: claim-20260602-002-b
  source_path: sources/raw/财经/动态：26-06-02：光纤最大卖点在地缘冲突而非AI.md
  source_date: '2026-06-02'
  source_type: 动态
  extracted_at: '2026-06-02'
  claim_type: sector-theme
  subject: 光纤核心逻辑是地缘冲突（军用无人机），不是AI
  timeframe: medium-term
  statement: 光纤的最大需求驱动力不是AI光通信，而是地缘冲突下的军用无人机。光纤龙头多有军工背景，只要"安全"概念持续，光纤需求就有支撑
  evidence_quote: "光纤的最大卖点其实不在Ai，而在地缘冲突，现在的战争都是无人机，光纤用的最多的地方就是无人机，而不是Ai，所以几个光纤大头也都是军工相关的。所以只要安全这个概念一直在提，光纤就会一直高需求。"
  interpretation: 光纤产业链定性：①市场普遍将光纤归为AI光通信产业链，但博主指出核心驱动力是地缘冲突（军用无人机）；②光纤龙头多有军工背景——与AI光通信标的不同；③持续性条件："安全"概念持续→光纤需求持续；④UP主明确提醒"没让你们冲光纤，知道一下逻辑就行了，还是位置问题"——当前位置不适合介入，仅作认知更新。这是一个重要的产业链认知修正：光纤≠AI，光纤=军工+地缘。
  confidence: high
