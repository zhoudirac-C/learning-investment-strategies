  subject: 背驰后转折力度判别
  topic: 看反弹第一个次级别走势能否重新回抽到最后一个中枢里
  statement: 分辨背驰后三种情况的关键：看反弹中第一个前趋势最后一个中枢级别的次级别走势（例如5分钟下跌就看1分钟级别的第一次反弹）是否重新回抽到最后一个中枢里。如果不能，那第一种最弱情况即最后中枢级别扩展的可能性就很大，而且证明反弹的力度值得怀疑；该判别不是绝对的，但有效性很大。回到了中枢则排除最弱情况，其后只剩更大级别盘整或反趋势两种演化，操作上差别不大，关键看突破第一个中枢后是否形成第三类买点，出现就继续持有，否则抛出。
  evidence_quote: 怎么分别这几种情况，关键就是看反弹中第1 个前趋势最后一个中枢级别的次级别走势……是否重新回抽最后一个中枢里，如果不能，那第一种情况的可能就很大了，而且也证明反弹的力度值得怀疑，当然这种判别不是绝对的，但有效性很大。
  interpretation: 给出背驰买入后的第一个检验点：第一波次级别反弹能否回到最后中枢区间。回不到就要找机会马上退出，避免资金利用率被浪费。作者以2007年2月6日反弹为例现场演示：1分钟走势马上回到5分钟下跌的最后中枢，即排除最弱情况。
