operation_plan:
  date: '2026-07-08'
  type: daily_operation
  gold_rule: >-
    7/8 00:23复盘定调：7/7沪指缩量冰点失守4000点，两市成交2.58万亿、较上一日缩量超5000亿，近4800只个股下跌。

    但下跌阶段出现如此幅度缩量，主动抛压动能大概率已在衰竭，反弹预期并未被破坏；4000点下方缩量阴线恐慌意义大于趋势意义，右侧确认后再动手不迟。

    科技仍是唯一核心主线，科创50逆势收红0.28%显示科技止跌企稳；半导体是7/7最强方向，设备/封测由diverging修复为resuming。若反弹大概率科技带头，华天科技(002185)次日承接质量是风向标。

    国产算力业绩验证从明牌转向非明牌：交换机已验证，接下来看晶圆厂、封测、设备厂及芯片设计厂；海外链7月底四大CSP财报为定价锚。存储Q3涨价、PCB第三次提价进一步强化涨价逻辑。

    核心纪律：缩量冰点不追涨，右侧确认前控制仓位；优先半导体上游+存储、国产算力链、半导体设备/封测；新增映射先导基电/瑞芯微/航天电器作为回踩候选。若外盘动荡导致延续弱势，只要不放量创新低，仍属内生修复。
  step_by_step:
  - step: 开盘（09:25-09:40）
    action: 观察竞价方向与隔夜外盘映射。若半导体上游/设备/封测高开不追，等盘中分歧；若国产算力链（交换机/昇腾供应链）有承接则跟踪。关注华天科技开盘换手与承接质量
    note: 缩量冰点开盘追高是最大风险；科技方向动了也等分歧回踩
  - step: 早盘确认（09:40-10:30）
    action: 观察五个维度：①隔夜外盘影响是否消化、全A是否守住4000点下方缩量低点 ②半导体/国产算力是否与大盘共振 ③华天科技承接质量 ④量能是否温和放大 ⑤人形机器人/医药是否出现资金回流
    note: 无放量+无共振不建仓；半导体逆势孤军时不追
  - step: 方向确认（10:30-11:20）
    action: 确认半导体上游是否分化走强、国产算力是否扩散至晶圆厂/封测/设备、端侧AI SoC/磷化铟是否联动。若放量+承接好+与大盘共振→按优先级评估分歧买点；若缩量震荡或科技逆势→持有不动
    note: 右侧确认为先，只做科技带头+量能确认的回踩买点
  - step: 尾盘（14:52）
    action: 验证当日是否形成明确企稳信号。半导体/国产算力是否与大盘共振；华天科技是否维持强势；量能是否温和放大。仅当共振放量时才考虑轻仓跟随半导体上游+存储/国产算力链
    note: 尾盘条件单是最佳介入窗口，前提是当日已确认分歧企稳+共振放量
