statement: 一百多的科技股跌到五六十，反弹到六七十也很正常——可以看反弹，但也只是反弹，不要梭哈
evidence_quote: 之前都讲印度了，对吧？啊，为了说，把印度都翻出来了，对吧？阿三阿三躺枪了，都已经到这个程度了啊，提醒风险啊，讲机会啊，机会咱也讲了，对吧？啊，那七月底杀下来。开多进去，也给大家讲啊，一百多的科技股，那跌到怎么嘞？啊，五六十啊，那反弹到六七十也很正常呀，对吧？
interpretation: 用「一百→五六十→六七十」的具体数字界定反弹的级别：这是技术性修复（均值回归），不是趋势反转。他反对两种极端——既反对「不信会反弹」，也反对「反弹后梭哈」。这与青枫浦「反弹不是反转」、卢本圆「没量不是反转只做T」同向。
