statement: 未来市场逻辑重点将从科技景气逐步转向政策发力，政策端变化（美联储议息、国内政策）将成为重要逻辑支撑；在政策节点落地前，指数在复合区间内反复的概率高于选择方向的概率。
evidence_quote: 据光大证券的观点，未来市场逻辑重点将从科技景气逐步转向政策发力。他这句话更多针对题材、板块与整体市场风格，但原理相通：对指数而言，政策端变化同样将成为重要逻辑支撑。这既包括最近反复提到的美联储议息会议——9月11日将公布的美国8月通胀数据，将直接决定一周之后议息会议的结果——也包括国内的政策变化。
interpretation: 关键政策节点：9月11日美国8月通胀数据→一周后（9月中下旬）美联储议息。逻辑切换期指数方向选择被推迟，这是'复合区间震荡'判断的深层原因。
