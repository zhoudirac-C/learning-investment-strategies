  statement: AI时代财富效应快速向头部集中，普通人如果不在风口，稳定工作比全职炒股更重要。持有现金、保留稳定现金流，长期就能吃到科技变革的红利
  evidence_quote: "Anthropic创立仅两年，七大创始人就人均身价达80亿美元。当前处于AI和机器人时代的交界点，若人形机器人加核能落地，全要素生产率年提升有望达到7%以上。未搭上AI、新兴产业风口的行业，哪怕是上市公司，日子也比过去困难很多。普通人如果不在风口，稳定工作比全职炒股更重要，持有现金、保留稳定现金流，长期就能吃到科技变革的红利。"
  interpretation: 这是博主对普通投资者的长期建议：①AI红利分配极度不均，头部公司和个人获得绝大部分收益；②不在风口的行业和个体日子会更困难；③对普通人而言，稳定工作提供持续现金流是最佳策略；④持有现金、长期活在市场里，就能吃到后续科技变革（核聚变、机器人等）的红利。这不是短期操作建议，而是人生财务规划的底层逻辑。
