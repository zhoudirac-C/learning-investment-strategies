  statement: 特朗普政府正起草禁令拟禁进口中国制造的新型数据中心组件（含光收发器），FCC推进该措施：此事目前仍属传言、处在博弈阶段，对明日的影响是情绪性打击而非基本面打击，短期冲击明确，中长期大概率还是雷声大雨点小——2020年起类似故事已多轮，产业政策倾斜下中国厂商份额仍不降反增；美国自身产能与原材料受限，一刀切会让北美数据中心建设先被拖慢。
  evidence_quote: 第二，这件事目前仍属传言、处在博弈阶段，所以对明日的影响是情绪性打击而非基本面打击，短期冲击明确，中长期大概率还是雷声大、雨点小。从2020年开始，类似的故事已经讲过很多轮，市场一直担心中国厂商的份额被北美竞争对手抢走，但这两年讨论反而少了——因为几年验证下来，即便产业政策不断向美国本土供应链倾斜，中国厂商的份额仍然不降反增。
  interpretation: UP对FCC禁令做三层定性：①仍是传言、博弈阶段，明日影响是情绪性打击而非基本面打击；②历史验证——2020年以来多轮类似威胁，中国厂商份额不降反增；③可落地性差——美方产能与原材料受限，一刀切先拖慢美国数据中心建设。短期交易情绪、中期看规则口径、长期比产品良率交付。
