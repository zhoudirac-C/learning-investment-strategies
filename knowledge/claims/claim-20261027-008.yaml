subject: 机器人与物理AI正在内部分化，向细分环节收敛
timeframe: short-term
statement: 机器人与物理AI并非完全独立的两条线。眼下更有意义的拆分，是主机厂与股权事件映射、数据采集、执行与感知等细分环节。周一更像第一次真正意义上的内部分化，未必只是同一批筹码从一致转向情绪分歧。订单、收入与客户关系仍需逐家公司验证，不能把未确认的客户映射当成确定订单。
evidence_quote: 机器人与物理AI并非完全独立的两条线。眼下更有意义的拆分，是主机厂与股权事件映射、数据采集、执行与感知等细分环节。周一更像第一次真正意义上的内部分化……订单、收入与客户关系仍需逐家公司验证。此前商业航天的观察经验是，通宇通讯、再升科技等具备具体产业链线索的个股，曾被用于比较题材持续性。今天可以借用“向真实产业环节收敛”的研究方法，但不据此预设机器人一定复制相同路径，更不能把未确认的客户映射当成确定订单。
interpretation: UP主张把机器人与物理AI拆分为主机厂/股权事件映射、数据采集、执行与感知等细分环节研究，反对把未确认的客户映射当成确定订单，强调订单收入客户关系需逐家验证。
