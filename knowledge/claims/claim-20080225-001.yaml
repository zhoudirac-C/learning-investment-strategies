  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 承受力决定参与程度
  topic: 把分类后的可能结果与自身承受力匹配，决定仓位与是否参与
  statement: 完全分类后的每种可能结果都对应着自己可以承受的范围，只需把自己可以承受的能力与之相匹配，给出相应的参与资金比例、相应的仓位控制，就可以自如地参与其中。如果没法应付某一可能情况（例如可能出现第三类卖点），那就别参与，因为该情况是一个可能的选项；对所有可能都有面对的技术，就可以参与。还可以把仓位弄得特别小地去参与，以培养自己面对相应情况的能力，能力要干才能培养，关键是知道自己干什么，而不是糊涂蛋瞎蒙。
  evidence_quote: 你只需要把自己可以承受的能力与之相匹配，给出相应的参与资金比例，相应的仓位控制，就可以自如地参与其中了……把市场分析好了，把情况分类好了，然后问一下自己，你有这个处理所有可能情况的能力吗？如果没有，那就算了；如果有，就上。事情就这么简单。
  interpretation: 这是缠论的资金管理原则：仓位大小不取决于对行情方向的信心，而取决于对所有分类后果的应付能力；只要存在一个没法应付的可能，就直接否决参与。小仓位练手被明确认可为能力培养路径。
