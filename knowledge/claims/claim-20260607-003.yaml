  subject: 领涨龙头先跌——吹哨人信号识别方法
  timeframe: permanent
  statement: 一轮行情中涨得最猛的领涨品种（"大将军"），如果率先大跌，就是整个板块的吹哨人信号。高位品种不会幸免——这就是行军打仗的比喻：大将军先被斩于马下，后面的大臣也逃不过。
  evidence_quote: 利通电子这就是名副其实的大将军。大将军在周五先被斩于马下了，后面这些皇宫大臣，他们能幸免于难吗？这种从三月份炒股以来一路涨的最猛的这种品种，它就是一个吹哨人。他如果提前砸了，这些高高在上一直在涨的东西，绝对不会好过。
  interpretation: 这是UP的方法论——用领涨龙头作为板块趋势的先行指标。龙头先跌=撤退信号，适用于任何主题行情。
