  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 三类买点与中枢的位置关系
  topic: 一买只在中枢之下，三买只在中枢之上，二三类买点可重合且常引发大级别上涨
  statement: 三类买点与最近中枢的位置关系：第一类买点只可能在下跌确立后的中枢下方出现，一个上涨趋势确定后不可能再有第一、二类买点，只可能有第三类买点；第二类买点与第一类买点前后相连，是第一类买点出现后第二段次级别走势的低点，可以在中枢上、中、下任何位置出现，中枢下出现的力度值得怀疑、出现扩张性中枢的可能性极大，中枢上出现的中枢新生机会很大；第三类买点是中枢扩张或新生产生的。第一类与第二类、第一类与第三类买点不可能重合，唯一可能重合的是第二类与第三类买点：当第一类买点出现后，一个次级别走势凌厉地直接上破前面下跌的最后一个中枢，然后在其上次级别回抽不触及该中枢，此时出现二、三类买点重合，一旦出现这种情况，一个大级别的上涨往往就会出现。
  evidence_quote: 一个上涨趋势确定后，不可能再有第一类与第二类买点，只可能有第三类买点……只有第二类买点与第三类买点是可能产生重合的……但实际上，一旦出现这种情况，一个大级别的上涨往往就会出现。
  interpretation: 位置分类给出各买点的排他性条件与力度排序线索：二买的位置（中枢下中上）预告其后走势性质。二三买重合是攻击力最强的介入形态，原文以1994年8月大盘325点后5分钟级别回抽为历史案例。
