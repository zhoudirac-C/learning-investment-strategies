    - 地缘宏观风险锚
    - 业绩超预期筛选
    reasoning_chain:
    - step: 1
      name: 定性行情性质
      question: 普涨是趋势反转还是情绪修复？
      UP_logic: 普涨本质是地缘情绪回暖+超跌修复共振，而非V型反转；普涨后必然分化轮动。
      evidence_sources:
      - 上证收涨2.69%
      - 涨跌比17:1
      - 涨幅居前为前期调整板块
    - step: 2
      name: 宏观风险锚定
      question: 外部风险环境是否压制A股？
      UP_logic: 油价能否稳在100美元下方是核心判断标准；稳则全球震荡向上，重回100上方则全面重估；地缘停火是拖延之策。
      evidence_sources:
      - 美原油91.50支撑/106目标
      - 美债收益率下行不及预期
      - 地缘停火传闻
    - step: 3
      name: 量能历史对标
      question: 量能是否支持持续上攻？
      UP_logic: 量能是决定反弹/反转的唯一核心；本次2.43万亿已一步到位触及2025年10月反弹峰值2.42万亿，大概率惯性双头。
      evidence_sources:
      - 2025年10月底反弹峰值2.42万亿
      - 2025年5月放量后至6月25日才再突破
    - step: 4
      name: 技术点位确认
      question: 什么信号能确认上升趋势？
      UP_logic: 重点看沪指15点收盘能否突破4012；突破则趋势确立，否则观望；MACD金叉定中期反弹，15分钟高位盘中震荡。
      evidence_sources:
      - 沪指4012压力/3955支撑
      - 日线MACD金叉
      - 15分钟级别指标高位
    - step: 5
      name: 主线证据验证
      question: 普涨后哪条线能成为持续主线？
      UP_logic: AI全产业链是绝对主线，是节前风格切换的落地；分支强度看Token持续性、大资金风向标、日内承接与连板。
      evidence_sources:
      - OpenRouter Token消耗2.1T→24.5T
      - DeepSeek V4适配昇腾
      - HappyHorse登顶
      - 阿里通义升级
    - step: 6
      name: 业绩与供给验证
      question: 主线之外还有哪些可参与方向？
      UP_logic: 业绩超预期+供给收缩=锂电材料机会；天华新能单季盈利逼近过去两年总和，锂价同比翻倍带动毛利率回升。
      evidence_sources:
      - 天华新能业绩预告
      - 津巴布韦锂矿出口延迟
      - 中矿资源/融捷股份储量
    risk_factors:
    - 油价重回100美元上方，引发全球大类资产重估
    - 沪指无法站稳4012且成交额萎缩，反弹走双头后回落
    - 地缘谈判出现实质进展，证伪当前“缓兵之策”的底层判断
    - AI主线日内承接转弱、连板效应消失，主线可能切换
    confidence_indicators:
    - 沪指放量站稳4012点，上升趋势确认
    - 成交额维持在2.43万亿附近，量能持续不缩
    - 原油稳定在100美元下方，全球风险偏好延续
    - AI分支出现大资金持续买入与连板承接
    - 一季报超预期品种带动板块扩散
    merge_suggestion: 归入市场主线识别：普涨后通过量能/技术/产业证据确认AI主线地位
