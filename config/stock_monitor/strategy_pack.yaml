notification_policy:
  only_notify_when:
  - 液冷/散热触发买入点或证伪
  - 上游涨价链触发观察点或扩散确认
  - CPU自研链组内联动恢复或持续分化
  - 大盘4055支撑验证或跌破
  - 半导体/消费出现规避方向异动
  - 算力租赁/token概念发酵
  suppress_when:
  - 只是普通红绿波动
  - 单票异动但板块不共振
  - 同一股票同一信号30分钟内已提醒
  - 当前不在A股交易时段
  - 规避方向（半导体/消费）的普通波动
  message_fields:
  - time
  - action
  - stock
  - price
  - position_context
  - trigger
  - market_context
  - suggested_plan
  - invalidation
  - next_check
index_rules:
- name: 4055_broken
  index: 上证指数
  trigger_condition: close_below
  threshold: 4055
  severity: risk
  action: 4055支撑跌破
  trigger_template: 收盘跌破{threshold}
  interpretation: 5月30日上证4068.57收盘已跌破4055支撑。4055是30分钟底部结构支撑，跌破意味着小级别反弹预期失效，回归调整剧本。需降低仓位，等待新的支撑位确认。
- name: 4000_support
  index: 上证指数
  trigger_condition: close_below
  threshold: 4000
  severity: risk
  action: 4000点强支撑跌破
  trigger_template: 收盘跌破{threshold}
  interpretation: 4000点是更强的心理和技术支撑。若跌破，调整加深，需重新评估底部位置，仓位控制在极低水平。
- name: kechuang50_double_top
  index: 科创50
  trigger_condition: close_below
  threshold: 1750
  severity: risk
  action: 科创50双顶调整深化
  trigger_template: 收盘跌破{threshold}
  interpretation: 科创50 120分钟双顶结构，5/30已大跌至1751.32(-5.04%)。若继续跌破1750，调整深化，半导体/科技核心继续承压。
- name: weak_repair_alert
  index: 上证指数
  trigger_condition: close_above
  threshold: 4080
  severity: observe
  action: 指数弱修复观察
  trigger_template: 收盘收复{threshold}
  interpretation: 若反弹收复4080，视为弱修复，降低次日预期，持仓以持有观察为主不新增净仓.
- name: trend_defense_4032
  index: 上证指数
  trend_defense: 4032
  severity: observe
  action: 4032趋势位跌破观察
  interpretation: 6月2日早盘提示趋势位4032点，短期只需盯住此位是否破位。4000点上方近几日明显有承接，4032是调整第14天的关键趋势支撑位，跌破则调整加深。
- name: kechuang1750_legacy
  index: 科创50
  trend_defense: 1750
  severity: risk
  action: 科创50双顶调整深化
