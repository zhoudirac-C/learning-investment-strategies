  subject: 葛兰碧八大法则的买卖对称结构
  timeframe: permanent
  statement: 八大法则按买一、买二、买三、买四与卖一、卖二、卖三、卖四统一对称排序：买一是趋势转强后的向上突破、买二是突破趋势中回踩不破、买三是上升趋势中短暂跌破后快速收回、买四是价格大幅低于均线后的负乖离修正；卖一是趋势转弱后向下跌破、卖二是下降趋势中反抽不过、卖三是下降趋势中短暂突破后重新跌回、卖四是正乖离过大。买一卖一是趋势转折对称，买二卖二是成本区攻防对称，买三卖三是陷阱识别对称（假跌破与假突破），买四卖四是乖离率修正对称。
  evidence_quote: 我是做了一个改正，我是买一、买二、买三、买四和卖一、卖二、卖三、卖四，我是这个样子，统一的有一个对称的顺序。
  interpretation: UP把传统一二三四五六八点位重排为买卖各四点的对称结构，便于按趋势转折、成本区攻防、陷阱识别、乖离修正四组记忆和应用。
