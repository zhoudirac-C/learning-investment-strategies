  action_bias: 可评估（仅限量能维持3万亿趋势+全A中阳线）
  rules:
  - 10:00量能对比：达到或超节前→偏积极；明显缩量→推翻预期
  - 全A是否延续K型分化（双创强vs沪指弱）
  - 涨价链方向是否出现连板核心
- window: '11:20'
  name: 上午收盘前
  action_bias: 只观察
  rules:
  - 上午量能定性+科技修复进展
  - 持仓止损检查
- window: '13:10'
  name: 午后风险窗口
  action_bias: 午后只看不买
  rules:
  - 【节后首日】留意科创50走势——高Beta可能放大海外映射
  - 量能趋势确认：上午放量延续vs午后缩量
  - 涨价线是否维持（CCL/存储/铟/光互联）
  - 是否有尾盘杀信号
- window: '14:00'
  name: 下午量能第二节点
  action_bias: 只看不买
  rules:
  - 量能趋势确认：上午放量延续vs午后缩量
  - 涨价线是否维持
  - 是否有尾盘杀信号
- window: '14:52'
  name: 尾盘条件单
  action_bias: 可尾盘低吸（仅限全A放量中阳线确认日）
  rules:
  - 全日定性为强修复（全A中阳线+放量3万亿+维持）→可评估轻仓介入
  - 弱修复/量能回落/等待确认阶段→不操作
  - 雅克科技止损检查
agent_analysis_schedule:
- id: open_auction
  time: 09:26
  name: 集合竞价后
  focus: ETF竞价强度、科技方向（存储/MLCC/光通信）是否高开、券商是否异动、科创50方向判断。
- id: open_confirm
  time: 09:45
  name: 开盘15分钟确认
  focus: 全A方向确认。存储链（模组/利基/车规）板块联动验证；MLCC/被动元件分歧后承接；券商年线是否突破；科创50是否极端走势。
- id: morning_confirm
  time: '10:00'
  name: 10点确认
  focus: 30分钟后今日基调。量能是否维持3万亿+。存储/MLCC/光通信核心是否出现。券商年线得失。
- id: opportunity_scan
  time: '10:30'
  name: 30分钟确认
  focus: 全A是否延续双创强/沪指分化。科技主线是否扩散至钽/交换芯片/储能。科创50风险监控。
- id: noon_review
  time: '11:20'
  name: 上午收盘前
  focus: 上午定性：科技业绩+国产替代双主线是否延续。存储/MLCC方向确认。券商年线监控。微盘股边缘化是否持续。
- id: afternoon_risk
  time: '13:10'
  name: 午后风险窗口
  focus: 冲高回落信号、板块扩散衰竭信号。券商是否放量突破年线。科创50尾盘方向。
- id: mid_afternoon
  time: '14:00'
  name: 午盘监控
  focus: 午后一小时盘面验证。涨价线（存储/MLCC/铟/钽）是否维持、是否有尾盘杀信号。昇腾/智谱催化是否发酵。
- id: tail_condition
  time: '14:52'
  name: 尾盘条件单
  focus: 判断是否符合介入条件。科技主线分歧企稳+券商年线状态+微盘股是否继续弱于全A。不符合则不做任何操作。
