  subject: 市场合力与主力资金
  topic: 走势由当下合力构成，主力分派别且不可能逆经济大势
  statement: 市场每一时刻的走势都由当下的合力构成；当系统中存在特别巨大的分力时，对合力的分析不能脱离对这些巨大分力的分析，控盘程度极端高的股票就是单一分力远大于其他的情形，而这种系统的稳定性会产生突变。流行的统一主力说法纯粹出于想象：市场从来分裂着不同的利益集团，主力资金从来分派别，各派别之间有联手、有默契，也有暗算、互相拆台。必须明确，任何主力资金无论什么背景、级别，最终都不可能逆整个经济的大势而行，而且必须不断折腾，在不同市场、板块间变换。最大的几拨资金构成食物链最上层，一般保持江湖规矩，但都在等一方出现破绽时一拥而上，并倾向维持各层次的生态平衡，绞杀破坏平衡的暴发户。
  evidence_quote: 市场每一时刻的走势，都由当下的合力构成……有些分力是特别巨大于其他的分力，在这种情况下，对合力的分析，不能脱离对这些特别巨大分力的分析……而事实上，这种所谓的主力，从来没存在过。市场从来都分裂着不同的利益集团，所谓的主力资金，从来都是分派别的，各派别之间，会有联手，会有默契，但也有暗算、互相拆台等等……必须明确的，任何的主力资金，无论什么背景、级别，最终都不可能逆整个经济的大势而行……对于最高级别的主力来说，一个各层次的生态平衡是最有利的。
  interpretation: 纠正庄家画线的散户想象，给出资金面的分析框架。操作含义：无论什么资金，站在市场走势的角度不过是构造出不同级别的买卖点，散户无须知道馅饼是怎么制造的，只需知道怎么才能吃到；技术分析解决战术问题，主力资金层面的运作是战略问题，不在技术分析范围内。
