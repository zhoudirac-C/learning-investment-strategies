  claim_type: methodology
  subject: 急跌后见底的两种走势框架
  timeframe: permanent
  statement: A股急跌后见底只有两种走势：①走V——熊市/流动性危机型，非常迅速，标志是单日标志性大涨（大盘尾盘仍涨1个点以上、创业板2个点以上，2022-04那种5个点）；②流动性枯竭型——短暂V一下后横盘形成平台、收复急跌跌幅，反弹级别小。不管哪种都会有一个反弹
  evidence_quote: 急杀后见底会出现什么样的市场信号……A股这边的话就是两种情况，第一种就是急杀走V了……第二种情况就是急跌后流动性枯竭了，没有V起来，它会怎么走？……短暂V了一下就横了，但它也会收复一个急跌的跌幅，形成一个平台。
  interpretation: 可复用的底部形态分类框架：判据=标志性大涨的幅度与持续性 vs 横盘平台。走V看单日涨幅（≥1-2%且尾盘保持），枯竭型看平台是否守住。
