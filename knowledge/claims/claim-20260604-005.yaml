  subject: 大小盘同步方法
  topic: 大小盘同步决定主升质量
  statement: 健康的情绪周期需要大小指数同步上涨，微盘股/全A破位会反过来压制上涨板块，5月22日PCB未能走出主升的根因就是微盘股持续破位
  evidence_quote: 回看三个典型的强共振周期——3月24日、4月8日、4月29日——微盘股和全A是跟随向上的；反例是5月22日那波PCB，那一轮之所以没有走出完整结构的主升，恰恰是因为微盘股持续破位；一轮正常的上涨后期，可以一个涨得快、一个涨得慢，但不能一个往上涨、一个往下哐哐掉
  interpretation: 这是UP方法论的核心逻辑：大小盘同步是主升质量的必要条件。用历史强共振周期（3月、4月）与反例（5月22日）做对比，论证微盘股破位对科技主升的压制效应。
