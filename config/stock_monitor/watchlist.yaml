  - 【CCL技术等级】M7（Dk~3.3/Df~0.002，112G可用）→ M8（Dk~3.1/Df~0.0012，Rubin 2026需求拐点）→ M9（Dk~3.0/Df~0.0007，Midplane门槛，全球供给紧）
  - 【涨价持续性】CCL涨价是否延续至2027下半年，FR8已从160涨至200+，下半年为传统旺季
  - 【供给瓶颈】M6以上高端CCL缺货严重，客户订单排至2027年底，PCB厂库存仅半月-1月
  - 【国产化进度】AI级超低损耗Df 0.0015性能控制+批次稳定性 vs SABIC/旭化成差距
