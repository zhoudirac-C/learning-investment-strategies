- pattern_id: operation_strategy
  name: 操作策略与仓位管理框架
  description: 当用户直接询问操作建议、仓位管理、买卖纪律、风险控制、具体交易计划、止盈止损、加仓减仓时使用。典型查询：今天怎么操作、几成仓合适、要不要减仓、怎么止盈止损、持仓怎么调。该框架评估市场环境、确定仓位水平、选择操作工具、执行风控，给出可落地的操作策略而非方向判断。
  trigger:
  - 持仓或拟建仓标的需要确定仓位/止损/止盈的具体数值
  - 市场阶段切换（主升/震荡/调整/恐慌）需要调整总仓位
  - 组合月回撤接近 10% 等熔断条件被触发
  - 个股无法直接买入，需要替代工具（ETF/可转债）执行
  source_raw:
  - sources/raw/财经/周复盘：26-05-31：周度市场复盘-美股高盛标普500调整研判，原油黄金走势分析与A股操作策略.md
  - sources/raw/财经/复盘：26-04-01：三指收涨科创50涨超3%，智立方奥瑞德富临广联.md
  - sources/raw/财经/复盘：26-05-21：大盘结构修正，半导体操作节奏与4700反弹目标.md
  - sources/raw/财经/复盘：26-05-21：真恐慌非崩盘，科技洗牌与二次冰点策略.md
  - sources/raw/财经/早盘：26-05-27：指数调整无方向，华为韬不及预期，等缩量等情绪回暖.md
  applicable_themes:
  - 主线板块内部去弱留强
  - 事件驱动
  - 低位补涨
  - 半导体
  - 政策主题
  - 新主线承接判断
  - 新股上市
  - 杠杆交易
  - 板块见顶信号
  - 板块轮动
  - 资金管理
  - 资金避险
  - 超跌反弹
  - 题材炒作
  - 高位放量杀跌后的市场定性
  - 高风险投资策略
  data_requirements:
  - name: 市场阶段与情绪数据
    channel: 行情数据（大盘技术位/成交量/情绪指标/主线强度）
  - name: 当前持仓与回撤
    channel: config/stock_monitor/positions.yaml（本地私有，不进 git）
  - name: 止损位与波动数据
    channel: 行情数据（支撑位/历史波动率）/ K线缓存
  - name: 替代工具数据
    channel: 行情数据（ETF持仓与流动性/可转债价格）
  steps:
  - step: 1
    name: 评估市场环境
    question: 当前市场适合什么操作策略？
    action: 按市场阶段定基调：主升期重仓持股、震荡期高抛低吸做T、调整期轻仓或空仓、恐慌期左侧试错或观望
    data:
    - 市场阶段与情绪数据
  - step: 2
    name: 确定仓位水平
    question: 当前应该几成仓？
    action: 按公式计算单标的仓位——仓位% = 单笔风险上限% ÷ 止损幅度%；再套三层上限（个股 ≤10%、单主题 ≤20%、路径B合计 ≤30%）取最小值，重算实际风险确认
      ≤2%；组合月回撤 ≥10% 触发强制减半
    data:
    - 当前持仓与回撤
    - 止损位与波动数据
    - 市场阶段与情绪数据
  - step: 3
    name: 选择操作工具
    question: 用什么工具执行策略？
    action: 个股为主、ETF为辅、可转债套利；无法买个股时通过ETF持仓反推成分股，或做可转债
    data:
    - 替代工具数据
  - step: 4
    name: 执行与风控
    question: 如何执行买卖并控制风险？
    action: 不追高、等分歧回踩；跌破关键位3日不收回止损；单笔亏损控制在5%以内；获利20%考虑减仓；每条建议必须同时给出仓位/止损/单笔风险三个数值，缺一打回
    data:
    - 止损位与波动数据
    - 当前持仓与回撤
  falsification:
  - 市场阶段判断错误（策略基调与实际走势持续背离）
  - 关键支撑位跌破且3日不收回（单笔策略证伪，执行止损）
  - 组合月回撤 ≥10%（触发熔断，强制减半）
  - 大盘系统性破位下行或宏观政策重大转向
  validation:
    historical_hit_rate: 0.5182
    hit_rate_note: 买入信号引擎离线回测实测（logs/backtest_buy_signals_20260808.md）——5日前向命中率51.8%（n=1403）、10日53.4%（n=1279）、20日47.9%（n=1070），窗口2026-04-27~2026-08-07，标的池212只；引擎内部缩量/MA20条件读取缓存最新窗口而非信号日（qing_investment未改），结果为近似
    applicable_regime: null
    known_failures: []
    confidence_indicators:
    - 多个独立数据源交叉验证
    - 板块内多只个股联动
    - 机构研报密集覆盖
    - 成交量持续放大
