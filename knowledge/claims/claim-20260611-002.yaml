  claim_type: sector-theme
  subject: 钨产业链出口管制受益
  timeframe: trend
  statement: 钨产业链是半导体材料对日替代主线的直接催化。钨被列为战略矿产实行开采总量刚性控制后，钨精矿和钨粉价格一年上涨6到7倍。占全球先进制程钨靶约40%产能的日本JX金属和三井金属因钨粉断供开工率降至约40%，日韩存储厂被迫转单国内靶材厂。全球靶材新产能密集开出要到2027年底，涨价周期的持续性具备产业基础。
  evidence_quote: 最直接的催化在钨产业链：钨被列为战略矿产并实行开采总量刚性控制后，钨精矿、钨粉价格一年上涨6–7倍，仲钨酸铵涨幅超550%；占全球先进制程钨靶约40%产能的日本JX金属、三井金属因钨粉断供开工率降至约40%、交付周期拉长至4–6个月，日韩存储厂被迫转单国内，国内靶材厂产能满载、现货趋紧。中船特气（六氟化钨）与江丰电子（钨靶材＋零部件，全球靶材龙二、国内零部件第二）本质上处于同一条"钨粉出口管制受益"的涨价主线上，且全球靶材新产能密集开出要到2027年底，涨价周期的持续性具备产业基础。
  interpretation: 钨的涨价逻辑非常清晰：上游矿端限产→价格暴涨→日系靶材厂断供→转单国内。这是一个完整的供需逻辑链。且全球靶材新产能要2027年底才密集开出，涨价持续性有产业基础支撑，不是短期脉冲。
