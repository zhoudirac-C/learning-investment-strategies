# BI-002 向下笔"区间"口径判别样本（课77，BI-003 镜像）
# claim-20070905-001-b：顶都在底的范围内或顶比底还低，显然不可接受——不成笔。
#   对向下笔（顶→底）镜像为：底都在顶的范围内或底比顶还高 → 不成笔。
# 构造（A/B 两种解释结论相反的向下笔判别样本）：
#   顶@1：中间 K 线（bar1）区间 [12.3,11.0]；左肩 bar0 低至 10.4
#     → 顶分型"整个分型区间"合并低 = 10.4（口径 A），"最高那 K 线自身"低 = 11.0（口径 B）。
#   底@5：中间 K 线（bar5）区间 [11.4,10.5]，合并低 = 10.5（两种口径相同）。
#   口径 A：底中间低 10.5 > 顶合并低 10.4 → 底在顶范围内 → 不成笔；
#   口径 B：底中间低 10.5 < 顶中间低 11.0 → 有一部分低于 → 成笔。
# expect 按 ADR-001 仲裁结论 B 写（2026-07-19 UP 评审门拍板，由口径 A 的 bi: [] 翻转）：
#   成笔 (1,5,down)；两分型均未被反向笔确认 → bi.sure: false。
#   fx.sure 按 M2-1 位置约定（末位 False、其余 True，与 BI-004/BI-005 同口径）：
#   fx 表 2 元素 → [True, False]（首位=非末位 True，末位 False）。
#   （chanpy 在 strict 下仍 bi=[]，待 M2 配置 bi_fx_check=loss 后通过。）
#
# 修复说明（评审 C-1，2026-07-19）：原设计"两口径一致不成笔"（顶中间 11.6 <
#   底中间 12.0）经证明几何上不可实现：底分型右肩按分型定义必高于底中间 K 线，
#   若反弹顶再低于底中间，则右肩到该顶之间非包含即多出中间分型——换言之口径 B
#   （仅比分型中间 K 线）对任何可构造的相邻分型恒放行，"两口径一致不成笔"样本
#   不存在。此结论本身是 ADR-001 仲裁的重要证据：课 77 区间条件只在"整个分型
#   区间"口径下才有牙齿。原案 bars 正是因此混入未处理包含（bar2 吞并 bar3/bar4），
#   判别功能失效。现将本用例改造为向下笔 A/B 判别样本（BI-003 镜像，同时验证
#   两实现的向下笔区间检查），保留 fx@1/fx@5 位置与 bi: [] 的 expect，claim 指派不变。
# 实证（修复时真实适配器复跑）：chanpy strict（默认配置）bi=[]，同输入
#   bi_fx_check=half/loss 时画出 (1,5,down)；czsc 画出 (1,5,down)。判别场景
#   两实现均真实走到。
case_id: BI-002
claim_refs:
  - claim-20070905-001-b
bars:
  - [11.5, 12.0, 10.4, 11.0]
  - [11.0, 12.3, 11.0, 12.1]
  - [11.9, 12.1, 10.8, 11.0]
  - [11.0, 11.9, 10.7, 10.9]
  - [10.9, 11.6, 10.6, 10.8]
  - [10.8, 11.4, 10.5, 10.7]
  - [10.7, 11.5, 10.6, 11.3]
  - [11.3, 11.7, 11.0, 11.5]
expect:
  fx:
    - {idx: 1, type: up, sure: true}
    - {idx: 5, type: down, sure: false}
  bi:
    - {start_idx: 1, end_idx: 5, dir: down, sure: false}
