  evidence_quote: 华天科技快速拉升并封板时，指数一度回升，原有抱团随后出现松动……可后续指数未能延续回升，新方向也没有形成足够广泛的接力，先行松动的抱团便同时承受兑现压力和信心回落。若增量买盘不足，切换容易变成不同方向之间的争夺，甚至出现旧方向松动、新方向也未站稳的局面。
  interpretation: UP 用时序（半导体封板→指数回升→抱团松动→指数未延续→抱团承压）论证情绪机制：切换本身是存量博弈，没有增量就只有争夺。这是解释「为什么反弹失败会加速亏钱效应」的框架。
