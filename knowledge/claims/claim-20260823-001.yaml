  subject: 识别不该发生买点的五项标准
  timeframe: permanent
  statement: 识别不该发生的买点的五项标准：①有没有足够的上涨支点（新逻辑、新催化、板块共振、有效突破、明确止跌、龙头引领），只是跌了不少应该会反弹的买点质量通常很低；②潜在收益是否覆盖失败路径——看错了会亏多少、需要等多久、有没有明确止损位、是否存在更优替代机会；③个股是不是板块核心，同样承担板块风险应选更强更新更有引领性更容易获得资金修复的股票；④当前是新趋势还是老票修复，新趋势可给延续预期，老票修复更应重视兑现和冲高回落风险；⑤买入后有没有清晰的检验位，没有均线平台、分时和逻辑证伪条件的买点一旦失败就会陷入无限等待。任何交易都不是孤立选择，五六个点的收益不稀缺，清晰的风险边界才稀缺，不要把可以买理解为值得买；优秀交易系统的价值不只是告诉什么时候可以买，还要帮助放弃大量低质量机会。
  evidence_quote: 因为五六个点它并不稀缺，清晰的风险边界它才能够稀缺。所以我们就不要把可以买去理解为值得买。
  interpretation: 这是本课的收口框架：五项标准把"该不该买"从价格问题转成结构问题（支点/赔率/地位/阶段/检验位），克制不该发生的买点比提高选股数量更重要。
