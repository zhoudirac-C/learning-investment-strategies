market_framework:
  current_stage: 修复观察期——第三次修复尝试（前两次5/22和6/2均已失败）。全A能否跟随补涨是区分强/弱修复的锚。操作：做T为主，等右侧确认。
  core_question: 全A指数能否跟随科技补涨脱离破位区？涨停能否维持≥64家、二连板≥17家？强修复→分歧低吸科技核心；弱修复→更谨慎。
  up_quote: 6月10日：技术性反弹未确认反转。两个一字板直接指明方向：上游材料辅材#1，半导体模拟芯片#2。冷眼旁观，等结构慢慢理顺。
  key_assumptions:
  - 第三次修复，全A指数跟随补涨是关键变量
  - 上游材料(辅材)为#1主线，半导体(模拟芯片/硅片)为#2
  - 电子树脂受沙特断供+PCB半导体化M10双催化
  - 存储18.61亿美元锁价合同确认产业紧缺
  - 操作以做T为主，等全A确认后提高进攻性
  - 隔夜外盘美股大跌加剧不确定性（加息担忧）
  - 燃气轮机方向维持核心配置不变
  invalidation_conditions:
  - 全A指数继续破位→弱修复确认→降低进攻仓位
  - 涨停腰斩(<64家)或二连板<17家→修复质量差
  - 全A指数跌破前低且30分钟无法收回→弱修复确认→降低进攻仓位至3成以下
  - 万泽跌破30.5风控线→执行减仓
intraday_schedule:
- window: 09:15-09:30
  name: 集合竞价
  action_bias: 只观察
  rules:
  - 观察上游材料方向(CCL/树脂/光纤)是否延续强势
  - 观察半导体(模拟芯片)是否跟涨
  - 观察燃气轮机方向(杰瑞/万泽)是否延续
  - 观察全A指数开盘位置（距破位多远）
- window: 09:30-10:00
  name: 开盘确认
  action_bias: 只观察
  rules:
  - 涨停数量是否维持、二连板晋级率
  - 两个一字板方向是否扩散
  - 全A指数跟随方向
agent_analysis_schedule:
- id: open_auction
  time: 09:26
  name: 集合竞价后
  focus: 上游材料(辅材)/半导体(模拟芯片/硅片)是否按预期走，全A开盘位置与方向。**判断大盘是否止跌企稳：低开高走/平开震荡+全A跟随=企稳信号；低开低走+全A破位=未企稳。若企稳观察上游材料低吸机会，若未企稳继续等待。**
- id: open_confirm
  time: 09:45
  name: 开盘15分钟确认
  focus: 全A指数方向确认——跟随补涨(强修复) vs 继续破位(弱修复)；上游材料/半导体谁主动领涨。持仓是否触发风控。**判断大盘是否止跌企稳：15分钟内全A不创新低且放量收回=企稳；全A继续创新低=未企稳。**
- id: morning_confirm
  time: '10:00'
  name: 10点确认
  focus: 30分钟后今天基调基本确定——强修复/弱修复/分歧/防御？全A涨跌幅是定性锚（>0.5%强修复，0~0.5%弱修复，<0%分歧/防御）。写出今日机会模式初筛。**判断大盘是否止跌企稳：30分钟内全A出现日内低点后反弹且持续=企稳。**
- id: opportunity_scan
  time: '10:30'
  name: 30分钟确认
  focus: 全A是否不创新低，上游材料/半导体/MLCC能否做T或观察。万泽是否触发风控。**判断大盘是否止跌企稳：30分钟内全A出现日内低点后反弹且持续=企稳。**
- id: noon_review
  time: '11:20'
  name: 上午收盘前
  focus: 上午定性为强修复、弱修复、防御切换还是继续分歧。**判断大盘是否止跌企稳：上午收盘在日内高点附近=企稳。**
- id: afternoon_risk
  time: '13:10'
  name: 午后风险窗口
  focus: 按午后只看不买纪律，重点观察冲高回落和板块扩散衰竭。**判断大盘是否止跌企稳：午后开盘不跳水且维持震荡=企稳。**
- id: mid_afternoon
  time: '14:00'
  name: 午盘监控
  focus: 午后一小时盘面验证：上游涨价链/CCL/MLCC/硅片是否触发观察点、持仓是否触发风控、万泽是否逼近30.5。只讲当下，不预判尾盘。**判断大盘是否止跌企稳：14:00前后全A出现低点后反弹=企稳。**
- id: tail_condition
  time: '14:55'
  name: 尾盘条件单
  focus: 判断是否符合尾盘观察、规避尾盘杀的条件。**判断大盘是否止跌企稳：尾盘维持震荡或小幅回升=企稳；尾盘跳水=未企稳。若企稳可低吸，若未企稳只观察不买。**
position_rules:
- id: opportunity_panic_oversold
  name: 恐慌超卖策略
  description: 对应机会模式1。当板块系统性回调（非个股利空），日内跌>5%时触发
  action: 评估赔率后试探买入
  max_position: 1成
  stop_loss_pct: 3
  claim_basis: UP的'别人恐慌我贪婪'思想
- id: opportunity_breakout
  name: 平台突破策略
  description: 对应机会模式2。横盘2+周后放量突破区间上沿
  action: 确认突破有效性（次日不回落）后追入
  max_position: 1.5成
  stop_loss_pct: 5
- id: opportunity_technical_support
  name: 技术支撑确认
  description: 对应机会模式3。回踩关键均线/平台企稳，缩量确认
  action: 企稳后试探买入
  max_position: 1成
  stop_loss_pct: 3
- id: opportunity_sector_rotation
  name: 板块轮动早期
  description: 对应机会模式4。新方向首日启动，龙头涨停，观察次日持续性
  action: 龙头首日不追，次日确认后轻仓试探
  max_position: 0.5成
  stop_loss_pct: 5
- id: opportunity_leader_pullback
  name: 龙头分歧低吸
  description: 对应机会模式5。主线龙头首次大分歧，缩量回踩
  action: 分歧日尾盘或次日低吸
  max_position: 1.5成
  stop_loss_pct: 3
- id: opportunity_tail_condition
  name: 尾盘条件单
  description: 对应机会模式6。14:30后符合特定技术条件（回踩不破、放量企稳）
  action: 尾盘确认后买入
  max_position: 0.5成
  stop_loss_pct: 2
- id: opportunity_event_driven
  name: 事件驱动
  description: 对应机会模式7。突发利好/利空导致赔率突变
  action: 评估事件实质影响后决策
  max_position: 1成
  stop_loss_pct: 5
quant_entry_strategy:
  position_advice:
    empty_account: 等指数突破4120确认趋势。当前关注燃气轮机/工程机械/创新药低位配置。不碰消费和半导体。
    full_account: 优先减仓止损。保留现金。万泽逼近风控线需警惕。
    current_bias: 做T为主/持股为主。磨底期不急于抄底。重心燃气轮机方向。不开新仓。
