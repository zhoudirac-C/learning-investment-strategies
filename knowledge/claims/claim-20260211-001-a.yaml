statement: "成交额创年内新低同时振幅创阶段新低时，市场变盘临近。此后三个交易日：若持续缩量+大金融和情绪不失控→可积极试错个股；若突然放量→先确认方向再行动。这是通过量能和波动率的双重收敛来判断变盘时点的方法论。"
evidence_quote: "成交2.11万亿（年内最低），振幅创去年8月以来新低。'量能创新低+振幅极窄'=变盘临近。接下来三天：持续缩量+大金融/情绪不失控→个股积极试错；突然放量→先确认方向。"
interpretation: "UP提出了量能+振幅的双维度变盘判断框架。单一的缩量不够精准——需要在缩量基础上叠加振幅收敛（市场多空僵持），才构成高概率的变盘信号。同时给出了变盘后两套预案（继续缩量试错vs放量先看方向），把判断和执行分开。"
