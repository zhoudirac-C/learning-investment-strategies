- pattern_id: mainline_identification
  name: 市场主线识别与切换判断框架
  description: 当用户询问市场主线、板块强度对比、主线切换、方向选择时使用。典型查询：今天主线是什么、市场主线怎么看、XX板块是不是主线、主线会不会切换、哪个方向最强、科技还是红利。该框架通过判断市场阶段与核心矛盾、识别候选主线、验证资金/政策/产业共振、排除假切换信号、制定跟随或防守策略，帮助确认当前市场核心主线及其持续性。
  trigger:
  - 某板块成交额占全市场比重连续抬升且涨幅排名居前
  - 板块内出现完整龙头梯队（连板龙头+中军+补涨分支）
  - 主线核心标的滞涨或破位，资金出现高低切换迹象
  - 重大政策发布、海外映射板块异动或业绩预告密集披露的方向选择窗口
