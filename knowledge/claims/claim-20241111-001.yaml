  subject: 中线仓位分配法
  topic: 五成中线共振股加两成滚动做T加三成短线，永远不满仓
  timeframe: permanent
  statement: 中线仓位分配：五成仓买一只能与股市共振的中线股，留两成仓不断滚动做T，另三成仓做短线（分为3到4只股，可以打板也可以赌季报）；永远不要满仓
  evidence_quote: 首先要有一只股占五成的仓位，那么这只股呢是能够跟股市共振的。……那留两层仓位做滚动，就是说这两层的仓位呢是可以不断的做T的。永远不要满仓，这是一个非常理性的一个持仓的思路。还有另外的三层呢，我们用来做短线，另外三层的短线我们分为三到四只股来做。你可以打板，你也可以赌季报。
  interpretation: UP自陈这是「如果重新作为股市小白进场」认为最合适的分仓比例。结构=中线底仓（共振大盘）+滚动T仓+短线机动仓，核心约束是永远不满仓。中线选股与仓位管理相辅相成。
