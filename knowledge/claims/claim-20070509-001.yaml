  subject: 整数关口突破的有效性确认
  topic: 重要点位的突破要形成有效中枢并出现第三类买点才算确认
  statement: 指数或股价对重要点位的突破不可能一下就确认完成，技术上的确认标准是：在突破位置形成一个有效的、有一定级别的中枢，然后出现该中枢的第三类买点，才能确认突破的有效性。这个过程在理论上存在失败而往下形成第三类卖点的可能，所以一切无须预测，看图操作。
  evidence_quote: 当然，4000 点的突破不可能一下就确认完成，这里的震荡依然少不了，技术点说，就是要在这里形成一个有效的有点级别的中枢，然后出现该中枢的第三买点，才能确认突破的有效性。这个过程在理论上当然有失败往下形成第三卖点的可能，所以一切无须预测，看图操作是唯一正确的。
  interpretation: 这是第三类买点用于趋势确认的典型用法：关口突破本身不是信号，突破后中枢的新生与第三类买点才是。原文语境是2007年5月上证4000点，具体点位只是案例，规则可复用于任何关键位。
