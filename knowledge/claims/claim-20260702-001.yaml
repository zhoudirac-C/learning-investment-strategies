  timeframe: trend
  statement: UP判断大金融和医药已走出趋势但走法不连贯，后市预期不是风格切换而是与科技共同走强，落点上仍以金融为主。资金循环结构为增量资金给非科技输血、非科技中部分解套资金又流向科技，最终走向全面行情。
  evidence_quote: 在增量资金断档的时点上，科技依旧强势，甚至仍不断从非科技方向抽血，形成「增量资金给非科技输血、非科技中部分解套资金又流向科技」的闭环。个人判断，这一循环的最终结果，应是慢慢走向全面行情。因此非科技虽多而杂，但考虑到后面的预期不是风格切换、而是共同走强，落点上仍以金融为主。
  interpretation: UP对非科技方向的定性非常精妙：不是风格切换，而是「共同走强」。增量资金入场→非科技（金融/医药）获得流动性→部分资金解套获利后又回流科技→科技维持强势→形成闭环。最终结果是全面行情，不是科技崩了换金融。落点明确：聚焦金融为主。
