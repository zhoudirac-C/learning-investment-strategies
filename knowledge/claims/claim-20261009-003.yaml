  subject: 买前自查与证伪触发清单
  timeframe: permanent
  statement: 买入前须明确研究来源、行情阶段、个股地位、亏损预算和证伪位；无法判断刚起势还是充分演绎时一律按充分演绎保守处理，听来的票反馈差直接走。首阴后次日低开、平开或横盘弱反弹再破位应无条件卖出；趋势股跌停，一律按照底线纪律去处理。持仓中还要复核相对强度及持有理由是否已从做突破漂移到等解套
  evidence_quote: 第二阶段，板块和个股，它是刚刚起势，还是说已经充分演绎了？如果说你判断不出来，那么你一律按照充分演绎去处理，做交易要保守一点。……第四，亏损预算，你的这笔交易最多愿意亏百分之多少？对应仓位下，账户最大风险能不能接受？第五，证伪位，跌破到什么位置，你要去证明这笔交易错了？……六，连跌触发，首阴之后，次日出现了低开、平开或者是横盘弱反弹再破位，那么就要无条件卖出。……跌停，一律按照底线纪律去处理。……第三，你的持仓的理由是否发生偏移？你当初是做突破，现在是不是在等解套？当初做短线，现在是不是被动改成了中线？
  interpretation: 这份清单把买入前风险定义和持仓后复核连起来：阶段不确定时采用保守假设，走势触发证伪位时执行，且不允许用改变持有周期掩盖原交易失败；趋势股跌停只保留UP所述底线纪律，不自行扩展为具体仓位动作。
