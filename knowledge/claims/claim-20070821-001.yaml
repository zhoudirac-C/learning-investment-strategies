  subject: 形态学与动力学
  topic: 理论分形态学与动力学两部分，懒人线路图从分型到各级别中枢
  statement: 缠论本质上分两部分：一是形态学，二是动力学，第三是两者的结合。形态学从本质上就是几何，这部分内容无须任何前提，包括中枢、走势类型、笔、线段之类的东西；动力学方面必须有价格充分有效市场里的非完全绝对趋同交易作为前提，任何涉及背驰的都是动力学的范围，背驰是动力学的基本点之一，中枢、走势的能量结构也属于动力学。懒人学习线路图：分型、笔、线段、最小级别中枢、各级别中枢与走势类型，这是形态学中最基本的内容，完全没有办法再简略，真想学就必须先把这几样东西搞清楚。
  evidence_quote: 本ID 的理论，本质上分两部分，一是形态学，二是动力学，当然三就是两者的结合……站在纯理论的角度，形态学是最根本的。形态学，从本质上就是几何，这部分内容，是无须任何前提的……动力学方面的东西就不同了，必须有本ID 要求的那两个前提：价格充分有效市场里的非完全绝对趋同交易……任何涉及背驰的，都是动力学的范围，背驰是动力学的基本点之一。另外，中枢、走势的能量结构之类的东西，也属于动力学。而形态学，就是中枢、走势类型、笔、线段之类的东西……分型-笔-线段-最小级别中枢-各级别中枢、走势类型。上面几个东西，是形态学中最基本的，完全没有办法再简略了。
  interpretation: 全课程的总纲与自学顺序。形态学无须前提，故任何人造不出反例；动力学前提的含义是市场报价充分且交易方向不完全趋同，背驰类结论才在该前提下成立。课程由浅入深，前面不严格的说法在引进新概念后会严格化（如线段划分在特征序列引入后以67课定义为准）。
