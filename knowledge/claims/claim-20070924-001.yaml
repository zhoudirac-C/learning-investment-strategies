  subject: 分型力度的K线判断
  topic: 从三根K线形态判断顶分型是中继还是成笔，第三根K线定强弱
  statement: 用没有包含关系的顶分型判断力度：一、第一根K线是长阳线而第二、三根都是小阴小阳，这个分型结构的意义不大，小级别上一定显现小级别中枢上移后小级别新中枢的形成，这种顶分型成为真正顶的可能性很小，绝大多数都是中继的；二、第二根K线是长上影甚至直接的长阴，而第三根K线不能以阳线收在第二根K线区间的一半之上，那么该顶分型的力度就比较大，最终延续成笔的可能性就极大；三、第三根K线跌破第一根K线的底而且不能高收到第一根K线区间的一半之上，属于最弱的一种，这顶分型有着较强的杀伤力。另外，完全没有包含关系的分型结构意味着市场双方直截了当没有太多犹豫；包含关系意味着一种犹豫、不确定的观望，小级别上一般会有中枢延伸、扩展之类的东西。
  evidence_quote: 如果第一K 线是一长阳线，而第二、三都是小阴、小阳，那么这个分型结构的意义就不大了，在小级别上，一定显现出小级别中枢上移后小级别新中枢的形成，一般来说，这种顶分型，成为真正顶的可能性很小，绝大多数都是中继的。……但，如果第二根K 线是长上影甚至就是直接的长阴，而第三根K 线不能以阳线收在第二根K 线区间的一半之上，那么该顶分型的力度就比较大，最终要延续成笔的可能性就极大了。……非包含关系处理后的顶分型中，第三根K 线如果跌破第一根K 线的底而且不能高收到第一根K 线区间的一半之上，属于最弱的一种，也就是说这顶分型有着较强的杀伤力。
  interpretation: 直接把阳线以长阴线吃掉的包含关系是最坏的一种。课中上海日线2007年三组K线示例仅作形态演示。三档力度判断与第79课的5日线过滤器可配合使用。
