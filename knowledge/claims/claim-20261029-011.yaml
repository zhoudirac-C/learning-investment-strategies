subject: 明日推演：三种情形（机器人回流、容量科技延续、量能回落同步失去承接），量价确认再决定参与程度
timeframe: temporary
statement: 明日基准情形看普涨后的结构分化：情形A（机器人回落后核心承接→回流）、情形B（容量科技延续→风格迁移确认）、情形C（量能回落、主线与抱团同步失去承接→修复降级）。个人不因一天反弹全面切换风格，也不把首次分歧当作无条件参与理由。
evidence_quote: 情形A：若机器人早盘延续午后的分歧，但核心品种下探后能够稳住，板块出现主动修复，炸板扩散有所缓和，则可继续按强主线首次明显分歧处理。情形B：若算力硬件和半导体继续保持量能与趋势，中军回踩有承接，而情绪票仍然偏弱，就需要提高对容量风格的关注。情形C：若指数冲高回落、成交明显降温，机器人回流失败，同时高位观察标的出现承接松动，则应把今天的普涨更多理解为阶段性修复。
interpretation: UP 将明日推演划分为三种结构情形，每种情形都以量价和承接为确认标准，而非仅凭板块标签或价格形态预判方向，体现了“量价确认，再决定参与程度”的纪律。
