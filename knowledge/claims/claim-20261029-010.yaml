subject: 固态电池：政策打开预期，量产节奏属于预期不能视为统一兑现时间
timeframe: temporary
statement: 北京市“十五五”规划推动固态电池技术研发与应用场景，但不能将政策预期全部折算为固态电池装机需求，更不能视为统一兑现时间。隆基绿能的百兆瓦中试线、金辰股份的设备布局、亚玛顿小批量供货都属于预期阶段。
evidence_quote: 北京市印发“十五五”时期新型能源体系规划，提出拓展光伏技术创新场景应用，聚焦钙钛矿太阳能电池、高效光伏组件研发及设备制造。隆基绿能此前拟建设一条100MW高效晶硅—钙钛矿叠层电池中试产线。金辰股份布局钙钛矿电池镀膜相关设备。亚玛顿超薄轻型钢化氧化铟锡玻璃已向钙钛矿组件厂商小批量供货。
interpretation: UP 对固态电池板块的判断强调“预期”与“兑现”的分层：政策推动和中试线建设属于预期阶段，不能直接映射为装机需求或公司利润；对亚玛顿、金辰股份等标的也只作为政策催化线索观察，不预设为主升方向。
