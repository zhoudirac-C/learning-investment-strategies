subject: 机器人主线高潮后的首次分歧：先看回流机会
timeframe: temporary
statement: 机器人尚未经历一次充分而集中的大分歧；强主线的第一次明显分歧，往往仍有资金愿意博弈回流。明天先看核心品种能否承接稳定、回落没有快速扩散。
evidence_quote: 机器人今天集体爆发，延续了主线地位。午后因为板块短时间过于一致，部分个股开始回落，全天较高的炸板率也有相当一部分来自这个方向。从成为市场共识主线以来的节奏看，我倾向于认为，机器人尚未经历一次充分而集中的大分歧。强主线的第一次明显分歧，往往仍有资金愿意博弈回流。
interpretation: UP 将机器人定义为主线候选（尚未经历充分大分歧），并区分了“获利盘兑现”与“主线逻辑被破坏”两种调整性质；提出首次分歧仍有回流机会的判断，但强调必须由核心品种承接稳定和回落未快速扩散来验证，而非机械套用“首次分歧就是机会”。
