  extracted_at: '2026-07-18'
  subject: 同级别分解机械化操作程式
  topic: 从下跌背驰开始的分段买卖程式，向上段先买后卖向下段先卖后买
  statement: 以30分钟级别同级别分解为例的机械程式：从下跌背驰开始，必然先出现向上第一段走势类型，根据其内部结构判断背驰或盘整背驰结束点先卖出；然后必有向下第二段，若不跌破第一段低点则重新买入，若跌破但与第一段前的向下段形成盘整背驰也重新买入，否则观望直到新的下跌背驰；重新买入后出现向上第三段，低于第一段高点一定先卖出，超过第一段高点则看第三段对第一段是否盘整背驰，背驰卖出、不背驰继续持有；如此延续，直到某向上段相对前一向上段不创新高或盘整背驰，结束向上段运作，转入先卖后买的向下段运作，操作刚好反过来。这种机械化操作不断做下去成本不断减少，无须关心个股具体涨幅，只要足够活跃、震荡大，利润与时间成正比。
  evidence_quote: 不妨从一个下跌背驰开始，以一个30 分钟级别的分解为例子……对于第二种情况，一定是先卖出；第一种情况，又分两种情况：1、第三段对第一段发生盘整背驰，这时要卖出；2、第三段对第一段不发生盘整背驰，这时候继续持有。这个过程可以不断延续下去，直到下一段向上的30 分钟走势类型相对前一段向上的走势类型出现不创新高或者盘整背驰为止，这就结束了向上段的运作。向上段的运作，都是先买后卖的。一旦向上段的运作结束后，就进入向下段的运作。向下段的运作刚好相反，是先卖后买。
  interpretation: 该程式把同级别分解落成完整的 if-then 规则集，全程不预测、只响应当下分段的高低点与盘整背驰，是缠论机械化交易的完整范本。作者指出其特别适合小资金全仓操作与大资金差价减成本。
