  evidence_quote: 6月科技要疯，要把电信、银行这些核心资产吸血导致大跌，我心中的称认为价位合适，我就会去买，跟大盘4100点，跟什么科技牛，毫无关系。现在也一样，又有其他优质资产跌到平台了，甚至新低了，我也会去买，跟什么海外暴雷，大盘3700，也毫无关系。股市短期是投票机，长期是称重机。
