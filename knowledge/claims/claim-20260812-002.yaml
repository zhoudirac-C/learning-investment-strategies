  statement: 明日观察清单四项：第一，量能能否守住2万亿，这是判断情形A与情形B的唯一硬指标，比任何题材都重要；第二，尾盘抢筹的负反馈——被抢筹的强势分支往往把明日的买盘提前消耗在今日尾盘，次日反而难以维持，今天分歧充分、没有被抢筹的分支明日回流的预期更强，上午冲高回落的科技高价股与下午接力的房地产、消费，明天大概率不会是同一批人在做；第三，连板梯队的完整性——医药方向7连板是当前市场高度所在，需要区分断板性质，资金主动换龙的内生性断板梯队与溢价可同时保持，停牌、监管问询这类外力扰动会打断整条梯队并形成全市场负反馈；第四，科技的支线能否走出新高——光通信这个点被海外财报重新点亮后，接下来要看存储能否稳住，存储稳住则面上的调整影响可控，存储若再度走弱，光通信一个点撑不起整个面。
  evidence_quote: 第一，量能能否守住2万亿。这是判断情形A与情形B的唯一硬指标，比任何题材都重要。第二，尾盘抢筹的负反馈。今日尾盘双创指数有所回升，按我反复强调的判据，被抢筹的强势分支往往把明日的买盘提前消耗在今日尾盘，次日反而难以维持。第三，连板梯队的完整性。医药方向的7连板是当前市场高度所在，需要区分断板性质：如果是资金主动换龙的内生性断板，梯队与溢价可以同时保持；如果出现停牌、监管问询这类外力扰动，则会打断整条梯队并形成全市场负反馈。第四，科技的支线能否走出新高。接下来要看的是存储能否稳住——只要存储稳住，面上的调整影响可控；存储若再度走弱，光通信一个点撑不起整个面。
