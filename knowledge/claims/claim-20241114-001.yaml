  subject: 竞价板块联动选股
  topic: 板块竞价共振则买后排补涨，上板概率大
  timeframe: permanent
  statement: 如果板块中很多只个股集合竞价强度一致且封板资金量大，代表这个板块今天会有所表现、很难被打压下来；可以找板块内有代表性但表现较弱的后排股适当参与，上板概率很大
  evidence_quote: 如果说它的板块中有很多只股，集合竞价的强度跟它一样强，然后封板的资金量大。那么就代表着这个板块今天会有所表现，很难被打压下来。竞价表现那么好的板块，你就可以找一些后排买入啊，它的胜率是比较大的。……它同一板块中很多只涨停了，然后它也在这个板块中有所代表性，但是它表现比较弱，就可以适当地去参与啊。这样上板的概率很大。
  interpretation: 个股竞价强度要结合板块维度确认：板块共振的竞价强度才是当天主线信号。操作上不追已封板的龙头，而是买板块内尚未启动的后排股，博补涨上板。
  confidence: high
  status: active
