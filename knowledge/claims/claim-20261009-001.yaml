  timeframe: permanent
  statement: 先确定指数低点，再寻找跟指数共振的板块；判断共振看三点——板块能否随指数企稳而扩大上涨范围、核心品种能否承接回落、尾盘能否保留强度。总体顺序：指数定环境，板块定方向，个股定时点。
