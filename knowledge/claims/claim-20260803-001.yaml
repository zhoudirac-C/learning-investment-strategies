  evidence_quote: 个人判断：外盘的作用只反映在开盘定价，开盘后市场回归自身节奏。上周五夜盘其实已经回答了“利空还是利空出尽”的一半——业绩显著低于预期后ADR收跌10%，说明资金第一时间并没有按“利空出尽”定价，因此今日对存储方向不宜有高预期。
