statement: "60分钟底部结构形成后，反弹窗口约2个交易日。操作上可半仓盘中打满、尾盘或高点减仓，能持续拉升则持有至窗口末期再减。失效条件：60分钟底消失+主线高开低走+龙头大额出逃+指数破关键支撑→果断减仓。上级别有顶部压制时反弹天数会缩短。"
evidence_quote: "60分钟底部结构形成，反弹窗口约2天。科技半仓可盘中打满，尾盘或高点减仓。能持续拉升则不减，减仓动作留到周三。若60分钟底消失+主线高开低走+龙头大额出逃+指数破关键支撑→果断减仓。"
interpretation: "UP扩展了'级别→时间'框架：30分钟=3天，60分钟=2天（注意不是线性递增，因上级别日线顶部压制导致反弹天数缩短）。更重要的是同时给出了失效条件的四要素——结构消失+主线不利+资金出逃+支撑破位，任何一个触发都应果断减仓。这种'窗口+预案'的双轨思维是UP操作纪律的精髓。"
