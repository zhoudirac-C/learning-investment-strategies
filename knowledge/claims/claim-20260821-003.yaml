  timeframe: short-term
  statement: 在哈药股份(600664)进监管的时间段内，医药操作框架：做短线投机（如神奇制药(600613)、开开实业(600272)、百花医药(600721)这类高位股）风险系数高；想做抗癌药就要追逐有高辨识度的高标；若前两种短线都觉得太危险要做中军，也要做龙头中军、有高辨识度的中军——UP认为这是当下最稳妥的方法和选择。
  evidence_quote: 如果你想做抗癌药，那就要去追逐比较有高辨识度的高标。那如果前面两种短线都觉得太过危险，要做中军的话，也要做龙头中军，做有高辨识度一点的中军啊。目前来看是这样的，在哈药进监管的这么一个时间内，我觉得这是最稳妥的方法，也是最稳妥的选择。
  interpretation: 监管压制期内的板块参与方法论：标的辨识度（市场共识度）成为风控筛选的第一标准，宁可做高辨识度高标或龙头中军，不做模糊跟风股，本质是用流动性与共识对冲监管不确定性。
