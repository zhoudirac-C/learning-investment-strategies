  extracted_at: '2026-06-24T12:30:00'
  claim_type: operation
  subject: 从满仓单押转向平衡配置：科技进攻与抗高利率防守搭配
  timeframe: trend
  statement: 策略上需要更加平衡：既要保留科技主线的进攻性，也要配置一部分抗波动、抗高利率环境的资产，降低组合的不确定性。过去流动性充裕时满仓押主线最优，但现在环境变了。
  evidence_quote: 过去在流动性充裕的环境下，满仓押主线，从盈亏比角度看可能更有利。因为估值扩张和资金推动会放大趋势，强者恒强，集中持仓容易获得更高收益。但现在环境变了。高利率会压制估值弹性，市场波动会加大，单一方向的回撤风险也会提高。因此，策略上需要更加平衡：既要保留科技主线的进攻性，也要配置一部分抗波动、抗高利率环境的资产，降低组合的不确定性。
  interpretation: UP给出了具体的策略调整方向：①过去模式（低利率+流动性充裕）:满仓单押主线，估值扩张放大收益——这是2024-2025年的市场特征；②新环境（高利率+波动加大）:不能再满仓一个方向，需要配置平衡；③进攻端保留科技（AI/算力/半导体/光通信），防守端配置抗高利率资产（按照以前框架，可能是高股息、能源、电力等）；④核心是'降低组合不确定性'而非'追求收益最大化'——这是当前优先级的调整。与6/24早盘的'杠铃策略'（AI进攻+防守）形成呼应。
