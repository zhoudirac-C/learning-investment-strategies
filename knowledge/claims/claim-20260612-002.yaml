  timeframe: short-term
  statement: 硬科技内部出现明显分化：国产替代明显走得更强、更自主，而AI硬件完全受美股影响。半导体材料逆势爆发，CPO则跟随纳指起落。
  evidence_quote: 通过这一周的观察，硬科技之间也出现了明显的分化：国产替代明显走得更强、更自主，而AI硬件完全受美股影响。本周的盘面证据相当充分——半导体材料逆势爆发，CPO则跟随纳指起落。
  interpretation: UP提出'自主程度'作为硬科技内部分类的标尺：国产替代方向（半导体材料等）走势独立于美股，穿越调整的能力更强；AI硬件（CPO/光模块等）则紧密跟随纳指波动。这是对科技股仓位管理的核心指导——调整期内应优先配置国产替代侧。
