  extracted_at: '2026-07-18'
  subject: 安全底线原则
  topic: 不是什么机会都要搞，前提要安全到像去银行提款
  statement: 不是什么机会都要搞，首先的前提要安全，要像去银行提款一样安全，只有又安全又有爆发力的机会才值得投机。原文给出的可量化示例：对既有认购又有认沽的权证，企业除非行情特别不好，否则不会掏真金白银让认沽兑现，因此认沽与认购行权价之间的差价就是认购权证最安全的底线，在该底线附近买入等同于提款。投机不是瞎搞，是要清清楚楚地搞。
  evidence_quote: 这市场也是一样的，不是什么机会、G 点都要搞的，首先的前提要安全，要像去银行提款一样安全……对既有认购又有认沽的认购权证来说，认沽和认购的行权价之间的差价，就是认购权证最安全的底线……投机不是瞎搞，是要清清楚楚地搞。
  interpretation: 安全底线=由规则或利益结构保证的下跌保护，而非主观判断的低点；找底线先于找机会，先确认跌不破的底再谈弹性。权证案例中的五粮液、包钢只是2006年的历史示例，不构成标的建议。这一思路与第9课的基本面甄别程序（对参与者行为的了解）一脉相承。
