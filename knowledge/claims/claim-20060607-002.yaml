  extracted_at: '2026-07-18'
  subject: 围猎游戏与工具匹配
  topic: 市场是围猎游戏，能捕什么猎物取决于手里的工具
  statement: 市场就是一个围猎的游戏：只有一把小弓箭就去打野兔，有了屠龙刀才抓得了大蛇，关键是是否拥有与目标猎物匹配的工具。操作含义：资金规模和技术系统决定了能参与的机会类型，超出自己工具能力的机会不属于你，先锻造工具再谈猎物。
  evidence_quote: 有的只是各种类型的动物，还有极少数的高明猎手。市场就是一个围猎的游戏，当你只有一把小弓箭，你可以去打野兔；当你有了屠龙刀，抓几条蛇来玩当然就没劲了，关键你是否有屠龙刀！
  interpretation: 工具与猎物匹配的隐喻在后文落实为具体规则：资金量决定均线参数选择（第11、12课），小盘股骗线多需自行甄别（第7课）。能力建设顺序是先有屠龙刀，再抓大蛇。
