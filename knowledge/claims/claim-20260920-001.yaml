  evidence_quote: 因此我当前的态度是继续认真看待供应风险，但对冲击之后的追涨，我是保持谨慎的。供给紧张它可以推高价格，那么高价格也会逐步影响到需求。如果市场已经把严重短缺提前算了进去，那么后面即使情况仍然不好，那么整个价格也未必会继续按原来的速度去上涨。但如果是你要让我相信能源压力在缓和，那么我希望看到的是供应和运输的持续改善，以及企业的实际采购成本出现下降。如果供应再次受阻，那么成品油和运费的重新上涨，那么我们就需要重新去评估相关的物价压力和相关仓位了。
