  subject: 级别观察的显微镜原则
  topic: 用一个级别观察走势就等于先把次级别当成线段，换级别由分析目的决定
  statement: 级别如同不同倍数的显微镜。当你决定用某级别操作、观察时，就已经先假定把所有完成的次级别走势都看成没有内部结构的线段了，次级别不在该级别的观察中，例如用30分钟观察时就把完成的5分钟走势都看成线段。这与区间套定理没有冲突：当本级别进入背驰段需要更精细定位，或看第三类买卖点涉及次级别判断时，就要转换用倍数更大的显微镜，只要知道该在什么时候用什么倍数去看。从最低级别分笔逐步组合上来最严格但太累且无必要，理论是用来用的，只要不违反理论的基础与绝对性，就选择更简单的用法。
  evidence_quote: 当你用一个级别的显微镜时，就等于先把次级别的当成线段了，也就是说次级别不在该级别的观察中……例如，在看30 分钟的第三买卖点时，由于要涉及次级别5 分钟的判断问题，所以那时候就不能光用30 分钟级别的显微镜，同样要转换成5 分钟的……理论是用来用的，只要不违反理论的基础与绝对性，当然要选择更简单的用法。
  interpretation: 这解决了多级别混用的混乱：级别切换由分析目的驱动而非随意换来换去。三个5分钟级别走势重叠构成30分钟中枢，站在30分钟角度每段5分钟走势的高低点就是线段端点。
