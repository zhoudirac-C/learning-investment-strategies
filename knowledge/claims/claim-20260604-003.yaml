  topic: 半导体调整周期即将结束
  text: 半导体120分钟顶部结构的调整周期为12-16个交易日，从5月14日开始计算到6月5日（周五）基本结束，做好半导体随时启动的准备
  evidence_quote: 120分钟顶部结构的话，它是12天到16个交易日的调整周期，然后走的是日线级别的调整。那你可以你自己算一下，就从5月14号开始算，它的整个调整周期大概也就到明天这个样子，也就是到周五。
  interpretation: 'UP对半导体板块的技术面判断：

    1. 120分钟顶部结构对应12-16个交易日调整周期

    2. 从5月14日起算，6月5日（周五）为调整周期尾声

    3. 若继续下跌，应做好半导体随时启动的准备

    4. 短期关注标的：汇成真空、茂莱光学（先看20天线支撑）

    5. 中期反复炒作方向：长鑫存储扩产、上海微电子、新凯来

