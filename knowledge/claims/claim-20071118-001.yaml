  subject: 中阴阶段的必然中枢
  topic: 小级别走势结束后必先出现一个更大级别中枢，这是百分百的操作依据
  statement: 中阴阶段的存在，就在于市场发展具体形式在级别上的各种可能性，这些可能性的最终选择不是预先设定的，而是市场合力的当下结果。一个1分钟级别下跌背驰进入中阴后，不能说后面一定是下还是上还是盘，但根据走势分解基本定理，其后行情一定是超1分钟级别的走势，因此必须先出现一个5分钟中枢，这没有任何特例的可能，是百分百成立的结论，构成操作中最大也是百分百准确的基本依据。所以不管后面是什么，首先把这5分钟中枢处理好才是唯一重要的事；这中枢成立后就必然面临破坏，即延伸或第三买卖点的问题；若中枢不断延伸搞成30分钟中枢，就按30分钟中枢的第三买卖点来处理，如此类推。
  evidence_quote: 这些可能，首先一个最基本的原则是，必须先出现一个5 分钟中枢，因为无论后面是什么级别的走势，只要是超1 分钟级别的，就一定先有一个5 分钟中枢，这没有任何特例的可能。而这个100%成立的结论，就构成我们操作中最大也是100%准确的基本依据……而这5 分钟中枢成立后，就必然100%面临一个破坏的问题，也就是一个延伸或着第三买卖点的问题。
  interpretation: 这条把中阴从不可知变成可操作：后续方向不可预知，但更大级别中枢的出现是必然，操作锚定在这个中枢的震荡与第三买卖点上，操作节奏的衔接问题就此解决。课中6004点后的实例只是这一定理的当期应用。
