# ZS-004 趋势两中枢不重叠（课18 中枢三定理）
# claim-20061226-001-c：定理一——在趋势中，连接两个同级别中枢的必然是次级别以下
# 级别的走势类型；相连走势级别越低力度越大。（课18 同课另文：趋势中的中枢之间
# 必须绝对不存在重叠——见 claim-20061226-001-a，本用例按计划挂 -c。）
# 构造（段=笔，向上趋势）：引导笔 bi0 上（10→14）；
#   中枢1=bi1..bi3：[12,14]/[12,15]/[13,15] → ZD=max(12,12,13)=13、ZG=min(14,15,15)=14；
#   连接段 bi4 上（13→18，次级别以下走势，单笔直接离开）；
#   中枢2=bi5..bi7：[16,18]/[16,19]/[17,19] → ZD=max(16,16,17)=17、ZG=min(18,19,19)=18。
#   两中枢依次同向（向上）且绝对不重叠：中枢2 ZD=17 > 中枢1 ZG=14 → 趋势成立；
#   bi8 上（17→20）离开中枢2。两中枢均三段完成即确立 → sure=true。
# 分型中心间隔 4 根 K 线，腿内单调无包含；pivot 极值精确落位（10@1/14@5/12@9/
# 15@13/13@17/18@21/16@25/19@29/17@33/20@37）。
