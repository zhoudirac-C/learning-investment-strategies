  subject: 开盘不卖即是赌赌输要认不能赖桌
  timeframe: permanent
  statement: 早上开盘没卖就已经是在赌，赌的就是9点45和10点的钝化。那么9点45结果都出来了你还不认这就是问题了，有的人会去选择加大筹码去抄这个底，当然也是因为没看懂的情况下会去加仓，所以就进入了第二轮赌局——你走了有可能会错，但是今天哪怕错了也是120分钟的顶部钝化，级别更大，在更大的级别去赌一旦赌输承担的损失就会更大，这样赌下去终究会输并且会输的很大。我一直的观点就是你可以去赌，因为你昨天已经有利润垫了，有利润垫就有上桌的资格，但是上了桌要认输，不能赖着不走。
  evidence_quote: 你可以去赌，因为你昨天已经有利润垫了，有利润垫就有上桌的资格，但是上了桌要认输，不能赖着不走。
  interpretation: 赌局纪律三原则：利润垫=上桌资格（没垫的别赌）；信号出来了就认（9:45钝化结果出来不认=问题）；输了一局不升级赌注（更大级别加赌=终局大亏）。这是对浮盈加仓一把亏光的具体化。
