  subject: 板块分野：缺货涨价与炒作未来的二元划分
  timeframe: short-term
  statement: 今天题材层面最重要的分野是两类板块：一类是缺货+涨价现在进行时（MLCC、电子布、存储、CPO、PCB），有真实供需缺口支撑，节后大概率仍是主线分支轮动的核心，但连续上涨后前高附近兑现压力上升，接下来两天谨慎追涨；另一类是炒作未来（玻璃基板、碳化硅），技术上尚未成功量产，节前反复出现板块一致到个股澄清再到次日无溢价的模式。资金节前切向明牌加机构加核心标的，脱虚就实风格能否延续是今天最该验证的方向。
  evidence_quote: 一类是"缺货+涨价"现在进行时——MLCC、电子布、存储得到资金持续认可，更实在的CPO、PCB可能也是同一原理。这类有真实供需缺口支撑，节后大概率仍是主线分支轮动的核心。但需提防：MLCC、PCB连续多日上涨后，前高附近兑现压力上升，接下来两天谨慎追涨。另一类是"炒作未来"——玻璃基板、碳化硅这种技术上尚未成功量产的概念，节前反复出现"板块一致→个股澄清→次日无溢价"的模式。上周四资金切向"易中天"为代表的不怕澄清+明牌+机构+核心标的，这种"脱虚就实"的风格能否延续，是今天最该验证的方向。
  interpretation: UP给出了关键框架：区分有真实供需缺口支撑的涨价方向（可持续）和纯概念炒作方向（不可持续）。资金正在从概念炒作向有基本面支撑的核心标的切换，脱虚就实。
