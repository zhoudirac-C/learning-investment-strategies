  subject: 市盈率与盈利预判
  topic: 估值要落到未来盈利增速判断，学会看财报
  timeframe: permanent
  statement: 选股最终要落脚到判断公司未来的盈利能力：盈利增速快则市盈率越来越低、股价越来越被追捧（如今年赚1亿、明年5亿、后年10亿）；要懂得看财报
  evidence_quote: 如果说它盈利增速很快，它今年赚了一个亿，明年赚了五个亿呢，后年赚十个亿呢，那它的市盈率是不是就越来越低？那相对应的它的股价是不是大家越来越想要啊……所以说我们要懂得最终还是要懂得判断一家公司的一个盈利能力，懂得看财报。
  interpretation: 静态市盈率低不是买入理由，动态盈利增速才是股价驱动——估值必须与成长性结合看，这是UP把估值指标落到选股实操的关键一环。
