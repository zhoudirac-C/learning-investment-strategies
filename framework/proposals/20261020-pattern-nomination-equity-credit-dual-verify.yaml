candidate_pattern:
  pattern_id: equity_credit_dual_verify
  name: 股价与信用双市场验证框架
  description: >-
    判断海外科技股（尤其高资本开支的 AI 基础设施链）是否真正企稳时，
    不能只看股价反弹；必须同时观察信用市场（高收益债价格 / CDS / 信用利差）。
    股价反弹 + 利差收窄 = 真企稳；股价反弹后再下探 + 利差继续走阔 = 假反弹。
    用于区分"估值压缩"与"信用风险重定价"两种性质完全不同的下跌。
  trigger:
    - 海外科技股（纳指 / 半导体）连续调整后出现反弹，需要判断级别
    - CoreWeave 等高资本开支、高杠杆 AI 基础设施企业股价与 CDS/债券价格出现异动
    - 市场把下跌归因于利率/估值，但信用利差同步走阔
  data_requirements:
    - 股票端：纳斯达克 / SOX 指数、CoreWeave 等标的股价（日线）
    - 信用端：上述企业 CDS 利差、高收益债价格、美国高收益债 OAS
    - 对照端：30 年期美债收益率、投资级/高收益级利差
    - 获取通道：需确认（当前 knowledge 层有观点，尚无自动采集脚本）
  steps:
    - 定性下跌性质：估值压缩（只影响市场愿付价格）vs 信用风险（影响企业能否创造未来利润）
    - 取信用端读数：CoreWeave 类企业的 CDS 利差 / 债券价格近 5-10 日方向
    - 与股价方向做四象限对照
    - 若股价反弹但利差走阔 → 判定假反弹，不下调风险等级
    - 若股价反弹 + 利差持续收窄 → 判定担忧缓和，可提高参与度
    - 拆解 AI 企业类型：自有现金流支持资本开支（抗风险强）vs 依赖债务/外部融资扩张（脆弱）
  falsification:
    - 股价反弹且利差持续走阔，但后续股价继续走强并创新高 → 本框架误判（信用端为滞后指标）
    - 信用利差收窄但股价继续下跌 → 两者背离，框架失效
    - 无法获取可靠的 CDS/利差数据 → 不适用，退回单一股票端判断
