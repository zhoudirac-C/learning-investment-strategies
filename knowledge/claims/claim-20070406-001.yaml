  subject: 背驰转折定理与两种转折方式
  topic: 背驰必然导致原走势类型终止，转折力度按背驰级别与走势级别关系分两类
  statement: 缠中说禅背驰-转折定理：某级别趋势的背驰将导致该趋势最后一个中枢的级别扩展、该级别更大级别的盘整或该级别以上级别的反趋势；即某级别的背驰必然导致该级别原走势类型的终止，进而开始该级别或以上级别的另外一个走势类型。例如1分钟顶背驰必然导致至少1分钟级别的盘整或下跌走势类型，但背驰级别与最终转折级别并非一一对应，大调整是小级别背驰后走势逐步级别扩张形成的，不能说由1分钟背驰直接造成。按背驰级别与当下走势级别的关系，转折方式分两类：一、背驰级别等于当下走势级别，回跌（或回涨）是必然的，至少把走势拉向该级别走势最后一个中枢；二、背驰级别小于当下走势级别，不必然回跌，必然先形成一个比背驰级别大的中枢，之后可向上突破使原走势继续延伸，也可向下突破形成回跌。小级别背驰最终转化成大级别转折最值得注意的情形，出现在趋势走势的冲顶或赶底之中。
  evidence_quote: 缠中说禅背驰-转折定理：某级别趋势的背驰将导致该趋势最后一个中枢的级别扩展、该级别更大级别的盘整或该级别以上级别的反趋势……一个1 分钟级别的顶背驰，就意味着必然导致一个至少1 分钟级别的盘整或下跌走势类型，这就为背驰以后可能的走势以及级别给出了很明确的划定……在第一种情况中，其回跌是必然的，而第二种情况，在形成一个比1 分钟大的中枢后，并不必然回跌，可以往上突破，使得a+A+b+B+c 继续延伸。
  interpretation: 这条定理给出背驰后走势的完全分类边界：背驰保证的是原级别走势类型终结，不保证反转级别。用它可纠正"见小级别背驰就断言大顶大底"的常见误用。2007年的工行、北辰实业、水井坊是作者举的小转大冲顶历史案例。
