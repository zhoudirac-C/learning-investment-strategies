- pattern_id: leverage_low_freq_heavy_position
  name: 杠杆资金低频重仓策略
  description: 针对加杠杆投资者，基于资金成本高、无试错资格的前提，推导出低频重仓是唯一可行策略，并强调翻身后退杠杆。
  applicable_themes:
  - 杠杆交易
  - 高风险投资策略
  - 资金管理
  reasoning_chain:
  - step: 1
    name: 识别资金成本
    question: 加杠杆的资金是否有额外成本？
    UP_logic: 加杠杆的资金存在资金成本，网贷成本更高，导致没有试错资格。
    evidence_sources:
    - 原文第七部分
  - step: 2
    name: 否定分仓策略
    question: 分仓操作能否覆盖资金成本？
    UP_logic: 分仓收益率无法覆盖资金成本，因此不适合分仓操作。
    evidence_sources:
    - 原文第七部分
  - step: 3
    name: 推导唯一策略
    question: 在不能分仓且无试错资格下，什么策略可行？
    UP_logic: 唯一生存策略是低频重仓：先低频（等待确定性最高时机），再重仓。
    evidence_sources:
    - 原文第七部分
  - step: 4
    name: 强调退出机制
    question: 翻身之后如何避免再次亏损？
    UP_logic: 成功翻身必须及时去掉所有杠杆，才能真正稳定盈利。
    evidence_sources:
    - 原文第七部分
  risk_factors:
  - 市场长期无确定性机会导致无法出手
  - 重仓后判断失误导致本金大幅亏损
  confidence_indicators:
  - 博主明确强调‘唯一生存策略’
  - 逻辑链条从成本推导到策略，自洽性强
