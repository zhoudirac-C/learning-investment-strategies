  timeframe: intraday
  statement: 短线投机标的的情绪龙头锚定埃力家居——刚放出来就来了一个板；如果埃力能顶住分歧、高位站稳，市场短线资金做多意愿会明显提升；一旦出现大阴线、大幅跳水，高位题材大概率迎来一次集体退潮；做短线投机的要观察埃力有没有出现负反馈。（注：'埃力家居'为ASR转写，股名待核实。）
  evidence_quote: 短线投机标的的这个情绪龙头锚定就是埃力家居，埃力是刚放出来就来了一个板啊。那如果埃力能够顶住分歧，高位站稳，那市场短线资金做多的意愿就会明显提升，一旦它出现大阴线，出现大幅跳水，高位题材大概率会迎来一次集体的退潮，所以如果你是爱做短线投机的，观察一下埃力家居有没有出现负的反馈啊。
  interpretation: UP给出短线情绪的可操作锚点：单一情绪龙头股的站稳/跳水决定高位题材整体的做多/退潮，是短线情绪的观察框架。
