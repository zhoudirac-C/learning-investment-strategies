  subject: 均线系统两个买点
  topic: 男上位最后一次缠绕背弛与女上位第一次缠绕低位是唯一值得买入的两个点
  statement: 以5日、10日均线构成的买卖系统为例，利用均线系统的买入原则只有两个买点：第一买点=男上位最后一次缠绕后出现背弛构成的空头陷阱，抄底只能选择这种情况，其后若出现急跌却背弛是最佳的买入时机；第二买点=女上位后第一次缠绕形成的低位。这两个买点收益和风险之比最大，是唯一值得买入的两个点，任何不在这两个买点买入的行为都是原则错误。对应卖点：第一卖点=女上位缠绕后出现背弛，第二卖点=变成男上位后的第一个缠绕高点。买的时候一般最好在第二个买点，而卖尽量在第一个卖点。
  evidence_quote: 首先要利用男上位最后一次缠绕后背弛构成的空头陷阱抄底进入，这是第一个值得买入的位置，而第二个值得买入或加码的位置，就是女上位后第一次缠绕形成的低位。站在该系统下，这两个买点的风险是最小的，准确地说，收益和风险之比是最大的，也是唯一值得买入的两个点……任何不在这两个买点买入的行为都是不可以原谅的，因为这是原则的错误……买的时候一般最好在第二个买点，而卖尽量在第一个卖点，这是买和卖不同的地方。
  interpretation: 这是缠论第一类买点、第二类买点的原始出处，是整个缠论买卖点体系的原型。两类买点的共同结构：缠绕（趋势力度衰竭的确认）加背弛（原方向动力枯竭）。均线参数可随资金量调节，资金量越大参数越大，短线把日线改为分钟线即可。
