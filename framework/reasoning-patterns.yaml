  data_requirements:
  - name: AI 产业链结构与标的映射
    channel: knowledge/industry-chains
  - name: 技术事件与产品发布
    channel: 技术白皮书 / 产品发布会 / 政策文件 / 供应链消息
  - name: BOM 与价值量数据
    channel: 研报（BOM拆解/价值量对比/技术规格变化/供应商报价）
  - name: 业绩与订单验证
    channel: 季度财报 / 订单与出货数据 / 机构调研纪要
  - name: 供应链地位证据
    channel: 公司公告 / 供应链调研 / 机构报告
  - name: 盘面联动数据
    channel: 行情数据（板块涨幅排名/龙头涨停与联动）
  steps:
  - step: 1
    name: 识别技术/产品突破
    question: AI领域出现了什么关键突破或产品升级？
    action: 登记催化事件并定性——大模型发布、硬件架构升级、政策变化等；核对信息来源属于一手发布还是二手传闻
    data:
    - 技术事件与产品发布
  - step: 2
    name: 拆解产业链影响路径
    question: 该突破对产业链哪些环节产生直接影响？
    action: 按算力→芯片→设备→材料逐层拆解传导路径；对照产业链知识库查各环节价值量增幅，最大者优先级最高；区分量增/价增/新品三类驱动
    data:
    - AI 产业链结构与标的映射
    - BOM 与价值量数据
  - step: 3
    name: 验证需求真实性
    question: 产业链需求是否真实兑现？还是停留在预期阶段？
    action: 用季度财报、订单数据、出货数据验证：业绩超预期判定需求真实；只有概念无业绩按纯炒作处理
    data:
    - 业绩与订单验证
  - step: 4
    name: 映射投资标的
    question: A股中哪些公司最受益？受益顺序如何？
    action: 按确定性优先排序——已进入供应链的（知识库 cert_status/order_evidence 有证据）> 有技术储备的 > 纯概念映射的；结合盘面验证（龙头是否涨停、环节是否联动）
    data:
    - AI 产业链结构与标的映射
    - 供应链地位证据
    - 盘面联动数据
  falsification:
  - 财报/订单证伪需求（预期落空、业绩不及预期）
  - 技术路线变更使原受益环节价值量缩水
  - 大盘系统性破位下行或宏观政策重大转向
  - 板块情绪退潮：核心标的放量滞涨、联动失效
