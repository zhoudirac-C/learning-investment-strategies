  subject: 比较日韩涨幅后科创板惨不忍睹说不过去
  timeframe: trend
  statement: 韩国顶着平均四倍杠杆经历完最有希望的夏天和最没希望的秋天，今年以来还有31%涨幅，没加杠杆的长期资本耐心资本依旧获利丰厚，日本还有27%涨幅；反观以科技发展为基调、十五五关键领域聚集的科创板却惨不忍睹，科创50完全抹平今年全部涨幅，确实说不过去。
  evidence_quote: 拿隔壁思密达来说，顶着平均四倍杠杆经历完最有希望的夏天和最没有希望的秋天，今年以来都还有31%的涨幅，也就是说那些没加杠杆的长期资本，耐心资本依旧获利丰厚，就连隔壁樱花村都还有27%的涨幅。而反观以科技发展为基调，以新质生产力为发展核心，十五五关键之发展领域聚集的科创板却惨不忍睹。……但是科创50来说，完全抹平今年全部涨幅，确实是说不过去的啊。
  interpretation: 鳄鱼派用国际对比论证科创板跌过头：韩国（4倍杠杆+31%涨幅）、日本（27%）都涨了，唯独承担十五五产业融资功能的科创板抹平全年涨幅——『说不过去』=跌幅与政策定位严重背离，构成政策必须出手修复的论据。
