  subject: 中报业绩兑现时点三档分类法
  timeframe: short-term
  statement: 在中报密集披露期（7月初至8月）到来之前，需先判断每个细分方向的业绩释放时点。按此分为三档：A档中报即可兑现（存储、PCB覆铜板、光模块上游、MLCC高端、半导体设备）；B档要等下半年（PCB中游制造、MLCC低端、CPO/NPO、国产算力）；C档远期题材（玻璃基板等与当期业绩无关）。只有先想清楚时点，才知道哪些业绩能被原谅、哪些无法被原谅、哪些是真超预期、哪些是超预期等于符合预期。
  evidence_quote: 在密集披露期到来之前，必须先想清楚每个细分方向的业绩究竟在什么时点释放。只有这样，等真正出业绩时，才知道哪些业绩能被原谅、哪些无法被原谅、哪些是真超预期、哪些是超预期等于符合预期。中报即可兑现、能用业绩说话的硬方向：存储兑现度最高、率先走强，且利基存储原厂的确定性高于模组厂；PCB上游覆铜板相关企业是中报的主要看点；光模块及其上游物料同样是中报看点；MLCC的高端产品与上游材料理应在中报体现；半导体设备中报也要出业绩。
  interpretation: UP提出了一套中报期选股决策框架：先判断每个方向业绩在哪个时点释放，再据此制定交易策略。核心逻辑是同一个业绩数据在不同时点含义不同——7月出业绩且预期充分的方向，超预期可能只是符合预期；8月才出业绩的方向，中报期更多是题材驱动。
