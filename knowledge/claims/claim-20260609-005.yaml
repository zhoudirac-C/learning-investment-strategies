  subject: 操作纪律——右侧确认入场，不追普涨高潮
  statement: 今日修复未改变'波动放大、方向待定'的中期判断。操作纪律：维持右侧确认入场原则——不追普涨高潮、不在分歧日做情绪接力。AI上游高壁垒材料放在高端产能扩产壁垒的产业事实上；国产算力等自身的补涨确认信号（龙头放量突破+扛住次日分歧），先观察后参与。冷眼旁观，等结构慢慢理顺。
  evidence_quote: 结构层面，今日修复并未改变'波动放大、方向待定'的中期判断。仍维持右侧、确认入场原则，不追普涨高潮、不在分歧日做情绪接力。冷眼旁观，等结构慢慢理顺。
  interpretation: UP 的操作纪律总结：①中期方向未定——不能因为一天反弹就转多②两条线的操作区别：材料=右侧确认后跟随（已确立主线），算力=等量价确认+发改委官方落地（待验证候选）③普涨高潮不追——明日大概率分化，追涨高位容易在分歧日被套④核心心态：冷眼旁观。这与6/8早盘的'清仓'和6/9早盘的'观望不杀跌'构成连续链条——UP
    的节奏是等市场自己走完调整、再找二次确认入场点。
