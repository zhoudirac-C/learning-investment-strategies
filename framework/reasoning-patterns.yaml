    - step: 3
      name: 历史类比预演风险
      question: 11连阳后是否可能出现类似历史的大级别调整？
      UP_logic: 历史数据显示11连阳后继续上涨概率100%，但警惕2018年1月15日走势，当前指数形态和量能相似，若大级别日内调整应规避。
      evidence_sources:
      - 2018年1月15日沪指11连阳后走势
      - 当前指数形态与量能对比
    - step: 4
      name: 预判板块跷跷板与轮动
      question: 若主线分歧，资金可能流向哪些方向？
      UP_logic: 商业航天走强时机器人走弱，若今明商业航天分歧，资金大概率回流机器人；AI应用尾盘松动，大资金尝试难言成功；指数低于预期时小题材或有机会。
      evidence_sources:
      - 31日商业航天与机器人走势
      - 蓝色光标、利欧股份分时
      - 五洲新春等活跃标的
    - step: 5
      name: 纳入制度规则约束
      question: 严重异动规则如何影响主线拉锯节奏？
      UP_logic: 历史规律显示规避严重异动后才拉升，触发异动次日低开低走；当前除信维通信外无严重异动风险，故大概率规则框架内反复拉锯。
      evidence_sources:
      - 顺灏股份、航天发展异动案例
      - 神剑股份、超捷股份异动次日表现
      - 信维通信涨幅阈值19.19%
    risk_factors:
    - 若指数大幅放量高开，情绪指数突破90阈值，警惕类似2018年1月15日的大级别调整
    - 若高标股开盘直接低开低走（如神剑、超捷历史情形），说明主线分歧扩大而非延续
    - 若商业航天分歧时资金未流向机器人，跷跷板轮动逻辑失效
    confidence_indicators:
    - 核心标的竞价弱转强、容量标的高举高打，说明资金承接有力
    - 情绪指数未触及90且无放量，风险仍可控
    - 历史11连阳后继续上涨概率100%，提供统计支撑
    merge_suggestion: 核心是判断主线延续与板块切换，符合主线识别框架
  - pattern_id: mainline_catalyst_mapping_20260105
    name: 事件催化到主线识别与优选标的
    source_raw:
    - sources/raw/财经/复盘：26-01-05：脑机接口涨停潮+AI软硬件同步强势.md
    key_themes:
    - 市场主线识别
    - 题材催化验证
    - AI存储涨价
    - 脑机接口
    - 风格切换
    reasoning_chain:
    - step: 1
      name: 行情性质定性
      question: 板块今天的强势由什么资金/性质驱动？
      UP_logic: 从20cm涨停潮、类比海南板块，识别量化资金加持；资金性质决定后续接力难度，而非只看题材。
      evidence_sources:
      - 20cm涨停潮
      - 海南板块类比
    - step: 2
      name: 催化事件验证
      question: 外部与国内催化是否支撑产业从概念走向商业化？
      UP_logic: 海外巨头量产/技术路线突破与国内科研验证同时成立，行业从科学实验迈向商业竞速，提升主题可信度。
      evidence_sources:
      - Neuralink 2026量产
      - Merge Labs分拆
      - 西北工业大学太空实验
    - step: 3
      name: 受益方向映射
      question: 在确认主题后，优先布局哪个细分/阶段？
      UP_logic: 先划分短期与长期应用场景，再结合量化资金特征选择前排核心标的，避免隔日接力后排风险。
      evidence_sources:
      - 短期疾病治疗/长期人机融合
      - 三博脑科、美好医疗、创新医疗涨停
    - step: 4
      name: 业绩/价格验证
      question: 同一大主题内部如何筛选确定性最强的分支？
      UP_logic: 在大主题内拆应用/硬件两翼，用涨价幅度与业绩确定性做硬验证，将验证最强的分支定为主线。
      evidence_sources:
      - NAND Q1涨100%
      - 摩根士丹利上调DRAM/NAND预期
      - 兆易创新涨停
      - 腾讯AI应用激励计划
    - step: 5
      name: 优先级与风格判断
      question: 多板块并存时如何排序，市场风格是否已切换？
      UP_logic: 以连板高度无法突破、容量标的超预期为证据确认风格切换；按业绩确定性、热度与持续性给板块排序。
      evidence_sources:
      - 神剑股份止步8连板
      - 中国卫星等容量标的超预期
      - 蓝色光标20%连板
    risk_factors:
    - 脑机接口量化退潮或前排出现大面，隔日接力逻辑被证伪
    - 存储涨价趋势逆转或大行预期下调，AI硬件确定性减弱
    - 连板高度重新打开，则“容量标的+流动性溢价”风格切换不成立
    - 商业航天持续缩量不再回流，则“降温但有反复”判断失效
    confidence_indicators:
    - 海外产业巨头持续释放量产/商业化进展
    - 内存/NAND现货价与合约价继续上行，供需缺口扩大
    - 容量标的不断超预期且连板高度持续受压制
    - 板块分歧后仍有资金回流，承接力强
    merge_suggestion: 归入主线识别：用产业催化验证板块强度，再排序核心主线与风格切换
  - pattern_id: mainline_core_screening_20260106
    name: 主线板块地位验证与核心标的筛选
    source_raw:
    - sources/raw/财经/午盘：26-01-06：权重扛旗沪指新高，指南针大金融核心.md
    key_themes:
    - 市场主线识别与切换
    - 板块地位验证
    - 核心标的筛选
    - AI应用与硬件传导
    - 券商/大金融主线
    reasoning_chain:
    - step: 1
      name: 权重拉升定性质
      question: 指数新高是权重普涨还是结构性主线信号？
      UP_logic: 慢牛格局下权重连续大涨概率并不高，大金融主线仍以金融互联网相关标的为核心关注方向。
      evidence_sources:
      - 沪指突破新高
      - 大金融/有色/科技权重发力
    - step: 2
      name: 龙头状态判板块地位
      question: 一个此前主线板块是否仍处于主线地位？
      UP_logic: 板块地位下滑体现在龙头带动性有限、需震荡消化连续涨停筹码；企稳反弹前板块修复需等待。
      evidence_sources:
      - 商业航天龙头蓝色光标连续两个20亿20%涨停
      - AI连续高潮后的分化
    - step: 3
      name: 产业链传导定环节
      question: 同一板块内硬件与应用谁决定持续性？
      UP_logic: AI硬件除存储外偏弱，受单一预期扰动；应用端爆发是硬件估值修复前提，所以核心看应用落地。
      evidence_sources:
      - AI硬件除存储外相对偏弱
      - 应用端成为今年核心看点
    - step: 4
      name: 客户结构筛核心标的
      question: 主线板块中什么特征标的最可能成为核心？
      UP_logic: 高辨识度容量标的享受流动性溢价；客户高活跃高频率→单位资金创收高，估值挖掘空间大。
      evidence_sources:
      - 指南针客户群体高活跃/高交易频率
      - 对比麦高证券导流客户估值价值
    - step: 5
      name: 分化后聚焦前排
      question: 强势板块分化后怎么把握节奏？
      UP_logic: 脑机接口强势后预计分化，后续关注前排晋级标的；弱势反弹医药按轮动参与，避免追高。
      evidence_sources:
      - 脑机接口明日或迎来分化
      - 医药反弹持续性较弱
    risk_factors:
    - 龙头标的如蓝色光标迟迟不能企稳，板块带动性继续减弱，说明地位下滑不是短期分化
    - AI硬件继续受单一预期扰动，且应用端没有实质落地信号，硬件估值修复逻辑被推迟
    - 权重板块出现放量滞涨或亏钱效应，慢牛权重难连续大涨的假设被打破，主线可能切换
    confidence_indicators:
    - 大金融持续走强且资金牛市预期升温，主线内部出现高辨识度容量标的领涨
    - 脑机接口龙头连板/套利标的空间超预期，板块分化强度弱于市场预判，说明资金抱团仍在
    - AI应用端出现可验证的落地或业绩信号，则硬件估值修复链条成立
    merge_suggestion: 权重搭台识别主线、龙头状态验证地位、筛选核心标的，属主线识别框架
  - pattern_id: mainline_style_switch_20260411
    name: 风格切换与主线确认模式
    source_raw:
    - sources/raw/财经/复盘：26-04-11：冲高回落创业板突破前高，AI算力硬件全产业链，风格切换业绩龙头.md
    key_themes:
    - AI算力硬件全产业链
    - 市场风格切换
    - 主线内资金轮动
    - 业绩+产业趋势选股
    - 短线情绪退潮
    reasoning_chain:
    - step: 1
      name: 看指数与量能结构
      question: 当前市场风格偏向哪类资产？
      UP_logic: 创业板突破前高而沪指冲高回落，成长占优；量能高位但二八分化，权重龙头强、小票题材弱，判断风格转向业绩型龙头。
      evidence_sources:
      - 创业板指突破前高
      - 沪指站上4000后回落
      - 成交量高位、权重龙头强于小票
    - step: 2
      name: 验短线情绪与资金去向
      question: 纯题材小票是否还有机会？
      UP_logic: 连板晋级率低且高位股跌停，说明情绪弱、亏钱效应扩散；资金兑现后不流向情绪标的，而留在主线内轮动，确认风格切换落地。
      evidence_sources:
      - 连板股晋级率显著偏低
      - 汇源通信跌停
      - 资金仍在主线内部分支轮动
    - step: 3
      name: 确认主线与虹吸效应
      question: 当前市场核心主线是什么？
      UP_logic: 以资金兑现后的去向判断主线：流出资金未离开AI算力硬件，而是沿光通信向算力租赁、AI电力、PCB、CPU分销扩散，虹吸效应持续强化。
      evidence_sources:
      - 光通信扩散到算力租赁/AI电力/PCB
      - 龙头抱团板块兑现后资金不回情绪标的
      - 主线内部轮动
    - step: 4
      name: 用产业景气锚定持续性
      question: 主线景气度能否支撑参与信心？
      UP_logic: 用海外龙头产能售罄、Token消耗量激增、订单积压等数据证明AI算力行业景气周期较长，再映射到光芯片、算力租赁、燃气轮机等A股细分龙头。
      evidence_sources:
      - 'Lumentum CEO: 2028年产能将售罄'
      - 'LightCounting: 2031年光模块接近600亿美元'
      - 国内周度Token消耗增280%
      - 燃气轮机订单积压到2029-2030年
      - Intel/AMD服务器CPU涨价
    risk_factors:
    - 若资金从主线兑现后不再回流主线分支，而转向纯题材小票或防御板块，则主线虹吸判断被证伪
    - 若连板晋级率重新抬升、情绪标的出现赚钱效应，风格切换可能只是暂时现象
    - 若海外光通信/燃气轮机扩产超预期，削弱产能紧张和涨价的景气稀缺性
    confidence_indicators:
    - 资金从强势分支兑现后仍在主线内部轮动，而非离开主线
    - 产业端出现产能售罄、订单积压多年、Token消耗量爆发等强景气数据
    - 龙头一季报业绩兑现，验证业绩+产业趋势双驱动
    - 政策与改革催化持续，如创业板改革落地
    merge_suggestion: 文章以资金流向验证风格切换与主线归属，符合主线识别框架
  - pattern_id: post_rally_mainline_confirmation_20260409
    name: 普涨后主线确认与持续性判断
    source_raw:
    - sources/raw/财经/早盘：26-04-09：地缘情绪脉冲终结，2.43万亿普涨，AI全产业链绝对核心.md
