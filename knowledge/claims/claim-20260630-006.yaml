  subject: 反转信号的出现频率分布
  timeframe: permanent
  statement: A股大部分反转并不以完整吞没的形式出现，而是发生在刺透与乌云盖顶；这两类形态的出现频率正常情况下远高于吞没。因此只看吞没会系统性错过大量反转机会。
  evidence_quote: 但是它们出现的频率，正常情况来讲会比吞没要高得多。……A股的大部分的反转，它其实会发生在刺透和乌云盖顶，就不是完整的吞没。那么如果你只看吞没的话，就会错过大量的反转机会。
  interpretation: 这是覆盖率的取舍：吞没精度高但样本极少，刺透/乌云精度略低但覆盖绝大多数底部/顶部。两者必须配套使用，不能只留高置信度、低频率的那一档。
