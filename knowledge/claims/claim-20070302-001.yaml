- id: claim-20070302-001-c
  source_path: sources/chanlun/lesson_033.md
  source_date: '2007-03-02'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 级别图是真实走势的简略模本
  topic: 不同级别的图是对真实走势不同精度的模本，严格级别由每笔成交按中枢定义递归确认
  timeframe: permanent
  statement: 第二种多义性是因为模本的简略造成的：不同级别的图其实就是对真实走势不同精度的一种模本，例如年线图没有分笔图的精确度高，很多重要细节不可能在大级别图里看到。从最严格的意义上说，走势的级别可以从每笔成交构成的最低级别图形不断按照中枢延伸、扩展等的定义精确地确认出来，这是最精确的，不涉及什么5分钟、30分钟、日线等。
  evidence_quote: 另外一种多义性，是因为模本的简略造成的。不同级别的图，其实就是对真实走势不同精度的一种模本，例如，一个年线图当然没有1 个分笔图的精确度高，很多重要的细节都不可能在大级别的图里看到。而所谓走势的级别，从最严格的意义上说，可以从每笔成交构成的最低级别图形不断按照中枢延伸、扩展等的定义精确地确认出来，这是最精确的，不涉及什么5
    分钟、30 分钟、日线等。
  interpretation: 分钟线、日线等常用级别并非理论本体，只是行情软件给定的取样精度；级别的本质是中枢按定义递归生成的产物，图表级别只是它的近似模本，大级别图必然丢失次级别细节。
