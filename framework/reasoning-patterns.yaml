      question: 消息是否已被充分定价？
      UP_logic: 可延续「消息驱动+位置更低」公式，但一致性形成过快（盘中提前至竞价）需警惕；此前有消息释放，低预期走出超预期是关键。
      evidence_sources:
      - 原文：一致性形成过快（从盘中提前至竞价）
      - 原文：创新医疗多根长上影
    - step: 4
