  timeframe: short-term
  statement: 氧化锆、金刚石、氮化铝等仍在风口的上游原材料并未受太大冲击，盘中功率半导体还有冲高。一旦今日指数企稳，上述方向连同刚有催化的液冷大概率成为资金进攻首选。但液冷存在过于一致的风险，且模仿氧化锆方向但时机不对。
  evidence_quote: 昨日液冷问题在于过于一致，且在模仿上周四的氧化锆方向，但氧化锆本身冷门、昨日指数太弱势——时机不对。然而氧化锆、金刚石、氮化铝等仍在风口的上游原材料并未受太大冲击，盘中功率半导体还有冲高，可见资金做了两手准备。一旦今日指数企稳，上述方向连同刚有催化的液冷大概率成为资金进攻首选。
  interpretation: UP对科技题材的观察：①上游原材料（氧化锆、金刚石、氮化铝）在指数弱势时展现出抗跌性，说明资金做好了两手准备（可上可守）；②液冷方向的问题是过于一致+时机不对（模仿上周四氧化锆模式但指数配合不佳）；③一旦指数企稳，上游材料+液冷是进攻首选方向；④功率半导体盘中已有冲高信号。
