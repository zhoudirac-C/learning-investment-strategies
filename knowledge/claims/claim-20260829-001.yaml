  subject: 买一的三个确认条件与胜率赔率评分
  timeframe: permanent
  statement: 买一（趋势转强向上突破）的三个确认条件：一是均线必须先走平或开始抬头，否则只能看做短期反弹或消息刺激；二是以收盘价确认，盘中站上不算；三是看量能，突破要么跳开跳过要么放量过，缩量突破要降低信号等级。UP评分：胜率3星、赔率5星、总分8星——赔率高因为出现在趋势刚启动位置、空间大、失效位置易定义（重新跌回成本中枢且均线继续向下弯即未确认）；胜率低因为太早、均线滞后性决定趋势惯性仍在、第一次突破容易失败。UP把买一定位为试错型趋势启动信号。
  evidence_quote: 我们平时经常说过你突破那根线你要么跳开跳过，你要么放量过。其他什么过我们都不认。所以放量过在我们A股当中是非常有必要的一个确认的条件。
  interpretation: 买一的用胜率高赔率换低胜率的试错结构，核心是用明确的失效位置控制试错成本。
