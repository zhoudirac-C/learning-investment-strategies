  subject: 中枢震荡的操作方向
  topic: 中枢震荡向上力度盘整背驰抛，向下力度盘整背驰回补，绝不杀跌追涨
  statement: 中枢震荡的操作一定是向上时力度盘整背驰抛、向下力度盘整背驰回补，而不是杀跌追涨。中枢震荡的幅度理论上可以极端到任意大再拉回来而依然是该级别中枢震荡，幅度不改变中枢的性质，所以追涨杀跌在中枢震荡中一定死定。在第三类买卖点后追涨杀跌不一定死，因为中枢的移动不一定恰好在你买卖的位置就结束，后面也还有中枢震荡出现，但这都不是长远之计，有第三类买卖点可用就不该追涨杀跌。
  evidence_quote: 所以中枢震荡的操作，一定是向上时力度盘整背驰抛，向下力度盘整背驰回补，而不是杀跌追涨，否则真出现这么有病的情况，那就真有病了……关于追涨杀跌，如果在中枢震荡中，一定死定。但如果是在第三类买卖点后，却不一定，因为中枢的移动，并不一定恰好就是你买卖的位置就结束了。
  interpretation: 把震荡市操作固化为反情绪动作：盘整背驰是高抛与回补的唯一触发器。理论极端例子说明中枢级别约束的是走势段的重叠关系而非波动幅度，这决定了震荡策略的稳健边界。
