- id: claim-20070302-001-a
  source_path: sources/chanlun/lesson_033.md
  source_date: '2007-03-02'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 中枢延伸造成的走势多义性
  topic: 中枢延伸使同一段走势在不同级别口径下产生同样合法的级别解释
  timeframe: permanent
  statement: 走势并非总是标准的a+A+b+B+c，所有走势的多义性都与中枢有关。第一种多义性来自中枢延伸：例如5分钟级别中枢不断延伸、出现9段以上的1分钟次级别走势时，站在30分钟级别中枢角度，3个5分钟级别走势重合即形成30分钟中枢，而9段以上的1分钟次级别走势每3段构成一个5分钟中枢，这样也可以解释成这是一个30分钟的中枢。
  evidence_quote: 市场总有其复杂的地方，使得市场的走势呈现一种多义性……而所有走势的多义性，都与中枢有关。例如，5 分钟级别的中枢不断延伸，出现9
    段以上的1 分钟次级别走势。站在30 分钟级别的中枢角度，3 个5 分钟级别的走势重合就形成了，而9 段以上的1 分钟次级别走势，每3 段构成一个5 分钟的中枢，这样也就可以解释成这是一个30
    分钟的中枢。
  interpretation: 多义性不是走势本身含糊，而是中枢延伸使同一段走势在不同级别口径下得到同样符合理论的不同解释；观察级别选得不同，中枢的归属与级别判定就不同，分析时必须意识到自己所站的级别口径。
  confidence: high
  status: active
