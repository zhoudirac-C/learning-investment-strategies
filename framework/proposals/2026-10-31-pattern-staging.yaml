  - pattern_id: panic_first_drop_vs_weakness
    name: 首次恐慌下杀与明确走弱分层框架（次新龙头）
    description: 当上市时间短但已大幅重估、辨识度高的次新龙头出现首次跳水或连续走弱时使用。核心是把「此前极强、无滞涨的首次恐慌下杀」与「已经明确走弱后的连续下跌」分开：前者只能小仓严格反馈博弈，后者必须等止跌证据。上市天数不等于趋势初期，不能用「没涨够二十天」代替阶段判断。
    trigger:
      - 次新龙头出现首次跳水（放量长阴或跌停）
      - 次新龙头连续走弱、重心持续下移
      - 出现以「上市天数少、跌得多」为依据的低吸提议
    data_requirements:
      - name: 个股日K
        channel: 日K线（infra/data/kline_cache.db，含上市日期）
      - name: 量能与换手
        channel: VOL 与换手率日序列
      - name: 板块强弱
        channel: THS 板块指数日K
    steps:
      - step: 1
        name: 充分演绎判定
        question: 是否已经充分演绎？
        action: 用信息传播、认知一致度、价格重估幅度判断，不用上市天数代替；传播广、涨幅大、研报密集即按充分演绎处理
        data:
          - 个股日K
          - 量能与换手
      - step: 2
        name: 首次下杀 vs 明确走弱
        question: 这是首次恐慌，还是走弱后的又一次下跌？
        action: 首次恐慌的前提是此前极强且无滞涨；若阴线前已有冲高回落、放量滞涨或多次突破失败，归入明确走弱
        data:
          - 个股日K
          - 量能与换手
      - step: 3
        name: 分层处置
        question: 允许的动作是什么？
        action: 首次恐慌仅作高波动小仓博弈并要求当日反馈；明确走弱必须等量缩、低开快速拉回、更高低点、连续两日重心稳定、板块回流、主动反包、分时承接增强
        data:
          - 个股日K
          - 板块强弱
      - step: 4
        name: 适用性排除
        question: 这笔交易是否超出可承受范围？
        action: 板块同步退潮或无止跌证据时不连续低吸；无风险预算与反馈纪律者不适用
        data:
          - 个股日K
    falsification:
      - 首次跳水前已出现滞涨、板块共振下杀、持续创新低，首阴资格不成立
      - 没有风险预算或反馈纪律时，「跌得多」「上市天数少」均不构成买入理由
      - 明确走弱后未出现止跌证据即连续低吸，视为违规
