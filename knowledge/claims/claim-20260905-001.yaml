  timeframe: permanent
  statement: 再平衡六种机制及付账人：①汇率调整（顺差国升值逆差国贬值，付账=顺差国出口部门+逆差国消费者，1985广场协议）；②需求收缩（逆差国财政紧缩，付账=逆差国全体居民尤其失业者，2010后希腊葡西）；③收入转移（顺差国收入从企业政府转向居民，付账=顺差国企业利润国企留存地方财政——IMF与美国要求中国走的路，经济学最温和政治最难）；④贸易保护（关税表面顺差国出口商付，实际大部分由逆差国进口商消费者支付，2018后研究一致）；⑤金融抑制与通胀（稀释债务实际价值，付账=债权人即外国养老央行保险——可单方面执行因此债市最警惕，美债期限溢价上行与各国央行连续三年创纪录购金本质是对冲）；⑥违约重组（付账=债权人，储备货币国不适用，通胀是替代品）。美国目前更接近第四条并向第五条转移；中国更接近第三条并尽量延长时间（十五规划已写入收入转移方向）。顺差回流悖论：美国要求顺差国少出口→回流买美债的钱减少→直接抬高美国融资价格。
  evidence_quote: 第五种是金融抑制和通胀。……也因此它会是债券市场最警惕的一条。美债期限溢价上行，各国央行连续三年创纪录购金，本质上就是债权人在对这条路径提前索价和对冲。
  interpretation: 六种机制构成政策路径的分类学：识别各国当前站位（美4+5、中3）即可预判成本转嫁方向与市场定价焦点。
