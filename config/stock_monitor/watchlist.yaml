market_framework:
  up_quote: 「高位反弹减仓，低位耐心等待；涨价为王，业绩为锚；短期不猜涨跌，中线看切换；冷眼旁观，等待结构性的分化。」
  current_stage: 调整尾部等确认信号 — 全A趋势下跌23个交易日，到达历史级别尾部区域。午后回升提前消耗修复动能，明日冲高概率下降。全A放量中阳线=唯一确认信号，在此之前不扩大风险敞口。
  core_operation: 持有不追、不加仓、紧守止损。建仓动作只在全A中阳线企稳后展开。恐慌买阴是小仓位博弈≠建仓。仓位纪律高于一切判断。当前持有雅克科技+风华高科，总仓位2.8%。
  opening_scenarios:
    scenario_A_修复确认: 全A放量中阳线+科技主动承接→可评估是否加仓，但绝不追高。加仓窗口只在量价确认后。
    scenario_B_偏弱震荡: 平开/低开/缩量→持有不动，紧守止损。UP提示午后回升提前消耗修复动能，冲高概率下降。
    scenario_C_放量下杀: 放量破位→止损纪律优先，不考虑任何买入。
  two_switching_logics:
    1_高低切换: 高位科技硬件/存储/CPU/科创50反弹减仓；资金流向跌深、低位、有预期的方向
    2_涨价为王: 弱市里唯有真实涨价+需求放量的品种能坚挺。真正值得配置的是「低位+涨价」交集（六氟化钨、球形硅微粉、前驱体）
  hedge_framework:
    情景A_鸽派科技修复: 进攻仓 = AI硬件 + 硅片 + 出海链
    情景B_地缘油价升级: 对冲仓 = 涨价材料(WF6/钨) + 商业航天 + 核电
  invalidation_conditions:
  - 全A指数继续破位→筑底失败→全部降仓至1成以下
  - 外围（美股/AI capex叙事）出现系统性崩坏→涨价逻辑证伪
  - 6/17 FOMC点阵图降息预期归零+油价持续上行→情景B全面主导→提高对冲仓比例
