  subject: 做中线的前提
  topic: 中线的前提是判断大盘处于上升途中的小低点
  timeframe: permanent
  statement: 做中线的前提是判断大盘当前点位只是上升途中的一个小低点；如果这个判断不成立就没必要做中线，直接做短线即可
  evidence_quote: 如果说你想做中线，那你要先明确一点，你目前这个点位，这个大盘的点位，你认为只是上升途中的一个小低点，你才有做中线的必要。不然你没有必要做中线，你就直接做短线就可以了，看我们前面短线选股的课程。
  interpretation: 中线持仓本质是押注大盘级别的上行趋势延续。大盘定性错了中线策略就不成立——周期判断先于仓位策略。
