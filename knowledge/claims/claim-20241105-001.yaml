  subject: MACD五分线做T买卖点
  topic: 5分钟MACD柱体与金叉死叉辅助做T买卖点
  timeframe: permanent
  statement: MACD切到5分钟线看做T买卖点：绿柱快要消失是分时买点，红柱拉得很长差不多是卖点；黑线上穿红（橙）线是买点，黑线下穿是卖点。UP自陈「不一定准」，强调分时线不如选股重要
  evidence_quote: MACD指标我一般看的是把它切到五分线来。……当绿柱快要消失的时候……这就是一个分时分线的一个买点。然后当红柱感觉说这个红柱好长条啊……就差不多是一个做T的一个卖点。它当黑线上穿这个红线的时候呢……就是一个买点。当黑线呢下插这个红线的时候……就是一个卖点。当然不一定准，但是说我认为做T的这些分时线都不是最重要的，最重要的还是选股。
  interpretation: 5分钟级MACD柱体衰竭与金叉死叉作为做T的辅助计时工具。UP明确将其定位为次要工具（选股大于分时线），避免过度依赖指标。
