  evidence_quote: 如果高位区域它成交量持续的减少，那又说明愿意继续追高的资金可能正在减少，那么市场上涨就可能需要依靠市场的一个惯性，而不是新的资金推动。而如果是高位区域成交量持续的放大，但价格上涨越来越困难，那么就说明市场内部的分歧正在扩大，早期进入的资金开始兑现收益，那么新进场的资金承接力度不足，那么资金推动价格的效率就正在下降。
