  - 有色贵金属
  - 科技产业链分析
  - 科技产业链投资
  - 算力基础设施
  data_requirements:
  - name: 日K线与历史走势
    channel: K线缓存（infra/data/kline_cache.db）
  - name: 技术指标数据
    channel: 由K线计算（波浪结构/钝化/支撑压力/布林线/均线/高9序列）
  - name: 分时与成交量
    channel: 分时行情 / K线缓存（volume/turnover 字段）
  - name: 板块联动与波动率
    channel: 行情数据 / 由K线计算（历史波动率）
  steps:
  - step: 1
    name: 判断大盘技术位置
    question: 当前大盘处于什么技术位置？
    action: 用波浪结构（A/B/C浪）、顶部/底部钝化、支撑压力位判断大盘位置；时间与空间两个维度锁定一个确定项即可操作
    data:
    - 日K线与历史走势
    - 技术指标数据
  - step: 2
    name: 分析个股/板块技术形态
    question: 目标个股/板块的技术形态如何？
    action: 按形态定策略：强势股沿布林线中轨持有，跌破2-3天不拉回离场；震荡股下轨支撑介入、上轨卖出；K线位置决定操作方向
    data:
    - 技术指标数据
    - 分时与成交量
  - step: 3
    name: 确认买卖信号
    question: 是否出现明确的买卖信号？
    action: 买点核对——回调至支撑位+缩量+分时拉回；卖点核对——顶部钝化+高9+放量滞涨；信号不明不追高
    data:
    - 技术指标数据
    - 分时与成交量
    - 板块联动与波动率
  - step: 4
    name: 设置风控与止损
    question: 如果信号失效，止损位设在哪里？
    action: 跌破关键支撑位（布林线下轨、前期低点）且3日内不收回则止损离场；单笔亏损控制在5%以内
    data:
    - 日K线与历史走势
    - 板块联动与波动率
  falsification:
  - 关键支撑位跌破且3日内不收回（技术结构破坏）
  - 买入信号出现后量价背离（放量下跌/缩量上涨乏力）
  - 大盘系统性破位下行或宏观政策重大转向
  - 板块情绪退潮：核心标的放量滞涨、联动失效
  validation:
    historical_hit_rate: 0.5182
    hit_rate_note: 买入信号引擎离线回测实测（logs/backtest_buy_signals_20260808.md）——5日前向命中率51.8%（n=1403）、10日53.4%（n=1279）、20日47.9%（n=1070），窗口2026-04-27~2026-08-07，标的池212只；引擎内部缩量/MA20条件读取缓存最新窗口而非信号日（qing_investment未改），结果为近似
    applicable_regime: null
