  evidence_quote: 我就选择买比较低位的存储，把麦格米特切到低位存储，这个是需要点耐心的，也不保证赚钱啊，我就博弈说资金后面大盘量能上来之后再切回来做科技。那那些还没涨的，比如说存储的涨得比较少的，就很有可能会被资金带动到。
  interpretation: 明确的博弈结构：低位存储=「等量能回升→资金回流科技→低位补涨」的提前卡位。UP 自己标注了不确定性（需耐心、不保证赚钱）——这是赔率型左侧布局，不是确定性推荐。与青枫浦上Q「存储经验：供需价格先于整体行情成独立线索」形成不同视角（卢=资金轮动卡位，青枫=产业供需先行），不强行调和。
