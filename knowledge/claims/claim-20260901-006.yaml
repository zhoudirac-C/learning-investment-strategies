  timeframe: short-term
  statement: 接力观察两情形：情形A，次日首板家数不锐减、二板家数维持合理晋级水平，则梯队高度与宽度同步，接力可延续；情形B，二板抬升而首板锐减，或高标在指数走强背景下午后分歧，属高度抬升接力面收敛的背离结构，需按情绪高点对待。另有反复验证的经验：当日尾盘被集中抢筹的分支次日往往更难维持（买盘被提前消耗），当日分歧充分、未被抢筹的分支次日回流预期更强。
  evidence_quote: 情形B：若二板抬升而首板锐减，或高标在指数走强的背景下出现午后分歧，则属于高度抬升、接力面收敛的背离结构，需要按情绪高点来对待。另有一条反复验证过的经验：当日尾盘被集中抢筹的分支，次日往往更难维持，因为买盘被提前消耗。
  interpretation: 两条可复用的情绪技术规则：①首板/二板家数结构判断接力健康度；②尾盘抢筹=透支次日。对次日盘前判断短线分支强弱直接可用。
