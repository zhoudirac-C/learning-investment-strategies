  subject: 背驰段内部结构与区间套定位
  topic: c 至少含两个次级别中枢构成次级别趋势，可递归套用同一形式精确定位背驰
  statement: 对 a+A+b+B+c 中背驰段 c 的内部分析：由于 c 包含 B 的第三类买卖点，c 至少包含两个次级别中枢（否则满足不了次级别离开后次级别回拉不重回中枢的条件），这两个中枢构成次级别趋势的关系，是最标准最常见的情况，此时可继续套用 a+A+b+B+c 的形式进行次级别分析，形成类似区间套的状态，对其后的背驰更精确地定位。连接段 b 有可能小于次级别，力度最大的是连续缺口，但 b 在级别上不能大于 c；若 b 是次级别而 c 出现连续缺口，c 是背驰的可能性很小，就算是，出现最弱走势的可能性极大。
  evidence_quote: 由于c 包含B 的第三类买卖点，则c 至少包含两个次级别中枢，否则满足不了次级别离开后次级别回拉不重回中枢的条件。这两个中枢构成次级别趋势的关系，是最标准最常见的情况，这种情况下，就可以继续套用a+A+b+B+c 的形式进行次级别分析确定c 中内部结构里次级别趋势的背驰问题，形成类似区间套的状态，这样对其后的背驰就可以更精确地进行定位了……而b 是有可能小于次级别的，力度最大的就是连续的缺口，也就是说，b 在级别上是不能大于c 的。
  interpretation: 区间套是缠论定位背驰精确位置的标准技术：大级别确认背驰段后递归到次级别，用同一形式逐层缩小背驰点范围。b 与 c 的级别不等式则是识别假趋势的快速过滤条件。
