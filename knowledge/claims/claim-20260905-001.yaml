  subject: 美国对华经济叙事第三次升级
  timeframe: trend
  statement: 美国对华经济叙事已第三次升级：第一代2018年双边贸易逆差账本（301关税、2020年第一阶段协议2000亿美元采购承诺）；第二代2022年10月先进计算芯片与半导体设备出口管制（供应链安全、国家安全、去风险，2023年夏日本荷兰跟进）；第三代即本次G20的全球失衡框架——中国高储蓄低消费高投资结构通过出口向全球传导。贝森特会前称世界很难长期接受一个拥有约1.2万亿美元贸易顺差的中国，中国经济需要从出口重新转向国内需求。
