  - 退出规则
  - 顺势而为
- id: claim-20070307-001-h
  source_path: sources/chanlun/lesson_034.md
  source_date: '2007-03-07'
  source_type: 专栏
  extracted_at: '2026-07-18'
  claim_type: technical-knowledge
  subject: 操作级别确定方法
  timeframe: permanent
  statement: 走势千变万化而有级别性，任何『当下』并不意味着一秒钟的变化，而是根据资金以及承受能力所可能的操作级别来决定的。例如根据自己的资金等情况决定操作级别为30分钟，则30分钟所有可能发生的走势都应在计算之中；一旦已有操作与30分钟实际当下走势相反，就意味着进入了30分钟级别的屠杀机器，必须立即退出。
  evidence_quote: 当然，走势是千变万化而有级别性的，任何的当下，并不就意味着1 秒种的变化，而是根据你的资金以及承受所可能的操作级别来决定的。一直所说的操作级别，就是针对此而说。例如，你根据资金等情况，决定自己的操作级别是30
    分钟的，那30 分钟所有可能发生的走势都在你的计算之中，一旦你已有的操作出现与30 分钟实际当下走势相反的情况，那么就意味着你将进入了一个30 分钟级别的屠杀机器里。
  interpretation: 给出『当下』的实操定义：当下是级别化的，级别由交易者的资金量与风险承受能力决定而非主观随意选择。风控的触发点也因此级别化——同一波动在不同操作级别下意义完全不同，退出信号以自身级别为准。
