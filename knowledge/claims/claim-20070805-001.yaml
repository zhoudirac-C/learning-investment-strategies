- id: claim-20070805-001-b
  source_path: sources/chanlun/lesson_068.md
  source_date: '2007-08-05'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 买卖点的分段操作原则
  topic: 任何级别永远的分段函数，买点买、卖点卖、之间持有
  statement: 缠论本质上是最好的一套分段原则，可以随市场当下变化随时给出分段信号。任何级别都有一个永远的分段：X等于买点，买入；X等于卖点，卖出；X属于买卖点之间，就持有——持有的种类，前面买点、卖点没出现就是股票，反之就是钱。真正成功的操作者从来都不预测什么，真正的操作者都有一套操作的原则，按照原则来就是最好的预测。操作前必须先选择好自己的操作级别，否则本来是大级别操作的，看到小级别的晃动也晃动起来，那是有毛病。
  evidence_quote: 因为本质上本ID 的理论，是最好的一套分段原则，这一套原则，可以随着市场的当下变化，随时给出分段的信号。按照本ID 理论来的，其实在任何级别都有一个永远的分段： X=买点，买入；X=卖点，卖出；X 属于买卖点之间，就持有，而这持有的种类，如果前面买点，卖点没出现，就是股票，反之就是钱……真正成功的操作者，从来都不预测什么……真正的操作者，都有一套操作的原则，按照原则来，就是最好的预测……你先选择好自己的操作级别，否则，本来是大级别操作的，看到小级别的晃动也晃动起来，那是有毛病。
  interpretation: 把完全分类预测法落成三值分段函数，是缠论操作的最简表述；级别选定是该函数生效的前提。给出分段函数就是给出最精确的预测，所有预测都是当下给出的。
