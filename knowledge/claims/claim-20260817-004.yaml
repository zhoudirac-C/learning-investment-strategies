  timeframe: permanent
  statement: 斯迪克(300806)从三十多块钱起UP就在个股分析中持续讲买入逻辑与展望，早期跟随者不可能亏钱；但后期高位追入者在其回调腰斩时产生亏损——同一标的盈亏取决于买入时机。
  evidence_quote: 比如说最早最早的斯迪克，其实我在这里个股分析其实讲了很多，就是从大概三十多块钱的时候买入逻辑是什么，然后以及展望是怎么样的。如果是那个时候加入星球的，我觉得应该不可能有人在斯迪克上亏钱，如果是后面再高位买的话，确实它回调了，腰斩了，然后然后可能会产生亏损，但是毕竟还是要看买入时机。
