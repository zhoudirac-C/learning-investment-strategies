  claim_type: technical-knowledge
  subject: 吞没四条加分条件的判定标准
  timeframe: permanent
  statement: 加分条件四项目：⑤第二根完全包裹第一根全部K线（含影线）为「完整吞没」，强于仅实体包裹；⑥第二根实体远大于第一根实体，差距越大力量切换越彻底；⑦第二根放量，量比超过 1.5 倍算达标（课中例：34.7 亿 / 21.1 亿 = 1.64）；⑧出现在长期下跌的明显低位（看涨）或长期上涨的明显高位（看跌），位置越极端反转概率越大。
  evidence_quote: 条件五就是说你第二根，阳线，完全，包裹了第一根阴线的全部K线，就包括它的，影线部分，也都包括了，这个就叫做完整吞没，它比实体的吞没信号会更强。第六个条件，就是你第二根，阳线的实体远大于第一根阴线的实体……第七个条件就是第二根阳线你是要放量的……三十四点七除以二十一点一就等于一点六四，那么是超过一点五的，如果这个是超过一点五，那么就OK
  interpretation: 量能门槛被量化到 1.5 倍，是本课唯一给出的硬阈值；其余三项（含影线、实体差距、位置）是序关系判断。四项同时满足即进入 A 级候选。
