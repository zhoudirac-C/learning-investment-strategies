  evidence_quote: 个人倾向于将上午关键位置的承接理解为主动稳市买入，午后加速则可能由趋势跟随与量化交易共同放大。公开成交数据尚不能确认买盘身份及贡献比例。下周关键在于，最先承接的资金是否愿意在指数脱离低位后继续买入，而非仅在急跌时防止流动性失衡。
  interpretation: UP对护盘资金性质的推断（自承认为倾向性判断，故置信度中）；给出的持续性判据是「脱离低位后仍买」而非「急跌时托底」。
