  data_requirements:
  - name: 事件进展与政策表态
    channel: 新闻 / 政策文件 / 历史对照案例
  - name: 定价锚行情数据
    channel: 行情数据（原油/美元指数/美债收益率/通胀预期）
  - name: A股风格与资金数据
    channel: 行情数据（风格指数/板块估值百分位/北向资金/融资余额）
  - name: 宏观对比与行业基本面
    channel: 研报（中美欧经济对比/行业ROE/全球市占率）/ 央行政策动向
  steps:
  - step: 1
    name: 定性宏观事件性质与级别
    question: 当前宏观事件是什么性质？短期冲击还是长期格局改变？
    action: 区分短期事件冲击（如单次地缘冲突）与长期格局改变（如康波周期切换、美元信用体系变化）；前者按交易事件处理，后者按交易趋势处理
    data:
    - 事件进展与政策表态
  - step: 2
    name: 分析定价锚传导路径
    question: 宏观事件如何通过定价锚影响市场？
    action: 沿传导链逐环核对行情数据——地缘冲突→油价/大宗商品→通胀预期→美债收益率→全球流动性→A股风格；或能源冲击→美元走强→新兴市场失血→风险资产重估
    data:
    - 定价锚行情数据
  - step: 3
    name: 定位A股影响维度
    question: 对A股是风格影响、板块影响还是系统性风险？
    action: 将影响归类为三个维度之一——风格切换（成长↔价值、大盘↔小盘）、板块重估（受益/受损四象限）、系统性风险（流动性危机），不同维度对应不同策略
    data:
    - A股风格与资金数据
  - step: 4
    name: 制定对冲或受益策略
    question: 如何配置以应对或利用这次宏观冲击？
    action: 受损方向规避、受益方向布局，对冲优先于单边押注；同时检查反直觉的二阶传导机会（如高油价最终利好中国制造业）
    data:
    - 宏观对比与行业基本面
  falsification:
  - 传导链中间环节未按预期演绎（油价冲高回落、美债收益率转降）
  - 事件快速平息或政策表态转向（短期冲击证伪）
  - A股资金数据与判断背离（北向资金/融资余额反向运行）
  - 大盘系统性风险超预期扩散
