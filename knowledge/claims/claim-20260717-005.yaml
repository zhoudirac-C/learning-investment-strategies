  subject: 科技可以出掉，怕周一涨就出一半剩一半周一再出
  timeframe: intraday
  statement: 科技可以出掉没问题。如果怕周一涨，可以出一半，剩下的周一再出。今天有大量抄底资金，后面肯定要杀抄底资金，所以我们只卖不买，坚决不抄底。这一轮调整不会很快结束，筑底时间也不会短。
  evidence_quote: 科技可以出掉，没问题，你们如果怕周一涨，可以出一半，剩下的周一再出，今天有大量的抄底资金，后面肯定要杀抄底资金，所以我们只卖不买，坚决不抄底。这一轮的调整不会很快结束，筑底也是时间也不会短。
  interpretation: UP明确给出两个选项：①全部出清（符合纪律）②出一半留一半周一出（给担心卖飞的人缓冲）。最重要的逻辑是"杀抄底资金"——今天暴跌后有大量散户抄底，主力后续会先拉升让这批人坐不住，再反手杀跌。因此坚持只卖不买，不参与抄底。这里"只卖不买"策略延续到下周。
