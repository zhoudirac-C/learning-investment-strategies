    subject: 科技股阶段性别规避
    timeframe: short-term
    statement: 6月至7月中上旬阶段性规避科技股（短期估值太高，国内半导体估值比外盘还贵），但长期看好半导体。UP明确非科技方向在磨底期更值得布局：燃气轮机、储能六氟、消费、创新药、出海链。极少数科技个股可能穿越但需概念好+业绩好双重条件
    evidence_quote: |
      我半导体，我是长期看好的，但是短期太高了，我不看了。科技太高了，我短期不看。 外盘的科技股，哪怕长成这个样子，你从估值角度算的话，他们的整体的估值没有比我们贵。 从这个角度讲：如果外盘科技崩了，国内更扛不住——A股半导体估值比外盘还贵，外盘一崩国内好不到哪去。
    interpretation: |
      UP给出明确的阶段性科技规避信号，论据有二：①A股半导体估值甚至高于外盘世界级公司； ②外盘若崩，高估值的A股科技首当其冲。但这不是永久看空——"长期看好，短期不看"， 类比"科技该歇歇了，后面炒业绩的时候再表现"。极少数穿越标的需具备概念好+业绩好的双重条件。
