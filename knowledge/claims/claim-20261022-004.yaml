  statement: U 型磨底的参考时长是 8-18 个交易日（本轮已横 6 天，时长未满）；参照系是去年 12 月筑底（两次打新低才走出 U）与 7 月急护盘（三万多亿抛压下第二只脚未创新低）。操作上严禁左侧：必须等市场底出来，在"现货未止跌、空头气势正盛"时进场接飞刀必亏
