    merge_suggestion: 分析上游周期品涨价逻辑，涵盖需求结构、供给转移、价格水位、库存
  - pattern_id: upstream_price_profit_elasticity_20260111
    name: 涨价利润弹性推演与题材映射
    source_raw:
    - sources/raw/财经/周复盘：26-01-11：A股暴涨之下如何守住繁华.md
    key_themes:
    - 存储芯片涨价
    - 化工品涨价
    - 资源品涨价
    - 上游周期品利润弹性
    - 涨价题材交易
    reasoning_chain:
    - step: 1
      name: 获取并验证涨价信号
      question: 涨价是否真实发生？
      UP_logic: 建议加硬件渠道群/QQ群拿第一手资料；显卡显存从两万多涨到三万多，佐证存储涨价。
      evidence_sources:
      - 硬件渠道群/QQ群
      - 显卡显存价格变化
    - step: 2
      name: 计算利润弹性
      question: 涨价对利润的弹性有多大？
      UP_logic: 卖价11成本10利润1；涨到12利润2。涨价不到10%，利润翻倍，财报利润增速极其夸张。
      evidence_sources:
      - 价格与成本假设
      - 小学数学弹性测算
    - step: 3
      name: 映射到股价炒作
      question: 利润弹性为何能驱动股价？
      UP_logic: 利润增速极其夸张成为炒作由头；化工每年一涨价就疯炒，资源品同理。
      evidence_sources:
      - 财报利润增速
      - 历史板块炒作规律
    - step: 4
      name: 推广到同类板块
      question: 还有哪些板块适用该逻辑？
      UP_logic: 存储、化工、资源品都适用；涨价是永恒不变的可以炒的东西。
      evidence_sources:
      - 行业渠道信息
      - 各类上游品历史表现
    risk_factors:
    - 成本同步上涨，利润弹性被抵消
    - 涨价只是报价或消息，缺乏真实成交支撑
    - 股价已提前透支涨价预期，财报兑现时见光死
    confidence_indicators:
    - 多方渠道交叉验证涨价真实性
    - 涨价由供需缺口或供给收缩驱动，而非短期情绪
    - 板块成交额放大且出现涨停潮，资金开始按新利润预期定价
    merge_suggestion: 涨价→利润弹性→炒作的推演，正是上游周期品分析的核心路径
