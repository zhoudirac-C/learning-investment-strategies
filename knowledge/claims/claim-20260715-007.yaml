  statement: 2.5万亿成交额是科技能否反复的关键分水岭：情形A若守住2.5万亿，科技大概率有反复机会，回调是时间与空间上的消化；情形B若缩至2.5万亿以下且低位方向继续吸金，调整周期拉长，短线风格向题材投机与连板倾斜。
