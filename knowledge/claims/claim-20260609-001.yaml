  subject: 工程机械基本面与走势背离，低估值修复机会
  timeframe: trend
  statement: 2026年5月挖掘机销售24794台同比+36.2%，内销+38.6%出口+34.2%，3/4/5月销量连续超预期且增速逐月加速。高油价不是压制而是利好——矿产品涨价驱动设备购入。三一重工海外毛利率较国内高10.95pct。受资金抽血影响板块出现基本面与走势显著背离，核心龙头PB一度回落至周期底部1.8倍以下。前瞻PE：三一约16x、徐工约13x、中联约11x。重点关注三一重工(600031)、徐工机械(000425)、中联重科(000157)、柳工(000528)、恒立液压(601100)。
  evidence_quote: 2026年5月我国挖掘机销售24794台，同比增长36.2%。3/4/5月销量连续超预期且增速逐月加速。受资金向部分科技题材抽血影响，板块出现基本面与走势的显著背离。
  interpretation: |
    工程机械是UP在今日早盘中唯一给出"安全边际较充足"明确评价的方向：
    ①销售数据连续3个月加速→基本面向上
    ②PB跌至周期底1.8倍→估值向下
    ③背离=修复机会，但不等于立即上涨
    
    全为主板标的，用户全部可交易。PE最低的是中联重科(000157, 11x)。
