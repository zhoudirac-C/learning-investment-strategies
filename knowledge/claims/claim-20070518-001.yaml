  subject: 形态可预测而点位不可预测
  topic: 唯一可绝对预测的是市场走势的基本形态，点位只是形态演化中当下形成的结果
  statement: 市场走势可以绝对预测，但可绝对预测的只是基本形态而非点位。建立在机械的上帝式思维上、把市场当成不受参与者观察干扰的系统的预测标准本来就不存在，因为市场的预测者、观察者、参与者恰好又是市场走势的构成者。形态是不患的，点位是不患之患，点位都在基本形态的演变中当下形成，追求对点位的非当下把握是错的；只要把握了形态这个不患，点位之患自然就在当下的把握中。最基础的基本形态就是以中枢、级别为基础的趋势与盘整。
  evidence_quote: 唯一并绝对可以预测的，就是市场走势的基本形态。不学无术之辈，喜欢谈论所谓的点位，却不知道，点位只是基本形态演化的一个结果，是当下中形成了，形态是“不患”的，点位是“不患”之“患”……市场的基本形态是什么，最基础的，就是反复说的以中枢、级别为基础的趋势与盘整。
  interpretation: 这是缠论对无须预测与绝对预测的统一表述：不预测点位，但对形态演化有绝对的分类与边界。所有操作练习归根结底立足于对基本形态的把握，这是实际操作的最基础。
