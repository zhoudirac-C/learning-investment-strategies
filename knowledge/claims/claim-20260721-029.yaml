  subject: 中国上半年经济K型分化-下半年需加码政策
  timeframe: trend
  statement: 上半年GDP同比增长4.7%（Q1 5.0%/Q2 4.3%/Q2环比0.9%），完成全年4.5%目标下半年必须出台加码政策。生产端韧性（高技术制造+13.3%/装备制造+9.3%/信息软件+10.7%）与需求端偏弱（社零+1.3%/固投-5.7%/地产投资-18%/民间投资-8.5%）形成K型分化。单一总量工具无法同时解决产业升级和稳就业的双重目标，资金持续向高景气行业集中。
  evidence_quote: 核心经济数据表现：上半年GDP同比增长4.7%，一季度增长5.0%，二季度增长4.3%，二季度环比增长0.9%，要完成全年4.5%的GDP增长目标，下半年必须出台明确的加码政策。生产端韧性数据：工业增加值增长5.4%，高技术制造业增长13.3%，装备制造业增长9.3%，信息软件增长10.7%，出口保持较快增长，高技术制造、装备软件和出口共同构成经济增长的上沿。需求端偏弱数据：社会消费品零售总额上半年仅增长1.3%，固定资产投资下降5.7%，房地产开发投资下降18%，民间投资下降8.5%。K型分化的三类影响：宏观数据增长但微观偏弱，单一总量工具无法同时解决产业升级和稳就业，资金持续向少数高景气行业集中。
  interpretation: UP拆解中国经济的K型分化格局：产业升级（高技术制造/出口）是上沿，消费/地产/民间投资是下沿。下半年GDP增速若要达标（4.5%），政策加码是必然的。资金持续向高景气行业集中意味着A股的结构性行情（而非普涨）是大概率方向。
