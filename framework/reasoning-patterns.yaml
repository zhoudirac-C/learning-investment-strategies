    reasoning_chain:
    - step: 1
      name: 对比预期定修复强度
      question: 今日修复强度如何？
      UP_logic: 全线反包修复超预期，创业板突破3600，修复强度远超此前预期；用指数反包与关键位突破定位情绪强度。
      evidence_sources:
      - 沪指反包昨日阴线
      - 创业板指突破3600点
    - step: 2
      name: 识别主线板块阵型
      question: 市场结构是否主线领涨？
      UP_logic: 板块阵型以算力租赁、锂电池、AI硬件为核心进攻方向，无防御型板块，是典型的主线领涨强势市场特征。
      evidence_sources:
      - 盘面板块核心表现
      - 有无防御板块
    - step: 3
      name: 拆解主线日内阶段
      question: 主线板块能否延续？
      UP_logic: 龙头持续强攻带动批量补涨，涨停潮是日内高潮迹象，次日大概率分化；但Token涨价与算力卡供不应求下，分化后仍有结构性机会。
      evidence_sources:
      - 算力租赁涨停潮
      - Token涨价
      - 高端算力卡供需
    - step: 4
      name: 检验修复质量
      question: 修复是主动攻击还是被动反弹？
      UP_logic: 除算力租赁主动打开空间外，CPO仍由前期跌幅居前品种领涨修复，而非高位人气品种主动打空间，这是核心瑕疵。
      evidence_sources:
      - CPO领涨品种结构
      - 算力租赁与CPO主动性对比
    - step: 5
      name: 按龙头变量推演后续
      question: 午后如何验证修复性质？
      UP_logic: 若中际旭创、东山精密任一持续放量走强，则结构级别扩大、补涨增多；若维持现状或回落，则只算中等修复，明日重回调整。
      evidence_sources:
      - 中际旭创分时量价
      - 东山精密分时量价
      - 4月8日以来上升结构
    risk_factors:
    - 中际旭创与东山精密均未放量走强，修复只能定性为中等强度
    - 算力租赁涨停潮后次日大幅分化且无回流，主线持续性证伪
    - 市场冲高回落未能守住反包/突破位，修复超预期判断失效
    - 高位人气品种缺席、仅超跌品种领涨，则属于被动修复
    confidence_indicators:
    - 指数反包并突破关键点位
    - 算力租赁龙头持续强攻并带动批量涨停
    - CPO双核之一持续放量走强
    - 高位人气品种主动打空间而非超跌品种领涨
    merge_suggestion: 归入板块轮动：以龙头主动性判断修复质量，识别补涨还是扩散
  - pattern_id: mainline_internal_rotation_20260413
