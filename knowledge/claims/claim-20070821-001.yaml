- id: claim-20070821-001-c
  source_path: sources/chanlun/lesson_072.md
  source_date: '2007-08-21'
  source_type: 专栏
  extracted_at: '2026-07-18'
  subject: 技术面的系统定位
  topic: 基本面与比价定介入种类，技术面在操作上起决定性意义
  statement: 对散户来说，最终能战胜市场、获得超越市场回报的，只有在乘法原则下的技术面操作。技术面是三个独立系统里的一个，另外两个（例如比价关系与基本面）可以配合决定你的介入种类；但当介入到一个品种后，技术面在操作上就起着决定性的意义，因为其他的面变化频率都没有技术面高：基本面变化大致有一定稳定性，不可能天天是奇点、断裂点，比价关系确立后也基本保持稳定，这种变化少的系统不需要花太多精力研究，而技术面显然不同。对散户而言，对基本面的研究能力要超过一个好的基金团队的可能性微乎其微，最简单、最不伤脑筋的方法就是买指数基金、或者具体行业、板块的基金，至少肯定不会跑输指数。
  evidence_quote: 对于散户来说，最终能战胜市场、获得超越市场的回报的，只有在本ID 所说的乘法原则下的技术面操作。技术面是三个独立系统里的一个，而另外两个，例如比价关系与基本面，可以配合决定你的介入种类。但当介入到一个品种后，技术面在操作上就起着决定性的意义……基本面，其变化大致是有一定的稳定性的，不可能天天都是奇点、断裂点。比价关系也一样，一种比价确立后，就基本保持稳定了……你对基本面的研究能力要超过一个好的基金团队的可能性是微乎其微的……最简单、最不伤脑筋的方法，本ID 也说过，就是买指数基金、或者具体行业、板块的基金。
  interpretation: 三系统分工：基本面与比价定买什么，技术面定何时买卖。乘法原则指各独立系统配合过滤以降低失误率。散户基本面研究无法胜过基金团队，故基本面维度用指数化工具外包，精力集中在技术面。
