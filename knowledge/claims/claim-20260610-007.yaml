  claim_type: operation
  subject: 燃气轮机操作纪律——做T→反弹减仓→等黄金坑补仓（不是直接砍）
  timeframe: short-term
  statement: |
    UP 对燃气轮机持仓给出三层操作框架：
    ①能做T做T — 利用日内波动降低成本
    ②反弹之后减仓 — 不直接砍，等反弹再减
    ③等后面黄金坑出现之后再补 — 中长线看好，等深跌后捡回来
    
    两个禁忌：直接砍不合适（底部割肉），拿着硬抗也不合适（被动深套）。
    核心思想：控制仓位而非清仓离场——保持在场但降低暴露，等美股企稳+黄金坑确认后再加回。
  evidence_quote: 这种节点能做T做T，反弹之后减仓，直接砍也不合适，拿着硬抗也不合适，等后面黄金坑出现之后再补吧。
  interpretation: |
    这是 UP 交易哲学的核心体现——赔率思维下的仓位管理：
    - 「直接砍不合适」= 当前价位已不具备止损的赔率优势（反弹减仓比跌停清仓更优）
    - 「拿着硬抗不合适」= 被动接受回撤不是专业交易者的做法
    - 「做T→反弹减仓→黄金坑补」= 主动管理仓位，保持方向判断但缩短持仓周期
    
    对比此前 Qing-Agent 的「明日开盘择机清仓」建议：Qing-Agent 从纯技术面出发（跌停放量破位→止损），但缺少了 UP 的「基本面完好+美股映射」的判断维度。UP 的方法论强调区分「逻辑证伪」和「外部扰动」——后者不应触发清仓。
    
    跟踪指标：反弹力度（能否回31以上）、美股科技企稳信号、燃气轮机板块联动。
