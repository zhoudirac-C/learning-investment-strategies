  subject: 缠中说禅背驰买卖点定理
  topic: 任一背驰必然制造某级别买卖点，任何逆转必然包含某级别的背驰
  statement: 缠中说禅背驰-买卖点定理：任一背驰都必然制造某级别的买卖点，任一级别的买卖点都必然源自某级别走势的背驰。推论：出现背驰后必然有逆转，这是没任何商量余地的；逆转的幅度就是重新出现新的次级别买卖点为止；逆转并不意味着永远反向，例如日线上向上的背驰制造卖点，回跌后在5分钟或30分钟出现向下的背驰制造买点，然后又可以重新上涨甚至创新高。背驰同样有级别问题：一个1分钟级别的背驰，在绝大多数情况下不会制造一个周线级别的大顶，除非日线上同时也出现背驰。背驰后其回跌一定至少重新回到B段的中枢里。
  evidence_quote: 缠中说禅背驰-买卖点定理：任一背驰都必然制造某级别的买卖点，任一级别的买卖点都必然源自某级别走势的背驰……但出现背弛后必然有逆转，这是没任何商量余地的。有人要问，究竟逆转多少？那很简单，就是重新出现新的次级别买卖点为止。
  interpretation: 该定理把背驰与买卖点锁成等价关系，逆转幅度由次级别新买卖点的出现来界定，而非固定百分比。级别匹配是防误用的关键：小级别背驰不制造大级别顶底。回跌至少回B段中枢是标准背驰的最低保证。
