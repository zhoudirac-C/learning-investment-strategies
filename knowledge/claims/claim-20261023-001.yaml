- id: claim-20261023-001-e
  claim_type: methodology
  subject: 多周期结构印证判读
  timeframe: short-term
  confidence: high
  intensity: high
  stance: view
  statement: 日线和60分钟结构若先后形成，才说明不同周期下跌动能开始相互印证；若60分钟先修复而日线未确认，市场仍处在短周期变化向日线传递的阶段。
  evidence_quote: 日线和60分钟若先后形成结构，意味着不同周期的下跌动能开始出现相互印证的改善；若60分钟先修复，日线仍未达到条件，市场就还处在短周期变化向日线传递的阶段。
  interpretation: UP强调多周期信号要分层确认：60分钟修复只是提前量，不能提前等同日线反转；只有日线也满足条件，才说明短周期改善被更大周期接受。
