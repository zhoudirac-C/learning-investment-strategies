  claim_type: methodology
  subject: 宏观数据公布前的市场解释框架
  timeframe: short-term
  statement: 宏观数据公布前应预设三种市场解释：数据好于预期则周期、消费、金融接力且上证涨得更健康；总量一般但工业和出口较强则科技制造与出海产业链继续上涨；消费、地产和投资全面偏弱则市场重新押注政策宽松但指数可能先跌后稳。
  evidence_quote: '周复盘的时候说了数据公布前设定的三种市场解释。

    1.数据好于预期:周期、消费、金融接力，指数上证会涨的更健康。

    2.总量一般，但工业和出口较强，科技制造、出海产业链继续上涨。

    3.消费、地产和投资全面偏弱:市场重新押注政策宽松，但指数可能先跌后稳。'
  interpretation: 三种情形分别对应顺周期、科技制造与政策博弈三种定价路径，数据公布前需预设框架以便快速归类市场反应。
