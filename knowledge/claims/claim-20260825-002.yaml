  subject: 弱转强二波先兆
  timeframe: short-term
  statement: 日内最值得记的是金健米业(600127)带动农业弱转强。与8月21日那次的差别在板块有没有助攻：上次前一日下午已提前修复属明牌博弈，这次板块已连续调整四天、昨日并未提前发酵，跟随板块先行调整+龙头高位震荡维持趋势，往往是二波行情的先兆形态。
  evidence_quote: 日内最值得记的是金健米业带动农业弱转强。与8月21日那次的差别在于板块有没有助攻：上次是前一日下午已提前修复、属明牌博弈，这次板块已连续调整四天、昨日并未提前发酵，因此能快速带动跟随板块先行调整、龙头高位震荡维持趋势，往往是二波行情的先兆形态。
  interpretation: 弱转强的鉴别框架：有助攻（板块未提前发酵+充分调整）的二波先兆 vs 无助攻的明牌博弈。农业若走出二波将强化'防御占优'格局。这是方法论级claim：龙头带动+板块助攻=二波行情先兆形态。
