  subject: 调整第14天，4032点趋势位是短期关键，4000点上方有承接
  timeframe: short-term
  statement: 日线顶部结构已成，今日为调整第14个交易日。短期只需盯住趋势位4032点是否破位即可。上证4000点上方近几日明显有承接，昨日百股涨停但指数仍跌，说明机构股以外的多数个股已不愿再跌，市场出现止跌企稳信号
  evidence_quote: 日线顶部结构已成，今日为调整第14个交易日。短期只需盯住趋势位4032点是否破位即可。上证4000点上方近几日明显有承接，结合昨日百股涨停（收盘118家，超过5月任一交易日，年内仅次于1月12日和4月8日）但指数仍跌，说明机构股以外的多数个股已不愿再跌，市场出现止跌企稳信号。
  interpretation: 指数状态判断：①调整第14天，时间窗口延续；②4032点是趋势破位参考位，与昨日早盘claim-20260601-001-a一致；③4000点上方有承接——这是新增信息，说明下方支撑有效；④百股涨停（118家）但指数跌——结构性特征：机构股弱、非机构股强；⑤止跌企稳信号来自非机构股的抵抗，不是全面反转。短期偏谨慎但不再悲观。
