  subject: 市场回报与生命耗费的权衡
  timeframe: permanent
  statement: 即使纯技术交易能在市场中获得一定回报，这种回报也是以生命的耗费为代价的，无论多大的回报都抵不上生命的耗费。
  evidence_quote: 最近即使能在市场中得到一定的回报，但这种回报是以生命的耗费为代价的。无论多大的回报，都抵不上生命的耗费。生命，只有生命才能回报，生命是用来参透生命，而不是为了生不带来、死不带走的所谓回报。
  interpretation: 缠论对交易价值观的底线判断：把生命消耗在纯逐利上是亏本买卖，交易必须服务于生命本身而非相反，这是评估交易是否值得做的根本尺度。
