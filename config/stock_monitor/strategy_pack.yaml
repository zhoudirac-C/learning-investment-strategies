      - CPO交换机/ODM：工业富联1成
      - FPC/PCB全球龙头：东山精密1成
      - 绿色铝出口：云铝股份1成
      note: 共振修复初期，普涨共振格局下反弹预期需降低。控制仓位，只参与有产业逻辑支撑、地位与卡位明确的龙头。不追高，等分歧后缩量回踩。明日观察资金能否聚焦某一分支。裕太微高弹性0.5成，需等充分调整。
    full_position:
      action: 降仓至3成以内
      note: 普涨共振下高度不足，反弹预期降低。增厚安全垫，等强共振确认后再加仓。
