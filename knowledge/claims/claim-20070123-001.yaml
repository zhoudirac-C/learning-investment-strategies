  subject: 背驰回跌力度的级别判断
  topic: 背驰引发的回跌力度取决于所在级别与位置，不能一看背驰就抛
  statement: 对背驰的回跌力度必须多级别综合考察：如果日线上还在上涨中段刚开始，MACD刚创新高、红柱子伸长力度强劲，此时5分钟背驰的下跌力度必然不大，只能打点短差甚至可以不管；而在日线走势的最后阶段特别是上涨延伸阶段，一个1分钟的背驰足以引发暴跌。规律上，趋势中产生的背驰一定至少回跌到B段中，可以预先知道至少的跌幅；盘整背驰出来并不一定都要大幅下跌，否则就不会有第三类买点构成的情况。绝对不能一看背驰就抛等跌50%。
  evidence_quote: 对背驰的回跌力度，和级别很有关系……而在日线走势的最后阶段，特别是上涨的延伸阶段，一个1 分钟的背驰足以引发暴跌，所以这一点必须多级别地综合来考察，绝对不能一看背驰就抛等跌50%，世界上哪里有这样的事情……注意，盘整背驰出来，并不一定都要大幅下跌，否则怎么会有第三类买点构成的情况。而趋势中产生的背驰，一定至少回跌到B 段中，这就可以预先知道至少的跌幅。
  interpretation: 给出背驰操作的剂量原则：背驰本身不是卖出的充分条件，所处位置（中段还是末段）与级别决定回跌量级。趋势背驰的至少回跌目标位是B段，可事先量化；盘整背驰则可能只是中枢震荡的一部分，其后还可能转化为第三类买点。
