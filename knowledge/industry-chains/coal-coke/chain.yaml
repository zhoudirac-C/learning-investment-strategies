- metric: 煤炭月度进口量（同比）
  current: 26年8月同比小幅回落，增量存在不确定性
  signal_direction: 进口持续回落=供给收缩加强；进口回升=削弱国内提价逻辑
falsification:
- 焦炭提涨受阻或钢厂联合抵制连续2轮
- 煤炭PPI转负
- 大盘系统性破位下行
- 煤炭板块核心标的（潞安/晋控）放量滞涨、联动失效
- 焦煤期货连续大幅下跌（如5日累计跌超8%）且现货提涨停滞，视为领先证伪信号
- 出现主流研报/政策明确指向煤炭消费总量达峰且需求侧数据同步走弱，视为中长期需求逻辑证伪信号
