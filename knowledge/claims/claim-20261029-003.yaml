subject: 算力硬件与半导体：大票更强，容量品种与趋势股受青睐
statement: 资金更多聚焦容量品种和趋势股，科技情绪票表现相对一般（粤芯半导体、澳弘电子涨幅不突出，中晶科技炸板回落）。风格切换需要大票继续放量上行、回踩有承接，同时情绪票反复冲高回落。
evidence_quote: 午后指数能够维持强势震荡，主要依赖算力硬件及芯片、半导体。与此前一些反弹不同，资金更多聚焦容量品种和趋势股，科技情绪票表现相对一般：粤芯半导体、澳弘电子等高辨识度个股涨幅不算突出，竞价获得抢筹的中晶科技也炸板回落。
interpretation: UP 观察到资金从情绪票向容量品种迁移的结构性差异，并将其视为风格切换的观察信号而非已完成的结论；强调仍需按既有主线框架观察，不应因一天结构变化全面更换交易逻辑。
