  subject: 中阴阶段的操作选择
  topic: 中阴结束后方向可反转也可延续，技术好做中枢震荡，技术不好等市场选择
  statement: 中阴阶段结束后不一定就是真正的反转，也可以继续延续前一走势类型的方向，上涨+盘整+上涨的结构完全合理，上涨+盘整+下跌、上涨+下跌同样是可能的选择。这时候唯一正确的操作只有一点：技术好的，就在这个大的中枢震荡中做中枢震荡操作；技术不好的，就拿着小板凳看戏，看它最后是升天还是下地狱，等市场自己去选择，然后再决定操作。
  evidence_quote: 中阴阶段结束后，不一定就是真正的反转，也可以是继续延续前一走势类型的方向，例如上涨+盘整+上涨，这样的结构是完全合理的……这时候，唯一正确的操作，只有一点：如果你技术好的，就在这个大的中枢震荡中中枢震荡操作一把，如果技术不好的，就拿着小板凳看戏，看它最后是升天还是下地狱，等市场自己去选择，然后再决定操作。
  interpretation: 这条规则的价值在于取消预测冲动：中阴阶段方向不预设、不押注，按自身技术水平选择参与震荡或观望等确认，与第89课中阴阶段关系到操作节奏衔接的说法互为补充。
