  subject: AI红利分配不均，准备度决定赢家
  timeframe: industry
  statement: AI红利不会平均分配，中国、美国、新加坡、北欧、阿联酋属于准备充分第一档，低准备度新兴市场会被进一步拉开差距。学界与业界对AI生产率提升分歧极大，目前数据无法证伪
  evidence_quote: "AI红利不会平均分配，一国准备度由四个要素决定：数字算力基础设施、创新转化系统、人才储备、政策驱动。中国、美国、新加坡、北欧、阿联酋属于准备充分第一档。阿西莫格鲁认为未来10年总提升仅0.66%，高盛认为生成式AI10年可推高全球GDP约7%。目前数据无法证伪，AI已经出现白领岗位替代、薪酬增速放缓的现象，需保持冷静观望。"
  interpretation: AI准备度四要素框架（基础设施+创新系统+人才+政策）可用于评估国家/企业的AI受益程度。当前处于AI和机器人时代的交界点，若人形机器人加核能落地，全要素生产率年提升有望达到7%以上。但普通人难以分享红利，财富效应快速向头部集中。
