    statement: 国家数据局发布《关于推进行业高质量数据集建设行动的实施方案》，被称为国家层面首次对数据赋能AI发展的系统性部署，围绕高质量数据集供给、流通、应用部署六大专项行动，聚焦智能体、具身智能、世界模型等方向。国泰海通分析师认为数据要素制度逐渐形成闭环，2026年价值释放有望加速。公司线索：风语筑(603466，1300+座展馆数字模型数据库)、软通动力(301236，数据工程化、数据要素咨询服务)
