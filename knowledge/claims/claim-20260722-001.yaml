  subject: 韩国市场120分钟底结构-外围解决不跌不解决增量
  timeframe: short-term
  statement: 韩国市场出现120分钟级别底部结构，短期止跌概率较大。外围止跌解决的是不再被拖累的问题，解决不了有没有增量的问题。外盘企稳直接当成A股趋势反转的证据是位置判断上的偷懒。
  evidence_quote: 韩国市场出现了120分钟级别的底部结构，短期止跌的概率较大。这一点对A股的意义，主要在开盘定价环节——外盘的传导只反映在开盘的那一下，开盘之后市场仍然回归自身节奏。外围止跌解决的是不再被拖累的问题，解决不了有没有增量的问题。把外盘企稳直接当成A股趋势反转的证据，是位置判断上的偷懒。
  interpretation: UP明确区分外围止跌的两个层面：解决被拖累（防守端）vs解决增量（进攻端）。韩国企稳只能说明A股不再有外部下杀压力，不能作为A股反转的独立理由。这是对散户将外盘企稳与A股反转划等号的一种纠正。
