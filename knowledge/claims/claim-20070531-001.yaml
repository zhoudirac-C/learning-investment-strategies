  subject: 不熟练者的仓位纪律
  topic: 不熟练的投资者不能全仓操作，基本仓位拿中长线股票，卖点是涨出来的不是追杀出来的
  statement: 不熟练的投资者一定不能全仓进行操作，基本的仓位应该拿着中长线的股票，部分仓位可以用来练习，否则全仓操作一旦来几次半生不熟的折腾，到时候连本都没了。卖点是在涨的时候出现的，不是追杀出来的，砍了地板价就一定不是在卖点上。只要是赚钱的就没有卖错，宁愿卖早不要卖晚；如果卖错了就不看这股票，除非有新的买点。
  evidence_quote: 必须要再次强调，不熟练的投资者，一定不能全仓进行操作，基本的仓位应该拿着中长线的股票，部分仓位可以用来练习……卖点是在涨的时候出现的，不是追杀出来的，如果你砍了地板价，那一定不是在卖点上。只要是赚钱的，就没有卖错，宁愿卖早，不要卖晚。如果卖错了，就不看这股票，除非有新的买点。
  interpretation: 这是练习期的风控框架：用仓位结构隔离学习成本，中长线底仓保证生存，小仓位练手。宁愿卖早与第54课卖点宁愿按小级别来的纪律一致。
