  subject: 盘整背驰判断
  topic: 盘整中C段面积小于A段必回跌，上破中枢后背驰先出来再分两种情况处理
  statement: 盘整中利用类似背驰的判断方法也有很好效果，称为盘整背驰判断。以盘整中往上的情况为例（往下反之亦然）：如果C段不破中枢，一旦出现MACD柱子的C段面积小于A段面积，其后必定有回跌。比较复杂的是C段上破中枢但MACD柱子面积小于A段的情况，原则是先出来，其后分两种：如果回跌不重新跌回中枢，就在次级别的第一类买点回补，刚好构成该级别的第三类买点；反之（回跌跌回中枢）就继续该盘整。盘整背驰一般在盘整中弄短差时用到；无论背驰与盘整背驰，只要满足相应标准，其技术上都是绝对的，问题不在技术准确性而在操作者判断的准确性。
  evidence_quote: 如果C 段不破中枢，一旦出现MACD 柱子的C 段面积小于A 段面积，其后必定有回跌。比较复杂的是如果C 段上破中枢，但MACD 柱子的面积小于A 段的，这时候的原则是先出来，其后有两种情况，如果回跌不重新跌回，就在次级别的第一类买点回补，刚好这反而构成该级别的第三类买点，反之就继续该盘整。
  interpretation: 盘整背驰是标准背驰向盘整场景的推广，处理流程是决策树：先离场，再按回跌是否重返中枢分别回补或观望，其中不重返中枢的情形恰好衔接第三类买点。课中万科15分钟图与上海大盘5分钟图为2006-2007年历史案例。
