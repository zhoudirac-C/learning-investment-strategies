  subject: 实用级别划分的近似性质
  timeframe: permanent
  statement: 严格按定义操作须从最低级别逐级确认，太麻烦也没多大意义，因此才有1、5、15、30、60分钟及日、周、月、季、年的级别分类；三个连续1分钟走势类型的重叠构成5分钟中枢、三个连续5分钟走势类型的重叠构成15或30分钟中枢这类说法不大严格，但在实际操作上不会产生任何原则性的问题。
  evidence_quote: 但如果按严格定义操作，必须从最低级别开始逐步确认其级别，太麻烦也没多大意义，所以才有了后面1、5、15、30、60 分钟，日、周、月、季、年的级别分类。在这种情况下，就可以不大严格地说，三个连续1
    分钟走势类型的重叠构成5 分钟的中枢，三个连续5 分钟走势类型的重叠构成15 或30 分钟的中枢等话。在实际操作上，这种不大严格的说法不会产生任何原则性的问题，而且很方便，所以就用了，对此，必须再次明确。
  interpretation: 常用的K线周期级别只是严格递归定义的工程近似，作者明确承认其不严格性但保证其无害性。实操中用1分钟、5分钟等周期图近似代替逐级递推是缠论允许的，但使用者须知这是近似而非定义本身。
