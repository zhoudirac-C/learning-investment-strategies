  subject: 顶级刺透与乌云信号的组合特征
  timeframe: permanent
  statement: 最顶级的刺透或乌云信号需同时满足：前期趋势充分（约15个交易日以上）、刺入或覆盖比例达70%以上、第二根放量、出现在关键位置、且第一根本身是趋势末端的标志性K线；五项叠加时信号强度最高。
  evidence_quote: 最顶级的那种刺透或者是乌云的信号，那么一般就要满足前期趋势充分，也就是至也就是差不多有十五个交易日或以上，好吧？那么刺透和盖住能够在百分之七十以上，且第二根放放量出现在关键位置，那么前一根本身呢就是趋势末端的标志性K线，那么这种信号就非常的强烈了。
  interpretation: 这是「5个条件同时成立」的合成标准，可用于把日常形态分成三档：仅满足必要条件（观察）、满足A级比例（可试仓）、五项齐备（重点仓位）。
