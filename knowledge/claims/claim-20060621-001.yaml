  subject: 看和干原则
  topic: 机会是看到的不是想到的，相信眼睛不要相信脑筋
  statement: 市场机会不是分析而得、不是你所想到的，而是你看到的。相信你的眼睛，不要相信你的脑筋，更不要让你的脑筋动了你的眼睛：被脑筋所动的眼睛充满成见，而所有成见都不过对应着把你引向最终陷阱的诱饵。好猎手的功夫是置于其地的直觉，只观察、只操作，无所谓分析，只是看和干。
  evidence_quote: 猎手只关心猎物，猎物不是分析而得的。猎物不是你所想到的，而是你看到的。相信你的眼睛，不要相信你的脑筋，更不要让你的脑筋动了你的眼睛。被脑筋所动的眼睛充满了成见，而所有的成见都不过对应着把你引向那最终陷阱的诱饵……这里无所谓分析，只是看和干！
  interpretation: 操作含义：以走势实际呈现的信号为唯一依据，不用预设观点裁剪走势。与第10课"恶之必察焉，好之必察焉"的"察"互为表里，也是第12课"只在买点出现时介入，其他一律没兴趣"的态度基础。
