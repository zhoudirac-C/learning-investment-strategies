- claim_type: market-cycle
  subject: 3764点收盘确认与破位钝化结构三阶段分离
  timeframe: short-term
  statement: 上证3764点是本轮预案的技术观察参考位，判断要看收盘而非盘中短暂跌破；跌破点位、出现钝化和结构完成是三个不同阶段，不能提前合并成买入信号。若收盘低于3764点，需核对动量指标是否出现底背离雏形；没有日线钝化时，即使有分时反弹也先按较小级别修复观察。
  evidence_quote: 这个位置是本轮预案沿用的技术观察参考位，判断时要看收盘，而不是盘中短暂跌破。……跌破点位、出现钝化和结构完成，是三个不同阶段，不能提前合并成买入信号。……若没有形成日线钝化，即使出现分时反弹，也先按较小级别修复观察。
  interpretation: 关键价位操作纪律：收盘确认口径 + 三阶段（破位→钝化→结构）分离，禁止把技术信号链条压缩成一次性买入触发；无日线钝化时分时反弹降级处理。
