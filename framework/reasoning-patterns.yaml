- pattern_id: supply_shock_chain_analysis
  name: 供给冲击传导链分析
  description: 从突发事件导致供给缺口出发，沿产业链上下游推导受益环节和标的
  applicable_themes:
  - 地缘冲突
  - 自然灾害
  - 政策限产
  - 航运中断
  reasoning_chain:
  - step: 1
    name: 识别供给冲击事件
    question: 发生了什么突发事件导致供给受限？
    UP_logic: 卡塔尔LNG设施遭袭停产，欧洲气价一度+50%，伊朗化工品全球占比高
    evidence_sources:
    - 新闻事件
    - 商品价格数据
  - step: 2
    name: 锁定直接受益板块
    question: 哪个板块最先受益于供给缺口？
    UP_logic: 油气/天然气/航运逆势涨停潮，洲际油气6天4板，中国石油等批量涨停
    evidence_sources:
    - 板块涨跌幅
    - 龙头股走势
  - step: 3
    name: 推导产业链传导
    question: 供给缺口如何沿产业链向下游传导？
    UP_logic: 全球约50%海运硫磺经霍尔木兹→国内春耕备肥刚需→硫铁矿自给企业双重受益
    evidence_sources:
    - 贸易数据
    - 产业链结构
  - step: 4
    name: 筛选具体受益标的
    question: 哪些公司具备自给或替代能力？
    UP_logic: 粤桂股份：国内硫铁矿龙头，探明储量2.08亿吨，原料完全自给
    evidence_sources:
    - 公司公告
    - 产能数据
  risk_factors:
  - 事件影响消退或快速修复
  - 替代产能快速释放
  - 需求端同步萎缩
  confidence_indicators:
  - 商品价格持续上涨
  - 龙头股连续涨停且封板坚决
  - 机构资金净买入
  source_raw:
  - sources/raw/财经/晚间复盘：26-03-03：冲高4197放量杀跌，日线顶部待确认，4118生命线.md
- pattern_id: power_chain_value_migration
  name: 电源产业链价值迁移推理
  description: 通过英伟达平台电源价值量数据，推导配电/功率器件/电容等环节的受益顺序和标的
  applicable_themes:
  - AI服务器电源产业链
  - 功率器件涨价逻辑
  - 配电设备价值量分析
  reasoning_chain:
  - step: 1
    name: 平台价值量对比
    question: 新一代AI平台相比上一代，电源环节价值量增长多少？
    UP_logic: 对比GB200、GB300、Vera Rubin、Vera Rubin CPX四个平台的电源价值量，发现CPX方案较GB200增长超10倍
    evidence_sources:
    - 英伟达平台规格表
    - 电源价值量数据
  - step: 2
    name: 技术趋势推导
    question: 价值量提升背后的技术变化是什么？
    UP_logic: 价值量大幅提升源于配电架构变化（HVDC独立电源机架、800V直流架构），从而推导出SiC/GaN功率器件受益
    evidence_sources:
    - 技术架构文档
    - 电源走向800V直流架构趋势
  - step: 3
    name: 产业链环节映射
    question: 哪些环节会受益？受益顺序如何？
    UP_logic: 从配电整机（金盘、伊戈尔）→功率器件（扬杰、新洁能）→电容材料（江海、东方钽业）→二次电源（新雷能），按价值量传导顺序排列
    evidence_sources:
    - 产业链图谱
    - 各环节与电源架构的关联度
  - step: 4
    name: 时间节点判断
    question: 受益何时兑现？当前处于什么阶段？
    UP_logic: 根据HVDC与SST需求同步紧张的时间预期（2026年下半年），判断当前5月为预热阶段，不应追高
    evidence_sources:
    - 产业调研时间线
    - 产能挤压节奏
  risk_factors:
  - 英伟达平台升级节奏低于预期
  - 功率器件产能扩张超预期导致涨价落空
  - HVDC方案渗透率不及预期
  confidence_indicators:
  - 多个平台价值量数据一致指向大幅增长
  - 技术趋势（800V直流）已获产业验证
  - 功率器件产能挤压逻辑与半导体复苏周期共振
  source_raw:
  - sources/raw/财经/动态：26-05-27：11点08分补充-电源SST功率器件产业链梳理.md
- pattern_id: sector_mainline_rotation_analysis
  name: 主线板块轮动分析框架
  description: 通过观察主线板块内核心标的主动性、低位补涨、分支扩散及情绪节奏，判断主线持续性与轮动方向
  applicable_themes:
  - AI算力硬件
  - 新能源产业链
  - 半导体设备材料
  - 消费电子
  reasoning_chain:
  - step: 1
    name: 确认主线板块
    question: 当前市场资金最聚焦的板块是什么？
    UP_logic: 通过资金持续聚焦、板块内反复活跃、高低位切换顺畅判断绝对主线，如AI算力硬件
    evidence_sources:
    - 板块成交额占比
    - 涨停家数
    - 资金流向
  - step: 2
    name: 观察核心标的主动性
    question: 板块内领涨核心标的是否主动走强？
    UP_logic: 观察中军（如中际旭创）高位震荡、情绪核心（如东山精密）突破前高，判断主动性是否充足
    evidence_sources:
    - 个股分时走势
    - 涨停板突破情况
    - 量价关系
  - step: 3
    name: 识别低位补涨分支
    question: 板块内哪些细分方向出现补涨？
    UP_logic: 寻找产业增量信息或业绩催化下的低位分支，如电子布受产业逻辑加持、光模块设备受业绩测算催化
    evidence_sources:
    - 产业新闻
    - 业绩预告
    - 板块涨幅排名
  - step: 4
    name: 评估板块梯队完整性
    question: 板块内领涨、中军、补涨标的是否形成完整梯队？
    UP_logic: 核心领涨未主动走弱、低位分支持续补涨、板块梯队完整则主线良性运行
    evidence_sources:
    - 个股涨跌幅分布
    - 板块内涨停梯队
  - step: 5
    name: 判断反弹节奏与风险
    question: 当前处于反弹周期的哪个阶段？后续确定性如何？
    UP_logic: 通过反弹结构（周三启动→周四弱分歧→周五回流）判断阶段，后半程确定性下降，博弈难度提升
    evidence_sources:
    - 市场情绪指标
    - 连板高度
    - 成交量变化
  risk_factors:
  - 核心领涨标的出现主动走弱
  - 板块内高低位切换停滞，补涨分支消失
  - 市场风格短期漂移，资金撤离主线
  confidence_indicators:
  - 核心标的持续创新高或突破前高
  - 低位新分支不断涌现并获得资金认可
  - 板块成交额占比持续提升
  source_raw:
  - sources/raw/财经/午盘：26-04-13：低开回升半日1.41万亿，AI算力硬件绝对主线，电子布最强补涨.md
- pattern_id: sector_internal_rotation_qualify
  name: 板块内部高低切补涨判断
  description: 通过观察板块内领涨股与补涨股的表现差异、联动强度、消息催化力度，判断当前行情是主升延续还是内部高低切补涨。
  applicable_themes:
  - 科技板块
  - 半导体
  - 算力产业链
  - 华为产业链
  reasoning_chain:
  - step: 1
    name: 观察领涨与补涨分化
    question: 板块内核心龙头股与二线补涨股的表现是否一致？
    UP_logic: 核心股（如沪电股份、胜宏科技）小阳线震荡，二线补涨股（景旺电子、深南电路）更强，说明是补涨而非主升。
    evidence_sources:
    - 个股涨跌幅对比
    - 板块内领涨股与跟风股走势
  - step: 2
    name: 评估板块联动强度
    question: 板块上涨是集体联动还是个股独立驱动？
    UP_logic: 很多上涨不是板块集体走强，而是个股叠加了新的产业消息、业绩预期、订单预期或供应链属性，联动性变弱。
    evidence_sources:
    - 板块内涨停数量
    - 个股上涨原因分析
  - step: 3
    name: 对比消息催化力度
    question: 当前消息催化是否强于此前的主线事件？
    UP_logic: 如果华为昇腾、DeepSeek这种级别事件都没带出强联动，其他消息更偏局部补涨，个股难度提高。
    evidence_sources:
    - 事件影响力评估
    - 历史主线事件对比
  risk_factors:
  - 板块内核心龙头出现放量破位下跌
  - 新的更强主线事件出现导致资金分流
  confidence_indicators:
  - 补涨股持续强于领涨股且板块整体放量
  - 低位方向出现新的产业催化或业绩超预期
  source_raw:
