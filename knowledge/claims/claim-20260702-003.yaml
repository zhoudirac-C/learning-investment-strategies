  timeframe: intraday
  statement: UP判断场内结构性抱团情绪明确，尚未到全面情绪冰点——创业板大跌但超3200只个股上涨，说明资金仍在场内积极寻找避风港而非全面撤退。
  evidence_quote: 场内结构性抱团情绪明确，尚未到全面情绪冰点。...全市场超3200只个股逆势上涨...说明资金并非系统性离场，只是针对海外AI映射的高位算力链做避险兑现。
  interpretation: UP对情绪阶段的核心定性：不是冰点（冰点是普跌+缩量+无方向），而是「结构性抱团」——资金离开了一个方向（海外链AI算力），但迅速抱团了另一个方向（国产链+机器人+半导体上游）。这意味着大盘不会持续跌，结构性机会仍然丰富，只是需要选对方向。这个定性对下午操作很重要：不是止损离场，而是换仓方向。
