  evidence_quote: "美国SpaceX是超级公司垂直整合的一家独大模式...中国是战略驱动、应用驱动、举国协同的多方探索模式，依托完整制造业体系形成产业集群"
  interpretation: 这个判断对选股方向有直接影响：UP认为中国商业航天的投资机会不在纯航天企业，而在能够和航天产业资源结合的制造业龙头（跨界延伸逻辑）。这与美股的逻辑完全不同，A股投资者需要区分赛道和标的逻辑。
