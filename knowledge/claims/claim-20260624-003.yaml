  subject: 科技主线业绩增速未明显放缓，AI算力半导体光通信基本面仍有支撑
  timeframe: trend
  statement: 科技主线的业绩增速并没有明显放缓，在AI、算力、半导体、光通信等方向上，基本面仍然有较强支撑。科技产业趋势仍在兑现，这是当前市场的顺风。
  evidence_quote: 但另一边，科技主线的业绩增速并没有明显放缓，甚至在 AI、算力、半导体、光通信等方向上，基本面仍然有较强支撑。
  interpretation: UP在明确宏观逆风的同时，也强调了科技产业的顺风仍在：①AI业绩增速没有减速，这是与6/23'Token增速从23.5%降至4.7%'不同的信号——短期拥挤交易波动不改变中期产业趋势；②算力、半导体、光通信等方向基本面指数明确支撑；③对比6/10早盘中提到的'连续大跌后博弈反弹，半导体设备最强主线'，方向判断一致。这是UP'两种相反观念同时成立'的顺风那一面。
