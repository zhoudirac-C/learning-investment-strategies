  - id: claim-20260608-004-d
    topic: 机构不博弈超跌——小微盘股反弹偏博弈
    statement: 机构资金大概率不会在这个阶段博弈超跌方向。最近的超跌反弹基本是小微盘股借流动性溢价的反弹，性质上偏博弈而非趋势，构成承接短线热钱的次要方向
