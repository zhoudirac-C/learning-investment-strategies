  extracted_at: '2026-07-18'
  subject: 摒弃死多死空思维
  topic: 投资者最大的毛病是只有一种思维方式，把喜好当成市场现实
  statement: 投资者最大的毛病就是只有一种思维方式，把自己的喜好当成了市场的现实：做多的永远做多，做空的永远做空。做多的客观条件是技术上有形成中枢第二段的要求，当第二段出现背弛，做多的客观条件就没有了，继续硬撑就是毛病。更坏的毛病是涨了才高兴、一跌就哭脸，光做多怎么把成本降为0，只有0成本的股票才是真正安全的。牛市是快跌慢涨、熊市是快涨慢跌，这最基本的节奏不应该不知道。
  evidence_quote: 投资者最大的毛病，就是只有一种思维方式，把自己的喜好当成了市场的现实……而当第二段出现背弛，就意味着做多的客观条件没有了，继续硬撑着不是有毛病吗？牛市是快跌慢涨、熊市是快涨慢跌，这最基本的节奏不应该不知道。
  interpretation: 多空不取决于立场而取决于客观条件是否存在，条件的判据就是中枢与背驰。缠论里没有风险这个不可操作的上帝式概念，只有买点、卖点与背驰与否这些有严格定义、可操作的概念，买点买卖点卖就是最合拍的节奏。
