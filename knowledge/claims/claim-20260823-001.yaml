  subject: 滞涨与首阴的本质区别在资金结构
  timeframe: permanent
  statement: 滞涨与首阴表面相似（股价不再连续上涨、高位震荡收阴、次日都有修复预期），但资金结构完全不同：滞涨是上涨动能的提前衰减，首阴是极强趋势中的突然分歧；滞涨后的大阴线是前期弱化信号的集中兑现，有博弈价值的首阴必须出现在此前走势仍流畅、市场合力仍充分的背景下。判断一根阴线能不能低吸，不看是不是第一次大跌，而看阴线出现前股票是否已经连续失去主动性。
  evidence_quote: 但这两者背后的资金结构是完全不同的。滞涨是上涨动能的提前衰减，而首阴是极强趋势当中的突然分歧。滞涨之后出现大阴线，往往是前期弱化信号的一个集中兑现。真正有博弈价值的首阴则应当出现在此前走势仍然流畅、市场合力仍然充分的背景下。
  interpretation: 这是强趋势交易体系的核心概念区分：同样的K线形态（高位阴线）因前置资金结构不同而含义相反，决定低吸博弈是否成立的是阴线前的强度史而非阴线本身。
