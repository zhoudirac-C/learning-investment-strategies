- id: claim-20260609-004-d
  statement: 中美商业航天路径存在根本差异：美国是资本驱动、超级公司垂直整合的一家独大模式；中国是战略驱动、举国协同、多类主体共同推进的多方探索模式。中国依托完整制造业体系形成产业集群，制造业龙头跨界进入航天是核心机会。
  subject: 商业航天-中美路径差异
  claim_type: methodology
