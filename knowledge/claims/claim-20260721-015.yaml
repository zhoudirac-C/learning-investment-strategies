  evidence_quote: 从反弹到转折的三个确认信号。但还是要留一点冷静。若要从反弹升级为转折，需要看到：其一，成交量维持高位，而不是一两天的脉冲；其二，反弹从半导体、创业板扩散到消费、地产链、顺周期和中小盘；其三，政治局会议后有财政工具、政府债发行、政策性金融工具或地产需求端政策落地。三者兑现越多，行情级别越高；若量能快速回落且扩散失败，则仍按超跌反弹对待。
  interpretation: UP提供了从反弹到转折的明确判定框架——三条件缺一不可，且给出了量化的行情级别判断原则（兑现越多级别越高）。该框架适用于当前阶段行情的阶段性评估。核心观测变量是量能的持续性和板块扩散广度，以及政策落地情况。
