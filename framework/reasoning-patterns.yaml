- pattern_id: sentiment_cycle
  name: 市场情绪周期分析框架
  description: 当用户询问市场情绪、短线情绪周期、冰点/高潮判断、修复方向、仓位建议时使用。典型查询：市场情绪如何、是不是冰点、情绪修复买什么、现在几成仓、恐慌盘出来了吗。该框架定位情绪阶段、识别拐点信号、筛选修复方向、制定仓位策略，判断当前处于冰点/修复/高潮/退潮的哪个阶段。
  trigger:
  - 涨停家数、连板高度、成交额同步处于近期（如20日）最低区间（冰点特征）
  - 炸板率（触及涨停未回封家数÷触及涨停总家数）显著抬升
  - 恐慌盘涌出后缩量、核心标的不跌停（左侧拐点特征）
  - 首板增多、连板高度回升、炸板率下降（右侧拐点特征）
