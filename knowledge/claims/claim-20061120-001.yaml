  subject: 能搞分类第一原则
  topic: 按萌动标准把所有股票动态分为能搞与不能搞，只搞能搞的
  statement: 按其是否萌动的标准把所有股票动态地进行分类：一种是可以搞的，一种是不能搞的，将参与的股票严格限制在能搞的范围内。必须坚持：不能搞的无论发生什么情况都不能搞，除非达到某种能搞的标准而自动成为能搞的对象；分类原则一旦确定，就要严格遵守只搞能搞的原则。分类标准可以因人而异：例如250天线以及周线上成交量压力线的突破；资金量不大且短线技术好的，可改用70天线、35天线甚至30分钟图里的相应均线；新股可用上市第一日的最高价作标准。
  evidence_quote: 具体对于股票来说，按其是否萌动的标准把所有股票动态地进行分类，一种是可以搞的，一种是不能搞的，将你参与的股票限制在能搞的范围内，不管任何情况，这是必须遵守的原则……男人只有两种，能搞的和不能搞的；市场也只有两种，能搞的和不能搞的。必须坚持的是，不能搞的就无论发生什么情况都不能搞，除非能达到某种能搞的标准而自动成为能搞的对象……一旦被搞的分类原则确定，就一定要严格遵守"只搞能搞的"原则。
  interpretation: 缠论交易体系的第一块基石：先分类、后操作，参与范围由客观标准而非喜好划定。第9课给出"单一分类程序为何不够"的数学证明，第11至12课的均线体位分类是其技术实现。绝大多数人的失败不是标准不好，而是知道标准却不能遵守。
