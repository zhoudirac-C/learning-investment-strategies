  subject: 涨停逻辑结构性反转：从涨停启动到趋势启动
  timeframe: trend
  statement: 过去涨停是因、趋势是果；现在趋势是因、涨停是果。真正的启动来自趋势本身：个股先沿趋势走出辨识度，等位置、板块、情绪到位后连板才出现，涨停不再是剧本开头而是趋势加速段的高潮确认。金安国纪(002636)、光华科技(002741)、诺德股份(600110)、旭光电子(600353)均为此路径。
  evidence_quote: 过去的连板，一个涨停打出来，本身就可以视为启动信号。资金围绕涨停展开接力，随后按「启动—发酵—高潮」的路径自己演绎。也就是说，涨停是因，趋势是果。现在逻辑反过来了。真正的启动，往往来自趋势本身：要么处在主线里，要么至少沾边主线；个股先沿着趋势走出辨识度，等位置、板块、情绪都到位之后，连板才开始出现。此时涨停已经不再是剧本开头，更像是趋势走到加速段后的「高潮确认」。
  interpretation: A股连板生态已发生结构性变化，传统的涨停驱动趋势模式转为趋势孕育涨停。评估连板需先看趋势结构+主线位置，涨停仅作为加速确认信号而非独立启动信号。
