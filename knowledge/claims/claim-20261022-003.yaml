  statement: 市场流传的离岸信托持股敞口是账面总市值（潜在应税敞口上限），并非最终应缴税款；实际计税时可扣除股权原始成本、架构搭建的合理费用以及境外已缴个税，最终实际补缴规模会显著低于敞口数值，且不同信托的设立时间、架构设计、装入节点不同，实际适用追缴范围存在个体差异，最终影响存在不确定性。
  evidence_quote: 上述1400亿美元为信托持股的账面总市值（潜在应税敞口上限），并非最终应缴税款。实际计税时可扣除股权原始成本、架构搭建的合理费用，以及在境外已缴纳的个人所得税税款，最终实际补缴规模会显著低于敞口数值；同时不同信托的设立时间、架构设计、装入节点不同，实际适用的追缴范围也存在差异，最终影响存在个体不确定性。
  interpretation: UP 明确提醒敞口口径不等于缴税口径：账面市值是上限，实际有成本扣除、境外抵免与个体差异三层折扣。这是对「用单一汇总数字判断冲击」的纠偏——汇总数字只能排序，不能定价。
