  subject: 中枢复杂程度的心理意义
  topic: 中枢越简单证明一方力量越强大，超复杂中枢后走势经常反复，相邻两中枢形态常不同
  statement: 中枢其实就是买卖双方反复较量的过程，中枢越简单，证明其中一方的力量越强大；中枢的复杂程度是考察市场最终动向的一个很重要的依据，一个超复杂的中枢过后，就算一方赢了，其后的走势也是经常反复不断的。在同一趋势中，相邻两中枢的复杂程度、形态经常有所区别，因为人都有提前量，而提前量经常就是找最近的模本去抄袭，这样等于在买卖的合力中都加了一个提前的变量，从而造成整个结构的变化；所谓不会二次跨进同一条河流，这本质上由人的贪嗔痴疑慢造成。
  evidence_quote: 中枢，其实就是买卖双方反复较量的过程，中枢越简单，证明其中一方的力量越强大。中枢的复杂程度，是考察市场最终动向的一个很重要的依据。一个超复杂的中枢过后，就算一方赢了，其后的走势也是经常反复不断的。……在同一趋势中，相邻两中枢的复杂程度、形态，经常有所区别。为什么？人都有提前量，而提前量，经常就是找最近的模本去抄袭，这样，等于在买卖的合力中，都加了一个提前的变量，从而造成整个结构的变化。
  interpretation: 这为读图提供了一个补充维度：除了位置与级别，中枢的复杂程度本身携带力量对比信息。模本抄袭导致的形态变异，解释了为何同一趋势中两个相邻中枢不会简单重复。
