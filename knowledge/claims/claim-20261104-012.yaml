subject: 高股息避险抱团叙事
timeframe: short-term
statement: 当市场叙事切换到高股息避险抱团时，即使股息率只有3%，资金也会继续抱团；此时高股息不再像高股息，而是赚差价的机会，要牢牢把握。
evidence_quote: 「所以说当市场叙事没有叙事到避险，没有叙事到高股息的时候，遍地五百分之六、百分之七的高股息多得很，但是人们不喜欢。当叙事一旦叙事到这个高股息避险抱团之后，对吧？你要见尾盘还是有的，因为还是很多资金不相信今天起来了，还是会继续避险的。你看百分之三的股息率也会继续给你抱团。」
interpretation: 作者指出高股息的市场表现受叙事驱动，避险情绪高涨时即使低股息率也会被资金抱团，这构成差价获利机会。
