subject: 超跌反弹轮动主攻假设与兑现观察区
timeframe: short-term
statement: 未来一个月的主攻假设：超跌反弹轮动。先看谁跌得深，再看谁能率先止跌、获得承接与回流。跌得多意味着潜在弹性更大，但不能只按跌幅排名，还要排除基本面持续恶化与流动性不足的品种。某一方向反弹时间接近此前下跌时间的一半，或价格修复接近此前下跌空间的一半时，就进入兑现与切换观察区。时间与空间任一项先满足，都可以开始审视性价比；这是一条节奏参考，不是必须精确兑现的市场规律。
evidence_quote: 未来一个月的主攻假设：超跌反弹轮动情绪尚未被真正点燃，我更倾向于把接下来一个月的主要机会定义为超跌反弹轮动：先看谁跌得深，再看谁能率先止跌、获得承接与回流。跌得多意味着潜在弹性更大，但不能只按跌幅排名，还要排除基本面持续恶化与流动性不足的品种。在我的交易框架中，某一方向反弹时间接近此前下跌时间的一半，或价格修复接近此前下跌空间的一半时，就进入兑现与切换观察区。时间与空间任一项先满足，都可以开始审视性价比；这是一条节奏参考，不是必须精确兑现的市场规律。
interpretation: UP把未来一个月的主要机会定义为超跌反弹轮动，给出选股判据（跌得深+率先止跌承接回流、排除基本面恶化与流动性不足）和兑现观察区（时间或空间修复接近下跌一半），明确这是节奏参考而非必然规律。
