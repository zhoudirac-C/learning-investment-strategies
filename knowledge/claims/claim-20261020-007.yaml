  evidence_quote: 为什么龙哥经常能在市场哀鸿遍野的时候精准抄底，不是因为他们能看到你的后台，也不是有大数据锁定市场的风向，而是只要市场大跌踩踏恐慌过后愣神的那几分钟，当你的短线精灵跳的异常慢的时候，人家只需要用可能100亿的资金就能干以前1000亿资金才能达到的效果。
  interpretation: 鳄鱼派拆解护盘资金『精准抄底』的真实机制：不是信息优势，而是『恐慌踩踏后的流动性真空期』资金效率最高——恐慌过后卖盘暂时枯竭，同样资金量能撬动更大涨幅。这解释了为什么护盘总在最恐慌时点出手。
